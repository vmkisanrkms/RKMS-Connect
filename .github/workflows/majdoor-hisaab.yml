name: MAJDOOR HISAAB PRO — V104 FINAL RELEASE

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  GRADLE_VERSION: 8.11.1
  ANDROID_API: 36
  BUILD_TOOLS: 36.0.0
  PACKAGE_NAME: com.majdoor.hisaab
  VERSION_CODE: 77
  VERSION_NAME: 1.77.0

jobs:

  build-test-sign-runtime:

    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. LOCATE V104 ZIP
      # ============================================================

      - name: Locate Majdoor Hisaab V104 ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "LOCATING MAJDOOR HISAAB V104 ZIP"
          echo "=============================================="

          ZIP=""

          if [ -f "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104.zip" ]; then
            ZIP="Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104.zip"
          else
            ZIP="$(find . -maxdepth 3 -type f \
              \( \
                -iname '*Majdoor*Hisaab*V104*.zip' \
                -o \
                -iname '*Majdoor*Hisaab*BLUEPRINT*.zip' \
              \) \
              -print -quit)"
          fi

          if [ -z "${ZIP}" ]; then
            echo "ERROR: Majdoor Hisaab V104 ZIP was not found."
            echo
            echo "GitHub repository currently contains:"
            find . -maxdepth 2 -type f -print | sort | head -200
            echo
            echo "Upload the V104 ZIP to the repository first."
            exit 1
          fi

          echo "FOUND ZIP:"
          echo "${ZIP}"

          mkdir -p "${RUNNER_TEMP}/majdoor-v104"

          cp \
            "${ZIP}" \
            "${RUNNER_TEMP}/majdoor-v104/project.zip"

          test -s \
            "${RUNNER_TEMP}/majdoor-v104/project.zip"

          echo "V104 ZIP=FOUND"

      # ============================================================
      # 3. EXTRACT V104 PROJECT
      # ============================================================

      - name: Extract V104 project
        shell: bash
        run: |
          set -Eeuo pipefail

          SOURCE="${RUNNER_TEMP}/majdoor-v104/project.zip"
          EXTRACT="${RUNNER_TEMP}/majdoor-v104/extracted"

          rm -rf "${EXTRACT}"

          mkdir -p "${EXTRACT}"

          unzip -q \
            "${SOURCE}" \
            -d "${EXTRACT}"

          echo "ZIP CONTENTS:"
          find "${EXTRACT}" -maxdepth 3 -type f \
            | sort \
            | head -300

          echo "ZIP EXTRACTION=PASS"

      # ============================================================
      # 4. FIND ACTUAL ANDROID PROJECT ROOT
      # ============================================================

      - name: Detect V104 Android project root
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT="${RUNNER_TEMP}/majdoor-v104/extracted"

          PROJECT_ROOT=""

          while IFS= read -r SETTINGS; do

            DIR="$(dirname "${SETTINGS}")"

            if [ \
              -f "${DIR}/build.gradle.kts" ] &&
              [ -f "${DIR}/app/build.gradle.kts" ] &&
              [ -f "${DIR}/gradlew" ] &&
              [ -f "${DIR}/gradle/wrapper/gradle-wrapper.jar" ] &&
              [ -f "${DIR}/gradle/wrapper/gradle-wrapper.properties" ]
            ]; then

              PROJECT_ROOT="${DIR}"
              break

            fi

          done < <(
            find "${EXTRACT}" \
              -type f \
              -name "settings.gradle.kts" \
              -print
          )

          if [ -z "${PROJECT_ROOT}" ]; then
            echo "ERROR: Complete V104 Android project was not found inside ZIP."

            echo
            echo "Detected settings files:"
            find "${EXTRACT}" \
              -type f \
              -name "settings.gradle.kts" \
              -print

            echo
            echo "Detected Gradle wrappers:"
            find "${EXTRACT}" \
              -type f \
              -name "gradlew" \
              -print

            exit 1
          fi

          echo "PROJECT_ROOT=${PROJECT_ROOT}"

          echo "${PROJECT_ROOT}" \
            > "${RUNNER_TEMP}/majdoor-v104/project-root.txt"

          echo "ANDROID PROJECT ROOT=PASS"

      # ============================================================
      # 5. COPY PROJECT TO WORKSPACE
      # ============================================================

      - name: Prepare Android project workspace
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT_ROOT="$(
            cat "${RUNNER_TEMP}/majdoor-v104/project-root.txt"
          )"

          echo "Using:"
          echo "${PROJECT_ROOT}"

          # Preserve .git and workflow directory.
          # Replace only working project contents.

          cp -a \
            "${PROJECT_ROOT}/." \
            "${GITHUB_WORKSPACE}/"

          cd "${GITHUB_WORKSPACE}"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties

          chmod +x ./gradlew

          echo "PROJECT WORKSPACE=PASS"

      # ============================================================
      # 6. VERIFY V104 CONFIGURATION
      # ============================================================

      - name: Verify V104 project configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}"

          grep -q \
            'versionCode = 77' \
            app/build.gradle.kts

          grep -q \
            'versionName = "1.77.0"' \
            app/build.gradle.kts

          grep -q \
            'namespace = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -q \
            'applicationId = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -q \
            'compileSdk = 36' \
            app/build.gradle.kts

          grep -q \
            'targetSdk = 36' \
            app/build.gradle.kts

          grep -q \
            'minSdk = 26' \
            app/build.gradle.kts

          grep -q \
            'gradle-8.11.1-bin.zip' \
            gradle/wrapper/gradle-wrapper.properties

          echo "V104 CONFIGURATION=PASS"

      # ============================================================
      # 7. CLEAN RUNNER
      # ============================================================

      - name: Confirm clean GitHub-hosted runner
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "${GITHUB_RUN_ID}"

          echo "CLEAN RUNNER=PASS"

      # ============================================================
      # 8. JAVA 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 9. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # ============================================================
      # 10. INSTALL ANDROID API 36
      # ============================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "ANDROID SDK=PASS"

      # ============================================================
      # 11. VERIFY EXISTING GRADLE WRAPPER
      # ============================================================

      - name: Verify repository Gradle Wrapper
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}"

          test -f gradlew
          test -f gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties

          chmod +x ./gradlew

          ./gradlew --version

          ./gradlew --version \
            | grep -F "Gradle ${GRADLE_VERSION}"

          echo "GRADLE WRAPPER=PASS"

      # ============================================================
      # 12. ACCEPTANCE GATES
      # ============================================================

      - name: Run acceptance gates
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}"

          chmod +x ./gradlew
          chmod +x scripts/*.sh

          ./scripts/acceptance-gates.sh

      # ============================================================
      # 13. BUILD
      # ============================================================

      - name: Build project
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}"

          trap '
            echo "BUILD FAILED AT LINE $LINENO"
          ' ERR

          chmod +x ./gradlew
          chmod +x scripts/*.sh

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencies \
            --configuration debugRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencies \
            --configuration debugUnitTestRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencies \
            --configuration e2eReleaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencies \
            --configuration releaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            buildEnvironment

          ./scripts/dependency-health.sh

          ./scripts/phase17-real-android-runtime-gate.sh

          ./scripts/phase18-configuration-lifecycle-gate.sh

          ./scripts/phase19-offline-first-gate.sh

          ./scripts/phase20-security-data-gate.sh

          ./gradlew \
            --no-daemon \
            --stacktrace \
            test \
            compileDebugKotlin \
            assembleDebug \
            compileE2eReleaseKotlin \
            assembleE2eRelease \
            compileReleaseKotlin \
            assembleRelease \
            assembleReleaseAndroidTest

          ./scripts/release-build-gate.sh

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "${DEBUG_APK}"

          apkanalyzer manifest application-id \
            "${DEBUG_APK}" \
            | grep -Fx "${PACKAGE_NAME}"

          apkanalyzer manifest version-name \
            "${DEBUG_APK}" \
            | grep -Fx "${VERSION_NAME}"

          apkanalyzer manifest version-code \
            "${DEBUG_APK}" \
            | grep -Fx "${VERSION_CODE}"

          mkdir -p artifacts/debug

          cp \
            "${DEBUG_APK}" \
            artifacts/debug/Majdoor-Hisaab-PRO-debug.apk

          sha256sum \
            "${DEBUG_APK}" \
            > artifacts/debug/Majdoor-Hisaab-PRO-debug.sha256

          echo "DEBUG BUILD=PASS"

      # ============================================================
      # 14. DEBUG RUNTIME
      # ============================================================

      - name: Install and launch Debug APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            adb install -r \
              "${GITHUB_WORKSPACE}/app/build/outputs/apk/debug/app-debug.apk"

            adb shell am force-stop "${PACKAGE_NAME}"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity"

            sleep 2

            adb shell pidof "${PACKAGE_NAME}" \
              | grep -Eq '[0-9]+'

            adb logcat -d -t 10000 \
              > artifacts/debug/debug-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/debug/debug-logcat.txt; then
              exit 1
            fi

            echo "DEBUG RUNTIME=PASS"

      # ============================================================
      # 15. ROTATION / E2E
      # ============================================================

      - name: Run real Android E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest

      # ============================================================
      # 16. CLEAN INSTALL BACKUP RESTORE
      # ============================================================

      - name: Run clean install backup restore E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.CleanInstallBackupRestoreE2ETest

      # ============================================================
      # 17. PHASE 22
      # ============================================================

      - name: Run Phase 22 final red-list E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./scripts/phase22-final-red-list-gate.sh

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.Phase22FinalRedListE2ETest

      # ============================================================
      # 18. VERIFY UNSIGNED RELEASE
      # ============================================================

      - name: Verify unsigned Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "${APK}"

          apkanalyzer manifest application-id \
            "${APK}" \
            | grep -Fx "${PACKAGE_NAME}"

          apkanalyzer manifest version-name \
            "${APK}" \
            | grep -Fx "${VERSION_NAME}"

          apkanalyzer manifest version-code \
            "${APK}" \
            | grep -Fx "${VERSION_CODE}"

          mkdir -p artifacts

          cp \
            "${APK}" \
            artifacts/app-release-unsigned.apk

          echo "UNSIGNED RELEASE=PASS"

      # ============================================================
      # 19. RESTORE SIGNING KEY
      # ============================================================

      - name: Restore production signing key
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash

        run: |
          set -Eeuo pipefail

          test -n "${KEYSTORE_B64}"
          test -n "${KEYSTORE_PASSWORD}"
          test -n "${KEY_PASSWORD}"
          test -n "${KEY_ALIAS}"
          test -n "${EXPECTED_CERT}"

          printf '%s' "${KEYSTORE_B64}" \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

          keytool -list -v \
            -keystore release.keystore \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" \
            > cert.txt

          ACTUAL_CERT=$(
            awk -F': ' \
              '/SHA256:/{print $2; exit}' \
              cert.txt |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )

          EXPECTED_CERT_NORMALIZED=$(
            printf '%s' "${EXPECTED_CERT}" |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )

          test "${ACTUAL_CERT}" = "${EXPECTED_CERT_NORMALIZED}"

          echo "SIGNING CERTIFICATE=PASS"

      # ============================================================
      # 20. SIGN BOTH APKs
      # ============================================================

      - name: Zipalign and sign Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash

        run: |
          set -Eeuo pipefail

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "${UNSIGNED}"
          test -s release.keystore

          zipalign -f -p 4 \
            "${UNSIGNED}" \
            "${ALIGNED}"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "${SIGNED}" \
            "${ALIGNED}"

          apksigner verify \
            --verbose \
            --print-certs \
            "${SIGNED}"

          # --------------------------------------------------------
          # AndroidTest APK
          # --------------------------------------------------------

          TEST_UNSIGNED="app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          TEST_ALIGNED="app/build/outputs/apk/androidTest/release/app-release-androidTest-aligned.apk"
          TEST_SIGNED="artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

          test -s "${TEST_UNSIGNED}"

          zipalign -f -p 4 \
            "${TEST_UNSIGNED}" \
            "${TEST_ALIGNED}"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "${TEST_SIGNED}" \
            "${TEST_ALIGNED}"

          apksigner verify \
            --verbose \
            --print-certs \
            "${TEST_SIGNED}"

          # Cleanup AFTER both signatures.
          rm -f release.keystore
          rm -f cert.txt
          rm -f "${ALIGNED}"
          rm -f "${TEST_ALIGNED}"

          echo "APK SIGNING=PASS"

      # ============================================================
      # 21. PRODUCTION SIGNING GATE
      # ============================================================

      - name: Production signing gate
        env:
          MH_RELEASE_CERT_SHA256: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash

        run: |
          set -Eeuo pipefail

          ./scripts/production-signing-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

      # ============================================================
      # 22. FINAL METADATA
      # ============================================================

      - name: Verify signed Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "${APK}"

          apkanalyzer manifest application-id \
            "${APK}" \
            | grep -Fx "${PACKAGE_NAME}"

          apkanalyzer manifest version-name \
            "${APK}" \
            | grep -Fx "${VERSION_NAME}"

          apkanalyzer manifest version-code \
            "${APK}" \
            | grep -Fx "${VERSION_CODE}"

          unzip -t "${APK}" >/dev/null

          zipalign -c -v 4 "${APK}"

          apksigner verify \
            --verbose \
            --print-certs \
            "${APK}" \
            | tee artifacts/release-signature-final.txt

          sha256sum \
            "${APK}" \
            | tee artifacts/Majdoor-Hisaab-PRO-release.sha256

          echo "SIGNED RELEASE APK=PASS"

      # ============================================================
      # 23. FINAL RELEASE GATE
      # ============================================================

      - name: Final Release Gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase1-points-18-25-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

          ./scripts/final-release-gate.sh

      # ============================================================
      # 24. FINAL ARTIFACT CHECK
      # ============================================================

      - name: Verify downloadable artifacts
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

          ls -lh artifacts/

          echo "RELEASE ARTIFACTS=PASS"

      # ============================================================
      # 25. UPLOAD ONLY IF EVERYTHING PASSED
      # ============================================================

      - name: Upload Release artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: majdoor-hisaab-pro-release
          path: artifacts/
          if-no-files-found: error
