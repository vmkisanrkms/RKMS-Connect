name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  # IMPORTANT:
  # This is the ZIP that actually exists in the repository.
  ZIP_NAME: "Majdoor_Hisaab_PRO_READY_TO_BUILD_AUDITED_V11.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

jobs:
  build-release:
    name: Build Final Signed Release APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ============================================================
      # 3. GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ============================================================
      # 4. LOCATE ANDROID SDK
      # ============================================================
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching Android SDK..."

          SDK=""

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          fi

          if [ -z "$SDK" ]; then
            echo "Searching filesystem for Android SDK..."
            SDK="$(find /usr/local /opt "$HOME" -maxdepth 6 -type d -name "platform-tools" 2>/dev/null \
              | head -n 1 \
              | sed 's#/platform-tools##' || true)"
          fi

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK could not be located."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$SDK/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"
          elif command -v sdkmanager >/dev/null 2>&1; then
            echo "SDKMANAGER=$(command -v sdkmanager)" >> "$GITHUB_ENV"
          else
            SDKMANAGER_PATH="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

            if [ -z "$SDKMANAGER_PATH" ]; then
              echo "::error::sdkmanager not found."
              exit 1
            fi

            echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
          fi

          echo "Android SDK: $SDK"
          echo "sdkmanager: ${SDKMANAGER:-not-set}"

      # ============================================================
      # 5. INSTALL ANDROID API 36
      # ============================================================
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      # ============================================================
      # 6. VERIFY SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API}"
          test -d "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          test -x "$ANDROID_HOME/platform-tools/adb"

          echo "Android API: ${ANDROID_API}"
          echo "Build Tools: ${BUILD_TOOLS}"
          echo "SDK verification successful."

      # ============================================================
      # 7. FIND PROJECT ZIP
      # ============================================================
      - name: Find Majdoor Hisaab Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository ZIP files:"
          find . -maxdepth 3 -type f -iname "*.zip" -print | sort || true

          ZIP_PATH=""

          # --------------------------------------------------------
          # First: exact expected ZIP
          # --------------------------------------------------------
          if [ -f "./${ZIP_NAME}" ]; then
            ZIP_PATH="./${ZIP_NAME}"
          fi

          # --------------------------------------------------------
          # Second: exact AUDITED_V11 ZIP
          # --------------------------------------------------------
          if [ -z "$ZIP_PATH" ] && [ -f "./Majdoor_Hisaab_PRO_READY_TO_BUILD_AUDITED_V11.zip" ]; then
            ZIP_PATH="./Majdoor_Hisaab_PRO_READY_TO_BUILD_AUDITED_V11.zip"
          fi

          # --------------------------------------------------------
          # Third: find any matching Majdoor Hisaab ZIP
          # --------------------------------------------------------
          if [ -z "$ZIP_PATH" ]; then
            ZIP_PATH="$(
              find . -maxdepth 3 -type f -iname "*Majdoor*Hisaab*.zip" \
                | grep -Ei 'AUDITED_V11|FIXED_v10|READY_TO_BUILD' \
                | head -n 1 || true
            )"
          fi

          if [ -z "$ZIP_PATH" ] || [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Required Majdoor Hisaab project ZIP was not found."

            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 5 -type f -iname "*.zip" -print | sort || true

            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_PATH"

          echo "PROJECT_ZIP=$GITHUB_WORKSPACE/$ZIP_PATH" >> "$GITHUB_ENV"

      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================
      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/majdoor-hisaab-project"
          mkdir -p "$RUNNER_TEMP/majdoor-hisaab-project"

          unzip -q "$PROJECT_ZIP" \
            -d "$RUNNER_TEMP/majdoor-hisaab-project"

          echo "Extracted project contents:"
          find "$RUNNER_TEMP/majdoor-hisaab-project" \
            -maxdepth 3 \
            -type f \
            \( -name "settings.gradle" -o \
               -name "settings.gradle.kts" -o \
               -name "gradlew" \) \
            -print || true

      # ============================================================
      # 9. LOCATE ACTUAL ANDROID PROJECT ROOT
      # ============================================================
      - name: Locate Android Project Root
        shell: bash
        run: |
          set -euo pipefail

          BASE="$RUNNER_TEMP/majdoor-hisaab-project"

          PROJECT_ROOT=""

          # Prefer settings.gradle.kts
          PROJECT_ROOT="$(
            find "$BASE" \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              | head -n 1 \
              | xargs -r dirname
          )"

          # Then settings.gradle
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT="$(
              find "$BASE" \
                -type f \
                -name "settings.gradle" \
                -print \
                | head -n 1 \
                | xargs -r dirname
            )"
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Android Gradle project root was not found."

            echo "Extracted files:"
            find "$BASE" -maxdepth 5 -type f | sort | head -n 300

            exit 1
          fi

          echo "Android project root:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      # ============================================================
      # 10. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "Project root: $(pwd)"
          echo ""

          test -f "settings.gradle" || \
          test -f "settings.gradle.kts"

          if [ ! -f "gradlew" ]; then
            echo "::error::gradlew not found in Android project."
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      # ============================================================
      # 11. SHOW PROJECT STRUCTURE
      # ============================================================
      - name: Inspect Android Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "Gradle files:"
          find . -maxdepth 4 -type f \
            \( -name "*.gradle" \
            -o -name "*.gradle.kts" \
            -o -name "gradle.properties" \
            -o -name "AndroidManifest.xml" \) \
            -print | sort | head -n 300

      # ============================================================
      # 12. ENSURE MIN SDK 23
      # ============================================================
      - name: Verify Android Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "Checking Android project configuration..."

          if grep -RIn \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            "minSdk" . 2>/dev/null | head -n 30; then
            echo "minSdk configuration detected."
          else
            echo "WARNING: minSdk declaration was not found by text search."
          fi

      # ============================================================
      # 13. CLEAN
      # ============================================================
      - name: Clean Android Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 14. BUILD RELEASE APK
      # ============================================================
      - name: Compile Release Kotlin and Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          chmod +x gradlew

          echo "Starting Release build..."
          echo "This step will show the actual Kotlin/Gradle error if the source has a compile problem."

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 15. LOCATE RELEASE APK
      # ============================================================
      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "All APK files:"
          find . -type f -name "*.apk" -print | sort

          APK_PATH="$(
            find . \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              | grep -v -- "-unsigned.apk" \
              | head -n 1 || true
          )

          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(
              find . \
                -type f \
                -name "*.apk" \
                | grep -v -- "-unsigned.apk" \
                | head -n 1 || true
            )"
          fi

          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not found."
            exit 1
          fi

          echo "Release APK:"
          echo "$APK_PATH"

          cp "$APK_PATH" "$RUNNER_TEMP/release-original.apk"

          echo "ORIGINAL_APK=$RUNNER_TEMP/release-original.apk" >> "$GITHUB_ENV"

      # ============================================================
      # 16. CHECK APK
      # ============================================================
      - name: Verify Unsigned Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$ORIGINAL_APK"

          test -f "$APK"

          ls -lh "$APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest application-id "$APK" || true

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest version-name "$APK" || true

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest version-code "$APK" || true

      # ============================================================
      # 17. CREATE SIGNING KEYSTORE
      # ============================================================
      - name: Prepare APK Signing Keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/majdoor-hisaab-release.keystore"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -alias majdoor-hisaab-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "MajdoorHisaabV82Store@2026" \
            -keypass "MajdoorHisaabV82Key@2026" \
            -dname "CN=Majdoor Hisaab PRO, OU=RKMS, O=RKMS, L=Lakhimpur Kheri, ST=Uttar Pradesh, C=IN"

          test -f "$KEYSTORE"

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      # ============================================================
      # 18. ZIPALIGN
      # ============================================================
      - name: Align Release APK
        shell: bash
        run: |
          set -euo pipefail

          INPUT="$ORIGINAL_APK"
          ALIGNED="$RUNNER_TEMP/$APK_UNSIGNED_NAME"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$ALIGNED"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" \
            -c \
            -P 4 \
            16 \
            4 \
            "$ALIGNED"

          test -f "$ALIGNED"

          ls -lh "$ALIGNED"

          echo "ALIGNED_APK=$ALIGNED" >> "$GITHUB_ENV"

      # ============================================================
      # 19. SIGN APK
      # ============================================================
      - name: Sign Release APK
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="$RUNNER_TEMP/$APK_SIGNED_NAME"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias majdoor-hisaab-release \
            --ks-pass pass:"MajdoorHisaabV82Store@2026" \
            --key-pass pass:"MajdoorHisaabV82Key@2026" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$SIGNED" \
            "$ALIGNED_APK"

          test -f "$SIGNED"

          ls -lh "$SIGNED"

          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"

      # ============================================================
      # 20. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify Release APK Signature
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"

      # ============================================================
      # 21. VERIFY FINAL APK ID / VERSION
      # ============================================================
      - name: Verify Final APK Identity
        shell: bash
        run: |
          set -euo pipefail

          APK="$SIGNED_APK"

          echo "========================================"
          echo "FINAL APK INFORMATION"
          echo "========================================"

          echo "Application ID:"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest application-id "$APK" || true

          echo "Version Name:"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest version-name "$APK" || true

          echo "Version Code:"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest version-code "$APK" || true

          echo ""
          echo "Expected package:"
          echo "$PACKAGE_NAME"

          echo "Expected version:"
          echo "$VERSION_NAME"

          echo "Expected version code:"
          echo "$VERSION_CODE"

      # ============================================================
      # 22. FINAL ZIPALIGN CHECK
      # ============================================================
      - name: Final APK Alignment Verification
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" \
            -c \
            -P 4 \
            16 \
            4 \
            "$SIGNED_APK"

      # ============================================================
      # 23. FINAL APK REPORT
      # ============================================================
      - name: Generate Build Report
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/Majdoor-Hisaab-PRO-V82-Build-Report.txt"

          {
            echo "=============================================="
            echo "Majdoor Hisaab PRO V82"
            echo "FINAL SIGNED RELEASE APK"
            echo "=============================================="
            echo ""
            echo "Package: ${PACKAGE_NAME}"
            echo "Version: ${VERSION_NAME}"
            echo "Version Code: ${VERSION_CODE}"
            echo "Android API: ${ANDROID_API}"
            echo "Build Tools: ${BUILD_TOOLS}"
            echo "Java: ${JAVA_VERSION}"
            echo "Gradle: ${GRADLE_VERSION}"
            echo ""
            echo "Source ZIP:"
            echo "${PROJECT_ZIP}"
            echo ""
            echo "Final APK:"
            echo "${SIGNED_APK}"
            echo ""
            echo "APK Size:"
            ls -lh "${SIGNED_APK}"
            echo ""
            echo "Signature:"
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner" \
              verify \
              --verbose \
              --print-certs \
              "${SIGNED_APK}"
            echo ""
            echo "=============================================="
            echo "BUILD SUCCESSFUL"
            echo "=============================================="
          } > "$REPORT"

          cat "$REPORT"

          echo "REPORT=$REPORT" >> "$GITHUB_ENV"

      # ============================================================
      # 24. COPY FINAL OUTPUTS
      # ============================================================
      - name: Prepare Final Artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/final-output"

          cp "$SIGNED_APK" \
            "$GITHUB_WORKSPACE/final-output/$APK_SIGNED_NAME"

          cp "$ALIGNED_APK" \
            "$GITHUB_WORKSPACE/final-output/$APK_UNSIGNED_NAME"

          cp "$REPORT" \
            "$GITHUB_WORKSPACE/final-output/Majdoor-Hisaab-PRO-V82-Build-Report.txt"

          cp "$KEYSTORE" \
            "$GITHUB_WORKSPACE/final-output/Majdoor-Hisaab-PRO-V82-Signing-Keystore.jks"

          echo "Final output files:"
          ls -lh "$GITHUB_WORKSPACE/final-output"

      # ============================================================
      # 25. UPLOAD FINAL SIGNED APK
      # ============================================================
      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: |
            final-output/Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk
            final-output/Majdoor-Hisaab-PRO-V82-Build-Report.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 26. UPLOAD ALIGNED APK
      # ============================================================
      - name: Upload Aligned APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-ALIGNED-APK
          path: |
            final-output/Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 27. UPLOAD BUILD REPORT
      # ============================================================
      - name: Upload Build Report
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-BUILD-REPORT
          path: |
            final-output/Majdoor-Hisaab-PRO-V82-Build-Report.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 28. FINAL SUCCESS MESSAGE
      # ============================================================
      - name: Final Success
        shell: bash
        run: |
          echo ""
          echo "======================================================"
          echo "       MAJDOOR HISAAB PRO V82 BUILD SUCCESS"
          echo "======================================================"
          echo ""
          echo "Package:"
          echo "${PACKAGE_NAME}"
          echo ""
          echo "Version:"
          echo "${VERSION_NAME}"
          echo ""
          echo "Version Code:"
          echo "${VERSION_CODE}"
          echo ""
          echo "Final Signed APK:"
          echo "${APK_SIGNED_NAME}"
          echo ""
          echo "APK has been:"
          echo "1. Compiled"
          echo "2. Aligned"
          echo "3. Signed"
          echo "4. Signature verified"
          echo "5. Alignment verified"
          echo ""
          echo "======================================================"
