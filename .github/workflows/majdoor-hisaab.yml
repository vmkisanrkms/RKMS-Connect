name: MAJDOOR HISAAB PRO — V104 FINAL RELEASE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  GRADLE_VERSION: 8.11.1
  ANDROID_API: 36
  BUILD_TOOLS: 36.0.0
  PACKAGE_NAME: com.majdoor.hisaab
  VERSION_CODE: 77
  VERSION_NAME: 1.77.0

jobs:

  build-test-sign-runtime:

    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. LOCATE V104 ZIP
      # ============================================================

      - name: Locate Majdoor Hisaab V104 ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=============================================="
          echo "LOCATING V104 PROJECT ZIP"
          echo "=============================================="

          ZIP_FILE=""

          if [ -f "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104.zip" ]; then
            ZIP_FILE="Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104.zip"
          else
            ZIP_FILE="$(
              find . \
                -maxdepth 3 \
                -type f \
                -iname '*Majdoor*Hisaab*V104*.zip' \
                -print \
                -quit
            )"
          fi

          if [ -z "${ZIP_FILE}" ]; then
            echo "ERROR: V104 ZIP not found."
            echo
            echo "ZIP files available in repository:"
            find . \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              -print \
              | sort

            exit 1
          fi

          echo "V104 ZIP:"
          echo "${ZIP_FILE}"

          test -s "${ZIP_FILE}"

          mkdir -p "${RUNNER_TEMP}/majdoor-v104"

          cp \
            "${ZIP_FILE}" \
            "${RUNNER_TEMP}/majdoor-v104/project.zip"

          test -s \
            "${RUNNER_TEMP}/majdoor-v104/project.zip"

          echo "V104 ZIP=PASS"

      # ============================================================
      # 3. EXTRACT V104 ZIP
      #
      # The audited V104 ZIP has the Android project at ZIP root.
      # ============================================================

      - name: Extract V104 project
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT_DIR="${RUNNER_TEMP}/majdoor-v104/extracted"
          ZIP_FILE="${RUNNER_TEMP}/majdoor-v104/project.zip"

          rm -rf "${EXTRACT_DIR}"

          mkdir -p "${EXTRACT_DIR}"

          unzip -q \
            "${ZIP_FILE}" \
            -d "${EXTRACT_DIR}"

          test -f "${EXTRACT_DIR}/settings.gradle.kts"
          test -f "${EXTRACT_DIR}/build.gradle.kts"
          test -f "${EXTRACT_DIR}/app/build.gradle.kts"
          test -f "${EXTRACT_DIR}/gradlew"
          test -f "${EXTRACT_DIR}/gradlew.bat"
          test -s "${EXTRACT_DIR}/gradle/wrapper/gradle-wrapper.jar"
          test -s "${EXTRACT_DIR}/gradle/wrapper/gradle-wrapper.properties"

          echo "V104 ZIP EXTRACTION=PASS"

      # ============================================================
      # 4. COPY V104 PROJECT INTO GITHUB WORKSPACE
      #
      # IMPORTANT:
      # .git and .github from inside the ZIP are NOT copied.
      # The GitHub checkout remains authoritative for repository
      # metadata and the active workflow.
      # ============================================================

      - name: Prepare V104 Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT_DIR="${RUNNER_TEMP}/majdoor-v104/extracted"

          cd "${GITHUB_WORKSPACE}"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "${EXTRACT_DIR}/" \
            "${GITHUB_WORKSPACE}/"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew
          test -f gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties

          chmod +x ./gradlew
          chmod +x scripts/*.sh

          echo "V104 PROJECT WORKSPACE=PASS"

      # ============================================================
      # 5. VERIFY EXACT PROJECT CONFIGURATION
      # ============================================================

      - name: Verify V104 configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}"

          echo "=============================================="
          echo "V104 CONFIGURATION"
          echo "=============================================="

          grep -F \
            'id("com.android.application") version "8.9.1"' \
            build.gradle.kts

          grep -F \
            'id("org.jetbrains.kotlin.android") version "2.1.21"' \
            build.gradle.kts

          grep -F \
            'namespace = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -F \
            'applicationId = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -F \
            'compileSdk = 36' \
            app/build.gradle.kts

          grep -F \
            'targetSdk = 36' \
            app/build.gradle.kts

          grep -F \
            'minSdk = 26' \
            app/build.gradle.kts

          grep -F \
            'versionCode = 77' \
            app/build.gradle.kts

          grep -F \
            'versionName = "1.77.0"' \
            app/build.gradle.kts

          grep -F \
            'gradle-8.11.1-bin.zip' \
            gradle/wrapper/gradle-wrapper.properties

          echo "AGP=8.9.1"
          echo "KOTLIN=2.1.21"
          echo "GRADLE=8.11.1"
          echo "ANDROID_API=36"
          echo "PACKAGE=${PACKAGE_NAME}"
          echo "VERSION=${VERSION_NAME}"
          echo "VERSION_CODE=${VERSION_CODE}"

          echo "V104 CONFIGURATION=PASS"

      # ============================================================
      # 6. CLEAN RUNNER
      # ============================================================

      - name: Confirm clean GitHub-hosted runner
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "${GITHUB_RUN_ID}"

          echo "CLEAN_RUNNER=github-hosted-ubuntu-latest"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
          echo "CLEAN RUNNER=PASS"

      # ============================================================
      # 7. JAVA 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 8. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # ============================================================
      # 9. ANDROID API 36 + BUILD TOOLS 36.0.0
      # ============================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "ANDROID_API=${ANDROID_API}"
          echo "BUILD_TOOLS=${BUILD_TOOLS}"
          echo "ANDROID SDK INSTALLATION=PASS"

      # ============================================================
      # 10. VERIFY COMMITTED GRADLE WRAPPER
      #
      # NO setup-gradle.
      # NO command -v gradle.
      # NO gradle wrapper bootstrap.
      #
      # V104 already contains the correct wrapper.
      # ============================================================

      - name: Verify repository Gradle Wrapper
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}"

          echo "=============================================="
          echo "VERIFYING COMMITTED GRADLE WRAPPER"
          echo "=============================================="

          test -f gradlew
          test -f gradlew.bat

          test -s \
            gradle/wrapper/gradle-wrapper.jar

          test -s \
            gradle/wrapper/gradle-wrapper.properties

          chmod +x ./gradlew

          grep -F \
            'gradle-8.11.1-bin.zip' \
            gradle/wrapper/gradle-wrapper.properties

          grep -F \
            'distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' \
            gradle/wrapper/gradle-wrapper.properties

          echo "Wrapper files=PASS"
          echo "Wrapper SHA256 pin=PASS"

          ./gradlew \
            --version

          ./gradlew \
            --version \
            | grep -F "Gradle ${GRADLE_VERSION}"

          echo "GRADLE WRAPPER=PASS"

      # ============================================================
      # 11. ACCEPTANCE GATES
      # ============================================================

      - name: Run acceptance gates
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}"

          chmod +x ./gradlew
          chmod +x scripts/*.sh

          ./scripts/acceptance-gates.sh

      # ============================================================
      # 12. DEPENDENCY + BUILD + RELEASE BUILD
      # ============================================================

      - name: Build project with explicit failure diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "${GITHUB_WORKSPACE}"

          trap '
            echo "=============================================="
            echo "BUILD FAILED"
            echo "FAILED LINE=${LINENO}"
            echo "=============================================="
          ' ERR

          chmod +x ./gradlew
          chmod +x scripts/*.sh

          ./gradlew \
            --version \
            | grep -F "Gradle ${GRADLE_VERSION}"

          # --------------------------------------------------------
          # Dependency resolution
          # --------------------------------------------------------

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration debugRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration debugUnitTestRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration e2eReleaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration releaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            buildEnvironment

          # --------------------------------------------------------
          # Static health gates
          # --------------------------------------------------------

          ./scripts/dependency-health.sh

          ./scripts/phase17-real-android-runtime-gate.sh

          ./scripts/phase18-configuration-lifecycle-gate.sh

          ./scripts/phase19-offline-first-gate.sh

          ./scripts/phase20-security-data-gate.sh

          # --------------------------------------------------------
          # Unit + Debug + E2E Release + Release
          # --------------------------------------------------------

          ./gradlew \
            --no-daemon \
            --stacktrace \
            test \
            compileDebugKotlin \
            assembleDebug \
            compileE2eReleaseKotlin \
            assembleE2eRelease \
            compileReleaseKotlin \
            assembleRelease \
            assembleReleaseAndroidTest

          # --------------------------------------------------------
          # Release build gate
          # --------------------------------------------------------

          ./scripts/release-build-gate.sh

          # --------------------------------------------------------
          # Debug APK verification
          # --------------------------------------------------------

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "${DEBUG_APK}"

          apkanalyzer manifest application-id \
            "${DEBUG_APK}" \
            | grep -Fx "${PACKAGE_NAME}"

          apkanalyzer manifest version-name \
            "${DEBUG_APK}" \
            | grep -Fx "${VERSION_NAME}"

          apkanalyzer manifest version-code \
            "${DEBUG_APK}" \
            | grep -Fx "${VERSION_CODE}"

          mkdir -p artifacts/debug

          cp \
            "${DEBUG_APK}" \
            artifacts/debug/Majdoor-Hisaab-PRO-debug.apk

          sha256sum \
            "${DEBUG_APK}" \
            | tee artifacts/debug/Majdoor-Hisaab-PRO-debug.sha256

          echo "DEBUG APK BUILD=PASS"

      # ============================================================
      # 13. DEBUG APK REAL EMULATOR
      # ============================================================

      - name: Install and launch Debug APK on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            adb install -r \
              "${GITHUB_WORKSPACE}/app/build/outputs/apk/debug/app-debug.apk"

            adb shell am force-stop \
              "${PACKAGE_NAME}"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity" \
              | tee artifacts/debug/debug-launch.txt

            sleep 2

            adb shell pidof "${PACKAGE_NAME}" \
              | grep -Eq '[0-9]+'

            adb shell cmd package resolve-activity \
              --brief \
              -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER \
              "${PACKAGE_NAME}" \
              | grep -q "${PACKAGE_NAME}"

            adb logcat -d -t 10000 \
              > artifacts/debug/debug-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/debug/debug-logcat.txt; then
              exit 1
            fi

            echo "DEBUG RUNTIME=PASS"

      # ============================================================
      # 14. REAL ANDROID ROTATION + ERROR E2E
      # ============================================================

      - name: Run real Android rotation and error-state E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest

      # ============================================================
      # 15. REPORTS / SETTINGS / DATE / SEARCH
      # ============================================================

      - name: Run reports settings date search runtime evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.Phase17RealAndroidRuntimeE2ETest,com.majdoor.hisaab.Phase18ConfigurationLifecycleE2ETest

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/555_556_557_558_559_runtime.pass

      # ============================================================
      # 16. CLEAN INSTALL BACKUP / RESTORE
      # ============================================================

      - name: Run clean-install backup restore E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.CleanInstallBackupRestoreE2ETest

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/552_553_clean_install_restore_totals.pass

      # ============================================================
      # 17. SECURITY RUNTIME
      # ============================================================

      - name: Run security runtime evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.Phase17RealAndroidRuntimeE2ETest

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/554_security_runtime.pass

      # ============================================================
      # 18. PHASE 18 LIFECYCLE
      # ============================================================

      - name: Run Phase 18 lifecycle configuration E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.Phase18ConfigurationLifecycleE2ETest

      # ============================================================
      # 19. PHASE 19 OFFLINE-FIRST
      # ============================================================

      - name: Run Phase 19 offline-first E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.Phase19OfflineFirstE2ETest

            ./scripts/phase19-offline-first-gate.sh

      # ============================================================
      # 20. VERIFY UNSIGNED RELEASE
      # ============================================================

      - name: Verify unsigned Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "${APK}"

          apkanalyzer manifest application-id \
            "${APK}" \
            | grep -Fx "${PACKAGE_NAME}"

          apkanalyzer manifest version-name \
            "${APK}" \
            | grep -Fx "${VERSION_NAME}"

          apkanalyzer manifest version-code \
            "${APK}" \
            | grep -Fx "${VERSION_CODE}"

          unzip -t "${APK}" >/dev/null

          mkdir -p artifacts

          cp \
            "${APK}" \
            artifacts/app-release-unsigned.apk

          echo "UNSIGNED RELEASE APK=PASS"

      # ============================================================
      # 21. RESTORE PRODUCTION SIGNING KEY
      # ============================================================

      - name: Restore production signing key
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash

        run: |
          set -Eeuo pipefail

          test -n "${KEYSTORE_B64}"
          test -n "${KEYSTORE_PASSWORD}"
          test -n "${KEY_PASSWORD}"
          test -n "${KEY_ALIAS}"
          test -n "${EXPECTED_CERT}"

          printf '%s' "${KEYSTORE_B64}" \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

          keytool -list -v \
            -keystore release.keystore \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" \
            > cert.txt

          ACTUAL_CERT=$(
            awk -F': ' \
              '/SHA256:/{print $2; exit}' \
              cert.txt |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )

          EXPECTED_CERT_NORMALIZED=$(
            printf '%s' "${EXPECTED_CERT}" |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )

          test "${ACTUAL_CERT}" = "${EXPECTED_CERT_NORMALIZED}"

          echo "PRODUCTION SIGNING CERTIFICATE=PASS"

      # ============================================================
      # 22. ZIPALIGN + SIGN RELEASE + TEST APK
      #
      # IMPORTANT:
      # release.keystore is deleted ONLY after both APKs are signed.
      # ============================================================

      - name: Zipalign and sign Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash

        run: |
          set -Eeuo pipefail

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "${UNSIGNED}"
          test -s release.keystore

          zipalign -f -p 4 \
            "${UNSIGNED}" \
            "${ALIGNED}"

          zipalign -c -v 4 \
            "${ALIGNED}"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "${SIGNED}" \
            "${ALIGNED}"

          apksigner verify \
            --verbose \
            --print-certs \
            "${SIGNED}" \
            | tee artifacts/release-signature.txt

          ACTUAL_SIGNED_CERT=$(
            apksigner verify --print-certs "${SIGNED}" |
            awk -F': ' \
              '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )

          EXPECTED_SIGNED_CERT=$(
            printf '%s' "${EXPECTED_CERT}" |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )

          test -n "${ACTUAL_SIGNED_CERT}"
          test "${ACTUAL_SIGNED_CERT}" = "${EXPECTED_SIGNED_CERT}"

          unzip -t "${SIGNED}" >/dev/null

          zipalign -c -v 4 "${SIGNED}"

          # --------------------------------------------------------
          # Signed Release AndroidTest APK
          # --------------------------------------------------------

          TEST_UNSIGNED="app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          TEST_ALIGNED="app/build/outputs/apk/androidTest/release/app-release-androidTest-aligned.apk"
          TEST_SIGNED="artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

          test -s "${TEST_UNSIGNED}"

          zipalign -f -p 4 \
            "${TEST_UNSIGNED}" \
            "${TEST_ALIGNED}"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "${TEST_SIGNED}" \
            "${TEST_ALIGNED}"

          apksigner verify \
            --verbose \
            --print-certs \
            "${TEST_SIGNED}"

          # Cleanup only AFTER both APKs have been signed.
          rm -f cert.txt
          rm -f "${ALIGNED}"
          rm -f "${TEST_ALIGNED}"
          rm -f release.keystore

          echo "RELEASE APK SIGNING=PASS"

      # ============================================================
      # 23. PRODUCTION SIGNING GATE
      # ============================================================

      - name: Production signing signature ZIP alignment gate
        env:
          MH_RELEASE_CERT_SHA256: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash

        run: |
          set -Eeuo pipefail

          ./scripts/production-signing-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

      # ============================================================
      # 24. SIGNED APK METADATA + SHA256
      # ============================================================

      - name: Verify signed APK metadata and checksum
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "${APK}"

          apkanalyzer manifest application-id \
            "${APK}" \
            | grep -Fx "${PACKAGE_NAME}"

          apkanalyzer manifest version-name \
            "${APK}" \
            | grep -Fx "${VERSION_NAME}"

          apkanalyzer manifest version-code \
            "${APK}" \
            | grep -Fx "${VERSION_CODE}"

          unzip -t "${APK}" >/dev/null

          zipalign -c -v 4 "${APK}"

          apksigner verify \
            --verbose \
            --print-certs \
            "${APK}" \
            | tee artifacts/release-signature-final.txt

          sha256sum \
            "${APK}" \
            | tee artifacts/Majdoor-Hisaab-PRO-release.sha256

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

          echo "SIGNED APK VERIFICATION=PASS"

      # ============================================================
      # 25. PHASE 1 ARTIFACT GATE
      # ============================================================

      - name: Phase 1 Points 18-25 artifact gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase1-points-18-25-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

      # ============================================================
      # 26. PHASE 22 STRUCTURAL GATE
      # ============================================================

      - name: Phase 22 red-list structural gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase22-final-red-list-gate.sh

      # ============================================================
      # 27. PHASE 22 FINAL RED-LIST E2E
      # ============================================================

      - name: Phase 22 final red-list Android E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.Phase22FinalRedListE2ETest

      # ============================================================
      # 28. SIGNED RELEASE APK REAL RUNTIME
      # ============================================================

      - name: Run signed Release APK on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            ./scripts/release-e2e.sh \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release.apk"

            # Offline runtime check.
            adb shell svc wifi disable || true
            adb shell svc data disable || true

            adb shell am force-stop \
              "${PACKAGE_NAME}"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity" \
              | tee artifacts/release-e2e/offline-launch.txt

            sleep 2

            adb shell pidof "${PACKAGE_NAME}" \
              | grep -Eq '[0-9]+'

            adb logcat -d -t 10000 \
              > artifacts/release-e2e/offline-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/release-e2e/offline-logcat.txt; then
              exit 1
            fi

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/550_offline_runtime.pass

            echo "SIGNED RELEASE OFFLINE RUNTIME=PASS"

      # ============================================================
      # 29. TRUE REBOOT PERSISTENCE
      # ============================================================

      - name: Run signed Release APK true reboot persistence gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            adb uninstall \
              "${PACKAGE_NAME}" \
              >/dev/null 2>&1 || true

            adb uninstall \
              "com.majdoor.hisaab.test" \
              >/dev/null 2>&1 || true

            ./scripts/signed-release-reboot-gate.sh \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release.apk" \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

            echo "SIGNED RELEASE REBOOT PERSISTENCE=PASS"

      # ============================================================
      # 30. FINAL RELEASE GATE 541-566
      # ============================================================

      - name: Final Release Gate — Points 541-566
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/final-release-gate.sh

      # ============================================================
      # 31. FINAL ARTIFACT VERIFICATION
      # ============================================================

      - name: Verify downloadable Release artifact set
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk

          echo "DOWNLOADABLE_RELEASE_ARTIFACT=PASS"

          ls -lh \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

      # ============================================================
      # 32. UPLOAD ONLY AFTER ALL GATES PASS
      # ============================================================

      - name: Upload Release artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: majdoor-hisaab-pro-release
          path: artifacts/
          if-no-files-found: error
