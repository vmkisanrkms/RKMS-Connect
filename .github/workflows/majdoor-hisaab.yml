name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_CODE: "82"
  VERSION_NAME: "1.82.0"
  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_GANNA_PARCHI_BACKUP_APPLOCK_FINAL_V18.zip"
  APK_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

jobs:
  build-release:
    name: Build, Sign and Verify Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # IMPORTANT: Do not use cache: gradle here.
      # The Android project is inside the V18 ZIP, so setup-java's Gradle cache
      # cannot safely inspect the project before extraction.
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # IMPORTANT: Do NOT use android-actions/setup-android@v3 here.
      # On the current Ubuntu runner that action may try to install the
      # obsolete SDK package "tools", which causes the exact failure seen
      # in the GitHub Actions run. The hosted runner already contains the
      # Android command-line tools, so we locate them directly.
      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          else
            echo "::error::Preinstalled Android SDK not found."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in Android SDK."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Install Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}"
          test -d "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          echo "Android API ${ANDROID_API}: PASS"
          echo "Build Tools ${BUILD_TOOLS}: PASS"

      - name: Verify Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          test -x "$SDKMANAGER"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          echo "Android SDK tools verification: PASS"

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version

      - name: Locate V18 project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH=""
          if [ -f "$GITHUB_WORKSPACE/${ZIP_NAME}" ]; then
            ZIP_PATH="$GITHUB_WORKSPACE/${ZIP_NAME}"
          else
            ZIP_PATH="$(find "$GITHUB_WORKSPACE" -type f -name "$ZIP_NAME" -print -quit || true)"
          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Required V18 ZIP not found: ${ZIP_NAME}"
            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "Using: $ZIP_PATH"

      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$PROJECT_ZIP"

      - name: Extract V18 project ZIP
        shell: bash
        run: |
          set -euo pipefail
          EXTRACT_ROOT="$RUNNER_TEMP/majdoor-v8-project"
          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"
          unzip -q "$PROJECT_ZIP" -d "$EXTRACT_ROOT"
          echo "EXTRACT_ROOT=$EXTRACT_ROOT" >> "$GITHUB_ENV"

      - name: Locate Android project root
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$(find "$EXTRACT_ROOT" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit || true)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle(.kts) not found inside V18 ZIP"
            exit 1
          fi
          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT"

      - name: Repair only the reported Kotlin compile errors
        shell: bash
        run: |
          set -euo pipefail
          MAIN_ACTIVITY="$(find "$PROJECT_ROOT/app/src/main/java" -type f -name 'MainActivity.kt' -print -quit || true)"
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.kt not found under PROJECT_ROOT"
            exit 1
          fi

          python3 - "$MAIN_ACTIVITY" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          # Fix 1: rememberSaveable was used at line 372 but its import was missing.
          import_line = "import androidx.compose.runtime.saveable.rememberSaveable"
          if import_line not in text:
              anchor = "import androidx.compose.runtime.*\n"
              if anchor not in text:
                  raise SystemExit(
                      "Expected Compose runtime import was not found; "
                      "refusing unrelated source changes."
                  )
              text = text.replace(
                  anchor,
                  anchor + import_line + "\n",
                  1
              )

          # Fix 2: separate the two adjacent Compose Column expressions
          # on the reported line 1516.
          old = "maxLines=1)}Column(horizontalAlignment=Alignment.End)"
          new = "maxLines=1)};Column(horizontalAlignment=Alignment.End)"

          count = text.count(old)

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one reported Column pattern, "
                  f"found {count}; refusing unrelated source changes."
              )

          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          print(f"Patched only reported Kotlin compile issues in: {path}")
          PY

          grep -Fq \
            'import androidx.compose.runtime.saveable.rememberSaveable' \
            "$MAIN_ACTIVITY"

          grep -Fq \
            'maxLines=1)};Column(horizontalAlignment=Alignment.End)' \
            "$MAIN_ACTIVITY"

          echo "Kotlin compile-fix patch: PASS"

      - name: Verify Android project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_ROOT/settings.gradle.kts" || \
            test -f "$PROJECT_ROOT/settings.gradle"

          test -f "$PROJECT_ROOT/build.gradle.kts" || \
            test -f "$PROJECT_ROOT/build.gradle"

          test -f "$PROJECT_ROOT/app/build.gradle.kts" || \
            test -f "$PROJECT_ROOT/app/build.gradle"

          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"
          test -f "$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"

          echo "Android project structure: PASS"

      - name: Verify MainActivity source
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          if grep -Fxq \
            'import androidx.compose.foundation.lazy.item' \
            "$MAIN"; then
            echo "::error::Invalid exact import lazy.item is present."
            exit 1
          fi

          grep -Fxq \
            'import androidx.compose.foundation.lazy.items' \
            "$MAIN"

          for symbol in \
            'fun validDate' \
            'fun today' \
            'fun money' \
            'fun displayDate' \
            'fun Stat' \
            'fun DashboardStat' \
            'fun DashboardModule' \
            'fun LabourScreen' \
            'fun FieldScreen' \
            'fun CropScreen' \
            'fun ExpenseScreen' \
            'fun SaleScreen' \
            'fun AttendanceScreen' \
            'fun FieldDetail' \
            'fun LabourDetail' \
            'fun PaymentDialog' \
            'fun RateDialog' \
            'fun CropDetail' \
            'exportReportPhoto' \
            'exportReportPdf' \
            'ExportButtons' \
            'DeviceCredentialDeleteGate' \
            'CaneParchiScreen' \
            'CaneParchiDialog' \
            'CanePriceDialog' \
            'CaneParchiDetail' \
            'protectedPrice' \
            'availableSeasons' \
            'priceSeason'; do
            grep -q "$symbol" "$MAIN"
          done

          echo "MainActivity source checks: PASS"

      - name: Verify backup and security configuration
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$PROJECT_ROOT/app/src/main/AndroidManifest.xml"
          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"
          RULES="$PROJECT_ROOT/app/src/main/res/xml/backup_rules.xml"
          EXTRACTION="$PROJECT_ROOT/app/src/main/res/xml/data_extraction_rules.xml"

          grep -q 'android:allowBackup="true"' "$MANIFEST"
          grep -q 'fullBackupContent="@xml/backup_rules"' "$MANIFEST"
          grep -q 'dataExtractionRules="@xml/data_extraction_rules"' "$MANIFEST"

          grep -q 'mhpro_store.xml' "$RULES"
          grep -q 'path="photos/"' "$RULES"

          grep -q 'mhpro_store.xml' "$EXTRACTION"
          grep -q 'path="photos/"' "$EXTRACTION"

          grep -q 'createBackupZip' "$MAIN"
          grep -q 'restoreBackupZip' "$MAIN"

          grep -q \
            'DeviceCredentialGate("Majdoor Hisaab PRO खोलें"' \
            "$MAIN"

          grep -q 'CanePrice' "$MAIN"
          grep -q 'CaneParchi' "$MAIN"
          grep -q 'remark' "$MAIN"

          echo "Backup, app-open lock and cane-parchi security checks: PASS"

      - name: Verify FileProvider report path
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"

          grep -q 'cache-path' "$FILE"
          grep -q 'path="reports/"' "$FILE"

          echo "FileProvider reports path: PASS"

      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"

          grep -Eq \
            'applicationId[[:space:]]*=[[:space:]]*"com\.majdoor\.hisaabpro"' \
            "$APP_GRADLE"

          grep -Eq \
            'versionCode[[:space:]]*=[[:space:]]*82([[:space:]]|$)' \
            "$APP_GRADLE"

          grep -Eq \
            'versionName[[:space:]]*=[[:space:]]*"1\.82\.0"' \
            "$APP_GRADLE"

          grep -q 'compileSdk = 36' "$APP_GRADLE"
          grep -q 'targetSdk = 36' "$APP_GRADLE"
          grep -q 'minSdk = 23' "$APP_GRADLE"
          grep -q 'JavaVersion.VERSION_17' "$APP_GRADLE"

          echo "Package/version/SDK configuration: PASS"

      - name: Configure Android SDK for Gradle
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > "$PROJECT_ROOT/local.properties"

      - name: Prepare permanent production signing keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_KEYSTORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD; do

            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Secret: ${name}"
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/majdoor-hisaab-pro-production.p12"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | \
            base64 --decode > "$KEYSTORE"

          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" >/dev/null

          PRODUCTION_CERT_SHA256="$(
            keytool -list -v \
              -storetype PKCS12 \
              -keystore "$KEYSTORE" \
              -storepass "$RELEASE_KEYSTORE_PASSWORD" \
              -alias "$RELEASE_KEY_ALIAS" |
              awk -F': ' '/SHA256:/{print $2; exit}' |
              tr -d ' :\r\n' |
              tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$PRODUCTION_CERT_SHA256" ]; then
            echo "::error::Could not read production certificate fingerprint from keystore."
            exit 1
          fi

          echo "KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "PRODUCTION_CERT_SHA256=$PRODUCTION_CERT_SHA256" >> "$GITHUB_ENV"

          echo "Permanent production keystore: PASS"
          echo "Production certificate loaded from permanent keystore: PASS"

      - name: Clean project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          gradle clean --no-daemon --stacktrace

      - name: Build release APK with permanent signing key
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          export KEYSTORE_FILE="$KEYSTORE_FILE"
          export KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export KEY_ALIAS="$KEY_ALIAS"
          export KEY_PASSWORD="$KEY_PASSWORD"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

      - name: Locate signed release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_ROOT/app/build/outputs/apk/release" \
              -type f \
              -name '*.apk' \
              -print -quit || true
          )"

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          cp "$APK" "$RUNNER_TEMP/$APK_NAME"
          echo "SIGNED_APK=$RUNNER_TEMP/$APK_NAME" >> "$GITHUB_ENV"

      - name: Verify final APK signature, identity and alignment
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2"
          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"

          "$ZIPALIGN" -c -P 16 4 "$SIGNED_APK"

          "$AAPT2" dump badging "$SIGNED_APK" \
            > "$RUNNER_TEMP/badging.txt"

          grep -q \
            "package: name='${PACKAGE_NAME}'" \
            "$RUNNER_TEMP/badging.txt"

          grep -q \
            "versionCode='${VERSION_CODE}'" \
            "$RUNNER_TEMP/badging.txt"

          grep -q \
            "versionName='${VERSION_NAME}'" \
            "$RUNNER_TEMP/badging.txt"

          EXPECTED="$(
            printf '%s' "$PRODUCTION_CERT_SHA256" |
            tr -d ' :\r\n' |
            tr '[:lower:]' '[:upper:]'
          )"

          ACTUAL="$(
            "$APKSIGNER" verify \
              --print-certs \
              "$SIGNED_APK" 2>&1 |
              awk -F': ' \
                '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' |
              tr -d ' :\r\n' |
              tr '[:lower:]' '[:upper:]'
          )"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Final APK certificate fingerprint mismatch."
            exit 1
          fi

          echo "Final APK verification: PASS"

      - name: Create release report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-output

          cp "$SIGNED_APK" \
            "release-output/$APK_NAME"

          cat > release-output/BUILD-REPORT.txt <<EOF
          Majdoor Hisaab PRO V82
          Package: $PACKAGE_NAME
          Version: $VERSION_NAME
          Version Code: $VERSION_CODE
          Android API: $ANDROID_API
          Build Tools: $BUILD_TOOLS
          Java: $JAVA_VERSION
          Gradle: $GRADLE_VERSION
          Signing: Permanent production keystore
          Certificate: Verified against RELEASE_CERT_SHA256
          Status: SUCCESS
          EOF

          sha256sum \
            "release-output/$APK_NAME" \
            > release-output/SHA256SUMS.txt

          ls -lh release-output

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED
          path: |
            release-output/${{ env.APK_NAME }}
            release-output/BUILD-REPORT.txt
            release-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Final success
        run: |
          echo "=============================================="
          echo "MAJDOOR HISAAB PRO V82 - BUILD SUCCESS"
          echo "Package: ${PACKAGE_NAME}"
          echo "Version: ${VERSION_NAME} (${VERSION_CODE})"
          echo "APK: ${APK_NAME}"
          echo "Signing: PERMANENT PRODUCTION KEY"
          echo "=============================================="

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f "${KEYSTORE_FILE:-}" || true
