name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_CODE: "82"
  VERSION_NAME: "1.82.0"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

jobs:

  build-release:

    name: Build, Sign and Verify Release APK

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # 4. LOCATE ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && \
               [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -n "${ANDROID_HOME:-}" ] && \
               [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"

          else
            SDKMANAGER_FOUND="$(command -v sdkmanager || true)"

            if [ -z "$SDKMANAGER_FOUND" ]; then
              echo "::error::Android SDK not found."
              exit 1
            fi

            SDK_ROOT="$(
              dirname \
              "$(dirname \
              "$(dirname \
              "$(readlink -f "$SDKMANAGER_FOUND")")")"
            )"
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT"

          test -d "$SDK_ROOT"


      # ============================================================
      # 5. SDKMANAGER
      # ============================================================

      - name: Locate sdkmanager
        shell: bash
        run: |
          set -e

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(
              find "$ANDROID_SDK_ROOT/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -print \
                -quit \
                2>/dev/null || true
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version


      # ============================================================
      # 6. LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Android SDK licenses accepted."


      # ============================================================
      # 7. ANDROID API 36
      # ============================================================

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}"
          test -d "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          echo "Android API ${ANDROID_API} installed."
          echo "Build Tools ${BUILD_TOOLS} installed."


      # ============================================================
      # 8. VERIFY BUILD TOOLS
      # ============================================================

      - name: Verify Android build tools
        shell: bash
        run: |
          set -e

          AAPT2="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          test -x "$AAPT2"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          echo "AAPT2:"
          "$AAPT2" version

          echo
          echo "APKSIGNER:"
          "$APKSIGNER" --version

          echo
          echo "ZIPALIGN:"
          ls -lh "$ZIPALIGN"

          echo
          echo "Android build tools verification PASSED."


      # ============================================================
      # 9. JAVA
      # ============================================================

      - name: Verify Java
        shell: bash
        run: |
          set -e

          java -version

          echo "JAVA_HOME=$JAVA_HOME"


      # ============================================================
      # 10. GRADLE
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          gradle --version


      # ============================================================
      # 11. REPOSITORY
      # ============================================================

      - name: Show repository files
        shell: bash
        run: |
          set -e

          pwd

          echo
          echo "Repository files:"

          find . \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -300


      # ============================================================
      # 12. FIND ZIP
      # ============================================================

      - name: Locate Majdoor Hisaab ZIP
        shell: bash
        run: |
          set -e

          ZIP_PATH="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "Majdoor_Hisaab_PRO*.zip" \
              -print \
              | head -n 1
          )"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Majdoor Hisaab PRO ZIP not found."

            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print || true

            exit 1
          fi

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

          echo "FOUND:"
          echo "$ZIP_PATH"


      # ============================================================
      # 13. BUILD DIRECTORY
      # ============================================================

      - name: Prepare temporary build directory
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/majdoor-build"

          mkdir -p "$RUNNER_TEMP/majdoor-build"

          echo "BUILD_ROOT=$RUNNER_TEMP/majdoor-build" >> "$GITHUB_ENV"


      # ============================================================
      # 14. EXTRACT ZIP
      # ============================================================

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          unzip -q "$ZIP_PATH" \
            -d "$BUILD_ROOT"

          echo "ZIP extraction completed."

          find "$BUILD_ROOT" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -500


      # ============================================================
      # 15. FIND GRADLE ROOT
      # ============================================================

      - name: Locate Gradle project root
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(
            find "$BUILD_ROOT" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print \
              | head -n 1
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo
          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"


      # ============================================================
      # 16. VERIFY PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_ROOT/settings.gradle.kts" \
            || test -f "$PROJECT_ROOT/settings.gradle"

          test -f "$PROJECT_ROOT/build.gradle.kts" \
            || test -f "$PROJECT_ROOT/build.gradle"

          test -f "$PROJECT_ROOT/app/build.gradle.kts" \
            || test -f "$PROJECT_ROOT/app/build.gradle"

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          test -f "$MAIN"

          echo "Android project structure PASSED."


      # ============================================================
      # 17. SOURCE CHECK
      # ============================================================

      - name: Verify Kotlin source
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          grep -q "fun validDate" "$MAIN"
          grep -q "BackHandler" "$MAIN"
          grep -q "PhotoThumb" "$MAIN"
          grep -q "AttendanceScreen" "$MAIN"
          grep -q "DeviceCredentialDeleteGate" "$MAIN"
          grep -q "Stat" "$MAIN"
          grep -q "money" "$MAIN"

          echo "Kotlin source checks PASSED."


      # ============================================================
      # 18. PAYMENT/CROP CHECK
      # ============================================================

      - name: Verify payment and crop cleanup
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          grep -q \
            'payments=payments.filterNot{it.cropId==id}' \
            "$MAIN"

          grep -q \
            'write("payment",payments,::obj)' \
            "$MAIN"

          if grep -q \
            '||field.isBlank()) return@Button' \
            "$MAIN"; then

            echo "::error::Old payment field validation found."
            exit 1
          fi

          echo "Payment/crop checks PASSED."


      # ============================================================
      # 19. PACKAGE/VERSION
      # ============================================================

      - name: Verify package and version
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "Application ID:"
          grep -n "applicationId" "$APP_GRADLE" || true

          echo
          echo "Version Code:"
          grep -n "versionCode" "$APP_GRADLE" || true

          echo
          echo "Version Name:"
          grep -n "versionName" "$APP_GRADLE" || true

          grep -Eq \
            'applicationId[[:space:]]*=[[:space:]]*"com\.majdoor\.hisaabpro"' \
            "$APP_GRADLE"

          grep -Eq \
            'versionCode[[:space:]]*=[[:space:]]*82([[:space:]]|$)' \
            "$APP_GRADLE"

          grep -Eq \
            'versionName[[:space:]]*=[[:space:]]*"1\.82\.0"' \
            "$APP_GRADLE"

          echo
          echo "Package/version verification PASSED."


      # ============================================================
      # 20. SDK FOR GRADLE
      # ============================================================

      - name: Configure Android SDK for Gradle
        shell: bash
        run: |
          set -e

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" \
            > "$PROJECT_ROOT/local.properties"

          cat "$PROJECT_ROOT/local.properties"


      # ============================================================
      # 21. GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 22. PRINT KOTLIN SOURCE INFO
      # ============================================================

      - name: Print Kotlin source diagnostics
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          echo "=============================================="
          echo "KOTLIN SOURCE DIAGNOSTICS"
          echo "=============================================="

          echo
          echo "MainActivity:"
          wc -l "$MAIN"

          echo
          echo "Kotlin files:"
          find "$PROJECT_ROOT/app/src" \
            -type f \
            \( -name "*.kt" -o -name "*.kts" \) \
            -print

          echo
          echo "Java files:"
          find "$PROJECT_ROOT/app/src" \
            -type f \
            -name "*.java" \
            -print

          echo
          echo "Compose imports:"
          grep '^import androidx.compose' "$MAIN" || true

          echo
          echo "=============================================="


      # ============================================================
      # 23. BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        id: build_release
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set +e

          LOG_FILE="$RUNNER_TEMP/majdoor-kotlin-build.log"

          echo "=============================================="
          echo "BUILD RELEASE APK"
          echo "=============================================="

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}

          echo
          echo "Gradle exit code: $BUILD_EXIT"

          if [ "$BUILD_EXIT" -ne 0 ]; then

            echo
            echo "=============================================="
            echo "KOTLIN COMPILER ERRORS"
            echo "=============================================="

            grep -nE \
              '(^e: |^.*\.kt:[0-9]+:[0-9]+:|Unresolved reference|Type mismatch|None of the following|Overload resolution ambiguity|Cannot infer|Expecting |Compilation error)' \
              "$LOG_FILE" \
              | tail -n 200 || true

            echo
            echo "=============================================="
            echo "LAST 250 BUILD LOG LINES"
            echo "=============================================="

            tail -n 250 "$LOG_FILE"

            echo
            echo "=============================================="
            echo "BUILD FAILED"
            echo "=============================================="

            exit "$BUILD_EXIT"
          fi

          echo
          echo "RELEASE BUILD PASSED."


      # ============================================================
      # 24. LOCATE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          APK_PATH="$(
            find "$PROJECT_ROOT/app/build/outputs/apk/release" \
              -type f \
              -name "*.apk" \
              -print \
              | head -n 1
          )"

          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo "APK_UNSIGNED_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "RELEASE APK:"
          echo "$APK_PATH"


      # ============================================================
      # 25. PREPARE APK
      # ============================================================

      - name: Prepare APK directory
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk"

          mkdir -p "$RUNNER_TEMP/apk"

          cp "$APK_UNSIGNED_PATH" \
            "$RUNNER_TEMP/apk/$APK_UNSIGNED_NAME"

          ls -lh "$RUNNER_TEMP/apk"


      # ============================================================
      # 26. TEMP SIGNING KEY
      # ============================================================

      - name: Generate temporary signing keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$RUNNER_TEMP/majdoor-release-key.p12"

          keytool \
            -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -alias majdoor_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=Majdoor Hisaab PRO, OU=Release, O=Majdoor Hisaab PRO, L=India, ST=Uttar Pradesh, C=IN"

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=majdoor_release" >> "$GITHUB_ENV"


      # ============================================================
      # 27. ALIGN
      # ============================================================

      - name: Align APK
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            "$RUNNER_TEMP/apk/$APK_UNSIGNED_NAME" \
            "$RUNNER_TEMP/apk/aligned.apk"

          echo "APK alignment completed."


      # ============================================================
      # 28. SIGN
      # ============================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --ks-key-alias "$KEY_ALIAS" \
            --min-sdk-version 23 \
            --max-sdk-version 36 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RUNNER_TEMP/apk/$APK_SIGNED_NAME" \
            "$RUNNER_TEMP/apk/aligned.apk"

          echo "APK SIGNING PASSED."


      # ============================================================
      # 29. VERIFY SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$RUNNER_TEMP/apk/$APK_SIGNED_NAME"

          echo "SIGNATURE VERIFICATION PASSED."


      # ============================================================
      # 30. VERIFY ALIGNMENT
      # ============================================================

      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            "$RUNNER_TEMP/apk/$APK_SIGNED_NAME"

          echo "ALIGNMENT VERIFICATION PASSED."


      # ============================================================
      # 31. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify final APK package and version
        shell: bash
        run: |
          set -e

          AAPT2="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"

          APK="$RUNNER_TEMP/apk/$APK_SIGNED_NAME"

          "$AAPT2" dump badging "$APK" \
            > "$RUNNER_TEMP/apk/badging.txt"

          cat "$RUNNER_TEMP/apk/badging.txt"

          grep -q \
            "package: name='${PACKAGE_NAME}'" \
            "$RUNNER_TEMP/apk/badging.txt"

          grep -q \
            "versionCode='${VERSION_CODE}'" \
            "$RUNNER_TEMP/apk/badging.txt"

          grep -q \
            "versionName='${VERSION_NAME}'" \
            "$RUNNER_TEMP/apk/badging.txt"

          echo
          echo "FINAL APK VERIFICATION PASSED."


      # ============================================================
      # 32. BUILD REPORT
      # ============================================================

      - name: Create build report
        shell: bash
        run: |
          set -e

          REPORT="$RUNNER_TEMP/apk/BUILD-REPORT.txt"

          {
            echo "=============================================="
            echo "MAJDOOR HISAAB PRO V82"
            echo "FINAL SIGNED RELEASE BUILD"
            echo "=============================================="
            echo
            echo "Package      : ${PACKAGE_NAME}"
            echo "Version Code : ${VERSION_CODE}"
            echo "Version Name : ${VERSION_NAME}"
            echo "Java         : ${JAVA_VERSION}"
            echo "Gradle       : ${GRADLE_VERSION}"
            echo "Android API  : ${ANDROID_API}"
            echo "Build Tools  : ${BUILD_TOOLS}"
            echo
            echo "APK          : ${APK_SIGNED_NAME}"
            echo
            echo "BUILD SUCCESS"
            echo "=============================================="
          } > "$REPORT"

          cat "$REPORT"


      # ============================================================
      # 33. UPLOAD APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED
          path: |
            ${{ runner.temp }}/apk/${{ env.APK_SIGNED_NAME }}
            ${{ runner.temp }}/apk/BUILD-REPORT.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 34. FINAL SUMMARY
      # ============================================================

      - name: Final build summary
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo "MAJDOOR HISAAB PRO V82"
          echo "FINAL BUILD SUCCESS"
          echo "=============================================="

          ls -lh \
            "$RUNNER_TEMP/apk/$APK_SIGNED_NAME"

          echo
          echo "Artifact:"
          echo "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED"

          echo
          echo "Package:"
          echo "$PACKAGE_NAME"

          echo
          echo "Version:"
          echo "$VERSION_NAME ($VERSION_CODE)"


      # ============================================================
      # 35. CLEANUP
      # ============================================================

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/majdoor-release-key.p12" || true
          rm -f "$RUNNER_TEMP/apk/aligned.apk" || true
          rm -f "$RUNNER_TEMP/apk/$APK_UNSIGNED_NAME" || true

          echo "Temporary signing material cleaned."
