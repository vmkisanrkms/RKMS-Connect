name: Build Majdoor Hisaab PRO Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

jobs:
  build:
    name: Majdoor Hisaab PRO Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify project structure
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/majdoor/hisaab/MainActivity.kt
          echo "Project structure OK"

      - name: Check Android configuration
        run: |
          grep -q 'compileSdk = 35' app/build.gradle.kts
          grep -q 'minSdk = 26' app/build.gradle.kts
          grep -q 'targetSdk = 35' app/build.gradle.kts
          grep -q 'com.majdoor.hisaab' app/build.gradle.kts
          echo "Android configuration OK"

      - name: Build Release APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "======================================"
          echo "RELEASE APK CREATED"
          echo "======================================"

          ls -lh "$APK"

          echo "SHA256:"
          sha256sum "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
