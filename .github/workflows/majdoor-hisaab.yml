name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_CODE: "82"
  VERSION_NAME: "1.82.0"

  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_HAJRI_PHOTO_PDF_FIXED_FINAL_V9.zip"

  APK_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build, Sign and Verify Release APK

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. JAVA 17
      # IMPORTANT:
      # NO Gradle cache here because Android project is inside ZIP.
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ============================================================
      # 4. LOCATE PREINSTALLED ANDROID SDK
      #
      # DO NOT use:
      # android-actions/setup-android@v3
      #
      # This avoids the obsolete "tools" package failure.
      # ============================================================

      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT=""

          if [ -n "${ANDROID_SDK_ROOT:-}" ] && \
             [ -d "$ANDROID_SDK_ROOT" ]; then

            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -n "${ANDROID_HOME:-}" ] && \
               [ -d "$ANDROID_HOME" ]; then

            SDK_ROOT="$ANDROID_HOME"

          elif [ -d "/usr/local/lib/android/sdk" ]; then

            SDK_ROOT="/usr/local/lib/android/sdk"

          else

            echo "::error::Android SDK not found on GitHub runner."
            exit 1

          fi


          echo "Detected Android SDK:"
          echo "$SDK_ROOT"


          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then

            SDKMANAGER="$(command -v sdkmanager)"

          else

            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name "sdkmanager" \
                -print \
                -quit \
                2>/dev/null || true
            )"

          fi


          if [ -z "$SDKMANAGER" ]; then

            SDKMANAGER="$(
              find "$SDK_ROOT" \
                -type f \
                -path "*/bin/sdkmanager" \
                -print \
                -quit \
                2>/dev/null || true
            )"

          fi


          if [ -z "$SDKMANAGER" ]; then

            echo "::error::sdkmanager not found."
            exit 1

          fi


          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"


          echo
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"


          "$SDKMANAGER" --version


      # ============================================================
      # 5. ACCEPT LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          echo "Android SDK licenses accepted."


      # ============================================================
      # 6. INSTALL ONLY REQUIRED SDK PACKAGES
      #
      # IMPORTANT:
      # We DO NOT install obsolete "tools".
      # ============================================================

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing required Android packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"


          test -d \
            "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}"


          test -d \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"


          test -x \
            "$ANDROID_SDK_ROOT/platform-tools/adb"


          test -x \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"


          test -x \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"


          test -x \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"


          echo
          echo "Android API ${ANDROID_API}: PASS"
          echo "Build Tools ${BUILD_TOOLS}: PASS"


      # ============================================================
      # 7. VERIFY JAVA / GRADLE / SDK
      # ============================================================

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "JAVA"
          echo "=============================================="

          java -version


          echo
          echo "=============================================="
          echo "GRADLE"
          echo "=============================================="

          gradle --version


          echo
          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          "$SDKMANAGER" --version


          echo
          echo "=============================================="
          echo "BUILD TOOLS"
          echo "=============================================="

          "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2" version

          "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner" --version


      # ============================================================
      # 8. LOCATE V9 ZIP
      # ============================================================

      - name: Locate V9 project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH=""


          if [ -f "$GITHUB_WORKSPACE/${ZIP_NAME}" ]; then

            ZIP_PATH="$GITHUB_WORKSPACE/${ZIP_NAME}"

          else

            ZIP_PATH="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "$ZIP_NAME" \
                -print \
                -quit \
                2>/dev/null || true
            )"

          fi


          if [ -z "$ZIP_PATH" ]; then

            echo "::error::V9 ZIP not found."

            echo
            echo "Expected:"
            echo "$ZIP_NAME"

            echo
            echo "Available ZIP files:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print \
              || true

            exit 1

          fi


          echo "PROJECT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"


          echo
          echo "=============================================="
          echo "V9 ZIP FOUND"
          echo "=============================================="

          echo "$ZIP_PATH"


      # ============================================================
      # 9. VERIFY ZIP
      # ============================================================

      - name: Verify V9 ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$PROJECT_ZIP"

          echo
          echo "V9 ZIP integrity: PASS"


      # ============================================================
      # 10. EXTRACT V9 ZIP
      # ============================================================

      - name: Extract V9 project ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_ROOT="$RUNNER_TEMP/majdoor-v9-project"


          rm -rf "$EXTRACT_ROOT"

          mkdir -p "$EXTRACT_ROOT"


          unzip -q \
            "$PROJECT_ZIP" \
            -d "$EXTRACT_ROOT"


          echo "EXTRACT_ROOT=$EXTRACT_ROOT" \
            >> "$GITHUB_ENV"


          echo
          echo "V9 ZIP extraction completed."


      # ============================================================
      # 11. LOCATE GRADLE PROJECT ROOT
      # ============================================================

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find "$EXTRACT_ROOT" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print \
              -quit \
              2>/dev/null || true
          )"


          if [ -z "$SETTINGS_FILE" ]; then

            echo "::error::settings.gradle(.kts) not found."

            find "$EXTRACT_ROOT" \
              -maxdepth 5 \
              -type f \
              -print \
              | head -300

            exit 1

          fi


          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"


          echo "PROJECT_ROOT=$PROJECT_ROOT" \
            >> "$GITHUB_ENV"


          echo
          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"


      # ============================================================
      # 12. VERIFY PROJECT STRUCTURE
      # ============================================================

      - name: Verify Android project structure
        shell: bash
        run: |
          set -euo pipefail


          test -f \
            "$PROJECT_ROOT/settings.gradle.kts" \
            || test -f \
            "$PROJECT_ROOT/settings.gradle"


          test -f \
            "$PROJECT_ROOT/build.gradle.kts" \
            || test -f \
            "$PROJECT_ROOT/build.gradle"


          test -f \
            "$PROJECT_ROOT/app/build.gradle.kts" \
            || test -f \
            "$PROJECT_ROOT/app/build.gradle"


          test -f \
            "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"


          test -f \
            "$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"


          test -f \
            "$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"


          echo
          echo "Android project structure: PASS"


      # ============================================================
      # 13. VERIFY MAINACTIVITY
      # ============================================================

      - name: Verify MainActivity Kotlin source
        shell: bash
        run: |
          set -euo pipefail


          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"


          echo "Checking:"
          echo "$MAIN"


          # --------------------------------------------------------
          # INVALID IMPORT MUST NOT EXIST
          # --------------------------------------------------------

          if grep -Fxq \
            "import androidx.compose.foundation.lazy.item" \
            "$MAIN"; then

            echo "::error::Invalid lazy.item import found."

            exit 1

          fi


          # --------------------------------------------------------
          # CORRECT IMPORT
          # --------------------------------------------------------

          grep -Fxq \
            "import androidx.compose.foundation.lazy.items" \
            "$MAIN"


          # --------------------------------------------------------
          # REQUIRED SOURCE
          # --------------------------------------------------------

          for symbol in \
            "fun validDate" \
            "fun today" \
            "fun money" \
            "fun displayDate" \
            "fun Stat" \
            "fun DashboardStat" \
            "fun DashboardModule" \
            "fun LabourScreen" \
            "fun FieldScreen" \
            "fun CropScreen" \
            "fun ExpenseScreen" \
            "fun SaleScreen" \
            "fun AttendanceScreen" \
            "fun FieldDetail" \
            "fun LabourDetail" \
            "fun PaymentDialog" \
            "fun RateDialog" \
            "fun CropDetail" \
            "exportReportPhoto" \
            "exportReportPdf" \
            "ExportButtons" \
            "DeviceCredentialDeleteGate"
          do

            if ! grep -q "$symbol" "$MAIN"; then

              echo "::error::Missing Kotlin symbol: $symbol"

              exit 1

            fi

          done


          echo
          echo "MainActivity source verification: PASS"


      # ============================================================
      # 14. VERIFY FILEPROVIDER
      # ============================================================

      - name: Verify FileProvider reports path
        shell: bash
        run: |
          set -euo pipefail


          FILE="$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"


          grep -q "cache-path" "$FILE"


          grep -q 'path="reports/"' "$FILE"


          echo "FileProvider cache/reports path: PASS"


      # ============================================================
      # 15. VERIFY PACKAGE / VERSION / SDK
      # ============================================================

      - name: Verify application configuration
        shell: bash
        run: |
          set -euo pipefail


          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"


          grep -Eq \
            'applicationId[[:space:]]*=[[:space:]]*"com\.majdoor\.hisaabpro"' \
            "$APP_GRADLE"


          grep -Eq \
            'versionCode[[:space:]]*=[[:space:]]*82([[:space:]]|$)' \
            "$APP_GRADLE"


          grep -Eq \
            'versionName[[:space:]]*=[[:space:]]*"1\.82\.0"' \
            "$APP_GRADLE"


          grep -q \
            "compileSdk = 36" \
            "$APP_GRADLE"


          grep -q \
            "targetSdk = 36" \
            "$APP_GRADLE"


          grep -q \
            "minSdk = 23" \
            "$APP_GRADLE"


          grep -q \
            "JavaVersion.VERSION_17" \
            "$APP_GRADLE"


          echo
          echo "Package:"
          echo "$PACKAGE_NAME"


          echo
          echo "Version:"
          echo "$VERSION_NAME ($VERSION_CODE)"


          echo
          echo "SDK configuration: PASS"


      # ============================================================
      # 16. CONFIGURE LOCAL ANDROID SDK
      # ============================================================

      - name: Configure Android SDK for Gradle
        shell: bash
        run: |
          set -euo pipefail


          printf \
            "sdk.dir=%s\n" \
            "$ANDROID_SDK_ROOT" \
            > "$PROJECT_ROOT/local.properties"


          cat "$PROJECT_ROOT/local.properties"


      # ============================================================
      # 17. PREPARE PERMANENT PRODUCTION KEYSTORE
      # ============================================================

      - name: Prepare permanent production signing keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}

        run: |
          set -euo pipefail


          # --------------------------------------------------------
          # CHECK SECRETS
          # --------------------------------------------------------

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is missing."
            exit 1
          fi


          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD is missing."
            exit 1
          fi


          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEY_ALIAS is missing."
            exit 1
          fi


          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD is missing."
            exit 1
          fi


          if [ -z "$RELEASE_CERT_SHA256" ]; then
            echo "::error::RELEASE_CERT_SHA256 is missing."
            exit 1
          fi


          # --------------------------------------------------------
          # DECODE PERMANENT KEYSTORE
          # --------------------------------------------------------

          KEYSTORE_FILE="$RUNNER_TEMP/majdoor-hisaab-pro-production.p12"


          printf "%s" \
            "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_FILE"


          chmod 600 "$KEYSTORE_FILE"


          test -s "$KEYSTORE_FILE"


          # --------------------------------------------------------
          # VERIFY KEYSTORE ALIAS
          # --------------------------------------------------------

          keytool \
            -list \
            -storetype PKCS12 \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null


          # --------------------------------------------------------
          # VERIFY CERTIFICATE FINGERPRINT
          # --------------------------------------------------------

          EXPECTED="$(
            printf "%s" \
              "$RELEASE_CERT_SHA256" \
              | tr -d " :\r\n" \
              | tr "[:lower:]" "[:upper:]"
          )"


          ACTUAL="$(
            keytool \
              -list \
              -v \
              -storetype PKCS12 \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              | awk -F": " \
                "/SHA256:/{print \$2; exit}" \
              | tr -d " :\r\n" \
              | tr "[:lower:]" "[:upper:]"
          )"


          echo "Expected certificate:"
          echo "$EXPECTED"


          echo "Actual certificate:"
          echo "$ACTUAL"


          if [ "$EXPECTED" != "$ACTUAL" ]; then

            echo "::error::Production certificate fingerprint mismatch."

            echo "::error::Build stopped to protect application signing."

            exit 1

          fi


          # --------------------------------------------------------
          # ONLY PATH IS STORED IN GITHUB_ENV.
          # PASSWORDS ARE NOT WRITTEN TO GITHUB_ENV.
          # --------------------------------------------------------

          echo \
            "KEYSTORE_FILE=$KEYSTORE_FILE" \
            >> "$GITHUB_ENV"


          echo
          echo "Permanent production keystore: PASS"


      # ============================================================
      # 18. GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail


          gradle \
            clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 19. BUILD RELEASE
      #
      # IMPORTANT:
      # app/build.gradle.kts reads these environment variables.
      # Therefore Gradle itself signs the release APK with the
      # permanent production keystore.
      #
      # NO temporary keystore.
      # NO second signing step.
      # ============================================================

      - name: Build signed Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash

        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}

          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -euo pipefail


          echo "=============================================="
          echo "BUILDING SIGNED RELEASE APK"
          echo "=============================================="


          test -f "$KEYSTORE_FILE"


          gradle \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info


          echo
          echo "Gradle Release build completed."


      # ============================================================
      # 20. LOCATE RELEASE APK
      # ============================================================

      - name: Locate final Release APK
        shell: bash
        run: |
          set -euo pipefail


          APK_PATH="$(
            find \
              "$PROJECT_ROOT/app/build/outputs/apk/release" \
              -type f \
              -name "*.apk" \
              -print \
              -quit \
              2>/dev/null || true
          )"


          if [ -z "$APK_PATH" ]; then

            echo "::error::Release APK not found."

            find \
              "$PROJECT_ROOT/app/build/outputs" \
              -type f \
              -print \
              || true

            exit 1

          fi


          FINAL_APK="$RUNNER_TEMP/$APK_NAME"


          cp \
            "$APK_PATH" \
            "$FINAL_APK"


          echo "FINAL_APK=$FINAL_APK" \
            >> "$GITHUB_ENV"


          echo
          echo "FINAL APK:"
          echo "$FINAL_APK"


      # ============================================================
      # 21. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail


          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"


          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$FINAL_APK"


          echo
          echo "APK signature verification: PASS"


      # ============================================================
      # 22. VERIFY CERTIFICATE FINGERPRINT
      # ============================================================

      - name: Verify final APK certificate
        shell: bash
        env:
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}

        run: |
          set -euo pipefail


          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"


          EXPECTED="$(
            printf "%s" \
              "$RELEASE_CERT_SHA256" \
              | tr -d " :\r\n" \
              | tr "[:lower:]" "[:upper:]"
          )"


          ACTUAL="$(
            "$APKSIGNER" \
              verify \
              --print-certs \
              "$FINAL_APK" \
              2>&1 \
              | awk -F": " \
                "/Signer #1 certificate SHA-256 digest:/{print \$2; exit}" \
              | tr -d " :\r\n" \
              | tr "[:lower:]" "[:upper:]"
          )"


          echo "Expected:"
          echo "$EXPECTED"


          echo "Actual:"
          echo "$ACTUAL"


          if [ -z "$ACTUAL" ]; then

            echo "::error::Could not read APK certificate fingerprint."

            exit 1

          fi


          if [ "$EXPECTED" != "$ACTUAL" ]; then

            echo "::error::Final APK certificate mismatch."

            exit 1

          fi


          echo
          echo "Permanent production certificate: VERIFIED"


      # ============================================================
      # 23. VERIFY ZIPALIGN
      # ============================================================

      - name: Verify APK alignment
        shell: bash
        run: |
          set -euo pipefail


          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"


          "$ZIPALIGN" \
            -c \
            -P 16 \
            4 \
            "$FINAL_APK"


          echo
          echo "APK alignment verification: PASS"


      # ============================================================
      # 24. VERIFY PACKAGE / VERSION
      # ============================================================

      - name: Verify final APK package and version
        shell: bash
        run: |
          set -euo pipefail


          AAPT2="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"


          BADGING="$RUNNER_TEMP/final-badging.txt"


          "$AAPT2" \
            dump \
            badging \
            "$FINAL_APK" \
            > "$BADGING"


          cat "$BADGING"


          grep -q \
            "package: name='${PACKAGE_NAME}'" \
            "$BADGING"


          grep -q \
            "versionCode='${VERSION_CODE}'" \
            "$BADGING"


          grep -q \
            "versionName='${VERSION_NAME}'" \
            "$BADGING"


          echo
          echo "Package verification: PASS"
          echo "Version verification: PASS"


      # ============================================================
      # 25. FINAL APK REPORT
      # ============================================================

      - name: Create final APK report
        shell: bash
        run: |
          set -euo pipefail


          mkdir -p "$RUNNER_TEMP/release"


          cp \
            "$FINAL_APK" \
            "$RUNNER_TEMP/release/$APK_NAME"


          cat > \
            "$RUNNER_TEMP/release/BUILD-REPORT.txt" <<EOF
          MAJDOOR HISAAB PRO V82

          Package:
          ${PACKAGE_NAME}

          Version:
          ${VERSION_NAME}

          Version Code:
          ${VERSION_CODE}

          Android API:
          ${ANDROID_API}

          Build Tools:
          ${BUILD_TOOLS}

          Java:
          ${JAVA_VERSION}

          Gradle:
          ${GRADLE_VERSION}

          Signing:
          PERMANENT PRODUCTION KEYSTORE

          Certificate:
          VERIFIED

          APK Signature:
          VERIFIED

          APK Alignment:
          VERIFIED

          APK Package:
          VERIFIED

          BUILD STATUS:
          SUCCESS
          EOF


          sha256sum \
            "$RUNNER_TEMP/release/$APK_NAME" \
            > "$RUNNER_TEMP/release/SHA256SUMS.txt"


          echo
          echo "=============================================="
          echo "FINAL RELEASE PACKAGE"
          echo "=============================================="


          ls -lh \
            "$RUNNER_TEMP/release"


      # ============================================================
      # 26. UPLOAD FINAL APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4

        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED

          path: |
            ${{ runner.temp }}/release/${{ env.APK_NAME }}
            ${{ runner.temp }}/release/BUILD-REPORT.txt
            ${{ runner.temp }}/release/SHA256SUMS.txt

          if-no-files-found: error

          retention-days: 30


      # ============================================================
      # 27. FINAL SUCCESS
      # ============================================================

      - name: Final success summary
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " MAJDOOR HISAAB PRO V82"
          echo " FINAL RELEASE BUILD SUCCESS"
          echo "=============================================="
          echo
          echo "Package:"
          echo "$PACKAGE_NAME"
          echo
          echo "Version:"
          echo "$VERSION_NAME ($VERSION_CODE)"
          echo
          echo "APK:"
          echo "$APK_NAME"
          echo
          echo "Signing:"
          echo "PERMANENT PRODUCTION KEY"
          echo
          echo "Signature:"
          echo "VERIFIED"
          echo
          echo "=============================================="


      # ============================================================
      # 28. CLEAN TEMPORARY KEYSTORE
      # ============================================================

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f \
            "${KEYSTORE_FILE:-}" \
            2>/dev/null || true

          echo "Temporary keystore file cleaned."
