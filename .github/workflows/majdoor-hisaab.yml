name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_CODE: "82"
  VERSION_NAME: "1.82.0"

  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_HAJRI_PHOTO_PDF_FIXED_FINAL_V8.zip"

  APK_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

jobs:

  build-release:

    name: Build, Sign and Verify Release APK

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. JAVA 17
      # IMPORTANT:
      # cache: gradle intentionally NOT used.
      # The Android project is inside the ZIP.
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ============================================================
      # 4. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 5. INSTALL ANDROID API 36
      # ============================================================

      - name: Install Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          test -d "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          echo "Android API ${ANDROID_API}: PASS"
          echo "Build Tools ${BUILD_TOOLS}: PASS"


      # ============================================================
      # 6. VERIFY JAVA + GRADLE
      # ============================================================

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          java -version

          echo
          gradle --version


      # ============================================================
      # 7. LOCATE V8 ZIP
      # ============================================================

      - name: Locate V8 project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH=""

          if [ -f "$GITHUB_WORKSPACE/${ZIP_NAME}" ]; then
            ZIP_PATH="$GITHUB_WORKSPACE/${ZIP_NAME}"
          else
            ZIP_PATH="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "$ZIP_NAME" \
                -print \
                -quit || true
            )"
          fi

          if [ -z "$ZIP_PATH" ]; then

            echo "::error::Required V8 ZIP not found: ${ZIP_NAME}"

            echo
            echo "Available ZIP files:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname '*.zip' \
              -print || true

            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"

          echo
          echo "Using V8 ZIP:"
          echo "$ZIP_PATH"


      # ============================================================
      # 8. VERIFY ZIP
      # ============================================================

      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$PROJECT_ZIP"

          echo
          echo "ZIP integrity: PASS"


      # ============================================================
      # 9. EXTRACT V8 PROJECT
      # ============================================================

      - name: Extract V8 project ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_ROOT="$RUNNER_TEMP/majdoor-v8-project"

          rm -rf "$EXTRACT_ROOT"

          mkdir -p "$EXTRACT_ROOT"

          unzip -q "$PROJECT_ZIP" -d "$EXTRACT_ROOT"

          echo "EXTRACT_ROOT=$EXTRACT_ROOT" >> "$GITHUB_ENV"

          echo "V8 project extracted."


      # ============================================================
      # 10. LOCATE GRADLE PROJECT
      # ============================================================

      - name: Locate Android project root
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find "$EXTRACT_ROOT" \
              -type f \
              \( \
                -name 'settings.gradle.kts' \
                -o \
                -name 'settings.gradle' \
              \) \
              -print \
              -quit || true
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle(.kts) not found inside V8 ZIP"
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo
          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"


      # ============================================================
      # 11. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_ROOT/settings.gradle.kts" \
            || test -f "$PROJECT_ROOT/settings.gradle"

          test -f "$PROJECT_ROOT/build.gradle.kts" \
            || test -f "$PROJECT_ROOT/build.gradle"

          test -f "$PROJECT_ROOT/app/build.gradle.kts" \
            || test -f "$PROJECT_ROOT/app/build.gradle"

          test -f \
            "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          test -f \
            "$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          test -f \
            "$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"

          echo "Android project structure: PASS"


      # ============================================================
      # 12. VERIFY MAINACTIVITY
      # ============================================================

      - name: Verify MainActivity source
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"


          # --------------------------------------------------------
          # INVALID IMPORT MUST NOT EXIST
          # --------------------------------------------------------

          if grep -Fxq \
            'import androidx.compose.foundation.lazy.item' \
            "$MAIN"; then

            echo "::error::Invalid exact import lazy.item is present."

            exit 1

          fi


          # --------------------------------------------------------
          # CORRECT IMPORT MUST EXIST
          # --------------------------------------------------------

          grep -Fxq \
            'import androidx.compose.foundation.lazy.items' \
            "$MAIN"


          # --------------------------------------------------------
          # REQUIRED FUNCTIONS
          # --------------------------------------------------------

          for symbol in \
            'fun validDate' \
            'fun today' \
            'fun money' \
            'fun displayDate' \
            'fun Stat' \
            'fun DashboardStat' \
            'fun DashboardModule' \
            'fun LabourScreen' \
            'fun FieldScreen' \
            'fun CropScreen' \
            'fun ExpenseScreen' \
            'fun SaleScreen' \
            'fun AttendanceScreen' \
            'fun FieldDetail' \
            'fun LabourDetail' \
            'fun PaymentDialog' \
            'fun RateDialog' \
            'fun CropDetail' \
            'exportReportPhoto' \
            'exportReportPdf' \
            'ExportButtons' \
            'DeviceCredentialDeleteGate'
          do

            grep -q "$symbol" "$MAIN"

          done


          echo
          echo "MainActivity source checks: PASS"


      # ============================================================
      # 13. FILE PROVIDER
      # ============================================================

      - name: Verify FileProvider report path
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"

          grep -q 'cache-path' "$FILE"

          grep -q 'path="reports/"' "$FILE"

          echo "FileProvider reports path: PASS"


      # ============================================================
      # 14. PACKAGE + VERSION + SDK
      # ============================================================

      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"


          grep -Eq \
            'applicationId[[:space:]]*=[[:space:]]*"com\.majdoor\.hisaabpro"' \
            "$APP_GRADLE"


          grep -Eq \
            'versionCode[[:space:]]*=[[:space:]]*82([[:space:]]|$)' \
            "$APP_GRADLE"


          grep -Eq \
            'versionName[[:space:]]*=[[:space:]]*"1\.82\.0"' \
            "$APP_GRADLE"


          grep -q \
            'compileSdk = 36' \
            "$APP_GRADLE"


          grep -q \
            'targetSdk = 36' \
            "$APP_GRADLE"


          grep -q \
            'minSdk = 23' \
            "$APP_GRADLE"


          grep -q \
            'JavaVersion.VERSION_17' \
            "$APP_GRADLE"


          echo
          echo "Package/version/SDK configuration: PASS"


      # ============================================================
      # 15. CONFIGURE ANDROID SDK
      # ============================================================

      - name: Configure Android SDK for Gradle
        shell: bash
        run: |
          set -euo pipefail

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_HOME" \
            > "$PROJECT_ROOT/local.properties"


      # ============================================================
      # 16. PERMANENT PRODUCTION KEYSTORE
      # ============================================================

      - name: Prepare permanent production signing keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}

        run: |
          set -euo pipefail


          # --------------------------------------------------------
          # REQUIRED SECRETS
          # --------------------------------------------------------

          for name in \
            RELEASE_KEYSTORE_BASE64 \
            KEYSTORE_PASSWORD \
            KEY_ALIAS \
            KEY_PASSWORD \
            RELEASE_CERT_SHA256
          do

            if [ -z "${!name:-}" ]; then

              echo "::error::Missing required GitHub Secret: ${name}"

              exit 1

            fi

          done


          # --------------------------------------------------------
          # DECODE PERMANENT KEYSTORE
          # --------------------------------------------------------

          KEYSTORE="$RUNNER_TEMP/majdoor-hisaab-pro-production.p12"

          printf '%s' \
            "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          chmod 600 "$KEYSTORE"

          test -s "$KEYSTORE"


          # --------------------------------------------------------
          # VERIFY KEYSTORE + ALIAS
          # --------------------------------------------------------

          keytool \
            -list \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null


          # --------------------------------------------------------
          # VERIFY CERTIFICATE FINGERPRINT
          # --------------------------------------------------------

          EXPECTED="$(
            printf '%s' \
              "$RELEASE_CERT_SHA256" \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"


          ACTUAL="$(
            keytool \
              -list \
              -v \
              -storetype PKCS12 \
              -keystore "$KEYSTORE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              | awk -F': ' '/SHA256:/{print $2; exit}' \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"


          if [ "$EXPECTED" != "$ACTUAL" ]; then

            echo "::error::Production certificate fingerprint mismatch."

            echo "::error::Build refused for safety."

            exit 1

          fi


          # --------------------------------------------------------
          # EXPORT VARIABLES
          # --------------------------------------------------------

          echo \
            "KEYSTORE_FILE=$KEYSTORE" \
            >> "$GITHUB_ENV"

          echo \
            "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" \
            >> "$GITHUB_ENV"

          echo \
            "KEY_ALIAS=$KEY_ALIAS" \
            >> "$GITHUB_ENV"

          echo \
            "KEY_PASSWORD=$KEY_PASSWORD" \
            >> "$GITHUB_ENV"


          echo
          echo "Permanent production certificate: PASS"


      # ============================================================
      # 17. CLEAN
      # ============================================================

      - name: Clean project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 18. BUILD RELEASE APK
      # ============================================================

      - name: Build release APK with permanent signing key
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail


          export KEYSTORE_FILE="$KEYSTORE_FILE"

          export KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"

          export KEY_ALIAS="$KEY_ALIAS"

          export KEY_PASSWORD="$KEY_PASSWORD"


          gradle \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info


      # ============================================================
      # 19. LOCATE APK
      # ============================================================

      - name: Locate signed release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              "$PROJECT_ROOT/app/build/outputs/apk/release" \
              -type f \
              -name '*.apk' \
              -print \
              -quit || true
          )"


          if [ -z "$APK" ]; then

            echo "::error::Release APK was not generated."

            exit 1

          fi


          cp \
            "$APK" \
            "$RUNNER_TEMP/$APK_NAME"


          echo \
            "SIGNED_APK=$RUNNER_TEMP/$APK_NAME" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 20. VERIFY FINAL APK
      # ============================================================

      - name: Verify final APK signature, identity and alignment
        shell: bash
        env:
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}

        run: |
          set -euo pipefail


          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          AAPT2="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2"

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"


          # --------------------------------------------------------
          # SIGNATURE
          # --------------------------------------------------------

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"


          # --------------------------------------------------------
          # ALIGNMENT
          # --------------------------------------------------------

          "$ZIPALIGN" \
            -c \
            -P 16 \
            4 \
            "$SIGNED_APK"


          # --------------------------------------------------------
          # PACKAGE INFORMATION
          # --------------------------------------------------------

          "$AAPT2" \
            dump \
            badging \
            "$SIGNED_APK" \
            > "$RUNNER_TEMP/badging.txt"


          grep -q \
            "package: name='${PACKAGE_NAME}'" \
            "$RUNNER_TEMP/badging.txt"


          grep -q \
            "versionCode='${VERSION_CODE}'" \
            "$RUNNER_TEMP/badging.txt"


          grep -q \
            "versionName='${VERSION_NAME}'" \
            "$RUNNER_TEMP/badging.txt"


          # --------------------------------------------------------
          # FINAL CERTIFICATE CHECK
          # --------------------------------------------------------

          EXPECTED="$(
            printf '%s' \
              "$RELEASE_CERT_SHA256" \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"


          ACTUAL="$(
            "$APKSIGNER" \
              verify \
              --print-certs \
              "$SIGNED_APK" \
              2>&1 \
              | awk -F': ' \
                '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"


          if [ "$EXPECTED" != "$ACTUAL" ]; then

            echo "::error::Final APK certificate fingerprint mismatch."

            exit 1

          fi


          echo
          echo "FINAL APK VERIFICATION: PASS"


      # ============================================================
      # 21. CREATE REPORT
      # ============================================================

      - name: Create release report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-output


          cp \
            "$SIGNED_APK" \
            "release-output/$APK_NAME"


          cat > release-output/BUILD-REPORT.txt <<EOF
          Majdoor Hisaab PRO V82

          Package: $PACKAGE_NAME

          Version: $VERSION_NAME

          Version Code: $VERSION_CODE

          Android API: $ANDROID_API

          Build Tools: $BUILD_TOOLS

          Java: $JAVA_VERSION

          Gradle: $GRADLE_VERSION

          Signing: Permanent production keystore

          Certificate: Verified against RELEASE_CERT_SHA256

          Status: SUCCESS
          EOF


          sha256sum \
            "release-output/$APK_NAME" \
            > "release-output/SHA256SUMS.txt"


          ls -lh release-output


      # ============================================================
      # 22. UPLOAD FINAL APK
      # ============================================================

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4

        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED

          path: |
            release-output/${{ env.APK_NAME }}
            release-output/BUILD-REPORT.txt
            release-output/SHA256SUMS.txt

          if-no-files-found: error

          retention-days: 30


      # ============================================================
      # 23. FINAL SUCCESS
      # ============================================================

      - name: Final success
        run: |
          echo "=============================================="

          echo "MAJDOOR HISAAB PRO V82 - BUILD SUCCESS"

          echo "Package: ${PACKAGE_NAME}"

          echo "Version: ${VERSION_NAME} (${VERSION_CODE})"

          echo "APK: ${APK_NAME}"

          echo "Signing: PERMANENT PRODUCTION KEY"

          echo "=============================================="


      # ============================================================
      # 24. CLEAN SIGNING MATERIAL
      # ============================================================

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f "${KEYSTORE_FILE:-}" || true
