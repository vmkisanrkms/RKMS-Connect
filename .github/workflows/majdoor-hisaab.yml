name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V82-KOTLIN-COMPILE-FIXED.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build Final Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # 4. LOCATE ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATING ANDROID SDK"
          echo "=============================================="

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"

          else
            SDK_ROOT=$(find /usr/local/lib/android \
              -maxdepth 3 \
              -type d \
              -name "sdk" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name "sdkmanager" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "ANDROID SDK:"
          echo "$SDK_ROOT"

          echo ""
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 5. INSTALL ANDROID SDK 36
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INSTALL ANDROID SDK 36"
          echo "=============================================="

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "ANDROID SDK INSTALLATION PASSED."


      # ============================================================
      # 6. VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY ANDROID SDK"
          echo "=============================================="

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"

          echo ""
          echo "ANDROID SDK VERIFICATION PASSED."


      # ============================================================
      # 7. FIND PROJECT ZIP
      # ============================================================

      - name: Find Majdoor Hisaab Project ZIP
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FIND MAJDOOR HISAAB PROJECT ZIP"
          echo "=============================================="

          FOUND_ZIP=""

          if [ -f "$ZIP_NAME" ]; then
            FOUND_ZIP="$ZIP_NAME"
          fi

          if [ -z "$FOUND_ZIP" ]; then
            FOUND_ZIP=$(
              find . \
                -type f \
                -name "Majdoor_Hisaab_PRO_READY_TO_BUILD_FIXED_*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | tail -1
            )
          fi

          if [ -z "$FOUND_ZIP" ]; then
            FOUND_ZIP=$(
              find . \
                -type f \
                -iname "*Majdoor*Hisaab*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | tail -1
            )
          fi

          if [ -z "$FOUND_ZIP" ] || [ ! -f "$FOUND_ZIP" ]; then
            echo ""
            echo "ERROR: Majdoor Hisaab project ZIP NOT FOUND."

            echo ""
            echo "AVAILABLE ZIP FILES:"

            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print \
              | sort

            exit 1
          fi

          FOUND_ZIP="${FOUND_ZIP#./}"

          echo ""
          echo "PROJECT ZIP FOUND:"
          echo "$FOUND_ZIP"

          ls -lh "$FOUND_ZIP"

          echo "ZIP_NAME=$FOUND_ZIP" >> "$GITHUB_ENV"

          echo ""
          echo "ZIP DETECTION PASSED."


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================

      - name: Extract Majdoor Hisaab Project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "EXTRACT PROJECT"
          echo "=============================================="

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_NAME" -d build_source

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print \
            -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: Gradle settings file not found."

            find build_source \
              -maxdepth 8 \
              -type f \
              -print \
              | sort \
              | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 9. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY ANDROID PROJECT"
          echo "=============================================="

          pwd

          test -d "app"

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo ""
          echo "ANDROID PROJECT VERIFIED."


      # ============================================================
      # 10. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle Environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE ENVIRONMENT"
          echo "=============================================="

          java -version

          echo ""
          gradle --version

          DETECTED=$(
            gradle --version |
            awk '/^Gradle / {print $2; exit}'
          )

          echo ""
          echo "EXPECTED GRADLE:"
          echo "$GRADLE_VERSION"

          echo ""
          echo "DETECTED GRADLE:"
          echo "$DETECTED"

          if [ "$DETECTED" != "$GRADLE_VERSION" ]; then
            echo ""
            echo "ERROR: Gradle version mismatch."
            exit 1
          fi

          echo ""
          echo "GRADLE ENVIRONMENT PASSED."


      # ============================================================
      # 11. LOCATE MAIN KOTLIN SOURCE
      # ============================================================

      - name: Locate Main Kotlin Source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE MAIN KOTLIN SOURCE"
          echo "=============================================="

          MAIN_FILES=$(find app/src/main \
            -type f \
            -name "MainActivity.kt" \
            -print)

          echo "$MAIN_FILES"

          COUNT=$(echo "$MAIN_FILES" | sed '/^$/d' | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo ""
            echo "ERROR: Multiple MainActivity.kt files found."
            exit 1
          fi

          MAIN_FILE=$(echo "$MAIN_FILES" | head -1)

          echo "MAIN_FILE=$MAIN_FILE" >> "$GITHUB_ENV"

          echo ""
          echo "MAIN FILE:"
          echo "$MAIN_FILE"


      # ============================================================
      # 18. COMPILE RELEASE KOTLIN
      #
      # IMPORTANT:
      # This step ONLY repairs actual btn() CALLS.
      #
      # It NEVER modifies:
      #   fun btn(...)
      #   function declarations
      #   comments
      #   strings
      #
      # This prevents the previous line-311 structural corruption.
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN"
          echo "=============================================="

          echo ""
          echo "MAIN SOURCE:"
          echo "$MAIN_FILE"

          echo ""
          echo "PREPARING SAFE KOTLIN COMPILE FIX..."

          python3 <<'PY'
          from pathlib import Path
          import re
          import shutil

          ROOT = Path("app/src/main")
          main_file = Path("${MAIN_FILE}")

          if not main_file.exists():
              candidates = list(ROOT.rglob("MainActivity.kt"))
              if len(candidates) != 1:
                  raise SystemExit(
                      "ERROR: MainActivity.kt could not be resolved."
                  )
              main_file = candidates[0]

          print("Using MainActivity:")
          print(main_file)

          # --------------------------------------------------------
          # Helpers
          # --------------------------------------------------------

          def matching_paren(text, open_pos):
              depth = 1
              i = open_pos + 1
              mode = "normal"

              while i < len(text):

                  if mode == "normal":

                      if text.startswith('"""', i):
                          mode = "triple"
                          i += 3
                          continue

                      if text.startswith("//", i):
                          j = text.find("\n", i + 2)
                          if j == -1:
                              return None
                          i = j
                          continue

                      if text.startswith("/*", i):
                          j = text.find("*/", i + 2)
                          if j == -1:
                              return None
                          i = j + 2
                          continue

                      c = text[i]

                      if c == '"':
                          mode = "string"
                          i += 1
                          continue

                      if c == "'":
                          mode = "char"
                          i += 1
                          continue

                      if c == "(":
                          depth += 1

                      elif c == ")":
                          depth -= 1
                          if depth == 0:
                              return i

                      i += 1

                  elif mode == "string":

                      if text[i] == "\\":
                          i += 2
                          continue

                      if text[i] == '"':
                          mode = "normal"

                      i += 1

                  elif mode == "char":

                      if text[i] == "\\":
                          i += 2
                          continue

                      if text[i] == "'":
                          mode = "normal"

                      i += 1

                  else:

                      if text.startswith('"""', i):
                          mode = "normal"
                          i += 3
                      else:
                          i += 1

              return None


          def split_top_level(text):
              parts = []
              start = 0

              paren = 0
              bracket = 0
              brace = 0

              i = 0
              mode = "normal"

              while i < len(text):

                  if mode == "normal":

                      if text.startswith('"""', i):
                          mode = "triple"
                          i += 3
                          continue

                      if text.startswith("//", i):
                          j = text.find("\n", i + 2)
                          if j == -1:
                              i = len(text)
                          else:
                              i = j
                          continue

                      if text.startswith("/*", i):
                          j = text.find("*/", i + 2)
                          if j == -1:
                              i = len(text)
                          else:
                              i = j + 2
                          continue

                      c = text[i]

                      if c == '"':
                          mode = "string"
                          i += 1
                          continue

                      if c == "'":
                          mode = "char"
                          i += 1
                          continue

                      if c == "(":
                          paren += 1

                      elif c == ")":
                          paren -= 1

                      elif c == "[":
                          bracket += 1

                      elif c == "]":
                          bracket -= 1

                      elif c == "{":
                          brace += 1

                      elif c == "}":
                          brace -= 1

                      elif (
                          c == ","
                          and paren == 0
                          and bracket == 0
                          and brace == 0
                      ):
                          parts.append(text[start:i].strip())
                          start = i + 1

                      i += 1

                  elif mode == "string":

                      if text[i] == "\\":
                          i += 2
                          continue

                      if text[i] == '"':
                          mode = "normal"

                      i += 1

                  elif mode == "char":

                      if text[i] == "\\":
                          i += 2
                          continue

                      if text[i] == "'":
                          mode = "normal"

                      i += 1

                  else:

                      if text.startswith('"""', i):
                          mode = "normal"
                          i += 3
                      else:
                          i += 1

              tail = text[start:].strip()

              if tail:
                  parts.append(tail)

              return parts


          def previous_code(text, pos):
              i = pos - 1

              while i >= 0 and text[i].isspace():
                  i -= 1

              return i


          def is_function_declaration(text, btn_pos):
              """
              Returns True for:

                  fun btn(...)

                  private fun btn(...)

                  @Composable
                  fun btn(...)

              We intentionally NEVER modify these.
              """

              i = previous_code(text, btn_pos)

              # Search backwards to the beginning of the current
              # short declaration prefix.
              start = max(0, btn_pos - 120)

              prefix = text[start:btn_pos]

              # A declaration has 'fun' before btn and no obvious
              # call receiver between them.
              if re.search(
                  r'\bfun\s*$',
                  prefix
              ):
                  return True

              if re.search(
                  r'\bfun\s+[A-Za-z_][A-Za-z0-9_]*\s*$',
                  prefix
              ):
                  return True

              # Most importantly, direct declaration form:
              # fun btn(
              if re.search(
                  r'\bfun\s+btn\s*$',
                  prefix
              ):
                  return True

              return False


          def looks_like_lambda(value):
              value = value.strip()

              if value.startswith("{"):
                  return True

              if "->" in value:
                  return True

              return False


          def looks_like_boolean(value):
              value = value.strip()

              if value in ("true", "false"):
                  return True

              if value.startswith("!"):
                  return True

              if re.search(
                  r'\b(true|false)\b',
                  value
              ):
                  return True

              boolean_patterns = [
                  r'\s&&\s',
                  r'\s\|\|\s',
                  r'==',
                  r'!=',
                  r'>=',
                  r'<=',
                  r'(?<![<>=!])>(?!=)',
                  r'(?<![<>=!])<(?!=)',
                  r'\bis\b',
                  r'\bin\b'
              ]

              return any(
                  re.search(pattern, value)
                  for pattern in boolean_patterns
              )


          def looks_like_string(value):
              value = value.strip()

              return (
                  value.startswith('"')
                  or
                  value.startswith('"""')
              )


          # --------------------------------------------------------
          # Find btn() declaration signature.
          #
          # This is READ ONLY.
          # We do not alter it.
          # --------------------------------------------------------

          all_text = main_file.read_text(
              encoding="utf-8"
          )

          declaration_match = re.search(
              r'\bfun\s+btn\s*\(',
              all_text
          )

          if not declaration_match:
              raise SystemExit(
                  "ERROR: fun btn(...) declaration not found."
              )

          declaration_open = all_text.find(
              "(",
              declaration_match.start()
          )

          declaration_close = matching_paren(
              all_text,
              declaration_open
          )

          if declaration_close is None:
              raise SystemExit(
                  "ERROR: Cannot parse fun btn(...) declaration."
              )

          declaration_body = all_text[
              declaration_open + 1:
              declaration_close
          ]

          declaration_args = split_top_level(
              declaration_body
          )

          parameter_kinds = []

          for parameter in declaration_args:

              clean = parameter.strip()

              # Remove annotations/default value for type inspection.
              name_type = clean

              if "=" in name_type:
                  name_type = name_type.split(
                      "=",
                      1
                  )[0].strip()

              if ":" not in name_type:
                  continue

              name, type_part = name_type.split(
                  ":",
                  1
              )

              name = name.strip()
              type_part = type_part.strip()

              kind = "other"

              if "->" in type_part:
                  kind = "function"

              elif re.search(
                  r'\bBoolean\b',
                  type_part
              ):
                  kind = "boolean"

              elif re.search(
                  r'\bString\b',
                  type_part
              ):
                  kind = "string"

              parameter_kinds.append(
                  (name, kind)
              )

          print("")
          print("btn() declaration parameters:")

          for name, kind in parameter_kinds:
              print(
                  f"  {name}: {kind}"
              )

          if not parameter_kinds:
              raise SystemExit(
                  "ERROR: btn() parameter signature could not be read."
              )


          # --------------------------------------------------------
          # Backup MainActivity.kt before any modification.
          # --------------------------------------------------------

          backup = main_file.with_suffix(
              ".kt.compile-backup"
          )

          shutil.copy2(
              main_file,
              backup
          )

          print("")
          print(
              "SOURCE BACKUP CREATED:",
              backup
          )


          # --------------------------------------------------------
          # Process only actual btn() calls.
          #
          # Crucial:
          #   fun btn(...) is skipped.
          #
          # Strings/comments are skipped by lexical scanner.
          # --------------------------------------------------------

          def process_file(path):

              text = path.read_text(
                  encoding="utf-8"
              )

              output = []
              cursor = 0
              changes = 0
              title_changes = 0
              order_changes = 0

              i = 0
              n = len(text)

              mode = "normal"

              while i < n:

                  if mode == "normal":

                      # --------------------------------------------
                      # Comments
                      # --------------------------------------------

                      if text.startswith("//", i):

                          j = text.find("\n", i + 2)

                          if j == -1:
                              output.append(
                                  text[i:]
                              )
                              i = n
                          else:
                              output.append(
                                  text[i:j]
                              )
                              i = j

                          continue

                      if text.startswith("/*", i):

                          j = text.find(
                              "*/",
                              i + 2
                          )

                          if j == -1:
                              raise SystemExit(
                                  f"ERROR: Unterminated comment in {path}"
                              )

                          j += 2

                          output.append(
                              text[i:j]
                          )

                          i = j
                          continue

                      # --------------------------------------------
                      # Strings
                      # --------------------------------------------

                      if text.startswith('"""', i):

                          j = text.find(
                              '"""',
                              i + 3
                          )

                          if j == -1:
                              raise SystemExit(
                                  f"ERROR: Unterminated triple string in {path}"
                              )

                          j += 3

                          output.append(
                              text[i:j]
                          )

                          i = j
                          continue

                      if text[i] == '"':

                          j = i + 1

                          while j < n:

                              if text[j] == "\\":
                                  j += 2
                                  continue

                              if text[j] == '"':
                                  j += 1
                                  break

                              j += 1

                          output.append(
                              text[i:j]
                          )

                          i = j
                          continue

                      # --------------------------------------------
                      # Character literals
                      # --------------------------------------------

                      if text[i] == "'":

                          j = i + 1

                          while j < n:

                              if text[j] == "\\":
                                  j += 2
                                  continue

                              if text[j] == "'":
                                  j += 1
                                  break

                              j += 1

                          output.append(
                              text[i:j]
                          )

                          i = j
                          continue

                      # --------------------------------------------
                      # Detect identifier btn
                      # --------------------------------------------

                      if (
                          text.startswith(
                              "btn",
                              i
                          )
                          and
                          (
                              i == 0
                              or
                              not (
                                  text[i - 1].isalnum()
                                  or
                                  text[i - 1] == "_"
                              )
                          )
                          and
                          (
                              i + 3 >= n
                              or
                              not (
                                  text[i + 3].isalnum()
                                  or
                                  text[i + 3] == "_"
                              )
                          )
                      ):

                          j = i + 3

                          while (
                              j < n
                              and
                              text[j].isspace()
                          ):
                              j += 1

                          if (
                              j < n
                              and
                              text[j] == "("
                          ):

                              # ------------------------------------
                              # NEVER touch fun btn(...)
                              # ------------------------------------

                              prefix = text[
                                  max(0, i - 80):i
                              ]

                              if re.search(
                                  r'\bfun\s*$',
                                  prefix
                              ):

                                  output.append(
                                      text[i:j + 1]
                                  )

                                  i = j + 1
                                  continue

                              # ------------------------------------
                              # Actual btn(...) call
                              # ------------------------------------

                              close = matching_paren(
                                  text,
                                  j
                              )

                              if close is None:
                                  raise SystemExit(
                                      f"ERROR: Cannot parse btn() call in {path}"
                                  )

                              call_body = text[
                                  j + 1:
                                  close
                              ]

                              original_body = call_body

                              # ------------------------------------
                              # FIX A:
                              # title= -> label=
                              #
                              # Only inside actual btn() call.
                              # ------------------------------------

                              call_body = re.sub(
                                  r'(?<![A-Za-z0-9_])title(\s*=)',
                                  r'label\1',
                                  call_body
                              )

                              if call_body != original_body:

                                  count = len(
                                      re.findall(
                                          r'(?<![A-Za-z0-9_])title(\s*=)',
                                          original_body
                                      )
                                  )

                                  title_changes += count

                              # ------------------------------------
                              # FIX B:
                              #
                              # Repair positional Boolean /
                              # Function<Unit> order using the
                              # REAL btn() declaration signature.
                              #
                              # We only touch exactly 3 positional
                              # arguments and only when all three
                              # can be safely classified.
                              # ------------------------------------

                              args = split_top_level(
                                  call_body
                              )

                              has_named = any(
                                  re.match(
                                      r'^[A-Za-z_][A-Za-z0-9_]*\s*=',
                                      arg.strip()
                                  )
                                  for arg in args
                              )

                              if (
                                  len(args) == 3
                                  and
                                  not has_named
                              ):

                                  classified = []

                                  for arg in args:

                                      if looks_like_lambda(arg):
                                          classified.append(
                                              "function"
                                          )

                                      elif looks_like_boolean(arg):
                                          classified.append(
                                              "boolean"
                                          )

                                      elif looks_like_string(arg):
                                          classified.append(
                                              "string"
                                          )

                                      else:
                                          classified.append(
                                              "other"
                                          )

                                  expected = [
                                      kind
                                      for _, kind
                                      in parameter_kinds[:3]
                                  ]

                                  if (
                                      len(expected) == 3
                                      and
                                      all(
                                          x != "other"
                                          for x in classified
                                      )
                                      and
                                      all(
                                          x != "other"
                                          for x in expected
                                      )
                                  ):

                                      # Build argument mapping.
                                      used = set()
                                      reordered = []
                                      possible = True

                                      for want in expected:

                                          found = None

                                          for idx, actual in enumerate(
                                              classified
                                          ):

                                              if (
                                                  idx not in used
                                                  and
                                                  actual == want
                                              ):
                                                  found = idx
                                                  break

                                          if found is None:
                                              possible = False
                                              break

                                          used.add(found)
                                          reordered.append(
                                              args[found]
                                          )

                                      if (
                                          possible
                                          and
                                          reordered != args
                                      ):

                                          args = reordered

                                          call_body = ",\n".join(
                                              args
                                          )

                                          order_changes += 1

                              if (
                                  call_body
                                  != original_body
                              ):

                                  changes += 1

                              output.append(
                                  text[cursor:i]
                              )

                              output.append(
                                  "btn("
                              )

                              output.append(
                                  call_body
                              )

                              output.append(
                                  ")"
                              )

                              cursor = close + 1
                              i = close + 1

                              continue

                  i += 1

              output.append(
                  text[cursor:]
              )

              new_text = "".join(output)

              if new_text != text:

                  path.write_text(
                      new_text,
                      encoding="utf-8"
                  )

              return (
                  changes,
                  title_changes,
                  order_changes
              )


          total_changes = 0
          total_titles = 0
          total_orders = 0

          for path in ROOT.rglob("*.kt"):

              c, t, o = process_file(path)

              if c or t or o:

                  print("")
                  print(
                      "PATCHED:",
                      path
                  )

                  print(
                      "  btn call changes:",
                      c
                  )

                  print(
                      "  title -> label:",
                      t
                  )

                  print(
                      "  argument order:",
                      o
                  )

              total_changes += c
              total_titles += t
              total_orders += o


          print("")
          print("==============================================")
          print("SAFE btn() REPAIR SUMMARY")
          print("==============================================")
          print(
              "TOTAL btn CALL CHANGES:",
              total_changes
          )
          print(
              "TOTAL title -> label FIXES:",
              total_titles
          )
          print(
              "TOTAL BOOLEAN/FUNCTION ORDER FIXES:",
              total_orders
          )


          # --------------------------------------------------------
          # Verify declaration itself was NOT modified by our repair.
          # --------------------------------------------------------

          after = main_file.read_text(
              encoding="utf-8"
          )

          after_decl_match = re.search(
              r'\bfun\s+btn\s*\(',
              after
          )

          if not after_decl_match:
              raise SystemExit(
                  "ERROR: fun btn(...) declaration disappeared."
              )

          after_open = after.find(
              "(",
              after_decl_match.start()
          )

          after_close = matching_paren(
              after,
              after_open
          )

          if after_close is None:
              raise SystemExit(
                  "ERROR: fun btn(...) declaration became malformed."
              )

          after_decl = after[
              after_open + 1:
              after_close
          ]

          if after_decl != declaration_body:

              print("")
              print(
                  "ERROR: btn() DECLARATION CHANGED."
              )

              print("")
              print("ORIGINAL DECLARATION:")
              print(declaration_body)

              print("")
              print("CURRENT DECLARATION:")
              print(after_decl)

              # Restore source if declaration changed.
              shutil.copy2(
                  backup,
                  main_file
              )

              raise SystemExit(
                  "STOP: btn() declaration was changed. "
                  "Source restored from backup."
              )


          # --------------------------------------------------------
          # Final check for actual btn(title=...) calls.
          # --------------------------------------------------------

          final_text = main_file.read_text(
              encoding="utf-8"
          )

          # Do NOT globally search title= because other functions
          # may legitimately have a parameter named title.
          #
          # Instead scan only actual btn() calls again.
          remaining_title = 0

          i = 0
          n = len(final_text)

          while i < n:

              if final_text.startswith(
                  "btn(",
                  i
              ):

                  prefix = final_text[
                      max(0, i - 80):i
                  ]

                  if not re.search(
                      r'\bfun\s*$',
                      prefix
                  ):

                      close = matching_paren(
                          final_text,
                          i + 3
                      )

                      if close is not None:

                          body = final_text[
                              i + 4:
                              close
                          ]

                          if re.search(
                              r'(?<![A-Za-z0-9_])title\s*=',
                              body
                          ):
                              remaining_title += 1

                          i = close + 1
                          continue

              i += 1


          if remaining_title:

              raise SystemExit(
                  "ERROR: btn(title=...) still remains."
              )


          print("")
          print(
              "SAFE btn() COMPILE REPAIR VERIFICATION PASSED."
          )
          PY

          echo ""
          echo "=============================================="
          echo "STARTING RELEASE KOTLIN COMPILATION"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --rerun-tasks \
            :app:compileReleaseKotlin

          echo ""
          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN PASSED"
          echo "=============================================="


      # ============================================================
      # 19. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ASSEMBLE RELEASE APK"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --rerun-tasks \
            :app:assembleRelease

          echo ""
          echo "=============================================="
          echo "ASSEMBLE RELEASE APK PASSED"
          echo "=============================================="


      # ============================================================
      # 20. LOCATE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE RELEASE APK"
          echo "=============================================="

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*release*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: Release APK not found."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "RELEASE APK:"
          ls -lh "$APK"


      # ============================================================
      # 21. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK Package
        shell: bash
        run: |
          set -e

          APK="$APK_PATH"

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging "$APK"
          )

          echo "$BADGING" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          if ! echo "$BADGING" | grep -q \
            "name='$PACKAGE_NAME'"; then

            echo ""
            echo "ERROR: Package name mismatch."
            echo "Expected: $PACKAGE_NAME"

            exit 1
          fi

          echo ""
          echo "PACKAGE NAME VERIFIED."


      # ============================================================
      # 22. PREPARE SIGNING
      # ============================================================

      - name: Prepare Release Signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "=============================================="
          echo "PREPARE RELEASE SIGNING"
          echo "=============================================="

          KEYSTORE_FILE="$RUNNER_TEMP/majdoor-hisaab-release.jks"

          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            echo ""
            echo "PERMANENT SIGNING SECRETS FOUND."

            echo "$KEYSTORE_BASE64" \
              | base64 --decode \
              > "$KEYSTORE_FILE"

            test -s "$KEYSTORE_FILE"

            keytool \
              -list \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              >/dev/null

            echo "RELEASE_SIGNING_MODE=PERMANENT" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

            echo "PERMANENT KEYSTORE VERIFIED."

          else

            echo ""
            echo "Permanent signing secrets not configured."
            echo "Creating temporary JKS."

            TEMP_PASSWORD="$(openssl rand -hex 32)"
            TEMP_ALIAS="majdoor-hisaab-v82"

            rm -f "$KEYSTORE_FILE"

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -storepass "$TEMP_PASSWORD" \
              -keypass "$TEMP_PASSWORD" \
              -alias "$TEMP_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=Majdoor Hisaab PRO, OU=Android, O=Majdoor Hisaab, L=India, ST=Uttar Pradesh, C=IN"

            test -s "$KEYSTORE_FILE"

            keytool \
              -list \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -storepass "$TEMP_PASSWORD" \
              -alias "$TEMP_ALIAS" \
              >/dev/null

            echo "RELEASE_SIGNING_MODE=TEMPORARY" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$TEMP_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"

            echo "TEMPORARY KEYSTORE VERIFIED."

          fi


      # ============================================================
      # 23. VERIFY SIGNING
      # ============================================================

      - name: Verify Signing Environment
        shell: bash
        run: |
          set -e

          test -n "${RELEASE_KEYSTORE:-}"
          test -f "$RELEASE_KEYSTORE"

          test -n "${RELEASE_KEYSTORE_PASSWORD:-}"
          test -n "${RELEASE_KEY_ALIAS:-}"
          test -n "${RELEASE_KEY_PASSWORD:-}"

          keytool \
            -list \
            -keystore "$RELEASE_KEYSTORE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            >/dev/null

          echo ""
          echo "SIGNING ENVIRONMENT VERIFIED."
          echo "SIGNING MODE: ${RELEASE_SIGNING_MODE}"


      # ============================================================
      # 24. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -e

          INPUT_APK="$APK_PATH"
          ALIGNED_APK="$RUNNER_TEMP/$APK_UNSIGNED_NAME"

          rm -f "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          test -f "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c \
            -v \
            4 \
            "$ALIGNED_APK"

          echo "ALIGNED_APK=$ALIGNED_APK" >> "$GITHUB_ENV"

          echo ""
          echo "ZIPALIGN PASSED."


      # ============================================================
      # 25. SIGN APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "SIGN RELEASE APK"
          echo "=============================================="

          SIGNED_APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          rm -f "$SIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RELEASE_KEYSTORE" \
            --ks-type JKS \
            --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass "pass:$RELEASE_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          test -f "$SIGNED_APK"

          echo ""
          echo "SIGNED APK CREATED:"
          ls -lh "$SIGNED_APK"


      # ============================================================
      # 26. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          test -f "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE VERIFIED."


      # ============================================================
      # 27. FINAL APK VALIDATION
      # ============================================================

      - name: Final APK Validation
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FINAL APK VALIDATION"
          echo "=============================================="

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")

          echo ""
          echo "APK SIZE:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo ""
            echo "ERROR: APK size unexpectedly small."
            exit 1
          fi

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging "$APK"
          )

          echo ""
          echo "APK INFORMATION:"

          echo "$BADGING" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          if ! echo "$BADGING" | grep -q \
            "name='$PACKAGE_NAME'"; then

            echo ""
            echo "ERROR: Final APK package mismatch."
            exit 1
          fi

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "=============================================="
          echo "FINAL APK VALIDATION PASSED"
          echo "=============================================="


      # ============================================================
      # 28. UPLOAD FINAL SIGNED APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: ${{ env.APK_SIGNED_NAME }}
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 29. UPLOAD BUILD REPORTS
      # ============================================================

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/**
          if-no-files-found: warn
          retention-days: 14
