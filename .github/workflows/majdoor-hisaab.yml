name: MAJDOOR HISAAB PRO — FINAL APK BUILD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-build
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"
  PROJECT_ZIP: "Majdoor_Hisaab_PRO_FINAL_FIXED_COMPILE_REPAIRED.zip"

jobs:

  build-apk:

    name: BUILD RELEASE APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. VERIFY PROJECT ZIP
      # ============================================================

      - name: Verify project ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "${PROJECT_ZIP}"
          test -s "${PROJECT_ZIP}"

          echo "Project ZIP:"
          ls -lh "${PROJECT_ZIP}"

          unzip -l "${PROJECT_ZIP}" | grep -E \
            'settings\.gradle\.kts|build\.gradle\.kts|app/build\.gradle\.kts|gradlew'

          echo "ZIP CHECK: PASS"

      # ============================================================
      # 3. EXTRACT PROJECT
      # ============================================================

      - name: Extract Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf app gradle scripts

          rm -f \
            settings.gradle.kts \
            build.gradle.kts \
            gradle.properties \
            gradlew \
            gradlew.bat

          unzip -q -o "${PROJECT_ZIP}" -d .

          chmod +x gradlew || true
          chmod +x scripts/*.sh || true

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "PROJECT EXTRACTION: PASS"

      # ============================================================
      # 4. JAVA 17
      # ============================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -Eeuo pipefail

          java -version
          javac -version

      # ============================================================
      # 5. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true
          validate-wrappers: false

      - name: Verify Gradle
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --version

          gradle --version | grep -F \
            "Gradle ${GRADLE_VERSION}"

      # ============================================================
      # 6. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "ANDROID SDK: PASS"

      # ============================================================
      # 7. PATH
      # ============================================================

      - name: Configure Android PATH
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"

          export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/build-tools/${BUILD_TOOLS}:${PATH}"

          adb version
          sdkmanager --version
          apksigner version

      # ============================================================
      # 8. PROJECT STRUCTURE
      # ============================================================

      - name: Verify project structure
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          test -d app/src/main

          grep -q 'versionCode = 77' app/build.gradle.kts
          grep -q 'versionName = "1.77.0"' app/build.gradle.kts

          echo "PROJECT STRUCTURE: PASS"

      # ============================================================
      # 9. USE SYSTEM GRADLE 8.11.1
      # ============================================================

      - name: Prepare Gradle launcher
        shell: bash
        run: |
          set -Eeuo pipefail

          cp gradlew gradlew.original || true

          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -Eeuo pipefail' \
            'exec gradle "$@"' \
            > gradlew

          chmod +x gradlew

          ./gradlew --version | grep -F \
            "Gradle ${GRADLE_VERSION}"

          echo "GRADLE LAUNCHER: PASS"

      # ============================================================
      # 10. LIST GRADLE TASKS
      # ============================================================

      - name: Inspect Gradle tasks
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            tasks \
            --all \
            > gradle-tasks.txt

          cat gradle-tasks.txt

          grep -q "assembleRelease" gradle-tasks.txt

          echo "GRADLE TASK CHECK: PASS"

      # ============================================================
      # 11. CLEAN
      # ============================================================

      - name: Clean project
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean

      # ============================================================
      # 12. COMPILE DEBUG
      # ============================================================

      - name: Compile Debug Kotlin
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugKotlin

      # ============================================================
      # 13. BUILD DEBUG APK
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

          echo "DEBUG APK: PASS"

      # ============================================================
      # 14. COMPILE E2E
      # ============================================================

      - name: Compile E2E Release
        shell: bash
        run: |
          set -Eeuo pipefail

          if ./gradlew tasks --all | grep -q "compileE2eReleaseKotlin"; then

            ./gradlew \
              --no-daemon \
              --stacktrace \
              compileE2eReleaseKotlin

          else

            echo "No E2E Kotlin compilation task."

          fi

      # ============================================================
      # 15. BUILD E2E RELEASE
      # ============================================================

      - name: Build E2E Release
        shell: bash
        run: |
          set -Eeuo pipefail

          if ./gradlew tasks --all | grep -q "assembleE2eRelease"; then

            ./gradlew \
              --no-daemon \
              --stacktrace \
              assembleE2eRelease

          else

            echo "No E2E release variant."

          fi

      # ============================================================
      # 16. COMPILE RELEASE KOTLIN
      # ============================================================

      - name: Compile Release Kotlin
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileReleaseKotlin

      # ============================================================
      # 17. BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          echo "UNSIGNED RELEASE APK:"
          ls -lh "$APK"

          echo "RELEASE BUILD: PASS"

      # ============================================================
      # 18. VERIFY APK
      # ============================================================

      - name: Verify unsigned APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          apkanalyzer \
            manifest application-id \
            "$APK" \
            | grep -Fx "${PACKAGE_NAME}"

          apkanalyzer \
            manifest version-name \
            "$APK" \
            | grep -Fx "${VERSION_NAME}"

          apkanalyzer \
            manifest version-code \
            "$APK" \
            | grep -Fx "${VERSION_CODE}"

          unzip -t "$APK" >/dev/null

          echo "APK METADATA: PASS"

      # ============================================================
      # 19. RESTORE SIGNING KEY
      # ============================================================

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$EXPECTED_CERT"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

          keytool \
            -list \
            -v \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > certificate.txt

          ACTUAL_CERT=$(
            awk -F': ' \
              '/SHA256:/{print $2; exit}' \
              certificate.txt \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )

          EXPECTED_CERT_NORMALIZED=$(
            printf '%s' "$EXPECTED_CERT" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )

          test "$ACTUAL_CERT" = "$EXPECTED_CERT_NORMALIZED"

          echo "SIGNING CERTIFICATE: PASS"

      # ============================================================
      # 20. ZIPALIGN + SIGN
      # ============================================================

      - name: Zipalign and sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p artifacts

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$UNSIGNED"

          zipalign \
            -f \
            -p \
            4 \
            "$UNSIGNED" \
            "$ALIGNED"

          zipalign \
            -c \
            -v \
            4 \
            "$ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          test -s "$SIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$SIGNED" \
            | tee artifacts/release-signature.txt

          ACTUAL_CERT=$(
            apksigner verify \
              --print-certs \
              "$SIGNED" \
              | awk -F': ' \
                '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )

          EXPECTED_CERT_NORMALIZED=$(
            printf '%s' "$EXPECTED_CERT" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )

          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT_NORMALIZED"

          echo "APK SIGNING: PASS"

      # ============================================================
      # 21. FINAL SIGNED APK CHECK
      # ============================================================

      - name: Verify final signed APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$APK"

          apkanalyzer \
            manifest application-id \
            "$APK" \
            | grep -Fx "${PACKAGE_NAME}"

          apkanalyzer \
            manifest version-name \
            "$APK" \
            | grep -Fx "${VERSION_NAME}"

          apkanalyzer \
            manifest version-code \
            "$APK" \
            | grep -Fx "${VERSION_CODE}"

          apksigner verify \
            --verbose \
            --print-certs \
            "$APK"

          zipalign \
            -c \
            -v \
            4 \
            "$APK"

          unzip -t "$APK" >/dev/null

          sha256sum "$APK" \
            | tee artifacts/Majdoor-Hisaab-PRO-release.sha256

          echo "FINAL APK CHECK: PASS"

      # ============================================================
      # 22. UPLOAD APK
      # ============================================================

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-release
          path: |
            artifacts/Majdoor-Hisaab-PRO-release.apk
            artifacts/Majdoor-Hisaab-PRO-release.sha256
            artifacts/release-signature.txt
          if-no-files-found: error
          compression-level: 6

      # ============================================================
      # 23. BUILD SUMMARY
      # ============================================================

      - name: Final build summary
        shell: bash
        run: |
          echo "=================================================="
          echo " MAJDOOR HISAAB PRO"
          echo " FINAL RELEASE BUILD"
          echo "=================================================="
          echo ""
          echo "Package : ${PACKAGE_NAME}"
          echo "Version : ${VERSION_NAME}"
          echo "Code    : ${VERSION_CODE}"
          echo ""
          echo "APK:"
          ls -lh artifacts/Majdoor-Hisaab-PRO-release.apk
          echo ""
          echo "SHA256:"
          cat artifacts/Majdoor-Hisaab-PRO-release.sha256
          echo ""
          echo "=================================================="
          echo "BUILD + SIGN + VERIFY : PASS"
          echo "=================================================="
