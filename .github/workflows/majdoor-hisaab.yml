      Build FINAL Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # ============================================================
          # FIX 1
          # android.os.Build import
          # ============================================================

          if "import android.os.Build" not in text:

              marker = "import android.os.Bundle"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: android.os.Bundle import not found"
                  )

              text = text.replace(
                  marker,
                  "import android.os.Build\n" + marker,
                  1
              )

          # ============================================================
          # FIX 2
          # '/day' is a String, not a Kotlin Char
          # ============================================================

          text = text.replace(
              "'/day'",
              '"/day"'
          )

          # ============================================================
          # FIX 3
          # renderFieldGrid rows must be var
          # ============================================================

          render_start = text.find(
              "private fun renderFieldGrid(grid:LinearLayout,q:String)"
          )

          if render_start == -1:
              raise SystemExit(
                  "ERROR: renderFieldGrid() not found"
              )

          render_end = text.find(
              "\n    private fun fieldDialog",
              render_start
          )

          if render_end == -1:
              raise SystemExit(
                  "ERROR: fieldDialog() marker not found"
              )

          render_block = text[
              render_start:render_end
          ]

          render_block = render_block.replace(
              "val rows=LinearLayout(this);",
              "var rows=LinearLayout(this);",
              1
          )

          text = (
              text[:render_start]
              + render_block
              + text[render_end:]
          )

          # ============================================================
          # FIX 4
          #
          # Find ONLY real Kotlin character literals.
          #
          # IMPORTANT:
          # Do NOT use a global regex because Kotlin strings can contain
          # apostrophes such as:
          #
          # ",'"
          # "'abc'"
          # "LIKE '%x%'"
          #
          # Those are Strings and must NOT be modified.
          #
          # This scanner skips:
          # - normal Kotlin strings
          # - triple quoted strings
          # - line comments
          # - block comments
          #
          # It changes only an actual invalid Char literal such as:
          #
          # 'abc'   -> "abc"
          #
          # Valid:
          #
          # ','     stays ','
          # ' '     stays ' '
          # '\n'    stays '\n'
          # '\u0041' stays '\u0041'
          # ============================================================

          def valid_kotlin_char_content(value):

              if len(value) == 1:
                  return True

              if value.startswith("\\"):

                  # Standard Kotlin escape:
                  # \b \t \n \r \' \" \\ $
                  if len(value) == 2:
                      return True

                  # Unicode escape:
                  # \uXXXX
                  if (
                      len(value) == 6
                      and value[1] == "u"
                      and all(
                          c in "0123456789abcdefABCDEF"
                          for c in value[2:]
                      )
                  ):
                      return True

              return False

          replacements = []

          i = 0
          n = len(text)

          NORMAL = 0
          STRING = 1
          TRIPLE_STRING = 2
          LINE_COMMENT = 3
          BLOCK_COMMENT = 4

          state = NORMAL

          while i < n:

              # --------------------------------------------------------
              # NORMAL Kotlin code
              # --------------------------------------------------------

              if state == NORMAL:

                  # Line comment
                  if text.startswith("//", i):
                      state = LINE_COMMENT
                      i += 2
                      continue

                  # Block comment
                  if text.startswith("/*", i):
                      state = BLOCK_COMMENT
                      i += 2
                      continue

                  # Triple quoted Kotlin string
                  if text.startswith('"""', i):
                      state = TRIPLE_STRING
                      i += 3
                      continue

                  # Normal Kotlin string
                  if text[i] == '"':
                      state = STRING
                      i += 1
                      continue

                  # Possible Kotlin Char literal
                  if text[i] == "'":

                      start = i
                      j = i + 1
                      escaped = False

                      while j < n:

                          ch = text[j]

                          if escaped:
                              escaped = False
                              j += 1
                              continue

                          if ch == "\\":
                              escaped = True
                              j += 1
                              continue

                          if ch == "'":
                              break

                          if ch in "\r\n":
                              break

                          j += 1

                      # Closing quote found
                      if j < n and text[j] == "'":

                          value = text[
                              start + 1:j
                          ]

                          if not valid_kotlin_char_content(value):

                              replacements.append(
                                  (
                                      start,
                                      j + 1,
                                      '"' + value + '"'
                                  )
                              )

                          i = j + 1
                          continue

                  i += 1
                  continue

              # --------------------------------------------------------
              # Normal String
              # --------------------------------------------------------

              if state == STRING:

                  if text[i] == "\\":

                      i += 2
                      continue

                  if text[i] == '"':
                      state = NORMAL
                      i += 1
                      continue

                  i += 1
                  continue

              # --------------------------------------------------------
              # Triple quoted String
              # --------------------------------------------------------

              if state == TRIPLE_STRING:

                  if text.startswith('"""', i):
                      state = NORMAL
                      i += 3
                      continue

                  i += 1
                  continue

              # --------------------------------------------------------
              # Line comment
              # --------------------------------------------------------

              if state == LINE_COMMENT:

                  if text[i] in "\r\n":
                      state = NORMAL

                  i += 1
                  continue

              # --------------------------------------------------------
              # Block comment
              # --------------------------------------------------------

              if state == BLOCK_COMMENT:

                  if text.startswith("*/", i):
                      state = NORMAL
                      i += 2
                      continue

                  i += 1
                  continue

          # Apply replacements backwards so offsets stay correct.

          for start, end, replacement in reversed(
              replacements
          ):

              text = (
                  text[:start]
                  + replacement
                  + text[end:]
              )

          # ============================================================
          # FIX 5
          # Integer Hotspot coordinates -> Float
          # ============================================================

          import re

          hotspot_pattern = re.compile(
              r'Hotspot\((.*?),(-?\d+),(-?\d+),(-?\d+),(-?\d+)(?=\))'
          )

          hotspot_count = [0]

          def fix_hotspot(match):

              hotspot_count[0] += 1

              return (
                  f"Hotspot({match.group(1)},"
                  f"{match.group(2)}f,"
                  f"{match.group(3)}f,"
                  f"{match.group(4)}f,"
                  f"{match.group(5)}f"
              )

          text = hotspot_pattern.sub(
              fix_hotspot,
              text
          )

          # ============================================================
          # WRITE SOURCE
          # ============================================================

          path.write_text(
              text,
              encoding="utf-8"
          )

          # ============================================================
          # FINAL VALIDATION
          # ============================================================

          final_text = path.read_text(
              encoding="utf-8"
          )

          # Build import
          if "import android.os.Build" not in final_text:
              raise SystemExit(
                  "ERROR: android.os.Build import missing"
              )

          # /day
          if "'/day'" in final_text:
              raise SystemExit(
                  "ERROR: '/day' remains"
              )

          # renderFieldGrid
          render_start = final_text.find(
              "private fun renderFieldGrid(grid:LinearLayout,q:String)"
          )

          render_end = final_text.find(
              "\n    private fun fieldDialog",
              render_start
          )

          if render_start == -1 or render_end == -1:
              raise SystemExit(
                  "ERROR: renderFieldGrid validation range not found"
              )

          render_block = final_text[
              render_start:render_end
          ]

          if "val rows=LinearLayout(this);" in render_block:
              raise SystemExit(
                  "ERROR: renderFieldGrid rows is still val"
              )

          if "var rows=LinearLayout(this);" not in render_block:
              raise SystemExit(
                  "ERROR: renderFieldGrid rows var missing"
              )

          # ============================================================
          # Re-scan for INVALID real Char literals.
          #
          # This uses the same Kotlin-aware scanner logic.
          # It does NOT inspect apostrophes inside Strings/comments.
          # ============================================================

          invalid_found = []

          i = 0
          n = len(final_text)

          state = NORMAL

          while i < n:

              if state == NORMAL:

                  if final_text.startswith("//", i):
                      state = LINE_COMMENT
                      i += 2
                      continue

                  if final_text.startswith("/*", i):
                      state = BLOCK_COMMENT
                      i += 2
                      continue

                  if final_text.startswith('"""', i):
                      state = TRIPLE_STRING
                      i += 3
                      continue

                  if final_text[i] == '"':
                      state = STRING
                      i += 1
                      continue

                  if final_text[i] == "'":

                      start = i
                      j = i + 1
                      escaped = False

                      while j < n:

                          ch = final_text[j]

                          if escaped:
                              escaped = False
                              j += 1
                              continue

                          if ch == "\\":
                              escaped = True
                              j += 1
                              continue

                          if ch == "'":
                              break

                          if ch in "\r\n":
                              break

                          j += 1

                      if j < n and final_text[j] == "'":

                          value = final_text[
                              start + 1:j
                          ]

                          if not valid_kotlin_char_content(value):

                              invalid_found.append(
                                  final_text[start:j + 1]
                              )

                          i = j + 1
                          continue

                  i += 1
                  continue

              if state == STRING:

                  if final_text[i] == "\\":
                      i += 2
                      continue

                  if final_text[i] == '"':
                      state = NORMAL

                  i += 1
                  continue

              if state == TRIPLE_STRING:

                  if final_text.startswith('"""', i):
                      state = NORMAL
                      i += 3
                      continue

                  i += 1
                  continue

              if state == LINE_COMMENT:

                  if final_text[i] in "\r\n":
                      state = NORMAL

                  i += 1
                  continue

              if state == BLOCK_COMMENT:

                  if final_text.startswith("*/", i):
                      state = NORMAL
                      i += 2
                      continue

                  i += 1
                  continue

          if invalid_found:

              raise SystemExit(
                  "ERROR: Invalid Kotlin character literal remains: "
                  + repr(invalid_found[:10])
              )

          # No integer Hotspot coordinates
          if hotspot_pattern.search(final_text):

              raise SystemExit(
                  "ERROR: Integer Hotspot coordinates remain"
              )

          print(
              "BUILD SOURCE FIX PASS"
          )

          print(
              "Invalid real Kotlin Char literals fixed:",
              len(replacements)
          )

          print(
              "Integer Hotspot coordinate groups fixed:",
              hotspot_count[0]
          )

          print(
              "BUILD SOURCE FINAL CHECK PASS"
          )
          PY

          # ============================================================
          # ACTUAL RELEASE BUILD
          # ============================================================

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "FINAL RELEASE APK CREATED"

          ls -lh "$APK"
