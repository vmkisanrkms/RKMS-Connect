name: Build Final Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-release-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Final Release APK
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. Java 17
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ------------------------------------------------------------
      # 3. Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ------------------------------------------------------------
      # 4. Install exact Android SDK components
      # ------------------------------------------------------------
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ------------------------------------------------------------
      # 5. Verify project structure
      # ------------------------------------------------------------
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          test -f "settings.gradle.kts"
          test -f "build.gradle.kts"
          test -f "gradle.properties"

          test -f "app/build.gradle.kts"
          test -f "app/src/main/AndroidManifest.xml"
          test -f "app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          test -f "gradlew"
          test -f "gradle/wrapper/gradle-wrapper.jar"
          test -f "gradle/wrapper/gradle-wrapper.properties"

          echo "Project structure: PASS"

      # ------------------------------------------------------------
      # 6. Verify Gradle wrapper
      # ------------------------------------------------------------
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          grep -q \
            "gradle-8.11.1-bin.zip" \
            gradle/wrapper/gradle-wrapper.properties

          grep -q \
            "f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6" \
            gradle/wrapper/gradle-wrapper.properties

          ./gradlew --version

          ./gradlew --version | grep -q "Gradle 8.11.1"

          echo "Gradle wrapper: PASS"

      # ------------------------------------------------------------
      # 7. Verify Android / Kotlin configuration
      # ------------------------------------------------------------
      - name: Verify build configuration
        shell: bash
        run: |
          set -euo pipefail

          APP="app/build.gradle.kts"

          grep -q 'compileSdk = 35' "$APP"
          grep -q 'targetSdk = 35' "$APP"
          grep -q 'minSdk = 26' "$APP"

          grep -q 'versionCode = 30' "$APP"
          grep -q 'versionName = "2.10"' "$APP"

          grep -q 'JavaVersion.VERSION_17' "$APP"
          grep -q 'jvmTarget = "17"' "$APP"

          grep -q 'applicationId = "com.majdoor.hisaab"' "$APP"
          grep -q 'namespace = "com.majdoor.hisaab"' "$APP"

          grep -q 'com.android.application.*8.9.1' build.gradle.kts
          grep -q 'org.jetbrains.kotlin.android.*2.1.20' build.gradle.kts

          echo "Build configuration: PASS"

      # ------------------------------------------------------------
      # 8. Verify Android manifest
      # ------------------------------------------------------------
      - name: Verify Android manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"

          grep -q 'com.majdoor.hisaab' "$MANIFEST"
          grep -q 'android:name=".MainActivity"' "$MANIFEST"
          grep -q 'android:exported="true"' "$MANIFEST"
          grep -q 'android.intent.action.MAIN' "$MANIFEST"
          grep -q 'android.intent.category.LAUNCHER' "$MANIFEST"

          echo "Android manifest: PASS"

      # ------------------------------------------------------------
      # 9. Verify release signing secrets
      # ------------------------------------------------------------
      - name: Verify release signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

          echo "Release signing secrets: PRESENT"

      # ------------------------------------------------------------
      # 10. Restore permanent release keystore
      # ------------------------------------------------------------
      - name: Restore permanent release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

          test -s release.keystore

          {
            echo "releaseStoreFile=$GITHUB_WORKSPACE/release.keystore"
            echo "releaseStorePassword=$RELEASE_KEYSTORE_PASSWORD"
            echo "releaseKeyAlias=$RELEASE_KEY_ALIAS"
            echo "releaseKeyPassword=$RELEASE_KEY_PASSWORD"
          } >> gradle.properties

          echo "Release keystore restored"

      # ------------------------------------------------------------
      # 11. Clean old build outputs
      # ------------------------------------------------------------
      - name: Clean previous build outputs
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean --no-daemon

          rm -rf app/build/outputs/apk
          rm -rf app/build/outputs/bundle

      # ------------------------------------------------------------
      # 12. Build RELEASE APK ONLY
      # ------------------------------------------------------------
      - name: Build Release APK only
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------------
      # 13. Verify APK exists
      # ------------------------------------------------------------
      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          echo "Release APK found:"
          ls -lh "$APK"

      # ------------------------------------------------------------
      # 14. Verify APK ZIP integrity
      # ------------------------------------------------------------
      - name: Verify APK integrity
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          unzip -t "$APK" >/dev/null

          echo "APK ZIP integrity: PASS"

      # ------------------------------------------------------------
      # 15. Make sure DEBUG APK was NOT built
      # ------------------------------------------------------------
      - name: Verify no debug APK
        shell: bash
        run: |
          set -euo pipefail

          if find app/build/outputs/apk \
            -type f \
            -name "*debug*.apk" \
            | grep -q .; then

            echo "ERROR: Debug APK detected."
            find app/build/outputs/apk -type f -name "*debug*.apk"
            exit 1
          fi

          echo "Debug APK: NOT PRESENT"

      # ------------------------------------------------------------
      # 16. Make sure AAB was NOT built
      # ------------------------------------------------------------
      - name: Verify no AAB
        shell: bash
        run: |
          set -euo pipefail

          if find app/build/outputs \
            -type f \
            \( -name "*.aab" -o -name "*.aab.zip" \) \
            | grep -q .; then

            echo "ERROR: AAB detected."
            find app/build/outputs \
              -type f \
              \( -name "*.aab" -o -name "*.aab.zip" \)
            exit 1
          fi

          echo "AAB: NOT PRESENT"

      # ------------------------------------------------------------
      # 17. Verify APK package / version
      # ------------------------------------------------------------
      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -x "$AAPT"

          BADGING="$($AAPT dump badging "$APK")"

          echo "$BADGING"

          echo "$BADGING" | grep -q \
            "package: name='com.majdoor.hisaab'"

          echo "$BADGING" | grep -q \
            "versionCode='30'"

          echo "$BADGING" | grep -q \
            "versionName='2.10'"

          echo "Package/version verification: PASS"

      # ------------------------------------------------------------
      # 18. Verify APK signature
      # ------------------------------------------------------------
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"

          "$APKSIGNER" verify --print-certs "$APK"

          echo "APK signature: PASS"

      # ------------------------------------------------------------
      # 19. Verify APK contains release build
      # ------------------------------------------------------------
      - name: Verify release artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          case "$APK" in
            */release/*)
              echo "Correct release APK path"
              ;;
            *)
              echo "ERROR: APK is not in release directory"
              exit 1
              ;;
          esac

      # ------------------------------------------------------------
      # 20. Generate SHA-256
      # ------------------------------------------------------------
      - name: Generate APK SHA-256
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          sha256sum "$APK" | tee release-apk-sha256.txt

      # ------------------------------------------------------------
      # 21. Upload ONLY final release APK
      # ------------------------------------------------------------
      - name: Upload FINAL Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-v2.10-FINAL-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 22. Upload SHA-256 separately
      # ------------------------------------------------------------
      - name: Upload APK SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-v2.10-SHA256
          path: release-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
