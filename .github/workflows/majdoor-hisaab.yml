name: MAJDOOR HISAAB PRO - V99 FINAL RELEASE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-v99-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  GRADLE_VERSION: "8.11.1"

jobs:

  # ============================================================
  # 1. SOURCE + UNIT TEST
  # ============================================================
  test:
    name: Source and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Java
        run: java -version

      - name: Verify Gradle
        run: gradle --version

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Validate Gradle Wrapper
        run: ./gradlew --version

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon --stacktrace

  # ============================================================
  # 2. RELEASE BUILD
  # ============================================================
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "emulator" \
            "system-images;android-${ANDROID_API};google_apis;x86_64"

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Dependency Check
        run: ./gradlew dependencies --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ----------------------------------------------------------
      # Production signing
      # ----------------------------------------------------------
      - name: Create Production Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret missing"
            exit 1
          }

          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

          test -s release.keystore || {
            echo "ERROR: Keystore creation failed"
            exit 1
          }

      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          APK=$(find . -type f \
            -path "*/build/outputs/apk/release/*-release-unsigned.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            APK=$(find . -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              | head -1)
          fi

          test -n "$APK" || {
            echo "ERROR: Release APK not found"
            exit 1
          }

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$BUILD_TOOLS"

          "$BUILD_TOOLS_DIR/zipalign" \
            -f -p 4 \
            "$APK" \
            aligned-release.apk

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out Majdoor-Hisaab-PRO-V99-release.apk \
            aligned-release.apk

      - name: Verify APK Signature
        run: |
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify \
            --verbose \
            Majdoor-Hisaab-PRO-V99-release.apk

      - name: APK SHA256
        run: |
          sha256sum Majdoor-Hisaab-PRO-V99-release.apk \
            | tee Majdoor-Hisaab-PRO-V99-release.apk.sha256

      - name: APK Information
        run: |
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging \
            Majdoor-Hisaab-PRO-V99-release.apk

      # ----------------------------------------------------------
      # Upload APK
      # ----------------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MAJDOOR-HISAAB-PRO-V99-RELEASE
          path: |
            Majdoor-Hisaab-PRO-V99-release.apk
            Majdoor-Hisaab-PRO-V99-release.apk.sha256

  # ============================================================
  # 3. API 36 EMULATOR TEST
  # ============================================================
  runtime:
    name: Android 36 Runtime Tests
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: MAJDOOR-HISAAB-PRO-V99-RELEASE

      - name: Create Emulator
        run: |
          echo "no" | avdmanager create avd \
            -n v99_api36 \
            -k "system-images;android-36;google_apis;x86_64" \
            --device "pixel_2"

      - name: Start Emulator
        run: |
          nohup emulator \
            -avd v99_api36 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            > emulator.log 2>&1 &

          adb wait-for-device

          timeout 300 bash -c '
            until adb shell getprop sys.boot_completed | grep -m 1 "1"; do
              sleep 5
            done
          '

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      # ----------------------------------------------------------
      # Fresh install
      # ----------------------------------------------------------
      - name: Fresh Install
        run: |
          adb uninstall org.majdoor.hisaab.pro || true
          adb install -r Majdoor-Hisaab-PRO-V99-release.apk

      - name: Verify Installed Package
        run: |
          adb shell pm path org.majdoor.hisaab.pro

      # ----------------------------------------------------------
      # Launch test
      # ----------------------------------------------------------
      - name: Launch Test
        run: |
          adb shell monkey \
            -p org.majdoor.hisaab.pro \
            1

          sleep 10

          adb shell pidof org.majdoor.hisaab.pro

      # ----------------------------------------------------------
      # Crash / logcat
      # ----------------------------------------------------------
      - name: Crash and Logcat Test
        run: |
          adb logcat -d > logcat.txt

          if grep -E \
            "FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: org.majdoor.hisaab.pro" \
            logcat.txt; then
            echo "FATAL CRASH FOUND"
            exit 1
          fi

      # ----------------------------------------------------------
      # Force stop / relaunch
      # ----------------------------------------------------------
      - name: Force Stop and Relaunch
        run: |
          adb shell am force-stop org.majdoor.hisaab.pro
          sleep 2

          adb shell monkey \
            -p org.majdoor.hisaab.pro \
            1

          sleep 8

          adb shell pidof org.majdoor.hisaab.pro

      # ----------------------------------------------------------
      # Rotation
      # ----------------------------------------------------------
      - name: Rotation Test
        run: |
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          sleep 3
          adb shell settings put system user_rotation 0
          sleep 3

      # ----------------------------------------------------------
      # Offline test
      # ----------------------------------------------------------
      - name: Offline Test
        run: |
          adb shell svc wifi disable
          adb shell svc data disable

          sleep 5

          adb shell monkey \
            -p org.majdoor.hisaab.pro \
            1

          sleep 8

          adb shell pidof org.majdoor.hisaab.pro

          adb shell svc wifi enable
          adb shell svc data enable

      # ----------------------------------------------------------
      # Reboot persistence
      # ----------------------------------------------------------
      - name: Reboot Persistence Test
        run: |
          adb reboot
          adb wait-for-device

          timeout 300 bash -c '
            until adb shell getprop sys.boot_completed | grep -m 1 "1"; do
              sleep 5
            done
          '

          adb shell monkey \
            -p org.majdoor.hisaab.pro \
            1

          sleep 8

          adb shell pidof org.majdoor.hisaab.pro

      # ----------------------------------------------------------
      # Final crash scan
      # ----------------------------------------------------------
      - name: Final Crash Scan
        run: |
          adb logcat -d > final-logcat.txt

          if grep -E \
            "FATAL EXCEPTION|AndroidRuntime.*FATAL" \
            final-logcat.txt; then
            exit 1
          fi

      - name: Upload Runtime Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V99-runtime-logs
          path: |
            emulator.log
            logcat.txt
            final-logcat.txt

  # ============================================================
  # 4. FINAL RELEASE GATE
  # ============================================================
  final-gate:
    name: FINAL RELEASE GATE
    runs-on: ubuntu-latest
    needs:
      - test
      - release
      - runtime

    steps:
      - name: FINAL PASS
        run: |
          echo "=========================================="
          echo " MAJDOOR HISAAB PRO V99"
          echo " FINAL RELEASE GATE"
          echo "=========================================="
          echo ""
          echo "Unit Tests       : PASS"
          echo "Release Build    : PASS"
          echo "Signing          : PASS"
          echo "APK Validation   : PASS"
          echo "Fresh Install    : PASS"
          echo "Launch           : PASS"
          echo "Crash Scan       : PASS"
          echo "Force Stop       : PASS"
          echo "Offline          : PASS"
          echo "Reboot           : PASS"
          echo "Rotation         : PASS"
          echo ""
          echo "=========================================="
          echo " 541-566 RUNTIME RELEASE GATE = PASS"
          echo "=========================================="
