name: Majdoor Hisaab - Final Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"

  SOURCE_ZIP: "Majdoor_Hisaab_v1_1_source.zip"

jobs:
  build-release-apk:
    name: Build Final Release APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android API 35
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK packages installed successfully."


      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          command -v adb
          command -v sdkmanager

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" version
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" version

          adb version
          sdkmanager --version

          echo "Android SDK verification: PASS"


      # ============================================================
      # SOURCE ZIP
      # ============================================================

      - name: Locate Majdoor Hisaab source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected source ZIP:"
          echo "$SOURCE_ZIP"

          if [ ! -f "$SOURCE_ZIP" ]; then

            FOUND_ZIP="$(
              find . \
                -type f \
                -name "$SOURCE_ZIP" \
                -print -quit || true
            )"

            if [ -z "$FOUND_ZIP" ]; then

              echo "ERROR: Source ZIP not found."

              echo ""
              echo "Available ZIP files:"
              find . \
                -type f \
                -iname "*.zip" \
                -print || true

              exit 1
            fi

            cp "$FOUND_ZIP" "./$SOURCE_ZIP"

          fi

          test -f "$SOURCE_ZIP"

          echo ""
          echo "SOURCE ZIP FOUND:"
          ls -lh "$SOURCE_ZIP"


      # ============================================================
      # EXTRACT SOURCE
      # ============================================================

      - name: Extract Majdoor Hisaab source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-source

          mkdir -p build-source

          unzip -q \
            "$SOURCE_ZIP" \
            -d build-source

          echo "Source ZIP extracted."

          echo ""
          echo "Extracted structure:"
          find build-source \
            -maxdepth 6 \
            -type f | sort | head -300


      # ============================================================
      # LOCATE ANDROID PROJECT
      # ============================================================

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          PROJECT_DIR="$(
            find build-source \
              -type f \
              -name "settings.gradle.kts" \
              -print -quit \
              | xargs -r dirname
          )"

          if [ -z "$PROJECT_DIR" ]; then

            PROJECT_DIR="$(
              find build-source \
                -type f \
                -name "settings.gradle" \
                -print -quit \
                | xargs -r dirname
            )

          fi

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Android project नहीं मिला."

            find build-source \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print

            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Project directory:"
          pwd

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then

            echo "ERROR: settings.gradle(.kts) नहीं मिला."
            exit 1

          fi

          if [ ! -d "app" ]; then

            echo "ERROR: app directory नहीं मिला."
            exit 1

          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then

            echo "ERROR: app/build.gradle(.kts) नहीं मिला."
            exit 1

          fi

          echo "Android project verification: PASS"


      # ============================================================
      # GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          GRADLE_VERSION_FOUND="$(
            gradle --version \
              | grep '^Gradle ' \
              | awk '{print $2}'
          )"

          echo "Gradle version: $GRADLE_VERSION_FOUND"

          test "$GRADLE_VERSION_FOUND" = "8.11.1"

          echo "Gradle 8.11.1 verification: PASS"


      # ============================================================
      # FIX MAINACTIVITY
      # ============================================================

      - name: Fix MainActivity onCreate
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="$(
            find . \
              -type f \
              -name "MainActivity.kt" \
              -print -quit || true
          )"

          if [ -z "$MAIN_ACTIVITY" ]; then

            echo "MainActivity.kt नहीं मिली."

          else

            echo "MainActivity:"
            echo "$MAIN_ACTIVITY"

            python3 - "$MAIN_ACTIVITY" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # Already correct
          if re.search(
              r'\boverride\s+fun\s+onCreate\s*\(',
              text
          ):
              print("onCreate already has override.")

          else:

              pattern = (
                  r'(?m)^(\s*)'
                  r'(?:(public|protected)\s+)?'
                  r'fun\s+onCreate\s*\('
              )

              def replace(match):

                  indent = match.group(1)
                  visibility = match.group(2)

                  if visibility:
                      return (
                          indent +
                          visibility +
                          " override fun onCreate("
                      )

                  return (
                      indent +
                      "override fun onCreate("
                  )

              new_text, count = re.subn(
                  pattern,
                  replace,
                  text,
                  count=1
              )

              if count == 0:

                  print(
                      "WARNING: onCreate() नहीं मिला."
                  )

              else:

                  path.write_text(new_text)

                  print(
                      "onCreate override added."
                  )
          PY

            echo ""
            echo "onCreate check:"
            grep -n \
              -A4 \
              -B2 \
              "onCreate" \
              "$MAIN_ACTIVITY" || true

          fi


      # ============================================================
      # FINAL JAVA/KOTLIN JVM FIX
      #
      # IMPORTANT:
      # options.release.set(17) नहीं लगाना है।
      # Android Gradle Plugin के साथ यह गलत है।
      #
      # JavaCompile:
      # sourceCompatibility = 17
      # targetCompatibility = 17
      #
      # Kotlin:
      # jvmTarget = 17
      # ============================================================

      - name: Fix Android Java and Kotlin JVM targets
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FIXING ANDROID JVM TARGETS"
          echo "=========================================="

          if [ -f "app/build.gradle.kts" ]; then

            python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          print("Patching:", p)

          # --------------------------------------------------
          # Java 8 -> Java 17
          # --------------------------------------------------

          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          s = s.replace(
              "JavaVersion.VERSION_8",
              "JavaVersion.VERSION_17"
          )

          # --------------------------------------------------
          # Kotlin 1.8 / 8 -> 17
          # --------------------------------------------------

          s = re.sub(
              r'jvmTarget\s*=\s*["\']1\.8["\']',
              'jvmTarget = "17"',
              s
          )

          s = re.sub(
              r'jvmTarget\s*=\s*["\']8["\']',
              'jvmTarget = "17"',
              s
          )

          # --------------------------------------------------
          # Ensure compileOptions
          # --------------------------------------------------

          if "compileOptions" not in s:

              android_match = re.search(
                  r'(?m)^android\s*\{',
                  s
              )

              if android_match:

                  insert = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

          """

                  pos = android_match.end()

                  s = (
                      s[:pos] +
                      "\n" +
                      insert +
                      s[pos:]
                  )

          # --------------------------------------------------
          # Ensure Kotlin target
          # --------------------------------------------------

          if "jvmTarget" not in s:

              s += """

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          """

          p.write_text(s)

          print("build.gradle.kts patched successfully.")
          PY

          else

            if [ ! -f "app/build.gradle" ]; then
              echo "ERROR: app/build.gradle(.kts) नहीं मिला."
              exit 1
            fi

            python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          s = p.read_text()

          print("Patching:", p)

          # --------------------------------------------------
          # Java 8 -> Java 17
          # --------------------------------------------------

          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          s = s.replace(
              "JavaVersion.VERSION_8",
              "JavaVersion.VERSION_17"
          )

          # --------------------------------------------------
          # Kotlin 1.8 / 8 -> 17
          # --------------------------------------------------

          s = re.sub(
              r'jvmTarget\s*=\s*["\']1\.8["\']',
              'jvmTarget = "17"',
              s
          )

          s = re.sub(
              r'jvmTarget\s*=\s*["\']8["\']',
              'jvmTarget = "17"',
              s
          )

          # --------------------------------------------------
          # Ensure compileOptions
          # --------------------------------------------------

          if "compileOptions" not in s:

              android_match = re.search(
                  r'(?m)^android\s*\{',
                  s
              )

              if android_match:

                  insert = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

          """

                  pos = android_match.end()

                  s = (
                      s[:pos] +
                      "\n" +
                      insert +
                      s[pos:]
                  )

          # --------------------------------------------------
          # Ensure Kotlin target
          # --------------------------------------------------

          if "jvmTarget" not in s:

              s += """

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          """

          p.write_text(s)

          print("build.gradle patched successfully.")
          PY

          fi

          echo ""
          echo "=========================================="
          echo "FINAL JVM SETTINGS"
          echo "=========================================="

          grep -nEi \
            "compileOptions|sourceCompatibility|targetCompatibility|jvmTarget|VERSION_1_8|VERSION_8|VERSION_17|options.release" \
            app/build.gradle* \
            || true

          echo ""
          echo "Checking for forbidden Java 1.8 / --release settings..."

          if grep -RniE \
            "VERSION_1_8|VERSION_8|jvmTarget.*1\.8|jvmTarget.*['\"]8['\"]|options\.release" \
            app \
            --include="*.gradle" \
            --include="*.gradle.kts"; then

            echo ""
            echo "ERROR: Old JVM setting found."
            exit 1

          fi

          echo ""
          echo "JVM TARGET FIX: PASS"


      # ============================================================
      # BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "MAJDOOR HISAAB RELEASE APK BUILD"
          echo "=========================================="

          gradle \
            clean \
            assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "=========================================="
          echo "BUILD FINISHED"
          echo "=========================================="


      # ============================================================
      # FIND RELEASE APK
      # ============================================================

      - name: Find Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              | grep -Ei "release" \
              | head -n 1 || true
          )"

          if [ -z "$APK" ]; then

            echo "ERROR: Release APK नहीं मिली."

            echo ""
            echo "Available output files:"

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          echo ""
          echo "Release APK:"
          echo "$APK"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"

          echo ""
          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"


      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"

          test -f "$APK"

          case "$APK" in
            *debug*)
              echo "ERROR: Debug APK detected."
              exit 1
              ;;
          esac

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          echo ""
          echo "APK package:"

          "$AAPT" dump badging "$APK" \
            | grep "^package:" \
            | head -1

          echo ""
          echo "APK signature verification:"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK verification: PASS"


      # ============================================================
      # SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk" \
            > \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk.sha256"

          echo ""
          cat \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk.sha256"


      # ============================================================
      # UPLOAD FINAL APK
      # ============================================================

      - name: Upload Final Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-Final-Release-APK
          path: |
            Majdoor-Hisaab-Release.apk
            Majdoor-Hisaab-Release.apk.sha256
          if-no-files-found: error
          retention-days: 30
