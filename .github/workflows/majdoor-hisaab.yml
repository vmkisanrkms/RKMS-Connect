name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77"

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      # ============================================================
      # 4. FIND PROJECT ZIP
      # ============================================================
      - name: Find Majdoor Hisaab project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching repository for project ZIP..."

          ZIP_FILE="$(find . -type f \( \
            -iname '*Majdoor*Hisaab*.zip' \
            -o -iname '*MajdoorHisaab*.zip' \
            -o -iname '*.zip' \
          \) \
          ! -path './.git/*' \
          | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            find . -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found: $ZIP_FILE"

      # ============================================================
      # 5. EXTRACT PROJECT
      # ============================================================
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$PROJECT_ZIP" -d build_source

          echo "Extracted project:"
          find build_source -maxdepth 4 -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print

      # ============================================================
      # 6. LOCATE ACTUAL GRADLE ROOT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          ROOT="$(find "$GITHUB_WORKSPACE/build_source" -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit \
            | xargs -r dirname)"

          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            find build_source -maxdepth 8 -type f | sort | head -500
            exit 1
          fi

          echo "GRADLE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Gradle root: $ROOT"

      # ============================================================
      # 7. ENSURE GRADLE WRAPPER
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ============================================================
      # 8. SOURCE AUDIT + COMPLETE btn() REPAIR
      #
      # IMPORTANT:
      # - fixes title= -> label=
      # - reads actual btn() declaration
      # - converts positional btn arguments into named arguments
      # - prevents Boolean / Function<Unit> parameter inversion
      # - does NOT modify DetailTopBar(title=...)
      # ============================================================
      - name: Repair btn calls and audit Kotlin source
        shell: bash
        run: |
          set -e

          cd "$GRADLE_ROOT"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path("app/src/main")

          kotlin_files = list(root.rglob("*.kt"))

          if not kotlin_files:
              raise SystemExit("ERROR: No Kotlin source files found.")

          print("Kotlin files found:", len(kotlin_files))

          # --------------------------------------------------------
          # Utilities
          # --------------------------------------------------------

          def strip_comments(s):
              s = re.sub(r'/\*.*?\*/', '', s, flags=re.S)
              s = re.sub(r'//.*', '', s)
              return s

          def matching(text, start, open_ch='(', close_ch=')'):
              depth = 0
              quote = None
              triple = False
              escape = False
              i = start

              while i < len(text):
                  ch = text[i]

                  if quote:
                      if triple:
                          if text.startswith('"""', i):
                              triple = False
                              quote = None
                              i += 3
                              continue
                      else:
                          if escape:
                              escape = False
                          elif ch == '\\':
                              escape = True
                          elif ch == quote:
                              quote = None
                      i += 1
                      continue

                  if text.startswith('"""', i):
                      quote = '"'
                      triple = True
                      i += 3
                      continue

                  if ch in ('"', "'"):
                      quote = ch
                      i += 1
                      continue

                  if ch == open_ch:
                      depth += 1
                  elif ch == close_ch:
                      depth -= 1
                      if depth == 0:
                          return i

                  i += 1

              return -1

          def split_top_level(s):
              parts = []
              start = 0
              par = bra = cur = 0
              quote = None
              triple = False
              escape = False

              i = 0

              while i < len(s):
                  ch = s[i]

                  if quote:
                      if triple:
                          if s.startswith('"""', i):
                              quote = None
                              triple = False
                              i += 3
                              continue
                      else:
                          if escape:
                              escape = False
                          elif ch == '\\':
                              escape = True
                          elif ch == quote:
                              quote = None
                      i += 1
                      continue

                  if s.startswith('"""', i):
                      quote = '"'
                      triple = True
                      i += 3
                      continue

                  if ch in ('"', "'"):
                      quote = ch
                  elif ch == '(':
                      par += 1
                  elif ch == ')':
                      par -= 1
                  elif ch == '[':
                      bra += 1
                  elif ch == ']':
                      bra -= 1
                  elif ch == '{':
                      cur += 1
                  elif ch == '}':
                      cur -= 1
                  elif ch == ',' and par == 0 and bra == 0 and cur == 0:
                      parts.append(s[start:i].strip())
                      start = i + 1

                  i += 1

              tail = s[start:].strip()
              if tail:
                  parts.append(tail)

              return parts

          def top_level_equals(s):
              par = bra = cur = 0
              quote = None
              triple = False
              escape = False

              i = 0

              while i < len(s):
                  ch = s[i]

                  if quote:
                      if triple:
                          if s.startswith('"""', i):
                              quote = None
                              triple = False
                              i += 3
                              continue
                      else:
                          if escape:
                              escape = False
                          elif ch == '\\':
                              escape = True
                          elif ch == quote:
                              quote = None
                      i += 1
                      continue

                  if s.startswith('"""', i):
                      quote = '"'
                      triple = True
                      i += 3
                      continue

                  if ch in ('"', "'"):
                      quote = ch
                  elif ch == '(':
                      par += 1
                  elif ch == ')':
                      par -= 1
                  elif ch == '[':
                      bra += 1
                  elif ch == ']':
                      bra -= 1
                  elif ch == '{':
                      cur += 1
                  elif ch == '}':
                      cur -= 1
                  elif ch == '=' and par == 0 and bra == 0 and cur == 0:
                      return i

                  i += 1

              return -1

          # --------------------------------------------------------
          # Find btn declaration
          # --------------------------------------------------------

          declarations = []

          declaration_pattern = re.compile(
              r'\bfun\s+btn\s*\(',
              re.MULTILINE
          )

          for path in kotlin_files:
              text = path.read_text(encoding="utf-8")

              for m in declaration_pattern.finditer(text):
                  open_pos = text.find("(", m.start())
                  close_pos = matching(text, open_pos)

                  if close_pos == -1:
                      continue

                  signature = text[open_pos + 1:close_pos]

                  # Extract top-level parameter declarations.
                  params = []

                  for p in split_top_level(signature):
                      p = p.strip()

                      if not p:
                          continue

                      eq = top_level_equals(p)
                      left = p if eq == -1 else p[:eq]

                      colon = left.find(":")
                      if colon == -1:
                          continue

                      name = left[:colon].strip()

                      # Remove annotations / modifiers.
                      name = re.sub(
                          r'^(?:public|private|internal|protected|crossinline|noinline|vararg)\s+',
                          '',
                          name
                      ).strip()

                      if re.match(r'^[A-Za-z_][A-Za-z0-9_]*$', name):
                          params.append(name)

                  if params:
                      declarations.append((path, params, signature))

          if not declarations:
              print("WARNING: btn() declaration was not found.")
              print("The source will still receive title -> label repair.")
              btn_params = None
          else:
              # Prefer declaration containing label or title.
              chosen = None

              for item in declarations:
                  if "label" in item[1] or "title" in item[1]:
                      chosen = item
                      break

              if chosen is None:
                  chosen = declarations[0]

              btn_params = chosen[1]

              print("btn() declaration:", chosen[0])
              print("btn() parameters:", btn_params)

          # --------------------------------------------------------
          # Repair every btn(...) call
          # --------------------------------------------------------

          changed_files = []
          changed_calls = 0

          for path in kotlin_files:
              original = path.read_text(encoding="utf-8")
              text = original

              # Work backwards so positions remain valid.
              matches = list(re.finditer(r'\bbtn\s*\(', text))

              for m in reversed(matches):
                  open_pos = text.find("(", m.start())
                  close_pos = matching(text, open_pos)

                  if close_pos == -1:
                      continue

                  # Skip the actual function declaration.
                  prefix = text[max(0, m.start()-20):m.start()]
                  if re.search(r'\bfun\s*$', prefix):
                      continue

                  content = text[open_pos + 1:close_pos]

                  args = split_top_level(content)

                  if not args:
                      continue

                  new_args = []
                  used_names = set()

                  # ------------------------------------------------
                  # Detect trailing lambda outside parentheses.
                  # ------------------------------------------------
                  trailing_lambda = None

                  # btn(...) { ... }
                  after = close_pos + 1
                  while after < len(text) and text[after].isspace():
                      after += 1

                  if after < len(text) and text[after] == '{':
                      lambda_end = matching(
                          text,
                          after,
                          '{',
                          '}'
                      )

                      if lambda_end != -1:
                          trailing_lambda = text[after:lambda_end + 1]

                          # Remove lambda from outer text later.
                          trailing_region_end = lambda_end + 1
                      else:
                          trailing_region_end = close_pos + 1
                  else:
                      trailing_region_end = close_pos + 1

                  # ------------------------------------------------
                  # Existing named arguments.
                  # ------------------------------------------------
                  has_named = False

                  for a in args:
                      eq = top_level_equals(a)

                      if eq != -1:
                          has_named = True
                          name = a[:eq].strip()
                          value = a[eq + 1:].strip()

                          if name == "title":
                              name = "label"

                          new_args.append((name, value))
                          used_names.add(name)

                  # ------------------------------------------------
                  # Positional arguments.
                  # ------------------------------------------------
                  positional = []

                  for a in args:
                      if top_level_equals(a) == -1:
                          positional.append(a.strip())

                  if positional and btn_params:
                      available = [
                          p for p in btn_params
                          if p not in used_names
                      ]

                      if len(positional) <= len(available):
                          for idx, value in enumerate(positional):
                              new_args.append(
                                  (available[idx], value)
                              )
                              used_names.add(available[idx])

                  elif positional:
                      # At minimum repair common legacy pattern:
                      # btn("Text", false) { ... }
                      # where false was being sent to onClick.
                      #
                      # Leave declaration-driven conversion unavailable
                      # but use the safe conventional parameter names.
                      fallback_names = [
                          "label",
                          "icon",
                          "onClick",
                          "enabled"
                      ]

                      for idx, value in enumerate(positional):
                          if idx < len(fallback_names):
                              new_args.append(
                                  (fallback_names[idx], value)
                              )

                  # ------------------------------------------------
                  # Add trailing lambda to onClick.
                  # ------------------------------------------------
                  if trailing_lambda:
                      # Remove existing onClick if it was only created
                      # as a positional argument.
                      new_args = [
                          (n, v)
                          for n, v in new_args
                          if n != "onClick"
                      ]

                      new_args.append(
                          ("onClick", trailing_lambda)
                      )

                  # ------------------------------------------------
                  # Normalize names and reconstruct.
                  # ------------------------------------------------
                  if new_args:
                      normalized = ", ".join(
                          f"{name} = {value}"
                          for name, value in new_args
                      )

                      replacement = f"btn({normalized})"

                      if trailing_lambda:
                          replacement += ""

                      # Replace btn(...) itself.
                      text = (
                          text[:m.start()]
                          + replacement
                          + text[close_pos + 1:]
                      )

                      # If trailing lambda existed, it is still present
                      # in the original text. We need to remove it because
                      # it was moved inside onClick.
                      if trailing_lambda:
                          # Find the lambda immediately after replacement.
                          search_start = (
                              m.start() + len(replacement)
                          )

                          while (
                              search_start < len(text)
                              and text[search_start].isspace()
                          ):
                              search_start += 1

                          if (
                              text.startswith(
                                  trailing_lambda,
                                  search_start
                              )
                          ):
                              text = (
                                  text[:search_start]
                                  + text[
                                      search_start
                                      + len(trailing_lambda):
                                  ]
                              )

                      changed_calls += 1

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed_files.append(str(path))

          print("Files changed:", len(changed_files))
          print("btn() calls repaired:", changed_calls)

          # --------------------------------------------------------
          # Final hard audit
          # --------------------------------------------------------

          errors = []

          for path in kotlin_files:
              text = path.read_text(encoding="utf-8")

              # Any remaining btn(title=...) is definitely wrong.
              for m in re.finditer(
                  r'\bbtn\s*\(',
                  text
              ):
                  open_pos = text.find("(", m.start())
                  close_pos = matching(text, open_pos)

                  if close_pos == -1:
                      continue

                  content = text[open_pos + 1:close_pos]

                  if re.search(
                      r'(?<![A-Za-z0-9_])title\s*=',
                      content
                  ):
                      errors.append(
                          f"{path}: remaining btn(title=...)"
                      )

          if errors:
              print("\n".join(errors))
              raise SystemExit(
                  "ERROR: btn() audit failed."
              )

          print("================================================")
          print("btn() SOURCE AUDIT PASSED")
          print("No btn(title=...) calls remain.")
          print("================================================")
          PY

      # ============================================================
      # 9. KOTLIN SOURCE SANITY AUDIT
      # ============================================================
      - name: Kotlin source sanity audit
        shell: bash
        run: |
          set -e
          cd "$GRADLE_ROOT"

          echo "Checking Kotlin source..."

          test -d app/src/main || {
            echo "ERROR: app/src/main not found"
            exit 1
          }

          if grep -R -n \
            --include='*.kt' \
            -E 'btn[[:space:]]*\([^)]*title[[:space:]]*=' \
            app/src/main; then
            echo "ERROR: old btn(title=...) still exists."
            exit 1
          fi

          echo "Kotlin source sanity audit passed."

      # ============================================================
      # 10. CLEAN BUILD
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e
          cd "$GRADLE_ROOT"

          if [ -x "./gradlew" ]; then
            ./gradlew --stop || true
            ./gradlew clean
          else
            gradle --stop || true
            gradle clean
          fi

      # ============================================================
      # 11. COMPILE RELEASE KOTLIN
      # ============================================================
      - name: Compile Release Kotlin
        shell: bash
        run: |
          set -e
          cd "$GRADLE_ROOT"

          echo "=============================================="
          echo "COMPILING RELEASE KOTLIN"
          echo "=============================================="

          if [ -x "./gradlew" ]; then
            ./gradlew \
              :app:compileReleaseKotlin \
              --stacktrace \
              --no-daemon
          else
            gradle \
              :app:compileReleaseKotlin \
              --stacktrace \
              --no-daemon
          fi

      # ============================================================
      # 12. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e
          cd "$GRADLE_ROOT"

          echo "=============================================="
          echo "BUILDING RELEASE APK"
          echo "=============================================="

          if [ -x "./gradlew" ]; then
            ./gradlew \
              :app:assembleRelease \
              --stacktrace \
              --no-daemon
          else
            gradle \
              :app:assembleRelease \
              --stacktrace \
              --no-daemon
          fi

          APK="$(find app/build/outputs/apk/release \
            -type f -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"
          echo "Release APK: $APK"

      # ============================================================
      # 13. PREPARE SIGNING
      # ============================================================
      - name: Prepare release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/signing"

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then

            echo "Using permanent GitHub signing keystore."

            echo "$RELEASE_KEYSTORE_BASE64" \
              | base64 --decode \
              > "$RUNNER_TEMP/signing/release.jks"

            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"

          else

            echo "Permanent signing secrets not configured."
            echo "Creating temporary CI signing key."

            keytool \
              -genkeypair \
              -v \
              -keystore "$RUNNER_TEMP/signing/release.jks" \
              -storepass "android" \
              -keypass "android" \
              -alias "release" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Majdoor Hisaab PRO,O=Majdoor Hisaab PRO,C=IN"

            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=release" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=android" >> "$GITHUB_ENV"

          fi

      # ============================================================
      # 14. ZIPALIGN + SIGN
      # ============================================================
      - name: Sign release APK
        shell: bash
        run: |
          set -e

          APK="$RELEASE_APK"

          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          mkdir -p "$GRADLE_ROOT/app/build/outputs/apk/release/final"

          ALIGNED="$GRADLE_ROOT/app/build/outputs/apk/release/final/majdoor-hisaab-pro-aligned.apk"
          SIGNED="$GRADLE_ROOT/app/build/outputs/apk/release/final/Majdoor-Hisaab-PRO-${VERSION_NAME}-signed.apk"

          echo "Zipalign..."
          "$ZIPALIGN" -f -p 4 "$APK" "$ALIGNED"

          echo "Signing..."
          "$APKSIGNER" sign \
            --ks "$RELEASE_KEYSTORE" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass "pass:$RELEASE_STORE_PASSWORD" \
            --key-pass "pass:$RELEASE_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          test -f "$SIGNED"

          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"

          echo "Signed APK:"
          ls -lh "$SIGNED"

      # ============================================================
      # 15. VERIFY SIGNATURE
      # ============================================================
      - name: Verify signed APK
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          echo "=============================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=============================================="

          "$APKSIGNER" verify \
            --verbose \
            "$SIGNED_APK"

      # ============================================================
      # 16. VERIFY PACKAGE NAME
      # ============================================================
      - name: Verify APK package
        shell: bash
        run: |
          set -e

          APK="$SIGNED_APK"

          echo "Checking APK package..."

          PACKAGE_OUTPUT="$(
            "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" \
              manifest application-id \
              "$APK" 2>/dev/null || true
          )"

          if [ -z "$PACKAGE_OUTPUT" ]; then
            PACKAGE_OUTPUT="$(
              "$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" \
                dump badging "$APK" \
                | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" \
                | head -n 1
            )"
          fi

          echo "Detected package: $PACKAGE_OUTPUT"

          if [ "$PACKAGE_OUTPUT" != "$PACKAGE_NAME" ]; then
            echo "ERROR: Package mismatch."
            echo "Expected: $PACKAGE_NAME"
            echo "Actual:   $PACKAGE_OUTPUT"
            exit 1
          fi

          echo "Package verification passed."

      # ============================================================
      # 17. APK INFORMATION
      # ============================================================
      - name: APK final report
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "MAJDOOR HISAAB PRO FINAL BUILD REPORT"
          echo "=============================================="

          ls -lh "$SIGNED_APK"

          echo
          echo "APK:"
          echo "$SIGNED_APK"

          echo
          echo "Package:"
          echo "$PACKAGE_NAME"

          echo
          echo "Version:"
          echo "$VERSION_NAME"

          echo
          echo "Android API:"
          echo "$ANDROID_API"

          echo
          echo "Build Tools:"
          echo "$BUILD_TOOLS"

          echo
          echo "Java:"
          java -version

      # ============================================================
      # 18. UPLOAD FINAL APK
      # ============================================================
      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-${{ env.VERSION_NAME }}-Signed-Release
          path: |
            ${{ env.SIGNED_APK }}
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 19. UPLOAD BUILD REPORT
      # ============================================================
      - name: Upload APK report
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-${{ env.VERSION_NAME }}-Build-Report
          path: |
            ${{ env.GRADLE_ROOT }}/app/build/outputs/apk/release/**/*.apk
          if-no-files-found: error
          retention-days: 30
