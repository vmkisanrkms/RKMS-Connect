name: Build Final Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Final Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate FINAL source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="Majdoor_Hisaab_PRO_FINAL_FIXED_AUDITED_RELEASE_BUILD_V3.zip"

          if [ ! -f "$GITHUB_WORKSPACE/$SOURCE_ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$GITHUB_WORKSPACE/$SOURCE_ZIP"
            echo
            echo "Repository root files:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"
          echo "Source ZIP found: $SOURCE_ZIP"
          ls -lh "$GITHUB_WORKSPACE/$SOURCE_ZIP"

      - name: Verify source ZIP
        run: |
          set -euo pipefail

          unzip -t "$GITHUB_WORKSPACE/$SOURCE_ZIP" >/dev/null

          echo "Source ZIP integrity: PASS"

      - name: Extract FINAL source
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/build-source"
          mkdir -p "$GITHUB_WORKSPACE/build-source"

          unzip -q "$GITHUB_WORKSPACE/$SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/build-source"

          echo "Extracted source:"
          find "$GITHUB_WORKSPACE/build-source" -maxdepth 3 -type f | sort | head -100

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE/build-source"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
          test -f "$PROJECT_DIR/app/src/main/res/drawable-nodpi/majdoor_logo.png"

          echo "Project structure: PASS"

      - name: Audit Android configuration
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE/build-source"
          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          ROOT_GRADLE="$PROJECT_DIR/build.gradle.kts"

          grep -q 'compileSdk = 35' "$APP_GRADLE"
          grep -q 'minSdk = 26' "$APP_GRADLE"
          grep -q 'targetSdk = 35' "$APP_GRADLE"

          grep -q 'versionCode = 24' "$APP_GRADLE"
          grep -q 'versionName = "2.4"' "$APP_GRADLE"

          grep -q 'id("com.android.application") version "8.9.1"' "$ROOT_GRADLE"
          grep -q 'id("org.jetbrains.kotlin.android") version "2.1.20"' "$ROOT_GRADLE"

          echo "Android configuration: PASS"

      - name: Audit release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE/build-source"
          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          grep -q 'signingConfigs' "$APP_GRADLE"
          grep -q 'releaseStoreFile' "$APP_GRADLE"
          grep -q 'releaseStorePassword' "$APP_GRADLE"
          grep -q 'releaseKeyAlias' "$APP_GRADLE"
          grep -q 'releaseKeyPassword' "$APP_GRADLE"
          grep -q 'signingConfig = signingConfigs.getByName("release")' "$APP_GRADLE"

          echo "Permanent release signing configuration: PASS"

      - name: Audit manifest and package
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE/build-source"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          grep -q 'android:exported="true"' "$MANIFEST"

          echo "Manifest audit: PASS"

      - name: Audit Kotlin JVM 17
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE/build-source"
          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          grep -q 'JavaVersion.VERSION_17' "$APP_GRADLE"
          grep -q 'jvmTarget = "17"' "$APP_GRADLE"

          echo "Java/Kotlin 17 configuration: PASS"

      - name: Verify Gradle Wrapper 8.11.1
        working-directory: build-source
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew --version

          ./gradlew --version | grep -q 'Gradle 8.11.1'

          echo "Gradle Wrapper 8.11.1: PASS"

      - name: Verify permanent release signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_KEYSTORE_BASE64" || {
            echo "Missing RELEASE_KEYSTORE_BASE64 secret"
            exit 1
          }

          test -n "$RELEASE_KEYSTORE_PASSWORD" || {
            echo "Missing RELEASE_KEYSTORE_PASSWORD secret"
            exit 1
          }

          test -n "$RELEASE_KEY_ALIAS" || {
            echo "Missing RELEASE_KEY_ALIAS secret"
            exit 1
          }

          test -n "$RELEASE_KEY_PASSWORD" || {
            echo "Missing RELEASE_KEY_PASSWORD secret"
            exit 1
          }

          echo "All permanent release signing secrets: PASS"

      - name: Restore permanent release keystore
        working-directory: build-source
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

          test -s release.keystore

          {
            echo "releaseStoreFile=$GITHUB_WORKSPACE/build-source/release.keystore"
            echo "releaseStorePassword=$RELEASE_KEYSTORE_PASSWORD"
            echo "releaseKeyAlias=$RELEASE_KEY_ALIAS"
            echo "releaseKeyPassword=$RELEASE_KEY_PASSWORD"
          } >> gradle.properties

          echo "Permanent release keystore restored: PASS"

      - name: Build Release APK only
        working-directory: build-source
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify Release APK exists
        working-directory: build-source
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          unzip -t "$APK" >/dev/null

          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Debug APK exists"
            exit 1
          fi

          echo "Release APK exists: PASS"

      - name: Verify APK package and version
        working-directory: build-source
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          aapt dump badging "$APK" | grep -E \
            "package: name='com\.majdoor\.hisaab'.*versionCode='24'.*versionName='2\.4'"

          echo "Package/version verification: PASS"

      - name: Verify permanent APK signature
        working-directory: build-source
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          apksigner verify --verbose "$APK"
          apksigner verify --print-certs "$APK"

          echo "Permanent APK signature verification: PASS"

      - name: Install Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -e

            adb install -r \
              build-source/app/build/outputs/apk/release/app-release.apk

            adb shell pm list packages | \
              grep -q '^package:com.majdoor.hisaab$'

            adb shell monkey \
              -p com.majdoor.hisaab 1 >/dev/null

            sleep 3

            adb shell dumpsys activity activities | \
              grep -q 'com.majdoor.hisaab'

            echo "Emulator smoke test: PASS"

      - name: Calculate SHA256
        working-directory: build-source
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          sha256sum "$APK"

      - name: Final release-only check
        working-directory: build-source
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          if find app/build/outputs/apk -type f \
            -name '*debug*.apk' | grep -q .; then
            echo "ERROR: Debug APK detected"
            exit 1
          fi

          echo "Final release-only check: PASS"

      - name: Upload FINAL Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-v2.4-FINAL-Release-APK
          path: build-source/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
