name: Build V27 v2.10 Final Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-v27-release
  cancel-in-progress: true

jobs:
  build:
    name: Build V27 v2.10 Final Release APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ==========================================================
      # 2. JAVA 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================================
      # 3. ANDROID SDK
      # ==========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ==========================================================
      # 4. ANDROID SDK 35
      # ==========================================================
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 35: PASS"

      # ==========================================================
      # 5. FIND V27 ZIP
      # ==========================================================
      - name: Find V27 V5 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/Majdoor_Hisaab_PRO_V27_FULL_AUDITED_V5.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/Majdoor_Hisaab_PRO_V27_FULL_AUDITED_V5.zip"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name "Majdoor_Hisaab_PRO_V27_FULL_AUDITED_V5.zip" \
              -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V27 V5 ZIP not found."
            echo
            echo "Files available in repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "V27 ZIP:"
          echo "$ZIP_FILE"

          echo "V27_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      # ==========================================================
      # 6. EXTRACT V27 ZIP
      # ==========================================================
      - name: Extract V27 V5 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/v27-source"

          mkdir -p "$GITHUB_WORKSPACE/v27-source"

          unzip -q \
            "$V27_ZIP" \
            -d "$GITHUB_WORKSPACE/v27-source"

          echo "Extracted V27 source:"
          find "$GITHUB_WORKSPACE/v27-source" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -200

      # ==========================================================
      # 7. SET ACTUAL PROJECT ROOT
      # ==========================================================
      - name: Set V27 project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$GITHUB_WORKSPACE/v27-source/src"

          if [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo
          echo "V27 PROJECT ROOT:"
          echo "$PROJECT_ROOT"

      # ==========================================================
      # 8. VERIFY PROJECT
      # ==========================================================
      - name: Verify V27 project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/majdoor/hisaab/MainActivity.kt

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo "V27 project structure: PASS"

      # ==========================================================
      # 9. VERIFY EXACT V27 CONFIG
      # ==========================================================
      - name: Verify V27 v2.10 configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APP="app/build.gradle.kts"

          grep -Fq \
            'namespace = "com.majdoor.hisaab"' \
            "$APP"

          grep -Fq \
            'applicationId = "com.majdoor.hisaab"' \
            "$APP"

          grep -Fq \
            'compileSdk = 35' \
            "$APP"

          grep -Fq \
            'minSdk = 26' \
            "$APP"

          grep -Fq \
            'targetSdk = 35' \
            "$APP"

          grep -Fq \
            'versionCode = 30' \
            "$APP"

          grep -Fq \
            'versionName = "2.10"' \
            "$APP"

          grep -Fq \
            'JavaVersion.VERSION_17' \
            "$APP"

          grep -Fq \
            'jvmTarget = "17"' \
            "$APP"

          grep -Fq \
            'id("com.android.application") version "8.9.1"' \
            build.gradle.kts

          grep -Fq \
            'id("org.jetbrains.kotlin.android") version "2.1.20"' \
            build.gradle.kts

          echo
          echo "=========================================="
          echo "V27 CONFIGURATION"
          echo "=========================================="
          echo "Package     : com.majdoor.hisaab"
          echo "Version     : 2.10"
          echo "VersionCode : 30"
          echo "compileSdk  : 35"
          echo "targetSdk   : 35"
          echo "minSdk      : 26"
          echo "Java        : 17"
          echo "AGP         : 8.9.1"
          echo "Kotlin      : 2.1.20"
          echo "=========================================="
          echo "V27 configuration: PASS"

      # ==========================================================
      # 10. VERIFY GRADLE
      # ==========================================================
      - name: Verify Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          chmod +x gradlew

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            gradle/wrapper/gradle-wrapper.properties

          ./gradlew --version

          ./gradlew --version | grep -Fq \
            "Gradle 8.11.1"

          echo "Gradle 8.11.1: PASS"

      # ==========================================================
      # 11. VERIFY MANIFEST
      # ==========================================================
      - name: Verify Android Manifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          MANIFEST="app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          grep -Fq \
            'com.majdoor.hisaab' \
            "$MANIFEST"

          echo "Android Manifest: PASS"

      # ==========================================================
      # 12. VERIFY RELEASE SECRETS
      # ==========================================================
      - name: Verify release signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

          echo "Release signing secrets: PRESENT"

      # ==========================================================
      # 13. RESTORE RELEASE KEYSTORE
      # ==========================================================
      - name: Restore permanent release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > release.keystore

          test -s release.keystore

          {
            echo "releaseStoreFile=$PROJECT_ROOT/release.keystore"
            echo "releaseStorePassword=$RELEASE_KEYSTORE_PASSWORD"
            echo "releaseKeyAlias=$RELEASE_KEY_ALIAS"
            echo "releaseKeyPassword=$RELEASE_KEY_PASSWORD"
          } >> gradle.properties

          echo "Release keystore restored"

      # ==========================================================
      # 14. CLEAN
      # ==========================================================
      - name: Clean previous outputs
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          ./gradlew clean --no-daemon

          rm -rf app/build/outputs/apk
          rm -rf app/build/outputs/bundle

          echo "Clean: PASS"

      # ==========================================================
      # 15. BUILD RELEASE APK ONLY
      # ==========================================================
      - name: Build V27 Release APK only
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ==========================================================
      # 16. VERIFY APK
      # ==========================================================
      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"
          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo
          echo "RELEASE APK:"
          ls -lh "$APK"

          echo "APK integrity: PASS"

      # ==========================================================
      # 17. NO DEBUG APK
      # ==========================================================
      - name: Verify no Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          DEBUG_APKS="$(
            find app/build/outputs/apk \
              -type f \
              -iname "*debug*.apk" \
              || true
          )"

          if [ -n "$DEBUG_APKS" ]; then
            echo "ERROR: Debug APK found:"
            echo "$DEBUG_APKS"
            exit 1
          fi

          echo "Debug APK: NOT FOUND"

      # ==========================================================
      # 18. NO AAB
      # ==========================================================
      - name: Verify no AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          AABS="$(
            find app/build/outputs \
              -type f \
              \( -name "*.aab" -o -name "*.aab.zip" \) \
              || true
          )"

          if [ -n "$AABS" ]; then
            echo "ERROR: AAB found:"
            echo "$AABS"
            exit 1
          fi

          echo "AAB: NOT FOUND"

      # ==========================================================
      # 19. VERIFY PACKAGE + VERSION
      # ==========================================================
      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -x "$AAPT"

          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING"

          echo "$BADGING" | grep -Fq \
            "package: name='com.majdoor.hisaab'"

          echo "$BADGING" | grep -Fq \
            "versionCode='30'"

          echo "$BADGING" | grep -Fq \
            "versionName='2.10'"

          echo
          echo "Package      : com.majdoor.hisaab"
          echo "Version      : 2.10"
          echo "VersionCode  : 30"
          echo "Package/version: PASS"

      # ==========================================================
      # 20. VERIFY RELEASE SIGNATURE
      # ==========================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo
          echo "APK signature: PASS"

      # ==========================================================
      # 21. SHA-256
      # ==========================================================
      - name: Generate APK SHA-256
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          sha256sum \
            app/build/outputs/apk/release/app-release.apk \
            | tee "$GITHUB_WORKSPACE/release-apk-sha256.txt"

      # ==========================================================
      # 22. PREPARE FINAL FILE
      # ==========================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          mkdir -p "$GITHUB_WORKSPACE/final"

          cp \
            app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/final/Majdoor-Hisaab-PRO-V27-v2.10-FINAL.apk"

          cp \
            "$GITHUB_WORKSPACE/release-apk-sha256.txt" \
            "$GITHUB_WORKSPACE/final/"

          ls -lh "$GITHUB_WORKSPACE/final/"

      # ==========================================================
      # 23. UPLOAD FINAL APK
      # ==========================================================
      - name: Upload V27 v2.10 FINAL Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V27-v2.10-FINAL-Release-APK
          path: final/Majdoor-Hisaab-PRO-V27-v2.10-FINAL.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 24. UPLOAD SHA-256
      # ==========================================================
      - name: Upload V27 SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V27-v2.10-SHA256
          path: final/release-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
