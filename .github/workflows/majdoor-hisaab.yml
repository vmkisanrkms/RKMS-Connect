                            ){
                                attendanceDetail(a.id)
                            }
                        )
                    }
            }
        }


        # RENDER COMES AFTER renderSummary.
        fun render(){

            grid.removeAllViews()

            monthTitle.text=
                SimpleDateFormat(
                    "MMMM yyyy",
                    Locale.US
                ).format(shown.time)

            val weekdays=
                arrayOf(
                    "Mon",
                    "Tue",
                    "Wed",
                    "Thu",
                    "Fri",
                    "Sat",
                    "Sun"
                )

            weekdays.forEach{w->

                grid.addView(
                    txt(
                        w,
                        11f,
                        true
                    ).apply{
                        gravity=Gravity.CENTER
                    },
                    GridLayout.LayoutParams().apply{
                        width=0
                        height=48
                        columnSpec=
                            GridLayout.spec(
                                GridLayout.UNDEFINED,
                                1f
                            )
                        rowSpec=
                            GridLayout.spec(0)
                    }
                )
            }

            val first=
                shown.clone() as Calendar

            first.set(
                Calendar.DAY_OF_MONTH,
                1
            )

            val mondayOffset=
                (
                    first.get(Calendar.DAY_OF_WEEK)
                    + 5
                ) % 7

            val max=
                shown.getActualMaximum(
                    Calendar.DAY_OF_MONTH
                )

            for(i in 0 until mondayOffset){

