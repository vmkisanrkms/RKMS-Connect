name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor_Hisaab_PRO_FINAL_KOTLIN_FIXED.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build Final Signed Release APK

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle


      # ============================================================
      # 3. GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ============================================================
      # 4. LOCATE ANDROID SDK
      # ============================================================
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          if [ -z "${ANDROID_HOME:-}" ]; then
            if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
              echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
            else
              echo "ERROR: Android SDK not found."
              exit 1
            fi
          fi

          echo "Final ANDROID_HOME=$ANDROID_HOME"


      # ============================================================
      # 5. INSTALL ANDROID SDK 36
      # ============================================================
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Android SDK ${ANDROID_API} installed."
          echo "Build Tools ${BUILD_TOOLS} installed."


      # ============================================================
      # 6. VERIFY SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== SDK ==="
          ls -la "$ANDROID_HOME"

          echo
          echo "=== Platform ==="
          ls -la "$ANDROID_HOME/platforms/android-${ANDROID_API}"

          echo
          echo "=== Build Tools ==="
          ls -la "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          echo
          echo "=== Required Tools ==="

          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2"
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          echo "aapt2      : OK"
          echo "zipalign   : OK"
          echo "apksigner  : OK"


      # ============================================================
      # 7. FIND EXACT ZIP
      # ============================================================
      - name: Find Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -name "$ZIP_NAME" \
            -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: ZIP not found:"
            echo "$ZIP_NAME"

            echo
            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              -print || true

            exit 1
          fi

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

          echo
          echo "Found ZIP:"
          echo "$ZIP_PATH"


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================
      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$RUNNER_TEMP/majdoor-hisaab-project"

          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          unzip -q "$ZIP_PATH" -d "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Project extracted to:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 9. LOCATE PROJECT ROOT
      # ============================================================
      - name: Locate Gradle Project Root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$PROJECT_DIR"

          SETTINGS_FILE="$(find "$PROJECT_DIR" \
            -maxdepth 5 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -type f \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."

            find "$PROJECT_DIR" \
              -maxdepth 4 \
              -type f \
              | sort \
              | head -200

            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo
          echo "Gradle project root:"
          echo "$PROJECT_ROOT"


      # ============================================================
      # 10. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=== PROJECT ROOT ==="
          pwd

          echo
          echo "=== FILES ==="
          ls -la

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x gradlew

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          echo
          echo "Android project verification successful."


      # ============================================================
      # 11. INSPECT PROJECT
      # ============================================================
      - name: Inspect Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=== Gradle Files ==="
          find . \
            -maxdepth 3 \
            -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "gradle.properties" \
            \) \
            -print \
            | sort

          echo
          echo "=== Android Manifest ==="

          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -n '1,220p' "app/src/main/AndroidManifest.xml"
          fi


      # ============================================================
      # 12. LOCATE KOTLIN SOURCE
      # ============================================================
      - name: Locate Kotlin Source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=== Kotlin Files ==="

          find app/src \
            -type f \
            \( -name "*.kt" -o -name "*.kts" \) \
            -print \
            | sort


      # ============================================================
      # 13. VERIFY ANDROID CONFIG
      # ============================================================
      - name: Verify Android Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=== Checking Package ==="

          grep -R \
            "com.majdoor.hisaab" \
            app/src/main \
            app/build.gradle \
            app/build.gradle.kts \
            2>/dev/null \
            | head -30 || true

          echo
          echo "=== Checking SDK 36 ==="

          grep -R \
            "36" \
            app/build.gradle \
            app/build.gradle.kts \
            2>/dev/null \
            | head -30 || true


      # ============================================================
      # 14. CLEAN PROJECT
      # ============================================================
      - name: Clean Android Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 15. COMPILE RELEASE KOTLIN + BUILD APK
      #
      # IMPORTANT:
      # Original fixed source is preserved.
      # No source modification is performed here.
      # ============================================================
      - name: Compile Release Kotlin and Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=== VERIFYING FIXED KOTLIN SOURCE ==="

          MAIN_ACTIVITY="$(find app/src/main \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "WARNING: MainActivity.kt not found by search."
          else
            echo "MainActivity:"
            echo "$MAIN_ACTIVITY"

            echo
            echo "Checking Store context declaration..."

            if grep -q "private class Store(private val context:Context)" "$MAIN_ACTIVITY"; then
              echo "Store context fix: OK"
            else
              echo "WARNING: Expected Store declaration pattern not found."
            fi
          fi

          echo
          echo "=== BUILD RELEASE APK ==="

          chmod +x gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

          echo
          echo "BUILD SUCCESSFUL."


      # ============================================================
      # 16. LOCATE RELEASE APK
      # ============================================================
      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=== Searching Release APK ==="

          APK=""

          APK="$(find . \
            -type f \
            -path "*/build/outputs/apk/release/*-release-unsigned.apk" \
            -print \
            | head -n 1 || true)"

          if [ -z "$APK" ]; then
            APK="$(find . \
              -type f \
              -path "*/build/outputs/apk/release/app-release-unsigned.apk" \
              -print \
              | head -n 1 || true)"
          fi

          if [ -z "$APK" ]; then
            APK="$(find . \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -print \
              | head -n 1 || true)"
          fi

          if [ -z "$APK" ]; then
            APK="$(find . \
              -type f \
              -name "*.apk" \
              -print \
              | head -n 1 || true)"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."

            echo
            echo "APK files:"
            find . \
              -type f \
              -name "*.apk" \
              -print \
              || true

            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          ORIGINAL="$RUNNER_TEMP/release-original.apk"

          cp "$APK" "$ORIGINAL"

          echo "ORIGINAL_APK=$ORIGINAL" >> "$GITHUB_ENV"

          echo
          echo "Original APK copied to:"
          echo "$ORIGINAL"


      # ============================================================
      # 17. VERIFY ORIGINAL APK
      # ============================================================
      - name: Verify Original APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$ORIGINAL_APK"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Original APK missing."
            exit 1
          fi

          echo "APK:"
          ls -lh "$APK"

          echo
          echo "APK file type:"
          file "$APK"

          echo
          echo "APK ZIP test:"
          unzip -t "$APK" >/dev/null

          echo
          echo "Original APK verification successful."


      # ============================================================
      # 18. PREPARE PKCS12 SIGNING KEYSTORE
      #
      # IMPORTANT:
      # PKCS12 uses SAME password for store + key.
      # ============================================================
      - name: Prepare PKCS12 Signing Keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/majdoor-hisaab-release.keystore"

          SIGNING_PASSWORD="MajdoorHisaabV82Signing@2026"

          rm -f "$KEYSTORE"

          echo "=== GENERATING PKCS12 KEYSTORE ==="

          keytool \
            -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -alias majdoor-hisaab-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -dname "CN=Majdoor Hisaab PRO, OU=RKMS, O=RKMS, L=Lakhimpur Kheri, ST=Uttar Pradesh, C=IN"

          echo
          echo "=== VERIFY KEYSTORE ==="

          keytool \
            -list \
            -v \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass "$SIGNING_PASSWORD" \
            -alias majdoor-hisaab-release \
            >/dev/null

          echo
          echo "Keystore successfully created and verified."

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"


      # ============================================================
      # 19. ALIGN RELEASE APK - 16 KB PAGE SIZE
      # ============================================================
      - name: Align Release APK
        shell: bash
        run: |
          set -euo pipefail

          INPUT="$ORIGINAL_APK"
          ALIGNED="$RUNNER_TEMP/$APK_UNSIGNED_NAME"

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          if [ ! -x "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found:"
            echo "$ZIPALIGN"
            exit 1
          fi

          echo "=== 16 KB PAGE-SIZE ALIGNMENT ==="

          "$ZIPALIGN" \
            -f \
            -P 16 \
            4 \
            "$INPUT" \
            "$ALIGNED"

          echo
          echo "=== VERIFY ALIGNMENT ==="

          "$ZIPALIGN" \
            -c \
            -P 16 \
            4 \
            "$ALIGNED"

          echo
          echo "ZIPALIGN SUCCESS."

          echo "ALIGNED_APK=$ALIGNED" >> "$GITHUB_ENV"


      # ============================================================
      # 20. SIGN RELEASE APK
      # ============================================================
      - name: Sign Release APK
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="$RUNNER_TEMP/$APK_SIGNED_NAME"

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found:"
            echo "$APKSIGNER"
            exit 1
          fi

          if [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: Keystore not found:"
            echo "$KEYSTORE"
            exit 1
          fi

          if [ ! -f "$ALIGNED_APK" ]; then
            echo "ERROR: Aligned APK not found:"
            echo "$ALIGNED_APK"
            exit 1
          fi

          echo "=== SIGNING RELEASE APK ==="

          rm -f "$SIGNED"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias majdoor-hisaab-release \
            --ks-pass pass:"$SIGNING_PASSWORD" \
            --key-pass pass:"$SIGNING_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$SIGNED" \
            "$ALIGNED_APK"

          if [ ! -f "$SIGNED" ]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          echo
          echo "SIGNED APK CREATED:"
          ls -lh "$SIGNED"

          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"


      # ============================================================
      # 21. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify Release APK Signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          echo "=== VERIFY APK SIGNATURE ==="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"

          echo
          echo "APK SIGNATURE VERIFICATION SUCCESSFUL."


      # ============================================================
      # 22. VERIFY FINAL APK IDENTITY
      #
      # FIX:
      # Do NOT use apkanalyzer.
      # Android Build Tools 36 uses aapt2 for this verification.
      # ============================================================
      - name: Verify Final APK Identity
        shell: bash
        run: |
          set -euo pipefail

          echo "=== VERIFY FINAL APK IDENTITY ==="

          APK="$SIGNED_APK"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed APK not found:"
            echo "$APK"
            exit 1
          fi

          AAPT2="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2"

          if [ ! -x "$AAPT2" ]; then
            echo "ERROR: aapt2 not found:"
            echo "$AAPT2"
            exit 1
          fi

          echo
          echo "APK:"
          ls -lh "$APK"

          BADGING="$RUNNER_TEMP/apk-badging.txt"

          "$AAPT2" dump badging "$APK" > "$BADGING"

          echo
          echo "=== APK BADGING ==="
          cat "$BADGING"

          PACKAGE_NAME_FOUND="$(
            sed -n \
              "s/^package: name='\([^']*\)'.*/\1/p" \
              "$BADGING" \
              | head -n 1
          )"

          VERSION_NAME_FOUND="$(
            sed -n \
              "s/^package:.*versionName='\([^']*\)'.*/\1/p" \
              "$BADGING" \
              | head -n 1
          )"

          VERSION_CODE_FOUND="$(
            sed -n \
              "s/^package:.*versionCode='\([^']*\)'.*/\1/p" \
              "$BADGING" \
              | head -n 1
          )"

          echo
          echo "=========================================="
          echo "EXPECTED PACKAGE : $PACKAGE_NAME"
          echo "FOUND PACKAGE    : $PACKAGE_NAME_FOUND"
          echo
          echo "EXPECTED VERSION : $VERSION_NAME"
          echo "FOUND VERSION    : $VERSION_NAME_FOUND"
          echo
          echo "EXPECTED CODE    : $VERSION_CODE"
          echo "FOUND CODE       : $VERSION_CODE_FOUND"
          echo "=========================================="

          if [ "$PACKAGE_NAME_FOUND" != "$PACKAGE_NAME" ]; then
            echo
            echo "ERROR: Package name mismatch."
            exit 1
          fi

          if [ "$VERSION_NAME_FOUND" != "$VERSION_NAME" ]; then
            echo
            echo "ERROR: Version name mismatch."
            exit 1
          fi

          if [ "$VERSION_CODE_FOUND" != "$VERSION_CODE" ]; then
            echo
            echo "ERROR: Version code mismatch."
            exit 1
          fi

          echo
          echo "APK IDENTITY VERIFICATION SUCCESSFUL."


      # ============================================================
      # 23. FINAL 16 KB ALIGNMENT VERIFICATION
      # ============================================================
      - name: Final APK Alignment Verification
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          if [ ! -x "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found:"
            echo "$ZIPALIGN"
            exit 1
          fi

          echo "=== FINAL 16 KB ALIGNMENT VERIFICATION ==="

          "$ZIPALIGN" \
            -c \
            -P 16 \
            4 \
            "$SIGNED_APK"

          echo
          echo "FINAL APK ALIGNMENT VERIFICATION SUCCESSFUL."


      # ============================================================
      # 24. GENERATE BUILD REPORT
      # ============================================================
      - name: Generate Build Report
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/majdoor-hisaab-v82-build-report.txt"

          {
            echo "=============================================="
            echo "MAJDOOR HISAAB PRO V82 - FINAL BUILD REPORT"
            echo "=============================================="
            echo
            echo "Package Name : $PACKAGE_NAME"
            echo "Version Name : $VERSION_NAME"
            echo "Version Code : $VERSION_CODE"
            echo
            echo "Android API  : $ANDROID_API"
            echo "Build Tools  : $BUILD_TOOLS"
            echo "Java         : $JAVA_VERSION"
            echo "Gradle       : $GRADLE_VERSION"
            echo
            echo "APK:"
            echo "$SIGNED_APK"
            echo
            echo "Status:"
            echo "BUILD SUCCESSFUL"
            echo "SIGNATURE VERIFIED"
            echo "IDENTITY VERIFIED"
            echo "16 KB ALIGNMENT VERIFIED"
            echo
            echo "=============================================="
          } > "$REPORT"

          cat "$REPORT"

          echo "BUILD_REPORT=$REPORT" >> "$GITHUB_ENV"


      # ============================================================
      # 25. PREPARE FINAL ARTIFACTS
      # ============================================================
      - name: Prepare Final Artifacts
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT_DIR="$RUNNER_TEMP/final-artifacts"

          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"

          cp "$SIGNED_APK" \
            "$ARTIFACT_DIR/$APK_SIGNED_NAME"

          cp "$ALIGNED_APK" \
            "$ARTIFACT_DIR/$APK_UNSIGNED_NAME"

          cp "$BUILD_REPORT" \
            "$ARTIFACT_DIR/MAJDOOR_HISAAB_V82_BUILD_REPORT.txt"

          echo
          echo "=== FINAL ARTIFACTS ==="

          ls -lh "$ARTIFACT_DIR"

          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 26. UPLOAD FINAL SIGNED APK
      # ============================================================
      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: |
            ${{ env.ARTIFACT_DIR }}/${{ env.APK_SIGNED_NAME }}
            ${{ env.ARTIFACT_DIR }}/MAJDOOR_HISAAB_V82_BUILD_REPORT.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 27. UPLOAD ALIGNED APK
      # ============================================================
      - name: Upload Aligned APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED-APK
          path: |
            ${{ env.ARTIFACT_DIR }}/${{ env.APK_UNSIGNED_NAME }}
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 28. FINAL SUCCESS
      # ============================================================
      - name: Final Success
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "              FINAL BUILD SUCCESSFUL"
          echo "============================================================"
          echo
          echo "Majdoor Hisaab PRO V82"
          echo
          echo "Package : $PACKAGE_NAME"
          echo "Version : $VERSION_NAME"
          echo "Code    : $VERSION_CODE"
          echo
          echo "BUILD                 : SUCCESS"
          echo "KOTLIN COMPILE        : SUCCESS"
          echo "RELEASE APK           : CREATED"
          echo "16 KB ALIGNMENT       : SUCCESS"
          echo "APK SIGNING           : SUCCESS"
          echo "SIGNATURE VERIFICATION: SUCCESS"
          echo "APK IDENTITY          : SUCCESS"
          echo "FINAL ALIGNMENT       : SUCCESS"
          echo
          echo "SIGNED APK:"
          echo "$SIGNED_APK"
          echo
          echo "============================================================"
