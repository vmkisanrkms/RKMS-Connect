name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-final
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_NAME: "1.82.0"
  VERSION_CODE: "82"

  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_HAJRI_BACKDATE_LOCK_FIXED_ATTENDANCE_TOP_KOTLIN_COMPILE_FIXED_V3-1.zip"

  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"
  APK_ALIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED.apk"


jobs:

  build-release:

    name: Build Final Signed Release APK

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle


      # ============================================================
      # 3. SETUP GRADLE
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ============================================================
      # 4. SETUP ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 5. INSTALL ANDROID API 36
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"


      # ============================================================
      # 6. VERIFY SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=========================================="

          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API}"
          test -d "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2"
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          echo "Android API : ${ANDROID_API}"
          echo "Build Tools : ${BUILD_TOOLS}"
          echo "SDK         : ${ANDROID_HOME}"

          echo "SDK VERIFIED"


      # ============================================================
      # 7. FIND EXACT PROJECT ZIP
      # ============================================================

      - name: Find Majdoor Hisaab Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SEARCHING PROJECT ZIP"
          echo "=========================================="

          echo "Expected:"
          echo "${ZIP_NAME}"

          ZIP_PATH=""

          if [ -f "${ZIP_NAME}" ]; then
            ZIP_PATH="./${ZIP_NAME}"
          fi

          if [ -z "$ZIP_PATH" ]; then
            ZIP_PATH="$(
              find . \
                -maxdepth 6 \
                -type f \
                -name "${ZIP_NAME}" \
                -print \
                | head -n 1 || true
            )"
          fi

          if [ -z "$ZIP_PATH" ]; then

            echo ""
            echo "ERROR: Required ZIP was not found."
            echo ""

            echo "ZIP files available in repository:"
            find . \
              -maxdepth 8 \
              -type f \
              -iname "*.zip" \
              -print \
              | sort || true

            exit 1
          fi

          ZIP_PATH="$(realpath "$ZIP_PATH")"

          echo ""
          echo "=========================================="
          echo "PROJECT ZIP FOUND"
          echo "=========================================="

          echo "$ZIP_PATH"
          ls -lh "$ZIP_PATH"

          echo "PROJECT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"


      # ============================================================
      # 8. EXTRACT ZIP
      # ============================================================

      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/majdoor-hisaab-project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "=========================================="
          echo "EXTRACTING PROJECT"
          echo "=========================================="

          unzip -q "$PROJECT_ZIP" -d "$EXTRACT_DIR"

          echo "Extraction completed."

          echo ""
          echo "Project structure:"
          find "$EXTRACT_DIR" \
            -maxdepth 5 \
            -type f \
            \( \
              -name "settings.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradlew" \
              -o -name "MainActivity.kt" \
            \) \
            -print \
            | sort


      # ============================================================
      # 9. LOCATE PROJECT ROOT
      # ============================================================

      - name: Locate Android Project Root
        shell: bash
        run: |
          set -euo pipefail

          BASE="$RUNNER_TEMP/majdoor-hisaab-project"

          PROJECT_ROOT=""

          SETTINGS_KTS="$(
            find "$BASE" \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              | head -n 1 || true
          )"

          if [ -n "$SETTINGS_KTS" ]; then
            PROJECT_ROOT="$(dirname "$SETTINGS_KTS")"
          fi

          if [ -z "$PROJECT_ROOT" ]; then

            SETTINGS_GRADLE="$(
              find "$BASE" \
                -type f \
                -name "settings.gradle" \
                -print \
                | head -n 1 || true
            )"

            if [ -n "$SETTINGS_GRADLE" ]; then
              PROJECT_ROOT="$(dirname "$SETTINGS_GRADLE")"
            fi

          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Android project root not found."

            find "$BASE" \
              -maxdepth 8 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo "=========================================="
          echo "ANDROID PROJECT ROOT"
          echo "=========================================="

          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"


      # ============================================================
      # 10. VERIFY PROJECT
      # ============================================================

      - name: Verify Android Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "ANDROID PROJECT VERIFICATION"
          echo "=========================================="

          pwd

          test -f "settings.gradle.kts" || \
          test -f "settings.gradle"

          test -f "build.gradle.kts" || \
          test -f "build.gradle"

          test -f "app/build.gradle.kts" || \
          test -f "app/build.gradle"

          test -f "gradlew"

          chmod +x gradlew

          echo ""
          echo "Project files verified."


      # ============================================================
      # 11. VERIFY MAINACTIVITY
      # ============================================================

      - name: Verify Kotlin Source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          MAIN_KT="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          echo "=========================================="
          echo "KOTLIN SOURCE VERIFICATION"
          echo "=========================================="

          if [ ! -f "$MAIN_KT" ]; then
            echo "::error::MainActivity.kt not found."
            echo "$MAIN_KT"
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_KT"

          echo ""
          echo "Kotlin files:"
          find app/src/main \
            -type f \
            -name "*.kt" \
            -print \
            | sort

          echo ""
          echo "MainActivity line count:"
          wc -l "$MAIN_KT"

          echo ""
          echo "Checking required source symbols..."

          grep -q "private fun validDate" "$MAIN_KT"
          grep -q "private fun money" "$MAIN_KT"
          grep -q "private fun Stat" "$MAIN_KT"
          grep -q "private fun DetailTopBar" "$MAIN_KT"
          grep -q "private fun SmallAction" "$MAIN_KT"
          grep -q "private fun AttendanceScreen" "$MAIN_KT"
          grep -q "DeviceCredentialDeleteGate" "$MAIN_KT"
          grep -q "BackHandler" "$MAIN_KT"

          echo "Required source symbols verified."


      # ============================================================
      # 12. VERIFY PACKAGE / VERSION
      # ============================================================

      - name: Verify App Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "APP CONFIGURATION"
          echo "=========================================="

          grep -RIn \
            --include="*.gradle.kts" \
            --include="*.gradle" \
            "applicationId" \
            app . \
            2>/dev/null \
            | head -n 20 || true

          grep -RIn \
            --include="*.gradle.kts" \
            --include="*.gradle" \
            "versionCode" \
            app . \
            2>/dev/null \
            | head -n 20 || true

          grep -RIn \
            --include="*.gradle.kts" \
            --include="*.gradle" \
            "versionName" \
            app . \
            2>/dev/null \
            | head -n 20 || true

          echo ""
          echo "Expected package : ${PACKAGE_NAME}"
          echo "Expected version : ${VERSION_NAME}"
          echo "Expected code    : ${VERSION_CODE}"


      # ============================================================
      # 13. IMPORTANT:
      # NO KOTLIN PATCHING
      # NO PYTHON REPAIR
      # NO SOURCE REWRITE
      # ============================================================

      - name: Confirm Original Kotlin Source Is Untouched
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "SOURCE INTEGRITY CHECK"
          echo "=========================================="

          echo "No Python Kotlin patch."
          echo "No sed Kotlin patch."
          echo "No automatic source replacement."
          echo "Original ZIP source will be compiled as-is."

          echo ""
          echo "MainActivity checksum:"

          sha256sum \
            app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt


      # ============================================================
      # 14. CLEAN
      # ============================================================

      - name: Clean Android Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 15. COMPILE + BUILD RELEASE
      #
      # THIS IS THE IMPORTANT FIX.
      #
      # Do NOT modify MainActivity.kt here.
      # ============================================================

      - name: Compile Release Kotlin and Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "COMPILE RELEASE KOTLIN"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

          echo ""
          echo "=========================================="
          echo "RELEASE BUILD COMPLETED"
          echo "=========================================="


      # ============================================================
      # 16. LOCATE RELEASE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "RELEASE APK FILES"
          echo "=========================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          APK_PATH=""

          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          fi

          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(
              find app/build/outputs/apk/release \
                -type f \
                -name "*.apk" \
                -print \
                | head -n 1 || true
            )"
          fi

          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found."
            exit 1
          fi

          APK_PATH="$(realpath "$APK_PATH")"

          echo ""
          echo "RELEASE APK:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          cp "$APK_PATH" "$RUNNER_TEMP/original-release.apk"

          echo "ORIGINAL_APK=$RUNNER_TEMP/original-release.apk" >> "$GITHUB_ENV"


      # ============================================================
      # 17. VERIFY ORIGINAL APK
      # ============================================================

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          test -f "$ORIGINAL_APK"

          echo "=========================================="
          echo "RELEASE APK VERIFIED"
          echo "=========================================="

          ls -lh "$ORIGINAL_APK"


      # ============================================================
      # 18. CREATE TEMPORARY SIGNING KEYSTORE
      # ============================================================

      - name: Prepare APK Signing Keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/majdoor-hisaab-v82-release.p12"
          PASSWORD="MajdoorHisaabV82Signing@2026"

          rm -f "$KEYSTORE"

          echo "=========================================="
          echo "CREATING SIGNING KEYSTORE"
          echo "=========================================="

          keytool \
            -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -alias majdoor-hisaab-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -dname "CN=Majdoor Hisaab PRO, OU=RKMS, O=RKMS, L=Lakhimpur Kheri, ST=Uttar Pradesh, C=IN"

          test -s "$KEYSTORE"

          keytool \
            -list \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass "$PASSWORD" \
            -alias majdoor-hisaab-release \
            >/dev/null

          echo "Keystore verified."

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"


      # ============================================================
      # 19. ALIGN APK
      # ============================================================

      - name: Align Release APK
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          ALIGNED="$RUNNER_TEMP/${APK_ALIGNED_NAME}"

          test -x "$ZIPALIGN"
          test -f "$ORIGINAL_APK"

          rm -f "$ALIGNED"

          echo "=========================================="
          echo "ALIGNING APK"
          echo "=========================================="

          "$ZIPALIGN" \
            -f \
            -P 16 \
            4 \
            "$ORIGINAL_APK" \
            "$ALIGNED"

          test -f "$ALIGNED"

          "$ZIPALIGN" \
            -c \
            -P 16 \
            4 \
            "$ALIGNED"

          echo "Alignment successful."

          ls -lh "$ALIGNED"

          echo "ALIGNED_APK=$ALIGNED" >> "$GITHUB_ENV"


      # ============================================================
      # 20. SIGN APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          SIGNED="$RUNNER_TEMP/${APK_SIGNED_NAME}"

          test -x "$APKSIGNER"
          test -f "$ALIGNED_APK"
          test -f "$KEYSTORE"

          rm -f "$SIGNED"

          echo "=========================================="
          echo "SIGNING RELEASE APK"
          echo "=========================================="

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias majdoor-hisaab-release \
            --ks-pass pass:"$SIGNING_PASSWORD" \
            --key-pass pass:"$SIGNING_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$SIGNED" \
            "$ALIGNED_APK"

          test -f "$SIGNED"

          echo ""
          echo "SIGNED APK:"
          ls -lh "$SIGNED"

          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"


      # ============================================================
      # 21. VERIFY SIGNATURE
      # ============================================================

      - name: Verify Release APK Signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          test -f "$SIGNED_APK"

          echo "=========================================="
          echo "APK SIGNATURE VERIFICATION"
          echo "=========================================="

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"

          echo ""
          echo "SIGNATURE VERIFIED."


      # ============================================================
      # 22. VERIFY PACKAGE / VERSION / VERSION CODE
      # ============================================================

      - name: Verify Final APK Identity
        shell: bash
        run: |
          set -euo pipefail

          AAPT2="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2"

          test -x "$AAPT2"
          test -f "$SIGNED_APK"

          BADGING="$RUNNER_TEMP/final-badging.txt"

          "$AAPT2" dump badging "$SIGNED_APK" > "$BADGING"

          ACTUAL_PACKAGE="$(
            sed -n \
              "s/^package: name='\([^']*\)'.*/\1/p" \
              "$BADGING" \
              | head -n 1
          )"

          ACTUAL_VERSION="$(
            sed -n \
              "s/^package:.*versionName='\([^']*\)'.*/\1/p" \
              "$BADGING" \
              | head -n 1
          )"

          ACTUAL_CODE="$(
            sed -n \
              "s/^package:.*versionCode='\([^']*\)'.*/\1/p" \
              "$BADGING" \
              | head -n 1
          )"

          echo "=========================================="
          echo "FINAL APK IDENTITY"
          echo "=========================================="

          echo "EXPECTED PACKAGE : ${PACKAGE_NAME}"
          echo "ACTUAL PACKAGE   : ${ACTUAL_PACKAGE}"
          echo ""
          echo "EXPECTED VERSION : ${VERSION_NAME}"
          echo "ACTUAL VERSION   : ${ACTUAL_VERSION}"
          echo ""
          echo "EXPECTED CODE    : ${VERSION_CODE}"
          echo "ACTUAL CODE      : ${ACTUAL_CODE}"
          echo "=========================================="

          if [ "$ACTUAL_PACKAGE" != "$PACKAGE_NAME" ]; then
            echo "::error::Package name mismatch."
            exit 1
          fi

          if [ "$ACTUAL_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Version name mismatch."
            exit 1
          fi

          if [ "$ACTUAL_CODE" != "$VERSION_CODE" ]; then
            echo "::error::Version code mismatch."
            exit 1
          fi

          echo ""
          echo "APK IDENTITY VERIFIED."


      # ============================================================
      # 23. FINAL ALIGNMENT CHECK
      # ============================================================

      - name: Final APK Alignment Verification
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          "$ZIPALIGN" \
            -c \
            -P 16 \
            4 \
            "$SIGNED_APK"

          echo "=========================================="
          echo "FINAL APK ALIGNMENT VERIFIED"
          echo "=========================================="


      # ============================================================
      # 24. BUILD REPORT
      # ============================================================

      - name: Generate Build Report
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/Majdoor-Hisaab-PRO-V82-Build-Report.txt"

          {
            echo "=============================================="
            echo "MAJDOOR HISAAB PRO V82"
            echo "FINAL SIGNED RELEASE APK"
            echo "=============================================="
            echo ""
            echo "Package       : ${PACKAGE_NAME}"
            echo "Version       : ${VERSION_NAME}"
            echo "Version Code  : ${VERSION_CODE}"
            echo "Android API   : ${ANDROID_API}"
            echo "Build Tools   : ${BUILD_TOOLS}"
            echo "Java          : ${JAVA_VERSION}"
            echo "Gradle        : ${GRADLE_VERSION}"
            echo ""
            echo "Project ZIP:"
            echo "${ZIP_NAME}"
            echo ""
            echo "Signed APK:"
            echo "${APK_SIGNED_NAME}"
            echo ""
            echo "APK Size:"
            ls -lh "${SIGNED_APK}"
            echo ""
            echo "Signature:"
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner" \
              verify \
              --verbose \
              --print-certs \
              "${SIGNED_APK}"
            echo ""
            echo "16 KB alignment:"
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/zipalign" \
              -c \
              -P 16 \
              4 \
              "${SIGNED_APK}"
            echo ""
            echo "=============================================="
            echo "BUILD SUCCESSFUL"
            echo "=============================================="
          } > "$REPORT"

          cat "$REPORT"

          echo "REPORT=$REPORT" >> "$GITHUB_ENV"


      # ============================================================
      # 25. PREPARE FINAL ARTIFACTS
      # ============================================================

      - name: Prepare Final Artifacts
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/final-output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          cp \
            "$SIGNED_APK" \
            "$OUTPUT/${APK_SIGNED_NAME}"

          cp \
            "$ALIGNED_APK" \
            "$OUTPUT/${APK_ALIGNED_NAME}"

          cp \
            "$REPORT" \
            "$OUTPUT/Majdoor-Hisaab-PRO-V82-Build-Report.txt"

          echo "=========================================="
          echo "FINAL ARTIFACTS"
          echo "=========================================="

          ls -lh "$OUTPUT"


      # ============================================================
      # 26. UPLOAD SIGNED APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED
          path: |
            final-output/Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk
            final-output/Majdoor-Hisaab-PRO-V82-Build-Report.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 27. UPLOAD ALIGNED APK
      # ============================================================

      - name: Upload Aligned APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-ALIGNED
          path: |
            final-output/Majdoor-Hisaab-PRO-V82-ALIGNED.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 28. FINAL SUCCESS
      # ============================================================

      - name: Final Success
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "======================================================"
          echo "       MAJDOOR HISAAB PRO V82 BUILD SUCCESS"
          echo "======================================================"
          echo ""
          echo "Package       : ${PACKAGE_NAME}"
          echo "Version       : ${VERSION_NAME}"
          echo "Version Code  : ${VERSION_CODE}"
          echo ""
          echo "Final Signed APK:"
          echo "${APK_SIGNED_NAME}"
          echo ""
          echo "======================================================"
          echo "                BUILD SUCCESSFUL"
          echo "======================================================"


      # ============================================================
      # 29. CLEAN TEMP SIGNING KEY
      # ============================================================

      - name: Clean Temporary Signing Key
        if: always()
        shell: bash
        run: |
          rm -f "${KEYSTORE:-}" || true
