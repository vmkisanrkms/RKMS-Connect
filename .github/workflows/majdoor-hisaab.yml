          mkdir -p \
            "$FINAL_DIR"


          FINAL_APK="$FINAL_DIR/Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"


          cp \
            "$SIGNED_APK" \
            "$FINAL_APK"


          sha256sum \
            "$FINAL_APK" \
            > "$FINAL_DIR/SHA256SUMS.txt"


          echo
          echo "===== FINAL RELEASE ====="


          ls -lh \
            "$FINAL_DIR"


          echo
          echo "===== SHA256 ====="


          cat \
            "$FINAL_DIR/SHA256SUMS.txt"


