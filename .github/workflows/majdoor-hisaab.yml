name: Majdoor Hisaab PRO - V81 Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V81-ALL-BUTTONS-FINAL.zip"

jobs:

  build-release:

    name: Build Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SHOW REPOSITORY
      # ============================================================

      - name: Show repository files
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " MAJDOOR HISAAB PRO - V81"
          echo "============================================================"

          pwd

          echo
          echo "===== Repository ====="
          ls -la

          echo
          echo "===== ZIP / GRADLE FILES ====="

          find . -maxdepth 5 -type f \
            \( \
              -iname "*.zip" \
              -o -iname "*.gradle" \
              -o -iname "*.gradle.kts" \
              -o -iname "gradle-wrapper.properties" \
            \) \
            -print | sort


      # ============================================================
      # 3. JDK 17
      #
      # IMPORTANT:
      # No Gradle cache here because project is inside ZIP.
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. VERIFY JAVA
      # ============================================================

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version

          echo
          javac -version


      # ============================================================
      # 5. PREPARE ANDROID SDK 36
      # ============================================================

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " ANDROID SDK 36"
          echo "============================================================"

          if [[ -n "${ANDROID_HOME:-}" ]]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [[ -n "${ANDROID_SDK_ROOT:-}" ]]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            SDK_ROOT="$HOME/android-sdk"
          fi

          echo "SDK_ROOT=$SDK_ROOT"

          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          SDKMANAGER=""

          if [[ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -path "*/bin/sdkmanager" \
                -print \
                2>/dev/null \
                | sort \
                | tail -n 1 \
                || true
            )"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found."

            find "$SDK_ROOT" \
              -type f \
              -name "sdkmanager" \
              -print \
              2>/dev/null \
              || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"

          echo
          "$SDKMANAGER" --version

          echo
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo
          echo "Installing required packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo
          echo "Verifying SDK..."

          test -d \
            "$SDK_ROOT/platforms/android-${ANDROID_API}"

          test -d \
            "$SDK_ROOT/build-tools/${BUILD_TOOLS}"

          test -x \
            "$SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "$SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          test -x \
            "$SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          echo
          echo "ANDROID SDK 36 READY"


      # ============================================================
      # 6. LOCATE / EXTRACT V81 ZIP
      # ============================================================

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " LOCATE ANDROID PROJECT"
          echo "============================================================"

          FOUND_ROOT=""

          # --------------------------------------------------------
          # Repository root
          # --------------------------------------------------------

          if [[ -f "settings.gradle.kts" ]] && \
             [[ -f "app/build.gradle.kts" ]]; then

            FOUND_ROOT="$PWD"

            echo "Project found at repository root."

          fi


          # --------------------------------------------------------
          # Exact V81 ZIP
          # --------------------------------------------------------

          if [[ -z "$FOUND_ROOT" ]] && \
             [[ -f "$ZIP_NAME" ]]; then

            echo "Found V81 ZIP:"
            echo "$ZIP_NAME"

            rm -rf extracted_project

            mkdir -p extracted_project

            unzip -q \
              "$ZIP_NAME" \
              -d extracted_project

            FOUND_ROOT="$(
              find "$PWD/extracted_project" \
                -type f \
                -name "settings.gradle.kts" \
                -print \
                | while read -r file; do

                    dir="$(dirname "$file")"

                    if [[ -f "$dir/app/build.gradle.kts" ]]; then
                      echo "$dir"
                      break
                    fi

                  done
            )"

          fi


          # --------------------------------------------------------
          # Fallback
          # --------------------------------------------------------

          if [[ -z "$FOUND_ROOT" ]]; then

            FOUND_ROOT="$(
              find "$PWD" \
                -type f \
                -name "settings.gradle.kts" \
                -print \
                | while read -r file; do

                    dir="$(dirname "$file")"

                    if [[ -f "$dir/app/build.gradle.kts" ]]; then
                      echo "$dir"
                      break
                    fi

                  done
            )"

          fi


          if [[ -z "$FOUND_ROOT" ]]; then

            echo "ERROR: Android project not found."

            find "$PWD" \
              -maxdepth 6 \
              -type f \
              -print \
              | head -500

            exit 1

          fi


          echo "ANDROID_PROJECT_ROOT=$FOUND_ROOT" \
            >> "$GITHUB_ENV"


          echo
          echo "ANDROID PROJECT:"
          echo "$FOUND_ROOT"


          echo
          echo "===== PROJECT FILES ====="

          find "$FOUND_ROOT" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -400


      # ============================================================
      # 7. GRADLE
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false


      # ============================================================
      # 8. VERIFY PROJECT CONFIGURATION
      # ============================================================

      - name: Verify project configuration
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " PROJECT CONFIGURATION"
          echo "============================================================"

          test -f settings.gradle.kts
          test -f app/build.gradle.kts

          echo
          echo "===== settings.gradle.kts ====="

          sed -n '1,260p' \
            settings.gradle.kts

          echo
          echo "===== app/build.gradle.kts ====="

          sed -n '1,380p' \
            app/build.gradle.kts

          echo
          echo "===== CHECKS ====="

          grep -q \
            'com.majdoor.hisaab' \
            app/build.gradle.kts

          grep -Eq \
            'compileSdk.*36|compileSdk = 36' \
            app/build.gradle.kts

          grep -Eq \
            'targetSdk.*36|targetSdk = 36' \
            app/build.gradle.kts

          grep -Eq \
            'versionCode.*77|versionCode = 77' \
            app/build.gradle.kts

          grep -Eq \
            'versionName.*1.77.0|versionName = "1.77.0"' \
            app/build.gradle.kts

          echo
          echo "PROJECT CONFIGURATION PASSED"


      # ============================================================
      # 9. LOCATE MAINACTIVITYSCREENS
      # ============================================================

      - name: Locate MainActivityScreens
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          SRC="$(
            find . \
              -type f \
              -name "MainActivityScreens.kt" \
              -print \
              | head -n 1
          )"

          if [[ -z "$SRC" ]]; then
            echo "ERROR: MainActivityScreens.kt not found."
            exit 1
          fi

          echo "MAIN_ACTIVITY_SCREENS=$SRC" \
            >> "$GITHUB_ENV"

          echo
          echo "SOURCE:"
          echo "$SRC"


      # ============================================================
      # 10. COMPLETE V81 KOTLIN SOURCE FIX
      #
      # This fixes:
      #
      # - fillViewport
      # - btn() default action
      # - pick() Button/TextView mismatch
      # - self-referencing btn() variables
      # - unresolved it.text
      # - statusViews map
      # - exportType when
      # - Intent.type shadowing
      # - renderSummary forward reference
      # - attendanceForm
      # - customReport
      # ============================================================

      - name: Apply complete V81 Kotlin fixes
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          export PROJECT_ROOT="$PWD"

          python3 <<'PY'

          import os
          import re
          from pathlib import Path


          # ========================================================
          # FIND SOURCE
          # ========================================================

          root = Path(
              os.environ["PROJECT_ROOT"]
          )

          files = list(
              root.rglob(
                  "MainActivityScreens.kt"
              )
          )

          if not files:
              raise SystemExit(
                  "ERROR: MainActivityScreens.kt not found."
              )

          src = files[0]

          text = src.read_text(
              encoding="utf-8"
          )

          original = text


          print()
          print("============================================================")
          print(" COMPLETE V81 KOTLIN PATCH")
          print("============================================================")

          print("SOURCE:")
          print(src)


          # ========================================================
          # HELPER
          # ========================================================

          def replace_required(old, new, name, count=1):

              global text

              if old not in text:

                  raise SystemExit(
                      f"ERROR: Required source pattern not found: {name}"
                  )

              actual = text.count(old)

              if actual < count:

                  raise SystemExit(
                      f"ERROR: Pattern count too low for {name}: "
                      f"{actual} < {count}"
                  )

              text = text.replace(
                  old,
                  new,
                  count
              )

              print(
                  "FIXED:",
                  name
              )


          # ========================================================
          # 1. btn() DEFAULT ACTION
          # ========================================================

          if (
              "internal fun MainActivity.btn(s:String,action:()->Unit)=TextView(this).apply{"
              in text
          ):

              text = text.replace(
                  "internal fun MainActivity.btn(s:String,action:()->Unit)=TextView(this).apply{",
                  "internal fun MainActivity.btn(s:String,action:()->Unit = {})=TextView(this).apply{",
                  1
              )

              print("FIXED: btn() default action")

          elif (
              "internal fun MainActivity.btn(s:String,action:()->Unit = {})=TextView(this).apply{"
              in text
          ):

              print(
                  "OK: btn() already has default action"
              )

          else:

              print(
                  "WARNING: btn() signature was not found"
              )


          # ========================================================
          # 2. ScrollView
          # ========================================================

          if "fillViewport=true" in text:

              text = text.replace(
                  "fillViewport=true",
                  "setFillViewport(true)"
              )

              print(
                  "FIXED: ScrollView fillViewport"
              )


          # ========================================================
          # 3. pick() RETURN TYPE
          # ========================================================

          if (
              "onPick:(Int)->Unit):Button"
              in text
          ):

              text = text.replace(
                  "onPick:(Int)->Unit):Button",
                  "onPick:(Int)->Unit):TextView",
                  1
              )

              print(
                  "FIXED: pick() Button -> TextView"
              )


          # ========================================================
          # 4. statusViews MAP
          # ========================================================

          text = text.replace(
              'statusViews.forEach{it.text="FULL"}',
              'statusViews.values.forEach{it.text="FULL"}'
          )

          text = text.replace(
              'statusViews.forEach{it.text="HALF"}',
              'statusViews.values.forEach{it.text="HALF"}'
          )

          text = text.replace(
              'statusViews.forEach{it.text=AttendanceRules.UNMARKED}',
              'statusViews.values.forEach{it.text=AttendanceRules.UNMARKED}'
          )


          # ========================================================
          # 5. CROP FORM
          # ========================================================

          old = '''val n=field("Crop name",old?.name?:"");val v=field("Variety",old?.variety?:"");val fields=app.fields.list().filter{it.active};var fieldId=old?.fieldId?:fields.firstOrNull()?.id.orEmpty();val fb=btn("Field: ${selectedName(fieldId,fields.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select field").setItems(fields.map{it.name}.toTypedArray()){_,i->fieldId=fields[i].id;it.text="Field: ${fields[i].name}"}.show()};val d=dateField("Planting date",old?.plantingDate?:today);val a=field("Area",old?.area?.toString()?:"0");val notes=field("Notes",old?.notes?:"")'''

          new = '''val n=field("Crop name",old?.name?:"");val v=field("Variety",old?.variety?:"");val fields=app.fields.list().filter{it.active};var fieldId=old?.fieldId?:fields.firstOrNull()?.id.orEmpty();val fb=btn("Field: ${selectedName(fieldId,fields.map{it.id to it.name})}");fb.setOnClickListener{AlertDialog.Builder(this).setTitle("Select field").setItems(fields.map{it.name}.toTypedArray()){_,i->fieldId=fields[i].id;fb.text="Field: ${fields[i].name}"}.show()};val d=dateField("Planting date",old?.plantingDate?:today);val a=field("Area",old?.area?.toString()?:"0");val notes=field("Notes",old?.notes?:"")'''

          replace_required(
              old,
              new,
              "crop form field button"
          )


          # ========================================================
          # 6. PRODUCTION CROP BUTTON
          # ========================================================

          old = '''val cropBtn=btn("Crop: ${selectedName(cropId,crops.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select crop").setItems(crops.map{it.name}.toTypedArray()){_,i->cropId=crops[i].id;it.text="Crop: ${crops[i].name}"}.show()}'''

          new = '''val cropBtn=btn("Crop: ${selectedName(cropId,crops.map{it.id to it.name})}");cropBtn.setOnClickListener{AlertDialog.Builder(this).setTitle("Select crop").setItems(crops.map{it.name}.toTypedArray()){_,i->cropId=crops[i].id;cropBtn.text="Crop: ${crops[i].name}"}.show()}'''

          replace_required(
              old,
              new,
              "production crop button",
              1
          )


          # ========================================================
          # 7. REVENUE CROP BUTTON
          # ========================================================

          replace_required(
              old,
              new,
              "revenue crop button",
              1
          )


          # ========================================================
          # 8. WORK FIELD BUTTON
          # ========================================================

          old = '''val fieldBtn=btn("Field: ${selectedName(fieldId,fields.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select field").setItems(fields.map{it.name}.toTypedArray()){_,i->fieldId=fields[i].id;it.text="Field: ${fields[i].name}"}.show()}'''

          new = '''val fieldBtn=btn("Field: ${selectedName(fieldId,fields.map{it.id to it.name})}");fieldBtn.setOnClickListener{AlertDialog.Builder(this).setTitle("Select field").setItems(fields.map{it.name}.toTypedArray()){_,i->fieldId=fields[i].id;fieldBtn.text="Field: ${fields[i].name}"}.show()}'''

          replace_required(
              old,
              new,
              "work field button"
          )


          # ========================================================
          # 9. WORK CROP BUTTON
          # ========================================================

          old = '''val cropBtn=btn("Crop: ${selectedName(cropId,crops.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select crop").setItems(crops.map{it.name}.toTypedArray()){_,i->cropId=crops[i].id;it.text="Crop: ${crops[i].name}"}.show()}'''

          new = '''val cropBtn=btn("Crop: ${selectedName(cropId,crops.map{it.id to it.name})}");cropBtn.setOnClickListener{AlertDialog.Builder(this).setTitle("Select crop").setItems(crops.map{it.name}.toTypedArray()){_,i->cropId=crops[i].id;cropBtn.text="Crop: ${crops[i].name}"}.show()}'''

          replace_required(
              old,
              new,
              "work crop button"
          )


          # ========================================================
          # 10. WORKER SELECT BUTTON
          # ========================================================

          old = '''val workerBtn=btn("Workers: ${selectedWorkers.size}"){
            val checked=workers.map{selectedWorkers.contains(it.id)}.toBooleanArray()
            AlertDialog.Builder(this).setTitle("Select workers").setMultiChoiceItems(workers.map{it.name}.toTypedArray(),checked){_,which,on->if(on)selectedWorkers.add(workers[which].id)else selectedWorkers.remove(workers[which].id)}.setPositiveButton("Done"){_,_->it.text="Workers: ${selectedWorkers.distinct().size}"}.show()
        }'''

          new = '''val workerBtn=btn("Workers: ${selectedWorkers.size}")
        workerBtn.setOnClickListener{
            val checked=workers.map{selectedWorkers.contains(it.id)}.toBooleanArray()
            AlertDialog.Builder(this).setTitle("Select workers").setMultiChoiceItems(workers.map{it.name}.toTypedArray(),checked){_,which,on->if(on)selectedWorkers.add(workers[which].id)else selectedWorkers.remove(workers[which].id)}.setPositiveButton("Done"){_,_->workerBtn.text="Workers: ${selectedWorkers.distinct().size}"}.show()
        }'''

          replace_required(
              old,
              new,
              "work worker button"
          )


          # ========================================================
          # 11. WORK RATE TYPE
          # ========================================================

          old = '''var rateType=app.calculation.normalize(old?.rateType?:"QUANTITY",old?.unit?:"acre");val rateTypeBtn=btn("Rate type: $rateType"){AlertDialog.Builder(this).setTitle("Select rate type").setItems(app.calculation.rateTypes().toTypedArray()){_,i->rateType=app.calculation.rateTypes()[i];it.text="Rate type: $rateType"}.show()};'''

          new = '''var rateType=app.calculation.normalize(old?.rateType?:"QUANTITY",old?.unit?:"acre");val rateTypeBtn=btn("Rate type: $rateType");rateTypeBtn.setOnClickListener{AlertDialog.Builder(this).setTitle("Select rate type").setItems(app.calculation.rateTypes().toTypedArray()){_,i->rateType=app.calculation.rateTypes()[i];rateTypeBtn.text="Rate type: $rateType"}.show()};'''

          replace_required(
              old,
              new,
              "work rate type button"
          )


          # ========================================================
          # 12. PAYMENT FORM
          # ========================================================

          old = '''val wb=btn("Worker: ${selectedName(wid,workers.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select worker").setItems(workers.map{it.name}.toTypedArray()){_,i->wid=workers[i].id;it.text="Worker: ${workers[i].name}"}.show()};val d=dateField("Date",old?.date?:today);val a=field("Amount",old?.amount?.toString()?:"");var method=old?.method?:"Cash";val mb=btn("Method: $method"){val methods=arrayOf("Cash","Bank","UPI");AlertDialog.Builder(this).setTitle("Payment method").setItems(methods){_,i->method=methods[i];it.text="Method: ${methods[i]}"}.show()};val adv=btn("Advance: ${if(advance)"YES" else "NO"}"){advance=!advance;it.text="Advance: ${if(advance)"YES" else "NO"}"};val ref=field("Reference",old?.reference?:"");val notes=field("Notes",old?.notes?:"");listOf(wb,d,a,mb,adv,ref,notes).forEach{b.addView(it)}'''

          new = '''val wb=btn("Worker: ${selectedName(wid,workers.map{it.id to it.name})}");wb.setOnClickListener{AlertDialog.Builder(this).setTitle("Select worker").setItems(workers.map{it.name}.toTypedArray()){_,i->wid=workers[i].id;wb.text="Worker: ${workers[i].name}"}.show()};val d=dateField("Date",old?.date?:today);val a=field("Amount",old?.amount?.toString()?:"");var method=old?.method?:"Cash";val mb=btn("Method: $method");mb.setOnClickListener{val methods=arrayOf("Cash","Bank","UPI");AlertDialog.Builder(this).setTitle("Payment method").setItems(methods){_,i->method=methods[i];mb.text="Method: ${methods[i]}"}.show()};val adv=btn("Advance: ${if(advance)"YES" else "NO"}");adv.setOnClickListener{advance=!advance;adv.text="Advance: ${if(advance)"YES" else "NO"}"};val ref=field("Reference",old?.reference?:"");val notes=field("Notes",old?.notes?:"");listOf(wb,d,a,mb,adv,ref,notes).forEach{b.addView(it)}'''

          replace_required(
              old,
              new,
              "payment form buttons"
          )


          # ========================================================
          # 13. EXPENSE FORM
          # ========================================================

          old = re.search(
              r'        val cb=btn\("Category: \$cat"\).*?listOf\(cb,fb,crb,d,a,n\)\.forEach\{b\.addView\(it\)\}',
              text,
              flags=re.S
          )

          if not old:
              raise SystemExit(
                  "ERROR: Expense form block not found."
              )

          new = '''        val cb=btn("Category: $cat")
        cb.setOnClickListener{AlertDialog.Builder(this).setTitle("Expense category").setItems(cats.toTypedArray()){_,i->cat=cats[i];cb.text="Category: $cat"}.show()}

        val fb=btn("Field: ${if(fieldId.isBlank())"Not linked" else selectedName(fieldId,fields.map{it.id to it.name})}")
        fb.setOnClickListener{val labels=listOf("Not linked")+fields.map{it.name};AlertDialog.Builder(this).setTitle("Select field").setItems(labels.toTypedArray()){_,i->if(i==0){fieldId="";fb.text="Field: Not linked"}else{fieldId=fields[i-1].id;fb.text="Field: ${fields[i-1].name}"}}.show()}

        val crb=btn("Crop: ${if(cropId.isBlank())"Not linked" else selectedName(cropId,crops.map{it.id to it.name})}")
        crb.setOnClickListener{val labels=listOf("Not linked")+crops.map{it.name};AlertDialog.Builder(this).setTitle("Select crop").setItems(labels.toTypedArray()){_,i->if(i==0){cropId="";crb.text="Crop: Not linked"}else{cropId=crops[i-1].id;crb.text="Crop: ${crops[i-1].name}"}}.show()}

        val d=dateField("Date",old?.date?:today);val a=field("Amount",old?.amount?.toString()?:"");val n=field("Notes",old?.notes?:"");listOf(cb,fb,crb,d,a,n).forEach{b.addView(it)}'''

          text = (
              text[:old.start()]
              + new
              + text[old.end():]
          )

          print(
              "FIXED: expense form buttons"
          )


          # ========================================================
          # 14. REPORT FILTER BUTTONS
          # ========================================================

          old = '''        val wb=btn("Worker: ${if(wid.isBlank())"All" else selectedName(wid,workers.map{it.id to it.name})}"){ val labels=listOf("All")+workers.map{it.name}; AlertDialog.Builder(this).setTitle("Worker").setItems(labels.toTypedArray()){_,i->wid=if(i==0)"" else workers[i-1].id; it.text="Worker: ${if(i==0)"All" else workers[i-1].name}"}.show() }
        val fb=btn("Field: ${if(fid.isBlank())"All" else selectedName(fid,fields.map{it.id to it.name})}"){ val labels=listOf("All")+fields.map{it.name}; AlertDialog.Builder(this).setTitle("Field").setItems(labels.toTypedArray()){_,i->fid=if(i==0)"" else fields[i-1].id; it.text="Field: ${if(i==0)"All" else fields[i-1].name}"}.show() }
