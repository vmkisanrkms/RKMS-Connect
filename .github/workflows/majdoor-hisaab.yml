name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_CODE: "82"
  VERSION_NAME: "1.82.0"

  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_HAJRI_PHOTO_PDF_FIXED_FINAL_V9.zip"
  APK_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

jobs:

  build-release:

    name: Build, Sign and Verify Release APK

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ============================================================
      # 4. LOCATE ANDROID SDK
      #
      # Do NOT use android-actions/setup-android@v3.
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT=""

          if [ -n "${ANDROID_SDK_ROOT:-}" ] && \
             [ -d "$ANDROID_SDK_ROOT" ]; then

            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -n "${ANDROID_HOME:-}" ] && \
               [ -d "$ANDROID_HOME" ]; then

            SDK_ROOT="$ANDROID_HOME"

          elif [ -d "/usr/local/lib/android/sdk" ]; then

            SDK_ROOT="/usr/local/lib/android/sdk"

          else
            echo "::error::Android SDK not found."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT"

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name "sdkmanager" \
                -print \
                -quit \
                2>/dev/null || true
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "SDKMANAGER=$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 5. ACCEPT ANDROID LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          echo "Android SDK licenses accepted."


      # ============================================================
      # 6. INSTALL API 36
      #
      # IMPORTANT:
      # No obsolete "tools" package.
      # ============================================================

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d \
            "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}"

          test -d \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          echo "Android API ${ANDROID_API}: PASS"
          echo "Build Tools ${BUILD_TOOLS}: PASS"


      # ============================================================
      # 7. VERIFY ENVIRONMENT
      # ============================================================

      - name: Verify Java Gradle and Android
        shell: bash
        run: |
          set -euo pipefail

          echo "================ JAVA ================"
          java -version

          echo
          echo "================ GRADLE ================"
          gradle --version

          echo
          echo "================ ANDROID ================"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo
          echo "================ AAPT2 ================"
          "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2" version

          echo
          echo "================ APKSIGNER ================"
          "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner" --version

          echo
          echo "Environment verification: PASS"


      # ============================================================
      # 8. LOCATE V9 ZIP
      # ============================================================

      - name: Locate V9 project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH=""

          if [ -f "$GITHUB_WORKSPACE/${ZIP_NAME}" ]; then
            ZIP_PATH="$GITHUB_WORKSPACE/${ZIP_NAME}"
          else
            ZIP_PATH="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "$ZIP_NAME" \
                -print \
                -quit \
                2>/dev/null || true
            )"
          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::V9 project ZIP not found."
            echo
            echo "Expected:"
            echo "$ZIP_NAME"
            echo
            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print || true
            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"

          echo
          echo "V9 ZIP:"
          echo "$ZIP_PATH"


      # ============================================================
      # 9. VERIFY ZIP
      # ============================================================

      - name: Verify V9 ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$PROJECT_ZIP"

          echo "V9 ZIP integrity: PASS"


      # ============================================================
      # 10. EXTRACT ZIP
      # ============================================================

      - name: Extract V9 project ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_ROOT="$RUNNER_TEMP/majdoor-v9-project"

          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"

          unzip -q \
            "$PROJECT_ZIP" \
            -d "$EXTRACT_ROOT"

          echo "EXTRACT_ROOT=$EXTRACT_ROOT" >> "$GITHUB_ENV"

          echo "V9 ZIP extraction: PASS"


      # ============================================================
      # 11. LOCATE ANDROID PROJECT
      # ============================================================

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find "$EXTRACT_ROOT" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print \
              -quit \
              2>/dev/null || true
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo
          echo "PROJECT_ROOT:"
          echo "$PROJECT_ROOT"


      # ============================================================
      # 12. VERIFY PROJECT STRUCTURE
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            "$PROJECT_ROOT/settings.gradle.kts" \
            || test -f \
            "$PROJECT_ROOT/settings.gradle"

          test -f \
            "$PROJECT_ROOT/build.gradle.kts" \
            || test -f \
            "$PROJECT_ROOT/build.gradle"

          test -f \
            "$PROJECT_ROOT/app/build.gradle.kts" \
            || test -f \
            "$PROJECT_ROOT/app/build.gradle"

          test -f \
            "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          test -f \
            "$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          test -f \
            "$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"

          echo "Android project structure: PASS"


      # ============================================================
      # 13. VERIFY MAINACTIVITY
      # ============================================================

      - name: Verify MainActivity Kotlin source
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          echo "MainActivity:"
          echo "$MAIN"

          if grep -Fxq \
            "import androidx.compose.foundation.lazy.item" \
            "$MAIN"; then

            echo "::error::Invalid lazy.item import found."
            exit 1
          fi

          if ! grep -Fxq \
            "import androidx.compose.foundation.lazy.items" \
            "$MAIN"; then

            echo "::error::lazy.items import missing."
            exit 1
          fi

          REQUIRED_SYMBOLS="
          fun validDate
          fun today
          fun money
          fun displayDate
          fun Stat
          fun DashboardStat
          fun DashboardModule
          fun LabourScreen
          fun FieldScreen
          fun CropScreen
          fun ExpenseScreen
          fun SaleScreen
          fun AttendanceScreen
          fun FieldDetail
          fun LabourDetail
          fun PaymentDialog
          fun RateDialog
          fun CropDetail
          exportReportPhoto
          exportReportPdf
          ExportButtons
          DeviceCredentialDeleteGate
          "

          while IFS= read -r SYMBOL; do

            SYMBOL="$(echo "$SYMBOL" | xargs)"

            if [ -z "$SYMBOL" ]; then
              continue
            fi

            if ! grep -q "$SYMBOL" "$MAIN"; then
              echo "::error::Required source symbol missing: $SYMBOL"
              exit 1
            fi

          done <<< "$REQUIRED_SYMBOLS"

          echo "MainActivity source verification: PASS"


      # ============================================================
      # 14. VERIFY FILE PROVIDER
      # ============================================================

      - name: Verify FileProvider reports path
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"

          grep -q \
            "cache-path" \
            "$FILE"

          grep -q \
            'path="reports/"' \
            "$FILE"

          echo "FileProvider reports path: PASS"


      # ============================================================
      # 15. VERIFY APP CONFIG
      # ============================================================

      - name: Verify application configuration
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "Application configuration:"
          echo

          grep -n "applicationId" "$APP_GRADLE" || true
          grep -n "versionCode" "$APP_GRADLE" || true
          grep -n "versionName" "$APP_GRADLE" || true
          grep -n "compileSdk" "$APP_GRADLE" || true
          grep -n "targetSdk" "$APP_GRADLE" || true
          grep -n "minSdk" "$APP_GRADLE" || true

          echo

          grep -Eq \
            'applicationId[[:space:]]*=[[:space:]]*"com\.majdoor\.hisaabpro"' \
            "$APP_GRADLE"

          grep -Eq \
            'versionCode[[:space:]]*=[[:space:]]*82([[:space:]]|$)' \
            "$APP_GRADLE"

          grep -Eq \
            'versionName[[:space:]]*=[[:space:]]*"1\.82\.0"' \
            "$APP_GRADLE"

          grep -Eq \
            'compileSdk[[:space:]]*=?[[:space:]]*36' \
            "$APP_GRADLE"

          grep -Eq \
            'targetSdk[[:space:]]*=?[[:space:]]*36' \
            "$APP_GRADLE"

          grep -Eq \
            'minSdk[[:space:]]*=?[[:space:]]*23' \
            "$APP_GRADLE"

          grep -q \
            "JavaVersion.VERSION_17" \
            "$APP_GRADLE"

          echo "Package/version/SDK verification: PASS"


      # ============================================================
      # 16. CONFIGURE SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          printf 'sdk.dir=%s\n' \
            "$ANDROID_SDK_ROOT" \
            > "$PROJECT_ROOT/local.properties"

          cat "$PROJECT_ROOT/local.properties"


      # ============================================================
      # 17. CHECK PERMANENT SIGNING SECRETS
      #
      # EXACT SECRET NAMES FROM YOUR GITHUB SCREENSHOT:
      #
      # RELEASE_KEYSTORE_BASE64
      # RELEASE_KEYSTORE_PASSWORD
      # RELEASE_KEY_ALIAS
      # RELEASE_KEY_PASSWORD
      #
      # ============================================================

      - name: Check permanent signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          MISSING=0

          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing secret: RELEASE_KEYSTORE_BASE64"
            MISSING=1
          fi

          if [ -z "${RELEASE_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Missing secret: RELEASE_KEYSTORE_PASSWORD"
            MISSING=1
          fi

          if [ -z "${RELEASE_KEY_ALIAS:-}" ]; then
            echo "::error::Missing secret: RELEASE_KEY_ALIAS"
            MISSING=1
          fi

          if [ -z "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "::error::Missing secret: RELEASE_KEY_PASSWORD"
            MISSING=1
          fi

          if [ "$MISSING" -ne 0 ]; then

            echo
            echo "=============================================="
            echo "PERMANENT SIGNING SECRETS ARE INCOMPLETE"
            echo "=============================================="

            echo
            echo "Required repository secrets:"
            echo "1. RELEASE_KEYSTORE_BASE64"
            echo "2. RELEASE_KEYSTORE_PASSWORD"
            echo "3. RELEASE_KEY_ALIAS"
            echo "4. RELEASE_KEY_PASSWORD"

            echo
            echo "NO temporary keystore will be generated."

            exit 1
          fi

          echo "All permanent signing secrets are PRESENT."


      # ============================================================
      # 18. PREPARE PERMANENT PRODUCTION KEYSTORE
      #
      # NEVER generate a new key here.
      # ============================================================

      - name: Prepare permanent production signing keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

        run: |
          set -euo pipefail

          KEYSTORE_FILE="$RUNNER_TEMP/majdoor-hisaab-pro-production.p12"

          printf '%s' \
            "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          keytool \
            -list \
            -storetype PKCS12 \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            >/dev/null

          CERT_SHA256="$(
            keytool \
              -list \
              -v \
              -storetype PKCS12 \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$RELEASE_KEYSTORE_PASSWORD" \
              -alias "$RELEASE_KEY_ALIAS" \
              | awk -F': ' '/SHA256:/{print $2; exit}' \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Could not read production certificate SHA-256."
            exit 1
          fi

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "RELEASE_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

          echo "Permanent production keystore: PASS"


      # ============================================================
      # 19. GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            clean \
            --no-daemon \
            --stacktrace

          echo "Gradle clean: PASS"


      # ============================================================
      # 20. BUILD RELEASE APK
      #
      # We build first.
      # Then below we determine whether Gradle already signed it.
      #
      # If unsigned:
      #   ZIPALIGN -> APKSIGNER -> permanent production key
      #
      # If already signed:
      #   certificate MUST match permanent production key.
      # ============================================================

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

          echo "Release APK build: PASS"


      # ============================================================
      # 21. LOCATE RAW APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          RAW_APK="$(
            find \
              "$PROJECT_ROOT/app/build/outputs/apk/release" \
              -type f \
              -name "*.apk" \
              -print \
              -quit \
              2>/dev/null || true
          )"

          if [ -z "$RAW_APK" ]; then
            echo "::error::Release APK not found."
            exit 1
          fi

          echo "RAW_APK=$RAW_APK" >> "$GITHUB_ENV"

          echo
          echo "RAW APK:"
          echo "$RAW_APK"

          ls -lh "$RAW_APK"


      # ============================================================
      # 22. SIGN / VERIFY WITH PERMANENT KEY
      # ============================================================

      - name: Sign Release APK with permanent production key
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          FINAL_APK="$RUNNER_TEMP/$APK_NAME"
          ALIGNED_APK="$RUNNER_TEMP/aligned-release.apk"

          # --------------------------------------------------------
          # CASE 1:
          # Gradle already produced a signed APK.
          # --------------------------------------------------------

          if "$APKSIGNER" verify "$RAW_APK" >/dev/null 2>&1; then

            echo "Gradle APK is already signed."

            ACTUAL_CERT="$(
              "$APKSIGNER" \
                verify \
                --print-certs \
                "$RAW_APK" \
                2>&1 \
                | awk -F': ' \
                  '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
                | tr -d ' :\r\n' \
                | tr '[:lower:]' '[:upper:]'
            )"

            EXPECTED_CERT="$(
              printf '%s' "$RELEASE_CERT_SHA256" \
                | tr -d ' :\r\n' \
                | tr '[:lower:]' '[:upper:]'
            )"

            echo "Expected certificate:"
            echo "$EXPECTED_CERT"

            echo "APK certificate:"
            echo "$ACTUAL_CERT"

            if [ -z "$ACTUAL_CERT" ]; then
              echo "::error::Could not read APK certificate."
              exit 1
            fi

            if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
              echo "::error::APK is signed with a different certificate."
              echo "::error::Permanent production certificate mismatch."
              exit 1
            fi

            cp "$RAW_APK" "$FINAL_APK"

            echo "Existing permanent signature: VERIFIED."

          else

            # ------------------------------------------------------
            # CASE 2:
            # APK is unsigned.
            # Align and sign using permanent production key.
            # ------------------------------------------------------

            echo "APK is unsigned."
            echo "Signing with permanent production keystore."

            rm -f "$ALIGNED_APK"

            "$ZIPALIGN" \
              -f \
              -P 16 \
              4 \
              "$RAW_APK" \
              "$ALIGNED_APK"

            "$APKSIGNER" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-type PKCS12 \
              --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
              --key-pass env:RELEASE_KEY_PASSWORD \
              --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --min-sdk-version 23 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$FINAL_APK" \
              "$ALIGNED_APK"

            echo "Permanent production signing: PASS."

          fi

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          test -f "$FINAL_APK"

          ls -lh "$FINAL_APK"


      # ============================================================
      # 23. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$FINAL_APK"

          echo
          echo "APK signature verification: PASS"


      # ============================================================
      # 24. VERIFY PRODUCTION CERTIFICATE
      # ============================================================

      - name: Verify final production certificate
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          EXPECTED="$(
            printf '%s' \
              "$RELEASE_CERT_SHA256" \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"

          ACTUAL="$(
            "$APKSIGNER" \
              verify \
              --print-certs \
              "$FINAL_APK" \
              2>&1 \
              | awk -F': ' \
                '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read final APK certificate."
            exit 1
          fi

          echo
          echo "Production certificate:"
          echo "$EXPECTED"

          echo
          echo "Final APK certificate:"
          echo "$ACTUAL"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::FINAL APK CERTIFICATE MISMATCH."
            exit 1
          fi

          echo
          echo "Permanent production certificate: VERIFIED"


      # ============================================================
      # 25. VERIFY APK ALIGNMENT
      # ============================================================

      - name: Verify APK alignment
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          "$ZIPALIGN" \
            -c \
            -P 16 \
            4 \
            "$FINAL_APK"

          echo "APK alignment verification: PASS"


      # ============================================================
      # 26. VERIFY PACKAGE AND VERSION
      # ============================================================

      - name: Verify final APK package and version
        shell: bash
        run: |
          set -euo pipefail

          AAPT2="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"
          BADGING="$RUNNER_TEMP/badging.txt"

          "$AAPT2" \
            dump \
            badging \
            "$FINAL_APK" \
            > "$BADGING"

          echo "=============================================="
          echo "APK BADGING"
          echo "=============================================="

          cat "$BADGING"

          echo
          echo "Checking package..."

          grep -q \
            "package: name='${PACKAGE_NAME}'" \
            "$BADGING"

          echo "Package: PASS"

          echo
          echo "Checking version code..."

          grep -q \
            "versionCode='${VERSION_CODE}'" \
            "$BADGING"

          echo "Version Code: PASS"

          echo
          echo "Checking version name..."

          grep -q \
            "versionName='${VERSION_NAME}'" \
            "$BADGING"

          echo "Version Name: PASS"

          echo
          echo "FINAL APK PACKAGE/VERSION: PASS"


      # ============================================================
      # 27. SHA256
      # ============================================================

      - name: Calculate final APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "FINAL APK SHA256"
          echo "=============================================="

          sha256sum "$FINAL_APK"


      # ============================================================
      # 28. CREATE FINAL RELEASE REPORT
      #
      # IMPORTANT:
      # NO YAML HEREDOC.
      # This avoids the previous line-1100 YAML error.
      # ============================================================

      - name: Create final release report
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="$RUNNER_TEMP/release"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp \
            "$FINAL_APK" \
            "$RELEASE_DIR/$APK_NAME"

          APK_SHA256="$(
            sha256sum "$FINAL_APK" \
            | awk '{print $1}'
          )"

          printf '%s\n' \
            "MAJDOOR HISAAB PRO V82" \
            "FINAL SIGNED RELEASE APK" \
            "" \
            "==============================================" \
            "" \
            "Package:" \
            "${PACKAGE_NAME}" \
            "" \
            "Version:" \
            "${VERSION_NAME}" \
            "" \
            "Version Code:" \
            "${VERSION_CODE}" \
            "" \
            "Java:" \
            "${JAVA_VERSION}" \
            "" \
            "Gradle:" \
            "${GRADLE_VERSION}" \
            "" \
            "Android API:" \
            "${ANDROID_API}" \
            "" \
            "Build Tools:" \
            "${BUILD_TOOLS}" \
            "" \
            "ZIP:" \
            "${ZIP_NAME}" \
            "" \
            "APK:" \
            "${APK_NAME}" \
            "" \
            "Signing:" \
            "PERMANENT PRODUCTION KEYSTORE" \
            "" \
            "APK Signature:" \
            "VERIFIED" \
            "" \
            "Production Certificate:" \
            "VERIFIED" \
            "" \
            "APK Alignment:" \
            "VERIFIED" \
            "" \
            "Package:" \
            "VERIFIED" \
            "" \
            "Version:" \
            "VERIFIED" \
            "" \
            "APK SHA256:" \
            "${APK_SHA256}" \
            "" \
            "BUILD STATUS:" \
            "SUCCESS" \
            "" \
            "==============================================" \
            > "$RELEASE_DIR/BUILD-REPORT.txt"

          printf '%s  %s\n' \
            "$APK_SHA256" \
            "$APK_NAME" \
            > "$RELEASE_DIR/SHA256SUMS.txt"

          echo
          echo "=============================================="
          echo "FINAL BUILD REPORT"
          echo "=============================================="

          cat "$RELEASE_DIR/BUILD-REPORT.txt"

          echo
          echo "SHA256:"
          cat "$RELEASE_DIR/SHA256SUMS.txt"


      # ============================================================
      # 29. UPLOAD FINAL APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED
          path: |
            ${{ runner.temp }}/release/${{ env.APK_NAME }}
            ${{ runner.temp }}/release/BUILD-REPORT.txt
            ${{ runner.temp }}/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 30. FINAL SUCCESS SUMMARY
      # ============================================================

      - name: Final success summary
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "================================================"
          echo "       MAJDOOR HISAAB PRO V82"
          echo "       FINAL BUILD SUCCESS"
          echo "================================================"
          echo
          echo "Package:"
          echo "$PACKAGE_NAME"
          echo
          echo "Version:"
          echo "$VERSION_NAME ($VERSION_CODE)"
          echo
          echo "APK:"
          echo "$APK_NAME"
          echo
          echo "Signing:"
          echo "PERMANENT PRODUCTION KEY"
          echo
          echo "Signature:"
          echo "VERIFIED"
          echo
          echo "Certificate:"
          echo "VERIFIED"
          echo
          echo "Alignment:"
          echo "VERIFIED"
          echo
          echo "================================================"


      # ============================================================
      # 31. CLEANUP
      # ============================================================

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f \
            "${KEYSTORE_FILE:-}" \
            "${FINAL_APK:-}" \
            "${RAW_APK:-}" \
            "${RUNNER_TEMP:-}/aligned-release.apk" \
            2>/dev/null || true

          echo "Temporary signing material cleaned."
