SUCCESS

==============================================
EOF

          printf '%s  %s\n' \
            "$APK_SHA256" \
            "$APK_NAME" \
            > "$RELEASE_DIR/SHA256SUMS.txt"

          echo
          echo "=============================================="
          echo "FINAL BUILD REPORT"
          echo "=============================================="

          cat "$RELEASE_DIR/BUILD-REPORT.txt"

          echo
          echo "SHA256:"
          cat "$RELEASE_DIR/SHA256SUMS.txt"


      # ============================================================
      # 28. UPLOAD FINAL SIGNED APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED
          path: |
            ${{ runner.temp }}/release/${{ env.APK_NAME }}
            ${{ runner.temp }}/release/BUILD-REPORT.txt
            ${{ runner.temp }}/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 29. FINAL SUCCESS SUMMARY
      # ============================================================

      - name: Final success summary
        shell: bash
        run: |
          echo
          echo "================================================"
          echo "        MAJDOOR HISAAB PRO V82"
          echo "        FINAL BUILD SUCCESS"
          echo "================================================"
          echo
          echo "Package:"
          echo "$PACKAGE_NAME"
          echo
          echo "Version:"
          echo "$VERSION_NAME ($VERSION_CODE)"
          echo
          echo "APK:"
          echo "$APK_NAME"
          echo
          echo "Signing:"
          echo "PERMANENT PRODUCTION KEY"
          echo
          echo "Signature:"
          echo "VERIFIED"
          echo
          echo "Certificate:"
          echo "VERIFIED"
          echo
          echo "Alignment:"
          echo "VERIFIED"
          echo
          echo "================================================"


      # ============================================================
      # 30. CLEANUP
      # ============================================================

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${KEYSTORE_FILE:-}" ]; then
            rm -f "$KEYSTORE_FILE" || true
          fi

          rm -f \
            "${FINAL_APK:-}" \
            2>/dev/null || true

          echo "Temporary signing material cleaned."
