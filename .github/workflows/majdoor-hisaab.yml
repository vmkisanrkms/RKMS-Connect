name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_CODE: "82"
  VERSION_NAME: "1.82.0"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

jobs:

  build-release:
    name: Build Final Signed APK
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. JAVA
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ------------------------------------------------------------
      # 3. GRADLE
      # ------------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ------------------------------------------------------------
      # 4. ANDROID SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "Android API: ${ANDROID_API}"
          echo "Build Tools: ${BUILD_TOOLS}"

      # ------------------------------------------------------------
      # 5. FIND PROJECT
      # ------------------------------------------------------------
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          echo "Searching Android project..."

          if [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$PWD"
          elif [ -f "MajdoorHisaabPRO/settings.gradle.kts" ]; then
            PROJECT_DIR="$PWD/MajdoorHisaabPRO"
          else
            SETTINGS_FILE="$(find . -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/build/*" \
              | head -n 1)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle(.kts) not found."
              exit 1
            fi

            PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle.kts" \
            || test -f "$PROJECT_DIR/settings.gradle"

          test -f "$PROJECT_DIR/app/build.gradle.kts" \
            || test -f "$PROJECT_DIR/app/build.gradle"

      # ------------------------------------------------------------
      # 6. VERIFY PROJECT
      # ------------------------------------------------------------
      - name: Verify project files
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "===== PROJECT FILES ====="

          test -f "app/src/main/AndroidManifest.xml"
          test -f "app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          echo "AndroidManifest: OK"
          echo "MainActivity.kt: OK"
          echo "app module: OK"

          echo
          echo "===== PACKAGE CHECK ====="

          grep -R "com.majdoor.hisaabpro" \
            app/src/main \
            app/build.gradle.kts \
            >/dev/null

          echo "Package check: PASS"

      # ------------------------------------------------------------
      # 7. VERIFY VERSION
      # ------------------------------------------------------------
      - name: Verify version configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking versionCode..."

          grep -Eq \
            "versionCode[[:space:]]*=?[[:space:]]*82" \
            app/build.gradle.kts

          echo "versionCode 82: PASS"

          echo "Checking versionName..."

          grep -Eq \
            'versionName[[:space:]]*=?[[:space:]]*"1\.82\.0"' \
            app/build.gradle.kts

          echo "versionName 1.82.0: PASS"

      # ------------------------------------------------------------
      # 8. FIX KNOWN KOTLIN IMPORT ISSUE
      # ------------------------------------------------------------
      - name: Verify and repair Kotlin lazy imports
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          FILE="app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          echo "Checking: $FILE"

          if grep -q \
            'import androidx.compose.foundation.lazy.item' \
            "$FILE"; then

            echo "Removing invalid lazy.item import..."

            sed -i \
              '/import androidx\.compose\.foundation\.lazy\.item$/d' \
              "$FILE"
          fi

          if ! grep -q \
            'import androidx.compose.foundation.lazy.items' \
            "$FILE"; then

            echo "Adding correct lazy.items import..."

            sed -i \
              '/import androidx\.compose\.foundation\.lazy\.LazyColumn/a import androidx.compose.foundation.lazy.items' \
              "$FILE"
          fi

          if grep -q \
            'import androidx.compose.foundation.lazy.item' \
            "$FILE"; then

            echo "ERROR: invalid lazy.item import still exists."
            exit 1
          fi

          echo "Kotlin lazy imports: PASS"

      # ------------------------------------------------------------
      # 9. VERIFY IMPORTANT SOURCE SYMBOLS
      # ------------------------------------------------------------
      - name: Verify application source
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          FILE="app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          echo "Checking important application source..."

          grep -q "package com.majdoor.hisaabpro" "$FILE"

          grep -q "MainActivity" "$FILE"

          echo "MainActivity/package: PASS"

          if grep -q "Attendance" "$FILE"; then
            echo "Attendance source: FOUND"
          fi

          if grep -q "Payment" "$FILE"; then
            echo "Payment source: FOUND"
          fi

          if grep -q "Expense" "$FILE"; then
            echo "Expense source: FOUND"
          fi

          if grep -q "Sale" "$FILE"; then
            echo "Sale source: FOUND"
          fi

      # ------------------------------------------------------------
      # 10. FILEPROVIDER
      # ------------------------------------------------------------
      - name: Verify FileProvider report path
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          FILE="app/src/main/res/xml/file_paths.xml"

          test -f "$FILE"

          grep -q 'cache-path' "$FILE"
          grep -q 'reports' "$FILE"

          echo "FileProvider cache/reports: PASS"

      # ------------------------------------------------------------
      # 11. CLEAN BUILD
      # ------------------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle --version

          gradle clean --no-daemon

      # ------------------------------------------------------------
      # 12. BUILD RELEASE
      # ------------------------------------------------------------
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building Release APK..."

          gradle \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------------
      # 13. LOCATE APK
      # ------------------------------------------------------------
      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p "$RUNNER_TEMP/apk"

          APK="$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "Found APK:"
          echo "$APK"

          cp "$APK" \
            "$RUNNER_TEMP/apk/$APK_UNSIGNED_NAME"

          echo "APK_UNSIGNED=$RUNNER_TEMP/apk/$APK_UNSIGNED_NAME" \
            >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 14. VERIFY APK PACKAGE
      # ------------------------------------------------------------
      - name: Verify APK package
        shell: bash
        run: |
          set -e

          APK="$APK_UNSIGNED"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging "$APK" \
            | head -n 1

          BADGING="$(
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
              dump badging "$APK"
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q "package: name='${PACKAGE_NAME}'"

          echo "$BADGING" \
            | grep -q "versionCode='${VERSION_CODE}'"

          echo "$BADGING" \
            | grep -q "versionName='${VERSION_NAME}'"

          echo "APK package/version verification: PASS"

      # ------------------------------------------------------------
      # 15. ZIPALIGN
      # ------------------------------------------------------------
      - name: Zipalign APK
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          test -x "$ZIPALIGN"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$APK_UNSIGNED" \
            "$RUNNER_TEMP/apk/aligned.apk"

          "$ZIPALIGN" \
            -c \
            -P 4 \
            4 \
            "$RUNNER_TEMP/apk/aligned.apk"

          echo "Zipalign verification: PASS"

      # ------------------------------------------------------------
      # 16. PERMANENT PRODUCTION KEYSTORE
      # ------------------------------------------------------------
      - name: Prepare permanent production keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -e

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret missing."
            exit 1
          fi

          if [ -z "$RELEASE_CERT_SHA256" ]; then
            echo "ERROR: RELEASE_CERT_SHA256 secret missing."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/majdoor-production-release.p12"

          printf '%s' \
            "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          chmod 600 "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "Production keystore created from GitHub Secret."

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore/alias verification: PASS"

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 17. VERIFY PERMANENT CERTIFICATE
      # ------------------------------------------------------------
      - name: Verify permanent signing certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -e

          EXPECTED="$(
            printf '%s' "$RELEASE_CERT_SHA256" \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"

          ACTUAL="$(
            keytool \
              -list \
              -v \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              | awk -F': ' '/SHA256:/{print $2; exit}' \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"

          echo "Expected certificate fingerprint:"
          echo "$EXPECTED"

          echo "Actual certificate fingerprint:"
          echo "$ACTUAL"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: Permanent signing certificate does not match."
            exit 1
          fi

          echo "Permanent certificate verification: PASS"

      # ------------------------------------------------------------
      # 18. SIGN APK
      # ------------------------------------------------------------
      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --min-sdk-version 23 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RUNNER_TEMP/apk/$APK_SIGNED_NAME" \
            "$RUNNER_TEMP/apk/aligned.apk"

          echo "Signed APK created."

      # ------------------------------------------------------------
      # 19. VERIFY SIGNATURE
      # ------------------------------------------------------------
      - name: Verify final APK signature
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          APK="$RUNNER_TEMP/apk/$APK_SIGNED_NAME"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo
          echo "Checking final certificate..."

          EXPECTED="$(
            printf '%s' "$RELEASE_CERT_SHA256" \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"

          ACTUAL="$(
            "$APKSIGNER" verify \
              --print-certs \
              "$APK" 2>&1 \
              | awk -F': ' \
                '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"

          echo "Expected:"
          echo "$EXPECTED"

          echo "Actual:"
          echo "$ACTUAL"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: Final APK certificate mismatch."
            exit 1
          fi

          echo "Final APK signing verification: PASS"

      # ------------------------------------------------------------
      # 20. FINAL APK PACKAGE CHECK
      # ------------------------------------------------------------
      - name: Final APK validation
        shell: bash
        run: |
          set -e

          APK="$RUNNER_TEMP/apk/$APK_SIGNED_NAME"

          BADGING="$(
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
              dump badging "$APK"
          )"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -q "package: name='${PACKAGE_NAME}'"

          echo "$BADGING" \
            | grep -q "versionCode='${VERSION_CODE}'"

          echo "$BADGING" \
            | grep -q "versionName='${VERSION_NAME}'"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" \
            -c \
            -P 4 \
            4 \
            "$APK"

          echo
          echo "=========================================="
          echo " FINAL APK VALIDATION: PASS"
          echo "=========================================="

      # ------------------------------------------------------------
      # 21. CREATE RELEASE ZIP
      # ------------------------------------------------------------
      - name: Create final release package
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/final"

          cp \
            "$RUNNER_TEMP/apk/$APK_SIGNED_NAME" \
            "$RUNNER_TEMP/final/"

          cp \
            "$PROJECT_DIR/BUILD_AUDIT.md" \
            "$RUNNER_TEMP/final/" \
            2>/dev/null || true

          cd "$RUNNER_TEMP/final"

          sha256sum \
            "$APK_SIGNED_NAME" \
            > SHA256SUMS.txt

          echo "Final package:"
          ls -lh

      # ------------------------------------------------------------
      # 22. UPLOAD SIGNED APK
      # ------------------------------------------------------------
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED
          path: |
            ${{ runner.temp }}/final/${{ env.APK_SIGNED_NAME }}
            ${{ runner.temp }}/final/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 23. FINAL SUMMARY
      # ------------------------------------------------------------
      - name: Build summary
        shell: bash
        run: |
          echo "=========================================="
          echo " MAJDOOR HISAAB PRO V82"
          echo " FINAL RELEASE BUILD"
          echo "=========================================="
          echo "Package      : ${PACKAGE_NAME}"
          echo "Version Name : ${VERSION_NAME}"
          echo "Version Code : ${VERSION_CODE}"
          echo "Android API  : ${ANDROID_API}"
          echo "Build Tools  : ${BUILD_TOOLS}"
          echo "Java         : ${JAVA_VERSION}"
          echo "Gradle       : ${GRADLE_VERSION}"
          echo "Signing      : PERMANENT PRODUCTION KEY"
          echo "APK          : ${APK_SIGNED_NAME}"
          echo "=========================================="
