name: Majdoor Hisaab - Final Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"
  SOURCE_ZIP: Majdoor_Hisaab_PRO_v2_4_LOCAL_SQLITE_FINAL_APK_BUILD.zip

jobs:
  build-release-apk:

    name: Build Final Release APK

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK installed."


      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" version
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" version

          adb version

          echo "Android SDK verification: PASS"


      # ============================================================
      # 4. FIND SOURCE ZIP
      # ============================================================

      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Looking for:"
          echo "$SOURCE_ZIP"

          if [ ! -f "$SOURCE_ZIP" ]; then

            FOUND="$(
              find . \
                -type f \
                -name "$SOURCE_ZIP" \
                -print -quit
            )"

            if [ -z "$FOUND" ]; then
              echo "ERROR: $SOURCE_ZIP not found."
              echo ""
              echo "ZIP files available:"
              find . -type f -iname "*.zip" -print
              exit 1
            fi

            cp "$FOUND" "$SOURCE_ZIP"

          fi

          test -f "$SOURCE_ZIP"

          ls -lh "$SOURCE_ZIP"


      # ============================================================
      # 5. EXTRACT SOURCE
      # ============================================================

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-source

          mkdir -p build-source

          unzip -q \
            "$SOURCE_ZIP" \
            -d build-source

          echo ""
          echo "Extracted files:"
          find build-source \
            -maxdepth 6 \
            -type f \
            -print | sort


      # ============================================================
      # 6. USE EXACT AUDITED PROJECT ROOT
      # ============================================================

      - name: Set Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE/build-source"

          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Checking project files..."

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle.properties"

          test -d "$PROJECT_DIR/app"

          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f \
            "$PROJECT_DIR/app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          echo ""
          echo "Android project structure: PASS"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 7. SHOW ORIGINAL PROJECT CONFIG
      # ============================================================

      - name: Audit project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================ ROOT BUILD ================"
          cat build.gradle.kts

          echo ""
          echo "================ APP BUILD ================"
          cat app/build.gradle.kts

          echo ""
          echo "================ SETTINGS ================"
          cat settings.gradle.kts

          echo ""
          echo "================ MAIN ACTIVITY ================"
          grep -n "onCreate" \
            app/src/main/java/com/majdoor/hisaab/MainActivity.kt \
            || true


      # ============================================================
      # 8. FIX MainActivity onCreate
      # ============================================================

      - name: Fix MainActivity
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          test -f "$FILE"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/majdoor/hisaab/MainActivity.kt")

          s = p.read_text()

          pattern = r'(?m)^(\s*)fun\s+onCreate\s*\('

          s2, count = re.subn(
              pattern,
              r'\1override fun onCreate(',
              s,
              count=1
          )

          if count:
              p.write_text(s2)
              print("MainActivity onCreate override added.")
          else:
              print("onCreate already patched or not found.")

          PY

          echo ""
          grep -n -A2 -B2 "onCreate" "$FILE"


      # ============================================================
      # 9. FIX ONLY inTransaction SYNTAX ERROR
      # ============================================================

      - name: Fix inTransaction syntax
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          test -f "$FILE"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/majdoor/hisaab/MainActivity.kt")
          s = p.read_text()

          # Fix only usages of SQLiteDatabase.inTransaction
          # that are incorrectly written as a property.
          #
          # Wrong:
          #     db.inTransaction
          #
          # Correct:
          #     db.inTransaction()

          pattern = r'\.inTransaction\b(?!\s*\()'

          s2, count = re.subn(
              pattern,
              '.inTransaction()',
              s
          )

          if count:
              p.write_text(s2)
              print(f"Fixed {count} incorrect inTransaction usage(s).")
          else:
              print("No incorrect inTransaction usage found.")

          PY

          echo ""
          echo "Checking remaining inTransaction usages:"
          grep -n "inTransaction" "$FILE" || true

          echo ""
          echo "inTransaction syntax check: PASS"


      # ============================================================
      # 10. FIX JAVA + KOTLIN JVM TARGETS
      # ============================================================

      - name: Configure Java 17 and Kotlin 17
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:

              marker = 'android {'

              if marker not in s:
                  raise SystemExit(
                      "ERROR: android block not found."
                  )

              replacement = '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          '''

              s = s.replace(
                  marker,
                  replacement,
                  1
              )

          if "JvmTarget.JVM_17" not in s:

              s += '''

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          '''

          p.write_text(s)

          print("Java 17 + Kotlin JVM 17 configuration added.")

          PY

          echo ""
          echo "================ FINAL APP BUILD ================"

          cat app/build.gradle.kts

          echo ""
          echo "Checking forbidden old JVM settings..."

          if grep -RniE \
            'VERSION_1_8|VERSION_8|jvmTarget.*1\.8|jvmTarget.*"8"|options\.release' \
            app \
            --include='*.gradle' \
            --include='*.gradle.kts'; then

            echo ""
            echo "ERROR: Old JVM configuration found."
            exit 1
          fi

          echo ""
          echo "JVM configuration: PASS"


      # ============================================================
      # 11. SETUP GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          VERSION="$(
            gradle --version |
            grep '^Gradle ' |
            awk '{print $2}'
          )"

          echo "Detected Gradle: $VERSION"

          test "$VERSION" = "8.11.1"

          echo "Gradle verification: PASS"


      # ============================================================
      # 12. VERIFY FINAL PROJECT BEFORE BUILD
      # ============================================================

      - name: Final pre-build audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================ PRE-BUILD AUDIT ================"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/majdoor/hisaab/MainActivity.kt

          echo ""
          echo "Application ID:"
          grep -n "applicationId" app/build.gradle.kts

          echo ""
          echo "Namespace:"
          grep -n "namespace" app/build.gradle.kts

          echo ""
          echo "Compile SDK:"
          grep -n "compileSdk" app/build.gradle.kts

          echo ""
          echo "Target SDK:"
          grep -n "targetSdk" app/build.gradle.kts

          echo ""
          echo "Kotlin JVM:"
          grep -n "JVM_17" app/build.gradle.kts

          echo ""
          echo "Java compatibility:"
          grep -n "VERSION_17" app/build.gradle.kts

          echo ""
          echo "PRE-BUILD AUDIT: PASS"


      # ============================================================
      # 13. BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "MAJDOOR HISAAB RELEASE APK"
          echo "=========================================="

          gradle \
            clean \
            assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD COMPLETED."


      # ============================================================
      # 14. FIND APK
      # ============================================================

      - name: Find Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              -path "*release*" \
              -print -quit
          )"

          if [ -z "$APK" ]; then

            echo "ERROR: Release APK not found."

            echo ""
            echo "Available APK files:"

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo ""
          echo "Release APK:"
          echo "$APK"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release-Unsigned.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release-Unsigned.apk"


      # ============================================================
      # 15. CREATE TEMPORARY RELEASE KEY
      # ============================================================

      - name: Prepare release signing
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/majdoor-hisaab-release.jks"

          KEYSTORE_PASSWORD="MajdoorHisaabRelease2026!"
          KEY_ALIAS="majdoor-hisaab"
          KEY_PASSWORD="MajdoorHisaabRelease2026!"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Majdoor Hisaab, OU=RKMS, O=Rastriya Kisan Majdur Sangathan, L=India, ST=Uttar Pradesh, C=IN"

          test -s "$KEYSTORE"

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          echo "Release keystore created successfully."


      # ============================================================
      # 16. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"

          test -x "$ZIPALIGN"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release-Unsigned.apk" \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release-Aligned.apk"

          echo "Zipalign: PASS"


      # ============================================================
      # 17. SIGN RELEASE APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"
          test -f "$KEYSTORE"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk" \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release-Aligned.apk"

          test -f "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"

          ls -lh "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"

          echo "APK signing: PASS"


      # ============================================================
      # 18. VERIFY FINAL SIGNED APK
      # ============================================================

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"

          test -f "$APK"

          if [[ "$APK" == *debug* ]]; then
            echo "ERROR: Debug APK detected."
            exit 1
          fi

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          echo ""
          echo "================ APK PACKAGE ================"

          PACKAGE_LINE="$(
            "$AAPT" dump badging "$APK" |
            grep '^package:' |
            head -1
          )"

          echo "$PACKAGE_LINE"

          echo "$PACKAGE_LINE" |
            grep "name='com.majdoor.hisaab'"

          echo "$PACKAGE_LINE" |
            grep "versionCode='3'"

          echo "$PACKAGE_LINE" |
            grep "versionName='2.0'"

          echo ""
          echo "================ APK SIGNATURE ================"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo ""
          echo "================ APK ALIGNMENT ================"

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"

          "$ZIPALIGN" \
            -c \
            -P 4 \
            4 \
            "$APK"

          echo ""
          echo "APK package verification: PASS"
          echo "APK signature verification: PASS"
          echo "APK alignment verification: PASS"
          echo "FINAL APK VERIFICATION: PASS"


      # ============================================================
      # 19. SHA256
      # ============================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk" \
            > \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk.sha256"

          echo ""
          cat \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk.sha256"


      # ============================================================
      # 20. UPLOAD ONLY FINAL RELEASE APK
      # ============================================================

      - name: Upload Final Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-Final-Release-APK
          path: |
            Majdoor-Hisaab-Release.apk
            Majdoor-Hisaab-Release.apk.sha256
          if-no-files-found: error
          retention-days: 30
