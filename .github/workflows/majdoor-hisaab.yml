name: Majdoor Hisaab PRO - Stable Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V81-ALL-BUTTONS-FINAL.zip"

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      # ============================================================
      # 4. LOCATE PROJECT / ZIP
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Checking repository..."

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            echo "Android project found at repository root."
            echo "PROJECT_ROOT=$PWD" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ -f "${ZIP_NAME}" ]; then
            ZIP_PATH="${ZIP_NAME}"
          else
            echo "Exact ZIP not found. Searching..."
            ZIP_PATH="$(find . -maxdepth 3 -type f \
              \( -name "${ZIP_NAME}" \
              -o -iname "Majdoor-Hisaab-PRO-Professional-UI-V81*.zip" \
              -o -iname "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip" \
              -o -iname "Majdoor_Hisaab*.zip" \) \
              | head -n 1)"
          fi

          if [ -z "${ZIP_PATH}" ]; then
            echo "ERROR: Android project ZIP not found."
            echo "Available ZIP files:"
            find . -type f -iname "*.zip" -print || true
            exit 1
          fi

          echo "Using ZIP:"
          echo "${ZIP_PATH}"

          rm -rf extracted project
          mkdir -p extracted project

          unzip -q "${ZIP_PATH}" -d extracted

          if [ -f "extracted/settings.gradle.kts" ] && \
             [ -f "extracted/app/build.gradle.kts" ]; then

            cp -a extracted/. project/

          else

            SETTINGS_FILE="$(find extracted -type f \
              -name "settings.gradle.kts" | head -n 1)"

            if [ -z "${SETTINGS_FILE}" ]; then
              echo "ERROR: settings.gradle.kts not found."
              find extracted -maxdepth 5 -type f | head -n 200
              exit 1
            fi

            ROOT_DIR="$(dirname "${SETTINGS_FILE}")"

            echo "Detected Android project:"
            echo "${ROOT_DIR}"

            cp -a "${ROOT_DIR}/." project/
          fi

          if [ ! -f "project/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts missing after extraction."
            exit 1
          fi

          if [ ! -f "project/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts missing after extraction."
            exit 1
          fi

          echo "PROJECT_ROOT=$PWD/project" >> "$GITHUB_ENV"

      # ============================================================
      # 5. SHOW PROJECT
      # ============================================================
      - name: Show project structure
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "Project root:"
          pwd

          echo
          echo "Settings:"
          ls -la settings.gradle.kts

          echo
          echo "App:"
          ls -la app

          echo
          echo "Gradle files:"
          find . -maxdepth 3 \
            \( -name "build.gradle.kts" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle.properties" \) \
            -print

      # ============================================================
      # 6. GRADLE
      # ============================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ============================================================
      # 7. VERIFY JAVA / GRADLE
      # ============================================================
      - name: Verify build tools
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}" || true

      # ============================================================
      # 8. APPLY BASIC SOURCE FIXES
      # ============================================================
      - name: Apply required Kotlin source fixes
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"

          if [ -f "$FILE" ]; then

            echo "Applying safe compatibility fixes..."

            sed -i 's/\.audit\.auditLog/\.auditLog/g' "$FILE" || true
            sed -i 's/clearAuditLog/clear/g' "$FILE" || true
            sed -i 's/getSystemService(ALARM_SERVICE)/getSystemService(Context.ALARM_SERVICE)/g' "$FILE" || true

          else
            echo "MainActivityScreens.kt not found at expected path."
            echo "Searching..."
            find app/src -type f -name "MainActivityScreens.kt" -print
          fi

      # ============================================================
      # 9. MAKE GRADLE WRAPPER
      # ============================================================
      - name: Generate Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version "${GRADLE_VERSION}"
          fi

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 10. VERIFY PROJECT CONFIG
      # ============================================================
      - name: Verify Android project configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          BUILD_FILE="app/build.gradle.kts"

          echo "Checking package:"
          grep -n "com.majdoor.hisaab" "$BUILD_FILE" || true

          echo
          echo "Checking versionName:"
          grep -n "versionName" "$BUILD_FILE" || true

          echo
          echo "Checking versionCode:"
          grep -n "versionCode" "$BUILD_FILE" || true

          echo
          echo "Checking compile/target SDK:"
          grep -nE "compileSdk|targetSdk|minSdk" "$BUILD_FILE" || true

          echo
          echo "Checking Android plugin:"
          grep -R "com.android.application" \
            -n --include="*.gradle.kts" . || true

      # ============================================================
      # 11. FORCE REQUIRED VERSION VALUES
      # ============================================================
      - name: Verify release version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          BUILD_FILE="app/build.gradle.kts"

          grep -q 'versionName[[:space:]]*=[[:space:]]*"1.77.0"' \
            "$BUILD_FILE" || {
              echo "ERROR: versionName 1.77.0 not found."
              exit 1
            }

          grep -q 'versionCode[[:space:]]*=[[:space:]]*77' \
            "$BUILD_FILE" || {
              echo "ERROR: versionCode 77 not found."
              exit 1
            }

          echo "Version verified:"
          echo "versionName = 1.77.0"
          echo "versionCode = 77"

      # ============================================================
      # 12. CLEAN
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          ./gradlew clean --no-daemon

      # ============================================================
      # 13. COMPILE DEBUG / TEST SOURCES
      # ============================================================
      - name: Compile Kotlin sources
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          ./gradlew \
            :app:compileReleaseKotlin \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 14. BUILD RELEASE APK
      # ============================================================
      - name: Build unsigned Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 15. FIND APK
      # ============================================================
      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          APK="$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Majdoor-Hisaab-PRO-1.77.0-release-unsigned.apk"

          echo "UNSIGNED_APK=$GITHUB_WORKSPACE/release/Majdoor-Hisaab-PRO-1.77.0-release-unsigned.apk" >> "$GITHUB_ENV"

      # ============================================================
      # 16. VERIFY APK PACKAGE
      # ============================================================
      - name: Verify unsigned APK
        shell: bash
        run: |
          set -e

          APK="$UNSIGNED_APK"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK missing."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest application-id "$APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest version-name "$APK"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest version-code "$APK"

      # ============================================================
      # 17. RESTORE RELEASE KEYSTORE
      # ============================================================
      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$RELEASE_STORE_PASSWORD" ]; then
            echo "ERROR: RELEASE_STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$RELEASE_KEY_ALIAS" ]; then
            echo "ERROR: RELEASE_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "ERROR: RELEASE_KEY_PASSWORD secret is missing."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/keystore"

          echo "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/keystore/release.keystore"

          test -s "$RUNNER_TEMP/keystore/release.keystore"

          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"

      # ============================================================
      # 18. ZIPALIGN
      # ============================================================
      - name: Zipalign Release APK
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            "$UNSIGNED_APK" \
            "$GITHUB_WORKSPACE/release/Majdoor-Hisaab-PRO-1.77.0-release-aligned.apk"

      # ============================================================
      # 19. SIGN APK
      # ============================================================
      - name: Sign Release APK
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:${RELEASE_STORE_PASSWORD}" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass "pass:${RELEASE_KEY_PASSWORD}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$GITHUB_WORKSPACE/release/Majdoor-Hisaab-PRO-1.77.0-release.apk" \
            "$GITHUB_WORKSPACE/release/Majdoor-Hisaab-PRO-1.77.0-release-aligned.apk"

      # ============================================================
      # 20. VERIFY SIGNATURE
      # ============================================================
      - name: Verify signed APK
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            "$GITHUB_WORKSPACE/release/Majdoor-Hisaab-PRO-1.77.0-release.apk"

      # ============================================================
      # 21. VERIFY FINAL APK PACKAGE / VERSION
      # ============================================================
      - name: Verify final APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/release/Majdoor-Hisaab-PRO-1.77.0-release.apk"

          echo "Application ID:"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest application-id "$APK"

          echo
          echo "Version Name:"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest version-name "$APK"

          echo
          echo "Version Code:"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest version-code "$APK"

          echo
          echo "Checking package ID..."

          PACKAGE_ID="$(
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
              manifest application-id "$APK"
          )"

          if [ "$PACKAGE_ID" != "$PACKAGE_NAME" ]; then
            echo "ERROR: Package mismatch."
            echo "Expected: $PACKAGE_NAME"
            echo "Actual:   $PACKAGE_ID"
            exit 1
          fi

          VERSION_NAME_ACTUAL="$(
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
              manifest version-name "$APK"
          )"

          if [ "$VERSION_NAME_ACTUAL" != "$VERSION_NAME" ]; then
            echo "ERROR: Version name mismatch."
            echo "Expected: $VERSION_NAME"
            echo "Actual:   $VERSION_NAME_ACTUAL"
            exit 1
          fi

          VERSION_CODE_ACTUAL="$(
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
              manifest version-code "$APK"
          )"

          if [ "$VERSION_CODE_ACTUAL" != "$VERSION_CODE" ]; then
            echo "ERROR: Version code mismatch."
            echo "Expected: $VERSION_CODE"
            echo "Actual:   $VERSION_CODE_ACTUAL"
            exit 1
          fi

          echo
          echo "=============================================="
          echo "FINAL APK VERIFICATION SUCCESS"
          echo "Package:      $PACKAGE_ID"
          echo "Version Name: $VERSION_NAME_ACTUAL"
          echo "Version Code: $VERSION_CODE_ACTUAL"
          echo "=============================================="

      # ============================================================
      # 22. SHA256
      # ============================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/release"

          sha256sum \
            "Majdoor-Hisaab-PRO-1.77.0-release.apk" \
            > "Majdoor-Hisaab-PRO-1.77.0-release.apk.sha256"

          cat "Majdoor-Hisaab-PRO-1.77.0-release.apk.sha256"

      # ============================================================
      # 23. SHOW RELEASE FILES
      # ============================================================
      - name: Show final release files
        run: |
          echo "Final release files:"
          ls -lh "$GITHUB_WORKSPACE/release"

      # ============================================================
      # 24. UPLOAD SIGNED APK
      # ============================================================
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-1.77.0-Signed-Release
          path: |
            release/Majdoor-Hisaab-PRO-1.77.0-release.apk
            release/Majdoor-Hisaab-PRO-1.77.0-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 25. SUCCESS MESSAGE
      # ============================================================
      - name: Build Success
        run: |
          echo
          echo "======================================================"
          echo " MAJDOOR HISAAB PRO - RELEASE BUILD SUCCESS"
          echo "======================================================"
          echo
          echo "ZIP:"
          echo "${ZIP_NAME}"
          echo
          echo "PACKAGE:"
          echo "${PACKAGE_NAME}"
          echo
          echo "VERSION:"
          echo "${VERSION_NAME}"
          echo
          echo "VERSION CODE:"
          echo "${VERSION_CODE}"
          echo
          echo "SIGNED APK:"
          echo "release/Majdoor-Hisaab-PRO-1.77.0-release.apk"
          echo
          echo "======================================================"
