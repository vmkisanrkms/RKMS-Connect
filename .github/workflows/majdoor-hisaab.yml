name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor_Hisaab_PRO_READY_TO_BUILD_FIXED_v11_KOTLIN_FIXED.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build Final Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # 4. LOCATE ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATING ANDROID SDK"
          echo "=============================================="

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"

          else
            SDK_ROOT=$(find /usr/local/lib/android \
              -maxdepth 3 \
              -type d \
              -name "sdk" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name "sdkmanager" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "ANDROID SDK:"
          echo "$SDK_ROOT"

          echo ""
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 5. INSTALL ANDROID SDK 36
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INSTALL ANDROID SDK 36"
          echo "=============================================="

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "ANDROID SDK INSTALLATION PASSED."


      # ============================================================
      # 6. VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY ANDROID SDK"
          echo "=============================================="

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"

          echo ""
          echo "ANDROID SDK VERIFICATION PASSED."


      # ============================================================
      # 7. FIND PROJECT ZIP
      # ============================================================

      - name: Find Majdoor Hisaab Project ZIP
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FIND MAJDOOR HISAAB PROJECT ZIP"
          echo "=============================================="

          FOUND_ZIP=""

          if [ -f "$ZIP_NAME" ]; then
            FOUND_ZIP="$ZIP_NAME"
          fi

          if [ -z "$FOUND_ZIP" ]; then
            FOUND_ZIP=$(
              find . \
                -type f \
                -iname "*Majdoor*Hisaab*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | tail -1
            )
          fi

          if [ -z "$FOUND_ZIP" ] || [ ! -f "$FOUND_ZIP" ]; then

            echo ""
            echo "ERROR: Majdoor Hisaab project ZIP NOT FOUND."

            echo ""
            echo "AVAILABLE ZIP FILES:"

            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print \
              | sort

            exit 1
          fi

          FOUND_ZIP="${FOUND_ZIP#./}"

          echo ""
          echo "PROJECT ZIP FOUND:"
          echo "$FOUND_ZIP"

          ls -lh "$FOUND_ZIP"

          echo "ZIP_NAME=$FOUND_ZIP" >> "$GITHUB_ENV"

          echo ""
          echo "ZIP DETECTION PASSED."


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================

      - name: Extract Majdoor Hisaab Project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "EXTRACT PROJECT"
          echo "=============================================="

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_NAME" -d build_source

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print \
            -quit)

          if [ -z "$SETTINGS_FILE" ]; then

            echo ""
            echo "ERROR: Gradle settings file not found."

            find build_source \
              -maxdepth 8 \
              -type f \
              -print \
              | sort \
              | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 9. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY ANDROID PROJECT"
          echo "=============================================="

          pwd

          test -d "app"

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then

            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo ""
          echo "ANDROID PROJECT VERIFIED."


      # ============================================================
      # 10. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle Environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE ENVIRONMENT"
          echo "=============================================="

          java -version

          echo ""
          gradle --version

          DETECTED=$(
            gradle --version |
            awk '/^Gradle / {print $2; exit}'
          )

          echo ""
          echo "EXPECTED GRADLE:"
          echo "$GRADLE_VERSION"

          echo ""
          echo "DETECTED GRADLE:"
          echo "$DETECTED"

          if [ "$DETECTED" != "$GRADLE_VERSION" ]; then
            echo ""
            echo "ERROR: Gradle version mismatch."
            exit 1
          fi

          echo ""
          echo "GRADLE ENVIRONMENT PASSED."


      # ============================================================
      # 11. LOCATE MAIN KOTLIN SOURCE
      #
      # IMPORTANT:
      # NOTHING BEFORE COMPILE STEP MODIFIES SOURCE.
      # ============================================================

      - name: Locate Main Kotlin Source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE MAIN KOTLIN SOURCE"
          echo "=============================================="

          MAIN_FILES=$(find app/src/main \
            -type f \
            -name "MainActivity.kt" \
            -print)

          echo "$MAIN_FILES"

          COUNT=$(echo "$MAIN_FILES" | sed '/^$/d' | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo ""
            echo "ERROR: Multiple MainActivity.kt files found."
            exit 1
          fi

          MAIN_FILE=$(echo "$MAIN_FILES" | head -1)

          echo "MAIN_FILE=$MAIN_FILE" >> "$GITHUB_ENV"

          echo ""
          echo "MAIN FILE:"
          echo "$MAIN_FILE"


      # ============================================================
      # 12. AUDITED KOTLIN SOURCE FIX + COMPILE
      #
      # THIS IS THE ONLY SOURCE-MODIFYING STEP.
      #
      # FIXED FROM ACTUAL v11 ZIP AUDIT:
      #
      # 1. mapList() parser syntax
      #
      # 2. LabourDetail() brace placement
      #    One brace is moved from BEFORE if(edit)
      #    to the END of the function.
      #
      # 3. ExpenseDialog() argument order
      #
      # 4. SaleDialog() argument order
      #
      # 5. ChoiceField() missing closing braces
      #
      # NO GENERIC BRACE REPAIR.
      # NO AUTOMATIC BRACE DELETION.
      # NO GUESSING.
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN"
          echo "=============================================="

          test -f "$MAIN_FILE"

          echo ""
          echo "MAIN FILE:"
          echo "$MAIN_FILE"

          echo ""
          echo "=============================================="
          echo "AUDITED KOTLIN SOURCE REPAIR"
          echo "=============================================="

          python3 - "$MAIN_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          source = path.read_text(
              encoding="utf-8"
          )

          original = source

          print("SOURCE:", path)
          print("SOURCE LINES:", len(source.splitlines()))
          print("SOURCE BYTES:", len(source.encode("utf-8")))


          # ==========================================================
          # FIX 1
          #
          # mapList()
          #
          # ACTUAL BAD SOURCE:
          #
          # private fun <T> JSONArray.mapList(
          #     mapper:(JSONObject)->T
          # ):List<T>=(0 until length()).map{...}
          #
          # The `>=` parser ambiguity after generic return type
          # causes:
          #
          # expecting a '>'
          # expecting member declaration
          #
          # ==========================================================

          bad_map = (
              "private fun <T> JSONArray.mapList"
              "(mapper:(JSONObject)->T):List<T>="
              "(0 until length()).map{mapper(getJSONObject(it))}"
          )

          good_map = (
              "private fun <T> JSONArray.mapList"
              "(mapper:(JSONObject)->T): List<T> = "
              "(0 until length()).map { mapper(getJSONObject(it)) }"
          )

          map_count = source.count(bad_map)

          print("")
          print("FIX 1 - mapList count:", map_count)

          if map_count == 1:

              source = source.replace(
                  bad_map,
                  good_map,
                  1
              )

              print("FIX 1 APPLIED.")

          elif map_count == 0:

              print("FIX 1 already applied.")

          else:

              print(
                  "ERROR: mapList pattern appears more than once."
              )

              raise SystemExit(1)


          # ==========================================================
          # FIX 2
          #
          # LabourDetail brace placement.
          #
          # ACTUAL SOURCE HAD:
          #
          # ...tint=Color(...))}}}}};if(edit)...
          #
          # One brace was closing LabourDetail too early.
          #
          # We REMOVE ONE brace from this boundary.
          #
          # Then ADD ONE brace at the true end of LabourDetail.
          #
          # This preserves total brace count while restoring
          # correct Kotlin function scope.
          # ==========================================================

          boundary_before = (
              "tint=Color(0xFFB3261E))}}}}};"
              "if(edit)LabourDialog"
          )

          boundary_after = (
              "tint=Color(0xFFB3261E))}}}};"
              "if(edit)LabourDialog"
          )

          boundary_count = source.count(
              boundary_before
          )

          print("")
          print(
              "FIX 2 - LabourDetail boundary count:",
              boundary_count
          )

          if boundary_count == 1:

              source = source.replace(
                  boundary_before,
                  boundary_after,
                  1
              )

              print(
                  "FIX 2A APPLIED: LabourDetail boundary."
              )

          elif boundary_count == 0:

              print(
                  "FIX 2A already applied."
              )

          else:

              print(
                  "ERROR: LabourDetail boundary appears "
                  "more than once."
              )

              raise SystemExit(1)


          # ==========================================================
          # FIX 2B
          #
          # Close LabourDetail AFTER its dialog calls.
          #
          # ACTUAL END:
          #
          # ...delPay?.let{ConfirmDialog(...)}
          #
          # Correct:
          #
          # ...delPay?.let{ConfirmDialog(...)}}
          #
          # One final brace is required for the remaining
          # LabourDetail function scope.
          # ==========================================================

          end_before = (
              'delPay?.let{ConfirmDialog('
              '"भुगतान हटाएँ?",'
              '"यह payment record हट जाएगा।",'
              '{store.deletePayment(it.id);delPay=null},'
              '{delPay=null})}'
          )

          end_after = (
              'delPay?.let{ConfirmDialog('
              '"भुगतान हटाएँ?",'
              '"यह payment record हट जाएगा।",'
              '{store.deletePayment(it.id);delPay=null},'
              '{delPay=null})}}'
          )

          end_count = source.count(end_before)

          print("")
          print(
              "FIX 2B - LabourDetail end count:",
              end_count
          )

          if end_count == 1:

              source = source.replace(
                  end_before,
                  end_after,
                  1
              )

              print(
                  "FIX 2B APPLIED: LabourDetail closed correctly."
              )

          elif end_count == 0:

              print(
                  "FIX 2B already applied."
              )

          else:

              print(
                  "ERROR: LabourDetail end pattern appears "
                  "more than once."
              )

              raise SystemExit(1)


          # ==========================================================
          # FIX 3
          #
          # ExpenseDialog argument order.
          #
          # Original:
          #
          # ExpenseDialog(..., edit!=null){...}
          #
          # Signature:
          #
          # ExpenseDialog(
          #   store,
          #   existing,
          #   onClose,
          #   isEdit
          # )
          #
          # Therefore Boolean was being passed where onClose was
          # expected.
          # ==========================================================

          bad_expense = (
              'if(add)ExpenseDialog('
              'store,'
              'edit?:Expense('
              'UUID.randomUUID().toString(),'
              'preField?:(store.fields.firstOrNull()?.id?:""),'
              'preCrop?:(store.crops.firstOrNull{it.fieldId==preField}?.id?:""),'
              '"बीज","","","",0.0,today()),'
              'edit!=null){add=false;edit=null}'
          )

          good_expense = (
              'if(add)ExpenseDialog('
              'store,'
              'edit?:Expense('
              'UUID.randomUUID().toString(),'
              'preField?:(store.fields.firstOrNull()?.id?:""),'
              'preCrop?:(store.crops.firstOrNull{it.fieldId==preField}?.id?:""),'
              '"बीज","","","",0.0,today()),'
              'onClose={add=false;edit=null},'
              'isEdit=edit!=null)'
          )

          expense_count = source.count(
              bad_expense
          )

          print("")
          print(
              "FIX 3 - ExpenseDialog count:",
              expense_count
          )

          if expense_count == 1:

              source = source.replace(
                  bad_expense,
                  good_expense,
                  1
              )

              print("FIX 3 APPLIED.")

          elif expense_count == 0:

              print(
                  "FIX 3 already applied."
              )

          else:

              print(
                  "ERROR: ExpenseDialog pattern appears "
                  "more than once."
              )

              raise SystemExit(1)


          # ==========================================================
          # FIX 4
          #
          # SaleDialog argument order.
          # ==========================================================

          bad_sale = (
              'if(add)SaleDialog('
              'store,'
              'edit?:Sale('
              'UUID.randomUUID().toString(),'
              'preField?:(store.fields.firstOrNull()?.id?:""),'
              'preCrop?:(store.crops.firstOrNull{it.fieldId==preField}?.id?:""),'
              '0.0,"क्विंटल",0.0,0.0,"",today()),'
              'edit!=null){add=false;edit=null}'
          )

          good_sale = (
              'if(add)SaleDialog('
              'store,'
              'edit?:Sale('
              'UUID.randomUUID().toString(),'
              'preField?:(store.fields.firstOrNull()?.id?:""),'
              'preCrop?:(store.crops.firstOrNull{it.fieldId==preField}?.id?:""),'
              '0.0,"क्विंटल",0.0,0.0,"",today()),'
              'onClose={add=false;edit=null},'
              'isEdit=edit!=null)'
          )

          sale_count = source.count(
              bad_sale
          )

          print("")
          print(
              "FIX 4 - SaleDialog count:",
              sale_count
          )

          if sale_count == 1:

              source = source.replace(
                  bad_sale,
                  good_sale,
                  1
              )

              print("FIX 4 APPLIED.")

          elif sale_count == 0:

              print(
                  "FIX 4 already applied."
              )

          else:

              print(
                  "ERROR: SaleDialog pattern appears "
                  "more than once."
              )

              raise SystemExit(1)


          # ==========================================================
          # FIX 5
          #
          # ChoiceField()
          #
          # Actual audited source is short one final pair of
          # closing braces.
          #
          # IMPORTANT:
          # We only touch the exact ChoiceField declaration.
          # ==========================================================

          lines = source.splitlines()

          choice_indexes = [
              i
              for i, line in enumerate(lines)
              if line.startswith(
                  "@Composable private fun ChoiceField("
              )
          ]

          print("")
          print(
              "FIX 5 - ChoiceField declarations:",
              len(choice_indexes)
          )

          if len(choice_indexes) != 1:

              print(
                  "ERROR: Expected exactly one ChoiceField."
              )

              raise SystemExit(1)

          choice_index = choice_indexes[0]

          choice_line = lines[choice_index]

          if not choice_line.endswith(
              "}}}"
          ):

              print(
                  "ERROR: ChoiceField source does not match "
                  "audited v11 structure."
              )

              raise SystemExit(1)

          # Add the two audited closing braces.
          lines[choice_index] = (
              choice_line + "}}"
          )

          source = "\n".join(lines) + "\n"

          print(
              "FIX 5 APPLIED: ChoiceField closing braces."
          )


          # ==========================================================
          # WRITE SOURCE
          # ==========================================================

          if source != original:

              path.write_text(
                  source,
                  encoding="utf-8"
              )

              print("")
              print(
                  "AUDITED KOTLIN SOURCE WRITTEN."
              )

          else:

              print("")
              print(
                  "NO SOURCE CHANGE REQUIRED."
              )


          # ==========================================================
          # FINAL EXACT SOURCE CHECKS
          # ==========================================================

          final_source = path.read_text(
              encoding="utf-8"
          )

          # mapList old syntax must disappear
          if bad_map in final_source:

              print(
                  "ERROR: Old mapList syntax remains."
              )

              raise SystemExit(1)


          # LabourDetail must not have old early boundary
          if boundary_before in final_source:

              print(
                  "ERROR: Old LabourDetail boundary remains."
              )

              raise SystemExit(1)


          # Old ExpenseDialog call must disappear
          if bad_expense in final_source:

              print(
                  "ERROR: Old ExpenseDialog call remains."
              )

              raise SystemExit(1)


          # Old SaleDialog call must disappear
          if bad_sale in final_source:

              print(
                  "ERROR: Old SaleDialog call remains."
              )

              raise SystemExit(1)


          # ChoiceField exact final line
          final_lines = final_source.splitlines()

          final_choice = final_lines[
              choice_index
          ]

          if not final_choice.endswith(
              "}}}}}"
          ):

              print(
                  "ERROR: ChoiceField final closure "
                  "verification failed."
              )

              raise SystemExit(1)


          print("")
          print(
              "ALL AUDITED KOTLIN SOURCE FIXES VERIFIED."
          )
          PY


          echo ""
          echo "=============================================="
          echo "KOTLIN STRUCTURE AUDIT"
          echo "=============================================="

          python3 - "$MAIN_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          source = path.read_text(
              encoding="utf-8"
          )

          balance = 0

          in_string = False
          in_char = False
          escape = False
          block_comment = False

          negative_line = None

          for line_no, line in enumerate(
              source.splitlines(),
              1
          ):

              i = 0

              while i < len(line):

                  c = line[i]

                  n = (
                      line[i + 1]
                      if i + 1 < len(line)
                      else ""
                  )


                  if block_comment:

                      if c == "*" and n == "/":
                          block_comment = False
                          i += 2
                          continue

                      i += 1
                      continue


                  if in_string:

                      if escape:
                          escape = False

                      elif c == "\\":
                          escape = True

                      elif c == '"':
                          in_string = False

                      i += 1
                      continue


                  if in_char:

                      if escape:
                          escape = False

                      elif c == "\\":
                          escape = True

                      elif c == "'":
                          in_char = False

                      i += 1
                      continue


                  if c == "/" and n == "/":
                      break


                  if c == "/" and n == "*":
                      block_comment = True
                      i += 2
                      continue


                  if c == '"':
                      in_string = True
                      i += 1
                      continue


                  if c == "'":
                      in_char = True
                      i += 1
                      continue


                  if c == "{":

                      balance += 1

                  elif c == "}":

                      balance -= 1

                      if balance < 0:

                          negative_line = line_no
                          break

                  i += 1


              if negative_line is not None:
                  break


          if negative_line is not None:

              echo="ERROR: negative Kotlin brace balance"

              print("")
              print(echo)
              print(
                  "LINE:",
                  negative_line
              )

              raise SystemExit(1)


          print("")
          print(
              "FINAL KOTLIN BRACE BALANCE:",
              balance
          )

          if balance != 0:

              print("")
              print(
                  "ERROR: Kotlin braces are not balanced."
              )

              raise SystemExit(1)

          print("")
          print(
              "KOTLIN BRACE BALANCE PASSED."
          )
          PY


          echo ""
          echo "=============================================="
          echo "VERIFY TOP-LEVEL FUNCTION BOUNDARIES"
          echo "=============================================="

          grep -n \
            "@Composable private fun LabourDetail" \
            "$MAIN_FILE"

          grep -n \
            "@Composable private fun PaymentDialog" \
            "$MAIN_FILE"

          grep -n \
            "@Composable private fun RateDialog" \
            "$MAIN_FILE"

          grep -n \
            "@Composable private fun CropDetail" \
            "$MAIN_FILE"

          grep -n \
            "@Composable private fun ChoiceField" \
            "$MAIN_FILE"

          echo ""
          echo "FUNCTION DECLARATIONS FOUND AT TOP LEVEL."


          echo ""
          echo "=============================================="
          echo "START ACTUAL KOTLIN COMPILER"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --rerun-tasks \
            :app:compileReleaseKotlin

          echo ""
          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN PASSED"
          echo "=============================================="


      # ============================================================
      # 13. SET FINAL RELEASE IDENTITY
      # ============================================================

      - name: Set Final Release Identity
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "SET FINAL RELEASE IDENTITY"
          echo "=============================================="

          if [ -f "app/build.gradle.kts" ]; then

            GRADLE_FILE="app/build.gradle.kts"

            sed -i \
              's/applicationId = "[^"]*"/applicationId = "com.majdoor.hisaab"/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionCode = [0-9][0-9]*/versionCode = 77/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionName = "[^"]*"/versionName = "1.77.0"/' \
              "$GRADLE_FILE"

          elif [ -f "app/build.gradle" ]; then

            GRADLE_FILE="app/build.gradle"

            sed -i \
              's/applicationId[[:space:]]*["'"'"'][^"'"'"']*["'"'"']/applicationId "com.majdoor.hisaab"/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionCode[[:space:]]*[0-9][0-9]*/versionCode 77/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionName[[:space:]]*["'"'"'][^"'"'"']*["'"'"']/versionName "1.77.0"/' \
              "$GRADLE_FILE"

          else

            echo "ERROR: app Gradle file not found."
            exit 1

          fi

          echo ""
          echo "FINAL APPLICATION ID:"
          grep "applicationId" "$GRADLE_FILE" || true

          echo ""
          echo "FINAL VERSION CODE:"
          grep "versionCode" "$GRADLE_FILE" || true

          echo ""
          echo "FINAL VERSION NAME:"
          grep "versionName" "$GRADLE_FILE" || true


      # ============================================================
      # 14. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ASSEMBLE RELEASE APK"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --rerun-tasks \
            :app:assembleRelease

          echo ""
          echo "=============================================="
          echo "ASSEMBLE RELEASE APK PASSED"
          echo "=============================================="


      # ============================================================
      # 15. LOCATE RELEASE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE RELEASE APK"
          echo "=============================================="

          APK=$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*release*.apk" \
              -print \
              | sort \
              | head -1
          )

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then

            echo ""
            echo "ERROR: Release APK not found."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null \
              || true

            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "RELEASE APK:"
          ls -lh "$APK"


      # ============================================================
      # 16. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK Package
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY APK PACKAGE"
          echo "=============================================="

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging \
              "$APK_PATH"
          )

          echo "$BADGING" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          if ! echo "$BADGING" | grep -q \
            "name='$PACKAGE_NAME'"; then

            echo "ERROR: Package name mismatch."
            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionCode='$VERSION_CODE'"; then

            echo "ERROR: Version code mismatch."
            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionName='$VERSION_NAME'"; then

            echo "ERROR: Version name mismatch."
            exit 1
          fi

          echo ""
          echo "PACKAGE AND VERSION VERIFIED."


      # ============================================================
      # 17. PREPARE RELEASE SIGNING
      # ============================================================

      - name: Prepare Release Signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -e

          echo "=============================================="
          echo "PREPARE RELEASE SIGNING"
          echo "=============================================="

          KEYSTORE_FILE="$RUNNER_TEMP/majdoor-hisaab-release.jks"

          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            echo "PERMANENT SIGNING SECRETS FOUND."

            printf '%s' "$KEYSTORE_BASE64" \
              | base64 --decode \
              > "$KEYSTORE_FILE"

            test -s "$KEYSTORE_FILE"

            keytool \
              -list \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              >/dev/null

            echo "RELEASE_SIGNING_MODE=PERMANENT" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          else

            echo "Permanent signing secrets not configured."
            echo "Creating temporary JKS."

            TEMP_PASSWORD="$(openssl rand -hex 32)"
            TEMP_ALIAS="majdoor-hisaab-v82"

            rm -f "$KEYSTORE_FILE"

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -storepass "$TEMP_PASSWORD" \
              -keypass "$TEMP_PASSWORD" \
              -alias "$TEMP_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=Majdoor Hisaab PRO, OU=Android, O=Majdoor Hisaab, L=India, ST=Uttar Pradesh, C=IN"

            test -s "$KEYSTORE_FILE"

            keytool \
              -list \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -storepass "$TEMP_PASSWORD" \
              -alias "$TEMP_ALIAS" \
              >/dev/null

            echo "RELEASE_SIGNING_MODE=TEMPORARY" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$TEMP_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$TEMP_PASSWORD"

          fi

          echo ""
          echo "RELEASE SIGNING PREPARED."


      # ============================================================
      # 18. VERIFY SIGNING
      # ============================================================

      - name: Verify Signing Environment
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY SIGNING ENVIRONMENT"
          echo "=============================================="

          test -n "${RELEASE_KEYSTORE:-}"
          test -f "$RELEASE_KEYSTORE"

          test -n "${RELEASE_KEYSTORE_PASSWORD:-}"
          test -n "${RELEASE_KEY_ALIAS:-}"
          test -n "${RELEASE_KEY_PASSWORD:-}"

          keytool \
            -list \
            -keystore "$RELEASE_KEYSTORE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            >/dev/null

          echo ""
          echo "SIGNING ENVIRONMENT VERIFIED."
          echo "SIGNING MODE: ${RELEASE_SIGNING_MODE}"


      # ============================================================
      # 19. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ZIPALIGN RELEASE APK"
          echo "=============================================="

          INPUT_APK="$APK_PATH"
          ALIGNED_APK="$RUNNER_TEMP/$APK_UNSIGNED_NAME"

          rm -f "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          test -f "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c \
            -v \
            4 \
            "$ALIGNED_APK"

          echo "ALIGNED_APK=$ALIGNED_APK" >> "$GITHUB_ENV"

          echo ""
          echo "ZIPALIGN PASSED."


      # ============================================================
      # 20. SIGN APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "SIGN RELEASE APK"
          echo "=============================================="

          SIGNED_APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          rm -f "$SIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RELEASE_KEYSTORE" \
            --ks-type JKS \
            --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass "pass:$RELEASE_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          test -f "$SIGNED_APK"

          echo ""
          echo "SIGNED APK CREATED:"
          ls -lh "$SIGNED_APK"


      # ============================================================
      # 21. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY APK SIGNATURE"
          echo "=============================================="

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          test -f "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE VERIFIED."


      # ============================================================
      # 22. FINAL APK VALIDATION
      # ============================================================

      - name: Final APK Validation
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FINAL APK VALIDATION"
          echo "=============================================="

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")

          echo ""
          echo "APK SIZE:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK size unexpectedly small."
            exit 1
          fi

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging \
              "$APK"
          )

          echo ""
          echo "APK INFORMATION:"

          echo "$BADGING" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          if ! echo "$BADGING" | grep -q \
            "name='$PACKAGE_NAME'"; then

            echo "ERROR: Final APK package mismatch."
            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionCode='$VERSION_CODE'"; then

            echo "ERROR: Final APK version code mismatch."
            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionName='$VERSION_NAME'"; then

            echo "ERROR: Final APK version name mismatch."
            exit 1
          fi

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "=============================================="
          echo "FINAL APK VALIDATION PASSED"
          echo "=============================================="


      # ============================================================
      # 23. UPLOAD FINAL SIGNED APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: ${{ env.APK_SIGNED_NAME }}
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 24. UPLOAD BUILD REPORTS
      # ============================================================

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/**
          if-no-files-found: warn
          retention-days: 14
