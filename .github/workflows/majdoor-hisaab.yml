name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

# IMPORTANT:
# Do NOT cancel an already-running production build.
# A new run will wait instead of cancelling the current build.
concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"

  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_CODE: "82"
  VERSION_NAME: "1.82.0"

  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_GANNA_PARCHI_BACKUP_APPLOCK_FINAL_V18.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

  KEYSTORE_NAME: "release-production.p12"
  INIT_SCRIPT_NAME: "release-signing.init.gradle"

  GRADLE_USER_HOME: "${{ github.workspace }}/.gradle"

jobs:

  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-24.04

    timeout-minutes: 45

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. JAVA 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ---------------------------------------------------------
      # 3. GRADLE
      # ---------------------------------------------------------
      - name: Setup Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: false


      # ---------------------------------------------------------
      # 4. ANDROID SDK
      # ---------------------------------------------------------
      - name: Locate Android SDK
        id: android-sdk
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_HOME:-}" ]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            SDK_ROOT="$HOME/android-sdk"
          fi

          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          mkdir -p "$SDK_ROOT"

          echo "Android SDK:"
          echo "$SDK_ROOT"


      # ---------------------------------------------------------
      # 5. ACCEPT LICENSES
      # ---------------------------------------------------------
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true


      # ---------------------------------------------------------
      # 6. INSTALL ONLY REQUIRED SDK PACKAGES
      # ---------------------------------------------------------
      - name: Install Android API ${{ env.ANDROID_API }} and Build Tools
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"


      # ---------------------------------------------------------
      # 7. VERIFY ENVIRONMENT
      # ---------------------------------------------------------
      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "JAVA"
          echo "========================================"
          java -version

          echo
          echo "========================================"
          echo "GRADLE"
          echo "========================================"
          gradle --version

          echo
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}" || true

          echo
          echo "========================================"
          echo "AAPT2"
          echo "========================================"

          AAPT2="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2"

          if [ ! -x "$AAPT2" ]; then
            echo "ERROR: aapt2 not found"
            exit 1
          fi

          "$AAPT2" version


      # ---------------------------------------------------------
      # 8. LOCATE V18 SOURCE ZIP
      # ---------------------------------------------------------
      - name: Locate V18 source ZIP
        shell: bash
        run: |
          set -e

          echo "Looking for:"
          echo "$ZIP_NAME"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERROR: V18 ZIP not found."

            echo
            echo "ZIP files available:"
            find . -maxdepth 3 -type f -iname "*.zip" -print || true

            exit 1
          fi

          echo "V18 ZIP found."


      # ---------------------------------------------------------
      # 9. VERIFY ZIP
      # ---------------------------------------------------------
      - name: Verify V18 ZIP integrity
        shell: bash
        run: |
          set -e

          unzip -t "$ZIP_NAME" >/tmp/zip-test.log

          tail -20 /tmp/zip-test.log

          echo "ZIP integrity check PASSED."


      # ---------------------------------------------------------
      # 10. EXTRACT SOURCE
      # ---------------------------------------------------------
      - name: Extract V18 source
        shell: bash
        run: |
          set -e

          rm -rf source-v18
          mkdir -p source-v18

          unzip -q "$ZIP_NAME" -d source-v18

          echo "Extracted source:"
          find source-v18 -maxdepth 3 -type f | head -100


      # ---------------------------------------------------------
      # 11. LOCATE ANDROID PROJECT
      # ---------------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "source-v18/settings.gradle" ] || \
             [ -f "source-v18/settings.gradle.kts" ]; then
            PROJECT_DIR="source-v18"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find source-v18 \
              -maxdepth 5 \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"


      # ---------------------------------------------------------
      # 12. VERIFY ANDROID PROJECT
      # ---------------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -d app
          test -f app/build.gradle || test -f app/build.gradle.kts

          echo "Android project verified."


      # ---------------------------------------------------------
      # 13. VERIFY MAIN ACTIVITY
      # ---------------------------------------------------------
      - name: Verify MainActivity
        shell: bash
        run: |
          set -e

          MAIN_ACTIVITY="$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
            -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_ACTIVITY"


      # ---------------------------------------------------------
      # 14. VERIFY FILE PROVIDER
      # ---------------------------------------------------------
      - name: Verify FileProvider
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          grep -qi "FileProvider" "$MANIFEST" || {
            echo "WARNING: FileProvider declaration not found in manifest."
          }

          echo "Manifest check completed."


      # ---------------------------------------------------------
      # 15. VERIFY APPLICATION CONFIG
      # ---------------------------------------------------------
      - name: Verify application configuration
        shell: bash
        run: |
          set -e

          BUILD_FILE=""

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          else
            echo "ERROR: app build file not found."
            exit 1
          fi

          echo "Build file:"
          echo "$BUILD_FILE"

          grep -q "$PACKAGE_NAME" "$BUILD_FILE" || \
            echo "WARNING: Package name not directly visible in build file."

          echo "Application configuration check completed."


      # ---------------------------------------------------------
      # 16. CONFIGURE SDK
      # ---------------------------------------------------------
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          EOF

          echo "local.properties configured."


      # ---------------------------------------------------------
      # 17. CHECK SIGNING SECRETS
      # ---------------------------------------------------------
      - name: Check permanent signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$RELEASE_KEYSTORE_BASE64" || {
            echo "ERROR: RELEASE_KEYSTORE_BASE64 missing."
            exit 1
          }

          test -n "$RELEASE_KEYSTORE_PASSWORD" || {
            echo "ERROR: RELEASE_KEYSTORE_PASSWORD missing."
            exit 1
          }

          test -n "$RELEASE_KEY_ALIAS" || {
            echo "ERROR: RELEASE_KEY_ALIAS missing."
            exit 1
          }

          test -n "$RELEASE_KEY_PASSWORD" || {
            echo "ERROR: RELEASE_KEY_PASSWORD missing."
            exit 1
          }

          echo "All permanent signing secrets are available."


      # ---------------------------------------------------------
      # 18. PREPARE PRODUCTION KEYSTORE
      # ---------------------------------------------------------
      - name: Prepare permanent production keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -e

          KEYSTORE_PATH="$RUNNER_TEMP/$KEYSTORE_NAME"

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" >/tmp/keytool-check.txt

          cat /tmp/keytool-check.txt

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Permanent production keystore verified."


      # ---------------------------------------------------------
      # 19. CONFIGURE GRADLE RELEASE SIGNING
      # ---------------------------------------------------------
      - name: Configure Gradle release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e

          INIT_SCRIPT="$RUNNER_TEMP/$INIT_SCRIPT_NAME"

          cat > "$INIT_SCRIPT" <<'GRADLE_INIT'
          allprojects {
              afterEvaluate { project ->

                  if (project.plugins.hasPlugin("com.android.application")) {

                      def androidExt = project.extensions.findByName("android")

                      if (androidExt != null) {

                          androidExt.signingConfigs {
                              productionRelease {
                                  storeFile = file(System.getenv("KEYSTORE_PATH"))
                                  storePassword = System.getenv("RELEASE_KEYSTORE_PASSWORD")
                                  keyAlias = System.getenv("RELEASE_KEY_ALIAS")
                                  keyPassword = System.getenv("RELEASE_KEY_PASSWORD")
                                  storeType = "PKCS12"
                              }
                          }

                          androidExt.buildTypes {
                              release {
                                  signingConfig = androidExt.signingConfigs.productionRelease
                              }
                          }
                      }
                  }
              }
          }
          GRADLE_INIT

          echo "INIT_SCRIPT=$INIT_SCRIPT" >> "$GITHUB_ENV"

          echo "Gradle signing init script created."


      # ---------------------------------------------------------
      # 20. SIGNING ENVIRONMENT
      # ---------------------------------------------------------
      - name: Configure signing environment
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

          echo "Signing environment configured."


      # ---------------------------------------------------------
      # 21. GRADLE MEMORY / KOTLIN STABILITY
      # ---------------------------------------------------------
      - name: Configure Gradle build stability
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          if ! grep -q "^org.gradle.jvmargs=" gradle.properties; then
            echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          fi

          if ! grep -q "^org.gradle.daemon=" gradle.properties; then
            echo "org.gradle.daemon=true" >> gradle.properties
          fi

          if ! grep -q "^org.gradle.parallel=" gradle.properties; then
            echo "org.gradle.parallel=false" >> gradle.properties
          fi

          if ! grep -q "^kotlin.daemon.jvm.options=" gradle.properties; then
            echo "kotlin.daemon.jvm.options=-Xmx3g" >> gradle.properties
          fi

          echo
          echo "Final gradle.properties:"
          cat gradle.properties


      # ---------------------------------------------------------
      # 22. GRADLE CLEAN
      # ---------------------------------------------------------
      - name: Gradle clean
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --init-script "$INIT_SCRIPT" \
            clean


      # ---------------------------------------------------------
      # 23. BUILD RELEASE APK
      # ---------------------------------------------------------
      - name: Build Release APK
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING RELEASE APK"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --init-script "$INIT_SCRIPT" \
            :app:assembleRelease \
            2>&1 | tee "$GITHUB_WORKSPACE/release-build.log"


      # ---------------------------------------------------------
      # 24. LOCATE APK
      # ---------------------------------------------------------
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/$APK_UNSIGNED_NAME"

          echo "APK_UNSIGNED_PATH=$GITHUB_WORKSPACE/$APK_UNSIGNED_NAME" >> "$GITHUB_ENV"


      # ---------------------------------------------------------
      # 25. ZIPALIGN
      # ---------------------------------------------------------
      - name: Align APK
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"

          if [ ! -x "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          "$ZIPALIGN" \
            -f 4 \
            "$APK_UNSIGNED_PATH" \
            "$RUNNER_TEMP/aligned.apk"

          "$ZIPALIGN" -c -v 4 "$RUNNER_TEMP/aligned.apk"

          echo "Aligned APK verified."


      # ---------------------------------------------------------
      # 26. SIGN APK
      # ---------------------------------------------------------
      - name: Sign APK with permanent production key
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-type PKCS12 \
            --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass "pass:$RELEASE_KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/$APK_SIGNED_NAME" \
            "$RUNNER_TEMP/aligned.apk"

          test -s "$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          echo "APK signing completed."


      # ---------------------------------------------------------
      # 27. VERIFY SIGNATURE
      # ---------------------------------------------------------
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          "$APKSIGNER" verify --verbose \
            "$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          echo "APK signature verification PASSED."


      # ---------------------------------------------------------
      # 28. VERIFY CERTIFICATE
      # ---------------------------------------------------------
      - name: Verify permanent production certificate
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          "$APKSIGNER" verify \
            --print-certs \
            "$GITHUB_WORKSPACE/$APK_SIGNED_NAME" \
            | tee "$GITHUB_WORKSPACE/certificate.txt"

          echo
          echo "Production certificate verified."


      # ---------------------------------------------------------
      # 29. VERIFY APK PACKAGE / VERSION
      # ---------------------------------------------------------
      - name: Verify APK package and version
        shell: bash
        run: |
          set -e

          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"

          if [ ! -x "$AAPT" ]; then
            echo "ERROR: aapt not found."
            exit 1
          fi

          "$AAPT" dump badging \
            "$GITHUB_WORKSPACE/$APK_SIGNED_NAME" \
            | tee "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -q "package: name='$PACKAGE_NAME'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -q "versionCode='$VERSION_CODE'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          grep -q "versionName='$VERSION_NAME'" \
            "$GITHUB_WORKSPACE/apk-badging.txt"

          echo "Package/version verification PASSED."


      # ---------------------------------------------------------
      # 30. SHA256
      # ---------------------------------------------------------
      - name: Generate APK SHA256
        shell: bash
        run: |
          set -e

          sha256sum \
            "$GITHUB_WORKSPACE/$APK_SIGNED_NAME" \
            | tee "$GITHUB_WORKSPACE/SHA256SUMS.txt"


      # ---------------------------------------------------------
      # 31. BUILD REPORT
      # ---------------------------------------------------------
      - name: Generate build report
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          {
            echo "========================================"
            echo "MAJDOOR HISAAB PRO V82"
            echo "FINAL SIGNED RELEASE BUILD REPORT"
            echo "========================================"
            echo
            echo "Package      : $PACKAGE_NAME"
            echo "Version Code : $VERSION_CODE"
            echo "Version Name : $VERSION_NAME"
            echo "Android API  : $ANDROID_API"
            echo "Build Tools  : $BUILD_TOOLS"
            echo "Java         : $JAVA_VERSION"
            echo "Gradle       : $GRADLE_VERSION"
            echo "Source ZIP   : $ZIP_NAME"
            echo
            echo "APK          : $APK_SIGNED_NAME"
            echo "APK Size     : $(stat -c%s "$APK") bytes"
            echo
            echo "Build Status : SUCCESS"
            echo
            echo "Security:"
            echo "- Permanent production keystore"
            echo "- APK signature verified"
            echo "- Package verified"
            echo "- Version verified"
            echo "- SHA256 generated"
            echo
            echo "Features in V18 source:"
            echo "- App opening device screen lock"
            echo "- Edit/delete device credential protection"
            echo "- Backup restore device credential protection"
            echo "- Android Auto Backup"
            echo "- Manual .mhbackup backup/restore"
            echo "- Backup photo mapping"
            echo "- Ganna Parchi"
            echo "- Ganna rate history"
            echo "- Receipt date-based rate recalculation"
            echo "- Duplicate price-history date protection"
            echo "- Attendance date-wise PDF"
            echo
          } > "$GITHUB_WORKSPACE/BUILD-REPORT.txt"

          cat "$GITHUB_WORKSPACE/BUILD-REPORT.txt"


      # ---------------------------------------------------------
      # 32. FINAL FILE CHECK
      # ---------------------------------------------------------
      - name: Final APK validation
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          test -f "$APK"
          test -s "$APK"

          echo
          echo "========================================"
          echo "FINAL APK READY"
          echo "========================================"

          ls -lh "$APK"

          echo
          echo "SHA256:"
          cat "$GITHUB_WORKSPACE/SHA256SUMS.txt"


      # ---------------------------------------------------------
      # 33. UPLOAD ARTIFACT
      # ---------------------------------------------------------
      - name: Upload final release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-RELEASE
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ github.workspace }}/Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk
            ${{ github.workspace }}/BUILD-REPORT.txt
            ${{ github.workspace }}/SHA256SUMS.txt
            ${{ github.workspace }}/certificate.txt
            ${{ github.workspace }}/apk-badging.txt
            ${{ github.workspace }}/release-build.log


      # ---------------------------------------------------------
      # 34. CLEANUP
      # ---------------------------------------------------------
      - name: Cleanup sensitive signing files
        if: always()
        shell: bash
        run: |
          rm -f "$KEYSTORE_PATH" || true
          rm -f "$INIT_SCRIPT" || true

          echo "Sensitive signing files cleaned."
