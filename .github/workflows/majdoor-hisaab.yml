name: Majdoor Hisaab - Release APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. FIND SOURCE ZIP
      # ==================================================
      - name: Find Majdoor Hisaab ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -name "Majdoor_Hisaab_v1_1_source.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Majdoor_Hisaab_v1_1_source.zip नहीं मिली।"
            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f | sort
            exit 1
          fi

          echo "ZIP मिली:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==================================================
      # 3. EXTRACT SOURCE
      # ==================================================
      - name: Extract Majdoor Hisaab ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/build-source"

          mkdir -p "$GITHUB_WORKSPACE/build-source"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/build-source"

          echo "ZIP successfully extract हो गई।"

          echo ""
          echo "Extracted Android files:"
          find "$GITHUB_WORKSPACE/build-source" \
            -maxdepth 6 \
            -type f | sort | head -300


      # ==================================================
      # 4. FIND ANDROID PROJECT
      # ==================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build-source" \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build-source" \
              -type f \
              -name "settings.gradle" \
              -print -quit \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project नहीं मिला।"
            echo ""
            echo "Available Gradle settings files:"
            find "$GITHUB_WORKSPACE/build-source" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print
            exit 1
          fi

          echo "Android project मिला:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==================================================
      # 5. VERIFY PROJECT
      # ==================================================
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          pwd

          echo ""

          if [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle(.kts) नहीं मिला"
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory नहीं मिला"
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && \
             [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) नहीं मिला"
            exit 1
          fi

          echo "Android project verification: OK"


      # ==================================================
      # 6. JAVA 17
      # ==================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 7. ANDROID SDK
      # ==================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"


      # ==================================================
      # 8. INSTALL ANDROID SDK
      # ==================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK installation: OK"

          sdkmanager --list_installed


      # ==================================================
      # 9. GRADLE
      # ==================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ==================================================
      # 10. PREPARE GRADLE
      # ==================================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper मिला।"
            ./gradlew --version
          else
            echo "Gradle wrapper नहीं मिला।"
            echo "System Gradle इस्तेमाल होगा।"
            gradle --version
          fi


      # ==================================================
      # 11. FIX JAVA / KOTLIN JVM TARGET
      # ==================================================
      - name: Fix Java Kotlin JVM Target
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Java और Kotlin JVM target को 17 किया जा रहा है..."

          if [ -f "app/build.gradle.kts" ]; then

            python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          # Java 8 -> Java 17
          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          s = s.replace(
              "JavaVersion.VERSION_8",
              "JavaVersion.VERSION_17"
          )

          # Kotlin JVM 1.8/8 -> 17
          s = s.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          s = s.replace(
              'jvmTarget = "8"',
              'jvmTarget = "17"'
          )

          s = s.replace(
              "jvmTarget = '1.8'",
              "jvmTarget = '17'"
          )

          s = s.replace(
              "jvmTarget = '8'",
              "jvmTarget = '17'"
          )

          p.write_text(s)

          print("build.gradle.kts JVM target patched.")
          PY

          elif [ -f "app/build.gradle" ]; then

            python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          # Java 8 -> Java 17
          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          s = s.replace(
              "JavaVersion.VERSION_8",
              "JavaVersion.VERSION_17"
          )

          # Kotlin JVM 1.8/8 -> 17
          s = s.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          s = s.replace(
              'jvmTarget = "8"',
              'jvmTarget = "17"'
          )

          s = s.replace(
              "jvmTarget = '1.8'",
              "jvmTarget = '17'"
          )

          s = s.replace(
              "jvmTarget = '8'",
              "jvmTarget = '17'"
          )

          p.write_text(s)

          print("build.gradle JVM target patched.")
          PY

          else
            echo "ERROR: app Gradle file नहीं मिला"
            exit 1
          fi

          echo ""
          echo "JVM settings after patch:"
          grep -nEi \
            "VERSION_1_8|VERSION_8|VERSION_17|jvmTarget|compileOptions|kotlinOptions" \
            app/build.gradle* || true


      # ==================================================
      # 12. FIX MAINACTIVITY ONCREATE OVERRIDE
      # ==================================================
      - name: Fix MainActivity onCreate Override
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          MAIN_ACTIVITY=$(find . \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.kt नहीं मिली।"
            echo ""
            echo "Available Kotlin files:"
            find . \
              -type f \
              -name "*.kt" | sort
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_ACTIVITY"

          python3 - "$MAIN_ACTIVITY" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          lines = text.splitlines(keepends=True)

          found = False
          changed = False

          for i, line in enumerate(lines):

              if "fun onCreate(" not in line:
                  continue

              found = True

              # पहले से override है तो कुछ न करें
              if re.search(r"\boverride\s+fun\s+onCreate\s*\(", line):
                  print("onCreate already has override.")
                  break

              # protected fun onCreate(...)
              if re.search(r"\bprotected\s+fun\s+onCreate\s*\(", line):
                  lines[i] = re.sub(
                      r"\bprotected\s+fun\s+onCreate\s*\(",
                      "protected override fun onCreate(",
                      line,
                      count=1
                  )
                  changed = True
                  break

              # public fun onCreate(...)
              if re.search(r"\bpublic\s+fun\s+onCreate\s*\(", line):
                  lines[i] = re.sub(
                      r"\bpublic\s+fun\s+onCreate\s*\(",
                      "public override fun onCreate(",
                      line,
                      count=1
                  )
                  changed = True
                  break

              # private onCreate override नहीं हो सकता
              if re.search(r"\bprivate\s+fun\s+onCreate\s*\(", line):
                  print("ERROR: MainActivity onCreate() private है.")
                  print("इसे override बनाने के लिए source code की आवश्यकता है.")
                  sys.exit(1)

              # सामान्य fun onCreate(...)
              lines[i] = re.sub(
                  r"\bfun\s+onCreate\s*\(",
                  "override fun onCreate(",
                  line,
                  count=1
              )

              changed = True
              break

          if not found:
              print("ERROR: MainActivity में onCreate() नहीं मिला.")
              sys.exit(1)

          if changed:
              path.write_text("".join(lines))
              print("MainActivity.onCreate() में override जोड़ा गया.")
          PY

          echo ""
          echo "MainActivity verification:"
          grep -n -A4 -B2 "onCreate" "$MAIN_ACTIVITY" || true


      # ==================================================
      # 13. FINAL SOURCE CHECK
      # ==================================================
      - name: Final source validation
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Final source validation शुरू..."

          MAIN_ACTIVITY=$(find . \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.kt नहीं मिली"
            exit 1
          fi

          if ! grep -Eq \
            "override[[:space:]]+fun[[:space:]]+onCreate[[:space:]]*\(" \
            "$MAIN_ACTIVITY"; then

            echo "ERROR: MainActivity.onCreate() में override नहीं है."
            echo ""
            grep -n "onCreate" "$MAIN_ACTIVITY" || true
            exit 1
          fi

          echo "MainActivity override check: PASS"

          echo ""
          echo "Final Java/Kotlin target check:"
          grep -RniE \
            "VERSION_1_8|jvmTarget.*1\.8|jvmTarget.*['\"]8['\"]" \
            app \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

          echo ""
          echo "Source validation: PASS"


      # ==================================================
      # 14. BUILD RELEASE APK
      # ==================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "RELEASE APK BUILD START"
          echo "======================================"

          if [ -f "./gradlew" ]; then

            ./gradlew \
              clean \
              assembleRelease \
              --no-daemon \
              --stacktrace

          else

            gradle \
              clean \
              assembleRelease \
              --no-daemon \
              --stacktrace

          fi

          echo "======================================"
          echo "RELEASE APK BUILD FINISHED"
          echo "======================================"


      # ==================================================
      # 15. FIND APK
      # ==================================================
      - name: Find Release APK
        shell: bash
        run: |
          set -e

          echo "Release APK खोज रहे हैं..."

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | grep -Ei "release" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: Release APK नहीं मिली."

            echo ""
            echo "Available APK/output files:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          echo ""
          echo "Release APK मिली:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"

          echo ""
          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"


      # ==================================================
      # 16. UPLOAD FINAL APK
      # ==================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-Release-APK
          path: Majdoor-Hisaab-Release.apk
          if-no-files-found: error
          retention-days: 30
