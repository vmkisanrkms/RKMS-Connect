name: Build V27 v2.10 Final Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-v27-release
  cancel-in-progress: true

jobs:
  build:
    name: Build V27 v2.10 Final Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. JAVA 17
      # IMPORTANT:
      # No Gradle cache here. This avoids the previous failure where
      # setup-java tried to find Gradle files before the project root
      # had been identified.
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # 4. INSTALL REQUIRED SDK
      # ============================================================
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 35 installed."

      # ============================================================
      # 5. FIND ACTUAL ANDROID PROJECT ROOT
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | head -200

          echo
          echo "Searching for Android project..."

          ROOT=""

          while IFS= read -r settings; do
            CANDIDATE="$(dirname "$settings")"

            if [ -f "$CANDIDATE/gradlew" ] && \
               [ -f "$CANDIDATE/app/build.gradle.kts" ] && \
               [ -f "$CANDIDATE/settings.gradle.kts" ]; then
              ROOT="$CANDIDATE"
              break
            fi
          done < <(
            find . \
              -type f \
              -name "settings.gradle.kts" \
              -not -path "*/.git/*" \
              | sort
          )

          if [ -z "$ROOT" ]; then
            echo
            echo "ERROR: V27 Android project was not found."
            echo
            echo "Required files:"
            echo "  settings.gradle.kts"
            echo "  build.gradle.kts"
            echo "  gradlew"
            echo "  app/build.gradle.kts"
            echo
            echo "Make sure the V27 V5 source is uploaded to this repository."
            exit 1
          fi

          ROOT="$(realpath "$ROOT")"

          echo "ANDROID_PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo
          echo "Android project root:"
          echo "$ROOT"

      # ============================================================
      # 6. VERIFY PROJECT STRUCTURE
      # ============================================================
      - name: Verify V27 project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_ROOT"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo "V27 project structure: PASS"

      # ============================================================
      # 7. VERIFY EXACT V27 V5 CONFIGURATION
      # ============================================================
      - name: Verify V27 v2.10 configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_ROOT"

          APP="app/build.gradle.kts"

          echo "Checking:"
          echo "$APP"

          grep -Fq \
            'namespace = "com.majdoor.hisaab"' \
            "$APP"

          grep -Fq \
            'applicationId = "com.majdoor.hisaab"' \
            "$APP"

          grep -Fq \
            'compileSdk = 35' \
            "$APP"

          grep -Fq \
            'minSdk = 26' \
            "$APP"

          grep -Fq \
            'targetSdk = 35' \
            "$APP"

          grep -Fq \
            'versionCode = 30' \
            "$APP"

          grep -Fq \
            'versionName = "2.10"' \
            "$APP"

          grep -Fq \
            'JavaVersion.VERSION_17' \
            "$APP"

          grep -Fq \
            'jvmTarget = "17"' \
            "$APP"

          echo
          echo "V27 configuration:"
          echo "Package      : com.majdoor.hisaab"
          echo "Version      : 2.10"
          echo "VersionCode  : 30"
          echo "compileSdk   : 35"
          echo "targetSdk    : 35"
          echo "minSdk       : 26"
          echo "Java         : 17"

          echo
          echo "V27 configuration: PASS"

      # ============================================================
      # 8. VERIFY GRADLE VERSION
      # ============================================================
      - name: Verify Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_ROOT"

          chmod +x gradlew

          grep -Fq \
            "gradle-8.11.1-bin.zip" \
            gradle/wrapper/gradle-wrapper.properties

          ./gradlew --version

          ./gradlew --version | grep -Fq "Gradle 8.11.1"

          echo "Gradle 8.11.1: PASS"

      # ============================================================
      # 9. VERIFY ANDROID MANIFEST
      # ============================================================
      - name: Verify Android Manifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_ROOT"

          MANIFEST="app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          grep -Fq \
            'com.majdoor.hisaab' \
            "$MANIFEST"

          echo "Android Manifest: PASS"

      # ============================================================
      # 10. CLEAN
      # ============================================================
      - name: Clean previous outputs
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_ROOT"

          ./gradlew clean --no-daemon

          rm -rf app/build/outputs/apk
          rm -rf app/build/outputs/bundle

          echo "Clean: PASS"

      # ============================================================
      # 11. BUILD RELEASE APK ONLY
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_ROOT"

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 12. FIND RELEASE APK
      # ============================================================
      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_ROOT"

          APK="$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          APK="$(realpath "$APK")"

          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"

          echo
          echo "Release APK:"
          echo "$APK"

          ls -lh "$APK"

      # ============================================================
      # 13. VERIFY APK INTEGRITY
      # ============================================================
      - name: Verify APK integrity
        shell: bash
        run: |
          set -euo pipefail

          test -f "$RELEASE_APK"
          test -s "$RELEASE_APK"

          unzip -t "$RELEASE_APK" >/dev/null

          echo "APK ZIP integrity: PASS"

      # ============================================================
      # 14. VERIFY NO DEBUG APK
      # ============================================================
      - name: Verify no Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_ROOT"

          DEBUG_APKS="$(find app/build/outputs/apk \
            -type f \
            -iname "*debug*.apk" || true)"

          if [ -n "$DEBUG_APKS" ]; then
            echo "ERROR: Debug APK found:"
            echo "$DEBUG_APKS"
            exit 1
          fi

          echo "Debug APK: NOT FOUND"

      # ============================================================
      # 15. VERIFY NO AAB
      # ============================================================
      - name: Verify no AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_ROOT"

          AABS="$(find app/build/outputs \
            -type f \
            \( -name "*.aab" -o -name "*.aab.zip" \) || true)"

          if [ -n "$AABS" ]; then
            echo "ERROR: AAB found:"
            echo "$AABS"
            exit 1
          fi

          echo "AAB: NOT FOUND"

      # ============================================================
      # 16. VERIFY PACKAGE / VERSION / VERSION CODE
      # ============================================================
      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -x "$AAPT"

          BADGING="$("$AAPT" dump badging "$RELEASE_APK")"

          echo "$BADGING"

          echo "$BADGING" | grep -Fq \
            "package: name='com.majdoor.hisaab'"

          echo "$BADGING" | grep -Fq \
            "versionCode='30'"

          echo "$BADGING" | grep -Fq \
            "versionName='2.10'"

          echo
          echo "APK package/version: PASS"

      # ============================================================
      # 17. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            "$RELEASE_APK"

          echo
          echo "APK signature: PASS"

      # ============================================================
      # 18. SHA-256
      # ============================================================
      - name: Generate SHA-256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$RELEASE_APK" \
            | tee "$GITHUB_WORKSPACE/release-apk-sha256.txt"

      # ============================================================
      # 19. COPY FINAL APK TO SIMPLE OUTPUT NAME
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/final"

          cp "$RELEASE_APK" \
            "$GITHUB_WORKSPACE/final/Majdoor-Hisaab-PRO-V27-v2.10-FINAL.apk"

          cp "$GITHUB_WORKSPACE/release-apk-sha256.txt" \
            "$GITHUB_WORKSPACE/final/"

          ls -lh "$GITHUB_WORKSPACE/final/"

      # ============================================================
      # 20. UPLOAD FINAL RELEASE APK
      # ============================================================
      - name: Upload FINAL V27 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V27-v2.10-FINAL-Release-APK
          path: final/Majdoor-Hisaab-PRO-V27-v2.10-FINAL.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 21. UPLOAD SHA-256
      # ============================================================
      - name: Upload SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V27-v2.10-SHA256
          path: final/release-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
