name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V82-KOTLIN-COMPILE-FIXED.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. LOCATE ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATING ANDROID SDK"
          echo "=============================================="

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"

          else
            SDK_ROOT=$(find /usr/local/lib/android \
              -maxdepth 3 \
              -type d \
              -name "sdk" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name "sdkmanager" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "Android SDK:"
          echo "$SDK_ROOT"

          echo ""
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          "$SDKMANAGER" --version


      # ============================================================
      # 4. INSTALL ANDROID SDK 36
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INSTALL ANDROID SDK 36"
          echo "=============================================="

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "ANDROID SDK INSTALLATION PASSED."


      # ============================================================
      # 5. VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY ANDROID SDK"
          echo "=============================================="

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"

          echo ""
          echo "ANDROID SDK VERIFICATION PASSED."


      # ============================================================
      # 6. SETUP GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # 7. VERIFY EXACT V82 ZIP
      # ============================================================

      - name: Verify V82 ZIP
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY V82 ZIP"
          echo "=============================================="

          echo ""
          echo "Expected ZIP:"
          echo "$ZIP_NAME"

          if [ ! -f "$ZIP_NAME" ]; then
            echo ""
            echo "ERROR: V82 ZIP NOT FOUND."

            echo ""
            echo "Available ZIP files:"

            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print \
              | sort

            exit 1
          fi

          echo ""
          echo "V82 ZIP FOUND:"
          ls -lh "$ZIP_NAME"


      # ============================================================
      # 8. EXTRACT V82 PROJECT
      # ============================================================

      - name: Extract V82 Project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "EXTRACT V82 PROJECT"
          echo "=============================================="

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_NAME" -d build_source

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print \
            -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "PROJECT:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 9. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "VERIFY ANDROID PROJECT"
          echo "=============================================="

          echo "Working directory:"
          pwd

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo ""
          echo "ANDROID PROJECT VERIFIED."


      # ============================================================
      # 10. LOCATE KOTLIN SOURCES
      # ============================================================

      - name: Locate V82 Kotlin Sources
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE V82 KOTLIN SOURCES"
          echo "=============================================="

          echo ""
          echo "PROJECT:"
          pwd

          KOTLIN_COUNT=$(find app/src/main \
            -type f \
            -name "*.kt" \
            | wc -l)

          echo ""
          echo "Kotlin source count:"
          echo "$KOTLIN_COUNT"

          if [ "$KOTLIN_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No Kotlin source files found."

            find app/src/main \
              -maxdepth 8 \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo ""
          echo "Kotlin sources:"

          find app/src/main \
            -type f \
            -name "*.kt" \
            -print \
            | sort


      # ============================================================
      # 11. CORRECT V82 btn() REPAIR
      #
      # IMPORTANT:
      #
      # The previous repair had:
      #
      #     depth = 0
      #
      # which corrupted nested expressions.
      #
      # THIS VERSION CORRECTLY STARTS:
      #
      #     depth = 1
      #
      # because btn( has already opened one parenthesis.
      #
      # Only action-less btn("...") calls receive {}.
      # Existing btn(...){...} calls are untouched.
      # ============================================================

      - name: Repair V82 Kotlin btn Actions
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=============================================="
          echo "REPAIR V82 KOTLIN btn() ACTIONS"
          echo "=============================================="

          echo ""
          echo "Working directory:"
          pwd

          python3 <<'PY'
          from pathlib import Path

          root = Path("app/src/main")

          sources = list(root.rglob("*.kt"))

          if not sources:
              raise SystemExit(
                  "ERROR: No Kotlin source files found."
              )


          # --------------------------------------------------------
          # Find the closing ')' of btn(
          #
          # IMPORTANT:
          # depth starts at 1 because the '(' in btn(
          # is already open.
          # --------------------------------------------------------

          def find_close(s, start):

              depth = 1
              i = start
              mode = "normal"

              while i < len(s):

                  if mode == "normal":

                      if s.startswith('"""', i):
                          mode = "triple"
                          i += 3
                          continue

                      c = s[i]

                      if c == '"':
                          mode = "string"
                          i += 1
                          continue

                      if c == "'":
                          mode = "char"
                          i += 1
                          continue

                      if c == "(":
                          depth += 1

                      elif c == ")":
                          depth -= 1

                          if depth == 0:
                              return i

                      i += 1


                  elif mode == "string":

                      if s[i] == "\\":
                          i += 2
                          continue

                      if s[i] == '"':
                          mode = "normal"

                      i += 1


                  elif mode == "char":

                      if s[i] == "\\":
                          i += 2
                          continue

                      if s[i] == "'":
                          mode = "normal"

                      i += 1


                  else:

                      if s.startswith('"""', i):
                          mode = "normal"
                          i += 3
                      else:
                          i += 1


              return None


          # --------------------------------------------------------
          # Check whether btn(...) already contains an action
          # parameter at top level.
          # --------------------------------------------------------

          def has_top_level_comma(content):

              depth = 0
              i = 0
              mode = "normal"

              while i < len(content):

                  if mode == "normal":

                      if content.startswith('"""', i):
                          mode = "triple"
                          i += 3
                          continue

                      c = content[i]

                      if c == '"':
                          mode = "string"

                      elif c == "'":
                          mode = "char"

                      elif c == "(":
                          depth += 1

                      elif c == ")":
                          depth -= 1

                      elif c == "," and depth == 0:
                          return True

                      i += 1


                  elif mode == "string":

                      if content[i] == "\\":
                          i += 2
                          continue

                      if content[i] == '"':
                          mode = "normal"

                      i += 1


                  elif mode == "char":

                      if content[i] == "\\":
                          i += 2
                          continue

                      if content[i] == "'":
                          mode = "normal"

                      i += 1


                  else:

                      if content.startswith('"""', i):
                          mode = "normal"
                          i += 3
                      else:
                          i += 1


              return False


          total_patched = 0


          for path in sources:

              text = path.read_text(encoding="utf-8")

              patches = []

              i = 0


              while True:

                  j = text.find("btn(", i)

                  if j < 0:
                      break


                  # j + 4 is the first character after btn(
                  k = find_close(text, j + 4)

                  if k is None:
                      raise SystemExit(
                          f"ERROR: Could not parse btn() in {path}"
                      )


                  content = text[j + 4:k]


                  # A comma at top level means btn already has
                  # its action parameter.
                  if has_top_level_comma(content):
                      i = k + 1
                      continue


                  # Check for trailing lambda:
                  #
                  # btn("text") { ... }
                  #

                  nxt = k + 1

                  while nxt < len(text) and text[nxt].isspace():
                      nxt += 1


                  if nxt < len(text) and text[nxt] == "{":
                      i = k + 1
                      continue


                  # This btn() has no action parameter.
                  patches.append(k + 1)

                  i = k + 1


              if patches:

                  for pos in reversed(patches):
                      text = text[:pos] + " {}" + text[pos:]


                  path.write_text(
                      text,
                      encoding="utf-8"
                  )


                  print(
                      f"PATCHED {path}: "
                      f"{len(patches)} action-less btn() calls"
                  )


                  total_patched += len(patches)


          print("")
          print("==============================================")
          print("TOTAL btn() FIXES:", total_patched)
          print("==============================================")


          if total_patched != 35:
              print("")
              print(
                  "WARNING: Expected approximately 35 fixes "
                  f"from original V82 source, got {total_patched}."
              )

          print("")
          print("btn() repair finished safely.")
          PY


      # ============================================================
      # 12. VERIFY REPAIR DID NOT CORRUPT EXPRESSIONS
      # ============================================================

      - name: Verify V82 Repair Integrity
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY V82 REPAIR INTEGRITY"
          echo "=============================================="


          # --------------------------------------------------------
          # No corruption such as:
          #
          # listOf("All"){}+
          # map{}...
          #
          # --------------------------------------------------------

          if grep -R -n -E \
            'listOf\([^)]*\)\{\}[+]' \
            app/src/main \
            --include="*.kt"; then

            echo ""
            echo "ERROR: Repair corrupted listOf expression."
            exit 1
          fi


          # --------------------------------------------------------
          # No corruption before toTypedArray()
          # --------------------------------------------------------

          if grep -R -n \
            '){}\.toTypedArray' \
            app/src/main \
            --include="*.kt"; then

            echo ""
            echo "ERROR: Repair corrupted toTypedArray expression."
            exit 1
          fi


          # --------------------------------------------------------
          # No invalid fillViewport assignment.
          # --------------------------------------------------------

          if grep -R -n \
            'fillViewport[[:space:]]*=' \
            app/src/main \
            --include="*.kt" \
            --include="*.java"; then

            echo ""
            echo "ERROR: Invalid fillViewport assignment."
            exit 1
          fi


          # --------------------------------------------------------
          # No old ReportFilter malformed positional call in
          # customReport.
          # --------------------------------------------------------

          if grep -n \
            'ReportFilter(fromIso,toIso,wid,fid,cid)' \
            app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt; then

            echo ""
            echo "WARNING: Positional ReportFilter found."
            echo "Named argument validation will be checked separately."
          fi


          echo ""
          echo "REPAIR INTEGRITY PASSED."


      # ============================================================
      # 13. FIX CUSTOM REPORT FILTER WITH EXPLICIT NAMED ARGUMENTS
      #
      # This does not change functionality.
      # It only removes ambiguity for Kotlin overload/type inference.
      # ============================================================

      - name: Normalize Custom Report Filter
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=============================================="
          echo "NORMALIZE CUSTOM REPORT FILTER"
          echo "=============================================="

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"
          )

          text = p.read_text(encoding="utf-8")

          old = (
              'com.majdoor.hisaab.report.ReportFilter('
              'fromIso,toIso,wid,fid,cid)'
          )

          new = (
              'com.majdoor.hisaab.report.ReportFilter('
              'from=fromIso, '
              'to=toIso, '
              'workerId=wid, '
              'fieldId=fid, '
              'cropId=cid)'
          )

          if old in text:

              text = text.replace(old, new)

              p.write_text(
                  text,
                  encoding="utf-8"
              )

              print("Custom ReportFilter normalized.")

          else:
              print(
                  "Custom ReportFilter already normalized "
                  "or not present."
              )
          PY

          echo ""
          echo "CUSTOM REPORT FILTER CHECK PASSED."


      # ============================================================
      # 14. KOTLIN SOURCE FINAL AUDIT
      # ============================================================

      - name: Final V82 Kotlin Source Audit
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=============================================="
          echo "FINAL V82 KOTLIN SOURCE AUDIT"
          echo "=============================================="


          # --------------------------------------------------------
          # No invalid btn lambda parameter.
          # --------------------------------------------------------

          if grep -R -n -E \
            'btn\(.*\)\{[[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*->' \
            app/src/main \
            --include="*.kt"; then

            echo ""
            echo "ERROR: Invalid btn lambda parameter."
            exit 1
          fi


          # --------------------------------------------------------
          # No lateinit Button workaround.
          # --------------------------------------------------------

          if grep -R -n -E \
            'lateinit[[:space:]]+var[[:space:]].*:[[:space:]]*Button' \
            app/src/main \
            --include="*.kt"; then

            echo ""
            echo "ERROR: Invalid lateinit Button workaround."
            exit 1
          fi


          # --------------------------------------------------------
          # No old exportType pattern.
          # --------------------------------------------------------

          if grep -R -n \
            'when(exportType)' \
            app/src/main \
            --include="*.kt"; then

            echo ""
            echo "ERROR: Old when(exportType) found."
            exit 1
          fi


          # --------------------------------------------------------
          # pick() must not return Button.
          # --------------------------------------------------------

          if grep -R -n -E \
            'fun[[:space:]]+MainActivity\.pick.*:[[:space:]]*Button' \
            app/src/main \
            --include="*.kt"; then

            echo ""
            echo "ERROR: pick() returns Button."
            exit 1
          fi


          # --------------------------------------------------------
          # Count remaining actionless btn() calls.
          #
          # Correct parser: depth = 1.
          # --------------------------------------------------------

          python3 <<'PY'
          from pathlib import Path

          root = Path("app/src/main")


          def find_close(s, start):

              depth = 1
              i = start
              mode = "normal"

              while i < len(s):

                  if mode == "normal":

                      if s.startswith('"""', i):
                          mode = "triple"
                          i += 3
                          continue

                      c = s[i]

                      if c == '"':
                          mode = "string"

                      elif c == "'":
                          mode = "char"

                      elif c == "(":
                          depth += 1

                      elif c == ")":
                          depth -= 1

                          if depth == 0:
                              return i

                      i += 1

                  elif mode == "string":

                      if s[i] == "\\":
                          i += 2
                          continue

                      if s[i] == '"':
                          mode = "normal"

                      i += 1

                  elif mode == "char":

                      if s[i] == "\\":
                          i += 2
                          continue

                      if s[i] == "'":
                          mode = "normal"

                      i += 1

                  else:

                      if s.startswith('"""', i):
                          mode = "normal"
                          i += 3
                      else:
                          i += 1

              return None


          def has_top_level_comma(content):

              depth = 0
              i = 0
              mode = "normal"

              while i < len(content):

                  if mode == "normal":

                      if content.startswith('"""', i):
                          mode = "triple"
                          i += 3
                          continue

                      c = content[i]

                      if c == '"':
                          mode = "string"

                      elif c == "'":
                          mode = "char"

                      elif c == "(":
                          depth += 1

                      elif c == ")":
                          depth -= 1

                      elif c == "," and depth == 0:
                          return True

                      i += 1

                  elif mode == "string":

                      if content[i] == "\\":
                          i += 2
                          continue

                      if content[i] == '"':
                          mode = "normal"

                      i += 1

                  elif mode == "char":

                      if content[i] == "\\":
                          i += 2
                          continue

                      if content[i] == "'":
                          mode = "normal"

                      i += 1

                  else:

                      if content.startswith('"""', i):
                          mode = "normal"
                          i += 3
                      else:
                          i += 1

              return False


          suspicious = []


          for path in root.rglob("*.kt"):

              text = path.read_text(
                  encoding="utf-8"
              )

              i = 0

              while True:

                  j = text.find("btn(", i)

                  if j < 0:
                      break

                  k = find_close(
                      text,
                      j + 4
                  )

                  if k is None:
                      raise SystemExit(
                          f"ERROR: Could not parse {path}"
                      )

                  content = text[j + 4:k]

                  if has_top_level_comma(content):

                      i = k + 1
                      continue

                  nxt = k + 1

                  while (
                      nxt < len(text)
                      and text[nxt].isspace()
                  ):
                      nxt += 1

                  if (
                      nxt < len(text)
                      and text[nxt] == "{"
                  ):

                      i = k + 1
                      continue

                  line = (
                      text.count("\n", 0, j)
                      + 1
                  )

                  suspicious.append(
                      f"{path}:{line}"
                  )

                  i = k + 1


          if suspicious:

              print("")
              print(
                  "ERROR: Actionless btn() calls remain:"
              )

              for x in suspicious:
                  print(x)

              raise SystemExit(1)


          print("")
          print(
              "PASS: No actionless btn() calls remain."
          )
          PY


          echo ""
          echo "=============================================="
          echo "FINAL KOTLIN SOURCE AUDIT PASSED"
          echo "=============================================="


      # ============================================================
      # 15. GRADLE ENVIRONMENT
      # ============================================================

      - name: Gradle Environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE ENVIRONMENT"
          echo "=============================================="

          echo ""
          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          gradle --version

          echo ""
          echo "ANDROID HOME:"
          echo "$ANDROID_HOME"


      # ============================================================
      # 16. CLEAN PROJECT
      # ============================================================

      - name: Clean Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "CLEAN PROJECT"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            clean

          echo ""
          echo "CLEAN PASSED."


      # ============================================================
      # 17. COMPILE RELEASE KOTLIN
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --rerun-tasks \
            :app:compileReleaseKotlin

          echo ""
          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN PASSED"
          echo "=============================================="


      # ============================================================
      # 18. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ASSEMBLE RELEASE APK"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --rerun-tasks \
            :app:assembleRelease

          echo ""
          echo "=============================================="
          echo "ASSEMBLE RELEASE APK PASSED"
          echo "=============================================="


      # ============================================================
      # 19. LOCATE RELEASE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE RELEASE APK"
          echo "=============================================="

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*release*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "Release APK:"
          ls -lh "$APK"


      # ============================================================
      # 20. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK Package
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY APK PACKAGE"
          echo "=============================================="

          APK="$APK_PATH"

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging "$APK"
          )

          echo "$BADGING" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          if ! echo "$BADGING" | grep -q \
            "name='$PACKAGE_NAME'"; then

            echo ""
            echo "ERROR: Package name mismatch."
            echo "Expected:"
            echo "$PACKAGE_NAME"

            exit 1
          fi

          echo ""
          echo "PACKAGE NAME VERIFIED."


      # ============================================================
      # 21. RESTORE RELEASE KEYSTORE
      # ============================================================

      - name: Restore Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "=============================================="
          echo "RESTORE RELEASE KEYSTORE"
          echo "=============================================="

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo ""
          echo "RELEASE KEYSTORE RESTORED."


      # ============================================================
      # 22. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ZIPALIGN RELEASE APK"
          echo "=============================================="

          INPUT_APK="$APK_PATH"
          ALIGNED_APK="$RUNNER_TEMP/$APK_UNSIGNED_NAME"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          if [ ! -f "$ALIGNED_APK" ]; then
            echo "ERROR: Zipaligned APK not created."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c \
            -v \
            4 \
            "$ALIGNED_APK"

          echo "ALIGNED_APK=$ALIGNED_APK" >> "$GITHUB_ENV"

          echo ""
          echo "ZIPALIGN PASSED."


      # ============================================================
      # 23. SIGN RELEASE APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "=============================================="
          echo "SIGN RELEASE APK"
          echo "=============================================="

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          SIGNED_APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks release-keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          if [ ! -f "$SIGNED_APK" ]; then
            echo "ERROR: Signed APK not created."
            exit 1
          fi

          echo ""
          echo "SIGNED APK:"
          ls -lh "$SIGNED_APK"


      # ============================================================
      # 24. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY APK SIGNATURE"
          echo "=============================================="

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE VERIFIED."


      # ============================================================
      # 25. FINAL APK VALIDATION
      # ============================================================

      - name: Final APK Validation
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FINAL APK VALIDATION"
          echo "=============================================="

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final APK missing."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          echo ""
          echo "APK SIZE:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK size unexpectedly small."
            exit 1
          fi

          echo ""
          echo "FINAL APK:"
          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "=============================================="
          echo "FINAL APK VALIDATION PASSED"
          echo "=============================================="


      # ============================================================
      # 26. UPLOAD SIGNED APK
      # ============================================================

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: ${{ env.APK_SIGNED_NAME }}
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 27. UPLOAD BUILD REPORTS
      # ============================================================

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/**
          if-no-files-found: warn
          retention-days: 14
