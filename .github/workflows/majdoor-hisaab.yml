name: Majdoor Hisaab PRO - V81 Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V81-ALL-BUTTONS-FINAL.zip"

jobs:

  build-release:

    name: Build Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SHOW REPOSITORY
      # ============================================================

      - name: Show repository files
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " REPOSITORY"
          echo "============================================================"

          pwd

          echo
          ls -la

          echo
          echo "ZIP / GRADLE FILES"

          find . -maxdepth 4 -type f \
            \( \
              -iname "*.zip" \
              -o -iname "*.gradle" \
              -o -iname "*.gradle.kts" \
              -o -iname "gradle-wrapper.properties" \
            \) \
            -print | sort


      # ============================================================
      # 3. JDK 17
      #
      # IMPORTANT:
      # NO GRADLE CACHE HERE.
      #
      # Project is inside V81 ZIP, so setup-java must not search
      # repository for Gradle files at this stage.
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. VERIFY JAVA
      # ============================================================

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " JAVA"
          echo "============================================================"

          java -version

          echo
          javac -version


      # ============================================================
      # 5. ANDROID SDK
      #
      # DO NOT use:
      #
      # android-actions/setup-android@v3
      #
      # because previous run failed trying to install old package
      # named "tools".
      #
      # GitHub runner already contains Android SDK.
      # ============================================================

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " ANDROID SDK"
          echo "============================================================"

          if [[ -n "${ANDROID_HOME:-}" ]]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [[ -n "${ANDROID_SDK_ROOT:-}" ]]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            SDK_ROOT="$HOME/android-sdk"
          fi

          echo "SDK_ROOT=$SDK_ROOT"

          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER=""

          if [[ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -path "*/bin/sdkmanager" \
                -print \
                2>/dev/null \
                | sort \
                | tail -n 1 \
                || true
            )"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found."

            find "$SDK_ROOT" \
              -type f \
              -name "sdkmanager" \
              -print \
              2>/dev/null \
              || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"

          echo
          echo "SDKMANAGER VERSION"

          "$SDKMANAGER" --version

          echo
          echo "ACCEPT LICENSES"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo
          echo "INSTALL REQUIRED SDK PACKAGES"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo
          echo "VERIFY SDK"

          test -d \
            "$SDK_ROOT/platforms/android-${ANDROID_API}"

          test -d \
            "$SDK_ROOT/build-tools/${BUILD_TOOLS}"

          test -x \
            "$SDK_ROOT/platform-tools/adb"

          test -x \
            "$SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "$SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          echo
          echo "ANDROID SDK 36 READY"


      # ============================================================
      # 6. LOCATE / EXTRACT V81
      # ============================================================

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " LOCATE ANDROID PROJECT"
          echo "============================================================"

          FOUND_ROOT=""

          # --------------------------------------------------------
          # Case 1: project already at repository root
          # --------------------------------------------------------

          if [[ -f "settings.gradle.kts" ]] && \
             [[ -f "app/build.gradle.kts" ]]; then

            FOUND_ROOT="$PWD"

            echo "Android project found at repository root."

          fi


          # --------------------------------------------------------
          # Case 2: exact V81 ZIP
          # --------------------------------------------------------

          if [[ -z "$FOUND_ROOT" ]] && \
             [[ -f "$ZIP_NAME" ]]; then

            echo "Found V81 ZIP:"
            echo "$ZIP_NAME"

            rm -rf extracted_project

            mkdir -p extracted_project

            unzip -q "$ZIP_NAME" \
              -d extracted_project

            FOUND_ROOT="$(
              find "$PWD/extracted_project" \
                -type f \
                -name "settings.gradle.kts" \
                -print \
                | while read -r file; do

                    dir="$(dirname "$file")"

                    if [[ -f "$dir/app/build.gradle.kts" ]]; then
                      echo "$dir"
                      break
                    fi

                  done
            )"

          fi


          # --------------------------------------------------------
          # Case 3: fallback search
          # --------------------------------------------------------

          if [[ -z "$FOUND_ROOT" ]]; then

            FOUND_ROOT="$(
              find "$PWD" \
                -type f \
                -name "settings.gradle.kts" \
                -print \
                | while read -r file; do

                    dir="$(dirname "$file")"

                    if [[ -f "$dir/app/build.gradle.kts" ]]; then
                      echo "$dir"
                      break
                    fi

                  done
            )"

          fi


          # --------------------------------------------------------
          # Final validation
          # --------------------------------------------------------

          if [[ -z "$FOUND_ROOT" ]]; then

            echo
            echo "ERROR: Android project not found."

            echo
            echo "Available files:"

            find "$PWD" \
              -maxdepth 5 \
              -type f \
              -print \
              | head -500

            exit 1

          fi


          echo "ANDROID_PROJECT_ROOT=$FOUND_ROOT" \
            >> "$GITHUB_ENV"


          echo
          echo "ANDROID PROJECT:"
          echo "$FOUND_ROOT"


          echo
          echo "PROJECT STRUCTURE:"

          find "$FOUND_ROOT" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -400


      # ============================================================
      # 7. GRADLE
      #
      # IMPORTANT:
      # Gradle setup is AFTER ZIP extraction.
      #
      # This prevents setup-java/setup-gradle cache from failing
      # because repository initially contains only ZIP.
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false


      # ============================================================
      # 8. VERIFY PROJECT CONFIGURATION
      # ============================================================

      - name: Verify project configuration
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " SETTINGS"
          echo "============================================================"

          sed -n '1,260p' \
            settings.gradle.kts


          echo
          echo "============================================================"
          echo " APP BUILD GRADLE"
          echo "============================================================"

          sed -n '1,380p' \
            app/build.gradle.kts


          echo
          echo "============================================================"
          echo " CONFIGURATION CHECK"
          echo "============================================================"

          grep -q \
            'com.majdoor.hisaab' \
            app/build.gradle.kts \
            || {
              echo "ERROR: package name missing."
              exit 1
            }


          grep -Eq \
            'compileSdk.*36|compileSdk = 36' \
            app/build.gradle.kts \
            || {
              echo "ERROR: compileSdk 36 missing."
              exit 1
            }


          grep -Eq \
            'targetSdk.*36|targetSdk = 36' \
            app/build.gradle.kts \
            || {
              echo "ERROR: targetSdk 36 missing."
              exit 1
            }


          grep -Eq \
            'versionCode.*77|versionCode = 77' \
            app/build.gradle.kts \
            || {
              echo "ERROR: versionCode 77 missing."
              exit 1
            }


          grep -Eq \
            'versionName.*1.77.0|versionName = "1.77.0"' \
            app/build.gradle.kts \
            || {
              echo "ERROR: versionName 1.77.0 missing."
              exit 1
            }


          echo
          echo "PROJECT CONFIGURATION PASSED"


      # ============================================================
      # 9. LOCATE MAINACTIVITYSCREENS
      # ============================================================

      - name: Locate MainActivityScreens
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          SRC="$(
            find . \
              -type f \
              -name "MainActivityScreens.kt" \
              -print \
              | head -n 1
          )"

          if [[ -z "$SRC" ]]; then
            echo "ERROR: MainActivityScreens.kt not found."
            exit 1
          fi

          echo "MAIN_ACTIVITY_SCREENS=$SRC" \
            >> "$GITHUB_ENV"

          echo "SOURCE:"
          echo "$SRC"


      # ============================================================
      # 10. APPLY V81 KOTLIN FIXES
      # ============================================================

      - name: Apply V81 Kotlin compile fixes
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          export PROJECT_ROOT="$PWD"

          python3 <<'PY'
          import os
          from pathlib import Path

          root = Path(
              os.environ["PROJECT_ROOT"]
          )

          files = list(
              root.rglob(
                  "MainActivityScreens.kt"
              )
          )

          if not files:
              raise SystemExit(
                  "ERROR: MainActivityScreens.kt not found."
              )

          src = files[0]

          text = src.read_text(
              encoding="utf-8"
          )

          original = text

          print()
          print("============================================================")
          print(" APPLY V81 SOURCE FIXES")
          print("============================================================")

          print(src)


          # ========================================================
          # 1. btn() DEFAULT ACTION
          # ========================================================

          replacements = [

              (
                  "internal fun MainActivity.btn(s:String,action:()->Unit)=TextView(this).apply{",
                  "internal fun MainActivity.btn(s:String,action:()->Unit = {})=TextView(this).apply{"
              ),

              (
                  "internal fun MainActivity.btn(s: String, action: () -> Unit) = TextView(this).apply {",
                  "internal fun MainActivity.btn(s: String, action: () -> Unit = {}) = TextView(this).apply {"
              ),

          ]

          for old, new in replacements:

              if old in text:

                  text = text.replace(
                      old,
                      new,
                      1
                  )

                  print(
                      "FIXED btn():",
                      old
                  )

                  break


          # ========================================================
          # 2. ScrollView
          # ========================================================

          if "fillViewport=true" in text:

              text = text.replace(
                  "fillViewport=true",
                  "setFillViewport(true)"
              )

              print(
                  "FIXED ScrollView fillViewport"
              )


          # ========================================================
          # 3. pick() Button -> TextView
          # ========================================================

          if "onPick:(Int)->Unit):Button" in text:

              text = text.replace(
                  "onPick:(Int)->Unit):Button",
                  "onPick:(Int)->Unit):TextView",
                  1
              )

              print(
                  "FIXED pick() return type"
              )


          # ========================================================
          # 4. statusViews Map
          # ========================================================

          map_fixes = {

              'statusViews.forEach{it.text="FULL"}':
              'statusViews.values.forEach{it.text="FULL"}',

              'statusViews.forEach{it.text="HALF"}':
              'statusViews.values.forEach{it.text="HALF"}',

              'statusViews.forEach{it.text=AttendanceRules.UNMARKED}':
              'statusViews.values.forEach{it.text=AttendanceRules.UNMARKED}',
          }

          for old, new in map_fixes.items():

              if old in text:

                  text = text.replace(
                      old,
                      new
                  )

                  print(
                      "FIXED:",
                      old
                  )


          # ========================================================
          # 5. WRONG it.text
          # ========================================================

          button_fixes = {

              'cropId=crops[i].id;it.text="Crop: ${crops[i].name}"':
              'cropId=crops[i].id;cropBtn.text="Crop: ${crops[i].name}"',

              'setPositiveButton("Done"){_,_->it.text="Workers: ${selectedWorkers.distinct().size}"}':
              'setPositiveButton("Done"){_,_->workerBtn.text="Workers: ${selectedWorkers.distinct().size}"}',

              'rateType=app.calculation.rateTypes()[i];it.text="Rate type: $rateType"':
              'rateType=app.calculation.rateTypes()[i];rateTypeBtn.text="Rate type: $rateType"',

              'wid=workers[i].id;it.text="Worker: ${workers[i].name}"':
              'wid=workers[i].id;wb.text="Worker: ${workers[i].name}"',

              'method=methods[i];it.text="Method: ${methods[i]}"':
              'method=methods[i];mb.text="Method: ${methods[i]}"',

              'advance=!advance;it.text="Advance: ${if(advance)"YES" else "NO"}"':
              'advance=!advance;adv.text="Advance: ${if(advance)"YES" else "NO"}"',

              'cat=cats[i];it.text="Category: $cat"':
              'cat=cats[i];cb.text="Category: $cat"',

              'fieldId="";it.text="Field: Not linked"':
              'fieldId="";fb.text="Field: Not linked"',

              'fieldId=fields[i-1].id;it.text="Field: ${fields[i-1].name}"':
              'fieldId=fields[i-1].id;fb.text="Field: ${fields[i-1].name}"',

              'cropId="";it.text="Crop: Not linked"':
              'cropId="";crb.text="Crop: Not linked"',

              'cropId=crops[i-1].id;it.text="Crop: ${crops[i-1].name}"':
              'cropId=crops[i-1].id;crb.text="Crop: ${crops[i-1].name}"',

              'wid=if(i==0)"" else workers[i-1].id;it.text="Worker: ${if(i==0)"All" else workers[i-1].name}"':
              'wid=if(i==0)"" else workers[i-1].id;wb.text="Worker: ${if(i==0)"All" else workers[i-1].name}"',

              'fid=if(i==0)"" else fields[i-1].id;it.text="Field: ${if(i==0)"All" else fields[i-1].name}"':
              'fid=if(i==0)"" else fields[i-1].id;fb.text="Field: ${if(i==0)"All" else fields[i-1].name}"',

              'cid=if(i==0)"" else crops[i-1].id;it.text="Crop: ${if(i==0)"All" else crops[i-1].name}"':
              'cid=if(i==0)"" else crops[i-1].id;cb.text="Crop: ${if(i==0)"All" else crops[i-1].name}"',
          }

          for old, new in button_fixes.items():

              if old in text:

                  text = text.replace(
                      old,
                      new
                  )

                  print(
                      "FIXED:",
                      old[:100]
                  )


          # ========================================================
          # 6. FIELD BUTTON MULTILINE
          # ========================================================

          text = text.replace(
              '''fieldId=if(i==0) "" else fields[i-1].id
                it.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"''',

              '''fieldId=if(i==0) "" else fields[i-1].id
                fieldBtn.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"'''
          )


          text = text.replace(
              '''fieldId=if(i==0) "" else fields[i-1].id;it.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"''',

              '''fieldId=if(i==0) "" else fields[i-1].id;fieldBtn.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"'''
          )


          # ========================================================
          # 7. ATTENDANCE STATUS
          # ========================================================

          text = text.replace(
              '''status=arrayOf("FULL","HALF","NONE")[i]
                it.text="Status: $status"''',

              '''status=arrayOf("FULL","HALF","NONE")[i]
                statusBtn.text="Status: $status"'''
          )


          # ========================================================
          # 8. INTENT TYPE
          # ========================================================

          text = text.replace(
              'Intent(Intent.ACTION_OPEN_DOCUMENT).apply{type="image/*";',
              'Intent(Intent.ACTION_OPEN_DOCUMENT).apply{this.type="image/*";'
          )


          # ========================================================
          # 9. EXPORT WHEN
          # ========================================================

          old_export = '''contentResolver.openOutputStream(uri)!!.use{out->when(exportType){
                    "workers"->app.export.csvWorkers(out)
                    "ledger"->app.export.csvLedger(out)
                    exportType.startsWith("report:")->app.export.csvReport(exportType.removePrefix("report:"),out)
                    exportType.startsWith("reportpdf:")->app.export.pdfReport(exportType.removePrefix("reportpdf:"),out)
                    "pdf"->app.export.pdfSummary(out)
                    "backup"->app.backup.export(out)
                }}'''

          new_export = '''contentResolver.openOutputStream(uri)!!.use{out->when {
                    exportType == "workers"->app.export.csvWorkers(out)
                    exportType == "ledger"->app.export.csvLedger(out)
                    exportType.startsWith("report:")->app.export.csvReport(exportType.removePrefix("report:"),out)
                    exportType.startsWith("reportpdf:")->app.export.pdfReport(exportType.removePrefix("reportpdf:"),out)
                    exportType == "pdf"->app.export.pdfSummary(out)
                    exportType == "backup"->app.backup.export(out)
                }}'''

          if old_export in text:

              text = text.replace(
                  old_export,
                  new_export,
                  1
              )

              print(
                  "FIXED exportType when"
              )


          # ========================================================
          # 10. COMPATIBILITY
          # ========================================================

          compatibility = {

              ".audit.auditLog":
              ".auditLog",

              "clearAuditLog":
              "clear",

              "getSystemService(ALARM_SERVICE)":
              "getSystemService(Context.ALARM_SERVICE)",
          }

          for old, new in compatibility.items():

              if old in text:

                  text = text.replace(
                      old,
                      new
                  )

                  print(
                      "FIXED:",
                      old,
                      "->",
                      new
                  )


          # ========================================================
          # 11. renderSummary
          # ========================================================

          render_marker = "        fun render(){"
          summary_marker = "        fun renderSummary(){"
          nav_marker = "        val nav="

          if (
              render_marker in text
              and summary_marker in text
              and nav_marker in text
          ):

              r0 = text.index(
                  render_marker
              )

              s0 = text.index(
                  summary_marker,
                  r0
              )

              n0 = text.index(
                  nav_marker,
                  s0
              )

              render_block = text[
                  r0:s0
              ]

              summary_block = text[
                  s0:n0
              ]

              text = (
                  text[:r0]
                  + summary_block
                  + "\n"
                  + render_block
                  + text[n0:]
              )

              print(
                  "FIXED renderSummary order"
              )


          # ========================================================
          # WRITE
          # ========================================================

          if text != original:

              src.write_text(
                  text,
                  encoding="utf-8"
              )

              print()
              print(
                  "SOURCE PATCH COMPLETE"
              )

          else:

              print()
              print(
                  "SOURCE ALREADY PATCHED"
              )


          # ========================================================
          # FINAL CHECK
          # ========================================================

          final = src.read_text(
              encoding="utf-8"
          )

          print()
          print("============================================================")
          print(" FINAL SOURCE CHECK")
          print("============================================================")

          checks = {

              "btn default action":
                  "action:()->Unit = {}" in final,

              "setFillViewport":
                  "setFillViewport(true)" in final,

              "pick TextView":
                  "onPick:(Int)->Unit):TextView" in final,

              "export when":
                  "exportType.startsWith(\"report:\")" in final,

              "Intent this.type":
                  'apply{this.type="image/*";' in final,
          }

          failed = False

          for name, ok in checks.items():

              print(
                  ("PASS" if ok else "FAIL")
                  + ": "
                  + name
              )

              if not ok:
                  failed = True


          if failed:

              raise SystemExit(
                  "ERROR: Required source fixes failed."
              )


          print()
          print(
              "ALL REQUIRED SOURCE CHECKS PASSED"
          )

          PY


      # ============================================================
      # 11. SOURCE AUDIT
      # ============================================================

      - name: Verify patched Kotlin source
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          SRC="$MAIN_ACTIVITY_SCREENS"

          echo "============================================================"
          echo " PATCHED SOURCE AUDIT"
          echo "============================================================"

          echo
          echo "SOURCE:"
          echo "$SRC"

          echo
          echo "BTN / PICK:"

          grep -n \
            -E \
            "fun MainActivity.btn|fun MainActivity.pick" \
            "$SRC" \
            || true

          echo
          echo "SCROLLVIEW:"

          grep -n \
            -E \
            "setFillViewport|fillViewport" \
            "$SRC" \
            || true

          echo
          echo "EXPORT:"

          grep -n \
            -A15 \
            -B4 \
            "openOutputStream" \
            "$SRC" \
            || true

          echo
          echo "RENDER FUNCTIONS:"

          grep -n \
            -E \
            "fun render\\(|fun renderSummary\\(" \
            "$SRC" \
            || true


      # ============================================================
      # 12. GRADLE VERSION
      # ============================================================

      - name: Verify Gradle
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " GRADLE"
          echo "============================================================"

          gradle --version


      # ============================================================
      # 13. CLEAN
      # ============================================================

      - name: Clean project
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " CLEAN"
          echo "============================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            clean


      # ============================================================
      # 14. COMPILE RELEASE KOTLIN
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " COMPILE RELEASE KOTLIN"
          echo "============================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseKotlin


      # ============================================================
      # 15. ASSEMBLE RELEASE
      # ============================================================

      - name: Assemble unsigned Release APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " ASSEMBLE RELEASE APK"
          echo "============================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

          echo
          echo "APK FILES:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ============================================================
      # 16. LOCATE APK
      # ============================================================

      - name: Locate release APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          APK=""

          if [[ -f \
            "app/build/outputs/apk/release/app-release-unsigned.apk"
          ]]; then

            APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          else

            APK="$(
              find app/build/outputs/apk/release \
                -type f \
                -name "*-unsigned.apk" \
                -print \
                | head -n 1
            )"

          fi


          if [[ -z "$APK" ]]; then

            APK="$(
              find app/build/outputs/apk/release \
                -type f \
                -name "*.apk" \
                -print \
                | head -n 1
            )"

          fi


          if [[ -z "$APK" ]]; then

            echo "ERROR: APK not found."

            find app/build/outputs/apk \
              -type f \
              -print \
              || true

            exit 1

          fi


          echo "RELEASE_APK=$APK" \
            >> "$GITHUB_ENV"

          echo
          echo "RELEASE APK:"
          echo "$APK"

          ls -lh "$APK"


      # ============================================================
      # 17. VERIFY PACKAGE / VERSION
      # ============================================================

      - name: Verify APK package and version
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          echo "============================================================"
          echo " APK VALIDATION"
          echo "============================================================"

          BADGING="$(
            "$AAPT" \
              dump badging \
              "$RELEASE_APK"
          )"

          echo "$BADGING" \
            | grep -E \
              "package: name=|versionCode=|versionName="


          echo "$BADGING" \
            | grep -q \
              "name='${PACKAGE_NAME}'" \
            || {
              echo "ERROR: Package mismatch."
              exit 1
            }


          echo "$BADGING" \
            | grep -q \
              "versionCode='${VERSION_CODE}'" \
            || {
              echo "ERROR: VersionCode mismatch."
              exit 1
            }


          echo "$BADGING" \
            | grep -q \
              "versionName='${VERSION_NAME}'" \
            || {
              echo "ERROR: VersionName mismatch."
              exit 1
            }


          echo
          echo "APK PACKAGE/VERSION PASSED"


      # ============================================================
      # 18. PREPARE SIGNING
      # ============================================================

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " SIGNING"
          echo "============================================================"


          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "ERROR: KEYSTORE_BASE64 secret missing."
            exit 1
          fi


          if [[ -z "${KEYSTORE_PASSWORD:-}" ]]; then
            echo "ERROR: KEYSTORE_PASSWORD secret missing."
            exit 1
          fi


          if [[ -z "${KEY_ALIAS:-}" ]]; then
            echo "ERROR: KEY_ALIAS secret missing."
            exit 1
          fi


          if [[ -z "${KEY_PASSWORD:-}" ]]; then
            echo "ERROR: KEY_PASSWORD secret missing."
            exit 1
          fi


          SIGN_DIR="$RUNNER_TEMP/release-signing"

          mkdir -p "$SIGN_DIR"


          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$SIGN_DIR/release.keystore"


          test -s \
            "$SIGN_DIR/release.keystore"


          echo "KEYSTORE_PATH=$SIGN_DIR/release.keystore" \
            >> "$GITHUB_ENV"


          echo "KEYSTORE READY"


      # ============================================================
      # 19. ZIPALIGN
      # ============================================================

      - name: Zipalign release APK
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          mkdir -p \
            "$RUNNER_TEMP/apk"


          ALIGNED="$RUNNER_TEMP/apk/Majdoor-Hisaab-PRO-${VERSION_NAME}-aligned.apk"


          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$ANDROID_PROJECT_ROOT/$RELEASE_APK" \
            "$ALIGNED"


          test -s "$ALIGNED"


          echo "ZIPALIGNED_APK=$ALIGNED" \
            >> "$GITHUB_ENV"


          echo
          echo "ZIPALIGN PASSED"

          ls -lh "$ALIGNED"


      # ============================================================
      # 20. SIGN APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          SIGNED="$RUNNER_TEMP/apk/Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"


          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$SIGNED" \
            "$ZIPALIGNED_APK"


          test -s "$SIGNED"


          echo "SIGNED_APK=$SIGNED" \
            >> "$GITHUB_ENV"


          echo
          echo "APK SIGNED"

          ls -lh "$SIGNED"


      # ============================================================
      # 21. VERIFY SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          echo "============================================================"
          echo " SIGNATURE VERIFICATION"
          echo "============================================================"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$SIGNED_APK"


          echo
          echo "APK SIGNATURE VERIFIED"


      # ============================================================
      # 22. FINAL APK VALIDATION
      # ============================================================

      - name: Final APK validation
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          echo "============================================================"
          echo " FINAL APK"
          echo "============================================================"

          "$AAPT" \
            dump badging \
            "$SIGNED_APK" \
            | grep -E \
              "package: name=|versionCode=|versionName="


          echo
          echo "APK SIZE:"

          ls -lh \
            "$SIGNED_APK"


          echo
          echo "SHA256:"

          sha256sum \
            "$SIGNED_APK"


      # ============================================================
      # 23. FINAL ARTIFACT
      # ============================================================

      - name: Prepare final release artifact
        shell: bash
        run: |
          set -euo pipefail

          FINAL_DIR="$GITHUB_WORKSPACE/final-release"

          mkdir -p \
            "$FINAL_DIR"


          FINAL_APK="$FINAL_DIR/Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"


          cp \
            "$SIGNED_APK" \
            "$FINAL_APK"


          sha256sum \
            "$FINAL_APK" \
            > "$FINAL_DIR/SHA256SUMS.txt"


          echo "============================================================"
          echo " FINAL RELEASE"
          echo "============================================================"

          ls -lh \
            "$FINAL_DIR"


          echo
          cat \
            "$FINAL_DIR/SHA256SUMS.txt"


      # ============================================================
      # 24. UPLOAD APK
      # ============================================================

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-${{ env.VERSION_NAME }}-Release-Signed
          path: |
            final-release/Majdoor-Hisaab-PRO-${{ env.VERSION_NAME }}-Release-Signed.apk
            final-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 25. FINAL SUCCESS
      # ============================================================

      - name: Final release verification
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo
          echo "   MAJDOOR HISAAB PRO"
          echo "   FINAL SIGNED RELEASE APK"
          echo
          echo "============================================================"
          echo

          echo "Package     : ${PACKAGE_NAME}"
          echo "Version     : ${VERSION_NAME}"
          echo "VersionCode : ${VERSION_CODE}"
          echo "Android API : ${ANDROID_API}"
          echo "Build Tools : ${BUILD_TOOLS}"
          echo "Java        : ${JAVA_VERSION}"
          echo "Gradle      : ${GRADLE_VERSION}"

          echo
          echo "APK:"
          echo "Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"

          echo
          echo "SHA256:"
          cat \
            final-release/SHA256SUMS.txt

          echo
          echo "============================================================"
          echo " BUILD COMPLETED SUCCESSFULLY"
          echo "============================================================"
