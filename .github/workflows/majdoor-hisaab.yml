name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_CODE: "82"
  VERSION_NAME: "1.82.0"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build, Sign and Verify Release APK

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # 4. LOCATE ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          echo "Searching Android SDK..."

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && \
               [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -n "${ANDROID_HOME:-}" ] && \
               [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"

          else
            SDKMANAGER_FOUND="$(command -v sdkmanager || true)"

            if [ -z "$SDKMANAGER_FOUND" ]; then
              echo "::error::Android SDK and sdkmanager were not found."
              exit 1
            fi

            SDK_ROOT="$(
              dirname \
              "$(dirname \
              "$(dirname \
              "$(readlink -f "$SDKMANAGER_FOUND")")")"
            )"
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT"

          test -d "$SDK_ROOT"

          echo
          echo "SDK directory:"
          ls -la "$SDK_ROOT"


      # ============================================================
      # 5. LOCATE SDKMANAGER
      # ============================================================

      - name: Locate sdkmanager
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"

          else
            SDKMANAGER="$(
              find "$ANDROID_SDK_ROOT/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -print \
                -quit \
                2>/dev/null || true
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then

            echo "::error::sdkmanager not found."

            echo
            echo "Searching Android SDK:"
            find "$ANDROID_SDK_ROOT" \
              -type f \
              -name sdkmanager \
              -print || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 6. ACCEPT ANDROID LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Android SDK licenses accepted."


      # ============================================================
      # 7. INSTALL ANDROID API 36 + BUILD TOOLS
      # ============================================================

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -e

          echo "Installing required Android packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo
          echo "Installed Android platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms"

          echo
          echo "Installed Build Tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"


      # ============================================================
      # 8. VERIFY ANDROID BUILD TOOLS
      # ============================================================

      - name: Verify Android build tools
        shell: bash
        run: |
          set -e

          AAPT2="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          echo "Checking AAPT2..."

          test -x "$AAPT2"

          "$AAPT2" version


          echo
          echo "Checking APKSIGNER..."

          test -x "$APKSIGNER"

          "$APKSIGNER" --version


          echo
          echo "Checking ZIPALIGN..."

          test -x "$ZIPALIGN"

          ls -lh "$ZIPALIGN"


          echo
          echo "Android build tools verification PASSED."


      # ============================================================
      # 9. VERIFY JAVA
      # ============================================================

      - name: Verify Java
        shell: bash
        run: |
          set -e

          java -version

          echo
          echo "JAVA_HOME=$JAVA_HOME"


      # ============================================================
      # 10. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          gradle --version


      # ============================================================
      # 11. SHOW REPOSITORY
      # ============================================================

      - name: Show repository files
        shell: bash
        run: |
          set -e

          echo "Repository:"
          pwd

          echo
          echo "Top-level files:"

          find . \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -300


      # ============================================================
      # 12. FIND MAJDOOR HISAAB ZIP
      # ============================================================

      - name: Locate Majdoor Hisaab ZIP
        shell: bash
        run: |
          set -e

          ZIP_PATH=""

          ZIP_PATH="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "Majdoor_Hisaab_PRO*.zip" \
              -print \
              | head -n 1
          )"

          if [ -z "$ZIP_PATH" ]; then

            echo "::error::Majdoor Hisaab PRO ZIP not found."

            echo
            echo "Available ZIP files:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print || true

            exit 1
          fi

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

          echo
          echo "FOUND ZIP:"
          echo "$ZIP_PATH"


      # ============================================================
      # 13. PREPARE BUILD DIRECTORY
      # ============================================================

      - name: Prepare temporary build directory
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/majdoor-build"

          mkdir -p "$RUNNER_TEMP/majdoor-build"

          echo "BUILD_ROOT=$RUNNER_TEMP/majdoor-build" >> "$GITHUB_ENV"

          echo
          echo "BUILD_ROOT:"
          echo "$RUNNER_TEMP/majdoor-build"


      # ============================================================
      # 14. EXTRACT PROJECT ZIP
      # ============================================================

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          echo "Extracting:"
          echo "$ZIP_PATH"

          unzip -q "$ZIP_PATH" \
            -d "$BUILD_ROOT"

          echo
          echo "ZIP extracted successfully."

          echo
          echo "Extracted structure:"

          find "$BUILD_ROOT" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -500


      # ============================================================
      # 15. LOCATE GRADLE PROJECT ROOT
      # ============================================================

      - name: Locate Gradle project root
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=""

          SETTINGS_FILE="$(
            find "$BUILD_ROOT" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print \
              | head -n 1
          )"

          if [ -z "$SETTINGS_FILE" ]; then

            echo "::error::settings.gradle.kts or settings.gradle not found."

            echo
            echo "Build directory contents:"

            find "$BUILD_ROOT" \
              -maxdepth 6 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo
          echo "GRADLE PROJECT ROOT:"
          echo "$PROJECT_ROOT"


      # ============================================================
      # 16. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "Project:"
          echo "$PROJECT_ROOT"


          if [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_ROOT/settings.gradle" ]; then

            echo "::error::Gradle settings file missing."

            exit 1
          fi


          if [ ! -f "$PROJECT_ROOT/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_ROOT/build.gradle" ]; then

            echo "::error::Root Gradle build file missing."

            exit 1
          fi


          if [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_ROOT/app/build.gradle" ]; then

            echo "::error::App Gradle build file missing."

            exit 1
          fi


          test -f \
            "$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"


          echo
          echo "Android project structure PASSED."


      # ============================================================
      # 17. VERIFY KOTLIN SOURCE
      # ============================================================

      - name: Verify Kotlin source
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          echo "Checking:"
          echo "$MAIN"

          test -f "$MAIN"


          grep -q "fun validDate" "$MAIN"

          grep -q "BackHandler" "$MAIN"

          grep -q "PhotoThumb" "$MAIN"

          grep -q "AttendanceScreen" "$MAIN"

          grep -q "DeviceCredentialDeleteGate" "$MAIN"

          grep -q "Stat" "$MAIN"

          grep -q "money" "$MAIN"


          echo
          echo "Required Kotlin source checks PASSED."


      # ============================================================
      # 18. VERIFY PAYMENT + CROP CLEANUP
      # ============================================================

      - name: Verify payment and crop cleanup
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"


          grep -q \
            'payments=payments.filterNot{it.cropId==id}' \
            "$MAIN"


          grep -q \
            'write("payment",payments,::obj)' \
            "$MAIN"


          if grep -q \
            '||field.isBlank()) return@Button' \
            "$MAIN"; then

            echo "::error::Old mandatory field validation still exists."

            exit 1
          fi


          echo
          echo "Payment/crop cleanup fix PASSED."


      # ============================================================
      # 19. VERIFY PACKAGE + VERSION
      # ============================================================

      - name: Verify package and version
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "Checking:"
          echo "$APP_GRADLE"


          test -f "$APP_GRADLE"


          echo
          echo "Application ID:"
          grep -n "applicationId" "$APP_GRADLE" || true


          echo
          echo "Version Code:"
          grep -n "versionCode" "$APP_GRADLE" || true


          echo
          echo "Version Name:"
          grep -n "versionName" "$APP_GRADLE" || true


          # ========================================================
          # APPLICATION ID
          # ========================================================

          grep -Eq \
            'applicationId[[:space:]]*=[[:space:]]*"com\.majdoor\.hisaabpro"' \
            "$APP_GRADLE"


          # ========================================================
          # VERSION CODE
          # ========================================================

          grep -Eq \
            'versionCode[[:space:]]*=[[:space:]]*82([[:space:]]|$)' \
            "$APP_GRADLE"


          # ========================================================
          # VERSION NAME
          # ========================================================

          grep -Eq \
            'versionName[[:space:]]*=[[:space:]]*"1\.82\.0"' \
            "$APP_GRADLE"


          echo
          echo "=============================================="
          echo "PACKAGE / VERSION VERIFICATION PASSED"
          echo "=============================================="

          echo "Package      : com.majdoor.hisaabpro"
          echo "Version Code : 82"
          echo "Version Name : 1.82.0"


      # ============================================================
      # 20. CONFIGURE ANDROID SDK FOR GRADLE
      # ============================================================

      - name: Configure Android SDK for Gradle
        shell: bash
        run: |
          set -e

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" \
            > "$PROJECT_ROOT/local.properties"

          echo
          echo "local.properties:"

          cat "$PROJECT_ROOT/local.properties"


      # ============================================================
      # 21. GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 22. BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info


      # ============================================================
      # 23. LOCATE RELEASE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          APK_PATH="$(
            find "$PROJECT_ROOT/app/build/outputs/apk/release" \
              -type f \
              -name "*.apk" \
              -print \
              | head -n 1
          )"


          if [ -z "$APK_PATH" ]; then

            echo "::error::Release APK was not generated."

            echo
            echo "Available APK files:"

            find "$PROJECT_ROOT/app/build/outputs" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi


          echo "APK_UNSIGNED_PATH=$APK_PATH" >> "$GITHUB_ENV"


          echo
          echo "RELEASE APK:"
          echo "$APK_PATH"


      # ============================================================
      # 24. PREPARE APK DIRECTORY
      # ============================================================

      - name: Prepare APK directory
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk"

          mkdir -p "$RUNNER_TEMP/apk"


          cp "$APK_UNSIGNED_PATH" \
            "$RUNNER_TEMP/apk/$APK_UNSIGNED_NAME"


          echo
          echo "Unsigned APK:"

          ls -lh "$RUNNER_TEMP/apk"


      # ============================================================
      # 25. GENERATE TEMPORARY SIGNING KEY
      # ============================================================

      - name: Generate temporary signing keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$RUNNER_TEMP/majdoor-release-key.p12"


          keytool \
            -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -alias majdoor_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=Majdoor Hisaab PRO, OU=Release, O=Majdoor Hisaab PRO, L=India, ST=Uttar Pradesh, C=IN"


          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

          echo "KEY_ALIAS=majdoor_release" >> "$GITHUB_ENV"


          echo
          echo "Temporary signing keystore created."


      # ============================================================
      # 26. ZIPALIGN APK
      # ============================================================

      - name: Align APK
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"


          test -x "$ZIPALIGN"


          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            "$RUNNER_TEMP/apk/$APK_UNSIGNED_NAME" \
            "$RUNNER_TEMP/apk/aligned.apk"


          echo
          echo "APK alignment completed."


      # ============================================================
      # 27. SIGN RELEASE APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"


          test -x "$APKSIGNER"


          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --ks-key-alias "$KEY_ALIAS" \
            --min-sdk-version 23 \
            --max-sdk-version 36 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RUNNER_TEMP/apk/$APK_SIGNED_NAME" \
            "$RUNNER_TEMP/apk/aligned.apk"


          echo
          echo "APK SIGNING PASSED."


      # ============================================================
      # 28. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"


          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$RUNNER_TEMP/apk/$APK_SIGNED_NAME"


          echo
          echo "SIGNATURE VERIFICATION PASSED."


      # ============================================================
      # 29. VERIFY APK ALIGNMENT
      # ============================================================

      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"


          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            "$RUNNER_TEMP/apk/$APK_SIGNED_NAME"


          echo
          echo "ALIGNMENT VERIFICATION PASSED."


      # ============================================================
      # 30. VERIFY FINAL APK PACKAGE + VERSION
      # ============================================================

      - name: Verify final APK package and version
        shell: bash
        run: |
          set -e

          AAPT2="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"

          APK="$RUNNER_TEMP/apk/$APK_SIGNED_NAME"


          test -f "$APK"


          "$AAPT2" dump badging "$APK" \
            > "$RUNNER_TEMP/apk/badging.txt"


          echo
          echo "APK BADGING:"

          cat "$RUNNER_TEMP/apk/badging.txt"


          grep -q \
            "package: name='${PACKAGE_NAME}'" \
            "$RUNNER_TEMP/apk/badging.txt"


          grep -q \
            "versionCode='${VERSION_CODE}'" \
            "$RUNNER_TEMP/apk/badging.txt"


          grep -q \
            "versionName='${VERSION_NAME}'" \
            "$RUNNER_TEMP/apk/badging.txt"


          echo
          echo "PACKAGE VERIFIED:"
          echo "$PACKAGE_NAME"


          echo
          echo "VERSION CODE VERIFIED:"
          echo "$VERSION_CODE"


          echo
          echo "VERSION NAME VERIFIED:"
          echo "$VERSION_NAME"


          echo
          echo "FINAL APK VERIFICATION PASSED."


      # ============================================================
      # 31. CREATE BUILD REPORT
      # ============================================================

      - name: Create build report
        shell: bash
        run: |
          set -e

          REPORT="$RUNNER_TEMP/apk/BUILD-REPORT.txt"


          {
            echo "=============================================="
            echo "        MAJDOOR HISAAB PRO V82"
            echo "        FINAL SIGNED RELEASE BUILD"
            echo "=============================================="
            echo

            echo "Package      : ${PACKAGE_NAME}"
            echo "Version Code : ${VERSION_CODE}"
            echo "Version Name : ${VERSION_NAME}"

            echo

            echo "Java         : ${JAVA_VERSION}"
            echo "Gradle       : ${GRADLE_VERSION}"
            echo "Android API  : ${ANDROID_API}"
            echo "Build Tools  : ${BUILD_TOOLS}"

            echo

            echo "APK          : ${APK_SIGNED_NAME}"

            echo

            echo "----------------------------------------------"
            echo "BUILD CHECKS"
            echo "----------------------------------------------"

            echo "Android SDK              : PASS"
            echo "Android API 36           : PASS"
            echo "Build Tools 36.0.0       : PASS"
            echo "Java 17                  : PASS"
            echo "Gradle 8.11.1            : PASS"
            echo "Project structure        : PASS"
            echo "Kotlin source            : PASS"
            echo "Payment cleanup          : PASS"
            echo "Package verification     : PASS"
            echo "Version verification     : PASS"
            echo "Gradle clean             : PASS"
            echo "Release compilation      : PASS"
            echo "APK generation           : PASS"
            echo "APK alignment            : PASS"
            echo "APK signing              : PASS"
            echo "Signature verification   : PASS"
            echo "Final APK verification   : PASS"

            echo

            echo "=============================================="
            echo "              BUILD SUCCESS"
            echo "=============================================="

          } > "$REPORT"


          cat "$REPORT"


      # ============================================================
      # 32. UPLOAD FINAL SIGNED APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED
          path: |
            ${{ runner.temp }}/apk/${{ env.APK_SIGNED_NAME }}
            ${{ runner.temp }}/apk/BUILD-REPORT.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 33. FINAL SUMMARY
      # ============================================================

      - name: Final build summary
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo "       MAJDOOR HISAAB PRO V82"
          echo "       FINAL BUILD SUCCESS"
          echo "=============================================="

          echo

          echo "APK:"
          ls -lh "$RUNNER_TEMP/apk/$APK_SIGNED_NAME"

          echo

          echo "Artifact:"
          echo "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED"

          echo

          echo "Package:"
          echo "$PACKAGE_NAME"

          echo

          echo "Version:"
          echo "$VERSION_NAME ($VERSION_CODE)"

          echo

          echo "=============================================="


      # ============================================================
      # 34. CLEAN TEMPORARY SIGNING MATERIAL
      # ============================================================

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/majdoor-release-key.p12" || true

          rm -f "$RUNNER_TEMP/apk/aligned.apk" || true

          rm -f "$RUNNER_TEMP/apk/$APK_UNSIGNED_NAME" || true

          echo
          echo "Temporary signing material cleaned."
