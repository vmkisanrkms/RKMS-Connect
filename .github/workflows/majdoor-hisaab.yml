name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-KOTLIN-FIXED.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # IMPORTANT:
      # No Gradle cache here because the Android project is inside
      # the V82 ZIP and is extracted later.
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. INSTALL ANDROID SDK 36
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK installation completed."

          echo ""
          echo "Installed components:"
          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-36|build-tools;36.0.0" || true


      # ============================================================
      # 5. SETUP GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # 6. VERIFY V82 ZIP
      # ============================================================

      - name: Verify V82 ZIP
        shell: bash
        run: |
          set -e

          echo "Checking V82 ZIP..."

          if [ ! -f "$ZIP_NAME" ]; then
            echo ""
            echo "ERROR: V82 ZIP was not found."
            echo ""
            echo "Expected:"
            echo "$ZIP_NAME"
            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo ""
          echo "V82 ZIP FOUND:"
          ls -lh "$ZIP_NAME"

          echo ""
          echo "ZIP CONTENTS:"
          unzip -l "$ZIP_NAME" | head -150


      # ============================================================
      # 7. EXTRACT V82 PROJECT
      # ============================================================

      - name: Extract V82 Project
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_NAME" -d build_source

          echo ""
          echo "V82 ZIP extracted successfully."

          echo ""
          echo "Searching for Gradle project..."

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: Gradle settings file not found."

            echo ""
            echo "Extracted files:"
            find build_source -maxdepth 6 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project structure:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -250


      # ============================================================
      # 8. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project root:"
          ls -la

          if [ ! -d "app" ]; then
            echo ""
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo ""
            echo "ERROR: app Gradle build file not found."
            exit 1
          fi

          echo ""
          echo "Android app module verified successfully."


      # ============================================================
      # 9. VERIFY MAIN SOURCE
      # ============================================================

      - name: Verify Package and Source
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Searching for MainActivityScreens.kt..."

          SRC=$(find app/src/main \
            -name "MainActivityScreens.kt" \
            -print -quit || true)

          if [ -z "$SRC" ]; then
            echo ""
            echo "WARNING: MainActivityScreens.kt was not found."
          else
            echo ""
            echo "MainActivityScreens.kt:"
            echo "$SRC"

            echo ""
            echo "Source size:"
            wc -l "$SRC"
          fi

          echo ""
          echo "Checking package references..."

          grep -R \
            "com.majdoor.hisaab" \
            app/src/main \
            --include="*.kt" \
            --include="*.java" \
            --include="*.xml" \
            | head -40 || true


      # ============================================================
      # 10. V82 KOTLIN SOURCE AUDIT
      # NO SOURCE PATCHING
      # ============================================================

      - name: Audit V82 Kotlin Source
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=============================================="
          echo "V82 KOTLIN SOURCE AUDIT"
          echo "=============================================="

          FAILED=0

          echo ""
          echo "1. Checking old fillViewport assignment..."

          if grep -R -n \
            "fillViewport[[:space:]]*=" \
            app/src/main \
            --include="*.kt" \
            --include="*.java"; then

            echo ""
            echo "ERROR: Invalid fillViewport assignment found."
            echo "Expected: setFillViewport(true)"
            FAILED=1
          else
            echo "PASS"
          fi


          echo ""
          echo "2. Checking invalid btn lambda parameters..."

          if grep -R -n \
            -E 'btn\(.*\)\{[[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*->' \
            app/src/main \
            --include="*.kt"; then

            echo ""
            echo "ERROR: Invalid btn lambda parameter detected."
            echo "btn() action must be () -> Unit."
            FAILED=1
          else
            echo "PASS"
          fi


          echo ""
          echo "3. Checking lateinit Button workaround..."

          if grep -R -n \
            -E 'lateinit[[:space:]]+var[[:space:]].*:[[:space:]]*Button' \
            app/src/main \
            --include="*.kt"; then

            echo ""
            echo "ERROR: Invalid lateinit Button workaround detected."
            FAILED=1
          else
            echo "PASS"
          fi


          echo ""
          echo "4. Checking old exportType when condition..."

          if grep -R -n \
            -A3 \
            'when(exportType)' \
            app/src/main \
            --include="*.kt"; then

            echo ""
            echo "ERROR: Old when(exportType) pattern found."
            echo "Expected conditional when { ... }."
            FAILED=1
          else
            echo "PASS"
          fi


          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "=============================================="
            echo "V82 SOURCE AUDIT FAILED"
            echo "=============================================="
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "V82 SOURCE AUDIT PASSED"
          echo "=============================================="


      # ============================================================
      # 11. JAVA / GRADLE ENVIRONMENT
      # ============================================================

      - name: Gradle Environment
        shell: bash
        run: |
          set -e

          echo "JAVA VERSION"
          java -version

          echo ""
          echo "GRADLE VERSION"
          gradle --version

          echo ""
          echo "ANDROID SDK"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID SDK PLATFORM"
          ls -ld "$ANDROID_HOME/platforms/android-36"

          echo ""
          echo "ANDROID BUILD TOOLS"
          ls -ld "$ANDROID_HOME/build-tools/36.0.0"


      # ============================================================
      # 12. CLEAN PROJECT
      # ============================================================

      - name: Clean Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Cleaning project..."

          gradle \
            --no-daemon \
            --stacktrace \
            clean

          echo ""
          echo "CLEAN PASSED."


      # ============================================================
      # 13. COMPILE RELEASE KOTLIN
      # THIS IS THE IMPORTANT TEST
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --rerun-tasks \
            :app:compileReleaseKotlin

          echo ""
          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN PASSED"
          echo "=============================================="


      # ============================================================
      # 14. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ASSEMBLE RELEASE APK"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --rerun-tasks \
            :app:assembleRelease

          echo ""
          echo "=============================================="
          echo "RELEASE APK BUILD PASSED"
          echo "=============================================="


      # ============================================================
      # 15. LOCATE RELEASE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          echo "Searching for release APK..."

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*release*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "RELEASE APK:"
          ls -lh "$APK"


      # ============================================================
      # 16. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK Package
        shell: bash
        run: |
          set -e

          APK="$APK_PATH"

          echo "APK:"
          ls -lh "$APK"

          echo ""
          echo "APK BADGING:"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            dump badging "$APK" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging "$APK"
          )

          echo ""
          echo "Checking expected package..."

          if ! echo "$BADGING" | grep -q \
            "name='$PACKAGE_NAME'"; then

            echo ""
            echo "ERROR: Package name mismatch."
            echo "Expected: $PACKAGE_NAME"
            exit 1
          fi

          echo "Package name verified."


      # ============================================================
      # 17. RESTORE KEYSTORE
      # ============================================================

      - name: Restore Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo ""
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo ""
            echo "ERROR: Release keystore is empty."
            exit 1
          fi

          echo "Release keystore restored successfully."

          ls -lh release-keystore.jks


      # ============================================================
      # 18. ZIPALIGN BEFORE SIGNING
      # IMPORTANT
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -e

          INPUT_APK="$APK_PATH"

          ALIGNED_APK="$RUNNER_TEMP/$APK_UNSIGNED_NAME"

          echo "=============================================="
          echo "ZIPALIGN RELEASE APK"
          echo "=============================================="

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          if [ ! -f "$ALIGNED_APK" ]; then
            echo ""
            echo "ERROR: Zipaligned APK was not created."
            exit 1
          fi

          echo ""
          echo "Checking zip alignment..."

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c \
            -v \
            4 \
            "$ALIGNED_APK"

          echo ""
          echo "ZIPALIGN PASSED."

          echo "ALIGNED_APK=$ALIGNED_APK" >> "$GITHUB_ENV"


      # ============================================================
      # 19. SIGN ALIGNED APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          ALIGNED_APK="$ALIGNED_APK"
          SIGNED_APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "=============================================="
          echo "SIGNING RELEASE APK"
          echo "=============================================="

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks release-keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          if [ ! -f "$SIGNED_APK" ]; then
            echo ""
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          echo ""
          echo "SIGNED APK CREATED:"
          ls -lh "$SIGNED_APK"


      # ============================================================
      # 20. VERIFY SIGNATURE
      # ============================================================

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          echo "=============================================="
          echo "VERIFY APK SIGNATURE"
          echo "=============================================="

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "=============================================="
          echo "APK SIGNATURE VERIFIED"
          echo "=============================================="


      # ============================================================
      # 21. FINAL APK VALIDATION
      # ============================================================

      - name: Final APK Validation
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR: Final APK does not exist."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          echo "Final APK size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo ""
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi

          echo ""
          echo "Final APK:"
          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "Final APK validation PASSED."


      # ============================================================
      # 22. UPLOAD FINAL SIGNED APK
      # ============================================================

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: ${{ env.APK_SIGNED_NAME }}
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 23. UPLOAD BUILD REPORTS
      # ============================================================

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/**
          if-no-files-found: warn
          retention-days: 14
