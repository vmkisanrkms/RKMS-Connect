name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_CODE: "82"
  VERSION_NAME: "1.82.0"

  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_GANNA_PARCHI_BACKUP_APPLOCK_FINAL_V18_REFERENCE_UI_FIXED_V4_FINAL_FIXED_V3.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build, Sign and Verify Release APK

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ============================================================
      # 4. LOCATE ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"

          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"

          else
            echo "::error::Android SDK not found."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f \
            -name sdkmanager \
            -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" \
              -type f \
              -path '*/bin/sdkmanager' \
              -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK: $SDK_ROOT"
          echo "SDK Manager: $SDKMANAGER"


      # ============================================================
      # 5. INSTALL ANDROID API 36
      # ============================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}"
          test -d "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          echo "Android API ${ANDROID_API}: PASS"
          echo "Build Tools ${BUILD_TOOLS}: PASS"


      # ============================================================
      # 6. VERIFY ANDROID TOOLS
      # ============================================================

      - name: Verify Android tools
        shell: bash
        run: |
          set -euo pipefail

          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"
          test -x "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          echo "Android tools verification: PASS"


      # ============================================================
      # 7. VERIFY JAVA AND GRADLE
      # ============================================================

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version


      # ============================================================
      # 8. LOCATE SOURCE ZIP
      # ============================================================

      - name: Locate Fixed V18 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH=""

          if [ -f "$GITHUB_WORKSPACE/${ZIP_NAME}" ]; then
            ZIP_PATH="$GITHUB_WORKSPACE/${ZIP_NAME}"
          else
            ZIP_PATH="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name "$ZIP_NAME" \
              -print -quit || true)"
          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Source ZIP not found."
            echo "Expected:"
            echo "$ZIP_NAME"

            echo ""
            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print || true

            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"

          echo "Source ZIP:"
          echo "$ZIP_PATH"


      # ============================================================
      # 9. VERIFY ZIP
      # ============================================================

      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$PROJECT_ZIP"


      # ============================================================
      # 10. EXTRACT PROJECT
      # ============================================================

      - name: Extract Fixed V18 project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_ROOT="$RUNNER_TEMP/majdoor-v18-project"

          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"

          unzip -q "$PROJECT_ZIP" -d "$EXTRACT_ROOT"

          echo "EXTRACT_ROOT=$EXTRACT_ROOT" >> "$GITHUB_ENV"

          echo "Project extraction: PASS"


      # ============================================================
      # 11. LOCATE ANDROID PROJECT ROOT
      # ============================================================

      - name: Locate Android project root
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find "$EXTRACT_ROOT" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print -quit || true
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle(.kts) not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$PROJECT_ROOT"


      # ============================================================
      # 12. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_ROOT/settings.gradle" ]; then
            echo "::error::settings.gradle(.kts) not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_ROOT/build.gradle" ]; then
            echo "::error::Root build.gradle(.kts) not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_ROOT/app/build.gradle" ]; then
            echo "::error::app build.gradle(.kts) not found."
            exit 1
          fi

          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          test -f "$PROJECT_ROOT/app/src/main/res/xml/backup_rules.xml"

          test -f "$PROJECT_ROOT/app/src/main/res/xml/data_extraction_rules.xml"

          echo "Android project structure: PASS"


      # ============================================================
      # 13. REPAIR KNOWN KOTLIN COMPILE ERROR
      # ============================================================

      - name: Repair known Kotlin compile error
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          test -f "$MAIN"

          echo "================================================"
          echo "CHECKING KNOWN KOTLIN COMPILE ERROR"
          echo "================================================"

          BROKEN_COUNT="$(
            grep -F \
              'PaddingValues(horizontal=14.dp,bottom=16.dp)' \
              "$MAIN" |
            wc -l |
            tr -d ' '
          )"

          echo "Broken PaddingValues occurrences: $BROKEN_COUNT"

          if [ "$BROKEN_COUNT" -gt 0 ]; then

            python3 -c 'import sys; from pathlib import Path; p=Path(sys.argv[1]); t=p.read_text(encoding="utf-8"); old="PaddingValues(horizontal=14.dp,bottom=16.dp)"; new="PaddingValues(start=14.dp,end=14.dp,bottom=16.dp)"; n=t.count(old); p.write_text(t.replace(old,new),encoding="utf-8"); print("Fixed occurrences:",n)' "$MAIN"

          fi

          if grep -Fq \
            'PaddingValues(horizontal=14.dp,bottom=16.dp)' \
            "$MAIN"; then

            echo "::error::Invalid PaddingValues expression still exists."
            exit 1
          fi

          echo "PaddingValues compile repair: PASS"

          echo "Correct PaddingValues occurrences:"
          grep -n \
            'PaddingValues(start=14.dp,end=14.dp,bottom=16.dp)' \
            "$MAIN" || true


      # ============================================================
      # 14. COMPLETE KOTLIN SOURCE AUDIT
      # ============================================================

      - name: Audit Kotlin source
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          test -f "$MAIN"

          echo "================================================"
          echo "KOTLIN SOURCE AUDIT"
          echo "================================================"

          if ! grep -Eq \
            '^package[[:space:]]+com\.majdoor\.hisaabpro[[:space:]]*$' \
            "$MAIN"; then

            echo "::error::Wrong Kotlin package."
            exit 1
          fi

          echo "Package: PASS"

          if ! grep -Eq \
            '^import[[:space:]]+androidx\.compose\.runtime\.saveable\.rememberSaveable[[:space:]]*$' \
            "$MAIN"; then

            echo "::error::rememberSaveable import missing."
            exit 1
          fi

          echo "rememberSaveable import: PASS"

          REMEMBER_COUNT="$(
            grep -o \
              'rememberSaveable' \
              "$MAIN" |
            wc -l |
            tr -d ' '
          )"

          if [ "$REMEMBER_COUNT" -lt 2 ]; then
            echo "::error::rememberSaveable usage missing."
            exit 1
          fi

          echo "rememberSaveable usage: PASS"
          echo "rememberSaveable occurrences: $REMEMBER_COUNT"

          if ! grep -Eq \
            '^import[[:space:]]+androidx\.compose\.ui\.Alignment[[:space:]]*$' \
            "$MAIN"; then

            echo "::error::Alignment import missing."
            exit 1
          fi

          echo "Alignment import: PASS"

          COLUMN_COUNT="$(
            grep -Eo \
              'Column[[:space:]]*\(' \
              "$MAIN" |
            wc -l |
            tr -d ' '
          )"

          if [ "$COLUMN_COUNT" -lt 1 ]; then
            echo "::error::Column usage missing."
            exit 1
          fi

          echo "Column usage: PASS"
          echo "Column occurrences: $COLUMN_COUNT"

          if ! grep -Eq \
            'horizontalAlignment[[:space:]]*=[[:space:]]*Alignment\.End' \
            "$MAIN"; then

            echo "::error::horizontalAlignment=Alignment.End missing."
            exit 1
          fi

          echo "Alignment.End: PASS"

          REQUIRED_SYMBOLS=(
            "fun validDate"
            "fun today"
            "fun money"
            "fun displayDate"
            "fun Stat"
            "fun DashboardStat"
            "fun DashboardModule"
            "fun LabourScreen"
            "fun FieldScreen"
            "fun CropScreen"
            "fun ExpenseScreen"
            "fun SaleScreen"
            "fun AttendanceScreen"
            "fun FieldDetail"
            "fun LabourDetail"
            "fun PaymentDialog"
            "fun RateDialog"
            "fun CropDetail"
            "exportReportPhoto"
            "exportReportPdf"
            "ExportButtons"
            "DeviceCredentialDeleteGate"
            "CaneParchiScreen"
            "CanePriceDialog"
            "CaneParchiDetail"
          )

          for SYMBOL in "${REQUIRED_SYMBOLS[@]}"; do

            if ! grep -Fq "$SYMBOL" "$MAIN"; then
              echo "::error::Missing source symbol: $SYMBOL"
              exit 1
            fi

            echo "$SYMBOL : PASS"

          done

          if grep -Fq \
            'import androidx.compose.runtime.rememberSaveable' \
            "$MAIN"; then

            echo "::error::Wrong rememberSaveable import found."
            exit 1
          fi

          echo "Wrong rememberSaveable import: NOT FOUND"

          if grep -Fq \
            'PaddingValues(horizontal=14.dp,bottom=16.dp)' \
            "$MAIN"; then

            echo "::error::Broken PaddingValues still found."
            exit 1
          fi

          echo "PaddingValues fix: PASS"

          LINE_COUNT="$(
            wc -l < "$MAIN" |
            tr -d ' '
          )"

          if [ "$LINE_COUNT" -lt 100 ]; then
            echo "::error::MainActivity.kt unexpectedly small."
            exit 1
          fi

          echo "Source lines: $LINE_COUNT"

          echo "================================================"
          echo "KOTLIN SOURCE AUDIT: PASS"
          echo "================================================"


      # ============================================================
      # 15. BACKUP XML
      # ============================================================

      - name: Verify backup XML
        shell: bash
        run: |
          set -euo pipefail

          BACKUP="$PROJECT_ROOT/app/src/main/res/xml/backup_rules.xml"
          EXTRA="$PROJECT_ROOT/app/src/main/res/xml/data_extraction_rules.xml"

          test -f "$BACKUP"
          test -f "$EXTRA"

          if grep -q 'domain="cache"' "$BACKUP"; then
            echo "::error::Invalid cache domain in backup_rules.xml"
            exit 1
          fi

          if grep -q 'domain="cache"' "$EXTRA"; then
            echo "::error::Invalid cache domain in data_extraction_rules.xml"
            exit 1
          fi

          echo "backup_rules.xml: PASS"
          echo "data_extraction_rules.xml: PASS"


      # ============================================================
      # 16. BACKUP CONFIGURATION
      # ============================================================

      - name: Verify backup configuration
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          grep -q \
            'android:allowBackup="true"' \
            "$MANIFEST"

          grep -q \
            'fullBackupContent="@xml/backup_rules"' \
            "$MANIFEST"

          grep -q \
            'dataExtractionRules="@xml/data_extraction_rules"' \
            "$MANIFEST"

          echo "Backup configuration: PASS"


      # ============================================================
      # 17. FILE PROVIDER
      # ============================================================

      - name: Verify FileProvider
        shell: bash
        run: |
          set -euo pipefail

          FILE_PATHS="$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"

          test -f "$FILE_PATHS"

          grep -q 'cache-path' "$FILE_PATHS"
          grep -q 'path="reports/"' "$FILE_PATHS"

          echo "FileProvider: PASS"


      # ============================================================
      # 18. REQUIRED SOURCE FEATURES
      # ============================================================

      - name: Verify required source features
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          for SYMBOL in \
            "fun validDate" \
            "fun today" \
            "fun money" \
            "fun displayDate" \
            "fun Stat" \
            "fun DashboardStat" \
            "fun DashboardModule" \
            "fun LabourScreen" \
            "fun FieldScreen" \
            "fun CropScreen" \
            "fun ExpenseScreen" \
            "fun SaleScreen" \
            "fun AttendanceScreen" \
            "fun FieldDetail" \
            "fun LabourDetail" \
            "fun PaymentDialog" \
            "fun RateDialog" \
            "fun CropDetail" \
            "exportReportPhoto" \
            "exportReportPdf" \
            "ExportButtons" \
            "DeviceCredentialDeleteGate" \
            "CaneParchiScreen" \
            "CanePriceDialog" \
            "CaneParchiDetail"; do

            if ! grep -Fq "$SYMBOL" "$MAIN"; then
              echo "::error::Required source feature missing: $SYMBOL"
              exit 1
            fi

          done

          echo "Required source features: PASS"


      # ============================================================
      # 19. PACKAGE / SDK
      # ============================================================

      - name: Verify package and Android SDK
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"

          grep -Eq \
            'applicationId[[:space:]]*=[[:space:]]*"com\.majdoor\.hisaabpro"' \
            "$APP_GRADLE"

          grep -Eq \
            'versionCode[[:space:]]*=[[:space:]]*82([[:space:]]|$)' \
            "$APP_GRADLE"

          grep -Eq \
            'versionName[[:space:]]*=[[:space:]]*"1\.82\.0"' \
            "$APP_GRADLE"

          grep -q 'compileSdk = 36' "$APP_GRADLE"
          grep -q 'targetSdk = 36' "$APP_GRADLE"
          grep -q 'minSdk = 23' "$APP_GRADLE"
          grep -q 'JavaVersion.VERSION_17' "$APP_GRADLE"

          echo "Package: ${PACKAGE_NAME}"
          echo "Version: ${VERSION_NAME}"
          echo "Version Code: ${VERSION_CODE}"
          echo "SDK configuration: PASS"


      # ============================================================
      # 20. ANDROID LOCAL PROPERTIES
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" \
            > "$PROJECT_ROOT/local.properties"

          echo "local.properties: PASS"


      # ============================================================
      # 21. SIGNING SECRETS
      # ============================================================

      - name: Verify signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

          echo "Signing secrets: PASS"


      # ============================================================
      # 22. PREPARE PERMANENT KEYSTORE
      # ============================================================

      - name: Prepare permanent production keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/majdoor-hisaab-pro-production.p12"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE"

          chmod 600 "$KEYSTORE"

          test -s "$KEYSTORE"

          keytool -list \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            >/dev/null

          CERT_SHA256="$(
            keytool -list -v \
              -storetype PKCS12 \
              -keystore "$KEYSTORE" \
              -storepass "$RELEASE_KEYSTORE_PASSWORD" \
              -alias "$RELEASE_KEY_ALIAS" |
            awk -F': ' \
              '/SHA256:/{print $2; exit}' |
            tr -d ' :\r\n' |
            tr '[:lower:]' '[:upper:]'
          )"

          test -n "$CERT_SHA256"

          echo "KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "PRODUCTION_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

          echo "Production keystore: PASS"
          echo "Production certificate: VERIFIED"


      # ============================================================
      # 23. GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 24. REAL KOTLIN / GRADLE BUILD
      # ============================================================

      - name: Build release APK with permanent signing key
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "STARTING REAL KOTLIN COMPILATION"
          echo "================================================"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

          echo "================================================"
          echo "GRADLE RELEASE BUILD: PASS"
          echo "================================================"


      # ============================================================
      # 25. LOCATE APK
      # ============================================================

      - name: Locate release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_ROOT/app/build/outputs/apk/release" \
              -type f \
              -name "*.apk" \
              -print -quit || true
          )"

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo "BUILT_APK=$APK" >> "$GITHUB_ENV"

          echo "APK:"
          echo "$APK"


      # ============================================================
      # 26. PREPARE FINAL APK
      # ============================================================

      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/final-release"

          cp "$BUILT_APK" \
            "$RUNNER_TEMP/final-release/${APK_SIGNED_NAME}"

          echo "FINAL_APK=$RUNNER_TEMP/final-release/${APK_SIGNED_NAME}" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 27. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$FINAL_APK"


      # ============================================================
      # 28. VERIFY PERMANENT CERTIFICATE
      # ============================================================

      - name: Verify permanent production certificate
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          EXPECTED="$(
            printf '%s' "$PRODUCTION_CERT_SHA256" |
            tr -d ' :\r\n' |
            tr '[:lower:]' '[:upper:]'
          )"

          ACTUAL="$(
            "$APKSIGNER" verify \
              --print-certs \
              "$FINAL_APK" 2>&1 |
            awk -F': ' \
              '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' |
            tr -d ' :\r\n' |
            tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read APK certificate."
            exit 1
          fi

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::APK certificate does not match production certificate."
            exit 1
          fi

          echo "Production certificate: PASS"


      # ============================================================
      # 29. VERIFY APK ALIGNMENT
      # ============================================================

      - name: Verify APK alignment
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          "$ZIPALIGN" \
            -c \
            -P 16 \
            4 \
            "$FINAL_APK"

          echo "APK alignment: PASS"


      # ============================================================
      # 30. VERIFY FINAL PACKAGE / VERSION
      # ============================================================

      - name: Verify final APK package and version
        shell: bash
        run: |
          set -euo pipefail

          AAPT2="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2"

          "$AAPT2" dump badging "$FINAL_APK" \
            > "$RUNNER_TEMP/badging.txt"

          grep -q \
            "package: name='${PACKAGE_NAME}'" \
            "$RUNNER_TEMP/badging.txt"

          grep -q \
            "versionCode='${VERSION_CODE}'" \
            "$RUNNER_TEMP/badging.txt"

          grep -q \
            "versionName='${VERSION_NAME}'" \
            "$RUNNER_TEMP/badging.txt"

          echo "Package verification: PASS"
          echo "Version verification: PASS"


      # ============================================================
      # 31. SHA256
      # ============================================================

      - name: Generate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$FINAL_APK" \
            > "$RUNNER_TEMP/final-release/SHA256SUMS.txt"

          cat "$RUNNER_TEMP/final-release/SHA256SUMS.txt"


      # ============================================================
      # 32. BUILD REPORT
      # ============================================================

      - name: Create build report
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/final-release/BUILD-REPORT.txt"

          printf '%s\n' \
            "Majdoor Hisaab PRO V82" \
            "" \
            "Package: ${PACKAGE_NAME}" \
            "Version: ${VERSION_NAME}" \
            "Version Code: ${VERSION_CODE}" \
            "Android API: ${ANDROID_API}" \
            "Build Tools: ${BUILD_TOOLS}" \
            "Java: ${JAVA_VERSION}" \
            "Gradle: ${GRADLE_VERSION}" \
            "Source ZIP: ${ZIP_NAME}" \
            "" \
            "Known Kotlin PaddingValues fix: VERIFIED" \
            "Kotlin source audit: VERIFIED" \
            "Kotlin compile: VERIFIED BY GRADLE" \
            "Backup XML: VERIFIED" \
            "Ganna Parchi: VERIFIED" \
            "Signing: PERMANENT PRODUCTION KEY" \
            "Certificate: VERIFIED" \
            "" \
            "Final status: SUCCESS" \
            > "$REPORT"

          cat "$REPORT"


      # ============================================================
      # 33. UPLOAD FINAL APK
      # ============================================================

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED
          path: |
            ${{ env.FINAL_APK }}
            ${{ runner.temp }}/final-release/BUILD-REPORT.txt
            ${{ runner.temp }}/final-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 34. FINAL SUCCESS
      # ============================================================

      - name: Final success
        run: |
          echo "================================================"
          echo "MAJDOOR HISAAB PRO V82"
          echo "FINAL SIGNED RELEASE BUILD SUCCESS"
          echo "================================================"
          echo "Package: ${PACKAGE_NAME}"
          echo "Version: ${VERSION_NAME}"
          echo "Version Code: ${VERSION_CODE}"
          echo "APK: ${APK_SIGNED_NAME}"
          echo "Source ZIP: ${ZIP_NAME}"
          echo "Kotlin Compile: PASS"
          echo "APK Signing: PASS"
          echo "APK Verification: PASS"
          echo "================================================"


      # ============================================================
      # 35. CLEANUP
      # ============================================================

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f "${KEYSTORE_FILE:-}" || true
