name: Build Final Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Final Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout V27 source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            src/gradle/wrapper/gradle-wrapper.properties
            src/*.gradle
            src/*.gradle.kts
            src/app/*.gradle
            src/app/*.gradle.kts

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify V27 project structure
        run: |
          set -euo pipefail

          test -f app/build.gradle.kts
          test -f app/src/main/java/com/majdoor/hisaab/MainActivity.kt
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f settings.gradle.kts
          test -f build.gradle.kts

      - name: Verify Gradle and V27 configuration
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --version | grep -q 'Gradle 8.11.1'

          grep -q 'compileSdk = 35' app/build.gradle.kts
          grep -q 'targetSdk = 35' app/build.gradle.kts
          grep -q 'versionCode = 30' app/build.gradle.kts
          grep -q 'versionName = "2.10"' app/build.gradle.kts
          grep -q 'JavaVersion.VERSION_17' app/build.gradle.kts
          grep -q 'jvmTarget = "17"' app/build.gradle.kts

      - name: Restore permanent release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

          test -s release.keystore

          {
            echo "releaseStoreFile=$GITHUB_WORKSPACE/src/release.keystore"
            echo "releaseStorePassword=$RELEASE_KEYSTORE_PASSWORD"
            echo "releaseKeyAlias=$RELEASE_KEY_ALIAS"
            echo "releaseKeyPassword=$RELEASE_KEY_PASSWORD"
          } >> gradle.properties

      - name: Clean previous outputs
        run: |
          set -euo pipefail
          ./gradlew clean --no-daemon

      - name: Build FINAL Release APK only
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify FINAL Release APK
        run: |
          set -euo pipefail

          APK=app/build/outputs/apk/release/app-release.apk

          test -s "$APK"
          unzip -t "$APK" >/dev/null

          test ! -f app/build/outputs/apk/debug/app-debug.apk
          test ! -d app/build/outputs/bundle

      - name: Verify package and signature
        run: |
          set -euo pipefail

          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"

          "$BT/aapt" dump badging "$APK" | \
            grep -E "package: name='com\.majdoor\.hisaab'.*versionCode='30'.*versionName='2\.10'"

          "$BT/apksigner" verify --verbose "$APK"

          "$BT/apksigner" verify --print-certs "$APK"

      - name: SHA256
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload FINAL Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-v2.10-FINAL-Release-APK
          path: src/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
