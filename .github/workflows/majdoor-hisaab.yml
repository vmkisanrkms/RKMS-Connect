name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_CODE: "82"
  VERSION_NAME: "1.82.0"

  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_HAJRI_PHOTO_PDF_FIXED_FINAL_V9.zip"
  APK_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

jobs:

  build-release:

    name: Build, Sign and Verify Release APK

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ============================================================
      # 4. LOCATE ANDROID SDK
      #
      # IMPORTANT:
      # android-actions/setup-android@v3 IS NOT USED.
      # This avoids the "Failed to find package tools" error.
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT=""

          if [ -n "${ANDROID_SDK_ROOT:-}" ] && \
             [ -d "$ANDROID_SDK_ROOT" ]; then

            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -n "${ANDROID_HOME:-}" ] && \
               [ -d "$ANDROID_HOME" ]; then

            SDK_ROOT="$ANDROID_HOME"

          elif [ -d "/usr/local/lib/android/sdk" ]; then

            SDK_ROOT="/usr/local/lib/android/sdk"

          else

            echo "::error::Android SDK not found."
            exit 1

          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$SDK_ROOT"

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name "sdkmanager" \
                -print \
                -quit \
                2>/dev/null || true
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 5. ACCEPT LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          echo "Android SDK licenses accepted."


      # ============================================================
      # 6. INSTALL API 36 + BUILD TOOLS 36
      #
      # IMPORTANT:
      # No obsolete "tools" package is requested.
      # ============================================================

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d \
            "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}"

          test -d \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          echo "Android API ${ANDROID_API}: PASS"
          echo "Build Tools ${BUILD_TOOLS}: PASS"


      # ============================================================
      # 7. VERIFY ENVIRONMENT
      # ============================================================

      - name: Verify Java Gradle and Android
        shell: bash
        run: |
          set -euo pipefail

          echo "================ JAVA ================"
          java -version

          echo
          echo "================ GRADLE ================"
          gradle --version

          echo
          echo "================ SDK ================"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo
          echo "================ AAPT2 ================"
          "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2" version

          echo
          echo "================ APKSIGNER ================"
          "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner" --version


      # ============================================================
      # 8. LOCATE V9 ZIP
      # ============================================================

      - name: Locate V9 project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH=""

          if [ -f "$GITHUB_WORKSPACE/${ZIP_NAME}" ]; then
            ZIP_PATH="$GITHUB_WORKSPACE/${ZIP_NAME}"
          else
            ZIP_PATH="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "$ZIP_NAME" \
                -print \
                -quit \
                2>/dev/null || true
            )"
          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::V9 ZIP not found."

            echo
            echo "Expected:"
            echo "$ZIP_NAME"

            echo
            echo "Available ZIP files:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print || true

            exit 1
          fi

          echo "PROJECT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"

          echo
          echo "V9 ZIP:"
          echo "$ZIP_PATH"


      # ============================================================
      # 9. VERIFY ZIP
      # ============================================================

      - name: Verify V9 ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$PROJECT_ZIP"

          echo "V9 ZIP integrity: PASS"


      # ============================================================
      # 10. EXTRACT ZIP
      # ============================================================

      - name: Extract V9 project ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_ROOT="$RUNNER_TEMP/majdoor-v9-project"

          rm -rf "$EXTRACT_ROOT"
          mkdir -p "$EXTRACT_ROOT"

          unzip -q \
            "$PROJECT_ZIP" \
            -d "$EXTRACT_ROOT"

          echo "EXTRACT_ROOT=$EXTRACT_ROOT" >> "$GITHUB_ENV"

          echo "V9 extraction: PASS"


      # ============================================================
      # 11. LOCATE GRADLE PROJECT
      # ============================================================

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find "$EXTRACT_ROOT" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print \
              -quit \
              2>/dev/null || true
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo
          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"


      # ============================================================
      # 12. VERIFY PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            "$PROJECT_ROOT/settings.gradle.kts" \
            || test -f \
            "$PROJECT_ROOT/settings.gradle"

          test -f \
            "$PROJECT_ROOT/build.gradle.kts" \
            || test -f \
            "$PROJECT_ROOT/build.gradle"

          test -f \
            "$PROJECT_ROOT/app/build.gradle.kts" \
            || test -f \
            "$PROJECT_ROOT/app/build.gradle"

          test -f \
            "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          test -f \
            "$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          test -f \
            "$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"

          echo "Android project structure: PASS"


      # ============================================================
      # 13. VERIFY MAINACTIVITY
      # ============================================================

      - name: Verify MainActivity Kotlin source
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          if grep -Fxq \
            "import androidx.compose.foundation.lazy.item" \
            "$MAIN"; then

            echo "::error::Invalid lazy.item import found."
            exit 1

          fi

          grep -Fxq \
            "import androidx.compose.foundation.lazy.items" \
            "$MAIN"

          for symbol in \
            "fun validDate" \
            "fun today" \
            "fun money" \
            "fun displayDate" \
            "fun Stat" \
            "fun DashboardStat" \
            "fun DashboardModule" \
            "fun LabourScreen" \
            "fun FieldScreen" \
            "fun CropScreen" \
            "fun ExpenseScreen" \
            "fun SaleScreen" \
            "fun AttendanceScreen" \
            "fun FieldDetail" \
            "fun LabourDetail" \
            "fun PaymentDialog" \
            "fun RateDialog" \
            "fun CropDetail" \
            "exportReportPhoto" \
            "exportReportPdf" \
            "ExportButtons" \
            "DeviceCredentialDeleteGate"
          do

            grep -q "$symbol" "$MAIN"

          done

          echo "MainActivity source verification: PASS"


      # ============================================================
      # 14. FILE PROVIDER
      # ============================================================

      - name: Verify FileProvider reports path
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"

          grep -q "cache-path" "$FILE"

          grep -q 'path="reports/"' "$FILE"

          echo "FileProvider reports path: PASS"


      # ============================================================
      # 15. VERIFY PACKAGE / VERSION / SDK
      # ============================================================

      - name: Verify application configuration
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"

          grep -Eq \
            'applicationId[[:space:]]*=[[:space:]]*"com\.majdoor\.hisaabpro"' \
            "$APP_GRADLE"

          grep -Eq \
            'versionCode[[:space:]]*=[[:space:]]*82([[:space:]]|$)' \
            "$APP_GRADLE"

          grep -Eq \
            'versionName[[:space:]]*=[[:space:]]*"1\.82\.0"' \
            "$APP_GRADLE"

          grep -q \
            "compileSdk = 36" \
            "$APP_GRADLE"

          grep -q \
            "targetSdk = 36" \
            "$APP_GRADLE"

          grep -q \
            "minSdk = 23" \
            "$APP_GRADLE"

          grep -q \
            "JavaVersion.VERSION_17" \
            "$APP_GRADLE"

          echo "Package/version/SDK verification: PASS"


      # ============================================================
      # 16. CONFIGURE SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          printf \
            "sdk.dir=%s\n" \
            "$ANDROID_SDK_ROOT" \
            > "$PROJECT_ROOT/local.properties"

          cat "$PROJECT_ROOT/local.properties"


      # ============================================================
      # 17. CHECK PERMANENT SIGNING SECRETS
      #
      # IMPORTANT:
      # These cannot be replaced by code.
      # They must exist in GitHub Repository Secrets.
      # ============================================================

      - name: Check permanent signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -euo pipefail

          MISSING=0

          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing secret: RELEASE_KEYSTORE_BASE64"
            MISSING=1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Missing secret: KEYSTORE_PASSWORD"
            MISSING=1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::Missing secret: KEY_ALIAS"
            MISSING=1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Missing secret: KEY_PASSWORD"
            MISSING=1
          fi

          if [ "$MISSING" -ne 0 ]; then
            echo
            echo "=============================================="
            echo "PERMANENT SIGNING SECRETS ARE NOT COMPLETE"
            echo "=============================================="
            echo
            echo "Add these GitHub Repository Secrets:"
            echo
            echo "1. RELEASE_KEYSTORE_BASE64"
            echo "2. KEYSTORE_PASSWORD"
            echo "3. KEY_ALIAS"
            echo "4. KEY_PASSWORD"
            echo "5. RELEASE_CERT_SHA256"
            echo
            echo "No temporary signing key will be generated."
            echo "Build stopped safely."
            exit 1
          fi

          echo "Required signing secrets: PRESENT"


      # ============================================================
      # 18. PREPARE PERMANENT KEYSTORE
      # ============================================================

      - name: Prepare permanent production signing keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}

        run: |
          set -euo pipefail

          KEYSTORE_FILE="$RUNNER_TEMP/majdoor-hisaab-pro-production.p12"

          printf "%s" \
            "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          keytool \
            -list \
            -storetype PKCS12 \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore and alias verification: PASS"


          # --------------------------------------------------------
          # SHA-256 verification
          # --------------------------------------------------------

          if [ -n "${RELEASE_CERT_SHA256:-}" ]; then

            EXPECTED="$(
              printf "%s" \
                "$RELEASE_CERT_SHA256" \
                | tr -d " :\r\n" \
                | tr "[:lower:]" "[:upper:]"
            )"

            ACTUAL="$(
              keytool \
                -list \
                -v \
                -storetype PKCS12 \
                -keystore "$KEYSTORE_FILE" \
                -storepass "$KEYSTORE_PASSWORD" \
                -alias "$KEY_ALIAS" \
                | awk -F": " \
                  "/SHA256:/{print \$2; exit}" \
                | tr -d " :\r\n" \
                | tr "[:lower:]" "[:upper:]"
            )"

            echo "Production certificate fingerprint check..."

            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::Production certificate fingerprint mismatch."
              exit 1
            fi

            echo "Certificate fingerprint: PASS"

          else

            echo "WARNING: RELEASE_CERT_SHA256 not set."

          fi


          echo "KEYSTORE_FILE=$KEYSTORE_FILE" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 19. GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 20. BUILD SIGNED RELEASE
      #
      # The V9 app/build.gradle.kts already reads:
      #
      # KEYSTORE_FILE
      # KEYSTORE_PASSWORD
      # KEY_ALIAS
      # KEY_PASSWORD
      #
      # Therefore Gradle signs the release APK.
      # ============================================================

      - name: Build signed Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -euo pipefail

          test -f "$KEYSTORE_FILE"

          gradle \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

          echo "Signed Release build completed."


      # ============================================================
      # 21. LOCATE APK
      # ============================================================

      - name: Locate final APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(
            find \
              "$PROJECT_ROOT/app/build/outputs/apk/release" \
              -type f \
              -name "*.apk" \
              -print \
              -quit \
              2>/dev/null || true
          )"

          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found."
            exit 1
          fi

          FINAL_APK="$RUNNER_TEMP/$APK_NAME"

          cp \
            "$APK_PATH" \
            "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" \
            >> "$GITHUB_ENV"

          echo
          echo "FINAL APK:"
          echo "$FINAL_APK"


      # ============================================================
      # 22. VERIFY SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$FINAL_APK"

          echo "APK signature verification: PASS"


      # ============================================================
      # 23. VERIFY FINAL CERTIFICATE
      # ============================================================

      - name: Verify final production certificate
        shell: bash
        env:
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}

        run: |
          set -euo pipefail

          if [ -z "${RELEASE_CERT_SHA256:-}" ]; then
            echo "Certificate fingerprint secret not supplied."
            echo "Signature itself was already verified."
            exit 0
          fi

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          EXPECTED="$(
            printf "%s" \
              "$RELEASE_CERT_SHA256" \
              | tr -d " :\r\n" \
              | tr "[:lower:]" "[:upper:]"
          )"

          ACTUAL="$(
            "$APKSIGNER" \
              verify \
              --print-certs \
              "$FINAL_APK" \
              2>&1 \
              | awk -F": " \
                "/Signer #1 certificate SHA-256 digest:/{print \$2; exit}" \
              | tr -d " :\r\n" \
              | tr "[:lower:]" "[:upper:]"
          )"

          if [ -z "$ACTUAL" ]; then
            echo "::error::Unable to read APK certificate fingerprint."
            exit 1
          fi

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Final APK certificate mismatch."
            exit 1
          fi

          echo "Final production certificate: VERIFIED"


      # ============================================================
      # 24. VERIFY ZIPALIGN
      # ============================================================

      - name: Verify APK alignment
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          "$ZIPALIGN" \
            -c \
            -P 16 \
            4 \
            "$FINAL_APK"

          echo "APK alignment: PASS"


      # ============================================================
      # 25. VERIFY PACKAGE AND VERSION
      # ============================================================

      - name: Verify final APK package and version
        shell: bash
        run: |
          set -euo pipefail

          AAPT2="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"

          BADGING="$RUNNER_TEMP/badging.txt"

          "$AAPT2" \
            dump \
            badging \
            "$FINAL_APK" \
            > "$BADGING"

          cat "$BADGING"

          grep -q \
            "package: name='${PACKAGE_NAME}'" \
            "$BADGING"

          grep -q \
            "versionCode='${VERSION_CODE}'" \
            "$BADGING"

          grep -q \
            "versionName='${VERSION_NAME}'" \
            "$BADGING"

          echo
          echo "Package: PASS"
          echo "Version: PASS"


      # ============================================================
      # 26. CREATE RELEASE REPORT
      # ============================================================

      - name: Create final release report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/release"

          cp \
            "$FINAL_APK" \
            "$RUNNER_TEMP/release/$APK_NAME"

          cat > \
            "$RUNNER_TEMP/release/BUILD-REPORT.txt" <<EOF
          MAJDOOR HISAAB PRO V82

          Package:
          ${PACKAGE_NAME}

          Version:
          ${VERSION_NAME}

          Version Code:
          ${VERSION_CODE}

          Android API:
          ${ANDROID_API}

          Build Tools:
          ${BUILD_TOOLS}

          Java:
          ${JAVA_VERSION}

          Gradle:
          ${GRADLE_VERSION}

          Signing:
          PERMANENT PRODUCTION KEYSTORE

          APK Signature:
          VERIFIED

          APK Certificate:
          VERIFIED

          APK Alignment:
          VERIFIED

          APK Package:
          VERIFIED

          BUILD STATUS:
          SUCCESS
          EOF

          sha256sum \
            "$RUNNER_TEMP/release/$APK_NAME" \
            > "$RUNNER_TEMP/release/SHA256SUMS.txt"

          cat "$RUNNER_TEMP/release/BUILD-REPORT.txt"


      # ============================================================
      # 27. UPLOAD APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4

        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED

          path: |
            ${{ runner.temp }}/release/${{ env.APK_NAME }}
            ${{ runner.temp }}/release/BUILD-REPORT.txt
            ${{ runner.temp }}/release/SHA256SUMS.txt

          if-no-files-found: error

          retention-days: 30


      # ============================================================
      # 28. FINAL SUMMARY
      # ============================================================

      - name: Final success summary
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " MAJDOOR HISAAB PRO V82"
          echo " FINAL RELEASE BUILD SUCCESS"
          echo "=============================================="
          echo
          echo "Package:"
          echo "$PACKAGE_NAME"
          echo
          echo "Version:"
          echo "$VERSION_NAME ($VERSION_CODE)"
          echo
          echo "APK:"
          echo "$APK_NAME"
          echo
          echo "Signing:"
          echo "PERMANENT PRODUCTION KEY"
          echo
          echo "=============================================="


      # ============================================================
      # 29. CLEAN SIGNING MATERIAL
      # ============================================================

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f \
            "${KEYSTORE_FILE:-}" \
            2>/dev/null || true

          echo "Temporary keystore file removed."
