name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor_Hisaab_PRO_FINAL_KOTLIN_FIXED.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

jobs:
  build-release:
    name: Build Final Signed Release APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 3. GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ============================================================
      # 4. LOCATE ANDROID SDK
      # ============================================================
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching Android SDK..."

          SDK=""

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          fi

          if [ -z "$SDK" ]; then
            SDK="$(
              find /usr/local /opt "$HOME" \
                -maxdepth 7 \
                -type d \
                -name "platform-tools" \
                2>/dev/null \
                | head -n 1 \
                | sed 's#/platform-tools##' || true
            )"
          fi

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK could not be located."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

          SDKMANAGER_PATH=""

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_PATH="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER_PATH="$(command -v sdkmanager)"
          else
            SDKMANAGER_PATH="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name sdkmanager \
                2>/dev/null \
                | head -n 1 || true
            )"
          fi

          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"

          echo "Android SDK: $SDK"
          echo "sdkmanager: $SDKMANAGER_PATH"

      # ============================================================
      # 5. INSTALL ANDROID API 36
      # ============================================================
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      # ============================================================
      # 6. VERIFY ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API}"
          test -d "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          test -x "$ANDROID_HOME/platform-tools/adb"

          echo "=========================================="
          echo "ANDROID SDK VERIFIED"
          echo "=========================================="
          echo "Android API : ${ANDROID_API}"
          echo "Build Tools : ${BUILD_TOOLS}"
          echo "SDK         : ${ANDROID_HOME}"

      # ============================================================
      # 7. FIND PROJECT ZIP
      # ============================================================
      - name: Find Majdoor Hisaab Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AVAILABLE ZIP FILES"
          echo "=========================================="

          find . \
            -maxdepth 4 \
            -type f \
            -iname "*.zip" \
            -print \
            | sort || true

          ZIP_PATH=""

          if [ -f "./${ZIP_NAME}" ]; then
            ZIP_PATH="./${ZIP_NAME}"
          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Expected ZIP not found:"
            echo "${ZIP_NAME}"

            echo ""
            echo "Available ZIP files:"

            find . \
              -maxdepth 6 \
              -type f \
              -iname "*.zip" \
              -print \
              | sort || true

            exit 1
          fi

          ZIP_PATH="$(realpath "$ZIP_PATH")"

          echo ""
          echo "=========================================="
          echo "SELECTED PROJECT ZIP"
          echo "=========================================="
          echo "$ZIP_PATH"

          echo "PROJECT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"

      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================
      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/majdoor-hisaab-project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting:"
          echo "$PROJECT_ZIP"

          unzip -q "$PROJECT_ZIP" -d "$EXTRACT_DIR"

          echo ""
          echo "Extraction completed."

          echo ""
          echo "Important project files:"

          find "$EXTRACT_DIR" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "gradlew" \
            \) \
            -print \
            | sort \
            | head -n 100

      # ============================================================
      # 9. LOCATE ANDROID PROJECT ROOT
      # ============================================================
      - name: Locate Android Project Root
        shell: bash
        run: |
          set -euo pipefail

          BASE="$RUNNER_TEMP/majdoor-hisaab-project"

          PROJECT_ROOT=""

          SETTINGS_KTS="$(
            find "$BASE" \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              | head -n 1 || true
          )"

          if [ -n "$SETTINGS_KTS" ]; then
            PROJECT_ROOT="$(dirname "$SETTINGS_KTS")"
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            SETTINGS_GRADLE="$(
              find "$BASE" \
                -type f \
                -name "settings.gradle" \
                -print \
                | head -n 1 || true
            )"

            if [ -n "$SETTINGS_GRADLE" ]; then
              PROJECT_ROOT="$(dirname "$SETTINGS_GRADLE")"
            fi
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Android Gradle project root was not found."

            echo ""
            echo "Extracted project structure:"

            find "$BASE" \
              -maxdepth 6 \
              -type f \
              -print \
              | sort \
              | head -n 500

            exit 1
          fi

          echo "=========================================="
          echo "ANDROID PROJECT ROOT"
          echo "=========================================="
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      # ============================================================
      # 10. VERIFY ANDROID PROJECT
      # ============================================================
      - name: Verify Android Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "::error::settings.gradle/settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            echo "::error::gradlew not found."
            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Gradle Wrapper:"
          ./gradlew --version

      # ============================================================
      # 11. INSPECT PROJECT
      # ============================================================
      - name: Inspect Android Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "GRADLE / ANDROID FILES"
          echo "=========================================="

          find . \
            -maxdepth 5 \
            -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "gradle.properties" \
              -o -name "AndroidManifest.xml" \
            \) \
            -print \
            | sort \
            | head -n 500

      # ============================================================
      # 12. SHOW KOTLIN FILES
      # ============================================================
      - name: Locate Kotlin Source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "KOTLIN SOURCE FILES"
          echo "=========================================="

          find . \
            -type f \
            \( \
              -name "*.kt" \
              -o -name "*.kts" \
            \) \
            -print \
            | sort \
            | head -n 500 || true

      # ============================================================
      # 13. ANDROID CONFIGURATION
      # ============================================================
      - name: Verify Android Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "ANDROID CONFIGURATION"
          echo "=========================================="

          grep -RIn \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            "minSdk" . \
            2>/dev/null \
            | head -n 50 || true

          echo ""

          grep -RIn \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            "compileSdk" . \
            2>/dev/null \
            | head -n 50 || true

      # ============================================================
      # 14. CLEAN PROJECT
      # ============================================================
      - name: Clean Android Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 15. COMPILE + BUILD RELEASE APK
      # ============================================================
      - name: Compile Release Kotlin and Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          MAIN_KT="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          if [ ! -f "$MAIN_KT" ]; then
            echo "::error::MainActivity.kt not found:"
            echo "$MAIN_KT"
            exit 1
          fi

          echo "=========================================="
          echo "VERIFYING FINAL KOTLIN SOURCE"
          echo "=========================================="

          grep -n \
            'private class Store(private val context:Context)' \
            "$MAIN_KT"

          grep -n \
            'Icon(imageVector=ic,contentDescription=null,modifier=' \
            "$MAIN_KT"

          grep -n \
            'Image(painter=painterResource(R.drawable.majdoor_logo)' \
            "$MAIN_KT"

          echo ""
          echo "=========================================="
          echo "BUILDING RELEASE APK"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 16. LOCATE RELEASE APK
      #
      # IMPORTANT:
      # assembleRelease creates:
      # app-release-unsigned.apk
      #
      # This unsigned APK is intentionally used as the input for
      # zipalign and apksigner below.
      # ============================================================
      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "ALL APK FILES"
          echo "=========================================="

          find . \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          echo ""
          echo "=========================================="
          echo "SEARCHING RELEASE APK"
          echo "=========================================="

          APK_PATH=""

          # --------------------------------------------------------
          # 1. Preferred standard Gradle release APK
          # --------------------------------------------------------
          APK_PATH="$(
            find . \
              -type f \
              -path "*/build/outputs/apk/release/*-release-unsigned.apk" \
              -print \
              | head -n 1 || true
          )"

          # --------------------------------------------------------
          # 2. Exact standard filename fallback
          # --------------------------------------------------------
          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(
              find . \
                -type f \
                -name "app-release-unsigned.apk" \
                -print \
                | head -n 1 || true
            )"
          fi

          # --------------------------------------------------------
          # 3. Any APK inside release output
          # --------------------------------------------------------
          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(
              find . \
                -type f \
                -path "*/build/outputs/apk/release/*.apk" \
                -print \
                | head -n 1 || true
            )"
          fi

          # --------------------------------------------------------
          # 4. Final fallback: any APK
          # --------------------------------------------------------
          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(
              find . \
                -type f \
                -name "*.apk" \
                -print \
                | head -n 1 || true
            )"
          fi

          # --------------------------------------------------------
          # 5. Fail only if absolutely no APK exists
          # --------------------------------------------------------
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not found."

            echo ""
            echo "Complete APK search result:"

            find . \
              -type f \
              -name "*.apk" \
              -print \
              | sort || true

            echo ""
            echo "Release output directories:"

            find . \
              -type d \
              -path "*/build/outputs/apk/release" \
              -print \
              | sort || true

            exit 1
          fi

          APK_PATH="$(realpath "$APK_PATH")"

          echo ""
          echo "=========================================="
          echo "RELEASE APK FOUND"
          echo "=========================================="

          echo "APK PATH:"
          echo "$APK_PATH"

          echo ""
          echo "APK SIZE:"
          ls -lh "$APK_PATH"

          # --------------------------------------------------------
          # Copy to stable temporary location
          # --------------------------------------------------------
          cp "$APK_PATH" "$RUNNER_TEMP/release-original.apk"

          test -f "$RUNNER_TEMP/release-original.apk"

          echo ""
          echo "Original APK copied to:"
          echo "$RUNNER_TEMP/release-original.apk"

          echo "ORIGINAL_APK=$RUNNER_TEMP/release-original.apk" >> "$GITHUB_ENV"

      # ============================================================
      # 17. VERIFY ORIGINAL APK
      # ============================================================
      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$ORIGINAL_APK"

          test -f "$APK"

          echo "=========================================="
          echo "APK INFORMATION"
          echo "=========================================="

          ls -lh "$APK"

          echo ""
          echo "Application ID:"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest application-id "$APK" || true

          echo ""
          echo "Version Name:"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest version-name "$APK" || true

          echo ""
          echo "Version Code:"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
            manifest version-code "$APK" || true

      # ============================================================
      # 18. PREPARE TEMPORARY SIGNING KEYSTORE
      # ============================================================
      - name: Prepare APK Signing Keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/majdoor-hisaab-release.keystore"

          rm -f "$KEYSTORE"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -alias majdoor-hisaab-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "MajdoorHisaabV82Store@2026" \
            -keypass "MajdoorHisaabV82Key@2026" \
            -dname "CN=Majdoor Hisaab PRO, OU=RKMS, O=RKMS, L=Lakhimpur Kheri, ST=Uttar Pradesh, C=IN"

          test -f "$KEYSTORE"

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      # ============================================================
      # 19. ZIPALIGN
      # ============================================================
      - name: Align Release APK
        shell: bash
        run: |
          set -euo pipefail

          INPUT="$ORIGINAL_APK"
          ALIGNED="$RUNNER_TEMP/$APK_UNSIGNED_NAME"

          rm -f "$ALIGNED"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$ALIGNED"

          test -f "$ALIGNED"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" \
            -c \
            -P 4 \
            16 \
            4 \
            "$ALIGNED"

          echo "Aligned APK:"
          ls -lh "$ALIGNED"

          echo "ALIGNED_APK=$ALIGNED" >> "$GITHUB_ENV"

      # ============================================================
      # 20. SIGN APK
      # ============================================================
      - name: Sign Release APK
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="$RUNNER_TEMP/$APK_SIGNED_NAME"

          rm -f "$SIGNED"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias majdoor-hisaab-release \
            --ks-pass pass:"MajdoorHisaabV82Store@2026" \
            --key-pass pass:"MajdoorHisaabV82Key@2026" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$SIGNED" \
            "$ALIGNED_APK"

          test -f "$SIGNED"

          echo "Signed APK:"
          ls -lh "$SIGNED"

          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"

      # ============================================================
      # 21. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify Release APK Signature
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"

      # ============================================================
      # 22. VERIFY FINAL APK ID AND VERSION
      # ============================================================
      - name: Verify Final APK Identity
        shell: bash
        run: |
          set -euo pipefail

          APK="$SIGNED_APK"

          ACTUAL_PACKAGE="$(
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
              manifest application-id "$APK" \
              | tr -d '\r\n'
          )"

          ACTUAL_VERSION="$(
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
              manifest version-name "$APK" \
              | tr -d '\r\n'
          )"

          ACTUAL_CODE="$(
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apkanalyzer" \
              manifest version-code "$APK" \
              | tr -d '\r\n'
          )"

          echo "Expected Package : $PACKAGE_NAME"
          echo "Actual Package   : $ACTUAL_PACKAGE"

          echo "Expected Version : $VERSION_NAME"
          echo "Actual Version   : $ACTUAL_VERSION"

          echo "Expected Code    : $VERSION_CODE"
          echo "Actual Code      : $ACTUAL_CODE"

          if [ "$ACTUAL_PACKAGE" != "$PACKAGE_NAME" ]; then
            echo "::error::Package name mismatch."
            exit 1
          fi

          if [ "$ACTUAL_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Version name mismatch."
            exit 1
          fi

          if [ "$ACTUAL_CODE" != "$VERSION_CODE" ]; then
            echo "::error::Version code mismatch."
            exit 1
          fi

          echo ""
          echo "APK identity verification successful."

      # ============================================================
      # 23. FINAL ZIPALIGN CHECK
      # ============================================================
      - name: Final APK Alignment Verification
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign" \
            -c \
            -P 4 \
            16 \
            4 \
            "$SIGNED_APK"

          echo "Final APK alignment verification successful."

      # ============================================================
      # 24. GENERATE BUILD REPORT
      # ============================================================
      - name: Generate Build Report
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/Majdoor-Hisaab-PRO-V82-Build-Report.txt"

          {
            echo "=============================================="
            echo "MAJDOOR HISAAB PRO V82"
            echo "FINAL SIGNED RELEASE APK"
            echo "=============================================="
            echo ""
            echo "Package       : ${PACKAGE_NAME}"
            echo "Version       : ${VERSION_NAME}"
            echo "Version Code  : ${VERSION_CODE}"
            echo "Android API   : ${ANDROID_API}"
            echo "Build Tools   : ${BUILD_TOOLS}"
            echo "Java          : ${JAVA_VERSION}"
            echo "Gradle        : ${GRADLE_VERSION}"
            echo ""
            echo "Source ZIP:"
            echo "${PROJECT_ZIP}"
            echo ""
            echo "Final APK:"
            echo "${APK_SIGNED_NAME}"
            echo ""
            echo "APK Size:"
            ls -lh "${SIGNED_APK}"
            echo ""
            echo "Signature verification:"
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner" \
              verify \
              --verbose \
              --print-certs \
              "${SIGNED_APK}"
            echo ""
            echo "=============================================="
            echo "BUILD SUCCESSFUL"
            echo "=============================================="
          } > "$REPORT"

          cat "$REPORT"

          echo "REPORT=$REPORT" >> "$GITHUB_ENV"

      # ============================================================
      # 25. PREPARE FINAL ARTIFACTS
      # ============================================================
      - name: Prepare Final Artifacts
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/final-output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          cp "$SIGNED_APK" \
            "$OUTPUT/$APK_SIGNED_NAME"

          cp "$ALIGNED_APK" \
            "$OUTPUT/$APK_UNSIGNED_NAME"

          cp "$REPORT" \
            "$OUTPUT/Majdoor-Hisaab-PRO-V82-Build-Report.txt"

          echo "=========================================="
          echo "FINAL OUTPUT FILES"
          echo "=========================================="

          ls -lh "$OUTPUT"

      # ============================================================
      # 26. UPLOAD FINAL SIGNED APK
      # ============================================================
      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: |
            final-output/Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk
            final-output/Majdoor-Hisaab-PRO-V82-Build-Report.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 27. UPLOAD ALIGNED APK
      # ============================================================
      - name: Upload Aligned APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-ALIGNED-APK
          path: |
            final-output/Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 28. FINAL SUCCESS
      # ============================================================
      - name: Final Success
        shell: bash
        run: |
          echo ""
          echo "======================================================"
          echo "       MAJDOOR HISAAB PRO V82 BUILD SUCCESS"
          echo "======================================================"
          echo ""
          echo "Package       : ${PACKAGE_NAME}"
          echo "Version       : ${VERSION_NAME}"
          echo "Version Code  : ${VERSION_CODE}"
          echo ""
          echo "Final Signed APK:"
          echo "${APK_SIGNED_NAME}"
          echo ""
          echo "Completed:"
          echo "1. Java 17"
          echo "2. Gradle ${GRADLE_VERSION}"
          echo "3. Android API ${ANDROID_API}"
          echo "4. Release compilation"
          echo "5. APK detection"
          echo "6. APK alignment"
          echo "7. APK signing"
          echo "8. Signature verification"
          echo "9. Package/version verification"
          echo "10. Final artifact upload"
