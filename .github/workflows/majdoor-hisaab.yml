name: Majdoor Hisaab PRO - Stable Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104.zip"

jobs:

  build-release-apk:

    name: Build and Sign Release APK

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. BUILD INFORMATION
      # ==========================================================

      - name: Show build configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MAJDOOR HISAAB PRO"
          echo "STABLE RELEASE APK BUILD"
          echo "=========================================="

          echo "Java        : ${JAVA_VERSION}"
          echo "Gradle      : ${GRADLE_VERSION}"
          echo "Android API : ${ANDROID_API}"
          echo "Build Tools : ${BUILD_TOOLS}"
          echo "Package     : ${PACKAGE_NAME}"
          echo "Version     : ${VERSION_NAME}"
          echo "VersionCode : ${VERSION_CODE}"

          echo "=========================================="


      # ==========================================================
      # 3. PREPARE AND FIND PROJECT
      #
      # FIXED:
      # - Git LFS ZIP support
      # - exact ZIP search
      # - safe ZIP copy
      # - ZIP integrity verification
      # - Python zip extraction
      # - detailed diagnostics
      # ==========================================================

      - name: Prepare Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf project
          rm -rf extracted

          mkdir -p project
          mkdir -p extracted

          echo "=========================================="
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "=========================================="

          if [ -f "settings.gradle.kts" ] &&
             [ -f "app/build.gradle.kts" ]; then

            echo "ANDROID_PROJECT_FOUND_IN_REPOSITORY"

            shopt -s dotglob

            cp -a . project/

          else

            echo "ANDROID_PROJECT_NOT_FOUND_AT_ROOT"
            echo "SEARCHING FOR PROJECT ZIP..."

            # ----------------------------------------------------
            # Try Git LFS if the repository uses LFS.
            # ----------------------------------------------------

            if command -v git-lfs >/dev/null 2>&1; then
              echo "GIT_LFS_DETECTED"

              git lfs install --local >/dev/null 2>&1 || true

              git lfs pull >/dev/null 2>&1 || true

              echo "GIT_LFS_PULL_COMPLETED"
            else
              echo "GIT_LFS_NOT_INSTALLED"
            fi


            # ----------------------------------------------------
            # Search expected ZIP first.
            # ----------------------------------------------------

            ZIP_PATH=""

            if [ -f "${ZIP_NAME}" ]; then
              ZIP_PATH="./${ZIP_NAME}"
            fi


            # ----------------------------------------------------
            # Search BUILD_FIXED ZIP.
            # ----------------------------------------------------

            if [ -z "$ZIP_PATH" ]; then

              if [ -f \
                "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip" ]; then

                ZIP_PATH="./Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip"

              fi

            fi


            # ----------------------------------------------------
            # Recursive exact search.
            # ----------------------------------------------------

            if [ -z "$ZIP_PATH" ]; then

              ZIP_PATH="$(
                find . \
                  -type f \
                  -name "${ZIP_NAME}" \
                  -not -path "./project/*" \
                  -not -path "./extracted/*" \
                  -not -path "./.git/*" \
                  -print \
                  | head -n 1
              )"

            fi


            # ----------------------------------------------------
            # Recursive BUILD_FIXED search.
            # ----------------------------------------------------

            if [ -z "$ZIP_PATH" ]; then

              ZIP_PATH="$(
                find . \
                  -type f \
                  -name "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip" \
                  -not -path "./project/*" \
                  -not -path "./extracted/*" \
                  -not -path "./.git/*" \
                  -print \
                  | head -n 1
              )"

            fi


            # ----------------------------------------------------
            # Final fallback.
            # ----------------------------------------------------

            if [ -z "$ZIP_PATH" ]; then

              ZIP_PATH="$(
                find . \
                  -type f \
                  -iname "Majdoor_Hisaab*.zip" \
                  -not -path "./project/*" \
                  -not -path "./extracted/*" \
                  -not -path "./.git/*" \
                  -print \
                  | head -n 1
              )"

            fi


            # ----------------------------------------------------
            # ZIP must exist.
            # ----------------------------------------------------

            if [ -z "$ZIP_PATH" ]; then

              echo ""
              echo "=========================================="
              echo "ERROR: MAJDOOR HISAAB PROJECT ZIP NOT FOUND"
              echo "=========================================="
              echo ""

              echo "Expected:"
              echo "${ZIP_NAME}"

              echo ""
              echo "BUILD_FIXED fallback:"
              echo "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip"

              echo ""
              echo "AVAILABLE ZIP FILES:"

              find . \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                -print \
                | head -n 50 || true

              echo ""
              echo "GIT TRACKED FILE CHECK:"

              git ls-files \
                | grep -Ei \
                'Majdoor_Hisaab.*\.zip$' \
                | head -n 50 || true

              exit 1

            fi


            # ----------------------------------------------------
            # Normalize path.
            # ----------------------------------------------------

            ZIP_PATH="$(realpath "$ZIP_PATH")"

            echo ""
            echo "=========================================="
            echo "PROJECT ZIP FOUND"
            echo "=========================================="

            echo "PROJECT_ZIP_FOUND=${ZIP_PATH}"

            test -f "$ZIP_PATH"
            test -r "$ZIP_PATH"

            ls -lh "$ZIP_PATH"


            # ----------------------------------------------------
            # Detect Git LFS pointer.
            # ----------------------------------------------------

            if head -n 1 "$ZIP_PATH" 2>/dev/null \
              | grep -Fq "version https://git-lfs.github.com/spec/v1"; then

              echo ""
              echo "ERROR: ZIP IS STILL A GIT LFS POINTER"
              echo "Git LFS object was not downloaded."

              git lfs ls-files || true

              exit 1

            fi


            # ----------------------------------------------------
            # Verify ZIP using Python zipfile.
            # ----------------------------------------------------

            echo ""
            echo "VERIFYING ZIP INTEGRITY..."

            python3 - "$ZIP_PATH" <<'PY'
          import sys
          import zipfile

          zip_path = sys.argv[1]

          try:
              with zipfile.ZipFile(zip_path, "r") as z:
                  bad = z.testzip()

                  if bad is not None:
                      print(f"ERROR: CORRUPTED ZIP ENTRY: {bad}")
                      raise SystemExit(1)

                  names = z.namelist()

                  print(f"ZIP_ENTRIES={len(names)}")

                  required = [
                      "settings.gradle.kts",
                      "build.gradle.kts",
                      "app/build.gradle.kts",
                      "app/src/main/AndroidManifest.xml",
                  ]

                  for item in required:
                      if item in names:
                          print(f"ZIP_REQUIRED_FILE=PASS:{item}")
                      else:
                          print(f"ZIP_REQUIRED_FILE=MISS:{item}")

                  print("ZIP_INTEGRITY=PASS")

          except zipfile.BadZipFile as exc:
              print(f"ERROR: INVALID ZIP: {exc}")
              raise SystemExit(1)
          PY


            # ----------------------------------------------------
            # Extract with Python.
            # ----------------------------------------------------

            echo ""
            echo "EXTRACTING PROJECT ZIP..."

            python3 - "$ZIP_PATH" "$PWD/extracted" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          zip_path = Path(sys.argv[1])
          output_dir = Path(sys.argv[2])

          output_dir.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(zip_path, "r") as z:
              z.extractall(output_dir)

          print("ZIP_EXTRACTION=PASS")
          PY


            echo ""
            echo "ZIP_EXTRACTED=PASS"


            # ----------------------------------------------------
            # Detect project root.
            # ----------------------------------------------------

            if [ -f "extracted/settings.gradle.kts" ] &&
               [ -f "extracted/app/build.gradle.kts" ]; then

              echo "PROJECT_ROOT=extracted"

              shopt -s dotglob

              cp -a extracted/. project/

            else

              PROJECT_ROOT_FILE="$(
                find extracted \
                  -type f \
                  -name "settings.gradle.kts" \
                  -print \
                  | head -n 1
              )"

              if [ -z "$PROJECT_ROOT_FILE" ]; then

                echo ""
                echo "=========================================="
                echo "ERROR: settings.gradle.kts NOT FOUND"
                echo "=========================================="

                find extracted \
                  -maxdepth 5 \
                  -type f \
                  | head -n 150

                exit 1

              fi

              PROJECT_ROOT="$(dirname "$PROJECT_ROOT_FILE")"

              echo "PROJECT_ROOT=${PROJECT_ROOT}"

              test -f \
                "$PROJECT_ROOT/app/build.gradle.kts"

              shopt -s dotglob

              cp -a "$PROJECT_ROOT"/. project/

            fi

          fi


          # ------------------------------------------------------
          # Final project verification.
          # ------------------------------------------------------

          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml


          echo ""
          echo "=========================================="
          echo "PROJECT_PREPARATION=PASS"
          echo "=========================================="


      # ==========================================================
      # 4. APPLY ONLY PREVIOUSLY FAILED KOTLIN FIXES
      # ==========================================================

      - name: Apply required Kotlin source fixes
        working-directory: project
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"

          test -f "$FILE"

          cp "$FILE" \
            "${FILE}.original-ci"

          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"
          )

          text = file.read_text(encoding="utf-8")

          text = text.replace(
              "app.audit.auditLog()",
              "app.audit.list()"
          )

          text = text.replace(
              "app.audit.clearAuditLog()",
              "app.audit.clear()"
          )

          text = text.replace(
              "getSystemService(ALARM_SERVICE)",
              "getSystemService(Context.ALARM_SERVICE)"
          )

          file.write_text(
              text,
              encoding="utf-8"
          )

          print("SOURCE_FIXES_APPLIED")
          PY

          if grep -Fq \
            "app.audit.auditLog()" \
            "$FILE"; then
            echo "ERROR: old auditLog() reference remains"
            exit 1
          fi

          if grep -Fq \
            "app.audit.clearAuditLog()" \
            "$FILE"; then
            echo "ERROR: old clearAuditLog() reference remains"
            exit 1
          fi

          if grep -Fq \
            "getSystemService(ALARM_SERVICE)" \
            "$FILE"; then
            echo "ERROR: old ALARM_SERVICE reference remains"
            exit 1
          fi

          grep -Fq \
            "app.audit.list()" \
            "$FILE"

          grep -Fq \
            "app.audit.clear()" \
            "$FILE"

          grep -Fq \
            "Context.ALARM_SERVICE" \
            "$FILE"

          echo "SOURCE_FIXES_VERIFICATION=PASS"


      # ==========================================================
      # 5. JAVA 17
      # ==========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 6. ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ==========================================================
      # 7. ANDROID API 36
      # ==========================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "ANDROID_SDK_READY=PASS"


      # ==========================================================
      # 8. GRADLE 8.11.1
      # ==========================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true
          cache-cleanup: never


      # ==========================================================
      # 9. VERIFY TOOLCHAIN
      # ==========================================================

      - name: Verify Java Gradle Android
        shell: bash
        run: |
          set -e

          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          gradle --version

          gradle --version \
            | grep -Fq "Gradle 8.11.1"

          echo ""
          echo "ANDROID SDK:"

          sdkmanager --list_installed \
            | grep -E \
            "platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}"

          echo ""
          echo "TOOLCHAIN_VERIFICATION=PASS"


      # ==========================================================
      # 10. PROJECT CONFIGURATION
      # ==========================================================

      - name: Verify project configuration
        working-directory: project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          grep -Fq \
            'id("com.android.application") version "8.9.1"' \
            build.gradle.kts

          grep -Fq \
            'id("org.jetbrains.kotlin.android") version "2.1.21"' \
            build.gradle.kts

          grep -Fq \
            'compileSdk = 36' \
            app/build.gradle.kts

          grep -Fq \
            'targetSdk = 36' \
            app/build.gradle.kts

          grep -Fq \
            'applicationId = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -Fq \
            'versionCode = 77' \
            app/build.gradle.kts

          grep -Fq \
            'versionName = "1.77.0"' \
            app/build.gradle.kts

          echo "PROJECT_CONFIGURATION=PASS"


      # ==========================================================
      # 11. CLEAN
      # ==========================================================

      - name: Clean previous build
        working-directory: project
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            clean

          echo "CLEAN_BUILD=PASS"


      # ==========================================================
      # 12. BUILD RELEASE APK
      #
      # THIS IS THE ONLY SECTION MODIFIED.
      #
      # AUDITED AGAINST:
      # Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip
      #
      # FIXES:
      # 1. btn() default action
      # 2. exportType when{} correction
      # 3. scoped Button text fixes
      # 4. attendanceCalendar renderSummary order
      # 5. compile before assemble
      #
      # NO BROAD GLOBAL REPLACEMENTS.
      # ==========================================================

      - name: Build Release APK
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"

          test -f "$FILE"

          cp "$FILE" \
            "${FILE}.before-release-fix"


          echo ""
          echo "=========================================="
          echo "AUDITED RELEASE SOURCE PATCH"
          echo "=========================================="

          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"
          )

          source = file.read_text(encoding="utf-8")


          # ======================================================
          # Helper
          # ======================================================

          def patch_block(start_marker, end_marker, replacements):
              global source

              start = source.find(start_marker)

              if start < 0:
                  raise SystemExit(
                      f"ERROR: start marker not found: {start_marker}"
                  )

              end = source.find(end_marker, start)

              if end < 0:
                  raise SystemExit(
                      f"ERROR: end marker not found: {end_marker}"
                  )

              block = source[start:end]

              for old, new in replacements:

                  if old not in block:
                      raise SystemExit(
                          "ERROR: expected source pattern not found "
                          f"in {start_marker}: {old}"
                      )

                  block = block.replace(old, new)

              source = source[:start] + block + source[end:]


          # ======================================================
          # FIX 1
          #
          # btn() is called in some places without action.
          #
          # Original:
          #
          # btn("Attendance time")
          #
          # Original function required action.
          #
          # Make action optional safely.
          # ======================================================

          old_btn = (
              "internal fun MainActivity.btn("
              "s:String,action:()->Unit"
              ")=Button(this).apply{"
          )

          new_btn = (
              "internal fun MainActivity.btn("
              "s:String,action:()->Unit = {}"
              ")=Button(this).apply{"
          )

          if old_btn in source:

              source = source.replace(
                  old_btn,
                  new_btn,
                  1
              )

          elif new_btn not in source:

              raise SystemExit(
                  "ERROR: btn() definition not found"
              )


          # ======================================================
          # FIX 2
          #
          # cropForm()
          #
          # Only cropForm gets fb.text.
          # ======================================================

          patch_block(
              "internal fun MainActivity.cropForm",
              "internal fun MainActivity.attendance()",
              [
                  (
                      'it.text="Field: ${fields[i].name}"',
                      'fb.text="Field: ${fields[i].name}"'
                  )
              ]
          )


          # ======================================================
          # FIX 3
          #
          # productionForm()
          # ======================================================

          patch_block(
              "internal fun MainActivity.productionForm",
              "internal fun MainActivity.revenue()",
              [
                  (
                      'it.text="Crop: ${crops[i].name}"',
                      'cropBtn.text="Crop: ${crops[i].name}"'
                  )
              ]
          )


          # ======================================================
          # FIX 4
          #
          # revenueForm()
          # ======================================================

          patch_block(
              "internal fun MainActivity.revenueForm",
              "internal fun MainActivity.addWork()",
              [
                  (
                      'it.text="Crop: ${crops[i].name}"',
                      'cropBtn.text="Crop: ${crops[i].name}"'
                  )
              ]
          )


          # ======================================================
          # FIX 5
          #
          # workForm()
          #
          # Every replacement is restricted to workForm().
          # ======================================================

          patch_block(
              "internal fun MainActivity.workForm",
              "internal fun MainActivity.workDetail",
              [
                  (
                      'it.text="Field: ${fields[i].name}"',
                      'fieldBtn.text="Field: ${fields[i].name}"'
                  ),
                  (
                      'it.text="Crop: ${crops[i].name}"',
                      'cropBtn.text="Crop: ${crops[i].name}"'
                  ),
                  (
                      'it.text="Workers: ${selectedWorkers.distinct().size}"',
                      'workerBtn.text="Workers: ${selectedWorkers.distinct().size}"'
                  ),
                  (
                      'it.text="Rate type: $rateType"',
                      'rateTypeBtn.text="Rate type: $rateType"'
                  )
              ]
          )


          # ======================================================
          # FIX 6
          #
          # paymentForm()
          # ======================================================

          patch_block(
              "internal fun MainActivity.paymentForm",
              "internal fun MainActivity.expenses()",
              [
                  (
                      'it.text="Worker: ${workers[i].name}"',
                      'wb.text="Worker: ${workers[i].name}"'
                  ),
                  (
                      'it.text="Method: ${methods[i]}"',
                      'mb.text="Method: ${methods[i]}"'
                  ),
                  (
                      'it.text="Advance: ${if(advance)"YES" else "NO"}"',
                      'adv.text="Advance: ${if(advance)"YES" else "NO"}"'
                  )
              ]
          )


          # ======================================================
          # FIX 7
          #
          # expenseForm()
          # ======================================================

          patch_block(
              "internal fun MainActivity.expenseForm",
              "internal fun MainActivity.reportFiltersDialog()",
              [
                  (
                      'it.text="Category: $cat"',
                      'cb.text="Category: $cat"'
                  ),
                  (
                      'it.text="Field: Not linked"',
                      'fb.text="Field: Not linked"'
                  ),
                  (
                      'it.text="Field: ${fields[i-1].name}"',
                      'fb.text="Field: ${fields[i-1].name}"'
                  ),
                  (
                      'it.text="Crop: Not linked"',
                      'crb.text="Crop: Not linked"'
                  ),
                  (
                      'it.text="Crop: ${crops[i-1].name}"',
                      'crb.text="Crop: ${crops[i-1].name}"'
                  )
              ]
          )


          # ======================================================
          # FIX 8
          #
          # reportFiltersDialog()
          # ======================================================

          patch_block(
              "internal fun MainActivity.reportFiltersDialog",
              "internal fun MainActivity.reports()",
              [
                  (
                      'it.text="Worker: ${if(i==0)"All" else workers[i-1].name}"',
                      'wb.text="Worker: ${if(i==0)"All" else workers[i-1].name}"'
                  ),
                  (
                      'it.text="Field: ${if(i==0)"All" else fields[i-1].name}"',
                      'fb.text="Field: ${if(i==0)"All" else fields[i-1].name}"'
                  ),
                  (
                      'it.text="Crop: ${if(i==0)"All" else crops[i-1].name}"',
                      'cb.text="Crop: ${if(i==0)"All" else crops[i-1].name}"'
                  )
              ]
          )


          # ======================================================
          # FIX 9
          #
          # workTemplateForm()
          # ======================================================

          patch_block(
              "internal fun MainActivity.workTemplateForm",
              "internal fun MainActivity.fieldProfile",
              [
                  (
                      'it.text="Rate type: $rateType"',
                      'rateTypeBtn.text="Rate type: $rateType"'
                  )
              ]
          )


          # ======================================================
          # FIX 10
          #
          # attendanceForm()
          # ======================================================

          patch_block(
              "internal fun MainActivity.attendanceForm",
              "internal fun MainActivity.attendanceHistory()",
              [
                  (
                      'it.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"',
                      'fieldBtn.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"'
                  ),
                  (
                      'it.text="Status: $status"',
                      'statusBtn.text="Status: $status"'
                  )
              ]
          )


          # ======================================================
          # FIX 11
          #
          # customReport()
          # ======================================================

          patch_block(
              "internal fun MainActivity.customReport",
              "internal fun MainActivity.auditLogScreen()",
              [
                  (
                      'it.text="Worker: ${if(i==0)"All" else workers[i-1].name}"',
                      'wb.text="Worker: ${if(i==0)"All" else workers[i-1].name}"'
                  ),
                  (
                      'it.text="Field: ${if(i==0)"All" else fields[i-1].name}"',
                      'fb.text="Field: ${if(i==0)"All" else fields[i-1].name}"'
                  ),
                  (
                      'it.text="Crop: ${if(i==0)"All" else crops[i-1].name}"',
                      'cb.text="Crop: ${if(i==0)"All" else crops[i-1].name}"'
                  )
              ]
          )


          # ======================================================
          # FIX 12
          #
          # handleActivityResult()
          #
          # Original code incorrectly used:
          #
          # when(exportType) {
          #     exportType.startsWith(...) -> ...
          # }
          #
          # A String subject cannot have Boolean branch labels.
          #
          # Correct form:
          #
          # when {
          #     exportType == ...
          #     exportType.startsWith(...)
          # }
          # ======================================================

          old_export = '''contentResolver.openOutputStream(uri)!!.use{out->when(exportType){
                    "workers"->app.export.csvWorkers(out)
                    "ledger"->app.export.csvLedger(out)
                    exportType.startsWith("report:")->app.export.csvReport(exportType.removePrefix("report:"),out)
                    exportType.startsWith("reportpdf:")->app.export.pdfReport(exportType.removePrefix("reportpdf:"),out)
                    "pdf"->app.export.pdfSummary(out)
                    "backup"->app.backup.export(out)
                }}'''

          new_export = '''contentResolver.openOutputStream(uri)!!.use{out->when{
                    exportType=="workers"->app.export.csvWorkers(out)
                    exportType=="ledger"->app.export.csvLedger(out)
                    exportType.startsWith("report:")->app.export.csvReport(exportType.removePrefix("report:"),out)
                    exportType.startsWith("reportpdf:")->app.export.pdfReport(exportType.removePrefix("reportpdf:"),out)
                    exportType=="pdf"->app.export.pdfSummary(out)
                    exportType=="backup"->app.backup.export(out)
                    else->throw IllegalArgumentException("Unknown export type: $exportType")
                }}'''

          if old_export not in source:

              if new_export not in source:
                  raise SystemExit(
                      "ERROR: exportType block not found"
                  )

          else:

              source = source.replace(
                  old_export,
                  new_export,
                  1
              )


          # ======================================================
          # FIX 13
          #
          # attendanceCalendar()
          #
          # render() calls renderSummary(), but the original local
          # function was declared after render().
          #
          # Move renderSummary() before render().
          # ======================================================

          calendar_start = source.find(
              "internal fun MainActivity.attendanceCalendar(){"
          )

          if calendar_start < 0:
              raise SystemExit(
                  "ERROR: attendanceCalendar() not found"
              )

          calendar_end = source.find(
              "internal fun MainActivity.paymentLedger()",
              calendar_start
          )

          if calendar_end < 0:
              raise SystemExit(
                  "ERROR: paymentLedger() marker not found"
              )

          calendar = source[
              calendar_start:calendar_end
          ]


          render_match = re.search(
              r'        fun render\(\)\{.*?'
              r'\n        \}\n'
              r'        fun renderSummary\(\)\{',
              calendar,
              re.S
          )

          if not render_match:
              raise SystemExit(
                  "ERROR: attendance render()/renderSummary() block not found"
              )


          render_part = render_match.group(0)

          render_part = render_part[
              :-len("        fun renderSummary(){")
          ]


          summary_start = (
              render_match.start()
              + render_match.group(0).rfind(
                  "        fun renderSummary(){"
              )
          )


          summary_match = re.search(
              r'        fun renderSummary\(\)\{.*?'
              r'\n        \}\n\n'
              r'        val nav=',
              calendar[summary_start:],
              re.S
          )

          if not summary_match:
              raise SystemExit(
                  "ERROR: renderSummary() body not found"
              )


          summary_block = summary_match.group(0)

          summary_block = summary_block[
              :-len("\n\n        val nav=")
          ]


          region_start = render_match.start()

          region_end = (
              summary_start
              + summary_match.end()
          )


          new_calendar_region = (
              summary_block
              + "\n"
              + render_part
              + "\n\n"
              + "        val nav="
          )


          calendar = (
              calendar[:region_start]
              + new_calendar_region
              + calendar[region_end:]
          )


          source = (
              source[:calendar_start]
              + calendar
              + source[calendar_end:]
          )


          # ======================================================
          # WRITE PATCHED SOURCE
          # ======================================================

          file.write_text(
              source,
              encoding="utf-8"
          )

          print("RELEASE_SOURCE_PATCH=PASS")
          PY


          echo ""
          echo "=========================================="
          echo "RELEASE SOURCE AUDIT"
          echo "=========================================="


          # ------------------------------------------------------
          # btn() must have optional action.
          # ------------------------------------------------------

          grep -Fq \
            'internal fun MainActivity.btn(s:String,action:()->Unit = {})' \
            "$FILE"


          # ------------------------------------------------------
          # Old exportType syntax must be gone.
          # ------------------------------------------------------

          if grep -Fq \
            'when(exportType){' \
            "$FILE"; then

            echo "ERROR: old invalid when(exportType) remains"
            exit 1

          fi


          # ------------------------------------------------------
          # No unresolved setItems it.text references.
          #
          # Exactly three it.text references are legitimate:
          # statusViews.forEach{it.text=...}
          # ------------------------------------------------------

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          file = Path(sys.argv[1])
          text = file.read_text(encoding="utf-8")

          lines = text.splitlines()

          bad = []

          for number, line in enumerate(lines, 1):

              if "it.text=" in line:

                  if "statusViews.forEach" not in line:
                      bad.append(
                          f"{number}: {line}"
                      )

          if bad:

              print(
                  "ERROR: unresolved it.text references found:"
              )

              for item in bad:
                  print(item)

              raise SystemExit(1)

          print(
              "UI_BUTTON_TEXT_SCOPE_AUDIT=PASS"
          )
          PY


          # ------------------------------------------------------
          # renderSummary must appear BEFORE render in
          # attendanceCalendar().
          # ------------------------------------------------------

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(
              encoding="utf-8"
          )

          start = text.find(
              "internal fun MainActivity.attendanceCalendar(){"
          )

          end = text.find(
              "internal fun MainActivity.paymentLedger()",
              start
          )

          if start < 0 or end < 0:
              raise SystemExit(
                  "ERROR: attendanceCalendar boundaries not found"
              )

          block = text[start:end]

          summary = block.find(
              "fun renderSummary(){"
          )

          render = block.find(
              "fun render(){"
          )

          if summary < 0 or render < 0:
              raise SystemExit(
                  "ERROR: render functions missing"
              )

          if summary >= render:
              raise SystemExit(
                  "ERROR: renderSummary() still appears after render()"
              )

          print(
              "ATTENDANCE_RENDER_ORDER=PASS"
          )
          PY


          # ------------------------------------------------------
          # Safe Step 4 fixes must remain.
          # ------------------------------------------------------

          ! grep -Fq \
            "app.audit.auditLog()" \
            "$FILE"

          ! grep -Fq \
            "app.audit.clearAuditLog()" \
            "$FILE"

          ! grep -Fq \
            "getSystemService(ALARM_SERVICE)" \
            "$FILE"


          grep -Fq \
            "app.audit.list()" \
            "$FILE"

          grep -Fq \
            "app.audit.clear()" \
            "$FILE"

          grep -Fq \
            "Context.ALARM_SERVICE" \
            "$FILE"


          echo ""
          echo "=========================================="
          echo "SOURCE_AUDIT=PASS"
          echo "=========================================="


          # ======================================================
          # ACTUAL RELEASE KOTLIN COMPILATION
          # ======================================================

          echo ""
          echo "=========================================="
          echo "RELEASE KOTLIN COMPILATION"
          echo "=========================================="

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --no-parallel \
            :app:compileReleaseKotlin


          echo ""
          echo "=========================================="
          echo "KOTLIN_COMPILATION=PASS"
          echo "=========================================="


          # ======================================================
          # ACTUAL RELEASE APK BUILD
          # ======================================================

          echo ""
          echo "=========================================="
          echo "ASSEMBLING RELEASE APK"
          echo "=========================================="

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --no-parallel \
            :app:assembleRelease


          APK="app/build/outputs/apk/release/app-release-unsigned.apk"


          # ------------------------------------------------------
          # APK must exist.
          # ------------------------------------------------------

          if [ ! -s "$APK" ]; then

            echo ""
            echo "=========================================="
            echo "ERROR: RELEASE APK NOT CREATED"
            echo "=========================================="

            echo ""
            echo "Release output files:"

            find app/build/outputs \
              -maxdepth 5 \
              -type f \
              -print \
              2>/dev/null || true

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "RELEASE APK BUILD SUCCESS"
          echo "=========================================="

          echo "APK:"
          ls -lh "$APK"

          echo ""
          echo "APK PATH:"
          realpath "$APK"

          echo ""
          echo "=========================================="
          echo "BUILD_RELEASE_APK=PASS"
          echo "=========================================="


      # ==========================================================
      # 13. VERIFY UNSIGNED APK
      # ==========================================================

      - name: Verify unsigned APK
        working-directory: project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          echo "APK SIZE:"
          du -h "$APK"

          echo ""
          echo "APK BADGING:"

          aapt dump badging "$APK" \
            | head -n 5

          aapt dump badging "$APK" \
            | grep -Fq \
            "package: name='${PACKAGE_NAME}'"

          aapt dump badging "$APK" \
            | grep -Fq \
            "versionCode='${VERSION_CODE}'"

          aapt dump badging "$APK" \
            | grep -Fq \
            "versionName='${VERSION_NAME}'"

          unzip -t "$APK" \
            >/dev/null

          echo "UNSIGNED_APK_VERIFICATION=PASS"


      # ==========================================================
      # 14. RESTORE RELEASE KEYSTORE
      # ==========================================================

      - name: Restore release keystore
        working-directory: project
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

          keytool -list \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "RELEASE_KEYSTORE=PASS"


      # ==========================================================
      # 15. ZIPALIGN
      # ==========================================================

      - name: Align APK
        working-directory: project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          zipalign \
            -f \
            -p \
            4 \
            "$APK" \
            app-release-aligned.apk

          zipalign \
            -c \
            -v \
            4 \
            app-release-aligned.apk

          test -s app-release-aligned.apk

          echo "ZIPALIGN=PASS"


      # ==========================================================
      # 16. SIGN APK
      # ==========================================================

      - name: Sign Release APK
        working-directory: project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            app-release-aligned.apk

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk

          echo "APK_SIGNING=PASS"


      # ==========================================================
      # 17. VERIFY SIGNED APK
      # ==========================================================

      - name: Verify signed APK
        working-directory: project
        shell: bash
        run: |
          set -e

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$APK"

          apksigner verify \
            --verbose \
            --print-certs \
            "$APK"

          zipalign \
            -c \
            -v \
            4 \
            "$APK"

          aapt dump badging "$APK" \
            | grep -Fq \
            "package: name='${PACKAGE_NAME}'"

          aapt dump badging "$APK" \
            | grep -Fq \
            "versionCode='${VERSION_CODE}'"

          aapt dump badging "$APK" \
            | grep -Fq \
            "versionName='${VERSION_NAME}'"

          unzip -t "$APK" \
            >/dev/null

          echo "SIGNED_APK_VERIFICATION=PASS"


      # ==========================================================
      # 18. SHA256
      # ==========================================================

      - name: Generate SHA256
        working-directory: project
        shell: bash
        run: |
          set -e

          sha256sum \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            | tee \
            artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          echo "SHA256=PASS"


      # ==========================================================
      # 19. UPLOAD FINAL APK
      # ==========================================================

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-v1.77.0-release

          path: |
            project/artifacts/Majdoor-Hisaab-PRO-release.apk
            project/artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          if-no-files-found: error

          retention-days: 30


      # ==========================================================
      # 20. FINAL SUCCESS
      # ==========================================================

      - name: FINAL BUILD SUCCESS
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       MAJDOOR HISAAB PRO"
          echo "       RELEASE BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Package     : ${PACKAGE_NAME}"
          echo "Version     : ${VERSION_NAME}"
          echo "VersionCode : ${VERSION_CODE}"
          echo ""
          echo "SIGNED APK CREATED SUCCESSFULLY"
          echo ""
          echo "=========================================="
