name: MAJDOOR HISAAB PRO — FINAL RELEASE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

jobs:
  build-test-sign-runtime:
    name: FINAL BUILD / TEST / SIGN / RUNTIME
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. EXTRACT LOCKED PROJECT ZIP
      # ============================================================

      - name: Extract locked project ZIP into repository root
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="Majdoor_Hisaab_PRO_FINAL_LOCKED.zip"

          test -s "$ZIP"

          rm -rf .mhp-extract
          mkdir -p .mhp-extract

          unzip -q "$ZIP" -d .mhp-extract

          test -s .mhp-extract/settings.gradle.kts
          test -s .mhp-extract/build.gradle.kts
          test -s .mhp-extract/app/build.gradle.kts
          test -s .mhp-extract/gradlew
          test -s .mhp-extract/gradlew.bat
          test -s .mhp-extract/gradle/wrapper/gradle-wrapper.properties
          test -s .mhp-extract/gradle/wrapper/gradle-wrapper.jar

          cp -a .mhp-extract/. .

          rm -rf .mhp-extract

          chmod +x ./gradlew
          chmod +x scripts/*.sh

          test -x ./gradlew

          echo "ZIP_PROJECT_EXTRACTION=PASS"


      # ============================================================
      # 3. VERIFY ANDROID PROJECT / PINNED TOOLCHAIN
      # ============================================================

      - name: Verify Android project and pinned toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          test -x gradlew
          test -f gradlew.bat

          test -s gradle/wrapper/gradle-wrapper.properties
          test -s gradle/wrapper/gradle-wrapper.jar

          grep -q 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip' \
            gradle/wrapper/gradle-wrapper.properties

          grep -q 'distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' \
            gradle/wrapper/gradle-wrapper.properties

          grep -q 'id("com.android.application") version "8.9.1"' \
            build.gradle.kts

          grep -q 'id("org.jetbrains.kotlin.android") version "2.1.21"' \
            build.gradle.kts

          grep -q 'applicationId = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -q 'versionCode = 77' \
            app/build.gradle.kts

          grep -q 'versionName = "1.77.0"' \
            app/build.gradle.kts

          grep -q 'compileSdk = 36' \
            app/build.gradle.kts

          grep -q 'targetSdk = 36' \
            app/build.gradle.kts

          grep -q 'jvmTarget = "17"' \
            app/build.gradle.kts

          echo "ANDROID_PROJECT_AND_TOOLCHAIN=PASS"


      # ============================================================
      # 4. JDK 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator"
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"


      # ============================================================
      # 6. ANDROID EMULATOR LINUX DEPENDENCIES
      # ============================================================

      - name: Install Android Emulator Linux dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            libpulse0 \
            libx11-6 \
            libxcb1 \
            libxdamage1 \
            libnss3 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxtst6 \
            libxrandr2 \
            libgl1 \
            libglu1-mesa \
            libfontconfig1 \
            libdbus-1-3 \
            libasound2t64

          sudo ldconfig

          ldconfig -p | grep -F "libpulse.so.0"

          test -n "$(ldconfig -p | grep -F "libpulse.so.0" || true)"

          echo "ANDROID_EMULATOR_LINUX_DEPS=PASS"


      # ============================================================
      # 7. INSTALL ANDROID API 36 / BUILD TOOLS / EMULATOR
      # ============================================================

      - name: Install Android API 36 and build tools
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          test -n "$SDK"
          test -d "$SDK"

          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator"

          test -d "$SDK/platforms/android-36"
          test -d "$SDK/build-tools/36.0.0"
          test -d "$SDK/platform-tools"
          test -d "$SDK/emulator"

          test -x "$SDK/platform-tools/adb"
          test -x "$SDK/emulator/emulator"
          test -x "$SDK/build-tools/36.0.0/zipalign"
          test -x "$SDK/build-tools/36.0.0/apksigner"

          echo "ANDROID_SDK_API_36=PASS"
          echo "ANDROID_BUILD_TOOLS_36=PASS"
          echo "ANDROID_EMULATOR=PASS"


      # ============================================================
      # 8. CONFIGURE ANDROID SDK PATH
      # ============================================================

      - name: Configure Android SDK tool PATH
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          test -n "$SDK"
          test -d "$SDK"

          PLATFORM_TOOLS="$SDK/platform-tools"
          EMULATOR_DIR="$SDK/emulator"
          BUILD_TOOLS_DIR="$SDK/build-tools/${BUILD_TOOLS}"
          CMDLINE_ROOT="$SDK/cmdline-tools"

          test -d "$PLATFORM_TOOLS"
          test -d "$EMULATOR_DIR"
          test -d "$BUILD_TOOLS_DIR"
          test -d "$CMDLINE_ROOT"

          CMDLINE_BIN=""

          if [ -d "$CMDLINE_ROOT/22.0/bin" ]; then
            CMDLINE_BIN="$CMDLINE_ROOT/22.0/bin"
          elif [ -d "$CMDLINE_ROOT/latest/bin" ]; then
            CMDLINE_BIN="$CMDLINE_ROOT/latest/bin"
          else
            CMDLINE_BIN="$(
              find "$CMDLINE_ROOT" \
                -mindepth 2 \
                -maxdepth 2 \
                -type d \
                -name bin \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$CMDLINE_BIN"
          test -d "$CMDLINE_BIN"

          test -x "$CMDLINE_BIN/sdkmanager"
          test -x "$CMDLINE_BIN/apkanalyzer"
          test -x "$CMDLINE_BIN/avdmanager"

          echo "$PLATFORM_TOOLS" >> "$GITHUB_PATH"
          echo "$EMULATOR_DIR" >> "$GITHUB_PATH"
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"

          export PATH="$PLATFORM_TOOLS:$EMULATOR_DIR:$BUILD_TOOLS_DIR:$CMDLINE_BIN:$PATH"

          test -x "$PLATFORM_TOOLS/adb"
          test -x "$EMULATOR_DIR/emulator"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          test -x "$CMDLINE_BIN/sdkmanager"
          test -x "$CMDLINE_BIN/apkanalyzer"
          test -x "$CMDLINE_BIN/avdmanager"

          echo "ANDROID_SDK_ROOT=$SDK"
          echo "ANDROID_CMDLINE_TOOLS=$CMDLINE_BIN"
          echo "ANDROID_SDK_PATH=PASS"


      # ============================================================
      # 9. VERIFY ANDROID SDK TOOLS
      # ============================================================

      - name: Verify Android SDK tools
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "PATH=$PATH"

          command -v adb
          command -v sdkmanager
          command -v apkanalyzer
          command -v avdmanager
          command -v emulator
          command -v zipalign
          command -v apksigner

          test -x "$(command -v adb)"
          test -x "$(command -v sdkmanager)"
          test -x "$(command -v apkanalyzer)"
          test -x "$(command -v avdmanager)"
          test -x "$(command -v emulator)"
          test -x "$(command -v zipalign)"
          test -x "$(command -v apksigner)"

          adb version
          sdkmanager --version
          emulator -version

          zipalign -h >/dev/null 2>&1 || true
          apksigner >/dev/null 2>&1 || true

          echo "ANDROID_SDK_TOOLS=PASS"


      # ============================================================
      # 10. SETUP VERIFIED GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          validate-wrappers: true


      # ============================================================
      # 11. PREPARE GRADLE LAUNCHER
      # ============================================================

      - name: Prepare Gradle launcher
        shell: bash
        run: |
          set -Eeuo pipefail

          command -v gradle

          gradle --version

          gradle --version |
            grep -F "Gradle ${GRADLE_VERSION}"

          test -x "$(command -v gradle)"

          if [ -f gradlew ]; then
            mv gradlew gradlew.locked
          fi

          cat > gradlew <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec gradle "$@"
          EOF

          chmod +x gradlew

          test -x ./gradlew

          ./gradlew --version |
            grep -F "Gradle ${GRADLE_VERSION}"

          echo "GRADLE_8_11_1=PASS"
          echo "GRADLE_LAUNCHER=PASS"


      # ============================================================
      # 12. STATIC ACCEPTANCE GATES
      # ============================================================

      - name: Static acceptance gates
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "CLEAN_RUNNER=github-hosted-ubuntu-latest"

          ./scripts/acceptance-gates.sh


      # ============================================================
      # 13. DEPENDENCY HEALTH MODULE BRIDGE
      #
      # Android configurations:
      #
      # debugRuntimeClasspath
      # releaseRuntimeClasspath
      # e2eReleaseRuntimeClasspath
      # debugUnitTestRuntimeClasspath
      #
      # The old generic:
      #
      # testRuntimeClasspath
      #
      # does NOT exist in this Android :app project.
      #
      # Therefore:
      #
      # testRuntimeClasspath
      #        ->
      # debugUnitTestRuntimeClasspath
      #
      # ============================================================

      - name: Install dependency health Gradle module bridge
        shell: bash
        run: |
          set -Eeuo pipefail

          test -x ./gradlew

          mv ./gradlew ./gradlew.real

          cat > ./gradlew <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          ROOT="$(cd "$(dirname "$0")" && pwd)"
          REAL="$ROOT/gradlew.real"

          test -x "$REAL"

          args=("$@")

          has_dependencies=0
          has_app_dependencies=0
          configuration=""

          for ((i=0; i<${#args[@]}; i++)); do
            case "${args[$i]}" in

              dependencies)
                has_dependencies=1
                ;;

              :app:dependencies)
                has_app_dependencies=1
                ;;

              --configuration)
                if (( i + 1 < ${#args[@]} )); then
                  configuration="${args[$((i + 1))]}"
                fi
                ;;

              --configuration=*)
                configuration="${args[$i]#--configuration=}"
                ;;

            esac
          done

          # ----------------------------------------------------------
          # Android mapping for legacy generic test configuration
          # ----------------------------------------------------------

          if [[ "$configuration" == "testRuntimeClasspath" ]]; then
            configuration="debugUnitTestRuntimeClasspath"
          fi

          case "$configuration" in

            debugRuntimeClasspath|\
            debugUnitTestRuntimeClasspath|\
            testRuntimeClasspath|\
            e2eReleaseRuntimeClasspath|\
            releaseRuntimeClasspath)

              ANDROID_VARIANT_CONFIGURATION=1
              ;;

            *)

              ANDROID_VARIANT_CONFIGURATION=0
              ;;

          esac

          if \
            (( has_dependencies == 1 )) && \
            (( has_app_dependencies == 0 )) && \
            (( ANDROID_VARIANT_CONFIGURATION == 1 ))
          then

            rewritten=()

            for arg in "${args[@]}"; do

              if [[ "$arg" == "dependencies" ]]; then

                rewritten+=(":app:dependencies")

              elif [[ "$arg" == "testRuntimeClasspath" ]]; then

                rewritten+=("debugUnitTestRuntimeClasspath")

              elif [[ "$arg" == "--configuration=testRuntimeClasspath" ]]; then

                rewritten+=("--configuration=debugUnitTestRuntimeClasspath")

              else

                rewritten+=("$arg")

              fi

            done

            echo "DEPENDENCY_HEALTH_BRIDGE:"
            echo "  configuration=${configuration}"
            echo "  root task=dependencies"
            echo "  module=:app"
            echo "  effective configuration=${configuration}"

            exec "$REAL" "${rewritten[@]}"
          fi

          exec "$REAL" "$@"
          EOF

          chmod +x ./gradlew

          test -x ./gradlew
          test -x ./gradlew.real

          echo "Testing Android dependency configuration..."

          ./gradlew \
            --no-daemon \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            >/dev/null

          echo "Testing Android unit-test dependency configuration..."

          ./gradlew \
            --no-daemon \
            :app:dependencies \
            --configuration debugUnitTestRuntimeClasspath \
            >/dev/null

          echo "DEPENDENCY_HEALTH_MODULE_BRIDGE=PASS"


      # ============================================================
      # 14. DEPENDENCY HEALTH
      # ============================================================

      - name: Dependency health
        shell: bash
        run: |
          set -Eeuo pipefail

          test -x ./gradlew
          test -x ./gradlew.real
          test -s ./scripts/dependency-health.sh

          ./scripts/dependency-health.sh


      # ============================================================
      # 14B. RESTORE NORMAL GRADLE LAUNCHER
      # ============================================================

      - name: Restore normal Gradle launcher
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [ -f ./gradlew.real ]; then
            rm -f ./gradlew
            mv ./gradlew.real ./gradlew
            chmod +x ./gradlew
          fi

          test -x ./gradlew

          echo "GRADLE_LAUNCHER_RESTORED=PASS"


      # ============================================================
      # 15. GRADLE KOTLIN COMPATIBILITY
      # ============================================================

      - name: Gradle Kotlin compatibility
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/gradle-kotlin-compatibility.sh


      # ============================================================
      # 16. GRADLE AGP COMPATIBILITY
      # ============================================================

      - name: Gradle AGP compatibility
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/gradle-agp-compatibility.sh


      # ============================================================
      # 17. ARCHITECTURE GATE
      # ============================================================

      - name: Architecture gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase15-architecture-gate.sh


      # ============================================================
      # 18. CONFIGURATION LIFECYCLE GATE
      # ============================================================

      - name: Configuration lifecycle gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase18-configuration-lifecycle-gate.sh


      # ============================================================
      # 19. OFFLINE FIRST GATE
      # ============================================================

      - name: Offline first gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase19-offline-first-gate.sh


      # ============================================================
      # 20. SECURITY DATA GATE
      # ============================================================

      - name: Security data gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase20-security-data-gate.sh


      # ============================================================
      # 21. UI UX GATE
      # ============================================================

      - name: UI UX gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase21-ui-ux-gate.sh


      # ============================================================
      # 22. CLEAN DEPENDENCY RESOLUTION
      # ============================================================

      - name: Clean dependency resolution
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration debugRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration debugUnitTestRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration e2eReleaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration releaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            buildEnvironment

          echo "CLEAN_DEPENDENCY_RESOLUTION=PASS"


      # ============================================================
      # 23. UNIT TESTS
      # ============================================================

      - name: Unit tests
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew --no-daemon test


      # ============================================================
      # 24. COMPILE ALL REQUIRED VARIANTS
      # ============================================================

      - name: Compile all required variants
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugKotlin \
            compileDebugJavaWithJavac \
            assembleDebug \
            compileE2eReleaseKotlin \
            assembleE2eRelease \
            compileReleaseKotlin \
            assembleRelease \
            assembleReleaseAndroidTest


      # ============================================================
      # 25. VERIFY DEBUG APK
      # ============================================================

      - name: Verify Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" |
            grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" |
            grep -Fx "$VERSION_NAME"

          apkanalyzer manifest version-code "$APK" |
            grep -Fx "$VERSION_CODE"

          mkdir -p artifacts/debug

          cp "$APK" \
            artifacts/debug/Majdoor-Hisaab-PRO-debug.apk

          sha256sum "$APK" |
            tee artifacts/debug/Majdoor-Hisaab-PRO-debug.sha256


      # ============================================================
      # 26. RELEASE BUILD GATE
      # ============================================================

      - name: Release build gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/release-build-gate.sh


      # ============================================================
      # 27. VERIFY UNSIGNED RELEASE APK
      # ============================================================

      - name: Verify unsigned Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" |
            grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" |
            grep -Fx "$VERSION_NAME"

          apkanalyzer manifest version-code "$APK" |
            grep -Fx "$VERSION_CODE"

          mkdir -p artifacts

          cp "$APK" \
            artifacts/app-release-unsigned.apk

          unzip -t "$APK" >/dev/null


      # ============================================================
      # 28. RESTORE PRODUCTION SIGNING KEY
      # ============================================================

      - name: Restore production signing key
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$EXPECTED_CERT"

          printf '%s' "$KEYSTORE_B64" |
            base64 --decode > release.keystore

          test -s release.keystore

          keytool -list -v \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > cert.txt

          ACTUAL_CERT="$(
            awk -F': ' '/SHA256:/{print $2; exit}' cert.txt |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_CERT="$(
            printf '%s' "$EXPECTED_CERT" |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )"

          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

          echo "PRODUCTION_CERTIFICATE=PASS"


      # ============================================================
      # 29. SIGN PRODUCTION RELEASE APK
      # ============================================================

      - name: Sign production Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app-release-aligned.apk"
          SIGNED="artifacts/Majdoor-Hisaab-PRO-release.apk"

          TEST_UNSIGNED="app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          TEST_ALIGNED="app-release-androidTest-aligned.apk"
          TEST_SIGNED="artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

          test -s "$UNSIGNED"
          test -s "$TEST_UNSIGNED"
          test -s release.keystore

          zipalign \
            -f \
            -p 4 \
            "$UNSIGNED" \
            "$ALIGNED"

          zipalign \
            -c \
            -v 4 \
            "$ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          test -s "$SIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$SIGNED" |
            tee artifacts/release-signature.txt

          ACTUAL_SIGNED_CERT="$(
            apksigner verify \
              --print-certs \
              "$SIGNED" |
            awk -F': ' \
              '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_SIGNED_CERT="$(
            printf '%s' "$EXPECTED_CERT" |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )"

          test -n "$ACTUAL_SIGNED_CERT"
          test "$ACTUAL_SIGNED_CERT" = "$EXPECTED_SIGNED_CERT"

          unzip -t "$SIGNED" >/dev/null

          zipalign \
            -c \
            -v 4 \
            "$SIGNED"

          zipalign \
            -f \
            -p 4 \
            "$TEST_UNSIGNED" \
            "$TEST_ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$TEST_SIGNED" \
            "$TEST_ALIGNED"

          test -s "$TEST_SIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$TEST_SIGNED" >/dev/null

          rm -f \
            "$ALIGNED" \
            "$TEST_ALIGNED" \
            cert.txt \
            release.keystore

          echo "PRODUCTION_SIGNING=PASS"


      # ============================================================
      # 30. PRODUCTION SIGNING GATE
      # ============================================================

      - name: Production signing gate
        env:
          MH_RELEASE_CERT_SHA256: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/production-signing-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk


      # ============================================================
      # 31. VERIFY FINAL SIGNED APK
      # ============================================================

      - name: Verify final signed APK and checksum
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" |
