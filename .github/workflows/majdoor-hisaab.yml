name: Majdoor Hisaab PRO - V81 Fixed Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V81-ALL-BUTTONS-FINAL.zip"

jobs:

  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SHOW REPOSITORY
      # ============================================================
      - name: Show repository files
        shell: bash
        run: |
          echo "===== Repository root ====="
          ls -la

          echo
          echo "===== ZIP files ====="
          find . -maxdepth 3 -type f \
            \( -iname "*.zip" -o -iname "*.gradle" -o -iname "*.gradle.kts" \) \
            -print | sort

      # ============================================================
      # 3. LOCATE / EXTRACT V81 PROJECT
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          FOUND_ROOT=""

          # First: current repository itself
          if [[ -f "settings.gradle.kts" ]] && [[ -f "app/build.gradle.kts" ]]; then
            FOUND_ROOT="$PWD"
          fi

          # Second: exact V81 ZIP
          if [[ -z "$FOUND_ROOT" ]] && [[ -f "$ZIP_NAME" ]]; then
            echo "Found exact V81 ZIP: $ZIP_NAME"

            rm -rf extracted_project
            mkdir -p extracted_project

            unzip -q "$ZIP_NAME" -d extracted_project

            FOUND_ROOT="$(find "$PWD/extracted_project" \
              -type f \
              -name "settings.gradle.kts" \
              -print -quit | xargs -r dirname)"

            if [[ -z "$FOUND_ROOT" ]]; then
              echo "ERROR: settings.gradle.kts not found inside V81 ZIP"
              exit 1
            fi
          fi

          # Third: find any Android project as fallback
          if [[ -z "$FOUND_ROOT" ]]; then
            FOUND_ROOT="$(find "$PWD" \
              -type f \
              -name "settings.gradle.kts" \
              -print | while read -r f; do
                d="$(dirname "$f")"
                if [[ -f "$d/app/build.gradle.kts" ]]; then
                  echo "$d"
                  break
                fi
              done)"
          fi

          if [[ -z "$FOUND_ROOT" ]]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "ANDROID_PROJECT_ROOT=$FOUND_ROOT" >> "$GITHUB_ENV"

          echo
          echo "===== Android project ====="
          echo "$FOUND_ROOT"

          echo
          echo "===== Project files ====="
          find "$FOUND_ROOT" -maxdepth 3 -type f \
            \( -name "*.kt" -o -name "*.gradle.kts" -o -name "*.xml" \) \
            | sort | head -300

      # ============================================================
      # 4. JAVA
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          sdkmanager --list_installed | grep -E \
            "platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}|platform-tools" \
            || true

      # ============================================================
      # 6. GRADLE
      # ============================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ============================================================
      # 7. PROJECT CONFIGURATION CHECK
      # ============================================================
      - name: Verify project configuration
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "===== settings.gradle.kts ====="
          sed -n '1,240p' settings.gradle.kts

          echo
          echo "===== app/build.gradle.kts ====="
          sed -n '1,320p' app/build.gradle.kts

          echo
          echo "===== Required values ====="

          grep -q 'com.majdoor.hisaab' app/build.gradle.kts \
            || {
              echo "ERROR: Package name com.majdoor.hisaab not found"
              exit 1
            }

          grep -q 'compileSdk.*36\|compileSdk = 36' app/build.gradle.kts \
            || {
              echo "ERROR: compileSdk 36 not found"
              exit 1
            }

          grep -q 'targetSdk.*36\|targetSdk = 36' app/build.gradle.kts \
            || {
              echo "ERROR: targetSdk 36 not found"
              exit 1
            }

          grep -q 'versionCode.*77\|versionCode = 77' app/build.gradle.kts \
            || {
              echo "ERROR: versionCode 77 not found"
              exit 1
            }

          grep -q 'versionName.*1.77.0\|versionName = "1.77.0"' app/build.gradle.kts \
            || {
              echo "ERROR: versionName 1.77.0 not found"
              exit 1
            }

          echo
          echo "PROJECT CONFIGURATION OK"

      # ============================================================
      # 8. FIX V81 KOTLIN SOURCE
      # ============================================================
      - name: Apply V81 Kotlin compile fixes
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          export PROJECT_ROOT="$PWD"

          python3 <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"])

          files = list(
              root.rglob("MainActivityScreens.kt")
          )

          if not files:
              raise SystemExit(
                  "ERROR: MainActivityScreens.kt not found"
              )

          src = files[0]
          text = src.read_text(encoding="utf-8")

          original = text

          print("Patching:")
          print(src)

          # ========================================================
          # FIX 1:
          # btn() must have a default action.
          #
          # Old:
          # fun ... btn(s:String,action:()->Unit)
          #
          # New:
          # fun ... btn(s:String,action:()->Unit = {})
          # ========================================================

          old = "internal fun MainActivity.btn(s:String,action:()->Unit)=TextView(this).apply{"
          new = "internal fun MainActivity.btn(s:String,action:()->Unit = {})=TextView(this).apply{"

          if old in text:
              text = text.replace(old, new, 1)
              print("FIXED: btn() default action")
          elif new in text:
              print("OK: btn() already has default action")
          else:
              print("WARNING: btn() signature pattern not found")

          # ========================================================
          # FIX 2:
          # ScrollView fillViewport property
          #
          # Old:
          # fillViewport=true
          #
          # New:
          # setFillViewport(true)
          # ========================================================

          if "fillViewport=true" in text:
              text = text.replace(
                  "fillViewport=true",
                  "setFillViewport(true)"
              )
              print("FIXED: ScrollView fillViewport")

          # ========================================================
          # FIX 3:
          # pick() returns TextView because btn() returns TextView.
          # ========================================================

          old = "onPick:(Int)->Unit):Button {"
          new = "onPick:(Int)->Unit):TextView {"

          if old in text:
              text = text.replace(old, new, 1)
              print("FIXED: pick() return type")

          # ========================================================
          # FIX 4:
          # statusViews is Map<String, TextView>.
          # forEach { it } gives Pair, not TextView.
          # ========================================================

          text = text.replace(
              'statusViews.forEach{it.text="FULL"}',
              'statusViews.values.forEach{it.text="FULL"}'
          )

          text = text.replace(
              'statusViews.forEach{it.text="HALF"}',
              'statusViews.values.forEach{it.text="HALF"}'
          )

          text = text.replace(
              'statusViews.forEach{it.text=AttendanceRules.UNMARKED}',
              'statusViews.values.forEach{it.text=AttendanceRules.UNMARKED}'
          )

          print("FIXED: statusViews map iteration")

          # ========================================================
          # FIX 5:
          # Crop form button
          # ========================================================

          text = text.replace(
              'fieldId=fields[i].id;it.text="Field: ${fields[i].name}"',
              'fieldId=fields[i].id;fb.text="Field: ${fields[i].name}"'
          )

          # ========================================================
          # FIX 6:
          # Nested crop selector buttons
          # ========================================================

          text = text.replace(
              'cropId=crops[i].id;it.text="Crop: ${crops[i].name}"',
              'cropId=crops[i].id;cropBtn.text="Crop: ${crops[i].name}"'
          )

          # ========================================================
          # FIX 7:
          # Work form field button
          # ========================================================

          text = text.replace(
              'fieldId=fields[i].id;it.text="Field: ${fields[i].name}"',
              'fieldId=fields[i].id;fieldBtn.text="Field: ${fields[i].name}"'
          )

          # ========================================================
          # FIX 8:
          # Work worker selection
          # ========================================================

          text = text.replace(
              'selectedWorkers.distinct().size}"}.show()',
              'selectedWorkers.distinct().size}"}.show()'
          )

          text = text.replace(
              'setPositiveButton("Done"){_,_->it.text="Workers: ${selectedWorkers.distinct().size}"}',
              'setPositiveButton("Done"){_,_->workerBtn.text="Workers: ${selectedWorkers.distinct().size}"}'
          )

          # ========================================================
          # FIX 9:
          # Rate type button
          # ========================================================

          text = text.replace(
              'rateType=app.calculation.rateTypes()[i];it.text="Rate type: $rateType"',
              'rateType=app.calculation.rateTypes()[i];rateTypeBtn.text="Rate type: $rateType"'
          )

          # ========================================================
          # FIX 10:
          # Payment worker button
          # ========================================================

          text = text.replace(
              'wid=workers[i].id;it.text="Worker: ${workers[i].name}"',
              'wid=workers[i].id;wb.text="Worker: ${workers[i].name}"'
          )

          # ========================================================
          # FIX 11:
          # Payment method button
          # ========================================================

          text = text.replace(
              'method=methods[i];it.text="Method: ${methods[i]}"',
              'method=methods[i];mb.text="Method: ${methods[i]}"'
          )

          # ========================================================
          # FIX 12:
          # Advance button
          # ========================================================

          text = text.replace(
              'advance=!advance;it.text="Advance: ${if(advance)"YES" else "NO"}"',
              'advance=!advance;adv.text="Advance: ${if(advance)"YES" else "NO"}"'
          )

          # ========================================================
          # FIX 13:
          # Expense category
          # ========================================================

          text = text.replace(
              'cat=cats[i];it.text="Category: $cat"',
              'cat=cats[i];cb.text="Category: $cat"'
          )

          # ========================================================
          # FIX 14:
          # Expense field selector
          # ========================================================

          text = text.replace(
              'fieldId="";it.text="Field: Not linked"',
              'fieldId="";fb.text="Field: Not linked"'
          )

          text = text.replace(
              'fieldId=fields[i-1].id;it.text="Field: ${fields[i-1].name}"',
              'fieldId=fields[i-1].id;fb.text="Field: ${fields[i-1].name}"'
          )

          # ========================================================
          # FIX 15:
          # Expense crop selector
          # ========================================================

          text = text.replace(
              'cropId="";it.text="Crop: Not linked"',
              'cropId="";crb.text="Crop: Not linked"'
          )

          text = text.replace(
              'cropId=crops[i-1].id;it.text="Crop: ${crops[i-1].name}"',
              'cropId=crops[i-1].id;crb.text="Crop: ${crops[i-1].name}"'
          )

          # ========================================================
          # FIX 16:
          # Report worker filter
          # ========================================================

          text = text.replace(
              'wid=if(i==0)"" else workers[i-1].id; it.text="Worker: ${if(i==0)"All" else workers[i-1].name}"',
              'wid=if(i==0)"" else workers[i-1].id; wb.text="Worker: ${if(i==0)"All" else workers[i-1].name}"'
          )

          # ========================================================
          # FIX 17:
          # Report field filter
          # ========================================================

          text = text.replace(
              'fid=if(i==0)"" else fields[i-1].id; it.text="Field: ${if(i==0)"All" else fields[i-1].name}"',
              'fid=if(i==0)"" else fields[i-1].id; fb.text="Field: ${if(i==0)"All" else fields[i-1].name}"'
          )

          # ========================================================
          # FIX 18:
          # Report crop filter
          # ========================================================

          text = text.replace(
              'cid=if(i==0)"" else crops[i-1].id; it.text="Crop: ${if(i==0)"All" else crops[i-1].name}"',
              'cid=if(i==0)"" else crops[i-1].id; cb.text="Crop: ${if(i==0)"All" else crops[i-1].name}"'
          )

          # ========================================================
          # FIX 19:
          # Work template rate type
          # ========================================================

          text = text.replace(
              'rateType=app.calculation.rateTypes()[i];it.text="Rate type: $rateType"',
              'rateType=app.calculation.rateTypes()[i];rateTypeBtn.text="Rate type: $rateType"'
          )

          # ========================================================
          # FIX 20:
          # Attendance form field
          # ========================================================

          text = text.replace(
              'fieldId=if(i==0) "" else fields[i-1].id\n                it.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"',
              'fieldId=if(i==0) "" else fields[i-1].id\n                fieldBtn.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"'
          )

          # Same replacement for compact version, if present.
          text = text.replace(
              'fieldId=if(i==0) "" else fields[i-1].id;it.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"',
              'fieldId=if(i==0) "" else fields[i-1].id;fieldBtn.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"'
          )

          # ========================================================
          # FIX 21:
          # Attendance status button
          # ========================================================

          text = text.replace(
              'status=arrayOf("FULL","HALF","NONE")[i]\n                it.text="Status: $status"',
              'status=arrayOf("FULL","HALF","NONE")[i]\n                statusBtn.text="Status: $status"'
          )

          # ========================================================
          # FIX 22:
          # Custom report filters
          # ========================================================

          text = text.replace(
              'wid=if(i==0)"" else workers[i-1].id;it.text="Worker: ${if(i==0)"All" else workers[i-1].name}"',
              'wid=if(i==0)"" else workers[i-1].id;wb.text="Worker: ${if(i==0)"All" else workers[i-1].name}"'
          )

          text = text.replace(
              'fid=if(i==0)"" else fields[i-1].id;it.text="Field: ${if(i==0)"All" else fields[i-1].name}"',
              'fid=if(i==0)"" else fields[i-1].id;fb.text="Field: ${if(i==0)"All" else fields[i-1].name}"'
          )

          text = text.replace(
              'cid=if(i==0)"" else crops[i-1].id;it.text="Crop: ${if(i==0)"All" else crops[i-1].name}"',
              'cid=if(i==0)"" else crops[i-1].id;cb.text="Crop: ${if(i==0)"All" else crops[i-1].name}"'
          )

          # ========================================================
          # FIX 23:
          # Intent.type shadowing
          #
          # Worker form has:
          # val type=field(...)
          #
          # Therefore explicitly use receiver property.
          # ========================================================

          text = text.replace(
              'Intent(Intent.ACTION_OPEN_DOCUMENT).apply{type="image/*";',
              'Intent(Intent.ACTION_OPEN_DOCUMENT).apply{this.type="image/*";'
          )

          # ========================================================
          # FIX 24:
          # exportType String cannot be used as Boolean when branch.
          #
          # Old:
          # when(exportType) {
          #   exportType.startsWith(...)
          # }
          #
          # New:
          # when {
          #   exportType == ...
          #   exportType.startsWith(...)
          # }
          # ========================================================

          old_export = '''contentResolver.openOutputStream(uri)!!.use{out->when(exportType){
                    "workers"->app.export.csvWorkers(out)
                    "ledger"->app.export.csvLedger(out)
                    exportType.startsWith("report:")->app.export.csvReport(exportType.removePrefix("report:"),out)
                    exportType.startsWith("reportpdf:")->app.export.pdfReport(exportType.removePrefix("reportpdf:"),out)
                    "pdf"->app.export.pdfSummary(out)
                    "backup"->app.backup.export(out)
                }}'''

          new_export = '''contentResolver.openOutputStream(uri)!!.use{out->when {
                    exportType == "workers"->app.export.csvWorkers(out)
                    exportType == "ledger"->app.export.csvLedger(out)
                    exportType.startsWith("report:")->app.export.csvReport(exportType.removePrefix("report:"),out)
                    exportType.startsWith("reportpdf:")->app.export.pdfReport(exportType.removePrefix("reportpdf:"),out)
                    exportType == "pdf"->app.export.pdfSummary(out)
                    exportType == "backup"->app.backup.export(out)
                }}'''

          if old_export in text:
              text = text.replace(old_export, new_export, 1)
              print("FIXED: exportType when")
          else:
              print("INFO: exportType block may already be fixed")

          # ========================================================
          # FIX 25:
          # Attendance calendar local function forward reference.
          #
          # Kotlin local functions cannot safely reference a later
          # local function in this form.
          #
          # Move renderSummary before render.
          # ========================================================

          render_marker = "        fun render(){"
          summary_marker = "        fun renderSummary(){"
          nav_marker = "        val nav="

          if (
              render_marker in text
              and summary_marker in text
              and nav_marker in text
          ):
              r0 = text.index(render_marker)
              s0 = text.index(summary_marker, r0)
              n0 = text.index(nav_marker, s0)

              render_block = text[r0:s0]
              summary_block = text[s0:n0]

              # Only swap when renderSummary is actually after render.
              text = text[:r0] + summary_block + "\n" + render_block + text[n0:]

              print("FIXED: renderSummary declaration order")
          else:
              print("INFO: render/renderSummary markers not found")

          # ========================================================
          # FIX 26:
          # Compatibility fixes for audit/source helpers.
          # ========================================================

          replacements = {
              ".audit.auditLog": ".auditLog",
              "clearAuditLog": "clear",
              "getSystemService(ALARM_SERVICE)": "getSystemService(Context.ALARM_SERVICE)",
          }

          for a, b in replacements.items():
              if a in text:
                  text = text.replace(a, b)
                  print(f"FIXED compatibility: {a} -> {b}")

          # ========================================================
          # Write only if changed.
          # ========================================================

          if text != original:
              src.write_text(text, encoding="utf-8")
              print("SOURCE PATCH COMPLETE")
          else:
              print("WARNING: No source changes were required.")

          # ========================================================
          # Final diagnostics
          # ========================================================

          final = src.read_text(encoding="utf-8")

          print()
          print("===== FINAL PATTERN CHECK =====")

          checks = {
              "btn default action":
                  "action:()->Unit = {}" in final,

              "setFillViewport":
                  "setFillViewport(true)" in final,

              "pick TextView":
                  "onPick:(Int)->Unit):TextView" in final,

              "export when":
                  "when {" in final and "exportType.startsWith(\"report:\")" in final,

              "Intent this.type":
                  'apply{this.type="image/*";' in final,
          }

          failed = False

          for name, ok in checks.items():
              print(f"{'PASS' if ok else 'FAIL'}: {name}")
              if not ok:
                  failed = True

          # Show remaining suspicious patterns.
          suspicious = [
              "fillViewport=true",
              "statusViews.forEach{it.text=",
              "setPositiveButton(\"Done\"){_,_->it.text=",
              "rateType=app.calculation.rateTypes()[i];it.text=",
              "method=methods[i];it.text=",
              "advance=!advance;it.text=",
              "cat=cats[i];it.text=",
              "when(exportType)",
          ]

          print()
          print("===== REMAINING SUSPICIOUS PATTERNS =====")

          for p in suspicious:
              count = final.count(p)
              print(f"{count:3d}  {p}")

          if failed:
              raise SystemExit(
                  "ERROR: Required V81 source patch verification failed."
              )
          PY

      # ============================================================
      # 9. SHOW PATCHED PROBLEM AREAS
      # ============================================================
      - name: Verify patched Kotlin source
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          SRC="$(find . -name MainActivityScreens.kt -print -quit)"

          if [[ -z "$SRC" ]]; then
            echo "ERROR: MainActivityScreens.kt missing"
            exit 1
          fi

          echo "SOURCE: $SRC"

          echo
          echo "===== btn / pick ====="
          grep -n \
            -E "fun MainActivity.btn|fun MainActivity.pick" \
            "$SRC" || true

          echo
          echo "===== ScrollView ====="
          grep -n \
            -E "setFillViewport|fillViewport" \
            "$SRC" || true

          echo
          echo "===== exportType ====="
          grep -n \
            -A12 -B3 \
            "openOutputStream" \
            "$SRC" || true

          echo
          echo "===== suspicious it.text ====="
          grep -n \
            "it.text" \
            "$SRC" || true

          echo
          echo "===== render functions ====="
          grep -n \
            -E "fun render\\(|fun renderSummary\\(" \
            "$SRC" || true

      # ============================================================
      # 10. CREATE / VERIFY GRADLE
      # ============================================================
      - name: Prepare Gradle
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "settings.gradle.kts" ]]; then
            echo "ERROR: settings.gradle.kts missing"
            exit 1
          fi

          if [[ ! -f "app/build.gradle.kts" ]]; then
            echo "ERROR: app/build.gradle.kts missing"
            exit 1
          fi

          echo "Gradle project detected."

      # ============================================================
      # 11. CLEAN
      # ============================================================
      - name: Clean project
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --version

          gradle \
            --no-daemon \
            --stacktrace \
            clean

      # ============================================================
      # 12. COMPILE RELEASE KOTLIN
      # ============================================================
      - name: Compile Release Kotlin
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Compile Release Kotlin ====="

          gradle \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseKotlin

      # ============================================================
      # 13. ASSEMBLE RELEASE APK
      # ============================================================
      - name: Assemble unsigned Release APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Assemble Release APK ====="

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

          echo
          echo "===== APK files ====="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # ============================================================
      # 14. LOCATE UNSIGNED APK
      # ============================================================
      - name: Locate release APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            ! -name "*-unsigned.apk" \
            -print -quit)"

          if [[ -z "$APK" ]]; then
            APK="$(find app/build/outputs/apk/release \
              -type f \
              -name "*-unsigned.apk" \
              -print -quit)"
          fi

          if [[ -z "$APK" ]]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"

          echo "Release APK:"
          echo "$APK"

      # ============================================================
      # 15. VERIFY APK PACKAGE / VERSION
      # ============================================================
      - name: Verify APK package and version
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$RELEASE_APK"

          echo "===== APK info ====="

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt" dump badging "$APK" \
            | grep -E \
              "package: name=|versionCode=|versionName="

          BADGING="$(
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt" \
              dump badging "$APK"
          )"

          echo "$BADGING" | grep -q \
            "name='${PACKAGE_NAME}'" \
            || {
              echo "ERROR: Package name mismatch"
              exit 1
            }

          echo "$BADGING" | grep -q \
            "versionCode='${VERSION_CODE}'" \
            || {
              echo "ERROR: versionCode mismatch"
              exit 1
            }

          echo "$BADGING" | grep -q \
            "versionName='${VERSION_NAME}'" \
            || {
              echo "ERROR: versionName mismatch"
              exit 1
            }

          echo
          echo "APK PACKAGE/VERSION VERIFICATION PASSED"

      # ============================================================
      # 16. PREPARE SIGNING
      # ============================================================
      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [[ -z "${KEYSTORE_PASSWORD:-}" ]]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [[ -z "${KEY_ALIAS:-}" ]]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [[ -z "${KEY_PASSWORD:-}" ]]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/release-signing"

          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/release-signing/release.keystore"

          test -s "$RUNNER_TEMP/release-signing/release.keystore"

          echo "KEYSTORE_PATH=$RUNNER_TEMP/release-signing/release.keystore" >> "$GITHUB_ENV"

          echo "Release keystore prepared."

      # ============================================================
      # 17. ZIPALIGN
      # ============================================================
      - name: Zipalign release APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/apk"

          ZIPALIGNED="$RUNNER_TEMP/apk/Majdoor-Hisaab-PRO-${VERSION_NAME}-aligned.apk"

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/zipalign" \
            -f \
            -p \
            4 \
            "$RELEASE_APK" \
            "$ZIPALIGNED"

          test -s "$ZIPALIGNED"

          echo "ZIPALIGNED_APK=$ZIPALIGNED" >> "$GITHUB_ENV"

          echo "Zipalign complete:"
          ls -lh "$ZIPALIGNED"

      # ============================================================
      # 18. SIGN APK
      # ============================================================
      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          SIGNED="$RUNNER_TEMP/apk/Majdoor-Hisaab-PRO-${VERSION_NAME}-release-signed.apk"

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$SIGNED" \
            "$ZIPALIGNED_APK"

          test -s "$SIGNED"

          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"

          echo
          echo "===== Signed APK ====="
          ls -lh "$SIGNED"

      # ============================================================
      # 19. VERIFY SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner" verify \
            --verbose \
            "$SIGNED_APK"

          echo
          echo "APK SIGNATURE VERIFICATION PASSED"

      # ============================================================
      # 20. FINAL APK BADGING
      # ============================================================
      - name: Final APK validation
        shell: bash
        run: |
          set -euo pipefail

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging "$SIGNED_APK" \
            | grep -E \
              "package: name=|versionCode=|versionName="

          echo
          echo "===== SHA256 ====="

          sha256sum "$SIGNED_APK"

      # ============================================================
      # 21. COPY FINAL APK
      # ============================================================
      - name: Prepare final artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/final-release"

          cp "$SIGNED_APK" \
            "$GITHUB_WORKSPACE/final-release/Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/final-release/Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk" \
            > \
            "$GITHUB_WORKSPACE/final-release/SHA256SUMS.txt"

          echo
          echo "===== FINAL RELEASE ====="

          ls -lh \
            "$GITHUB_WORKSPACE/final-release"

          cat \
            "$GITHUB_WORKSPACE/final-release/SHA256SUMS.txt"

      # ============================================================
      # 22. UPLOAD APK ARTIFACT
      # ============================================================
      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-${{ env.VERSION_NAME }}-Release-Signed
          path: |
            final-release/Majdoor-Hisaab-PRO-${{ env.VERSION_NAME }}-Release-Signed.apk
            final-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 23. FINAL SUCCESS MESSAGE
      # ============================================================
      - name: Final release verification
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo " MAJDOOR HISAAB PRO - FINAL RELEASE BUILD SUCCESS"
          echo "============================================================"
          echo
          echo "Package     : ${PACKAGE_NAME}"
          echo "Version     : ${VERSION_NAME}"
          echo "VersionCode : ${VERSION_CODE}"
          echo "Android API : ${ANDROID_API}"
          echo "Java        : ${JAVA_VERSION}"
          echo "Gradle      : ${GRADLE_VERSION}"
          echo
          echo "Signed APK:"
          echo "final-release/Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"
          echo
          echo "SHA256:"
          cat final-release/SHA256SUMS.txt
          echo
          echo "============================================================"
