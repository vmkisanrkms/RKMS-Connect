name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_GANNA_PARCHI_BACKUP_APPLOCK_FINAL_V18_REFERENCE_UI_FIXED_V4_FINAL_FIXED_V3_GOOGLE_DRIVE_DIRECT_API_FANDI_V3.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

  EXPECTED_PACKAGE: "com.majdoor.hisaabpro"

jobs:

  build-release:

    name: Build Android 16 Release APK

    runs-on: ubuntu-24.04

    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 3. ANDROID SDK
      #
      # IMPORTANT:
      # setup-android v4 is used.
      # packages is intentionally empty.
      #
      # The old "tools" SDK package is obsolete and must NOT
      # be requested.
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false


      # ============================================================
      # 4. INSTALL EXACT ANDROID 36 SDK
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "Installing Android SDK"
          echo "API Level     : ${ANDROID_API}"
          echo "Build Tools   : ${BUILD_TOOLS}"
          echo "=============================================="

          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Installed SDK platforms:"
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --list_installed | \
            grep -E "platforms;android|build-tools" || true

          echo ""
          echo "Android SDK 36 installed successfully."


      # ============================================================
      # 5. VERIFY SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"
          test -d "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}"

          test -x "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt"
          test -x "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/zipalign"
          test -x "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

          echo ""
          echo "Android SDK verification PASSED."

          echo ""
          echo "Available build tools:"
          ls -la "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}" | head -30


      # ============================================================
      # 6. VERIFY SOURCE ZIP
      # ============================================================

      - name: Verify source ZIP
        shell: bash
        run: |
          set -e

          echo "Looking for:"
          echo "${ZIP_NAME}"

          if [ ! -f "${ZIP_NAME}" ]; then
            echo ""
            echo "ERROR: Required ZIP file was not found."
            echo ""
            echo "Files in repository:"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          echo ""
          echo "Source ZIP found successfully."

          ls -lh "${ZIP_NAME}"


      # ============================================================
      # 7. PREPARE BUILD DIRECTORY
      # ============================================================

      - name: Prepare build directory
        shell: bash
        run: |
          set -e

          rm -rf build-source
          mkdir -p build-source

          echo "Build directory prepared."


      # ============================================================
      # 8. EXTRACT SOURCE ZIP
      # ============================================================

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          unzip -q "${ZIP_NAME}" -d build-source

          echo "ZIP extracted."

          echo ""
          echo "Top-level extracted files:"
          find build-source -maxdepth 3 -type f | sort | head -200


      # ============================================================
      # 9. LOCATE GRADLE PROJECT
      # ============================================================

      - name: Locate Android Gradle project
        id: find_android
        shell: bash
        run: |
          set -e

          echo "Searching for gradlew..."

          GRADLEW="$(find build-source \
            -type f \
            -name "gradlew" \
            -not -path "*/node_modules/*" \
            -not -path "*/.gradle/*" \
            | head -1)"

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERROR: gradlew was not found."
            echo ""
            echo "Possible project files:"
            find build-source -maxdepth 5 -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradlew" \) \
              | sort

            exit 1
          fi

          ANDROID_DIR="$(dirname "$GRADLEW")"

          chmod +x "$GRADLEW"

          echo "gradlew=$GRADLEW"
          echo "android_dir=$ANDROID_DIR"

          echo "gradlew=$GRADLEW" >> "$GITHUB_OUTPUT"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 10. SHOW PROJECT STRUCTURE
      # ============================================================

      - name: Verify Android project
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID PROJECT"
          echo "=============================================="

          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradle-wrapper.properties" \
            -o -name "AndroidManifest.xml" \) \
            | sort | head -200

          echo ""
          echo "Gradle wrapper:"
          ls -la ./gradlew

          echo ""
          echo "Gradle wrapper version:"
          ./gradlew --version


      # ============================================================
      # 11. FORCE GRADLE VERSION 8.11.1
      # ============================================================

      - name: Enforce Gradle 8.11.1
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          WRAPPER_FILE="gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$WRAPPER_FILE" ]; then

            echo "Original Gradle wrapper:"
            cat "$WRAPPER_FILE"

            python3 - "$WRAPPER_FILE" "${GRADLE_VERSION}" <<'PY'
          import sys
          from pathlib import Path

          file = Path(sys.argv[1])
          version = sys.argv[2]

          text = file.read_text()

          import re

          text = re.sub(
              r'distributionUrl=.*',
              f'distributionUrl=https\\://services.gradle.org/distributions/gradle-{version}-bin.zip',
              text
          )

          file.write_text(text)
          PY

            echo ""
            echo "Updated Gradle wrapper:"
            cat "$WRAPPER_FILE"

          else
            echo "WARNING: gradle-wrapper.properties not found."
          fi


      # ============================================================
      # 12. CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 13. COMPILE RELEASE KOTLIN
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN"
          echo "=============================================="

          ./gradlew compileReleaseKotlin \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 14. ASSEMBLE RELEASE
      # ============================================================

      - name: Assemble Release APK
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ASSEMBLE RELEASE APK"
          echo "=============================================="

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "Release APK search:"
          find . -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print


      # ============================================================
      # 15. LOCATE APK
      # ============================================================

      - name: Locate generated Release APK
        id: locate_apk
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          APK="$(find . \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -not -name "*unsigned*" \
            | head -1)"

          if [ -z "$APK" ]; then
            APK="$(find . \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              | head -1)"
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."

            find . -type f -name "*.apk" -print || true

            exit 1
          fi

          echo "APK=$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 16. COPY APK TO FINAL DIRECTORY
      # ============================================================

      - name: Prepare final APK
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          rm -rf final
          mkdir -p final

          cp "${{ steps.locate_apk.outputs.apk }}" \
             "final/${APK_UNSIGNED_NAME}"

          echo "Unsigned/unaligned source APK copied:"
          ls -lh "final/${APK_UNSIGNED_NAME}"


      # ============================================================
      # 17. VERIFY PACKAGE NAME
      # ============================================================

      - name: Verify APK package name
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          APK="final/${APK_UNSIGNED_NAME}"

          AAPT="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt"

          echo "Inspecting APK:"
          echo "$APK"

          test -f "$APK"

          echo ""
          echo "APK badging:"
          "$AAPT" dump badging "$APK" | head -20

          PACKAGE_NAME="$(
            "$AAPT" dump badging "$APK" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )"

          echo ""
          echo "Detected package:"
          echo "$PACKAGE_NAME"

          if [ "$PACKAGE_NAME" != "$EXPECTED_PACKAGE" ]; then
            echo ""
            echo "ERROR: Wrong package name."
            echo "Expected: $EXPECTED_PACKAGE"
            echo "Found   : $PACKAGE_NAME"
            exit 1
          fi

          echo ""
          echo "Package name verification PASSED."


      # ============================================================
      # 18. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          ZIPALIGN="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/zipalign"

          INPUT_APK="final/${APK_UNSIGNED_NAME}"
          ALIGNED_APK="final/aligned-release.apk"

          echo "Running zipalign..."

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          "$ZIPALIGN" -c -P 16 -v 4 "$ALIGNED_APK"

          echo ""
          echo "Zipalign verification PASSED."

          ls -lh "$ALIGNED_APK"


      # ============================================================
      # 19. GENERATE TEMPORARY SIGNING KEY
      #
      # This creates a release-signed APK for testing/distribution.
      # For Play Store updates, use a permanent GitHub secret keystore.
      # ============================================================

      - name: Prepare signing key
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          mkdir -p signing

          KEYSTORE="signing/majdoor-hisaab-release.jks"

          if [ -n "${{ secrets.MAJDOOR_KEYSTORE_BASE64 }}" ]; then

            echo "Using GitHub signing keystore secret."

            echo "${{ secrets.MAJDOOR_KEYSTORE_BASE64 }}" | \
              base64 --decode > "$KEYSTORE"

          else

            echo "No permanent keystore secret found."
            echo "Generating temporary release keystore."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storetype JKS \
              -alias majdoor-hisaab \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "MajdoorHisaabV82" \
              -keypass "MajdoorHisaabV82" \
              -dname "CN=Majdoor Hisaab PRO, OU=Android, O=Majdoor Hisaab, L=India, ST=Uttar Pradesh, C=IN"

          fi

          test -f "$KEYSTORE"

          echo "Signing keystore ready."


      # ============================================================
      # 20. SIGN APK
      # ============================================================

      - name: Sign Release APK
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MAJDOOR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MAJDOOR_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAJDOOR_KEY_ALIAS }}
        run: |
          set -e

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

          KEYSTORE="signing/majdoor-hisaab-release.jks"

          ALIGNED_APK="final/aligned-release.apk"

          SIGNED_APK="final/${APK_SIGNED_NAME}"

          echo "=============================================="
          echo "SIGNING RELEASE APK"
          echo "=============================================="

          # If permanent secrets are not configured,
          # use the temporary key generated above.
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            KEYSTORE_PASSWORD="MajdoorHisaabV82"
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            KEY_PASSWORD="MajdoorHisaabV82"
          fi

          if [ -z "$KEY_ALIAS" ]; then
            KEY_ALIAS="majdoor-hisaab"
          fi

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          test -f "$SIGNED_APK"

          echo ""
          echo "Signed APK created:"
          ls -lh "$SIGNED_APK"


      # ============================================================
      # 21. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

          SIGNED_APK="final/${APK_SIGNED_NAME}"

          echo "=============================================="
          echo "VERIFY APK SIGNATURE"
          echo "=============================================="

          "$APKSIGNER" verify \
            --verbose \
            "$SIGNED_APK"

          echo ""
          echo "APK SIGNATURE VERIFICATION PASSED."


      # ============================================================
      # 22. FINAL APK PACKAGE CHECK
      # ============================================================

      - name: Final APK validation
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          AAPT="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt"
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

          SIGNED_APK="final/${APK_SIGNED_NAME}"

          echo "=============================================="
          echo "FINAL APK VALIDATION"
          echo "=============================================="

          test -f "$SIGNED_APK"

          echo ""
          echo "File:"
          ls -lh "$SIGNED_APK"

          echo ""
          echo "Package:"
          "$AAPT" dump badging "$SIGNED_APK" | head -1

          echo ""
          echo "Signature:"
          "$APKSIGNER" verify --verbose "$SIGNED_APK"

          echo ""
          echo "SHA256:"
          sha256sum "$SIGNED_APK"

          echo ""
          echo "FINAL APK VALIDATION PASSED."


      # ============================================================
      # 23. CREATE BUILD INFORMATION
      #
      # printf is intentionally used instead of an unindented
      # heredoc so YAML parsing cannot break.
      # ============================================================

      - name: Create build information
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          mkdir -p final

          {
            printf '%s\n' "=============================================="
            printf '%s\n' "MAJDOOR HISAAB PRO V82"
            printf '%s\n' "FINAL SIGNED RELEASE"
            printf '%s\n' "=============================================="
            printf '%s\n' ""
            printf '%s\n' "Package: ${EXPECTED_PACKAGE}"
            printf '%s\n' "Android API: ${ANDROID_API}"
            printf '%s\n' "Build Tools: ${BUILD_TOOLS}"
            printf '%s\n' "Java: ${JAVA_VERSION}"
            printf '%s\n' "Gradle: ${GRADLE_VERSION}"
            printf '%s\n' "Runner: ubuntu-24.04"
            printf '%s\n' ""
            printf '%s\n' "APK: ${APK_SIGNED_NAME}"
            printf '%s\n' ""
            printf '%s\n' "Git commit: $GITHUB_SHA"
            printf '%s\n' "Git ref: $GITHUB_REF"
            printf '%s\n' "Run number: $GITHUB_RUN_NUMBER"
            printf '%s\n' ""
            printf '%s\n' "SHA256:"
            sha256sum "final/${APK_SIGNED_NAME}"
            printf '%s\n' ""
            printf '%s\n' "Build completed successfully."
            printf '%s\n' "=============================================="
          } > final/BUILD_INFO.txt

          cat final/BUILD_INFO.txt


      # ============================================================
      # 24. COPY SOURCE ZIP INTO FINAL
      # ============================================================

      - name: Copy source ZIP to final output
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          cp "${GITHUB_WORKSPACE}/${ZIP_NAME}" \
             "final/${ZIP_NAME}"

          echo "Source ZIP copied to final directory."

          ls -lh final/


      # ============================================================
      # 25. CREATE FINAL OUTPUT ZIP
      # ============================================================

      - name: Create final release package
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          cd final

          rm -f "Majdoor_Hisaab_PRO_V82_FINAL_RELEASE_PACKAGE.zip"

          zip -q \
            "Majdoor_Hisaab_PRO_V82_FINAL_RELEASE_PACKAGE.zip" \
            "${APK_SIGNED_NAME}" \
            "BUILD_INFO.txt"

          echo ""
          echo "Final release package:"
          ls -lh "Majdoor_Hisaab_PRO_V82_FINAL_RELEASE_PACKAGE.zip"


      # ============================================================
      # 26. UPLOAD SIGNED APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v6
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: |
            ${{ steps.find_android.outputs.android_dir }}/final/${{ env.APK_SIGNED_NAME }}
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 27. UPLOAD COMPLETE RELEASE PACKAGE
      # ============================================================

      - name: Upload Final Release Package
        uses: actions/upload-artifact@v6
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-RELEASE-PACKAGE
          path: |
            ${{ steps.find_android.outputs.android_dir }}/final/Majdoor_Hisaab_PRO_V82_FINAL_RELEASE_PACKAGE.zip
            ${{ steps.find_android.outputs.android_dir }}/final/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 28. UPLOAD SOURCE ZIP
      # ============================================================

      - name: Upload Source ZIP
        uses: actions/upload-artifact@v6
        with:
          name: Majdoor-Hisaab-PRO-V82-SOURCE-ZIP
          path: |
            ${{ steps.find_android.outputs.android_dir }}/final/${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 29. FINAL SUCCESS
      # ============================================================

      - name: Final success check
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "======================================================"
          echo "       MAJDOOR HISAAB PRO V82 - SUCCESS"
          echo "======================================================"
          echo ""
          echo "Signed APK:"
          echo "  ${APK_SIGNED_NAME}"
          echo ""
          echo "Package:"
          echo "  ${EXPECTED_PACKAGE}"
          echo ""
          echo "Android:"
          echo "  API ${ANDROID_API}"
          echo ""
          echo "Build Tools:"
          echo "  ${BUILD_TOOLS}"
          echo ""
          echo "Java:"
          echo "  ${JAVA_VERSION}"
          echo ""
          echo "Gradle:"
          echo "  ${GRADLE_VERSION}"
          echo ""
          echo "Signature:"
          echo "  VERIFIED"
          echo ""
          echo "Package:"
          echo "  VERIFIED"
          echo ""
          echo "Zipalign:"
          echo "  VERIFIED"
          echo ""
          echo "======================================================"
          echo "FINAL SIGNED APK BUILD SUCCESSFUL"
          echo "======================================================"
