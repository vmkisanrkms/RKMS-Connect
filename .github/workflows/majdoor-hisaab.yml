name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_NAME: "1.82.0"
  VERSION_CODE: "82"

  # EXACT AUDITED ZIP NAME
  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_HAJRI_BACKDATE_LOCK_FIXED_ATTENDANCE_TOP_KOTLIN_COMPILE_FIXED_V3.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build Final Signed Release APK

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 3. SETUP GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ============================================================
      # 4. LOCATE ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "LOCATING ANDROID SDK"
          echo "=========================================="

          SDK=""

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK="/usr/local/lib/android/sdk"
          fi

          if [ -z "$SDK" ]; then
            SDK="$(
              find /usr/local /opt "$HOME" \
                -maxdepth 8 \
                -type d \
                -name "platform-tools" \
                2>/dev/null \
                | head -n 1 \
                | sed 's#/platform-tools##' || true
            )"
          fi

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK could not be located."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

          SDKMANAGER_PATH=""

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER_PATH="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER_PATH="$(command -v sdkmanager)"
          else
            SDKMANAGER_PATH="$(
              find "$SDK/cmdline-tools" \
                -type f \
                -name sdkmanager \
                2>/dev/null \
                | head -n 1 || true
            )"
          fi

          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"

          echo "Android SDK : $SDK"
          echo "sdkmanager  : $SDKMANAGER_PATH"


      # ============================================================
      # 5. INSTALL ANDROID API 36
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"


      # ============================================================
      # 6. VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API}"
          test -d "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"
          test -x "$ANDROID_HOME/platform-tools/adb"

          echo "=========================================="
          echo "ANDROID SDK VERIFIED"
          echo "=========================================="

          echo "Android API : ${ANDROID_API}"
          echo "Build Tools : ${BUILD_TOOLS}"
          echo "SDK         : ${ANDROID_HOME}"


      # ============================================================
      # 7. FIND EXACT PROJECT ZIP
      # ============================================================

      - name: Find Exact Majdoor Hisaab Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "AVAILABLE ZIP FILES"
          echo "=========================================="

          find . \
            -maxdepth 6 \
            -type f \
            -iname "*.zip" \
            -print \
            | sort || true

          ZIP_PATH=""

          if [ -f "./${ZIP_NAME}" ]; then
            ZIP_PATH="./${ZIP_NAME}"
          fi

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::EXACT PROJECT ZIP NOT FOUND"
            echo ""
            echo "Expected:"
            echo "$ZIP_NAME"
            echo ""
            echo "Available ZIP files:"

            find . \
              -maxdepth 8 \
              -type f \
              -iname "*.zip" \
              -print \
              | sort || true

            exit 1
          fi

          ZIP_PATH="$(realpath "$ZIP_PATH")"

          echo ""
          echo "=========================================="
          echo "SELECTED PROJECT ZIP"
          echo "=========================================="

          echo "$ZIP_PATH"

          echo ""
          echo "ZIP SIZE:"
          ls -lh "$ZIP_PATH"

          echo "PROJECT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"


      # ============================================================
      # 8. VERIFY ZIP BEFORE EXTRACTION
      # ============================================================

      - name: Verify Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_ZIP" ]; then
            echo "::error::Project ZIP does not exist."
            exit 1
          fi

          echo "=========================================="
          echo "TESTING ZIP ARCHIVE"
          echo "=========================================="

          unzip -t "$PROJECT_ZIP"

          echo ""
          echo "ZIP ARCHIVE TEST SUCCESSFUL."


      # ============================================================
      # 9. EXTRACT PROJECT
      # ============================================================

      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/majdoor-hisaab-project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "=========================================="
          echo "EXTRACTING PROJECT"
          echo "=========================================="

          unzip -q "$PROJECT_ZIP" -d "$EXTRACT_DIR"

          echo ""
          echo "Extraction completed."

          find "$EXTRACT_DIR" \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "gradlew" \
              -o -name "MainActivity.kt" \
            \) \
            -print \
            | sort \
            | head -n 200


      # ============================================================
      # 10. LOCATE ANDROID PROJECT ROOT
      # ============================================================

      - name: Locate Android Project Root
        shell: bash
        run: |
          set -euo pipefail

          BASE="$RUNNER_TEMP/majdoor-hisaab-project"

          PROJECT_ROOT=""

          SETTINGS_KTS="$(
            find "$BASE" \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              | head -n 1 || true
          )"

          if [ -n "$SETTINGS_KTS" ]; then
            PROJECT_ROOT="$(dirname "$SETTINGS_KTS")"
          fi

          if [ -z "$PROJECT_ROOT" ]; then

            SETTINGS_GRADLE="$(
              find "$BASE" \
                -type f \
                -name "settings.gradle" \
                -print \
                | head -n 1 || true
            )"

            if [ -n "$SETTINGS_GRADLE" ]; then
              PROJECT_ROOT="$(dirname "$SETTINGS_GRADLE")"
            fi

          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Android Gradle project root was not found."

            find "$BASE" \
              -maxdepth 8 \
              -type f \
              -print \
              | sort \
              | head -n 500

            exit 1
          fi

          echo "=========================================="
          echo "ANDROID PROJECT ROOT"
          echo "=========================================="

          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"


      # ============================================================
      # 11. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          pwd

          ls -la

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "::error::settings.gradle/settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "gradlew" ]; then
            echo "::error::gradlew not found."
            exit 1
          fi

          chmod +x gradlew

          ./gradlew --version


      # ============================================================
      # 12. VERIFY MAINACTIVITY SOURCE ONLY
      #
      # IMPORTANT:
      # NO PYTHON PATCH
      # NO SED PATCH
      # NO AUTOMATIC SOURCE REPAIR
      # ============================================================

      - name: Verify MainActivity Source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          MAIN_KT="$(
            find app/src/main/java \
              -type f \
              -name "MainActivity.kt" \
              -print \
              | head -n 1 || true
          )"

          if [ -z "$MAIN_KT" ]; then
            echo "::error::MainActivity.kt not found inside project."
            exit 1
          fi

          echo "=========================================="
          echo "MAINACTIVITY FOUND"
          echo "=========================================="

          echo "$MAIN_KT"

          echo ""
          echo "Line count:"
          wc -l "$MAIN_KT"

          echo ""
          echo "Kotlin source syntax structure check:"

          python3 - "$MAIN_KT" <<'PY'
          import sys

          path = sys.argv[1]

          text = open(path, "r", encoding="utf-8").read()

          pairs = {
              "{": "}",
              "(": ")",
              "[": "]",
          }

          stack = []

          in_string = False
          in_char = False
          in_line_comment = False
          in_block_comment = False
          escape = False

          i = 0

          while i < len(text):
              c = text[i]
              n = text[i + 1] if i + 1 < len(text) else ""

              if in_line_comment:
                  if c == "\n":
                      in_line_comment = False
                  i += 1
                  continue

              if in_block_comment:
                  if c == "*" and n == "/":
                      in_block_comment = False
                      i += 2
                      continue
                  i += 1
                  continue

              if in_string:
                  if escape:
                      escape = False
                  elif c == "\\":
                      escape = True
                  elif c == '"':
                      in_string = False
                  i += 1
                  continue

              if in_char:
                  if escape:
                      escape = False
                  elif c == "\\":
                      escape = True
                  elif c == "'":
                      in_char = False
                  i += 1
                  continue

              if c == "/" and n == "/":
                  in_line_comment = True
                  i += 2
                  continue

              if c == "/" and n == "*":
                  in_block_comment = True
                  i += 2
                  continue

              if c == '"':
                  in_string = True
                  i += 1
                  continue

              if c == "'":
                  in_char = True
                  i += 1
                  continue

              if c in pairs:
                  stack.append((c, i))

              elif c in pairs.values():
                  if not stack:
                      raise SystemExit(
                          f"Unmatched closing character: {c}"
                      )

                  opening, pos = stack.pop()

                  if pairs[opening] != c:
                      raise SystemExit(
                          f"Mismatched brackets: {opening} ... {c}"
                      )

              i += 1

          if in_string:
              raise SystemExit("Unterminated string detected.")

          if in_char:
              raise SystemExit("Unterminated character literal detected.")

          if in_block_comment:
              raise SystemExit("Unterminated block comment detected.")

          if stack:
              opening, pos = stack[-1]
              raise SystemExit(
                  f"Unclosed character detected: {opening}"
              )

          print("MainActivity.kt bracket/syntax-structure check PASSED.")
          PY


      # ============================================================
      # 13. INSPECT GRADLE CONFIGURATION
      # ============================================================

      - name: Inspect Android Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "GRADLE / ANDROID CONFIGURATION"
          echo "=========================================="

          find . \
            -maxdepth 6 \
            -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "gradle.properties" \
              -o -name "AndroidManifest.xml" \
            \) \
            -print \
            | sort \
            | head -n 500

          echo ""
          echo "compileSdk references:"

          grep -RIn \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            "compileSdk" . \
            2>/dev/null \
            | head -n 50 || true

          echo ""
          echo "minSdk references:"

          grep -RIn \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            "minSdk" . \
            2>/dev/null \
            | head -n 50 || true


      # ============================================================
      # 14. CLEAN PROJECT
      # ============================================================

      - name: Clean Android Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 15. BUILD RELEASE APK
      #
      # IMPORTANT:
      # NO MainActivity.kt PATCHING HERE
      # ============================================================

      - name: Compile Release Kotlin and Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "BUILDING RELEASE APK"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info


      # ============================================================
      # 16. LOCATE RELEASE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "ALL APK FILES"
          echo "=========================================="

          find . \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          APK_PATH=""

          APK_PATH="$(
            find . \
              -type f \
              -path "*/build/outputs/apk/release/*-release-unsigned.apk" \
              -print \
              | head -n 1 || true
          )"

          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(
              find . \
                -type f \
                -name "app-release-unsigned.apk" \
                -print \
                | head -n 1 || true
            )"
          fi

          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(
              find . \
                -type f \
                -path "*/build/outputs/apk/release/*.apk" \
                -print \
                | head -n 1 || true
            )"
          fi

          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not found."
            exit 1
          fi

          APK_PATH="$(realpath "$APK_PATH")"

          echo ""
          echo "=========================================="
          echo "RELEASE APK FOUND"
          echo "=========================================="

          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          cp "$APK_PATH" "$RUNNER_TEMP/release-original.apk"

          test -f "$RUNNER_TEMP/release-original.apk"

          echo "ORIGINAL_APK=$RUNNER_TEMP/release-original.apk" >> "$GITHUB_ENV"


      # ============================================================
      # 17. VERIFY ORIGINAL APK
      # ============================================================

      - name: Verify Original Release APK
        shell: bash
        run: |
          set -euo pipefail

          test -f "$ORIGINAL_APK"

          echo "=========================================="
          echo "ORIGINAL APK VERIFIED"
          echo "=========================================="

          ls -lh "$ORIGINAL_APK"


      # ============================================================
      # 18. CREATE SIGNING KEYSTORE
      # ============================================================

      - name: Prepare APK Signing Keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/majdoor-hisaab-release.keystore"

          SIGNING_PASSWORD="MajdoorHisaabV82Signing@2026"

          rm -f "$KEYSTORE"

          echo "=========================================="
          echo "CREATING PKCS12 KEYSTORE"
          echo "=========================================="

          keytool \
            -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -alias majdoor-hisaab-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$SIGNING_PASSWORD" \
            -keypass "$SIGNING_PASSWORD" \
            -dname "CN=Majdoor Hisaab PRO, OU=RKMS, O=RKMS, L=Lakhimpur Kheri, ST=Uttar Pradesh, C=IN"

          test -f "$KEYSTORE"

          keytool \
            -list \
            -v \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass "$SIGNING_PASSWORD" \
            -alias majdoor-hisaab-release \
            >/dev/null

          echo "Keystore verification successful."

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"


      # ============================================================
      # 19. ZIPALIGN
      # ============================================================

      - name: Align Release APK
        shell: bash
        run: |
          set -euo pipefail

          INPUT="$ORIGINAL_APK"
          ALIGNED="$RUNNER_TEMP/$APK_UNSIGNED_NAME"

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          if [ ! -x "$ZIPALIGN" ]; then
            echo "::error::zipalign not found."
            exit 1
          fi

          echo "=========================================="
          echo "ALIGNING APK"
          echo "=========================================="

          rm -f "$ALIGNED"

          "$ZIPALIGN" \
            -f \
            -P 16 \
            4 \
            "$INPUT" \
            "$ALIGNED"

          test -f "$ALIGNED"

          "$ZIPALIGN" \
            -c \
            -P 16 \
            4 \
            "$ALIGNED"

          echo "ZIPALIGN SUCCESSFUL."

          ls -lh "$ALIGNED"

          echo "ALIGNED_APK=$ALIGNED" >> "$GITHUB_ENV"


      # ============================================================
      # 20. SIGN APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -euo pipefail

          SIGNED="$RUNNER_TEMP/$APK_SIGNED_NAME"

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          if [ ! -f "$ALIGNED_APK" ]; then
            echo "::error::Aligned APK not found."
            exit 1
          fi

          if [ ! -f "$KEYSTORE" ]; then
            echo "::error::Keystore not found."
            exit 1
          fi

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          rm -f "$SIGNED"

          echo "=========================================="
          echo "SIGNING RELEASE APK"
          echo "=========================================="

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias majdoor-hisaab-release \
            --ks-pass pass:"$SIGNING_PASSWORD" \
            --key-pass pass:"$SIGNING_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$SIGNED" \
            "$ALIGNED_APK"

          test -f "$SIGNED"

          echo ""
          echo "SIGNING SUCCESSFUL."

          ls -lh "$SIGNED"

          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"


      # ============================================================
      # 21. VERIFY SIGNATURE
      # ============================================================

      - name: Verify Release APK Signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          test -f "$SIGNED_APK"

          echo "=========================================="
          echo "VERIFYING APK SIGNATURE"
          echo "=========================================="

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"

          echo ""
          echo "APK SIGNATURE VERIFICATION SUCCESSFUL."


      # ============================================================
      # 22. VERIFY APK PACKAGE / VERSION
      # ============================================================

      - name: Verify Final APK Identity
        shell: bash
        run: |
          set -euo pipefail

          APK="$SIGNED_APK"

          AAPT2="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt2"

          if [ ! -x "$AAPT2" ]; then
            echo "::error::aapt2 not found."
            exit 1
          fi

          BADGING="$RUNNER_TEMP/final-apk-badging.txt"

          "$AAPT2" dump badging "$APK" > "$BADGING"

          ACTUAL_PACKAGE="$(
            sed -n \
              "s/^package: name='\([^']*\)'.*/\1/p" \
              "$BADGING" \
              | head -n 1
          )"

          ACTUAL_VERSION="$(
            sed -n \
              "s/^package:.*versionName='\([^']*\)'.*/\1/p" \
              "$BADGING" \
              | head -n 1
          )"

          ACTUAL_CODE="$(
            sed -n \
              "s/^package:.*versionCode='\([^']*\)'.*/\1/p" \
              "$BADGING" \
              | head -n 1
          )"

          echo "=========================================="
          echo "APK IDENTITY"
          echo "=========================================="

          echo "Expected Package : $PACKAGE_NAME"
          echo "Actual Package   : $ACTUAL_PACKAGE"

          echo ""

          echo "Expected Version : $VERSION_NAME"
          echo "Actual Version   : $ACTUAL_VERSION"

          echo ""

          echo "Expected Code    : $VERSION_CODE"
          echo "Actual Code      : $ACTUAL_CODE"

          echo "=========================================="

          if [ "$ACTUAL_PACKAGE" != "$PACKAGE_NAME" ]; then
            echo "::error::Package name mismatch."
            exit 1
          fi

          if [ "$ACTUAL_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Version name mismatch."
            exit 1
          fi

          if [ "$ACTUAL_CODE" != "$VERSION_CODE" ]; then
            echo "::error::Version code mismatch."
            exit 1
          fi

          echo ""
          echo "APK IDENTITY VERIFICATION SUCCESSFUL."


      # ============================================================
      # 23. FINAL ALIGNMENT CHECK
      # ============================================================

      - name: Final APK Alignment Verification
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          echo "=========================================="
          echo "FINAL 16 KB ALIGNMENT CHECK"
          echo "=========================================="

          "$ZIPALIGN" \
            -c \
            -P 16 \
            4 \
            "$SIGNED_APK"

          echo ""
          echo "FINAL APK ALIGNMENT VERIFICATION SUCCESSFUL."


      # ============================================================
      # 24. BUILD REPORT
      # ============================================================

      - name: Generate Build Report
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/Majdoor-Hisaab-PRO-V82-Build-Report.txt"

          {
            echo "=============================================="
            echo "MAJDOOR HISAAB PRO V82"
            echo "FINAL SIGNED RELEASE APK"
            echo "=============================================="
            echo ""
            echo "Package       : ${PACKAGE_NAME}"
            echo "Version       : ${VERSION_NAME}"
            echo "Version Code  : ${VERSION_CODE}"
            echo "Android API   : ${ANDROID_API}"
            echo "Build Tools   : ${BUILD_TOOLS}"
            echo "Java          : ${JAVA_VERSION}"
            echo "Gradle        : ${GRADLE_VERSION}"
            echo ""
            echo "Source ZIP:"
            echo "${ZIP_NAME}"
            echo ""
            echo "Final APK:"
            echo "${APK_SIGNED_NAME}"
            echo ""
            echo "APK Size:"
            ls -lh "${SIGNED_APK}"
            echo ""
            echo "Signature verification:"
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner" \
              verify \
              --verbose \
              --print-certs \
              "${SIGNED_APK}"
            echo ""
            echo "16 KB alignment verification:"
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/zipalign" \
              -c \
              -P 16 \
              4 \
              "${SIGNED_APK}"
            echo ""
            echo "=============================================="
            echo "BUILD SUCCESSFUL"
            echo "=============================================="
          } > "$REPORT"

          cat "$REPORT"

          echo "REPORT=$REPORT" >> "$GITHUB_ENV"


      # ============================================================
      # 25. PREPARE FINAL OUTPUT
      # ============================================================

      - name: Prepare Final Artifacts
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/final-output"

          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT"

          cp "$SIGNED_APK" \
            "$OUTPUT/$APK_SIGNED_NAME"

          cp "$ALIGNED_APK" \
            "$OUTPUT/$APK_UNSIGNED_NAME"

          cp "$REPORT" \
            "$OUTPUT/Majdoor-Hisaab-PRO-V82-Build-Report.txt"

          echo "=========================================="
          echo "FINAL OUTPUT"
          echo "=========================================="

          ls -lh "$OUTPUT"


      # ============================================================
      # 26. UPLOAD SIGNED APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: |
            final-output/Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk
            final-output/Majdoor-Hisaab-PRO-V82-Build-Report.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 27. UPLOAD ALIGNED APK
      # ============================================================

      - name: Upload Aligned APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-ALIGNED-APK
          path: |
            final-output/Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 28. FINAL SUCCESS
      # ============================================================

      - name: Final Success
        shell: bash
        run: |
          echo ""
          echo "======================================================"
          echo "       MAJDOOR HISAAB PRO V82 BUILD SUCCESS"
          echo "======================================================"
          echo ""

          echo "Package       : ${PACKAGE_NAME}"
          echo "Version       : ${VERSION_NAME}"
          echo "Version Code  : ${VERSION_CODE}"

          echo ""
          echo "Source ZIP:"
          echo "${ZIP_NAME}"

          echo ""
          echo "Final Signed APK:"
          echo "${APK_SIGNED_NAME}"

          echo ""
          echo "Completed:"
          echo "1. Java 17"
          echo "2. Gradle ${GRADLE_VERSION}"
          echo "3. Android API ${ANDROID_API}"
          echo "4. Exact ZIP verification"
          echo "5. MainActivity source verification"
          echo "6. Kotlin compilation"
          echo "7. Release APK generation"
          echo "8. APK detection"
          echo "9. 16 KB page-size alignment"
          echo "10. PKCS12 keystore verification"
          echo "11. APK signing"
          echo "12. Signature verification"
          echo "13. Package verification"
          echo "14. Version verification"
          echo "15. Final alignment verification"
          echo "16. Final artifact upload"

          echo ""
