name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V82-KOTLIN-COMPILE-FIXED.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build Final Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # 4. LOCATE ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATING ANDROID SDK"
          echo "=============================================="

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"

          else
            SDK_ROOT=$(find /usr/local/lib/android \
              -maxdepth 3 \
              -type d \
              -name "sdk" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name "sdkmanager" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "ANDROID SDK:"
          echo "$SDK_ROOT"

          echo ""
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 5. INSTALL ANDROID SDK 36
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INSTALL ANDROID SDK 36"
          echo "=============================================="

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "ANDROID SDK INSTALLATION PASSED."


      # ============================================================
      # 6. VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY ANDROID SDK"
          echo "=============================================="

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"

          echo ""
          echo "ANDROID SDK VERIFICATION PASSED."


      # ============================================================
      # 7. FIND PROJECT ZIP
      # ============================================================

      - name: Find Majdoor Hisaab Project ZIP
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FIND MAJDOOR HISAAB PROJECT ZIP"
          echo "=============================================="

          FOUND_ZIP=""

          if [ -f "$ZIP_NAME" ]; then
            FOUND_ZIP="$ZIP_NAME"
          fi

          if [ -z "$FOUND_ZIP" ]; then
            FOUND_ZIP=$(
              find . \
                -type f \
                -name "Majdoor_Hisaab_PRO_READY_TO_BUILD_FIXED_*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | tail -1
            )
          fi

          if [ -z "$FOUND_ZIP" ]; then
            FOUND_ZIP=$(
              find . \
                -type f \
                -iname "*Majdoor*Hisaab*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | tail -1
            )
          fi

          if [ -z "$FOUND_ZIP" ] || [ ! -f "$FOUND_ZIP" ]; then
            echo ""
            echo "ERROR: Majdoor Hisaab project ZIP NOT FOUND."

            echo ""
            echo "AVAILABLE ZIP FILES:"

            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print \
              | sort

            exit 1
          fi

          FOUND_ZIP="${FOUND_ZIP#./}"

          echo ""
          echo "PROJECT ZIP FOUND:"
          echo "$FOUND_ZIP"

          ls -lh "$FOUND_ZIP"

          echo "ZIP_NAME=$FOUND_ZIP" >> "$GITHUB_ENV"

          echo ""
          echo "ZIP DETECTION PASSED."


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================

      - name: Extract Majdoor Hisaab Project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "EXTRACT PROJECT"
          echo "=============================================="

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_NAME" -d build_source

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print \
            -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: Gradle settings file not found."

            find build_source \
              -maxdepth 8 \
              -type f \
              -print \
              | sort \
              | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 9. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY ANDROID PROJECT"
          echo "=============================================="

          pwd

          test -d "app"

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo ""
          echo "ANDROID PROJECT VERIFIED."


      # ============================================================
      # 10. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle Environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE ENVIRONMENT"
          echo "=============================================="

          java -version

          echo ""
          gradle --version

          DETECTED=$(
            gradle --version |
            awk '/^Gradle / {print $2; exit}'
          )

          echo ""
          echo "EXPECTED GRADLE:"
          echo "$GRADLE_VERSION"

          echo ""
          echo "DETECTED GRADLE:"
          echo "$DETECTED"

          if [ "$DETECTED" != "$GRADLE_VERSION" ]; then
            echo ""
            echo "ERROR: Gradle version mismatch."
            exit 1
          fi

          echo ""
          echo "GRADLE ENVIRONMENT PASSED."


      # ============================================================
      # 11. LOCATE MAIN KOTLIN SOURCE
      # ============================================================

      - name: Locate Main Kotlin Source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE MAIN KOTLIN SOURCE"
          echo "=============================================="

          MAIN_FILES=$(find app/src/main \
            -type f \
            -name "MainActivity.kt" \
            -print)

          echo "$MAIN_FILES"

          COUNT=$(echo "$MAIN_FILES" | sed '/^$/d' | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo ""
            echo "ERROR: Multiple MainActivity.kt files found."
            exit 1
          fi

          MAIN_FILE=$(echo "$MAIN_FILES" | head -1)

          echo "MAIN_FILE=$MAIN_FILE" >> "$GITHUB_ENV"

          echo ""
          echo "MAIN FILE:"
          echo "$MAIN_FILE"


      # ============================================================
      # 18. COMPILE RELEASE KOTLIN
      #
      # ALL SOURCE REPAIRS ARE INSIDE THIS STEP.
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN"
          echo "=============================================="

          test -f "$MAIN_FILE"

          echo ""
          echo "MAIN FILE:"
          echo "$MAIN_FILE"

          echo ""
          echo "=============================================="
          echo "AUDITED KOTLIN SOURCE REPAIR"
          echo "=============================================="

          python3 - "$MAIN_FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          print("SOURCE:", path)
          print("SOURCE SIZE:", len(source), "bytes")


          # ==========================================================
          # Helper: replace a complete Kotlin function safely
          # ==========================================================

          def replace_function(text, function_name, replacement):

              pattern = re.compile(
                  r"(?m)^[ \t]*(?:@Composable[ \t]*\n[ \t]*)?"
                  r"(?:private[ \t]+|public[ \t]+|internal[ \t]+)?"
                  r"fun[ \t]+"
                  + re.escape(function_name)
                  + r"[ \t]*\("
              )

              match = pattern.search(text)

              if not match:
                  return text, False

              open_brace = text.find("{", match.end())

              if open_brace == -1:
                  raise SystemExit(
                      "ERROR: opening brace not found for "
                      + function_name
                  )

              depth = 0
              in_string = False
              in_char = False
              escape = False
              line_comment = False
              block_comment = False

              i = open_brace

              while i < len(text):

                  c = text[i]

                  n = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:

                      if c == "\n":
                          line_comment = False

                  elif block_comment:

                      if c == "*" and n == "/":
                          block_comment = False
                          i += 1

                  elif in_string:

                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == '"':
                          in_string = False

                  elif in_char:

                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == "'":
                          in_char = False

                  else:

                      if c == "/" and n == "/":
                          line_comment = True
                          i += 1

                      elif c == "/" and n == "*":
                          block_comment = True
                          i += 1

                      elif c == '"':
                          in_string = True

                      elif c == "'":
                          in_char = True

                      elif c == "{":
                          depth += 1

                      elif c == "}":

                          depth -= 1

                          if depth == 0:

                              return (
                                  text[:match.start()]
                                  + replacement
                                  + text[i + 1:],
                                  True
                              )

                  i += 1

              raise SystemExit(
                  "ERROR: unbalanced braces in "
                  + function_name
              )


          # ==========================================================
          # 1. setContent import
          # ==========================================================

          if "import androidx.activity.compose.setContent" not in source:

              package_match = re.search(
                  r"^package[^\n]+\n",
                  source,
                  re.MULTILINE
              )

              if not package_match:
                  raise SystemExit(
                      "ERROR: package declaration not found"
                  )

              source = (
                  source[:package_match.end()]
                  + "\n"
                  + "import androidx.activity.compose.setContent\n"
                  + source[package_match.end():]
              )

              print("FIX APPLIED: setContent import")

          else:

              print("ALREADY OK: setContent import")


          # ==========================================================
          # 2. Store Context
          # ==========================================================

          old_store = "private class Store(context:Context){"
          new_store = "private class Store(private val context:Context){"

          if old_store in source:

              source = source.replace(
                  old_store,
                  new_store,
                  1
              )

              print("FIX APPLIED: Store context")

          elif new_store in source:

              print("ALREADY OK: Store context")

          else:

              raise SystemExit(
                  "ERROR: Store declaration not found"
              )


          # ==========================================================
          # 3. JSONArray.mapList()
          # ==========================================================

          map_pattern = re.compile(
              r"private fun <T> JSONArray\.mapList"
              r"\(mapper:\(JSONObject\)->T\):List<T>"
              r"=[^\n]+"
          )

          map_match = map_pattern.search(source)

          map_replacement = """private fun <T> JSONArray.mapList(
              mapper: (JSONObject) -> T
          ): List<T> = (0 until length()).map {
              mapper(getJSONObject(it))
          }"""

          if map_match:

              source = (
                  source[:map_match.start()]
                  + map_replacement
                  + source[map_match.end():]
              )

              print("FIX APPLIED: JSONArray.mapList")

          elif "private fun <T> JSONArray.mapList(" in source:

              print("ALREADY OK: JSONArray.mapList")

          else:

              raise SystemExit(
                  "ERROR: JSONArray.mapList not found"
              )


          # ==========================================================
          # 4. persistPhoto()
          #
          # IMPORTANT:
          # Do NOT search for one exact old body.
          # Locate the real Kotlin function by its declaration.
          # ==========================================================

          persist_photo = """    fun persistPhoto(
              uriString: String,
              owner: String
          ): String {
              if (uriString.isBlank() || uriString.startsWith("file://")) {
                  return uriString
              }

              return try {
                  val uri: Uri = Uri.parse(uriString)

                  val dir: File = File(
                      context.filesDir,
                      "photos"
                  ).apply {
                      mkdirs()
                  }

                  val file: File = File(
                      dir,
                      "${owner}_${UUID.randomUUID()}.jpg"
                  )

                  val input: java.io.InputStream =
                      context.contentResolver
                          .openInputStream(uri)
                      ?: return ""

                  input.use { inputStream ->
                      FileOutputStream(file).use { outputStream ->
                          inputStream.copyTo(outputStream)
                      }
                  }

                  file.absolutePath

              } catch (_: Exception) {
                  ""
              }
          }
          """

          source, persist_found = replace_function(
              source,
              "persistPhoto",
              persist_photo
          )

          if persist_found:

              print(
                  "FIX APPLIED: persistPhoto"
              )

          elif "fun persistPhoto" in source:

              print(
                  "ALREADY OK: persistPhoto"
              )

          else:

              print(
                  "WARNING: persistPhoto declaration was not found."
              )

              print(
                  "Checking whether the source actually calls persistPhoto..."
              )

              if ".persistPhoto(" in source:

                  raise SystemExit(
                      "ERROR: persistPhoto is called but declaration "
                      "cannot be located."
                  )


          # ==========================================================
          # 5. ExpenseDialog call
          #
          # Correct signature:
          # ExpenseDialog(store, existing, onClose, isEdit)
          # ==========================================================

          expense_pattern = re.compile(
              r"ExpenseDialog"
              r"\(store,"
              r"(edit\?:Expense\(.*?\))"
              r",edit!=null\)"
              r"\{add=false;edit=null\}"
          )

          expense_match = expense_pattern.search(
              source
          )

          if expense_match:

              existing = expense_match.group(1)

              replacement = (
                  "ExpenseDialog("
                  "store,"
                  + existing
                  + ","
                  + "{add=false;edit=null}"
                  + ",edit!=null)"
              )

              source = (
                  source[:expense_match.start()]
                  + replacement
                  + source[expense_match.end():]
              )

              print(
                  "FIX APPLIED: ExpenseDialog arguments"
              )

          elif re.search(
              r"ExpenseDialog\(store,.*?,\{add=false;edit=null\},edit!=null\)",
              source
          ):

              print(
                  "ALREADY OK: ExpenseDialog arguments"
              )

          else:

              print(
                  "WARNING: ExpenseDialog call pattern not changed."
              )


          # ==========================================================
          # 6. SaleDialog call
          # ==========================================================

          sale_pattern = re.compile(
              r"SaleDialog"
              r"\(store,"
              r"(edit\?:Sale\(.*?\))"
              r",edit!=null\)"
              r"\{add=false;edit=null\}"
          )

          sale_match = sale_pattern.search(
              source
          )

          if sale_match:

              existing = sale_match.group(1)

              replacement = (
                  "SaleDialog("
                  "store,"
                  + existing
                  + ","
                  + "{add=false;edit=null}"
                  + ",edit!=null)"
              )

              source = (
                  source[:sale_match.start()]
                  + replacement
                  + source[sale_match.end():]
              )

              print(
                  "FIX APPLIED: SaleDialog arguments"
              )

          elif re.search(
              r"SaleDialog\(store,.*?,\{add=false;edit=null\},edit!=null\)",
              source
          ):

              print(
                  "ALREADY OK: SaleDialog arguments"
              )

          else:

              print(
                  "WARNING: SaleDialog call pattern not changed."
              )


          # ==========================================================
          # 7. PaymentDialog arguments
          # ==========================================================

          payment_old = (
              'PaymentDialog(store,id,null,""){payment=false}'
          )

          payment_new = (
              'PaymentDialog(store,id,null,null){payment=false}'
          )

          if payment_old in source:

              source = source.replace(
                  payment_old,
                  payment_new,
                  1
              )

              print(
                  "FIX APPLIED: PaymentDialog arguments"
              )

          elif payment_new in source:

              print(
                  "ALREADY OK: PaymentDialog arguments"
              )

          else:

              print(
                  "WARNING: old PaymentDialog call not found"
              )


          # ==========================================================
          # 8. BottomBar Icon
          # ==========================================================

          icon_old = (
              "Icon(ic,null,"
              "tint=if(current==k)Green else Color.Gray,"
              "Modifier.size(22.dp))"
          )

          icon_new = (
              "Icon("
              "imageVector=ic,"
              "contentDescription=null,"
              "modifier=Modifier.size(22.dp),"
              "tint=if(current==k)Green else Color.Gray"
              ")"
          )

          if icon_old in source:

              source = source.replace(
                  icon_old,
                  icon_new,
                  1
              )

              print(
                  "FIX APPLIED: BottomBar Icon"
              )

          else:

              print(
                  "CHECKED: BottomBar Icon"
              )


          # ==========================================================
          # 9. TopBar Image
          # ==========================================================

          top_old = (
              "Image("
              "painterResource(R.drawable.majdoor_logo_small),"
              "null,"
              "Modifier.size(42.dp).clip(RoundedCornerShape(10.dp)),"
              "contentScale=ContentScale.Crop"
              ")"
          )

          top_new = (
              "Image("
              "painter=painterResource(R.drawable.majdoor_logo_small),"
              "contentDescription=null,"
              "modifier=Modifier.size(42.dp).clip(RoundedCornerShape(10.dp)),"
              "contentScale=ContentScale.Crop"
              ")"
          )

          if top_old in source:

              source = source.replace(
                  top_old,
                  top_new,
                  1
              )

              print(
                  "FIX APPLIED: TopBar Image"
              )

          else:

              print(
                  "CHECKED: TopBar Image"
              )


          # ==========================================================
          # 10. Dashboard Image
          # ==========================================================

          dashboard_old = (
              "Image("
              "painterResource(R.drawable.majdoor_logo),"
              "null,"
              "Modifier.fillMaxWidth().height(135.dp).clip(RoundedCornerShape(24.dp)),"
              "ContentScale.Fit"
              ")"
          )

          dashboard_new = (
              "Image("
              "painter=painterResource(R.drawable.majdoor_logo),"
              "contentDescription=null,"
              "modifier=Modifier.fillMaxWidth().height(135.dp).clip(RoundedCornerShape(24.dp)),"
              "contentScale=ContentScale.Fit"
              ")"
          )

          if dashboard_old in source:

              source = source.replace(
                  dashboard_old,
                  dashboard_new,
                  1
              )

              print(
                  "FIX APPLIED: Dashboard Image"
              )

          else:

              print(
                  "CHECKED: Dashboard Image"
              )


          # ==========================================================
          # WRITE SOURCE
          # ==========================================================

          path.write_text(
              source,
              encoding="utf-8"
          )

          print("")
          print("==============================================")
          print("ALL SOURCE FIXES WRITTEN")
          print("==============================================")
          PY


          # ============================================================
          # SOURCE VERIFICATION
          # ============================================================

          echo ""
          echo "=============================================="
          echo "VERIFYING SOURCE AFTER PATCH"
          echo "=============================================="

          grep -n \
            "import androidx.activity.compose.setContent" \
            "$MAIN_FILE"

          grep -n \
            "private class Store" \
            "$MAIN_FILE" \
            | head -1

          grep -n \
            "fun persistPhoto" \
            "$MAIN_FILE" \
            | head -3

          grep -n \
            "JSONArray.mapList" \
            "$MAIN_FILE" \
            | head -3

          echo ""
          echo "SOURCE VERIFICATION PASSED."


          # ============================================================
          # FINAL RELEASE IDENTITY
          # ============================================================

          echo ""
          echo "=============================================="
          echo "SET FINAL RELEASE IDENTITY"
          echo "=============================================="

          if [ -f "app/build.gradle.kts" ]; then

            GRADLE_FILE="app/build.gradle.kts"

            sed -i \
              's/applicationId = "[^"]*"/applicationId = "com.majdoor.hisaab"/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionCode = [0-9][0-9]*/versionCode = 77/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionName = "[^"]*"/versionName = "1.77.0"/' \
              "$GRADLE_FILE"

          elif [ -f "app/build.gradle" ]; then

            GRADLE_FILE="app/build.gradle"

            sed -i \
              's/applicationId[[:space:]]*["'"'"'][^"'"'"']*["'"'"']/applicationId "com.majdoor.hisaab"/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionCode[[:space:]]*[0-9][0-9]*/versionCode 77/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionName[[:space:]]*["'"'"'][^"'"'"']*["'"'"']/versionName "1.77.0"/' \
              "$GRADLE_FILE"

          else

            echo "ERROR: app Gradle file not found."
            exit 1

          fi

          echo ""
          echo "FINAL APPLICATION ID:"
          grep "applicationId" "$GRADLE_FILE"

          echo ""
          echo "FINAL VERSION CODE:"
          grep "versionCode" "$GRADLE_FILE"

          echo ""
          echo "FINAL VERSION NAME:"
          grep "versionName" "$GRADLE_FILE"


          # ============================================================
          # ACTUAL KOTLIN COMPILER
          # ============================================================

          echo ""
          echo "=============================================="
          echo "STARTING ACTUAL KOTLIN COMPILER"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --rerun-tasks \
            :app:compileReleaseKotlin

          echo ""
          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN PASSED"
          echo "=============================================="


      # ============================================================
      # 19. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ASSEMBLE RELEASE APK"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --rerun-tasks \
            :app:assembleRelease

          echo ""
          echo "=============================================="
          echo "ASSEMBLE RELEASE APK PASSED"
          echo "=============================================="


      # ============================================================
      # 20. LOCATE RELEASE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE RELEASE APK"
          echo "=============================================="

          APK=$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*release*.apk" \
              -print \
              | sort \
              | head -1
          )

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then

            echo ""
            echo "ERROR: Release APK not found."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null \
              || true

            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "RELEASE APK:"
          ls -lh "$APK"


      # ============================================================
      # 21. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK Package
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY APK PACKAGE"
          echo "=============================================="

          APK="$APK_PATH"

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging \
              "$APK"
          )

          echo "$BADGING" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          if ! echo "$BADGING" | grep -q \
            "name='$PACKAGE_NAME'"; then

            echo ""
            echo "ERROR: Package name mismatch."
            echo "EXPECTED: $PACKAGE_NAME"

            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionCode='$VERSION_CODE'"; then

            echo ""
            echo "ERROR: Version code mismatch."

            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionName='$VERSION_NAME'"; then

            echo ""
            echo "ERROR: Version name mismatch."

            exit 1
          fi

          echo ""
          echo "PACKAGE AND VERSION VERIFIED."


      # ============================================================
      # 22. PREPARE RELEASE SIGNING
      # ============================================================

      - name: Prepare Release Signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -e

          echo "=============================================="
          echo "PREPARE RELEASE SIGNING"
          echo "=============================================="

          KEYSTORE_FILE="$RUNNER_TEMP/majdoor-hisaab-release.jks"

          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            echo ""
            echo "PERMANENT SIGNING SECRETS FOUND."

            printf '%s' "$KEYSTORE_BASE64" \
              | base64 --decode \
              > "$KEYSTORE_FILE"

            test -s "$KEYSTORE_FILE"

            keytool \
              -list \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              >/dev/null

            echo "RELEASE_SIGNING_MODE=PERMANENT" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

            echo ""
            echo "PERMANENT KEYSTORE VERIFIED."

          else

            echo ""
            echo "Permanent signing secrets not configured."
            echo "Creating temporary JKS."

            TEMP_PASSWORD="$(openssl rand -hex 32)"
            TEMP_ALIAS="majdoor-hisaab-v82"

            rm -f "$KEYSTORE_FILE"

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -storepass "$TEMP_PASSWORD" \
              -keypass "$TEMP_PASSWORD" \
              -alias "$TEMP_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=Majdoor Hisaab PRO, OU=Android, O=Majdoor Hisaab, L=India, ST=Uttar Pradesh, C=IN"

            test -s "$KEYSTORE_FILE"

            keytool \
              -list \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -storepass "$TEMP_PASSWORD" \
              -alias "$TEMP_ALIAS" \
              >/dev/null

            echo "RELEASE_SIGNING_MODE=TEMPORARY" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$TEMP_ALIAS" >> "$GITHUB_ENV"

            # IMPORTANT:
            # This MUST go into GITHUB_ENV.
            echo "RELEASE_KEY_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"

            echo ""
            echo "TEMPORARY KEYSTORE VERIFIED."

          fi


      # ============================================================
      # 23. VERIFY SIGNING
      # ============================================================

      - name: Verify Signing Environment
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY SIGNING ENVIRONMENT"
          echo "=============================================="

          test -n "${RELEASE_KEYSTORE:-}"
          test -f "$RELEASE_KEYSTORE"

          test -n "${RELEASE_KEYSTORE_PASSWORD:-}"
          test -n "${RELEASE_KEY_ALIAS:-}"
          test -n "${RELEASE_KEY_PASSWORD:-}"

          keytool \
            -list \
            -keystore "$RELEASE_KEYSTORE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            >/dev/null

          echo ""
          echo "SIGNING ENVIRONMENT VERIFIED."
          echo "SIGNING MODE: ${RELEASE_SIGNING_MODE}"


      # ============================================================
      # 24. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ZIPALIGN RELEASE APK"
          echo "=============================================="

          INPUT_APK="$APK_PATH"
          ALIGNED_APK="$RUNNER_TEMP/$APK_UNSIGNED_NAME"

          rm -f "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          test -f "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c \
            -v \
            4 \
            "$ALIGNED_APK"

          echo "ALIGNED_APK=$ALIGNED_APK" >> "$GITHUB_ENV"

          echo ""
          echo "ZIPALIGN PASSED."


      # ============================================================
      # 25. SIGN APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "SIGN RELEASE APK"
          echo "=============================================="

          SIGNED_APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          rm -f "$SIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RELEASE_KEYSTORE" \
            --ks-type JKS \
            --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass "pass:$RELEASE_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          test -f "$SIGNED_APK"

          echo ""
          echo "SIGNED APK CREATED:"
          ls -lh "$SIGNED_APK"


      # ============================================================
      # 26. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY APK SIGNATURE"
          echo "=============================================="

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          test -f "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE VERIFIED."


      # ============================================================
      # 27. FINAL APK VALIDATION
      # ============================================================

      - name: Final APK Validation
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FINAL APK VALIDATION"
          echo "=============================================="

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")

          echo ""
          echo "APK SIZE:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo ""
            echo "ERROR: APK size unexpectedly small."
            exit 1
          fi

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging \
              "$APK"
          )

          echo ""
          echo "APK INFORMATION:"

          echo "$BADGING" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          if ! echo "$BADGING" | grep -q \
            "name='$PACKAGE_NAME'"; then

            echo ""
            echo "ERROR: Final APK package mismatch."
            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionCode='$VERSION_CODE'"; then

            echo ""
            echo "ERROR: Final APK version code mismatch."
            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionName='$VERSION_NAME'"; then

            echo ""
            echo "ERROR: Final APK version name mismatch."
            exit 1
          fi

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "=============================================="
          echo "FINAL APK VALIDATION PASSED"
          echo "=============================================="


      # ============================================================
      # 28. UPLOAD FINAL SIGNED APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: ${{ env.APK_SIGNED_NAME }}
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 29. UPLOAD BUILD REPORTS
      # ============================================================

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/**
          if-no-files-found: warn
          retention-days: 14
