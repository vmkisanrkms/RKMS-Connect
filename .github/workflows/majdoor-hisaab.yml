name: Build Majdoor Hisaab PRO V27 v2.10 FINAL APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-v27-final-release
  cancel-in-progress: true

jobs:
  build:
    name: V27 v2.10 FINAL Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK: PASS"

      - name: Find V27 V5 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="Majdoor_Hisaab_PRO_V27_FULL_AUDITED_V5.zip"

          ZIP_FILE="$GITHUB_WORKSPACE/$ZIP_NAME"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "$ZIP_NAME" \
                -print -quit
            )"
          fi

          if [ -z "${ZIP_FILE:-}" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_NAME not found."
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "V27_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Using:"
          ls -lh "$ZIP_FILE"

      - name: Verify V27 ZIP structure
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$V27_ZIP" >/dev/null

          unzip -l "$V27_ZIP" | grep -Fq "src/settings.gradle.kts"
          unzip -l "$V27_ZIP" | grep -Fq "src/build.gradle.kts"
          unzip -l "$V27_ZIP" | grep -Fq "src/gradle.properties"
          unzip -l "$V27_ZIP" | grep -Fq "src/gradlew"
          unzip -l "$V27_ZIP" | grep -Fq "src/app/build.gradle.kts"
          unzip -l "$V27_ZIP" | grep -Fq "src/app/src/main/AndroidManifest.xml"
          unzip -l "$V27_ZIP" | grep -Fq "src/app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          echo "V27 ZIP structure: PASS"

      - name: Extract V27 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/v27-source"

          mkdir -p "$GITHUB_WORKSPACE/v27-source"

          unzip -q "$V27_ZIP" \
            -d "$GITHUB_WORKSPACE/v27-source"

          find "$GITHUB_WORKSPACE/v27-source/src" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -250

      - name: Set V27 project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$GITHUB_WORKSPACE/v27-source/src"

          test -d "$PROJECT_ROOT"
          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/gradle.properties"
          test -f "$PROJECT_ROOT/gradlew"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "$PROJECT_ROOT"

      - name: Audit V27 project files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "gradlew"
            "gradlew.bat"
            "gradle/wrapper/gradle-wrapper.jar"
            "gradle/wrapper/gradle-wrapper.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing required file:"
              echo "$FILE"
              exit 1
            fi
          done

          chmod +x gradlew

          echo "All required V27 files: PASS"

      - name: Verify settings.gradle.kts
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq 'rootProject.name="MajdoorHisaab"' settings.gradle.kts
          grep -Fq 'include(":app")' settings.gradle.kts

          echo "settings.gradle.kts: PASS"

      - name: Verify root Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq \
            'id("com.android.application") version "8.9.1" apply false' \
            build.gradle.kts

          grep -Fq \
            'id("org.jetbrains.kotlin.android") version "2.1.20" apply false' \
            build.gradle.kts

          grep -Fq \
            'gradleVersion = "8.11.1"' \
            build.gradle.kts

          grep -Fq \
            'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' \
            build.gradle.kts

          echo "Root Gradle configuration: PASS"

      - name: Verify V27 application configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APP="app/build.gradle.kts"

          grep -Fq 'namespace = "com.majdoor.hisaab"' "$APP"
          grep -Fq 'compileSdk = 35' "$APP"
          grep -Fq 'applicationId = "com.majdoor.hisaab"' "$APP"
          grep -Fq 'minSdk = 26' "$APP"
          grep -Fq 'targetSdk = 35' "$APP"
          grep -Fq 'versionCode = 30' "$APP"
          grep -Fq 'versionName = "2.10"' "$APP"
          grep -Fq 'JavaVersion.VERSION_17' "$APP"
          grep -Fq 'jvmTarget = "17"' "$APP"
          grep -Fq \
            'signingConfig = signingConfigs.getByName("release")' \
            "$APP"

          echo "Application configuration: PASS"

      - name: Verify AndroidManifest.xml
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          MANIFEST="app/src/main/AndroidManifest.xml"

          grep -Fq \
            'android:label="Majdoor Hisaab PRO"' \
            "$MANIFEST"

          grep -Fq \
            'android:icon="@drawable/majdoor_logo"' \
            "$MANIFEST"

          grep -Fq \
            'android:name=".MainActivity"' \
            "$MANIFEST"

          grep -Fq \
            'android:exported="true"' \
            "$MANIFEST"

          echo "AndroidManifest.xml: PASS"

      - name: Verify MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          MAIN="app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          test -s "$MAIN"

          grep -Fq \
            'package com.majdoor.hisaab' \
            "$MAIN"

          echo "MainActivity.kt: PASS"

          wc -c "$MAIN"

      - name: Verify Gradle Wrapper 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          chmod +x gradlew

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' \
            gradle/wrapper/gradle-wrapper.properties

          echo "Gradle wrapper configuration: PASS"

      - name: Test Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          chmod +x gradlew

          ./gradlew --version

          ./gradlew --version \
            | grep -Fq "Gradle 8.11.1"

          echo "Gradle 8.11.1: PASS"

      - name: Verify release signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret missing."
            exit 1
          fi

          if [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: RELEASE_KEYSTORE_PASSWORD secret missing."
            exit 1
          fi

          if [ -z "$RELEASE_KEY_ALIAS" ]; then
            echo "ERROR: RELEASE_KEY_ALIAS secret missing."
            exit 1
          fi

          if [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "ERROR: RELEASE_KEY_PASSWORD secret missing."
            exit 1
          fi

          echo "Release signing secrets: PRESENT"

      - name: Restore permanent release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          rm -f release.keystore

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > release.keystore

          test -s release.keystore

          cat >> gradle.properties <<EOF
          releaseStoreFile=$PROJECT_ROOT/release.keystore
          releaseStorePassword=$RELEASE_KEYSTORE_PASSWORD
          releaseKeyAlias=$RELEASE_KEY_ALIAS
          releaseKeyPassword=$RELEASE_KEY_PASSWORD
          EOF

          echo "Permanent release keystore restored."

      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -f release.keystore
          test -s release.keystore

          grep -Fq "releaseStoreFile=" \
            gradle.properties

          grep -Fq "releaseStorePassword=" \
            gradle.properties

          grep -Fq "releaseKeyAlias=" \
            gradle.properties

          grep -Fq "releaseKeyPassword=" \
            gradle.properties

          echo "Release signing configuration: PASS"

      # ---------------------------------------------------------
      # EXACT SOURCE FIX
      # Previous build failed at:
      # MainActivity.kt:1211
      # MainActivity.kt:1212
      #
      # Hotspot constructor expects Float:
      # x:Float, y:Float, w:Float, h:Float
      #
      # Only the two failing backup() lines are corrected here.
      # No generic regex / unrelated source changes.
      # ---------------------------------------------------------

      - name: Fix exact MainActivity Hotspot Float error
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          MAIN="app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          python3 - "$MAIN" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              s = f.read()

          old1 = '''            Hotspot("Back",0,0,12,10){home()}, Hotspot("Create Backup",8,14,40,15){createBackup()}, Hotspot("Restore Backup",52,14,40,15){pickRestore()},'''

          new1 = '''            Hotspot("Back",0f,0f,12f,10f){home()}, Hotspot("Create Backup",8f,14f,40f,15f){createBackup()}, Hotspot("Restore Backup",52f,14f,40f,15f){pickRestore()},'''

          old2 = '''            Hotspot("Currency",8,48,84,8){currencyDialog()}, Hotspot("Language",8,57,84,8){languageDialog()}, Hotspot("Theme",8,66,84,8){themeDialog()}, Hotspot("Reset",8,74,84,8){confirmResetReference()}'''

          new2 = '''            Hotspot("Currency",8f,48f,84f,8f){currencyDialog()}, Hotspot("Language",8f,57f,84f,8f){languageDialog()}, Hotspot("Theme",8f,66f,84f,8f){themeDialog()}, Hotspot("Reset",8f,74f,84f,8f){confirmResetReference()}'''

          if old1 not in s:
              raise SystemExit(
                  "ERROR: Expected backup() line 1211 was not found exactly."
              )

          if old2 not in s:
              raise SystemExit(
                  "ERROR: Expected backup() line 1212 was not found exactly."
              )

          s = s.replace(old1, new1, 1)
          s = s.replace(old2, new2, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(s)

          print("Exact backup() Float correction: APPLIED")
          PY

          echo
          echo "Corrected MainActivity backup() section:"
          sed -n '1208,1214p' "$MAIN"

          echo
          echo "Exact source fix: PASS"

      - name: Verify exact source fix
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          MAIN="app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          grep -Fq \
            'Hotspot("Back",0f,0f,12f,10f)' \
            "$MAIN"

          grep -Fq \
            'Hotspot("Create Backup",8f,14f,40f,15f)' \
            "$MAIN"

          grep -Fq \
            'Hotspot("Restore Backup",52f,14f,40f,15f)' \
            "$MAIN"

          grep -Fq \
            'Hotspot("Currency",8f,48f,84f,8f)' \
            "$MAIN"

          grep -Fq \
            'Hotspot("Language",8f,57f,84f,8f)' \
            "$MAIN"

          grep -Fq \
            'Hotspot("Theme",8f,66f,84f,8f)' \
            "$MAIN"

          grep -Fq \
            'Hotspot("Reset",8f,74f,84f,8f)' \
            "$MAIN"

          echo "Exact source verification: PASS"

      - name: Clean V27 build
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          ./gradlew clean --no-daemon

          rm -rf app/build/outputs/apk
          rm -rf app/build/outputs/bundle

          echo "Clean build environment: PASS"

      - name: Build FINAL Release APK only
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify final release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final release APK not found."

            find app/build/outputs \
              -type f \
              | sort || true

            exit 1
          fi

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          ls -lh "$APK"

          echo "Integrity: PASS"

      - name: Verify no debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          DEBUG_APKS="$(
            find app/build/outputs/apk \
              -type f \
              -iname "*debug*.apk" \
              2>/dev/null || true
          )"

          if [ -n "$DEBUG_APKS" ]; then
            echo "ERROR: Debug APK exists:"
            echo "$DEBUG_APKS"
            exit 1
          fi

          echo "Debug APK: NONE"

      - name: Verify no AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          AABS="$(
            find app/build/outputs \
              -type f \
              \( -name "*.aab" -o -name "*.aab.zip" \) \
              2>/dev/null || true
          )"

          if [ -n "$AABS" ]; then
            echo "ERROR: AAB generated:"
            echo "$AABS"
            exit 1
          fi

          echo "AAB: NONE"

      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -x "$AAPT"

          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -Fq "package: name='com.majdoor.hisaab'"

          echo "$BADGING" \
            | grep -Fq "versionCode='30'"

          echo "$BADGING" \
            | grep -Fq "versionName='2.10'"

          echo "Package/version verification: PASS"

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo "Release APK signature: PASS"

      - name: Generate final APK SHA-256
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          sha256sum "$APK" \
            | tee "$GITHUB_WORKSPACE/release-apk-sha256.txt"

      - name: Prepare FINAL artifact
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          rm -rf "$GITHUB_WORKSPACE/final"

          mkdir -p "$GITHUB_WORKSPACE/final"

          cp \
            app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/final/Majdoor-Hisaab-PRO-V27-v2.10-FINAL.apk"

          cp \
            "$GITHUB_WORKSPACE/release-apk-sha256.txt" \
            "$GITHUB_WORKSPACE/final/release-apk-sha256.txt"

          ls -lh "$GITHUB_WORKSPACE/final"

      - name: Upload FINAL Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V27-v2.10-FINAL-Release-APK
          path: final/Majdoor-Hisaab-PRO-V27-v2.10-FINAL.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload FINAL APK SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V27-v2.10-SHA256
          path: final/release-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Final build summary
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "MAJDOOR HISAAB PRO V27 v2.10"
          echo "FINAL RELEASE BUILD"
          echo "=================================================="
          echo "Package      : com.majdoor.hisaab"
          echo "Version      : 2.10"
          echo "VersionCode  : 30"
          echo "compileSdk   : 35"
          echo "targetSdk    : 35"
          echo "minSdk       : 26"
          echo "Java         : 17"
          echo "AGP          : 8.9.1"
          echo "Kotlin       : 2.1.20"
          echo "Gradle       : 8.11.1"
          echo "Build type   : RELEASE"
          echo "Debug APK    : NO"
          echo "AAB          : NO"
          echo "Signing      : PERMANENT RELEASE KEY"
          echo "=================================================="
          echo "BUILD COMPLETE"
          echo "=================================================="
