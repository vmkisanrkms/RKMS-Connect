name: MAJDOOR HISAAB PRO — FINAL RELEASE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

jobs:
  build-test-sign-runtime:
    name: FINAL BUILD / TEST / SIGN / RUNTIME
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. EXTRACT LOCKED PROJECT
      # ============================================================

      - name: Extract locked project ZIP into repository root
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="Majdoor_Hisaab_PRO_FINAL_LOCKED.zip"

          test -s "$ZIP"

          rm -rf .mhp-extract
          mkdir -p .mhp-extract

          unzip -q "$ZIP" -d .mhp-extract

          test -s .mhp-extract/settings.gradle.kts
          test -s .mhp-extract/build.gradle.kts
          test -s .mhp-extract/app/build.gradle.kts
          test -s .mhp-extract/gradlew
          test -s .mhp-extract/gradlew.bat
          test -s .mhp-extract/gradle/wrapper/gradle-wrapper.properties
          test -s .mhp-extract/gradle/wrapper/gradle-wrapper.jar

          cp -a .mhp-extract/. .

          rm -rf .mhp-extract

          chmod +x ./gradlew
          chmod +x scripts/*.sh

          test -x ./gradlew

          echo "ZIP_PROJECT_EXTRACTION=PASS"


      # ============================================================
      # 3. VERIFY PROJECT / TOOLCHAIN
      # ============================================================

      - name: Verify Android project and pinned toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          test -x gradlew
          test -f gradlew.bat

          test -s gradle/wrapper/gradle-wrapper.properties
          test -s gradle/wrapper/gradle-wrapper.jar

          grep -q 'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip' \
            gradle/wrapper/gradle-wrapper.properties

          grep -q 'distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' \
            gradle/wrapper/gradle-wrapper.properties

          grep -q 'id("com.android.application") version "8.9.1"' \
            build.gradle.kts

          grep -q 'id("org.jetbrains.kotlin.android") version "2.1.21"' \
            build.gradle.kts

          grep -q 'applicationId = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -q 'versionCode = 77' \
            app/build.gradle.kts

          grep -q 'versionName = "1.77.0"' \
            app/build.gradle.kts

          grep -q 'compileSdk = 36' \
            app/build.gradle.kts

          grep -q 'targetSdk = 36' \
            app/build.gradle.kts

          grep -q 'jvmTarget = "17"' \
            app/build.gradle.kts

          echo "ANDROID_PROJECT_AND_TOOLCHAIN=PASS"


      # ============================================================
      # 4. JDK 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator"
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"


      # ============================================================
      # 6. ANDROID API 36 / BUILD TOOLS / EMULATOR
      # ============================================================

      - name: Install Android API 36 and build tools
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          test -n "$SDK"
          test -d "$SDK"

          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator"

          test -d "$SDK/platforms/android-36"
          test -d "$SDK/build-tools/36.0.0"
          test -d "$SDK/platform-tools"
          test -d "$SDK/emulator"

          test -x "$SDK/platform-tools/adb"
          test -x "$SDK/emulator/emulator"
          test -x "$SDK/build-tools/36.0.0/zipalign"
          test -x "$SDK/build-tools/36.0.0/apksigner"

          echo "ANDROID_SDK_API_36=PASS"
          echo "ANDROID_BUILD_TOOLS_36=PASS"
          echo "ANDROID_EMULATOR=PASS"


      # ============================================================
      # 7. CRITICAL FIX:
      #    ADD ANDROID SDK DIRECTORIES TO GITHUB PATH
      # ============================================================

      - name: Configure Android SDK tool PATH
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          test -n "$SDK"
          test -d "$SDK"

          PLATFORM_TOOLS="$SDK/platform-tools"
          EMULATOR_DIR="$SDK/emulator"
          BUILD_TOOLS_DIR="$SDK/build-tools/${BUILD_TOOLS}"

          test -d "$PLATFORM_TOOLS"
          test -d "$EMULATOR_DIR"
          test -d "$BUILD_TOOLS_DIR"

          # Find installed command-line tools directory.
          CMDLINE_ROOT="$SDK/cmdline-tools"

          test -d "$CMDLINE_ROOT"

          CMDLINE_BIN=""

          if [ -d "$CMDLINE_ROOT/22.0/bin" ]; then
            CMDLINE_BIN="$CMDLINE_ROOT/22.0/bin"
          elif [ -d "$CMDLINE_ROOT/latest/bin" ]; then
            CMDLINE_BIN="$CMDLINE_ROOT/latest/bin"
          else
            CMDLINE_BIN="$(
              find "$CMDLINE_ROOT" \
                -mindepth 2 \
                -maxdepth 2 \
                -type d \
                -name bin \
                | sort -V \
                | tail -n 1
            )"
          fi

          test -n "$CMDLINE_BIN"
          test -d "$CMDLINE_BIN"

          test -x "$CMDLINE_BIN/sdkmanager"
          test -x "$CMDLINE_BIN/apkanalyzer"
          test -x "$CMDLINE_BIN/avdmanager"

          # Persist PATH for every following GitHub Actions step.
          echo "$PLATFORM_TOOLS" >> "$GITHUB_PATH"
          echo "$EMULATOR_DIR" >> "$GITHUB_PATH"
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"

          # Also configure this shell for immediate validation.
          export PATH="$PLATFORM_TOOLS:$EMULATOR_DIR:$BUILD_TOOLS_DIR:$CMDLINE_BIN:$PATH"

          test -x "$PLATFORM_TOOLS/adb"
          test -x "$EMULATOR_DIR/emulator"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          test -x "$CMDLINE_BIN/sdkmanager"
          test -x "$CMDLINE_BIN/apkanalyzer"
          test -x "$CMDLINE_BIN/avdmanager"

          echo "ANDROID_SDK_ROOT=$SDK"
          echo "ANDROID_CMDLINE_TOOLS=$CMDLINE_BIN"
          echo "ANDROID_SDK_PATH=PASS"


      # ============================================================
      # 8. VERIFY ALL ANDROID SDK TOOLS
      # ============================================================

      - name: Verify Android SDK tools
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "PATH=$PATH"

          command -v adb
          command -v sdkmanager
          command -v apkanalyzer
          command -v avdmanager
          command -v emulator
          command -v zipalign
          command -v apksigner

          adb version

          sdkmanager --version

          apkanalyzer --help >/dev/null

          avdmanager --help >/dev/null

          emulator -version

          zipalign -h >/dev/null

          apksigner >/dev/null 2>&1 || true

          echo "ANDROID_SDK_TOOLS=PASS"


      # ============================================================
      # 9. GRADLE WRAPPER
      # ============================================================

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x ./gradlew

          ./gradlew --version

          ./gradlew --version |
            grep -F "Gradle ${GRADLE_VERSION}"


      # ============================================================
      # 10. STATIC ACCEPTANCE
      # ============================================================

      - name: Static acceptance gates
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "CLEAN_RUNNER=github-hosted-ubuntu-latest"

          ./scripts/acceptance-gates.sh


      # ============================================================
      # 11. DEPENDENCY HEALTH
      # ============================================================

      - name: Dependency health
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/dependency-health.sh


      # ============================================================
      # 12. KOTLIN COMPATIBILITY
      # ============================================================

      - name: Gradle Kotlin compatibility
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/gradle-kotlin-compatibility.sh


      # ============================================================
      # 13. AGP COMPATIBILITY
      # ============================================================

      - name: Gradle AGP compatibility
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/gradle-agp-compatibility.sh


      # ============================================================
      # 14. ARCHITECTURE
      # ============================================================

      - name: Architecture gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase15-architecture-gate.sh


      # ============================================================
      # 15. CONFIGURATION LIFECYCLE
      # ============================================================

      - name: Configuration lifecycle gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase18-configuration-lifecycle-gate.sh


      # ============================================================
      # 16. OFFLINE FIRST
      # ============================================================

      - name: Offline first gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase19-offline-first-gate.sh


      # ============================================================
      # 17. SECURITY DATA
      # ============================================================

      - name: Security data gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase20-security-data-gate.sh


      # ============================================================
      # 18. UI / UX
      # ============================================================

      - name: UI UX gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase21-ui-ux-gate.sh


      # ============================================================
      # 19. CLEAN DEPENDENCY RESOLUTION
      # ============================================================

      - name: Clean dependency resolution
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            dependencies \
            --configuration debugRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            dependencies \
            --configuration testRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            dependencies \
            --configuration e2eReleaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            dependencies \
            --configuration releaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            buildEnvironment


      # ============================================================
      # 20. UNIT TESTS
      # ============================================================

      - name: Unit tests
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew --no-daemon test


      # ============================================================
      # 21. COMPILE REQUIRED VARIANTS
      # ============================================================

      - name: Compile all required variants
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            compileDebugKotlin \
            compileDebugJavaWithJavac \
            assembleDebug \
            compileE2eReleaseKotlin \
            assembleE2eRelease \
            compileReleaseKotlin \
            assembleRelease \
            assembleReleaseAndroidTest


      # ============================================================
      # 22. DEBUG APK
      # ============================================================

      - name: Verify Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" |
            grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" |
            grep -Fx "$VERSION_NAME"

          apkanalyzer manifest version-code "$APK" |
            grep -Fx "$VERSION_CODE"

          mkdir -p artifacts/debug

          cp "$APK" \
            artifacts/debug/Majdoor-Hisaab-PRO-debug.apk

          sha256sum "$APK" |
            tee artifacts/debug/Majdoor-Hisaab-PRO-debug.sha256


      # ============================================================
      # 23. RELEASE BUILD
      # ============================================================

      - name: Release build gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/release-build-gate.sh


      # ============================================================
      # 24. UNSIGNED RELEASE APK
      # ============================================================

      - name: Verify unsigned Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" |
            grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" |
            grep -Fx "$VERSION_NAME"

          apkanalyzer manifest version-code "$APK" |
            grep -Fx "$VERSION_CODE"

          mkdir -p artifacts

          cp "$APK" \
            artifacts/app-release-unsigned.apk

          unzip -t "$APK" >/dev/null


      # ============================================================
      # 25. RESTORE PRODUCTION SIGNING KEY
      # ============================================================

      - name: Restore production signing key
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$EXPECTED_CERT"

          printf '%s' "$KEYSTORE_B64" |
            base64 --decode > release.keystore

          test -s release.keystore

          keytool -list -v \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > cert.txt

          ACTUAL_CERT="$(
            awk -F': ' '/SHA256:/{print $2; exit}' cert.txt |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_CERT="$(
            printf '%s' "$EXPECTED_CERT" |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )"

          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

          echo "PRODUCTION_CERTIFICATE=PASS"


      # ============================================================
      # 26. SIGN PRODUCTION RELEASE
      # ============================================================

      - name: Sign production Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app-release-aligned.apk"
          SIGNED="artifacts/Majdoor-Hisaab-PRO-release.apk"

          TEST_UNSIGNED="app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          TEST_ALIGNED="app-release-androidTest-aligned.apk"
          TEST_SIGNED="artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

          test -s "$UNSIGNED"
          test -s "$TEST_UNSIGNED"
          test -s release.keystore

          zipalign \
            -f \
            -p 4 \
            "$UNSIGNED" \
            "$ALIGNED"

          zipalign \
            -c \
            -v 4 \
            "$ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          test -s "$SIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$SIGNED" |
            tee artifacts/release-signature.txt

          ACTUAL_SIGNED_CERT="$(
            apksigner verify \
              --print-certs \
              "$SIGNED" |
            awk -F': ' \
              '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_SIGNED_CERT="$(
            printf '%s' "$EXPECTED_CERT" |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )"

          test -n "$ACTUAL_SIGNED_CERT"
          test "$ACTUAL_SIGNED_CERT" = "$EXPECTED_SIGNED_CERT"

          unzip -t "$SIGNED" >/dev/null

          zipalign \
            -c \
            -v 4 \
            "$SIGNED"

          zipalign \
            -f \
            -p 4 \
            "$TEST_UNSIGNED" \
            "$TEST_ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$TEST_SIGNED" \
            "$TEST_ALIGNED"

          test -s "$TEST_SIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$TEST_SIGNED" >/dev/null

          rm -f \
            "$ALIGNED" \
            "$TEST_ALIGNED" \
            cert.txt \
            release.keystore

          echo "PRODUCTION_SIGNING=PASS"


      # ============================================================
      # 27. PRODUCTION SIGNING GATE
      # ============================================================

      - name: Production signing gate
        env:
          MH_RELEASE_CERT_SHA256: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/production-signing-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk


      # ============================================================
      # 28. FINAL SIGNED APK VERIFICATION
      # ============================================================

      - name: Verify final signed APK and checksum
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" |
            grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" |
            grep -Fx "$VERSION_NAME"

          apkanalyzer manifest version-code "$APK" |
            grep -Fx "$VERSION_CODE"

          unzip -t "$APK" >/dev/null

          zipalign \
            -c \
            -v 4 \
            "$APK"

          apksigner verify \
            --verbose \
            --print-certs \
            "$APK" |
            tee artifacts/release-signature-final.txt

          sha256sum \
            artifacts/Majdoor-Hisaab-PRO-release.apk |
            tee artifacts/Majdoor-Hisaab-PRO-release.sha256

          test -s artifacts/Majdoor-Hisaab-PRO-release.sha256


      # ============================================================
      # 29. PHASE 1
      # ============================================================

      - name: Phase 1 points 18-25 gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase1-points-18-25-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk


      # ============================================================
      # 30. DEBUG RUNTIME
      # ============================================================

      - name: Install and launch Debug APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            adb install -r \
              app/build/outputs/apk/debug/app-debug.apk

            adb shell am force-stop "$PACKAGE_NAME"

            adb shell am start -W \
              -n "$PACKAGE_NAME/com.majdoor.hisaab.MainActivity"

            sleep 2

            adb shell pidof "$PACKAGE_NAME" |
              grep -Eq '[0-9]+'

            adb shell cmd package resolve-activity \
              --brief \
              -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER \
              "$PACKAGE_NAME" |
              grep -q "$PACKAGE_NAME"

            mkdir -p artifacts/debug

            adb logcat -d -t 10000 >
              artifacts/debug/debug-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/debug/debug-logcat.txt; then
              exit 1
            fi


      # ============================================================
      # 31. ANDROID API 36 CORE E2E
      # ============================================================

      - name: Android API 36 Core E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest


      # ============================================================
      # 32. PHASE 17 / 18 / 22
      # ============================================================

      - name: Phase 17 18 and 22 runtime tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.Phase17RealAndroidRuntimeE2ETest \
              --tests com.majdoor.hisaab.Phase18ConfigurationLifecycleE2ETest \
              --tests com.majdoor.hisaab.Phase22FinalRedListE2ETest

            ./scripts/phase18-device-reboot-gate.sh

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/555_556_557_558_559_runtime.pass


      # ============================================================
      # 33. CLEAN INSTALL / BACKUP / RESTORE
      # ============================================================

      - name: Clean install backup restore E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.CleanInstallBackupRestoreE2ETest

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/552_553_clean_install_restore_totals.pass


      # ============================================================
      # 34. SECURITY RUNTIME
      # ============================================================

      - name: Security runtime E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
