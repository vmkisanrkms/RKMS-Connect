name: Majdoor Hisaab PRO - Final Signed Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

jobs:

  # ============================================================
  # 1. STATIC AUDIT + UNIT TESTS + DEBUG/RELEASE BUILD
  # ============================================================
  build:
    name: Build, Audit and Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project structure
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          echo "PROJECT_STRUCTURE=PASS"

      - name: Verify exact Gradle wrapper
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -Fq \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip' \
            gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            'distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' \
            gradle/wrapper/gradle-wrapper.properties

          echo "GRADLE_WRAPPER=8.11.1"
          echo "GRADLE_WRAPPER_SHA256=PINNED"
          echo "GRADLE_WRAPPER_GATE=PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK API 36
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          sdkmanager --list_installed | grep -E \
            "platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}|platform-tools"

      - name: Verify Java, Gradle and Android tools
        shell: bash
        run: |
          set -Eeuo pipefail

          java -version
          ./gradlew --version

          command -v adb
          command -v apkanalyzer
          command -v apksigner
          command -v zipalign

          sdkmanager --list_installed | grep "platforms;android-${ANDROID_API}"
          sdkmanager --list_installed | grep "build-tools;${BUILD_TOOLS}"

      # ----------------------------------------------------------
      # Exact source configuration audit
      # ----------------------------------------------------------

      - name: Audit Android build configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -Fq 'id("com.android.application") version "8.9.1"' build.gradle.kts
          grep -Fq 'id("org.jetbrains.kotlin.android") version "2.1.21"' build.gradle.kts

          grep -Fq 'compileSdk = 36' app/build.gradle.kts
          grep -Fq 'targetSdk = 36' app/build.gradle.kts
          grep -Fq 'applicationId = "com.majdoor.hisaab"' app/build.gradle.kts
          grep -Fq 'versionCode = 77' app/build.gradle.kts
          grep -Fq 'versionName = "1.77.0"' app/build.gradle.kts

          grep -Fq 'sourceCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -Fq 'targetCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -Fq 'jvmTarget = "17"' app/build.gradle.kts

          echo "AGP=8.9.1"
          echo "KOTLIN=2.1.21"
          echo "COMPILE_SDK=36"
          echo "TARGET_SDK=36"
          echo "PACKAGE=${PACKAGE_NAME}"
          echo "VERSION=${VERSION_NAME}"
          echo "VERSION_CODE=${VERSION_CODE}"
          echo "BUILD_CONFIGURATION_AUDIT=PASS"

      # ----------------------------------------------------------
      # Offline architecture / security checks
      # ----------------------------------------------------------

      - name: Audit offline architecture
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f app/src/main/java/com/majdoor/hisaab/storage/LocalStore.kt
          test -f app/src/main/java/com/majdoor/hisaab/storage/CoreSqliteStore.kt
          test -f app/src/main/java/com/majdoor/hisaab/data/repository/LocalRepository.kt

          grep -R -q --include='*.kt' 'SQLiteOpenHelper' \
            app/src/main/java/com/majdoor/hisaab

          grep -R -q --include='*.kt' 'CoreSqliteStore' \
            app/src/main/java/com/majdoor/hisaab

          grep -R -q --include='*.kt' 'LocalRepository' \
            app/src/main/java/com/majdoor/hisaab

          # Network/backend must not be present.
          if grep -RniE \
            'FirebaseDatabase|FirebaseFirestore|Retrofit|OkHttp|Supabase|HttpURLConnection' \
            app/src/main app/build.gradle.kts; then
            echo "ERROR: Unexpected network/backend dependency found"
            exit 1
          fi

          # Internet permission must not be present.
          if grep -Fq 'android.permission.INTERNET' \
            app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission found"
            exit 1
          fi

          echo "OFFLINE_ARCHITECTURE_GATE=PASS"

      # ----------------------------------------------------------
      # Security / startup audit
      # ----------------------------------------------------------

      - name: Audit security and startup
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f app/src/main/java/com/majdoor/hisaab/security/AutoLockManager.kt

          grep -R -q --include='*.kt' 'AutoLockManager' \
            app/src/main/java/com/majdoor/hisaab

          grep -R -q --include='*.kt' 'Biometric' \
            app/src/main/java/com/majdoor/hisaab

          grep -R -q --include='*.kt' 'PIN' \
            app/src/main/java/com/majdoor/hisaab

          grep -Fq 'android.permission.USE_BIOMETRIC' \
            app/src/main/AndroidManifest.xml

          grep -Fq 'android.permission.RECEIVE_BOOT_COMPLETED' \
            app/src/main/AndroidManifest.xml

          grep -Fq 'android.intent.action.MAIN' \
            app/src/main/AndroidManifest.xml

          grep -Fq 'android.intent.category.LAUNCHER' \
            app/src/main/AndroidManifest.xml

          echo "SECURITY_STARTUP_GATE=PASS"

      # ----------------------------------------------------------
      # Feature/source audit
      # ----------------------------------------------------------

      - name: Audit core feature modules
        shell: bash
        run: |
          set -Eeuo pipefail

          test -d app/src/main/java/com/majdoor/hisaab

          # Core calculation engines
          test -f app/src/main/java/com/majdoor/hisaab/calculation/LedgerCalculator.kt
          test -f app/src/main/java/com/majdoor/hisaab/calculation/WorkRateEngine.kt
          test -f app/src/main/java/com/majdoor/hisaab/report/ReportEngine.kt

          # Backup
          test -f app/src/main/java/com/majdoor/hisaab/backup/BootCompletedReceiver.kt
          test -f app/src/main/java/com/majdoor/hisaab/backup/AutoBackupReceiver.kt

          # Reports
          test -f app/src/main/java/com/majdoor/hisaab/report/ReportService.kt

          grep -q 'pdfReport' \
            app/src/main/java/com/majdoor/hisaab/report/ReportService.kt

          grep -q 'csvReport' \
            app/src/main/java/com/majdoor/hisaab/report/ReportService.kt

          echo "CORE_FEATURE_AUDIT=PASS"

      # ----------------------------------------------------------
      # Run repository static gates that are known to be reliable
      # ----------------------------------------------------------

      - name: Run Gradle and Kotlin compatibility gates
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x scripts/*.sh

          ./scripts/gradle-agp-compatibility.sh
          ./scripts/gradle-kotlin-compatibility.sh

      # ----------------------------------------------------------
      # Dependency resolution
      # ----------------------------------------------------------

      - name: Resolve all dependencies from clean environment
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration debugRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration releaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration e2eReleaseRuntimeClasspath

          echo "DEPENDENCY_RESOLUTION=PASS"

      # ----------------------------------------------------------
      # Unit tests + all APK variants
      # ----------------------------------------------------------

      - name: Run unit tests and build all required APK variants
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            test \
            compileDebugKotlin \
            assembleDebug \
            compileE2eReleaseKotlin \
            assembleE2eRelease \
            compileReleaseKotlin \
            assembleRelease \
            assembleReleaseAndroidTest

      # ----------------------------------------------------------
      # Debug APK verification
      # ----------------------------------------------------------

      - name: Verify Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" \
            | grep -Fx "$VERSION_NAME"

          apkanalyzer manifest version-code "$APK" \
            | grep -Fx "$VERSION_CODE"

          mkdir -p artifacts/debug

          cp "$APK" \
            artifacts/debug/Majdoor-Hisaab-PRO-debug.apk

          sha256sum "$APK" \
            | tee artifacts/debug/Majdoor-Hisaab-PRO-debug.sha256

          echo "DEBUG_APK_GATE=PASS"

      # ----------------------------------------------------------
      # Unsigned release verification
      # ----------------------------------------------------------

      - name: Verify unsigned Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" \
            | grep -Fx "$VERSION_NAME"

          apkanalyzer manifest version-code "$APK" \
            | grep -Fx "$VERSION_CODE"

          unzip -t "$APK" >/dev/null

          unzip -l "$APK" \
            | grep -q 'AndroidManifest.xml'

          mkdir -p artifacts/release-build

          cp "$APK" \
            artifacts/release-build/app-release-unsigned.apk

          sha256sum "$APK" \
            | tee artifacts/release-build/app-release-unsigned.sha256

          echo "UNSIGNED_RELEASE_GATE=PASS"

      # ----------------------------------------------------------
      # Upload unsigned build reports before emulator work
      # ----------------------------------------------------------

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: majdoor-hisaab-build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            artifacts/debug/**
            artifacts/release-build/**
          if-no-files-found: warn

      # ----------------------------------------------------------
      # Debug emulator smoke test
      # ----------------------------------------------------------

      - name: Debug APK API 36 smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true
          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            adb install -r \
              "${GITHUB_WORKSPACE}/app/build/outputs/apk/debug/app-debug.apk"

            adb shell am force-stop "${PACKAGE_NAME}"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity" \
              | tee "${GITHUB_WORKSPACE}/artifacts/debug/debug-launch.txt"

            sleep 3

            adb shell pidof "${PACKAGE_NAME}" \
              | grep -Eq '[0-9]+'

            adb shell cmd package resolve-activity \
              --brief \
              -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER \
              "${PACKAGE_NAME}" \
              | grep -q "${PACKAGE_NAME}"

            adb logcat -d -t 15000 \
              > "${GITHUB_WORKSPACE}/artifacts/debug/debug-logcat.txt"

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              "${GITHUB_WORKSPACE}/artifacts/debug/debug-logcat.txt"; then
              exit 1
            fi

            echo "DEBUG_RUNTIME_GATE=PASS"

  # ============================================================
  # 2. PRODUCTION SIGNING
  # ============================================================
  sign:
    name: Sign Production Release APK
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download unsigned release APK
        uses: actions/download-artifact@v4
        with:
          name: majdoor-hisaab-build-reports
          path: downloaded

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Locate unsigned APK
        shell: bash
        run: |
          set -Eeuo pipefail

          find downloaded -type f -name 'app-release-unsigned.apk' -print

          test -f \
            downloaded/artifacts/release-build/app-release-unsigned.apk

      - name: Restore production keystore
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$EXPECTED_CERT"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

          keytool -list \
            -v \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > release-certificate.txt

          ACTUAL_CERT="$(
            awk -F': ' '/SHA256:/{print $2; exit}' release-certificate.txt \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_CERT="$(
            printf '%s' "$EXPECTED_CERT" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

          echo "PRODUCTION_CERTIFICATE=VERIFIED"

      - name: Zipalign and sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail

          UNSIGNED="downloaded/artifacts/release-build/app-release-unsigned.apk"
          ALIGNED="app-release-aligned.apk"
          SIGNED="Majdoor-Hisaab-PRO-release.apk"

          test -s "$UNSIGNED"
          test -s release.keystore

          zipalign -f -p 4 \
            "$UNSIGNED" \
            "$ALIGNED"

          zipalign -c -v 4 "$ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$SIGNED" \
            | tee release-signature.txt

          ACTUAL_CERT="$(
            apksigner verify --print-certs "$SIGNED" \
              | awk -F': ' \
                '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_CERT="$(
            printf '%s' "$EXPECTED_CERT" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

          unzip -t "$SIGNED" >/dev/null
          zipalign -c -v 4 "$SIGNED"

          mkdir -p artifacts

          mv "$SIGNED" \
            artifacts/Majdoor-Hisaab-PRO-release.apk

          cp release-signature.txt \
            artifacts/release-signature.txt

          sha256sum \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            | tee artifacts/Majdoor-Hisaab-PRO-release.sha256

          echo "PRODUCTION_SIGNING_GATE=PASS"

      - name: Verify final signed APK metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" \
            | grep -Fx "$VERSION_NAME"

          apkanalyzer manifest version-code "$APK" \
            | grep -Fx "$VERSION_CODE"

          apksigner verify \
            --verbose \
            --print-certs \
            "$APK"

          unzip -t "$APK" >/dev/null
          zipalign -c -v 4 "$APK"

          echo "SIGNED_RELEASE_METADATA=PASS"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: majdoor-hisaab-pro-release-apk
          path: artifacts/
          if-no-files-found: error

  # ============================================================
  # 3. REAL API 36 RELEASE E2E
  # ============================================================
  runtime:
    name: Release API 36 Runtime Tests
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: majdoor-hisaab-pro-release-apk
          path: artifacts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 36 SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Build E2E test APK
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleE2eRelease \
            assembleReleaseAndroidTest

          test -s \
            app/build/outputs/apk/androidTest/release/app-release-androidTest.apk

      - name: Install signed Release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true
          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            adb install -r \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release.apk"

            adb shell am force-stop "${PACKAGE_NAME}"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity"

            sleep 3

            adb shell pidof "${PACKAGE_NAME}" \
              | grep -Eq '[0-9]+'

            adb logcat -d -t 15000 \
              > "${GITHUB_WORKSPACE}/release-install-logcat.txt"

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              "${GITHUB_WORKSPACE}/release-install-logcat.txt"; then
              exit 1
            fi

            echo "SIGNED_RELEASE_LAUNCH=PASS"

      # ----------------------------------------------------------
      # Real E2E tests
      # ----------------------------------------------------------

      - name: Run complete E2E suite on API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true
          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest

      - name: Run rotation and error-state E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true
          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.RotationAndErrorStateE2ETest

      - name: Run security runtime E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true
          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.Phase17RealAndroidRuntimeE2ETest

      - name: Run configuration lifecycle E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true
          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.Phase18ConfigurationLifecycleE2ETest

      - name: Run offline-first E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
