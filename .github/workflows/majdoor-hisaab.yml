name: Majdoor Hisaab - Final Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"
  SOURCE_ZIP: "Majdoor_Hisaab_v1_1_source.zip"

jobs:
  build-release-apk:
    name: Build Final Release APK
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version

      # =========================================================
      # 3. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK installed."

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"

          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" version
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" version
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -h >/dev/null

          adb version

          echo "Android SDK verification: PASS"

      # =========================================================
      # 4. FIND SOURCE ZIP
      # =========================================================
      - name: Locate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Looking for:"
          echo "$SOURCE_ZIP"

          if [ ! -f "$SOURCE_ZIP" ]; then

            FOUND="$(
              find . \
                -type f \
                -name "$SOURCE_ZIP" \
                -print -quit
            )"

            if [ -z "$FOUND" ]; then
              echo "ERROR: $SOURCE_ZIP not found."
              echo ""
              echo "ZIP files available:"
              find . \
                -type f \
                -iname "*.zip" \
                -print

              exit 1
            fi

            cp "$FOUND" "$SOURCE_ZIP"
          fi

          test -f "$SOURCE_ZIP"

          ls -lh "$SOURCE_ZIP"

      # =========================================================
      # 5. EXTRACT SOURCE
      # =========================================================
      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-source
          mkdir -p build-source

          unzip -q "$SOURCE_ZIP" -d build-source

          echo ""
          echo "Extracted files:"
          find build-source \
            -maxdepth 6 \
            -type f \
            -print | sort

      # =========================================================
      # 6. SET PROJECT DIRECTORY
      # =========================================================
      - name: Set Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE/build-source"

          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Checking project files..."

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle.properties"
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          echo ""
          echo "Android project structure: PASS"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 7. AUDIT SOURCE
      # =========================================================
      - name: Audit project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================ ROOT BUILD ================"
          cat build.gradle.kts

          echo ""
          echo "================ APP BUILD ================"
          cat app/build.gradle.kts

          echo ""
          echo "================ SETTINGS ================"
          cat settings.gradle.kts

          echo ""
          echo "================ MAIN ACTIVITY ================"

          grep -n "onCreate" \
            app/src/main/java/com/majdoor/hisaab/MainActivity.kt \
            || true

      # =========================================================
      # 8. FIX MAIN ACTIVITY
      # =========================================================
      - name: Fix MainActivity
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          test -f "$FILE"

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/majdoor/hisaab/MainActivity.kt")

          s = p.read_text()

          pattern = r'(?m)^(\s*)fun\s+onCreate\s*\('

          s2, count = re.subn(
              pattern,
              r'\1override fun onCreate(',
              s,
              count=1
          )

          if count:
              p.write_text(s2)
              print("MainActivity onCreate override added.")
          else:
              print("onCreate already patched or not found.")
          PY

          echo ""
          grep -n -A2 -B2 "onCreate" "$FILE"

      # =========================================================
      # 9. JAVA 17 + KOTLIN 17
      # =========================================================
      - name: Configure Java 17 and Kotlin 17
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:

              marker = "android {"

              if marker not in s:
                  raise SystemExit(
                      "ERROR: android block not found."
                  )

              replacement = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """

              s = s.replace(
                  marker,
                  replacement,
                  1
              )

          if "JvmTarget.JVM_17" not in s:

              s += """

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          """

          p.write_text(s)

          print(
              "Java 17 + Kotlin JVM 17 configuration added."
          )
          PY

          echo ""
          echo "================ FINAL APP BUILD ================"

          cat app/build.gradle.kts

          echo ""
          echo "Checking forbidden old JVM settings..."

          if grep -RniE \
            'VERSION_1_8|VERSION_8|jvmTarget.*1\.8|jvmTarget.*"8"|options\.release' \
            app \
            --include='*.gradle' \
            --include='*.gradle.kts'; then

            echo ""
            echo "ERROR: Old JVM configuration found."
            exit 1
          fi

          echo ""
          echo "JVM configuration: PASS"

      # =========================================================
      # 10. GRADLE
      # =========================================================
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          VERSION="$(
            gradle --version |
            grep '^Gradle ' |
            awk '{print $2}'
          )"

          echo "Detected Gradle: $VERSION"

          test "$VERSION" = "8.11.1"

          echo "Gradle verification: PASS"

      # =========================================================
      # 11. FINAL PRE-BUILD AUDIT
      # =========================================================
      - name: Final pre-build audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================ PRE-BUILD AUDIT ================"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/majdoor/hisaab/MainActivity.kt

          echo ""
          echo "Application ID:"
          grep -n "applicationId" app/build.gradle.kts

          echo ""
          echo "Namespace:"
          grep -n "namespace" app/build.gradle.kts

          echo ""
          echo "Compile SDK:"
          grep -n "compileSdk" app/build.gradle.kts

          echo ""
          echo "Target SDK:"
          grep -n "targetSdk" app/build.gradle.kts

          echo ""
          echo "Kotlin JVM:"
          grep -n "JVM_17" app/build.gradle.kts

          echo ""
          echo "Java compatibility:"
          grep -n "VERSION_17" app/build.gradle.kts

          echo ""
          echo "PRE-BUILD AUDIT: PASS"

      # =========================================================
      # 12. BUILD RELEASE APK
      # =========================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "MAJDOOR HISAAB RELEASE APK"
          echo "=========================================="

          gradle \
            clean \
            assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD COMPLETED."

      # =========================================================
      # 13. FIND APK
      # =========================================================
      - name: Find Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              -path "*release*" \
              -print -quit
          )"

          if [ -z "$APK" ]; then

            echo "ERROR: Release APK not found."

            echo ""
            echo "Available APK files:"

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo ""
          echo "Release APK:"
          echo "$APK"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Unsigned-Release.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Unsigned-Release.apk"

      # =========================================================
      # 14. GENERATE RELEASE KEY
      #
      # IMPORTANT:
      # This creates a new CI signing key.
      # It makes this APK properly signed.
      # Keep the generated keystore artifact if this APK will
      # later receive updates using the same signing key.
      # =========================================================
      - name: Generate Release Keystore
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$GITHUB_WORKSPACE/majdoor-hisaab-release.keystore"

          keytool \
            -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/majdoor-hisaab-release.keystore" \
            -storetype PKCS12 \
            -storepass "MajdoorHisaab2026!" \
            -keypass "MajdoorHisaab2026!" \
            -alias "majdoor-hisaab-release" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Majdoor Hisaab, OU=RKMS, O=Majdoor Hisaab, L=India, ST=Uttar Pradesh, C=IN"

          test -f "$GITHUB_WORKSPACE/majdoor-hisaab-release.keystore"

          echo "Release keystore generated."

      # =========================================================
      # 15. ZIPALIGN APK
      # =========================================================
      - name: Zipalign Release APK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"

          INPUT="$GITHUB_WORKSPACE/Majdoor-Hisaab-Unsigned-Release.apk"

          OUTPUT="$GITHUB_WORKSPACE/Majdoor-Hisaab-Aligned-Release.apk"

          test -f "$INPUT"

          rm -f "$OUTPUT"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$INPUT" \
            "$OUTPUT"

          test -f "$OUTPUT"

          echo ""
          echo "Zipalign verification:"

          "$ZIPALIGN" \
            -c \
            -P 4 \
            4 \
            "$OUTPUT"

          echo ""
          echo "ZIPALIGN: PASS"

      # =========================================================
      # 16. SIGN RELEASE APK
      # =========================================================
      - name: Sign Release APK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          KEYSTORE="$GITHUB_WORKSPACE/majdoor-hisaab-release.keystore"

          INPUT="$GITHUB_WORKSPACE/Majdoor-Hisaab-Aligned-Release.apk"

          OUTPUT="$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"

          test -f "$KEYSTORE"
          test -f "$INPUT"

          cp "$INPUT" "$OUTPUT"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "majdoor-hisaab-release" \
            --ks-pass pass:MajdoorHisaab2026! \
            --key-pass pass:MajdoorHisaab2026! \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$OUTPUT"

          test -f "$OUTPUT"

          echo ""
          echo "Release APK signing completed."

      # =========================================================
      # 17. VERIFY FINAL APK
      # =========================================================
      - name: Verify Final Release APK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"

          APK="$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"

          test -f "$APK"

          echo ""
          echo "================ APK SIZE ================"

          ls -lh "$APK"

          echo ""
          echo "================ APK PACKAGE ================"

          PACKAGE_LINE="$(
            "$AAPT" dump badging "$APK" |
            grep '^package:' |
            head -1
          )"

          echo "$PACKAGE_LINE"

          echo "$PACKAGE_LINE" |
            grep "name='com.majdoor.hisaab'"

          echo ""
          echo "================ APK VERSION ================"

          echo "$PACKAGE_LINE" |
            grep "versionCode='2'"

          echo "$PACKAGE_LINE" |
            grep "versionName='1.1'"

          echo ""
          echo "================ ZIPALIGN ================"

          "$ZIPALIGN" \
            -c \
            -P 4 \
            4 \
            "$APK"

          echo "ZIPALIGN: PASS"

          echo ""
          echo "================ SIGNATURE ================"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE: PASS"

          echo ""
          echo "=========================================="
          echo "FINAL APK VERIFICATION: PASS"
          echo "=========================================="

      # =========================================================
      # 18. SHA256
      # =========================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"

          SHA="$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk.sha256"

          test -f "$APK"

          sha256sum \
            "$APK" \
            > "$SHA"

          echo ""
          echo "SHA256:"
          cat "$SHA"

      # =========================================================
      # 19. UPLOAD FINAL APK + HASH + KEYSTORE
      # =========================================================
      - name: Upload Final Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-Final-Release-APK
          path: |
            Majdoor-Hisaab-Release.apk
            Majdoor-Hisaab-Release.apk.sha256
            majdoor-hisaab-release.keystore
          if-no-files-found: error
          retention-days: 90
