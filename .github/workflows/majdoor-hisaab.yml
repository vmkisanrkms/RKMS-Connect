name: MAJDOOR HISAAB PRO — FINAL RELEASE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

jobs:

  build-test-sign-runtime:
    name: FINAL BUILD / TEST / SIGN / RUNTIME
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Verify Android project root
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          test -f gradlew
          test -f gradlew.bat

          test -f gradle/wrapper/gradle-wrapper.properties
          test -s gradle/wrapper/gradle-wrapper.jar

          echo "ANDROID_PROJECT_ROOT=PASS"
          echo "GRADLE_WRAPPER_JAR=PASS"

      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # 3. ANDROID SDK 36
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # =========================================================
      # 4. GRADLE WRAPPER
      # =========================================================

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x ./gradlew

          test -x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar

          ./gradlew --version

          ./gradlew --version \
            | grep -F "Gradle ${GRADLE_VERSION}"

      # =========================================================
      # 5. VERSION / PROJECT VALIDATION
      # =========================================================

      - name: Verify application version
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -q 'versionCode = 77' \
            app/build.gradle.kts

          grep -q 'versionName = "1.77.0"' \
            app/build.gradle.kts

          grep -q 'applicationId = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -q 'compileSdk = 36' \
            app/build.gradle.kts

          grep -q 'targetSdk = 36' \
            app/build.gradle.kts

          echo "VERSION_AND_ANDROID_CONFIGURATION=PASS"

      # =========================================================
      # 6. STATIC ACCEPTANCE GATES
      # =========================================================

      - name: Run acceptance gates
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x scripts/*.sh

          test -x ./gradlew

          ./scripts/acceptance-gates.sh

      - name: Dependency health
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/dependency-health.sh

      - name: Gradle Kotlin compatibility
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/gradle-kotlin-compatibility.sh

      - name: Gradle AGP compatibility
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/gradle-agp-compatibility.sh

      - name: Architecture gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase15-architecture-gate.sh

      - name: Configuration lifecycle gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase18-configuration-lifecycle-gate.sh

      - name: Offline first gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase19-offline-first-gate.sh

      - name: Security data gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase20-security-data-gate.sh

      - name: UI UX gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase21-ui-ux-gate.sh

      # =========================================================
      # 7. CLEAN DEPENDENCY RESOLUTION
      # =========================================================

      - name: Clean dependency resolution
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            dependencies \
            --configuration debugRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            dependencies \
            --configuration testRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            dependencies \
            --configuration e2eReleaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            dependencies \
            --configuration releaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            buildEnvironment

      # =========================================================
      # 8. BUILD + UNIT TEST
      # =========================================================

      - name: Build and run unit tests
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            test \
            compileDebugKotlin \
            compileDebugJavaWithJavac \
            assembleDebug \
            compileE2eReleaseKotlin \
            assembleE2eRelease \
            compileReleaseKotlin \
            assembleRelease \
            assembleReleaseAndroidTest

      # =========================================================
      # 9. DEBUG APK GATE
      # =========================================================

      - name: Verify Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" \
            | grep -Fx "$VERSION_NAME"

          apkanalyzer manifest version-code "$APK" \
            | grep -Fx "$VERSION_CODE"

          mkdir -p artifacts/debug

          cp "$APK" \
            artifacts/debug/Majdoor-Hisaab-PRO-debug.apk

          sha256sum "$APK" \
            | tee artifacts/debug/Majdoor-Hisaab-PRO-debug.sha256

      # =========================================================
      # 10. RELEASE BUILD GATE
      # =========================================================

      - name: Release build gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/release-build-gate.sh

      - name: Verify unsigned Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" \
            | grep -Fx "$VERSION_NAME"

          apkanalyzer manifest version-code "$APK" \
            | grep -Fx "$VERSION_CODE"

          mkdir -p artifacts

          cp "$APK" \
            artifacts/app-release-unsigned.apk

      # =========================================================
      # 11. PRODUCTION KEYSTORE
      # =========================================================

      - name: Restore production signing key
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$EXPECTED_CERT"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode > release.keystore

          test -s release.keystore

          keytool \
            -list \
            -v \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > cert.txt

          ACTUAL_CERT="$(
            awk -F': ' \
              '/SHA256:/{print $2; exit}' \
              cert.txt \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_CERT="$(
            printf '%s' "$EXPECTED_CERT" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

          echo "PRODUCTION_CERTIFICATE=PASS"

      # =========================================================
      # 12. SIGN RELEASE + RELEASE TEST APK
      # =========================================================

      - name: Sign production Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app-release-aligned.apk"
          SIGNED="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$UNSIGNED"
          test -s release.keystore

          zipalign \
            -f \
            -p \
            4 \
            "$UNSIGNED" \
            "$ALIGNED"

          zipalign -c -v 4 "$ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          test -s "$SIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$SIGNED" \
            | tee artifacts/release-signature.txt

          ACTUAL_SIGNED_CERT="$(
            apksigner verify --print-certs "$SIGNED" \
              | awk -F': ' \
                '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_SIGNED_CERT="$(
            printf '%s' "$EXPECTED_CERT" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          test -n "$ACTUAL_SIGNED_CERT"
          test "$ACTUAL_SIGNED_CERT" = "$EXPECTED_SIGNED_CERT"

          unzip -t "$SIGNED" >/dev/null

          zipalign -c -v 4 "$SIGNED"

          # -----------------------------------------------------
          # Sign instrumentation APK BEFORE deleting keystore
          # -----------------------------------------------------

          TEST_UNSIGNED="app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          TEST_ALIGNED="app-release-androidTest-aligned.apk"
          TEST_SIGNED="artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

          test -s "$TEST_UNSIGNED"

          zipalign \
            -f \
            -p \
            4 \
            "$TEST_UNSIGNED" \
            "$TEST_ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$TEST_SIGNED" \
            "$TEST_ALIGNED"

          test -s "$TEST_SIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$TEST_SIGNED" >/dev/null

          rm -f "$ALIGNED"
          rm -f "$TEST_ALIGNED"
          rm -f cert.txt
          rm -f release.keystore

          echo "PRODUCTION_SIGNING=PASS"

      # =========================================================
      # 13. SIGNING GATE
      # =========================================================

      - name: Production signing gate
        env:
          MH_RELEASE_CERT_SHA256: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/production-signing-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

      # =========================================================
      # 14. FINAL APK METADATA
      # =========================================================

      - name: Verify signed APK metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" \
            | grep -Fx "$VERSION_NAME"

          apkanalyzer manifest version-code "$APK" \
            | grep -Fx "$VERSION_CODE"

          unzip -t "$APK" >/dev/null

          zipalign -c -v 4 "$APK"

          apksigner verify \
            --verbose \
            --print-certs \
            "$APK" \
            | tee artifacts/release-signature-final.txt

          sha256sum "$APK" \
            | tee artifacts/Majdoor-Hisaab-PRO-release.sha256

          test -s artifacts/Majdoor-Hisaab-PRO-release.sha256

      # =========================================================
      # 15. POINTS 18-25
      # =========================================================

      - name: Phase 1 points 18-25 gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase1-points-18-25-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

      # =========================================================
      # 16. DEBUG API 36 RUNTIME
      # =========================================================

      - name: Install and launch Debug APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            adb install -r \
              "${GITHUB_WORKSPACE}/app/build/outputs/apk/debug/app-debug.apk"

            adb shell am force-stop "$PACKAGE_NAME"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity"

            sleep 2

            adb shell pidof "$PACKAGE_NAME" \
              | grep -Eq '[0-9]+'

            adb shell cmd package resolve-activity \
              --brief \
              -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER \
              "$PACKAGE_NAME" \
              | grep -q "$PACKAGE_NAME"

            mkdir -p artifacts/debug

            adb logcat -d -t 10000 \
              > artifacts/debug/debug-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/debug/debug-logcat.txt
            then
              exit 1
            fi

      # =========================================================
      # 17. CORE E2E
      # =========================================================

      - name: Android API 36 Core E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest

      # =========================================================
      # 18. PHASE 17 / 18
      # =========================================================

      - name: Phase 17 and 18 runtime tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.Phase17RealAndroidRuntimeE2ETest \
              --tests com.majdoor.hisaab.Phase18ConfigurationLifecycleE2ETest

            ./scripts/phase18-device-reboot-gate.sh

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/555_556_557_558_559_runtime.pass

      # =========================================================
      # 19. BACKUP / RESTORE
      # =========================================================

      - name: Clean install backup restore E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.CleanInstallBackupRestoreE2ETest

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/552_553_clean_install_restore_totals.pass

      # =========================================================
      # 20. SECURITY RUNTIME
      # =========================================================

      - name: Security runtime E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.Phase17RealAndroidRuntimeE2ETest

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/554_security_runtime.pass

      # =========================================================
      # 21. PHASE 19 OFFLINE
      # =========================================================

      - name: Phase 19 offline-first E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.Phase19OfflineFirstE2ETest

            ./scripts/phase19-offline-first-gate.sh

      # =========================================================
      # 22. PHASE 22 STATIC
      # =========================================================

      - name: Phase 22 red-list gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase22-final-red-list-gate.sh

      # =========================================================
      # 23. SIGNED RELEASE API 36
      # =========================================================

      - name: Signed Release APK runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            ./scripts/release-e2e.sh \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release.apk"

            adb shell svc wifi disable || true
            adb shell svc data disable || true

            adb shell am force-stop "$PACKAGE_NAME"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity"

            sleep 2

            adb shell pidof "$PACKAGE_NAME" \
              | grep -Eq '[0-9]+'

            mkdir -p artifacts/release-e2e/markers

            adb logcat -d -t 10000 \
              > artifacts/release-e2e/offline-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/release-e2e/offline-logcat.txt
            then
              exit 1
            fi

            touch \
              artifacts/release-e2e/markers/550_offline_runtime.pass

      # =========================================================
      # 24. TRUE REBOOT + PERSISTENCE
      # =========================================================

      - name: Signed Release true reboot persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            ./scripts/signed-release-reboot-gate.sh \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release.apk" \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

      # =========================================================
      # 25. FINAL 541-566 GATE
      # =========================================================

      - name: FINAL RELEASE GATE 541-566
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/final-release-gate.sh

      # =========================================================
      # 26. FINAL ARTIFACT CHECK
      # =========================================================

      - name: Verify final artifacts
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s artifacts/Majdoor-Hisaab-PRO-release.apk
          test -s artifacts/Majdoor-Hisaab-PRO-release.sha256
          test -s artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk

          apksigner verify \
            --verbose \
            artifacts/Majdoor-Hisaab-PRO-release.apk

          sha256sum -c \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

          echo "========================================"
          echo "MAJDOOR HISAAB PRO FINAL RELEASE PASS"
          echo "========================================"

      # =========================================================
      # 27. ARTIFACT UPLOAD
      # =========================================================

      - name: Upload final artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: majdoor-hisaab-pro-final-release
          path: artifacts/
          if-no-files-found: warn
