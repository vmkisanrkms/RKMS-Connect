name: MAJDOOR HISAAB PRO — FINAL RELEASE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  GRADLE_VERSION: 8.11.1
  ANDROID_API: 36
  BUILD_TOOLS: 36.0.0
  PACKAGE_NAME: com.majdoor.hisaab

jobs:
  build-test-sign-runtime:
    name: Build Test Sign Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '${{ env.GRADLE_VERSION }}'
          cache-disabled: true
          validate-wrappers: false

      # ============================================================
      # 4. ANDROID SDK
      #
      # IMPORTANT:
      # setup-android v4 is required.
      # DO NOT use v3.
      # DO NOT request deprecated "tools".
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # ============================================================
      # 5. INSTALL API 36 / BUILD TOOLS
      # ============================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          sdkmanager --list_installed \
            | grep -E \
              "platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}|platform-tools"

      # ============================================================
      # 6. BASIC PROJECT VALIDATION
      # ============================================================

      - name: Validate project structure
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew

          test -d app/src
          test -d scripts

          chmod +x ./gradlew

          echo "Project structure validation: PASS"

      # ============================================================
      # 7. GRADLE WRAPPER
      # ============================================================

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x ./gradlew

          ./gradlew --version

      # ============================================================
      # 8. VERSION / PACKAGE VALIDATION
      # ============================================================

      - name: Validate application identity
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -q 'versionCode = 77' \
            app/build.gradle.kts

          grep -q 'versionName = "1.77.0"' \
            app/build.gradle.kts

          grep -q 'com.majdoor.hisaab' \
            app/build.gradle.kts

          echo "Package/version validation: PASS"

      # ============================================================
      # 9. ACCEPTANCE GATES
      # ============================================================

      - name: Run acceptance gates
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x scripts/*.sh || true

          ./scripts/acceptance-gates.sh

      # ============================================================
      # 10. DEPENDENCY HEALTH
      # ============================================================

      - name: Run dependency health gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/dependency-health.sh

      # ============================================================
      # 11. PHASE 17
      # ============================================================

      - name: Run Phase 17 runtime gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase17-real-android-runtime-gate.sh

      # ============================================================
      # 12. PHASE 18
      # ============================================================

      - name: Run Phase 18 lifecycle gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase18-configuration-lifecycle-gate.sh

      # ============================================================
      # 13. PHASE 19
      # ============================================================

      - name: Run Phase 19 offline-first gate
      # ============================================================
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase19-offline-first-gate.sh

      # ============================================================
      # 14. PHASE 20
      # ============================================================

      - name: Run Phase 20 security/data gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase20-security-data-gate.sh

      # ============================================================
      # 15. GRADLE DEPENDENCY CHECK
      # ============================================================

      - name: Verify Gradle dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencies \
            --configuration debugRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:dependencies \
            --configuration debugUnitTestRuntimeClasspath

      # ============================================================
      # 16. BUILD DEBUG
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 17. BUILD E2E RELEASE
      # ============================================================

      - name: Build E2E Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleE2eRelease

      # ============================================================
      # 18. BUILD RELEASE
      # ============================================================

      - name: Build unsigned Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # ============================================================
      # 19. BUILD RELEASE ANDROID TEST APK
      # ============================================================

      - name: Build Release Android Test APK
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleReleaseAndroidTest

      # ============================================================
      # 20. RELEASE BUILD GATE
      # ============================================================

      - name: Run release build gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/release-build-gate.sh

      # ============================================================
      # 21. VERIFY DEBUG APK
      # ============================================================

      - name: Validate Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" \
            | grep -Fx "1.77.0"

          apkanalyzer manifest version-code "$APK" \
            | grep -Fx "77"

          mkdir -p artifacts/debug

          cp "$APK" \
            artifacts/debug/Majdoor-Hisaab-PRO-debug.apk

          sha256sum "$APK" \
            > artifacts/debug/Majdoor-Hisaab-PRO-debug.sha256

      # ============================================================
      # 22. ANDROID API 36 EMULATOR
      # ============================================================

      - name: Install and launch Debug APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            adb install -r \
              "${GITHUB_WORKSPACE}/app/build/outputs/apk/debug/app-debug.apk"

            adb shell am force-stop \
              "${PACKAGE_NAME}"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity" \
              | tee artifacts/debug/debug-launch.txt

            sleep 3

            adb shell pidof "${PACKAGE_NAME}" \
              | grep -Eq '[0-9]+'

            adb logcat -d -t 10000 \
              > artifacts/debug/debug-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/debug/debug-logcat.txt
            then
              echo "Fatal Android exception detected."
              exit 1
            fi

      # ============================================================
      # 23. E2E TESTS
      # ============================================================

      - name: Run connected E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest

      # ============================================================
      # 24. VERIFY UNSIGNED RELEASE
      # ============================================================

      - name: Validate unsigned Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" \
            | grep -Fx "1.77.0"

          apkanalyzer manifest version-code "$APK" \
            | grep -Fx "77"

          mkdir -p artifacts

          cp "$APK" \
            artifacts/app-release-unsigned.apk

      # ============================================================
      # 25. PRODUCTION SIGNING KEY
      # ============================================================

      - name: Restore production signing key
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$EXPECTED_CERT"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

          keytool -list -v \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > cert.txt

          ACTUAL_CERT=$(
            awk -F': ' \
              '/SHA256:/{print $2; exit}' \
              cert.txt \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )

          EXPECTED_CERT_NORMALIZED=$(
            printf '%s' "$EXPECTED_CERT" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )

          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT_NORMALIZED"

          echo "Production certificate validation: PASS"

      # ============================================================
      # 26. ZIPALIGN + SIGN
      # ============================================================

      - name: Zipalign and sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}

        shell: bash
        run: |
          set -Eeuo pipefail

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"

          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"

          SIGNED="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$UNSIGNED"
          test -s release.keystore

          zipalign \
            -f \
            -p \
            4 \
            "$UNSIGNED" \
            "$ALIGNED"

          zipalign \
            -c \
            -v \
            4 \
            "$ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          test -s "$SIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$SIGNED" \
            | tee artifacts/release-signature.txt

          unzip -t "$SIGNED" >/dev/null

          zipalign \
            -c \
            -v \
            4 \
            "$SIGNED"

      # ============================================================
      # 27. PRODUCTION SIGNING GATE
      # ============================================================

      - name: Run production signing gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/production-signing-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

      # ============================================================
      # 28. SIGNED APK METADATA
      # ============================================================

      - name: Validate signed Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" \
            | grep -Fx "1.77.0"

          apkanalyzer manifest version-code "$APK" \
            | grep -Fx "77"

          apksigner verify \
            --verbose \
            --print-certs \
            "$APK" \
            | tee artifacts/release-signature-final.txt

          unzip -t "$APK" >/dev/null

          zipalign -c -v 4 "$APK"

          sha256sum "$APK" \
            | tee artifacts/Majdoor-Hisaab-PRO-release.sha256

      # ============================================================
      # 29. PHASE 1 POINTS 18-25
      # ============================================================

      - name: Run Phase 1 points 18-25 gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase1-points-18-25-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

      # ============================================================
      # 30. PHASE 22 RED LIST
      # ============================================================

      - name: Run Phase 22 final red-list gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase22-final-red-list-gate.sh

      # ============================================================
      # 31. FINAL RELEASE GATE
      # ============================================================

      - name: Run final release gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/final-release-gate.sh

      # ============================================================
      # 32. FINAL ARTIFACT CHECK
      # ============================================================

      - name: Verify final release artifacts
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

          echo "=========================================="
          echo "MAJDOOR HISAAB PRO RELEASE APK READY"
          echo "=========================================="

          ls -lh \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

      # ============================================================
      # 33. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload final Release APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: majdoor-hisaab-pro-final-release
          path: artifacts/
          if-no-files-found: error
