name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_GANNA_PARCHI_BACKUP_APPLOCK_FINAL_V18_REFERENCE_UI_FIXED_V4_FINAL_FIXED_V3_GOOGLE_DRIVE_DIRECT_API_FANDI_V3.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

  EXPECTED_PACKAGE: "com.majdoor.hisaabpro"

jobs:

  build-release:

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Android SDK installation completed."

          echo ""
          echo "Android SDK:"
          echo "API: ${ANDROID_API}"
          echo "Build Tools: ${BUILD_TOOLS}"

      # ============================================================
      # 4. SHOW REPOSITORY FILES
      # ============================================================

      - name: Show repository files
        shell: bash
        run: |
          set -e

          echo "================================================"
          echo "REPOSITORY"
          echo "================================================"

          pwd
          ls -lah

          echo ""
          echo "ZIP FILES:"
          find . -maxdepth 4 -type f -iname "*.zip" -print

      # ============================================================
      # 5. VERIFY EXACT SOURCE ZIP
      # ============================================================

      - name: Verify source ZIP
        shell: bash
        run: |
          set -e

          echo "Required ZIP:"
          echo "${ZIP_NAME}"

          if [ ! -f "${ZIP_NAME}" ]; then
            echo ""
            echo "ERROR: Required ZIP file was not found."
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 5 -type f -iname "*.zip" -print
            exit 1
          fi

          echo ""
          echo "ZIP FOUND SUCCESSFULLY:"
          ls -lh "${ZIP_NAME}"

      # ============================================================
      # 6. EXTRACT SOURCE ZIP
      # ============================================================

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          echo "Extracting source ZIP..."

          unzip -q "${ZIP_NAME}" -d source

          echo ""
          echo "Extraction completed."

          echo ""
          echo "Extracted files:"
          find source -maxdepth 4 -type f | head -250

      # ============================================================
      # 7. LOCATE ANDROID PROJECT
      # ============================================================

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle Android project..."

          PROJECT_DIR=""

          if [ -f "source/gradlew" ]; then
            PROJECT_DIR="source"
          else
            FOUND_GRADLEW="$(find source -type f -name "gradlew" -print -quit || true)"

            if [ -n "${FOUND_GRADLEW}" ]; then
              PROJECT_DIR="$(dirname "${FOUND_GRADLEW}")"
            fi
          fi

          if [ -z "${PROJECT_DIR}" ]; then
            echo ""
            echo "ERROR: gradlew was not found."
            echo ""
            echo "Project contents:"
            find source -maxdepth 6 -type f | sort | head -500
            exit 1
          fi

          PROJECT_DIR="$(cd "${PROJECT_DIR}" && pwd)"

          echo "ANDROID_PROJECT_DIR=${PROJECT_DIR}" >> "${GITHUB_ENV}"

          echo ""
          echo "Android project:"
          echo "${PROJECT_DIR}"

          echo ""
          ls -lah "${PROJECT_DIR}"

      # ============================================================
      # 8. PREPARE GRADLE WRAPPER
      # ============================================================

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          chmod +x gradlew

          echo "Gradle version:"
          ./gradlew --version

      # ============================================================
      # 9. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle version
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          CURRENT_GRADLE="$(
            ./gradlew --version |
            grep "^Gradle " |
            head -1 ||
            true
          )"

          echo "Current Gradle:"
          echo "${CURRENT_GRADLE}"

          echo ""
          echo "Required Gradle:"
          echo "${GRADLE_VERSION}"

      # ============================================================
      # 10. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          if [ ! -f "settings.gradle" ] &&
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "build.gradle" ] &&
             [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: build.gradle or build.gradle.kts not found."
            exit 1
          fi

          echo "Android project structure verified."

          echo ""
          echo "Gradle files:"
          find . -maxdepth 5 \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            -print

      # ============================================================
      # 11. LOCATE KOTLIN SOURCES
      # ============================================================

      - name: Locate Kotlin sources
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          echo "Kotlin source files:"
          find . -type f -name "*.kt" -print | head -300

      # ============================================================
      # 12. VERIFY PACKAGE CONFIGURATION
      # ============================================================

      - name: Verify package configuration
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          echo "Expected package:"
          echo "${EXPECTED_PACKAGE}"

          echo ""
          echo "Package references found:"
          grep -R \
            --include="*.kt" \
            --include="*.xml" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            "${EXPECTED_PACKAGE}" \
            . || true

      # ============================================================
      # 13. GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 14. COMPILE RELEASE KOTLIN
      # ============================================================

      - name: Compile Release Kotlin
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          ./gradlew \
            compileReleaseKotlin \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ============================================================
      # 15. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble Release APK
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ============================================================
      # 16. LOCATE RELEASE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          echo "Searching for release APK..."

          find . \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print

          APK="$(
            find . \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -print -quit
          )"

          if [ -z "${APK}" ]; then
            echo ""
            echo "ERROR: Release APK not found."
            exit 1
          fi

          APK="$(
            cd "$(dirname "${APK}")" &&
            pwd
          )/$(basename "${APK}")"

          echo "RELEASE_APK=${APK}" >> "${GITHUB_ENV}"

          echo ""
          echo "Release APK:"
          echo "${APK}"

          ls -lh "${APK}"

      # ============================================================
      # 17. VERIFY APK PACKAGE NAME
      # ============================================================

      - name: Verify APK package name
        shell: bash
        run: |
          set -e

          APK="${RELEASE_APK}"

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          echo "APK:"
          echo "${APK}"

          echo ""
          echo "APK BADGING:"
          "${AAPT}" dump badging "${APK}" | head -20

          PACKAGE_NAME="$(
            "${AAPT}" dump badging "${APK}" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )"

          echo ""
          echo "Detected package:"
          echo "${PACKAGE_NAME}"

          if [ "${PACKAGE_NAME}" != "${EXPECTED_PACKAGE}" ]; then
            echo ""
            echo "ERROR: Package name mismatch."
            echo "Expected: ${EXPECTED_PACKAGE}"
            echo "Found: ${PACKAGE_NAME}"
            exit 1
          fi

          echo ""
          echo "PACKAGE NAME VERIFIED."

      # ============================================================
      # 18. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          mkdir -p final

          ALIGNED_APK="final/${APK_UNSIGNED_NAME}"

          "${BUILD_TOOLS_DIR}/zipalign" \
            -f \
            -p \
            4 \
            "${RELEASE_APK}" \
            "${ALIGNED_APK}"

          echo "ALIGNED_APK=${ALIGNED_APK}" >> "${GITHUB_ENV}"

          echo ""
          echo "Aligned APK:"
          ls -lh "${ALIGNED_APK}"

          echo ""
          echo "Checking zip alignment..."

          "${BUILD_TOOLS_DIR}/zipalign" \
            -c \
            -v \
            4 \
            "${ALIGNED_APK}"

      # ============================================================
      # 19. PREPARE SIGNING KEY
      # ============================================================

      - name: Prepare signing keystore
        shell: bash
        run: |
          set -e

          mkdir -p signing

          KEYSTORE="signing/majdoor-hisaab-pro-release.jks"

          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then

            echo "Using configured GitHub signing keystore."

            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" |
              base64 --decode > "${KEYSTORE}"

          else

            echo "No permanent release keystore configured."
            echo "Generating temporary signing keystore."

            keytool \
              -genkeypair \
              -v \
              -keystore "${KEYSTORE}" \
              -alias majdoor-hisaab-pro \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "MajdoorHisaabPro@2026" \
              -keypass "MajdoorHisaabPro@2026" \
              -dname "CN=Majdoor Hisaab PRO, OU=Android, O=Majdoor Hisaab PRO, L=India, ST=Uttar Pradesh, C=IN"

          fi

          if [ ! -f "${KEYSTORE}" ]; then
            echo "ERROR: Keystore was not created."
            exit 1
          fi

          echo "KEYSTORE=${KEYSTORE}" >> "${GITHUB_ENV}"

          echo ""
          echo "Keystore prepared successfully."

      # ============================================================
      # 20. SIGN RELEASE APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          SIGNED_APK="final/${APK_SIGNED_NAME}"

          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then

            STORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD }}"
            KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"
            KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}"

            if [ -z "${STORE_PASSWORD}" ]; then
              echo "ERROR: RELEASE_STORE_PASSWORD is missing."
              exit 1
            fi

            if [ -z "${KEY_PASSWORD}" ]; then
              echo "ERROR: RELEASE_KEY_PASSWORD is missing."
              exit 1
            fi

            if [ -z "${KEY_ALIAS}" ]; then
              echo "ERROR: RELEASE_KEY_ALIAS is missing."
              exit 1
            fi

          else

            STORE_PASSWORD="MajdoorHisaabPro@2026"
            KEY_PASSWORD="MajdoorHisaabPro@2026"
            KEY_ALIAS="majdoor-hisaab-pro"

          fi

          echo "Signing APK..."

          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks "${KEYSTORE}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass "pass:${STORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "${SIGNED_APK}" \
            "${ALIGNED_APK}"

          echo "SIGNED_APK=${SIGNED_APK}" >> "${GITHUB_ENV}"

          echo ""
          echo "SIGNED APK CREATED:"
          ls -lh "${SIGNED_APK}"

      # ============================================================
      # 21. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          echo "Verifying APK signature..."

          "${APKSIGNER}" verify \
            --verbose \
            "${SIGNED_APK}"

          echo ""
          echo "================================================"
          echo "APK SIGNATURE VERIFIED SUCCESSFULLY"
          echo "================================================"

      # ============================================================
      # 22. FINAL APK VALIDATION
      # ============================================================

      - name: Final APK validation
        shell: bash
        run: |
          set -e

          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          echo "================================================"
          echo "FINAL APK VALIDATION"
          echo "================================================"

          echo ""
          echo "Signed APK:"
          ls -lh "${SIGNED_APK}"

          echo ""
          echo "Package:"
          "${BUILD_TOOLS_DIR}/aapt" \
            dump badging "${SIGNED_APK}" |
            head -5

          echo ""
          echo "Signature verification:"

          "${BUILD_TOOLS_DIR}/apksigner" \
            verify \
            --verbose \
            "${SIGNED_APK}"

          echo ""
          echo "Zipalign verification:"

          "${BUILD_TOOLS_DIR}/zipalign" \
            -c \
            -v \
            4 \
            "${SIGNED_APK}"

          echo ""
          echo "================================================"
          echo "FINAL APK VALIDATION PASSED"
          echo "================================================"

      # ============================================================
      # 23. CREATE BUILD INFO
      # ============================================================

      - name: Create build information
        shell: bash
        run: |
          set -e

          mkdir -p final

          printf '%s\n' \
            "Majdoor Hisaab PRO V82" \
            "" \
            "Source ZIP:" \
            "${ZIP_NAME}" \
            "" \
            "Package:" \
            "${EXPECTED_PACKAGE}" \
            "" \
            "Java:" \
            "${JAVA_VERSION}" \
            "" \
            "Gradle:" \
            "${GRADLE_VERSION}" \
            "" \
            "Android API:" \
            "${ANDROID_API}" \
            "" \
            "Build Tools:" \
            "${BUILD_TOOLS}" \
            "" \
            "Unsigned APK:" \
            "${APK_UNSIGNED_NAME}" \
            "" \
            "Signed APK:" \
            "${APK_SIGNED_NAME}" \
            "" \
            "Build:" \
            "${GITHUB_RUN_NUMBER}" \
            "" \
            "Commit:" \
            "${GITHUB_SHA}" \
            "" \
            "Status:" \
            "FINAL RELEASE APK VERIFIED" \
            > final/BUILD_INFO.txt

          cat final/BUILD_INFO.txt

      # ============================================================
      # 24. UPLOAD FINAL APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED
          path: |
            final/${{ env.APK_SIGNED_NAME }}
            final/${{ env.APK_UNSIGNED_NAME }}
            final/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 25. UPLOAD SOURCE ZIP
      # ============================================================

      - name: Upload Source ZIP Backup
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-SOURCE-ZIP
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 26. FINAL SUCCESS
      # ============================================================

      - name: Final success
        shell: bash
        run: |
          echo ""
          echo "============================================================"
          echo "              MAJDOOR HISAAB PRO V82"
          echo "              FINAL RELEASE BUILD"
          echo "============================================================"
          echo ""
          echo "Source ZIP:"
          echo "${ZIP_NAME}"
          echo ""
          echo "Package:"
          echo "${EXPECTED_PACKAGE}"
          echo ""
          echo "Signed APK:"
          echo "${APK_SIGNED_NAME}"
          echo ""
          echo "Android API:"
          echo "${ANDROID_API}"
          echo ""
          echo "Build Tools:"
          echo "${BUILD_TOOLS}"
          echo ""
          echo "Gradle:"
          echo "${GRADLE_VERSION}"
          echo ""
          echo "Java:"
          echo "${JAVA_VERSION}"
          echo ""
          echo "PACKAGE: VERIFIED"
          echo "ZIPALIGN: VERIFIED"
          echo "SIGNATURE: VERIFIED"
          echo "APK: READY"
          echo ""
          echo "============================================================"
          echo "                    BUILD SUCCESS"
          echo "============================================================"
