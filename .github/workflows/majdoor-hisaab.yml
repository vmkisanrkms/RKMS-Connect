name: Majdoor Hisaab PRO - V81 Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V81-ALL-BUTTONS-FINAL.zip"

jobs:

  build-release:

    name: Build Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SHOW REPOSITORY
      # ============================================================

      - name: Show repository files
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " REPOSITORY ROOT"
          echo "============================================================"

          pwd

          echo
          ls -la

          echo
          echo "============================================================"
          echo " ZIP / GRADLE FILES"
          echo "============================================================"

          find . -maxdepth 4 -type f \
            \( \
              -iname "*.zip" \
              -o -iname "*.gradle" \
              -o -iname "*.gradle.kts" \
            \) \
            -print | sort


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 4. ANDROID SDK
      #
      # IMPORTANT:
      # Do NOT use android-actions/setup-android@v3.
      #
      # That action was trying:
      #
      # sdkmanager tools
      #
      # and failing because the old "tools" package no longer exists.
      #
      # GitHub ubuntu runner already has Android SDK installed.
      # We use its sdkmanager directly.
      # ============================================================

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " ANDROID SDK ENVIRONMENT"
          echo "============================================================"

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          if [[ -z "${ANDROID_HOME:-}" ]]; then
            if [[ -n "${ANDROID_SDK_ROOT:-}" ]]; then
              export ANDROID_HOME="$ANDROID_SDK_ROOT"
            else
              export ANDROID_HOME="$HOME/android-sdk"
            fi
          fi

          if [[ ! -d "$ANDROID_HOME" ]]; then
            echo "ERROR: Android SDK directory not found:"
            echo "$ANDROID_HOME"
            exit 1
          fi

          echo "Using Android SDK:"
          echo "$ANDROID_HOME"

          echo
          echo "============================================================"
          echo " FIND SDKMANAGER"
          echo "============================================================"

          SDKMANAGER=""

          if [[ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -path "*/bin/sdkmanager" \
              -print \
              2>/dev/null \
              | sort \
              | tail -n 1 || true)"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" \
              -maxdepth 5 \
              -type f \
              -name sdkmanager \
              -print || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          if [[ -d "$ANDROID_HOME/emulator" ]]; then
            echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          fi

          if [[ -d "$ANDROID_HOME/build-tools/${BUILD_TOOLS}" ]]; then
            echo "$ANDROID_HOME/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"
          fi

          echo
          echo "============================================================"
          echo " SDKMANAGER VERSION"
          echo "============================================================"

          "$SDKMANAGER" --version

          echo
          echo "============================================================"
          echo " ACCEPT ANDROID LICENSES"
          echo "============================================================"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo
          echo "============================================================"
          echo " INSTALL REQUIRED ANDROID PACKAGES"
          echo "============================================================"

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo
          echo "============================================================"
          echo " VERIFY SDK PACKAGES"
          echo "============================================================"

          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API}" \
            || {
              echo "ERROR: Android API ${ANDROID_API} not installed."
              exit 1
            }

          test -d "$ANDROID_HOME/build-tools/${BUILD_TOOLS}" \
            || {
              echo "ERROR: Build Tools ${BUILD_TOOLS} not installed."
              exit 1
            }

          test -x "$ANDROID_HOME/platform-tools/adb" \
            || {
              echo "ERROR: platform-tools not installed."
              exit 1
            }

          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            || {
              echo "ERROR: aapt not found."
              exit 1
            }

          test -x "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" \
            || {
              echo "ERROR: apksigner not found."
              exit 1
            }

          echo
          echo "ANDROID SDK 36 READY"


      # ============================================================
      # 5. GRADLE
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ============================================================
      # 6. LOCATE / EXTRACT V81 PROJECT
      # ============================================================

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          FOUND_ROOT=""

          echo "============================================================"
          echo " SEARCHING ANDROID PROJECT"
          echo "============================================================"

          # --------------------------------------------------------
          # Current repository itself
          # --------------------------------------------------------

          if [[ -f "settings.gradle.kts" ]] && \
             [[ -f "app/build.gradle.kts" ]]; then

            FOUND_ROOT="$PWD"

            echo "Android project found at repository root."

          fi


          # --------------------------------------------------------
          # Exact V81 ZIP
          # --------------------------------------------------------

          if [[ -z "$FOUND_ROOT" ]] && \
             [[ -f "$ZIP_NAME" ]]; then

            echo
            echo "Found V81 ZIP:"
            echo "$ZIP_NAME"

            rm -rf extracted_project

            mkdir -p extracted_project

            unzip -q "$ZIP_NAME" -d extracted_project

            FOUND_ROOT="$(
              find "$PWD/extracted_project" \
                -type f \
                -name "settings.gradle.kts" \
                -print \
                | while read -r f; do

                    d="$(dirname "$f")"

                    if [[ -f "$d/app/build.gradle.kts" ]]; then
                      echo "$d"
                      break
                    fi

                  done
            )"

          fi


          # --------------------------------------------------------
          # Fallback search
          # --------------------------------------------------------

          if [[ -z "$FOUND_ROOT" ]]; then

            FOUND_ROOT="$(
              find "$PWD" \
                -type f \
                -name "settings.gradle.kts" \
                -print \
                | while read -r f; do

                    d="$(dirname "$f")"

                    if [[ -f "$d/app/build.gradle.kts" ]]; then
                      echo "$d"
                      break
                    fi

                  done
            )"

          fi


          # --------------------------------------------------------
          # Final validation
          # --------------------------------------------------------

          if [[ -z "$FOUND_ROOT" ]]; then
            echo
            echo "ERROR: Android project not found."
            exit 1
          fi


          echo "ANDROID_PROJECT_ROOT=$FOUND_ROOT" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo " ANDROID PROJECT"
          echo "============================================================"

          echo "$FOUND_ROOT"

          echo
          echo "============================================================"
          echo " PROJECT FILES"
          echo "============================================================"

          find "$FOUND_ROOT" \
            -maxdepth 4 \
            -type f \
            \( \
              -name "*.kt" \
              -o -name "*.gradle.kts" \
              -o -name "*.xml" \
            \) \
            | sort \
            | head -400


      # ============================================================
      # 7. VERIFY PROJECT CONFIGURATION
      # ============================================================

      - name: Verify project configuration
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " settings.gradle.kts"
          echo "============================================================"

          sed -n '1,260p' settings.gradle.kts

          echo
          echo "============================================================"
          echo " app/build.gradle.kts"
          echo "============================================================"

          sed -n '1,360p' app/build.gradle.kts

          echo
          echo "============================================================"
          echo " REQUIRED CONFIGURATION CHECK"
          echo "============================================================"

          grep -q 'com.majdoor.hisaab' app/build.gradle.kts \
            || {
              echo "ERROR: Package com.majdoor.hisaab not found."
              exit 1
            }

          grep -Eq \
            'compileSdk.*36|compileSdk = 36' \
            app/build.gradle.kts \
            || {
              echo "ERROR: compileSdk 36 not found."
              exit 1
            }

          grep -Eq \
            'targetSdk.*36|targetSdk = 36' \
            app/build.gradle.kts \
            || {
              echo "ERROR: targetSdk 36 not found."
              exit 1
            }

          grep -Eq \
            'versionCode.*77|versionCode = 77' \
            app/build.gradle.kts \
            || {
              echo "ERROR: versionCode 77 not found."
              exit 1
            }

          grep -Eq \
            'versionName.*1.77.0|versionName = "1.77.0"' \
            app/build.gradle.kts \
            || {
              echo "ERROR: versionName 1.77.0 not found."
              exit 1
            }

          echo
          echo "PROJECT CONFIGURATION OK"


      # ============================================================
      # 8. FIND MAINACTIVITYSCREENS
      # ============================================================

      - name: Locate MainActivityScreens
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          SRC="$(
            find . \
              -type f \
              -name "MainActivityScreens.kt" \
              -print \
              | head -n 1
          )"

          if [[ -z "$SRC" ]]; then
            echo "ERROR: MainActivityScreens.kt not found."
            exit 1
          fi

          echo "MAIN_ACTIVITY_SCREENS=$SRC" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$SRC"


      # ============================================================
      # 9. APPLY V81 KOTLIN FIXES
      # ============================================================

      - name: Apply V81 Kotlin compile fixes
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          export PROJECT_ROOT="$PWD"

          python3 <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_ROOT"])

          files = list(root.rglob("MainActivityScreens.kt"))

          if not files:
              raise SystemExit(
                  "ERROR: MainActivityScreens.kt not found."
              )

          src = files[0]

          text = src.read_text(
              encoding="utf-8"
          )

          original = text

          print()
          print("============================================================")
          print(" PATCHING")
          print("============================================================")
          print(src)


          # ========================================================
          # 1. btn() DEFAULT ACTION
          # ========================================================

          patterns = [
              (
                  "internal fun MainActivity.btn(s:String,action:()->Unit)=TextView(this).apply{",
                  "internal fun MainActivity.btn(s:String,action:()->Unit = {})=TextView(this).apply{"
              ),
              (
                  "internal fun MainActivity.btn(s: String, action: () -> Unit) = TextView(this).apply {",
                  "internal fun MainActivity.btn(s: String, action: () -> Unit = {}) = TextView(this).apply {"
              )
          ]

          for old, new in patterns:
              if old in text:
                  text = text.replace(old, new, 1)
                  print("FIXED: btn() default action")
                  break


          # ========================================================
          # 2. ScrollView
          # ========================================================

          if "fillViewport=true" in text:

              text = text.replace(
                  "fillViewport=true",
                  "setFillViewport(true)"
              )

              print("FIXED: fillViewport")


          # ========================================================
          # 3. pick() RETURN TYPE
          # ========================================================

          if "onPick:(Int)->Unit):Button" in text:

              text = text.replace(
                  "onPick:(Int)->Unit):Button",
                  "onPick:(Int)->Unit):TextView",
                  1
              )

              print("FIXED: pick() return type")


          # ========================================================
          # 4. STATUS MAP
          # ========================================================

          replacements = {

              'statusViews.forEach{it.text="FULL"}':
              'statusViews.values.forEach{it.text="FULL"}',

              'statusViews.forEach{it.text="HALF"}':
              'statusViews.values.forEach{it.text="HALF"}',

              'statusViews.forEach{it.text=AttendanceRules.UNMARKED}':
              'statusViews.values.forEach{it.text=AttendanceRules.UNMARKED}',
          }

          for old, new in replacements.items():

              if old in text:

                  text = text.replace(
                      old,
                      new
                  )

                  print(
                      "FIXED:",
                      old
                  )


          # ========================================================
          # 5. GENERIC WRONG it.text REPLACEMENTS
          # ========================================================

          replacements = {

              # Crop / field
              'fieldId=fields[i].id;it.text="Field: ${fields[i].name}"':
              'fieldId=fields[i].id;fb.text="Field: ${fields[i].name}"',

              'cropId=crops[i].id;it.text="Crop: ${crops[i].name}"':
              'cropId=crops[i].id;cropBtn.text="Crop: ${crops[i].name}"',

              # Work
              'fieldId=fields[i].id;it.text="Field: ${fields[i].name}"':
              'fieldId=fields[i].id;fieldBtn.text="Field: ${fields[i].name}"',

              # Worker dialog
              'setPositiveButton("Done"){_,_->it.text="Workers: ${selectedWorkers.distinct().size}"}':
              'setPositiveButton("Done"){_,_->workerBtn.text="Workers: ${selectedWorkers.distinct().size}"}',

              # Rate type
              'rateType=app.calculation.rateTypes()[i];it.text="Rate type: $rateType"':
              'rateType=app.calculation.rateTypes()[i];rateTypeBtn.text="Rate type: $rateType"',

              # Payment worker
              'wid=workers[i].id;it.text="Worker: ${workers[i].name}"':
              'wid=workers[i].id;wb.text="Worker: ${workers[i].name}"',

              # Payment method
              'method=methods[i];it.text="Method: ${methods[i]}"':
              'method=methods[i];mb.text="Method: ${methods[i]}"',

              # Advance
              'advance=!advance;it.text="Advance: ${if(advance)"YES" else "NO"}"':
              'advance=!advance;adv.text="Advance: ${if(advance)"YES" else "NO"}"',

              # Expense category
              'cat=cats[i];it.text="Category: $cat"':
              'cat=cats[i];cb.text="Category: $cat"',

              # Expense field
              'fieldId="";it.text="Field: Not linked"':
              'fieldId="";fb.text="Field: Not linked"',

              'fieldId=fields[i-1].id;it.text="Field: ${fields[i-1].name}"':
              'fieldId=fields[i-1].id;fb.text="Field: ${fields[i-1].name}"',

              # Expense crop
              'cropId="";it.text="Crop: Not linked"':
              'cropId="";crb.text="Crop: Not linked"',

              'cropId=crops[i-1].id;it.text="Crop: ${crops[i-1].name}"':
              'cropId=crops[i-1].id;crb.text="Crop: ${crops[i-1].name}"',

              # Custom report worker
              'wid=if(i==0)"" else workers[i-1].id;it.text="Worker: ${if(i==0)"All" else workers[i-1].name}"':
              'wid=if(i==0)"" else workers[i-1].id;wb.text="Worker: ${if(i==0)"All" else workers[i-1].name}"',

              # Custom report field
              'fid=if(i==0)"" else fields[i-1].id;it.text="Field: ${if(i==0)"All" else fields[i-1].name}"':
              'fid=if(i==0)"" else fields[i-1].id;fb.text="Field: ${if(i==0)"All" else fields[i-1].name}"',

              # Custom report crop
              'cid=if(i==0)"" else crops[i-1].id;it.text="Crop: ${if(i==0)"All" else crops[i-1].name}"':
              'cid=if(i==0)"" else crops[i-1].id;cb.text="Crop: ${if(i==0)"All" else crops[i-1].name}"',
          }

          for old, new in replacements.items():

              if old in text:

                  text = text.replace(
                      old,
                      new
                  )

                  print(
                      "FIXED:",
                      old[:100]
                  )


          # ========================================================
          # 6. MULTILINE ATTENDANCE FIELD BUTTON
          # ========================================================

          text = text.replace(
              '''fieldId=if(i==0) "" else fields[i-1].id
                it.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"''',
              '''fieldId=if(i==0) "" else fields[i-1].id
                fieldBtn.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"'''
          )


          text = text.replace(
              '''fieldId=if(i==0) "" else fields[i-1].id;it.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"''',
              '''fieldId=if(i==0) "" else fields[i-1].id;fieldBtn.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"'''
          )


          # ========================================================
          # 7. ATTENDANCE STATUS BUTTON
          # ========================================================

          text = text.replace(
              '''status=arrayOf("FULL","HALF","NONE")[i]
                it.text="Status: $status"''',
              '''status=arrayOf("FULL","HALF","NONE")[i]
                statusBtn.text="Status: $status"'''
          )


          # ========================================================
          # 8. INTENT TYPE SHADOWING
          # ========================================================

          text = text.replace(
              'Intent(Intent.ACTION_OPEN_DOCUMENT).apply{type="image/*";',
              'Intent(Intent.ACTION_OPEN_DOCUMENT).apply{this.type="image/*";'
          )


          # ========================================================
          # 9. EXPORT WHEN
          # ========================================================

          old_export = '''contentResolver.openOutputStream(uri)!!.use{out->when(exportType){
                    "workers"->app.export.csvWorkers(out)
                    "ledger"->app.export.csvLedger(out)
                    exportType.startsWith("report:")->app.export.csvReport(exportType.removePrefix("report:"),out)
                    exportType.startsWith("reportpdf:")->app.export.pdfReport(exportType.removePrefix("reportpdf:"),out)
                    "pdf"->app.export.pdfSummary(out)
                    "backup"->app.backup.export(out)
                }}'''

          new_export = '''contentResolver.openOutputStream(uri)!!.use{out->when {
                    exportType == "workers"->app.export.csvWorkers(out)
                    exportType == "ledger"->app.export.csvLedger(out)
                    exportType.startsWith("report:")->app.export.csvReport(exportType.removePrefix("report:"),out)
                    exportType.startsWith("reportpdf:")->app.export.pdfReport(exportType.removePrefix("reportpdf:"),out)
                    exportType == "pdf"->app.export.pdfSummary(out)
                    exportType == "backup"->app.backup.export(out)
                }}'''

          if old_export in text:

              text = text.replace(
                  old_export,
                  new_export,
                  1
              )

              print("FIXED: exportType when")


          # ========================================================
          # 10. COMPATIBILITY FIXES
          # ========================================================

          compatibility = {

              ".audit.auditLog":
              ".auditLog",

              "clearAuditLog":
              "clear",

              "getSystemService(ALARM_SERVICE)":
              "getSystemService(Context.ALARM_SERVICE)",
          }

          for old, new in compatibility.items():

              if old in text:

                  text = text.replace(
                      old,
                      new
                  )

                  print(
                      "FIXED:",
                      old,
                      "->",
                      new
                  )


          # ========================================================
          # 11. renderSummary BEFORE render
          # ========================================================

          render_marker = "        fun render(){"
          summary_marker = "        fun renderSummary(){"
          nav_marker = "        val nav="

          if (
              render_marker in text
              and summary_marker in text
              and nav_marker in text
          ):

              r0 = text.index(
                  render_marker
              )

              s0 = text.index(
                  summary_marker,
                  r0
              )

              n0 = text.index(
                  nav_marker,
                  s0
              )

              render_block = text[
                  r0:s0
              ]

              summary_block = text[
                  s0:n0
              ]

              text = (
                  text[:r0]
                  + summary_block
                  + "\n"
                  + render_block
                  + text[n0:]
              )

              print(
                  "FIXED: renderSummary declaration order"
              )


          # ========================================================
          # 12. SAVE
          # ========================================================

          if text != original:

              src.write_text(
                  text,
                  encoding="utf-8"
              )

              print()
              print(
                  "SOURCE PATCH COMPLETE"
              )

          else:

              print()
              print(
                  "WARNING: Source was already patched."
              )


          # ========================================================
          # 13. FINAL CHECK
          # ========================================================

          final = src.read_text(
              encoding="utf-8"
          )

          print()
          print(
              "============================================================"
          )
          print(
              " FINAL SOURCE CHECK"
          )
          print(
              "============================================================"
          )

          checks = {

              "btn default action":
                  "action:()->Unit = {}" in final,

              "setFillViewport":
                  "setFillViewport(true)" in final,

              "pick TextView":
                  "onPick:(Int)->Unit):TextView" in final,

              "export when":
                  "exportType.startsWith(\"report:\")" in final,

              "Intent this.type":
                  'apply{this.type="image/*";' in final,
          }

          failed = False

          for name, ok in checks.items():

              print(
                  ("PASS" if ok else "FAIL")
                  + ": "
                  + name
              )

              if not ok:
                  failed = True


          suspicious = [

              "fillViewport=true",

              "statusViews.forEach{it.text=",

              'setPositiveButton("Done"){_,_->it.text=',

              'rateType=app.calculation.rateTypes()[i];it.text=',

              'method=methods[i];it.text=',

              'advance=!advance;it.text=',

              'cat=cats[i];it.text=',

              "when(exportType)",
          ]

          print()
          print(
              "============================================================"
          )
          print(
              " SUSPICIOUS PATTERNS"
          )
          print(
              "============================================================"
          )

          for p in suspicious:

              count = final.count(p)

              print(
                  f"{count:3d}  {p}"
              )


          if failed:

              raise SystemExit(
                  "ERROR: Required source fixes were not verified."
              )

          print()
          print(
              "ALL REQUIRED SOURCE CHECKS PASSED"
          )

          PY


      # ============================================================
      # 10. SOURCE AUDIT
      # ============================================================

      - name: Verify patched Kotlin source
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          SRC="$(find . \
            -type f \
            -name "MainActivityScreens.kt" \
            -print \
            | head -n 1)"

          if [[ -z "$SRC" ]]; then
            echo "ERROR: MainActivityScreens.kt missing."
            exit 1
          fi

          echo "============================================================"
          echo " SOURCE AUDIT"
          echo "============================================================"

          echo
          echo "SOURCE:"
          echo "$SRC"

          echo
          echo "---- btn / pick ----"

          grep -n \
            -E \
            "fun MainActivity.btn|fun MainActivity.pick" \
            "$SRC" \
            || true

          echo
          echo "---- ScrollView ----"

          grep -n \
            -E \
            "setFillViewport|fillViewport" \
            "$SRC" \
            || true

          echo
          echo "---- export ----"

          grep -n \
            -A14 \
            -B4 \
            "openOutputStream" \
            "$SRC" \
            || true

          echo
          echo "---- it.text ----"

          grep -n \
            "it.text" \
            "$SRC" \
            || true

          echo
          echo "---- render ----"

          grep -n \
            -E \
            "fun render\\(|fun renderSummary\\(" \
            "$SRC" \
            || true


      # ============================================================
      # 11. GRADLE PROJECT CHECK
      # ============================================================

      - name: Prepare Gradle
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " GRADLE VERSION"
          echo "============================================================"

          gradle --version

          echo
          echo "Gradle project detected."


      # ============================================================
      # 12. CLEAN
      # ============================================================

      - name: Clean project
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " CLEAN PROJECT"
          echo "============================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            clean


      # ============================================================
      # 13. COMPILE RELEASE KOTLIN
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " COMPILE RELEASE KOTLIN"
          echo "============================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseKotlin


      # ============================================================
      # 14. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble unsigned Release APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " ASSEMBLE RELEASE APK"
          echo "============================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

          echo
          echo "APK files:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ============================================================
      # 15. LOCATE APK
      # ============================================================

      - name: Locate release APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          APK=""

          if [[ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]]; then

            APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          else

            APK="$(
              find app/build/outputs/apk/release \
                -type f \
                -name "*-unsigned.apk" \
                -print \
                | head -n 1
            )"

          fi

          if [[ -z "$APK" ]]; then

            APK="$(
              find app/build/outputs/apk/release \
                -type f \
                -name "*.apk" \
                -print \
                | head -n 1
            )"

          fi

          if [[ -z "$APK" ]]; then

            echo "ERROR: Release APK not found."

            find app/build/outputs/apk \
              -type f \
              -print \
              || true

            exit 1

          fi

          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"

          echo
          echo "Release APK:"
          echo "$APK"

          ls -lh "$APK"


      # ============================================================
      # 16. VERIFY APK PACKAGE / VERSION
      # ============================================================

      - name: Verify APK package and version
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$RELEASE_APK"

          AAPT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          echo "============================================================"
          echo " APK PACKAGE"
          echo "============================================================"

          BADGING="$(
            "$AAPT" \
              dump badging \
              "$APK"
          )"

          echo "$BADGING" \
            | grep -E \
              "package: name=|versionCode=|versionName="

          echo "$BADGING" \
            | grep -q \
              "name='${PACKAGE_NAME}'" \
            || {
              echo "ERROR: Package mismatch."
              exit 1
            }

          echo "$BADGING" \
            | grep -q \
              "versionCode='${VERSION_CODE}'" \
            || {
              echo "ERROR: Version code mismatch."
              exit 1
            }

          echo "$BADGING" \
            | grep -q \
              "versionName='${VERSION_NAME}'" \
            || {
              echo "ERROR: Version name mismatch."
              exit 1
            }

          echo
          echo "APK PACKAGE/VERSION CHECK PASSED"


      # ============================================================
      # 17. SIGNING SECRETS
      # ============================================================

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " PREPARE RELEASE SIGNING"
          echo "============================================================"

          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [[ -z "${KEYSTORE_PASSWORD:-}" ]]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [[ -z "${KEY_ALIAS:-}" ]]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [[ -z "${KEY_PASSWORD:-}" ]]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/release-signing"

          mkdir -p "$SIGN_DIR"

          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$SIGN_DIR/release.keystore"

          test -s "$SIGN_DIR/release.keystore"

          echo "KEYSTORE_PATH=$SIGN_DIR/release.keystore" \
            >> "$GITHUB_ENV"

          echo "Release keystore ready."


      # ============================================================
      # 18. ZIPALIGN
      # ============================================================

      - name: Zipalign release APK
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          mkdir -p "$RUNNER_TEMP/apk"

          ALIGNED="$RUNNER_TEMP/apk/Majdoor-Hisaab-PRO-${VERSION_NAME}-aligned.apk"

          echo "============================================================"
          echo " ZIPALIGN"
          echo "============================================================"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$ANDROID_PROJECT_ROOT/$RELEASE_APK" \
            "$ALIGNED"

          test -s "$ALIGNED"

          echo "ZIPALIGNED_APK=$ALIGNED" \
            >> "$GITHUB_ENV"

          ls -lh "$ALIGNED"


      # ============================================================
      # 19. SIGN APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          SIGNED="$RUNNER_TEMP/apk/Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"

          echo "============================================================"
          echo " SIGN RELEASE APK"
          echo "============================================================"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$SIGNED" \
            "$ZIPALIGNED_APK"

          test -s "$SIGNED"

          echo "SIGNED_APK=$SIGNED" \
            >> "$GITHUB_ENV"

          ls -lh "$SIGNED"


      # ============================================================
      # 20. VERIFY SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          echo "============================================================"
          echo " VERIFY APK SIGNATURE"
          echo "============================================================"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$SIGNED_APK"

          echo
          echo "APK SIGNATURE VERIFICATION PASSED"


      # ============================================================
      # 21. FINAL APK VALIDATION
      # ============================================================

      - name: Final APK validation
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          echo "============================================================"
          echo " FINAL APK VALIDATION"
          echo "============================================================"

          "$AAPT" \
            dump badging \
            "$SIGNED_APK" \
            | grep -E \
              "package: name=|versionCode=|versionName="

          echo
          echo "APK SIZE:"
          ls -lh "$SIGNED_APK"

          echo
          echo "SHA256:"
          sha256sum "$SIGNED_APK"


      # ============================================================
      # 22. FINAL RELEASE DIRECTORY
      # ============================================================

      - name: Prepare final release artifact
        shell: bash
        run: |
          set -euo pipefail

          FINAL_DIR="$GITHUB_WORKSPACE/final-release"

          mkdir -p "$FINAL_DIR"

          FINAL_APK="$FINAL_DIR/Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"

          cp \
            "$SIGNED_APK" \
            "$FINAL_APK"

          sha256sum \
            "$FINAL_APK" \
            > "$FINAL_DIR/SHA256SUMS.txt"

          echo "============================================================"
          echo " FINAL RELEASE FILES"
          echo "============================================================"

          ls -lh "$FINAL_DIR"

          echo
          cat "$FINAL_DIR/SHA256SUMS.txt"


      # ============================================================
      # 23. UPLOAD SIGNED APK
      # ============================================================

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-${{ env.VERSION_NAME }}-Release-Signed
          path: |
            final-release/Majdoor-Hisaab-PRO-${{ env.VERSION_NAME }}-Release-Signed.apk
            final-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 24. FINAL SUCCESS
      # ============================================================

      - name: Final release verification
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "                                                        "
          echo "   MAJDOOR HISAAB PRO"
          echo "   FINAL SIGNED RELEASE BUILD SUCCESS"
          echo "                                                        "
          echo "============================================================"

          echo
          echo "Package     : ${PACKAGE_NAME}"
          echo "Version     : ${VERSION_NAME}"
          echo "VersionCode : ${VERSION_CODE}"
          echo "Android API : ${ANDROID_API}"
          echo "Build Tools : ${BUILD_TOOLS}"
          echo "Java        : ${JAVA_VERSION}"
          echo "Gradle      : ${GRADLE_VERSION}"

          echo
          echo "SIGNED APK:"
          echo "final-release/Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"

          echo
          echo "SHA256:"
          cat \
            final-release/SHA256SUMS.txt

          echo
          echo "============================================================"
          echo "              BUILD COMPLETED SUCCESSFULLY"
          echo "============================================================"
