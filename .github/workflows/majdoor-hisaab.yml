name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V82-KOTLIN-COMPILE-FIXED.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build Final Signed Release APK

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"

          else
            SDK_ROOT=$(find /usr/local/lib/android \
              -maxdepth 3 \
              -type d \
              -name sdk \
              -print \
              -quit 2>/dev/null || true)
          fi

          test -n "$SDK_ROOT"
          test -d "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print \
              -quit 2>/dev/null || true)
          fi

          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version


      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "ANDROID SDK INSTALLATION PASSED."


      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"

          echo "ANDROID SDK VERIFICATION PASSED."


      - name: Find Majdoor Hisaab Project ZIP
        shell: bash
        run: |
          set -e

          FOUND_ZIP=""

          if [ -f "$ZIP_NAME" ]; then
            FOUND_ZIP="$ZIP_NAME"
          fi

          if [ -z "$FOUND_ZIP" ]; then
            FOUND_ZIP=$(
              find . \
                -type f \
                -name 'Majdoor_Hisaab_PRO_READY_TO_BUILD_FIXED_*.zip' \
                -not -path './.git/*' \
                -print \
                | sort \
                | tail -1
            )
          fi

          if [ -z "$FOUND_ZIP" ]; then
            FOUND_ZIP=$(
              find . \
                -type f \
                -iname '*Majdoor*Hisaab*.zip' \
                -not -path './.git/*' \
                -print \
                | sort \
                | tail -1
            )
          fi

          test -n "$FOUND_ZIP"
          test -f "$FOUND_ZIP"

          FOUND_ZIP="${FOUND_ZIP#./}"

          echo "ZIP_NAME=$FOUND_ZIP" >> "$GITHUB_ENV"

          echo "PROJECT ZIP:"
          echo "$FOUND_ZIP"


      - name: Extract Majdoor Hisaab Project
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_NAME" -d build_source

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( \
              -name settings.gradle \
              -o \
              -name settings.gradle.kts \
            \) \
            -print \
            -quit)

          test -n "$SETTINGS_FILE"

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT DIR:"
          echo "$PROJECT_DIR"


      - name: Verify Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -d app

          test -f app/build.gradle.kts \
            || test -f app/build.gradle

          echo "ANDROID PROJECT VERIFIED."


      - name: Verify Gradle Environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          java -version

          gradle --version

          DETECTED=$(
            gradle --version |
            awk '/^Gradle / {print $2; exit}'
          )

          echo "EXPECTED GRADLE: $GRADLE_VERSION"
          echo "DETECTED GRADLE: $DETECTED"

          test "$DETECTED" = "$GRADLE_VERSION"

          echo "GRADLE ENVIRONMENT PASSED."


      - name: Locate Main Kotlin Source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          MAIN_FILES=$(
            find app/src/main \
              -type f \
              -name MainActivity.kt \
              -print
          )

          COUNT=$(
            echo "$MAIN_FILES" |
            sed '/^$/d' |
            wc -l
          )

          test "$COUNT" -eq 1

          MAIN_FILE=$(echo "$MAIN_FILES" | head -1)

          echo "MAIN_FILE=$MAIN_FILE" >> "$GITHUB_ENV"

          echo "MAIN FILE:"
          echo "$MAIN_FILE"


      # ============================================================
      # COMPILE RELEASE KOTLIN
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -f "$MAIN_FILE"

          python3 - "$MAIN_FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")


          def replace_once(old, new, label):
              global source

              if old in source:
                  source = source.replace(old, new, 1)
                  print("FIX APPLIED:", label)

              elif new in source:
                  print("ALREADY FIXED:", label)

              else:
                  raise SystemExit(
                      "ERROR: pattern not found: " + label
                  )


          # ==========================================================
          # 1. Store context property
          # ==========================================================

          replace_once(
              'private class Store(context:Context){',
              'private class Store(private val context:Context){',
              'Store context property'
          )


          # ==========================================================
          # 2. JSONArray.mapList()
          # ==========================================================

          replace_once(
              'private fun <T> JSONArray.mapList(mapper:(JSONObject)->T):List<T>=(0 until length()).map{mapper(getJSONObject(it))}',

              '''private fun <T> JSONArray.mapList(
              mapper: (JSONObject) -> T
          ): List<T> = (0 until length()).map {
              mapper(getJSONObject(it))
          }''',

              'JSONArray.mapList'
          )


          # ==========================================================
          # 3. setContent import
          # ==========================================================

          if "import androidx.activity.compose.setContent" not in source:

              source = source.replace(
                  "import androidx.activity.ComponentActivity\n",

                  "import androidx.activity.ComponentActivity\n"
                  "import androidx.activity.compose.setContent\n",

                  1
              )

              print("FIX APPLIED: setContent import")

          else:
              print("ALREADY FIXED: setContent import")


          # ==========================================================
          # 4. ExpenseDialog argument order
          # ==========================================================

          expense_old = '''if(add)ExpenseDialog(store,edit?:Expense(UUID.randomUUID().toString(),preField?:(store.fields.firstOrNull()?.id?:""),preCrop?:(store.crops.firstOrNull{it.fieldId==preField}?.id?:""),"बीज","","","",0.0,today()),edit!=null){add=false;edit=null}'''

          expense_new = '''if(add)ExpenseDialog(store,edit?:Expense(UUID.randomUUID().toString(),preField?:(store.fields.firstOrNull()?.id?:""),preCrop?:(store.crops.firstOrNull{it.fieldId==preField}?.id?:""),"बीज","","","",0.0,today()),{add=false;edit=null},edit!=null)'''

          replace_once(
              expense_old,
              expense_new,
              "ExpenseDialog argument order"
          )


          # ==========================================================
          # 5. SaleDialog argument order
          # ==========================================================

          sale_old = '''if(add)SaleDialog(store,edit?:Sale(UUID.randomUUID().toString(),preField?:(store.fields.firstOrNull()?.id?:""),preCrop?:(store.crops.firstOrNull{it.fieldId==preField}?.id?:""),0.0,"क्विंटल",0.0,0.0,"",today()),edit!=null){add=false;edit=null}'''

          sale_new = '''if(add)SaleDialog(store,edit?:Sale(UUID.randomUUID().toString(),preField?:(store.fields.firstOrNull()?.id?:""),preCrop?:(store.crops.firstOrNull{it.fieldId==preField}?.id?:""),0.0,"क्विंटल",0.0,0.0,"",today()),{add=false;edit=null},edit!=null)'''

          replace_once(
              sale_old,
              sale_new,
              "SaleDialog argument order"
          )


          # ==========================================================
          # 6. LabourDetail PaymentDialog argument order
          # ==========================================================

          replace_once(
              'if(payment)PaymentDialog(store,id,null,""){payment=false}',

              'if(payment)PaymentDialog(store,id,null,null){payment=false}',

              'LabourDetail PaymentDialog arguments'
          )


          # ==========================================================
          # 7. persistPhoto()
          # ==========================================================

          persist_start = source.find(
              '    fun persistPhoto('
          )

          persist_end = source.find(
              '    fun addLabour(',
              persist_start
          )

          if persist_start < 0 or persist_end < 0:
              raise SystemExit(
                  'ERROR: persistPhoto boundaries not found'
              )

          persist_photo = '''    fun persistPhoto(uriString:String,owner:String):String{
              if(uriString.isBlank()||uriString.startsWith("file://")) return uriString

              return try{
                  val uri:Uri=Uri.parse(uriString)

                  val dir:File=
                      File(context.filesDir,"photos").apply{
                          mkdirs()
                      }

                  val file:File=
                      File(
                          dir,
                          "${owner}_${UUID.randomUUID()}.jpg"
                      )

                  val input:java.io.InputStream=
                      context.contentResolver
                          .openInputStream(uri)
                          ?:return ""

                  input.use{
                      inputStream:java.io.InputStream->

                      FileOutputStream(file).use{
                          outputStream:FileOutputStream->

                          inputStream.copyTo(
                              outputStream
                          )
                      }
                  }

                  file.absolutePath

              }catch(_:Exception){
                  ""
              }
          }

'''

          source = (
              source[:persist_start]
              + persist_photo
              + source[persist_end:]
          )

          print("FIX APPLIED: persistPhoto")


          # ==========================================================
          # 8. BottomBar Icon
          # ==========================================================

          replace_once(
              'Icon(ic,null,tint=if(current==k)Green else Color.Gray,Modifier.size(22.dp))',

              'Icon(imageVector=ic,contentDescription=null,modifier=Modifier.size(22.dp),tint=if(current==k)Green else Color.Gray)',

              'BottomBar Icon'
          )


          # ==========================================================
          # 9. TopBar Image
          # ==========================================================

          replace_once(
              'Image(painterResource(R.drawable.majdoor_logo_small),null,Modifier.size(42.dp).clip(RoundedCornerShape(10.dp)),contentScale=ContentScale.Crop)',

              'Image(painter=painterResource(R.drawable.majdoor_logo_small),contentDescription=null,modifier=Modifier.size(42.dp).clip(RoundedCornerShape(10.dp)),contentScale=ContentScale.Crop)',

              'TopBar Image'
          )


          # ==========================================================
          # 10. Dashboard Image
          # ==========================================================

          replace_once(
              'Image(painterResource(R.drawable.majdoor_logo),null,Modifier.fillMaxWidth().height(135.dp).clip(RoundedCornerShape(24.dp)),ContentScale.Fit)',

              'Image(painter=painterResource(R.drawable.majdoor_logo),contentDescription=null,modifier=Modifier.fillMaxWidth().height(135.dp).clip(RoundedCornerShape(24.dp)),contentScale=ContentScale.Fit)',

              'Dashboard Image'
          )


          path.write_text(
              source,
              encoding="utf-8"
          )

          print("")
          print("ALL SOURCE FIXES WRITTEN.")
          PY


          echo "SOURCE VERIFICATION"

          grep -n \
            'import androidx.activity.compose.setContent' \
            "$MAIN_FILE"

          grep -n \
            'private class Store' \
            "$MAIN_FILE" |
            head -1

          grep -n \
            'fun persistPhoto' \
            "$MAIN_FILE"

          grep -n \
            'private fun LabourDetail' \
            "$MAIN_FILE"


          echo "STARTING ACTUAL KOTLIN COMPILER"

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --rerun-tasks \
            :app:compileReleaseKotlin

          echo "COMPILE RELEASE KOTLIN PASSED."


      - name: Set Final Release Identity
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f app/build.gradle.kts ]; then

            python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")

          s = p.read_text(
              encoding="utf-8"
          )

          pairs = [
              (
                  'applicationId = "com.majdoor.hisaabpro"',
                  'applicationId = "com.majdoor.hisaab"'
              ),
              (
                  'versionCode = 1',
                  'versionCode = 77'
              ),
              (
                  'versionName = "1.0.0"',
                  'versionName = "1.77.0"'
              )
          ]

          for old, new in pairs:

              if old in s:
                  s = s.replace(
                      old,
                      new,
                      1
                  )

              elif new in s:
                  pass

              else:
                  raise SystemExit(
                      "Missing Gradle identity: " + old
                  )

          p.write_text(
              s,
              encoding="utf-8"
          )

          PY

          elif [ -f app/build.gradle ]; then

            sed -i \
              's/applicationId[[:space:]]*["'\'']com\.majdoor\.hisaabpro["'\'']/applicationId "com.majdoor.hisaab"/' \
              app/build.gradle

            sed -i \
              's/versionCode[[:space:]]*[0-9][0-9]*/versionCode 77/' \
              app/build.gradle

            sed -i \
              's/versionName[[:space:]]*["'\''][^"'\'']*["'\'']/versionName "1.77.0"/' \
              app/build.gradle

          else
            echo "ERROR: Android Gradle file not found."
            exit 1
          fi

          grep -E \
            'applicationId|versionCode|versionName' \
            app/build.gradle* \
            || true

          echo "FINAL RELEASE IDENTITY PASSED."


      - name: Assemble Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --rerun-tasks \
            :app:assembleRelease

          echo "ASSEMBLE RELEASE APK PASSED."


      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          APK=$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name '*release*.apk' \
              -print |
              sort |
              head -1
          )

          test -n "$APK"
          test -f "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          ls -lh "$APK"


      - name: Verify APK Package
        shell: bash
        run: |
          set -e

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging \
              "$APK_PATH"
          )

          echo "$BADGING" |
            grep -E \
              'package:|versionCode|versionName' |
            head -10

          echo "$BADGING" |
            grep -q \
              "name='$PACKAGE_NAME'"

          echo "$BADGING" |
            grep -q \
              "versionCode='$VERSION_CODE'"

          echo "$BADGING" |
            grep -q \
              "versionName='$VERSION_NAME'"

          echo "PACKAGE/VERSION VERIFIED."


      - name: Prepare Release Signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          KEYSTORE_FILE="$RUNNER_TEMP/majdoor-hisaab-release.jks"

          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ] &&
             [ -n "$KEY_PASSWORD" ]; then

            printf '%s' "$KEYSTORE_BASE64" |
              base64 --decode >
              "$KEYSTORE_FILE"

            keytool \
              -list \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              >/dev/null

            echo "RELEASE_SIGNING_MODE=PERMANENT" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          else

            TEMP_PASSWORD="$(openssl rand -hex 32)"
            TEMP_ALIAS="majdoor-hisaab-v82"

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -storepass "$TEMP_PASSWORD" \
              -keypass "$TEMP_PASSWORD" \
              -alias "$TEMP_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=Majdoor Hisaab PRO, OU=Android, O=Majdoor Hisaab, L=India, ST=Uttar Pradesh, C=IN"

            keytool \
              -list \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$TEMP_PASSWORD" \
              -alias "$TEMP_ALIAS" \
              >/dev/null

            echo "RELEASE_SIGNING_MODE=TEMPORARY" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$TEMP_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"

          fi


      - name: Verify Signing Environment
        shell: bash
        run: |
          set -e

          test -f "$RELEASE_KEYSTORE"

          keytool \
            -list \
            -keystore "$RELEASE_KEYSTORE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            >/dev/null

          echo "SIGNING ENVIRONMENT VERIFIED."
          echo "SIGNING MODE: $RELEASE_SIGNING_MODE"


      - name: Zipalign Release APK
        shell: bash
        run: |
          set -e

          ALIGNED_APK="$RUNNER_TEMP/$APK_UNSIGNED_NAME"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$APK_PATH" \
            "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c \
            -v \
            4 \
            "$ALIGNED_APK"

          echo "ALIGNED_APK=$ALIGNED_APK" >> "$GITHUB_ENV"

          echo "ZIPALIGN PASSED."


      - name: Sign Release APK
        shell: bash
        run: |
          set -e

          SIGNED_APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          rm -f "$SIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            sign \
            --ks "$RELEASE_KEYSTORE" \
            --ks-type JKS \
            --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass "pass:$RELEASE_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          test -f "$SIGNED_APK"

          ls -lh "$SIGNED_APK"


      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          echo "APK SIGNATURE VERIFIED."


      - name: Final APK Validation
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          SIZE=$(stat -c%s "$APK")

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK size unexpectedly small."
            exit 1
          fi

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging \
              "$APK"
          )

          echo "$BADGING" |
            grep -q \
              "name='$PACKAGE_NAME'"

          echo "$BADGING" |
            grep -q \
              "versionCode='$VERSION_CODE'"

          echo "$BADGING" |
            grep -q \
              "versionName='$VERSION_NAME'"

          echo "SHA256:"
          sha256sum "$APK"

          echo "FINAL APK VALIDATION PASSED."


      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: ${{ env.APK_SIGNED_NAME }}
          if-no-files-found: error
          retention-days: 30


      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/**
          if-no-files-found: warn
          retention-days: 14
