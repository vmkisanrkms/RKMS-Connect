name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_CODE: "82"
  VERSION_NAME: "1.82.0"

  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_FINAL_FIXED.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

jobs:
  build-release:
    name: Build, Sign and Verify Release APK
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 3. GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ============================================================
      # 4. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 5. INSTALL ANDROID API 36
      # ============================================================
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME}"

      # ============================================================
      # 6. CHECK TOOLS
      # ============================================================
      - name: Verify build tools
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version

          echo
          echo "ADB:"
          adb version

          echo
          echo "AAPT2:"
          ls -la "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"

          echo
          echo "APKSIGNER:"
          ls -la "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          echo
          echo "ZIPALIGN:"
          ls -la "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

      # ============================================================
      # 7. SHOW REPOSITORY
      # ============================================================
      - name: Show repository files
        shell: bash
        run: |
          set -e

          echo "Repository:"
          pwd

          echo
          echo "Top level:"
          find . -maxdepth 2 -type f | sort | head -300

      # ============================================================
      # 8. FIND FINAL ZIP
      # ============================================================
      - name: Locate project ZIP
        shell: bash
        run: |
          set -e

          ZIP_PATH="$(find "$GITHUB_WORKSPACE" -type f -name "${ZIP_NAME}" | head -n 1)"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Required ZIP not found:"
            echo "${ZIP_NAME}"
            echo
            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" -type f -iname "*.zip" -print || true
            exit 1
          fi

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$ZIP_PATH"

      # ============================================================
      # 9. PREPARE BUILD DIRECTORY
      # ============================================================
      - name: Prepare temporary build directory
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/majdoor-build"
          mkdir -p "$RUNNER_TEMP/majdoor-build"

          echo "BUILD_ROOT=$RUNNER_TEMP/majdoor-build" >> "$GITHUB_ENV"

      # ============================================================
      # 10. EXTRACT ZIP
      # ============================================================
      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          echo "Extracting:"
          echo "$ZIP_PATH"

          unzip -q "$ZIP_PATH" -d "$BUILD_ROOT"

          echo
          echo "Extracted files:"
          find "$BUILD_ROOT" -maxdepth 3 -type f | sort | head -400

      # ============================================================
      # 11. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project root
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find "$BUILD_ROOT" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle.kts / settings.gradle not found."
            find "$BUILD_ROOT" -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Gradle project root:"
          echo "$PROJECT_ROOT"

          echo
          echo "Project files:"
          find "$PROJECT_ROOT" -maxdepth 3 -type f | sort | head -500

      # ============================================================
      # 12. VERIFY PROJECT
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_ROOT/settings.gradle.kts" || \
            test -f "$PROJECT_ROOT/settings.gradle"

          test -f "$PROJECT_ROOT/build.gradle.kts" || \
            test -f "$PROJECT_ROOT/build.gradle"

          test -f "$PROJECT_ROOT/app/build.gradle.kts" || \
            test -f "$PROJECT_ROOT/app/build.gradle"

          test -f "$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          echo "Android project structure OK."

      # ============================================================
      # 13. VERIFY MAINACTIVITY
      # ============================================================
      - name: Verify Kotlin source
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          echo "Checking:"
          echo "$MAIN"

          grep -q "fun validDate" "$MAIN"
          grep -q "BackHandler" "$MAIN"
          grep -q "PhotoThumb" "$MAIN"
          grep -q "AttendanceScreen" "$MAIN"
          grep -q "DeviceCredentialDeleteGate" "$MAIN"
          grep -q "Stat" "$MAIN"
          grep -q "money" "$MAIN"

          echo "Required Kotlin source checks passed."

      # ============================================================
      # 14. VERIFY PAYMENT/CROP FIX
      # ============================================================
      - name: Verify payment and crop cleanup fixes
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          grep -q 'payments=payments.filterNot{it.cropId==id}' "$MAIN"
          grep -q 'write("payment",payments,::obj)' "$MAIN"

          if grep -q '||field.isBlank()) return@Button' "$MAIN"; then
            echo "::error::Old mandatory-field payment validation still exists."
            exit 1
          fi

          echo "Payment/crop cleanup verification passed."

      # ============================================================
      # 15. VERIFY PACKAGE / VERSION
      # ============================================================
      - name: Verify package and version
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "Checking:"
          echo "$APP_GRADLE"

          grep -q 'com.majdoor.hisaabpro' "$APP_GRADLE"
          grep -q 'versionCode[[:space:]]*82' "$APP_GRADLE"
          grep -q 'versionName[[:space:]]*"1.82.0"' "$APP_GRADLE"

          echo
          echo "Package:"
          grep -n "com.majdoor.hisaabpro" "$APP_GRADLE"

          echo
          echo "Version:"
          grep -n "versionCode\|versionName" "$APP_GRADLE"

          echo
          echo "Package/version verification passed."

      # ============================================================
      # 16. ANDROID LOCAL PROPERTIES
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_ROOT/local.properties" <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          EOF

          echo "local.properties created."

          cat "$PROJECT_ROOT/local.properties"

      # ============================================================
      # 17. GRADLE CLEAN
      # ============================================================
      - name: Gradle clean
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          gradle clean --no-daemon --stacktrace

      # ============================================================
      # 18. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 19. LOCATE APK
      # ============================================================
      - name: Locate unsigned release APK
        shell: bash
        run: |
          set -e

          APK_PATH="$(find "$PROJECT_ROOT/app/build/outputs/apk/release" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not generated."

            echo
            echo "APK output:"
            find "$PROJECT_ROOT/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          echo "APK_UNSIGNED_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "Unsigned APK:"
          echo "$APK_PATH"

      # ============================================================
      # 20. COPY UNSIGNED APK
      # ============================================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/apk"

          cp "$APK_UNSIGNED_PATH" \
            "$RUNNER_TEMP/apk/$APK_UNSIGNED_NAME"

          ls -lh "$RUNNER_TEMP/apk"

      # ============================================================
      # 21. GENERATE TEMPORARY SIGNING KEY
      # ============================================================
      - name: Generate temporary release keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$RUNNER_TEMP/majdoor-release-key.p12"

          keytool \
            -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -alias majdoor_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=Majdoor Hisaab PRO, OU=Release, O=Majdoor Hisaab PRO, L=India, ST=Uttar Pradesh, C=IN"

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=majdoor_release" >> "$GITHUB_ENV"

          echo "Temporary signing key created."

      # ============================================================
      # 22. ZIPALIGN
      # ============================================================
      - name: Zipalign APK
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            "$RUNNER_TEMP/apk/$APK_UNSIGNED_NAME" \
            "$RUNNER_TEMP/apk/aligned.apk"

          echo "APK aligned."

      # ============================================================
      # 23. SIGN APK
      # ============================================================
      - name: Sign release APK
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --ks-key-alias "$KEY_ALIAS" \
            --min-sdk-version 23 \
            --max-sdk-version 36 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RUNNER_TEMP/apk/$APK_SIGNED_NAME" \
            "$RUNNER_TEMP/apk/aligned.apk"

          echo "APK signed successfully."

      # ============================================================
      # 24. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$RUNNER_TEMP/apk/$APK_SIGNED_NAME"

          echo
          echo "APK signature verification PASSED."

      # ============================================================
      # 25. VERIFY APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          "$ZIPALIGN" -c -v 4 \
            "$RUNNER_TEMP/apk/$APK_SIGNED_NAME"

          echo "APK alignment verification PASSED."

      # ============================================================
      # 26. VERIFY APK PACKAGE/VERSION
      # ============================================================
      - name: Verify final APK package and version
        shell: bash
        run: |
          set -e

          AAPT2="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"

          APK="$RUNNER_TEMP/apk/$APK_SIGNED_NAME"

          echo "APK:"
          ls -lh "$APK"

          echo
          echo "APK dump:"

          "$AAPT2" dump badging "$APK" > "$RUNNER_TEMP/apk/badging.txt"

          cat "$RUNNER_TEMP/apk/badging.txt"

          grep -q "package: name='${PACKAGE_NAME}'" \
            "$RUNNER_TEMP/apk/badging.txt"

          grep -q "versionCode='${VERSION_CODE}'" \
            "$RUNNER_TEMP/apk/badging.txt"

          grep -q "versionName='${VERSION_NAME}'" \
            "$RUNNER_TEMP/apk/badging.txt"

          echo
          echo "PACKAGE VERIFIED:"
          echo "$PACKAGE_NAME"

          echo "VERSION CODE VERIFIED:"
          echo "$VERSION_CODE"

          echo "VERSION NAME VERIFIED:"
          echo "$VERSION_NAME"

      # ============================================================
      # 27. BUILD REPORT
      # ============================================================
      - name: Create build report
        shell: bash
        run: |
          set -e

          REPORT="$RUNNER_TEMP/apk/BUILD-REPORT.txt"

          {
            echo "=============================================="
            echo "MAJDOOR HISAAB PRO V82"
            echo "FINAL RELEASE BUILD REPORT"
            echo "=============================================="
            echo
            echo "Package      : ${PACKAGE_NAME}"
            echo "Version Code : ${VERSION_CODE}"
            echo "Version Name : ${VERSION_NAME}"
            echo "Android API  : ${ANDROID_API}"
            echo "Build Tools  : ${BUILD_TOOLS}"
            echo "Java         : ${JAVA_VERSION}"
            echo "Gradle       : ${GRADLE_VERSION}"
            echo
            echo "Release APK  : ${APK_SIGNED_NAME}"
            echo
            echo "Checks:"
            echo "1. Android project         : PASS"
            echo "2. Kotlin source           : PASS"
            echo "3. Payment/crop cleanup    : PASS"
            echo "4. Gradle clean            : PASS"
            echo "5. Release compilation     : PASS"
            echo "6. APK generated           : PASS"
            echo "7. ZIP alignment           : PASS"
            echo "8. APK signing             : PASS"
            echo "9. Signature verification  : PASS"
            echo "10. Package verification   : PASS"
            echo "11. Version verification   : PASS"
            echo
            echo "=============================================="
            echo "BUILD SUCCESS"
            echo "=============================================="
          } > "$REPORT"

          cat "$REPORT"

      # ============================================================
      # 28. UPLOAD FINAL APK
      # ============================================================
      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED
          path: |
            ${{ runner.temp }}/apk/${{ env.APK_SIGNED_NAME }}
            ${{ runner.temp }}/apk/BUILD-REPORT.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 29. FINAL SUMMARY
      # ============================================================
      - name: Final build summary
        shell: bash
        run: |
          echo "=============================================="
          echo "MAJDOOR HISAAB PRO V82"
          echo "FINAL BUILD COMPLETED"
          echo "=============================================="
          echo
          echo "APK:"
          ls -lh "$RUNNER_TEMP/apk/$APK_SIGNED_NAME"
          echo
          echo "Artifact:"
          echo "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED"
          echo
          echo "Package:"
          echo "$PACKAGE_NAME"
          echo
          echo "Version:"
          echo "$VERSION_NAME ($VERSION_CODE)"
          echo
          echo "=============================================="

      # ============================================================
      # 30. CLEAN SIGNING MATERIAL
      # ============================================================
      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/majdoor-release-key.p12" || true
          rm -f "$RUNNER_TEMP/apk/aligned.apk" || true
          rm -f "$RUNNER_TEMP/apk/$APK_UNSIGNED_NAME" || true

          echo "Temporary signing material cleaned."
