name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  # ============================================================
  # JAVA / GRADLE
  # ============================================================

  JAVA_VERSION: "21"
  GRADLE_VERSION: "8.11.1"

  # ============================================================
  # ANDROID
  # ============================================================

  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  # ============================================================
  # SOURCE ZIP
  # IMPORTANT: V3 ONLY
  # ============================================================

  ZIP_NAME: ZIP_NAME: "Majdoor_Hisaab_PRO_V82_PADDING_FIXED_V4.zip"

  # ============================================================
  # APK NAMES
  # ============================================================

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

  # ============================================================
  # EXPECTED PACKAGE
  # ============================================================

  EXPECTED_PACKAGE: "com.majdoor.hisaabpro"


jobs:

  # ============================================================
  # BUILD RELEASE
  # ============================================================

  build-release:

    name: Build Android 16 Release APK

    runs-on: ubuntu-24.04

    timeout-minutes: 60

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==========================================================
      # 2. JAVA 21
      # ==========================================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ==========================================================
      # 3. VERIFY JAVA
      # ==========================================================

      - name: Verify Java
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "JAVA VERIFICATION"
          echo "=============================================="

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "${JAVA_HOME}"

          echo ""
          echo "Java verification PASSED."


      # ==========================================================
      # 4. SETUP ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false


      # ==========================================================
      # 5. INSTALL ANDROID API 36
      # ==========================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INSTALLING ANDROID SDK"
          echo "=============================================="

          echo "API LEVEL   : ${ANDROID_API}"
          echo "BUILD TOOLS : ${BUILD_TOOLS}"

          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          yes | sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            --licenses \
            >/dev/null 2>&1 || true

          echo ""
          echo "Installed Android packages:"

          sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            --list_installed \
            | grep -E \
              "platform-tools|platforms;android|build-tools" \
            || true

          echo ""
          echo "Android SDK installation completed."


      # ==========================================================
      # 6. VERIFY ANDROID SDK
      # ==========================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=============================================="

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          test -d \
            "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"

          test -d \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}"

          test -x \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt"

          test -x \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/zipalign"

          test -x \
            "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

          echo ""
          echo "Android SDK verification PASSED."


      # ==========================================================
      # 7. VERIFY SOURCE ZIP
      # ==========================================================

      - name: Verify corrected source ZIP
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY SOURCE ZIP"
          echo "=============================================="

          echo ""
          echo "Looking for:"
          echo "${ZIP_NAME}"

          if [ ! -f "${ZIP_NAME}" ]; then

            echo ""
            echo "ERROR: Required ZIP file was not found."

            echo ""
            echo "ZIP files in repository:"

            find . \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              -print \
              | sort

            exit 1

          fi

          echo ""
          echo "SOURCE ZIP FOUND."

          ls -lh "${ZIP_NAME}"


      # ==========================================================
      # 8. PREPARE BUILD DIRECTORY
      # ==========================================================

      - name: Prepare build directory
        shell: bash
        run: |
          set -e

          rm -rf build-source

          mkdir -p build-source

          echo "Build directory prepared."


      # ==========================================================
      # 9. EXTRACT SOURCE ZIP
      # ==========================================================

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "EXTRACT SOURCE ZIP"
          echo "=============================================="

          unzip -q \
            "${ZIP_NAME}" \
            -d build-source

          echo ""
          echo "ZIP extraction completed."

          echo ""
          echo "Searching for Gradle projects:"

          find build-source \
            -type f \
            \( \
              -name "gradlew" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            | sort


      # ==========================================================
      # 10. LOCATE ANDROID PROJECT
      # ==========================================================

      - name: Locate Android Gradle project
        id: find_android
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE ANDROID GRADLE PROJECT"
          echo "=============================================="

          GRADLEW="$(
            find build-source \
              -type f \
              -name "gradlew" \
              -not -path "*/node_modules/*" \
              -not -path "*/.gradle/*" \
              | head -1
          )"

          if [ -z "$GRADLEW" ]; then

            echo ""
            echo "ERROR: gradlew not found."

            find build-source \
              -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "build.gradle" \
                -o -name "build.gradle.kts" \
                -o -name "gradlew" \
              \) \
              | sort

            exit 1

          fi

          ANDROID_DIR="$(dirname "$GRADLEW")"

          chmod +x "$GRADLEW"

          echo ""
          echo "Gradle wrapper:"
          echo "$GRADLEW"

          echo ""
          echo "Android project:"
          echo "$ANDROID_DIR"

          echo "gradlew=$GRADLEW" \
            >> "$GITHUB_OUTPUT"

          echo "android_dir=$ANDROID_DIR" \
            >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 11. INSPECT ANDROID PROJECT
      # ==========================================================

      - name: Inspect Android project
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID PROJECT INSPECTION"
          echo "=============================================="

          pwd

          echo ""
          echo "Gradle wrapper:"
          ls -la ./gradlew

          echo ""
          echo "Gradle wrapper properties:"

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            cat gradle/wrapper/gradle-wrapper.properties
          else
            echo "WARNING: gradle-wrapper.properties not found."
          fi

          echo ""
          echo "Project files:"

          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle-wrapper.properties" \
              -o -name "AndroidManifest.xml" \
            \) \
            | sort \
            | head -300


      # ==========================================================
      # 12. FORCE GRADLE 8.11.1
      # ==========================================================

      - name: Enforce Gradle 8.11.1
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ENFORCE GRADLE ${GRADLE_VERSION}"
          echo "=============================================="

          WRAPPER_FILE="gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER_FILE" ]; then
            echo ""
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          echo ""
          echo "Before update:"
          cat "$WRAPPER_FILE"

          python3 - "$WRAPPER_FILE" "${GRADLE_VERSION}" <<'PY'
          import sys
          import re
          from pathlib import Path

          file = Path(sys.argv[1])
          version = sys.argv[2]

          text = file.read_text()

          new_url = (
              "distributionUrl=https\\://services.gradle.org/"
              f"distributions/gradle-{version}-bin.zip"
          )

          text = re.sub(
              r"^distributionUrl=.*$",
              new_url,
              text,
              flags=re.MULTILINE
          )

          if "distributionUrl=" not in text:
              text += "\n" + new_url + "\n"

          file.write_text(text)
          PY

          echo ""
          echo "After update:"
          cat "$WRAPPER_FILE"


      # ==========================================================
      # 13. VERIFY GRADLE
      # ==========================================================

      - name: Verify Gradle
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE VERIFICATION"
          echo "=============================================="

          chmod +x ./gradlew

          ./gradlew --version

          echo ""
          echo "Expected Gradle:"
          echo "${GRADLE_VERSION}"

          echo ""
          echo "Gradle verification completed."


      # ==========================================================
      # 14. GRADLE CLEAN
      # ==========================================================

      - name: Gradle clean
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==========================================================
      # 15. COMPILE RELEASE KOTLIN
      # ==========================================================

      - name: Compile Release Kotlin
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN"
          echo "=============================================="

          ./gradlew compileReleaseKotlin \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ==========================================================
      # 16. ASSEMBLE RELEASE APK
      # ==========================================================

      - name: Assemble Release APK
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ASSEMBLE RELEASE APK"
          echo "=============================================="

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "Release APK files:"

          find . \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print


      # ==========================================================
      # 17. LOCATE APK
      # ==========================================================

      - name: Locate generated Release APK
        id: locate_apk
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          APK="$(
            find . \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -not -name "*unsigned*" \
              | head -1
          )"

          if [ -z "$APK" ]; then

            APK="$(
              find . \
                -type f \
                -path "*/build/outputs/apk/release/*.apk" \
                | head -1
            )"

          fi

          if [ -z "$APK" ]; then

            echo "ERROR: Release APK not found."

            find . \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1

          fi

          echo ""
          echo "Generated APK:"
          echo "$APK"

          echo "apk=$APK" \
            >> "$GITHUB_OUTPUT"


      # ==========================================================
      # 18. PREPARE FINAL APK
      # ==========================================================

      - name: Prepare final APK
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          rm -rf final

          mkdir -p final

          cp \
            "${{ steps.locate_apk.outputs.apk }}" \
            "final/${APK_UNSIGNED_NAME}"

          echo ""
          echo "APK copied successfully."

          ls -lh \
            "final/${APK_UNSIGNED_NAME}"


      # ==========================================================
      # 19. VERIFY PACKAGE NAME
      # ==========================================================

      - name: Verify APK package name
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          AAPT="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt"

          APK="final/${APK_UNSIGNED_NAME}"

          echo "=============================================="
          echo "VERIFY APK PACKAGE"
          echo "=============================================="

          test -f "$APK"

          PACKAGE_NAME="$(
            "$AAPT" dump badging "$APK" |
            sed -n \
              "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )"

          echo ""
          echo "Expected:"
          echo "${EXPECTED_PACKAGE}"

          echo ""
          echo "Found:"
          echo "${PACKAGE_NAME}"

          if [ "$PACKAGE_NAME" != "$EXPECTED_PACKAGE" ]; then

            echo ""
            echo "ERROR: Package name mismatch."

            exit 1

          fi

          echo ""
          echo "PACKAGE NAME VERIFIED."


      # ==========================================================
      # 20. ZIPALIGN
      # ==========================================================

      - name: Zipalign Release APK
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          ZIPALIGN="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/zipalign"

          INPUT_APK="final/${APK_UNSIGNED_NAME}"

          ALIGNED_APK="final/aligned-release.apk"

          echo "=============================================="
          echo "ZIPALIGN APK"
          echo "=============================================="

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          "$ZIPALIGN" \
            -c \
            -P 16 \
            -v 4 \
            "$ALIGNED_APK"

          echo ""
          echo "ZIPALIGN VERIFIED."


      # ==========================================================
      # 21. PREPARE SIGNING KEY
      # ==========================================================

      - name: Prepare signing key
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          mkdir -p signing

          KEYSTORE="signing/majdoor-hisaab-release.jks"

          if [ -n "${{ secrets.MAJDOOR_KEYSTORE_BASE64 }}" ]; then

            echo "Using permanent GitHub keystore."

            echo "${{ secrets.MAJDOOR_KEYSTORE_BASE64 }}" \
              | base64 --decode > "$KEYSTORE"

          else

            echo "Permanent keystore not configured."

            echo "Generating temporary release keystore."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storetype JKS \
              -alias majdoor-hisaab \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "MajdoorHisaabV82" \
              -keypass "MajdoorHisaabV82" \
              -dname \
              "CN=Majdoor Hisaab PRO, OU=Android, O=Majdoor Hisaab, L=India, ST=Uttar Pradesh, C=IN"

          fi

          test -f "$KEYSTORE"

          echo ""
          echo "Signing key ready."


      # ==========================================================
      # 22. SIGN APK
      # ==========================================================

      - name: Sign Release APK
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MAJDOOR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MAJDOOR_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAJDOOR_KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

          KEYSTORE="signing/majdoor-hisaab-release.jks"

          ALIGNED_APK="final/aligned-release.apk"

          SIGNED_APK="final/${APK_SIGNED_NAME}"

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            KEYSTORE_PASSWORD="MajdoorHisaabV82"
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            KEY_PASSWORD="MajdoorHisaabV82"
          fi

          if [ -z "$KEY_ALIAS" ]; then
            KEY_ALIAS="majdoor-hisaab"
          fi

          echo "=============================================="
          echo "SIGNING APK"
          echo "=============================================="

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          test -f "$SIGNED_APK"

          echo ""
          echo "SIGNED APK CREATED."

          ls -lh "$SIGNED_APK"


      # ==========================================================
      # 23. VERIFY APK SIGNATURE
      # ==========================================================

      - name: Verify APK signature
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

          SIGNED_APK="final/${APK_SIGNED_NAME}"

          echo "=============================================="
          echo "VERIFY APK SIGNATURE"
          echo "=============================================="

          "$APKSIGNER" verify \
            --verbose \
            "$SIGNED_APK"

          echo ""
          echo "APK SIGNATURE VERIFIED."


      # ==========================================================
      # 24. FINAL APK VALIDATION
      # ==========================================================

      - name: Final APK validation
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          AAPT="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt"

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

          SIGNED_APK="final/${APK_SIGNED_NAME}"

          echo "=============================================="
          echo "FINAL APK VALIDATION"
          echo "=============================================="

          test -f "$SIGNED_APK"

          echo ""
          echo "APK:"
          ls -lh "$SIGNED_APK"

          echo ""
          echo "Package:"

          "$AAPT" dump badging "$SIGNED_APK" | head -1

          echo ""
          echo "Signature:"

          "$APKSIGNER" verify \
            --verbose \
            "$SIGNED_APK"

          echo ""
          echo "SHA256:"

          sha256sum "$SIGNED_APK"

          echo ""
          echo "FINAL APK VALIDATION PASSED."


      # ==========================================================
      # 25. BUILD INFORMATION
      # ==========================================================

      - name: Create build information
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          mkdir -p final

          {
            printf '%s\n' "=============================================="
            printf '%s\n' "MAJDOOR HISAAAB PRO V82"
            printf '%s\n' "FINAL SIGNED RELEASE"
            printf '%s\n' "=============================================="
            printf '%s\n' ""
            printf '%s\n' "Package: ${EXPECTED_PACKAGE}"
            printf '%s\n' "Android API: ${ANDROID_API}"
            printf '%s\n' "Build Tools: ${BUILD_TOOLS}"
            printf '%s\n' "Java: ${JAVA_VERSION}"
            printf '%s\n' "Gradle: ${GRADLE_VERSION}"
            printf '%s\n' "Runner: ubuntu-24.04"
            printf '%s\n' ""
            printf '%s\n' "Source ZIP: ${ZIP_NAME}"
            printf '%s\n' "APK: ${APK_SIGNED_NAME}"
            printf '%s\n' ""
            printf '%s\n' "Git commit: ${GITHUB_SHA}"
            printf '%s\n' "Git ref: ${GITHUB_REF}"
            printf '%s\n' "Run number: ${GITHUB_RUN_NUMBER}"
            printf '%s\n' ""
            printf '%s\n' "SHA256:"
            sha256sum "final/${APK_SIGNED_NAME}"
            printf '%s\n' ""
            printf '%s\n' "Build completed successfully."
            printf '%s\n' "=============================================="
          } > final/BUILD_INFO.txt

          cat final/BUILD_INFO.txt


      # ==========================================================
      # 26. COPY SOURCE ZIP
      # ==========================================================

      - name: Copy source ZIP to final output
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          cp \
            "${GITHUB_WORKSPACE}/${ZIP_NAME}" \
            "final/${ZIP_NAME}"

          echo ""
          echo "Source ZIP copied."

          ls -lh final/


      # ==========================================================
      # 27. CREATE FINAL RELEASE PACKAGE
      # ==========================================================

      - name: Create final release package
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          cd final

          rm -f \
            "Majdoor_Hisaab_PRO_V82_FINAL_RELEASE_PACKAGE.zip"

          zip -q \
            "Majdoor_Hisaab_PRO_V82_FINAL_RELEASE_PACKAGE.zip" \
            "${APK_SIGNED_NAME}" \
            "BUILD_INFO.txt"

          echo ""
          echo "Final release package:"

          ls -lh \
            "Majdoor_Hisaab_PRO_V82_FINAL_RELEASE_PACKAGE.zip"


      # ==========================================================
      # 28. UPLOAD SIGNED APK
      # ==========================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: |
            ${{ steps.find_android.outputs.android_dir }}/final/${{ env.APK_SIGNED_NAME }}
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 29. UPLOAD RELEASE PACKAGE
      # ==========================================================

      - name: Upload Final Release Package
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-RELEASE-PACKAGE
          path: |
            ${{ steps.find_android.outputs.android_dir }}/final/Majdoor_Hisaab_PRO_V82_FINAL_RELEASE_PACKAGE.zip
            ${{ steps.find_android.outputs.android_dir }}/final/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 30. UPLOAD V3 SOURCE ZIP
      # ==========================================================

      - name: Upload V3 Source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-PADDING-FIXED-V3-SOURCE-ZIP
          path: |
            ${{ steps.find_android.outputs.android_dir }}/final/${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 31. FINAL SUCCESS
      # ==========================================================

      - name: Final success check
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "======================================================"
          echo "       MAJDOOR HISAAAB PRO V82 - SUCCESS"
          echo "======================================================"
          echo ""
          echo "Source ZIP:"
          echo "  ${ZIP_NAME}"
          echo ""
          echo "Signed APK:"
          echo "  ${APK_SIGNED_NAME}"
          echo ""
          echo "Package:"
          echo "  ${EXPECTED_PACKAGE}"
          echo ""
          echo "Android API:"
          echo "  ${ANDROID_API}"
          echo ""
          echo "Build Tools:"
          echo "  ${BUILD_TOOLS}"
          echo ""
          echo "Java:"
          echo "  ${JAVA_VERSION}"
          echo ""
          echo "Gradle:"
          echo "  ${GRADLE_VERSION}"
          echo ""
          echo "Zipalign:"
          echo "  VERIFIED"
          echo ""
          echo "Signature:"
          echo "  VERIFIED"
          echo ""
          echo "Package:"
          echo "  VERIFIED"
          echo ""
          echo "======================================================"
          echo "FINAL SIGNED APK BUILD SUCCESSFUL"
          echo "======================================================"
