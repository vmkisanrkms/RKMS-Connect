name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V82-KOTLIN-COMPILE-FIXED.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build Final Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # 4. LOCATE ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATING ANDROID SDK"
          echo "=============================================="

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"

          else
            SDK_ROOT=$(find /usr/local/lib/android \
              -maxdepth 3 \
              -type d \
              -name "sdk" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name "sdkmanager" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "ANDROID SDK:"
          echo "$SDK_ROOT"

          echo ""
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 5. INSTALL ANDROID SDK 36
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INSTALL ANDROID SDK 36"
          echo "=============================================="

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "ANDROID SDK INSTALLATION PASSED."


      # ============================================================
      # 6. VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY ANDROID SDK"
          echo "=============================================="

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"

          echo ""
          echo "ANDROID SDK VERIFICATION PASSED."


      # ============================================================
      # 7. FIND PROJECT ZIP
      # ============================================================

      - name: Find Majdoor Hisaab Project ZIP
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FIND MAJDOOR HISAAB PROJECT ZIP"
          echo "=============================================="

          FOUND_ZIP=""

          if [ -f "$ZIP_NAME" ]; then
            FOUND_ZIP="$ZIP_NAME"
          fi

          if [ -z "$FOUND_ZIP" ]; then
            FOUND_ZIP=$(
              find . \
                -type f \
                -name "Majdoor_Hisaab_PRO_READY_TO_BUILD_FIXED_*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | tail -1
            )
          fi

          if [ -z "$FOUND_ZIP" ]; then
            FOUND_ZIP=$(
              find . \
                -type f \
                -iname "*Majdoor*Hisaab*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | tail -1
            )
          fi

          if [ -z "$FOUND_ZIP" ] || [ ! -f "$FOUND_ZIP" ]; then
            echo ""
            echo "ERROR: Majdoor Hisaab project ZIP NOT FOUND."

            echo ""
            echo "AVAILABLE ZIP FILES:"

            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print \
              | sort

            exit 1
          fi

          FOUND_ZIP="${FOUND_ZIP#./}"

          echo ""
          echo "PROJECT ZIP FOUND:"
          echo "$FOUND_ZIP"

          ls -lh "$FOUND_ZIP"

          echo "ZIP_NAME=$FOUND_ZIP" >> "$GITHUB_ENV"

          echo ""
          echo "ZIP DETECTION PASSED."


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================

      - name: Extract Majdoor Hisaab Project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "EXTRACT PROJECT"
          echo "=============================================="

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_NAME" -d build_source

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print \
            -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: Gradle settings file not found."

            find build_source \
              -maxdepth 8 \
              -type f \
              -print \
              | sort \
              | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 9. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY ANDROID PROJECT"
          echo "=============================================="

          pwd

          test -d "app"

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo ""
          echo "ANDROID PROJECT VERIFIED."


      # ============================================================
      # 10. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle Environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE ENVIRONMENT"
          echo "=============================================="

          java -version

          echo ""
          gradle --version

          DETECTED=$(
            gradle --version |
            awk '/^Gradle / {print $2; exit}'
          )

          echo ""
          echo "EXPECTED GRADLE:"
          echo "$GRADLE_VERSION"

          echo ""
          echo "DETECTED GRADLE:"
          echo "$DETECTED"

          if [ "$DETECTED" != "$GRADLE_VERSION" ]; then
            echo ""
            echo "ERROR: Gradle version mismatch."
            exit 1
          fi

          echo ""
          echo "GRADLE ENVIRONMENT PASSED."


      # ============================================================
      # 11. LOCATE MAIN KOTLIN SOURCE
      # ============================================================

      - name: Locate Main Kotlin Source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE MAIN KOTLIN SOURCE"
          echo "=============================================="

          MAIN_FILES=$(find app/src/main \
            -type f \
            -name "MainActivity.kt" \
            -print)

          echo "$MAIN_FILES"

          COUNT=$(echo "$MAIN_FILES" | sed '/^$/d' | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo ""
            echo "ERROR: Multiple MainActivity.kt files found."
            exit 1
          fi

          MAIN_FILE=$(echo "$MAIN_FILES" | head -1)

          echo "MAIN_FILE=$MAIN_FILE" >> "$GITHUB_ENV"

          echo ""
          echo "MAIN FILE:"
          echo "$MAIN_FILE"


      # ============================================================
      # 12. KOTLIN SOURCE REPAIR
      # ============================================================

      - name: Repair Kotlin Source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "REPAIR KOTLIN SOURCE"
          echo "=============================================="

          test -f "$MAIN_FILE"

          python3 - "$MAIN_FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          print("SOURCE:", path)
          print("SOURCE SIZE:", len(source), "bytes")


          # ==========================================================
          # Remove UTF-8 BOM if present
          # ==========================================================

          if source.startswith("\ufeff"):
              source = source[1:]
              print("FIX APPLIED: UTF-8 BOM removed")


          # ==========================================================
          # setContent import
          # ==========================================================

          if "import androidx.activity.compose.setContent" not in source:

              package_match = re.search(
                  r"^package[^\n]+\n",
                  source,
                  re.MULTILINE
              )

              if package_match:
                  source = (
                      source[:package_match.end()]
                      + "\n"
                      + "import androidx.activity.compose.setContent\n"
                      + source[package_match.end():]
                  )

                  print("FIX APPLIED: setContent import")

          else:
              print("ALREADY OK: setContent import")


          # ==========================================================
          # Store Context
          # ==========================================================

          old_store = "private class Store(context:Context){"
          new_store = "private class Store(private val context:Context){"

          if old_store in source:

              source = source.replace(
                  old_store,
                  new_store,
                  1
              )

              print("FIX APPLIED: Store context")

          elif new_store in source:

              print("ALREADY OK: Store context")


          # ==========================================================
          # JSONArray.mapList
          # ==========================================================

          map_pattern = re.compile(
              r"private fun <T> JSONArray\.mapList"
              r"\(mapper:\(JSONObject\)->T\):List<T>"
              r"=[^\n]+"
          )

          map_match = map_pattern.search(source)

          if map_match:

              replacement = """private fun <T> JSONArray.mapList(
          mapper: (JSONObject) -> T
      ): List<T> = (0 until length()).map {
          mapper(getJSONObject(it))
      }"""

              source = (
                  source[:map_match.start()]
                  + replacement
                  + source[map_match.end():]
              )

              print("FIX APPLIED: JSONArray.mapList")

          elif "private fun <T> JSONArray.mapList(" in source:

              print("ALREADY OK: JSONArray.mapList")


          # ==========================================================
          # Helper to replace a complete function
          # ==========================================================

          def replace_function(text, function_name, replacement):

              pattern = re.compile(
                  r"(?m)^[ \t]*(?:@Composable[ \t]*\n[ \t]*)?"
                  r"(?:private[ \t]+|public[ \t]+|internal[ \t]+)?"
                  r"fun[ \t]+"
                  + re.escape(function_name)
                  + r"[ \t]*\("
              )

              match = pattern.search(text)

              if not match:
                  return text, False

              open_brace = text.find("{", match.end())

              if open_brace == -1:
                  raise SystemExit(
                      "ERROR: opening brace not found for "
                      + function_name
                  )

              depth = 0
              in_string = False
              in_char = False
              escape = False
              line_comment = False
              block_comment = False

              i = open_brace

              while i < len(text):

                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:

                      if c == "\n":
                          line_comment = False

                  elif block_comment:

                      if c == "*" and n == "/":
                          block_comment = False
                          i += 1

                  elif in_string:

                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == '"':
                          in_string = False

                  elif in_char:

                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == "'":
                          in_char = False

                  else:

                      if c == "/" and n == "/":
                          line_comment = True
                          i += 1

                      elif c == "/" and n == "*":
                          block_comment = True
                          i += 1

                      elif c == '"':
                          in_string = True

                      elif c == "'":
                          in_char = True

                      elif c == "{":
                          depth += 1

                      elif c == "}":

                          depth -= 1

                          if depth == 0:

                              return (
                                  text[:match.start()]
                                  + replacement
                                  + text[i + 1:],
                                  True
                              )

                  i += 1

              raise SystemExit(
                  "ERROR: unbalanced braces in "
                  + function_name
              )


          # ==========================================================
          # persistPhoto
          # ==========================================================

          persist_photo = """    fun persistPhoto(
          uriString: String,
          owner: String
      ): String {
          if (uriString.isBlank() || uriString.startsWith("file://")) {
              return uriString
          }

          return try {
              val uri: Uri = Uri.parse(uriString)

              val dir: File = File(
                  context.filesDir,
                  "photos"
              ).apply {
                  mkdirs()
              }

              val file: File = File(
                  dir,
                  "${owner}_${UUID.randomUUID()}.jpg"
              )

              val input: java.io.InputStream =
                  context.contentResolver
                      .openInputStream(uri)
                  ?: return ""

              input.use { inputStream ->
                  FileOutputStream(file).use { outputStream ->
                      inputStream.copyTo(outputStream)
                  }
              }

              file.absolutePath

          } catch (_: Exception) {
              ""
          }
      }
      """

          if "fun persistPhoto" in source:

              source, found = replace_function(
                  source,
                  "persistPhoto",
                  persist_photo
              )

              if found:
                  print("FIX APPLIED: persistPhoto")
              else:
                  print("CHECKED: persistPhoto")

          else:
              print("WARNING: persistPhoto not found")


          # ==========================================================
          # PaymentDialog
          # ==========================================================

          old_payment = 'PaymentDialog(store,id,null,""){payment=false}'
          new_payment = 'PaymentDialog(store,id,null,null){payment=false}'

          if old_payment in source:

              source = source.replace(
                  old_payment,
                  new_payment,
                  1
              )

              print("FIX APPLIED: PaymentDialog")

          elif new_payment in source:

              print("ALREADY OK: PaymentDialog")


          # ==========================================================
          # BottomBar Icon
          # ==========================================================

          old_icon = (
              "Icon(ic,null,"
              "tint=if(current==k)Green else Color.Gray,"
              "Modifier.size(22.dp))"
          )

          new_icon = (
              "Icon("
              "imageVector=ic,"
              "contentDescription=null,"
              "modifier=Modifier.size(22.dp),"
              "tint=if(current==k)Green else Color.Gray"
              ")"
          )

          if old_icon in source:

              source = source.replace(
                  old_icon,
                  new_icon,
                  1
              )

              print("FIX APPLIED: BottomBar Icon")


          # ==========================================================
          # TopBar Image
          # ==========================================================

          old_top = (
              "Image("
              "painterResource(R.drawable.majdoor_logo_small),"
              "null,"
              "Modifier.size(42.dp).clip(RoundedCornerShape(10.dp)),"
              "contentScale=ContentScale.Crop"
              ")"
          )

          new_top = (
              "Image("
              "painter=painterResource(R.drawable.majdoor_logo_small),"
              "contentDescription=null,"
              "modifier=Modifier.size(42.dp).clip(RoundedCornerShape(10.dp)),"
              "contentScale=ContentScale.Crop"
              ")"
          )

          if old_top in source:

              source = source.replace(
                  old_top,
                  new_top,
                  1
              )

              print("FIX APPLIED: TopBar Image")


          # ==========================================================
          # Dashboard Image
          # ==========================================================

          old_dashboard = (
              "Image("
              "painterResource(R.drawable.majdoor_logo),"
              "null,"
              "Modifier.fillMaxWidth().height(135.dp).clip(RoundedCornerShape(24.dp)),"
              "ContentScale.Fit"
              ")"
          )

          new_dashboard = (
              "Image("
              "painter=painterResource(R.drawable.majdoor_logo),"
              "contentDescription=null,"
              "modifier=Modifier.fillMaxWidth().height(135.dp).clip(RoundedCornerShape(24.dp)),"
              "contentScale=ContentScale.Fit"
              ")"
          )

          if old_dashboard in source:

              source = source.replace(
                  old_dashboard,
                  new_dashboard,
                  1
              )

              print("FIX APPLIED: Dashboard Image")


          # ==========================================================
          # Write after normal repairs
          # ==========================================================

          path.write_text(
              source,
              encoding="utf-8"
          )

          print("")
          print("NORMAL KOTLIN REPAIRS WRITTEN")
          PY


      # ============================================================
      # 13. REMOVE ONLY EXTRA TRAILING KOTLIN BRACES
      # ============================================================

      - name: Repair Extra Kotlin Closing Braces
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "CHECK EXTRA KOTLIN CLOSING BRACES"
          echo "=============================================="

          python3 - "$MAIN_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()

          balance = 0

          in_string = False
          in_char = False
          escape = False
          line_comment = False
          block_comment = False

          brace_tokens = []

          for line_no, line in enumerate(lines, 1):

              i = 0

              while i < len(line):

                  c = line[i]
                  n = line[i + 1] if i + 1 < len(line) else ""

                  if line_comment:
                      break

                  if block_comment:

                      if c == "*" and n == "/":
                          block_comment = False
                          i += 2
                          continue

                      i += 1
                      continue

                  if in_string:

                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == '"':
                          in_string = False

                      i += 1
                      continue

                  if in_char:

                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == "'":
                          in_char = False

                      i += 1
                      continue

                  if c == "/" and n == "/":
                      line_comment = True
                      break

                  if c == "/" and n == "*":
                      block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      balance += 1
                      brace_tokens.append((line_no, "{"))

                  elif c == "}":

                      balance -= 1
                      brace_tokens.append((line_no, "}"))

                      if balance < 0:
                          print(
                              "EXTRA CLOSING BRACE DETECTED AT LINE",
                              line_no
                          )

                  i += 1

              line_comment = False


          print("")
          print("FINAL BRACE BALANCE:", balance)

          if balance > 0:
              print("")
              print(
                  "ERROR: Missing closing brace(s). "
                  "No automatic deletion performed."
              )
              sys.exit(1)


          if balance == 0:
              print("")
              print("KOTLIN BRACE BALANCE OK.")
              sys.exit(0)


          excess = -balance

          indexes = []

          for idx in range(len(lines) - 1, -1, -1):

              stripped = lines[idx].strip()

              if stripped == "}":
                  indexes.append(idx)

                  if len(indexes) == excess:
                      break

          if len(indexes) != excess:

              print("")
              print(
                  "ERROR: Extra closing braces exist, but they are "
                  "not safely removable trailing brace-only lines."
              )

              sys.exit(1)


          for idx in indexes:
              print(
                  "REMOVING EXTRA CLOSING BRACE AT LINE",
                  idx + 1
              )

          for idx in sorted(indexes, reverse=True):
              del lines[idx]


          path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("")
          print(
              "FIX APPLIED:",
              excess,
              "extra trailing closing brace(s) removed."
          )
          PY


      # ============================================================
      # 14. KOTLIN SOURCE FINAL STRUCTURE CHECK
      # ============================================================

      - name: Verify Kotlin Source Structure
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY KOTLIN SOURCE STRUCTURE"
          echo "=============================================="

          test -f "$MAIN_FILE"

          echo ""
          echo "MAIN FILE:"
          echo "$MAIN_FILE"

          echo ""
          echo "LAST 25 LINES:"
          tail -25 "$MAIN_FILE"

          echo ""
          echo "IMPORTANT DECLARATIONS:"

          grep -n \
            "import androidx.activity.compose.setContent" \
            "$MAIN_FILE" \
            | head -3 || true

          grep -n \
            "private class Store" \
            "$MAIN_FILE" \
            | head -3 || true

          grep -n \
            "fun persistPhoto" \
            "$MAIN_FILE" \
            | head -3 || true

          echo ""
          echo "SOURCE STRUCTURE CHECK PASSED."


      # ============================================================
      # 15. FINAL RELEASE IDENTITY
      # ============================================================

      - name: Set Final Release Identity
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "SET FINAL RELEASE IDENTITY"
          echo "=============================================="

          if [ -f "app/build.gradle.kts" ]; then

            GRADLE_FILE="app/build.gradle.kts"

            sed -i \
              's/applicationId = "[^"]*"/applicationId = "com.majdoor.hisaab"/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionCode = [0-9][0-9]*/versionCode = 77/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionName = "[^"]*"/versionName = "1.77.0"/' \
              "$GRADLE_FILE"

          elif [ -f "app/build.gradle" ]; then

            GRADLE_FILE="app/build.gradle"

            sed -i \
              's/applicationId[[:space:]]*["'"'"'][^"'"'"']*["'"'"']/applicationId "com.majdoor.hisaab"/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionCode[[:space:]]*[0-9][0-9]*/versionCode 77/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionName[[:space:]]*["'"'"'][^"'"'"']*["'"'"']/versionName "1.77.0"/' \
              "$GRADLE_FILE"

          else

            echo "ERROR: app Gradle file not found."
            exit 1

          fi

          echo ""
          echo "FINAL APPLICATION ID:"
          grep "applicationId" "$GRADLE_FILE"

          echo ""
          echo "FINAL VERSION CODE:"
          grep "versionCode" "$GRADLE_FILE"

          echo ""
          echo "FINAL VERSION NAME:"
          grep "versionName" "$GRADLE_FILE"


      # ============================================================
      # 16. COMPILE RELEASE KOTLIN
      #
      # IMPORTANT:
      # STEP 1 TO STEP 15 ARE LEFT UNCHANGED.
      #
      # FIRST COMPILATION:
      # NO SOURCE CHANGE.
      #
      # ONLY IF THE EXACT NESTED PRIVATE-FUNCTION PROBLEM EXISTS,
      # A TARGETED CLOSING BRACE IS INSERTED.
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -uo pipefail

          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN"
          echo "=============================================="

          test -f "$MAIN_FILE"

          echo ""
          echo "MAIN FILE:"
          echo "$MAIN_FILE"

          echo ""
          echo "=============================================="
          echo "FIRST COMPILATION - NO SOURCE CHANGE"
          echo "=============================================="

          set +e

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --rerun-tasks \
            :app:compileReleaseKotlin \
            2>&1 | tee "$RUNNER_TEMP/kotlin-first-build.log"

          FIRST_STATUS=${PIPESTATUS[0]}

          set -e

          if [ "$FIRST_STATUS" -eq 0 ]; then

            echo ""
            echo "=============================================="
            echo "COMPILE RELEASE KOTLIN PASSED"
            echo "=============================================="

            exit 0
          fi


          echo ""
          echo "=============================================="
          echo "FIRST KOTLIN COMPILATION FAILED"
          echo "=============================================="

          echo ""
          echo "IMPORTANT KOTLIN ERRORS:"

          grep -E \
            "Unresolved reference|Modifier 'private'|Expecting|Syntax error|MainActivity.kt:" \
            "$RUNNER_TEMP/kotlin-first-build.log" \
            | tail -100 \
            || true


          # ========================================================
          # DIAGNOSE ONLY AFTER FIRST COMPILATION FAILURE
          # ========================================================

          echo ""
          echo "=============================================="
          echo "DIAGNOSING KOTLIN FUNCTION STRUCTURE"
          echo "=============================================="

          python3 - "$MAIN_FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          print("SOURCE:", path)
          print("SOURCE SIZE:", len(source), "bytes")


          # ========================================================
          # Find function declarations
          # ========================================================

          function_pattern = re.compile(
              r"(?m)^[ \t]*"
              r"(?:(?:private|public|internal|protected)[ \t]+)?"
              r"(?:suspend[ \t]+)?"
              r"fun[ \t]+"
              r"([A-Za-z_][A-Za-z0-9_]*)"
              r"[ \t]*\("
          )

          functions = list(
              function_pattern.finditer(source)
          )

          print("")
          print(
              "FUNCTION DECLARATIONS FOUND:",
              len(functions)
          )


          # ========================================================
          # Calculate brace depth before a position
          # ========================================================

          def brace_depth_before(text, position):

              depth = 0

              in_string = False
              in_char = False
              escape = False
              line_comment = False
              block_comment = False

              i = 0

              while i < position:

                  c = text[i]
                  n = (
                      text[i + 1]
                      if i + 1 < position
                      else ""
                  )

                  if line_comment:

                      if c == "\n":
                          line_comment = False

                      i += 1
                      continue

                  if block_comment:

                      if c == "*" and n == "/":
                          block_comment = False
                          i += 2
                          continue

                      i += 1
                      continue

                  if in_string:

                      if escape:
                          escape = False

                      elif c == "\\":
                          escape = True

                      elif c == '"':
                          in_string = False

                      i += 1
                      continue

                  if in_char:

                      if escape:
                          escape = False

                      elif c == "\\":
                          escape = True

                      elif c == "'":
                          in_char = False

                      i += 1
                      continue

                  if c == "/" and n == "/":
                      line_comment = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                  i += 1

              return depth


          # ========================================================
          # Print function structure
          # ========================================================

          print("")
          print("FUNCTION STRUCTURE:")

          for match in functions:

              name = match.group(1)

              line = (
                  source.count(
                      "\n",
                      0,
                      match.start()
                  )
                  + 1
              )

              depth = brace_depth_before(
                  source,
                  match.start()
              )

              print(
                  f"LINE {line:4d} | "
                  f"DEPTH {depth:3d} | "
                  f"{name}"
              )


          # ========================================================
          # Locate SmallAction
          # ========================================================

          small = re.search(
              r"(?m)^[ \t]*"
              r"(?:(?:private|public|internal|protected)[ \t]+)?"
              r"(?:suspend[ \t]+)?"
              r"fun[ \t]+SmallAction[ \t]*\(",
              source
          )

          if small:

              line = (
                  source.count(
                      "\n",
                      0,
                      small.start()
                  )
                  + 1
              )

              print("")
              print("SmallAction FOUND")
              print("SmallAction line:", line)

              start_line = max(
                  1,
                  line - 25
              )

              end_line = line + 70

              lines = source.splitlines()

              print("")
              print("==============================================")
              print("SOURCE AROUND SmallAction")
              print("==============================================")

              for no in range(
                  start_line,
                  min(
                      end_line,
                      len(lines)
                  ) + 1
              ):
                  print(
                      f"{no:5d}: {lines[no - 1]}"
                  )

          else:

              print("")
              print("SmallAction declaration NOT FOUND.")


          # ========================================================
          # Find nested private functions
          # ========================================================

          nested_private = []

          for match in functions:

              name = match.group(1)

              line = (
                  source.count(
                      "\n",
                      0,
                      match.start()
                  )
                  + 1
              )

              depth = brace_depth_before(
                  source,
                  match.start()
              )

              line_start = (
                  source.rfind(
                      "\n",
                      0,
                      match.start()
                  )
                  + 1
              )

              line_end = source.find(
                  "\n",
                  match.start()
              )

              if line_end == -1:
                  line_end = len(source)

              declaration = source[
                  line_start:line_end
              ].strip()

              if (
                  declaration.startswith(
                      "private fun"
                  )
                  and depth >= 2
              ):

                  nested_private.append(
                      (
                          line,
                          match.start(),
                          name,
                          declaration,
                          depth
                      )
                  )


          print("")
          print(
              "NESTED PRIVATE FUNCTIONS:",
              len(nested_private)
          )

          for item in nested_private:

              print(
                  "LINE",
                  item[0],
                  "|",
                  item[3],
                  "| DEPTH",
                  item[4]
              )


          # ========================================================
          # Target only the exact problem.
          #
          # If exactly ONE private function is nested inside another
          # function, close the parent function before it.
          # ========================================================

          if len(nested_private) != 1:

              print("")
              print(
                  "ERROR: Expected exactly one nested "
                  "private function, found:",
                  len(nested_private)
              )

              print(
                  "NO AUTOMATIC SOURCE CHANGE MADE."
              )

              sys.exit(20)


          line, pos, name, declaration, depth = \
              nested_private[0]


          # ========================================================
          # Only perform this repair when compiler log actually
          # contains the private-local-function error.
          # ========================================================

          compiler_log = Path(
              sys.argv[0]
          )

          print("")
          print(
              "TARGET FUNCTION:",
              declaration
          )

          print(
              "TARGET LINE:",
              line
          )

          print(
              "TARGET DEPTH:",
              depth
          )


          # ========================================================
          # Insert ONE closing brace immediately before the nested
          # private function.
          # ========================================================

          source = (
              source[:pos]
              + "}\n"
              + source[pos:]
          )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print("")
          print(
              "TARGETED KOTLIN STRUCTURE FIX APPLIED."
          )

          print(
              "INSERTED ONE CLOSING BRACE BEFORE:",
              declaration
          )

          PY


          # ========================================================
          # SECOND COMPILATION
          # ========================================================

          echo ""
          echo "=============================================="
          echo "SECOND KOTLIN COMPILATION"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --rerun-tasks \
            :app:compileReleaseKotlin

          echo ""
          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN PASSED"
          echo "=============================================="


      # ============================================================
      # 17. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ASSEMBLE RELEASE APK"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --rerun-tasks \
            :app:assembleRelease

          echo ""
          echo "=============================================="
          echo "ASSEMBLE RELEASE APK PASSED"
          echo "=============================================="


      # ============================================================
      # 18. LOCATE RELEASE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE RELEASE APK"
          echo "=============================================="

          APK=$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*release*.apk" \
              -print \
              | sort \
              | head -1
          )

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then

            echo ""
            echo "ERROR: Release APK not found."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null \
              || true

            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "RELEASE APK:"
          ls -lh "$APK"


      # ============================================================
      # 19. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK Package
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY APK PACKAGE"
          echo "=============================================="

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging \
              "$APK_PATH"
          )

          echo "$BADGING" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          if ! echo "$BADGING" | grep -q \
            "name='$PACKAGE_NAME'"; then

            echo "ERROR: Package name mismatch."
            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionCode='$VERSION_CODE'"; then

            echo "ERROR: Version code mismatch."
            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionName='$VERSION_NAME'"; then

            echo "ERROR: Version name mismatch."
            exit 1
          fi

          echo ""
          echo "PACKAGE AND VERSION VERIFIED."


      # ============================================================
      # 20. PREPARE RELEASE SIGNING
      # ============================================================

      - name: Prepare Release Signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -e

          echo "=============================================="
          echo "PREPARE RELEASE SIGNING"
          echo "=============================================="

          KEYSTORE_FILE="$RUNNER_TEMP/majdoor-hisaab-release.jks"

          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            echo "PERMANENT SIGNING SECRETS FOUND."

            printf '%s' "$KEYSTORE_BASE64" \
              | base64 --decode \
              > "$KEYSTORE_FILE"

            test -s "$KEYSTORE_FILE"

            keytool \
              -list \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              >/dev/null

            echo "RELEASE_SIGNING_MODE=PERMANENT" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          else

            echo "Permanent signing secrets not configured."
            echo "Creating temporary JKS."

            TEMP_PASSWORD="$(openssl rand -hex 32)"
            TEMP_ALIAS="majdoor-hisaab-v82"

            rm -f "$KEYSTORE_FILE"

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -storepass "$TEMP_PASSWORD" \
              -keypass "$TEMP_PASSWORD" \
              -alias "$TEMP_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=Majdoor Hisaab PRO, OU=Android, O=Majdoor Hisaab, L=India, ST=Uttar Pradesh, C=IN"

            test -s "$KEYSTORE_FILE"

            keytool \
              -list \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -storepass "$TEMP_PASSWORD" \
              -alias "$TEMP_ALIAS" \
              >/dev/null

            echo "RELEASE_SIGNING_MODE=TEMPORARY" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$TEMP_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"

          fi

          echo ""
          echo "RELEASE SIGNING PREPARED."


      # ============================================================
      # 21. VERIFY SIGNING
      # ============================================================

      - name: Verify Signing Environment
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY SIGNING ENVIRONMENT"
          echo "=============================================="

          test -n "${RELEASE_KEYSTORE:-}"
          test -f "$RELEASE_KEYSTORE"

          test -n "${RELEASE_KEYSTORE_PASSWORD:-}"
          test -n "${RELEASE_KEY_ALIAS:-}"
          test -n "${RELEASE_KEY_PASSWORD:-}"

          keytool \
            -list \
            -keystore "$RELEASE_KEYSTORE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            >/dev/null

          echo ""
          echo "SIGNING ENVIRONMENT VERIFIED."
          echo "SIGNING MODE: ${RELEASE_SIGNING_MODE}"


      # ============================================================
      # 22. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ZIPALIGN RELEASE APK"
          echo "=============================================="

          INPUT_APK="$APK_PATH"
          ALIGNED_APK="$RUNNER_TEMP/$APK_UNSIGNED_NAME"

          rm -f "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          test -f "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c \
            -v \
            4 \
            "$ALIGNED_APK"

          echo "ALIGNED_APK=$ALIGNED_APK" >> "$GITHUB_ENV"

          echo ""
          echo "ZIPALIGN PASSED."


      # ============================================================
      # 23. SIGN APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "SIGN RELEASE APK"
          echo "=============================================="

          SIGNED_APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          rm -f "$SIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RELEASE_KEYSTORE" \
            --ks-type JKS \
            --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass "pass:$RELEASE_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          test -f "$SIGNED_APK"

          echo ""
          echo "SIGNED APK CREATED:"
          ls -lh "$SIGNED_APK"


      # ============================================================
      # 24. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY APK SIGNATURE"
          echo "=============================================="

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          test -f "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE VERIFIED."


      # ============================================================
      # 25. FINAL APK VALIDATION
      # ============================================================

      - name: Final APK Validation
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FINAL APK VALIDATION"
          echo "=============================================="

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")

          echo ""
          echo "APK SIZE:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK size unexpectedly small."
            exit 1
          fi

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging \
              "$APK"
          )

          echo ""
          echo "APK INFORMATION:"

          echo "$BADGING" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          if ! echo "$BADGING" | grep -q \
            "name='$PACKAGE_NAME'"; then
            echo "ERROR: Final APK package mismatch."
            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionCode='$VERSION_CODE'"; then
            echo "ERROR: Final APK version code mismatch."
            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionName='$VERSION_NAME'"; then
            echo "ERROR: Final APK version name mismatch."
            exit 1
          fi

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "=============================================="
          echo "FINAL APK VALIDATION PASSED"
          echo "=============================================="


      # ============================================================
      # 26. UPLOAD FINAL SIGNED APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: ${{ env.APK_SIGNED_NAME }}
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 27. UPLOAD BUILD REPORTS
      # ============================================================

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/**
          if-no-files-found: warn
          retention-days: 14
