name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_CODE: "82"
  VERSION_NAME: "1.82.0"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

jobs:

  build-release:

    name: Build, Sign and Verify Release APK

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # 4. LOCATE ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && \
               [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -n "${ANDROID_HOME:-}" ] && \
               [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"

          else
            SDKMANAGER_FOUND="$(command -v sdkmanager || true)"

            if [ -z "$SDKMANAGER_FOUND" ]; then
              echo "::error::Android SDK not found."
              exit 1
            fi

            SDK_ROOT="$(
              dirname \
              "$(dirname \
              "$(dirname \
              "$(readlink -f "$SDKMANAGER_FOUND")")")"
            )"
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT"

          test -d "$SDK_ROOT"


      # ============================================================
      # 5. SDKMANAGER
      # ============================================================

      - name: Locate sdkmanager
        shell: bash
        run: |
          set -e

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(
              find "$ANDROID_SDK_ROOT/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -print \
                -quit \
                2>/dev/null || true
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version


      # ============================================================
      # 6. ANDROID LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Android SDK licenses accepted."


      # ============================================================
      # 7. ANDROID API 36 + BUILD TOOLS
      # ============================================================

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}"
          test -d "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          echo "Android API ${ANDROID_API} installed."
          echo "Build Tools ${BUILD_TOOLS} installed."


      # ============================================================
      # 8. VERIFY BUILD TOOLS
      # ============================================================

      - name: Verify Android build tools
        shell: bash
        run: |
          set -e

          AAPT2="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          test -x "$AAPT2"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          echo "AAPT2:"
          "$AAPT2" version

          echo
          echo "APKSIGNER:"
          "$APKSIGNER" --version

          echo
          echo "ZIPALIGN:"
          ls -lh "$ZIPALIGN"

          echo
          echo "Android build tools verification PASSED."


      # ============================================================
      # 9. JAVA
      # ============================================================

      - name: Verify Java
        shell: bash
        run: |
          set -e

          java -version

          echo "JAVA_HOME=$JAVA_HOME"


      # ============================================================
      # 10. GRADLE
      # ============================================================

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          gradle --version


      # ============================================================
      # 11. SHOW REPOSITORY
      # ============================================================

      - name: Show repository files
        shell: bash
        run: |
          set -e

          pwd

          echo
          echo "Repository files:"

          find . \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -300


      # ============================================================
      # 12. FIND MAJDOOR HISAAB ZIP
      # ============================================================

      - name: Locate Majdoor Hisaab ZIP
        shell: bash
        run: |
          set -e

          ZIP_PATH="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "Majdoor_Hisaab_PRO*.zip" \
              -print \
              | head -n 1
          )"

          if [ -z "$ZIP_PATH" ]; then
            echo "::error::Majdoor Hisaab PRO ZIP not found."

            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print || true

            exit 1
          fi

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

          echo "FOUND:"
          echo "$ZIP_PATH"


      # ============================================================
      # 13. PREPARE BUILD DIRECTORY
      # ============================================================

      - name: Prepare temporary build directory
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/majdoor-build"

          mkdir -p "$RUNNER_TEMP/majdoor-build"

          echo "BUILD_ROOT=$RUNNER_TEMP/majdoor-build" >> "$GITHUB_ENV"


      # ============================================================
      # 14. EXTRACT PROJECT ZIP
      # ============================================================

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          unzip -q "$ZIP_PATH" \
            -d "$BUILD_ROOT"

          echo "ZIP extraction completed."

          find "$BUILD_ROOT" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -500


      # ============================================================
      # 15. FIND GRADLE PROJECT ROOT
      # ============================================================

      - name: Locate Gradle project root
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(
            find "$BUILD_ROOT" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print \
              | head -n 1
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo
          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"


      # ============================================================
      # 16. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_ROOT/settings.gradle.kts" \
            || test -f "$PROJECT_ROOT/settings.gradle"

          test -f "$PROJECT_ROOT/build.gradle.kts" \
            || test -f "$PROJECT_ROOT/build.gradle"

          test -f "$PROJECT_ROOT/app/build.gradle.kts" \
            || test -f "$PROJECT_ROOT/app/build.gradle"

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          test -f "$MAIN"

          echo "Android project structure PASSED."


      # ============================================================
      # 17. FIX MAINACTIVITY KOTLIN SOURCE
      # ============================================================

      - name: Fix MainActivity Kotlin source
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          if [ ! -f "$MAIN" ]; then
            echo "::error::MainActivity.kt not found."
            exit 1
          fi

          python3 - "$MAIN" <<'PY'
          import sys
          from pathlib import Path

          main = Path(sys.argv[1])

          text = main.read_text(encoding="utf-8")

          print("MainActivity:", main)
          print("Original lines:", len(text.splitlines()))

          # ========================================================
          # FIX 1
          #
          # This import is invalid:
          #
          # import androidx.compose.foundation.lazy.item
          #
          # LazyColumn's item{} is available through LazyListScope.
          # No standalone import is required.
          # ========================================================

          bad_import = "import androidx.compose.foundation.lazy.item\n"

          if bad_import in text:
              text = text.replace(bad_import, "")
              print("FIXED: Removed invalid lazy.item import.")
          else:
              print("OK: Invalid lazy.item import not present.")

          # Also remove CRLF variant if present.
          text = text.replace(
              "import androidx.compose.foundation.lazy.item\r\n",
              ""
          )

          # ========================================================
          # FIX 2
          #
          # Make sure the correct items import exists.
          # ========================================================

          required_import = "import androidx.compose.foundation.lazy.items"

          if required_import not in text:
              raise SystemExit(
                  "ERROR: Correct androidx.compose.foundation.lazy.items "
                  "import is missing."
              )

          # ========================================================
          # FIX 3
          #
          # Check that MainActivity has the expected top-level
          # functions. We do NOT modify arbitrary braces by line
          # number.
          # ========================================================

          required_symbols = [
              "fun validDate",
              "fun today",
              "fun money",
              "fun displayDate",
              "fun Dashboard",
              "fun DashboardStat",
              "fun DashboardModule",
              "fun Stat",
              "fun LabourScreen",
              "fun FieldScreen",
              "fun CropScreen",
              "fun ExpenseScreen",
              "fun SaleScreen",
              "fun AttendanceScreen",
              "fun FieldDetail",
              "fun LabourDetail",
              "fun PaymentDialog",
              "fun RateDialog",
              "fun CropDetail",
          ]

          for symbol in required_symbols:
              if symbol not in text:
                  raise SystemExit(
                      f"ERROR: Required Kotlin symbol missing: {symbol}"
                  )

          # ========================================================
          # FIX 4
          #
          # Basic lexical brace check.
          #
          # Strings and comments are removed before counting so
          # braces appearing inside UI text do not interfere.
          # ========================================================

          import re

          cleaned = text

          # Remove block comments.
          cleaned = re.sub(
              r"/\*.*?\*/",
              "",
              cleaned,
              flags=re.S
          )

          # Remove line comments.
          cleaned = re.sub(
              r"//.*",
              "",
              cleaned
          )

          # Remove normal Kotlin strings.
          cleaned = re.sub(
              r'"(?:\\.|[^"\\])*"',
              '""',
              cleaned
          )

          # Remove character literals.
          cleaned = re.sub(
              r"'(?:\\.|[^'\\])*'",
              "''",
              cleaned
          )

          brace_open = cleaned.count("{")
          brace_close = cleaned.count("}")

          print("Brace { count:", brace_open)
          print("Brace } count:", brace_close)

          if brace_open != brace_close:
              raise SystemExit(
                  "ERROR: MainActivity Kotlin braces are unbalanced."
              )

          # ========================================================
          # WRITE FIXED SOURCE
          # ========================================================

          main.write_text(
              text,
              encoding="utf-8"
          )

          # ========================================================
          # FINAL CHECK
          # ========================================================

          final_text = main.read_text(encoding="utf-8")

          if "import androidx.compose.foundation.lazy.item" in final_text:
              raise SystemExit(
                  "ERROR: Invalid lazy.item import still exists."
              )

          if (
              "import androidx.compose.foundation.lazy.items"
              not in final_text
          ):
              raise SystemExit(
                  "ERROR: lazy.items import missing after repair."
              )

          print("")
          print("==============================================")
          print("MAINACTIVITY KOTLIN SOURCE FIX PASSED")
          print("==============================================")
          print("Invalid lazy.item import : REMOVED")
          print("lazy.items import        : VERIFIED")
          print("Required symbols         : VERIFIED")
          print("Brace balance            : VERIFIED")
          print("==============================================")
          PY


      # ============================================================
      # 18. SHOW IMPORTANT SOURCE LINES
      # ============================================================

      - name: Show MainActivity source verification
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          echo "=============================================="
          echo "MAINACTIVITY SOURCE CHECK"
          echo "=============================================="

          echo
          echo "Imports:"
          sed -n '1,45p' "$MAIN"

          echo
          echo "Dashboard area:"
          sed -n '225,315p' "$MAIN"

          echo
          echo "MainActivity line count:"
          wc -l "$MAIN"

          echo
          echo "Invalid import search:"
          if grep -n \
            "import androidx.compose.foundation.lazy.item" \
            "$MAIN"; then

            echo "::error::Invalid lazy.item import still found."
            exit 1
          else
            echo "No invalid lazy.item import found."
          fi


      # ============================================================
      # 19. VERIFY KOTLIN SOURCE
      # ============================================================

      - name: Verify Kotlin source
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          grep -q "fun validDate" "$MAIN"
          grep -q "fun today" "$MAIN"
          grep -q "fun money" "$MAIN"
          grep -q "fun displayDate" "$MAIN"
          grep -q "BackHandler" "$MAIN"
          grep -q "PhotoThumb" "$MAIN"
          grep -q "AttendanceScreen" "$MAIN"
          grep -q "DeviceCredentialDeleteGate" "$MAIN"
          grep -q "fun Stat" "$MAIN"
          grep -q "fun DashboardStat" "$MAIN"
          grep -q "fun DashboardModule" "$MAIN"

          if grep -q \
            "import androidx.compose.foundation.lazy.item" \
            "$MAIN"; then
            echo "::error::Invalid lazy.item import found."
            exit 1
          fi

          grep -q \
            "import androidx.compose.foundation.lazy.items" \
            "$MAIN"

          echo "Kotlin source checks PASSED."


      # ============================================================
      # 20. PAYMENT / CROP CHECK
      # ============================================================

      - name: Verify payment and crop cleanup
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          grep -q \
            'payments=payments.filterNot{it.cropId==id}' \
            "$MAIN"

          grep -q \
            'write("payment",payments,::obj)' \
            "$MAIN"

          if grep -q \
            '||field.isBlank()) return@Button' \
            "$MAIN"; then

            echo "::error::Old payment field validation found."
            exit 1
          fi

          echo "Payment/crop checks PASSED."


      # ============================================================
      # 21. PACKAGE / VERSION
      # ============================================================

      - name: Verify package and version
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "Application ID:"
          grep -n "applicationId" "$APP_GRADLE" || true

          echo
          echo "Version Code:"
          grep -n "versionCode" "$APP_GRADLE" || true

          echo
          echo "Version Name:"
          grep -n "versionName" "$APP_GRADLE" || true

          grep -Eq \
            'applicationId[[:space:]]*=[[:space:]]*"com\.majdoor\.hisaabpro"' \
            "$APP_GRADLE"

          grep -Eq \
            'versionCode[[:space:]]*=[[:space:]]*82([[:space:]]|$)' \
            "$APP_GRADLE"

          grep -Eq \
            'versionName[[:space:]]*=[[:space:]]*"1\.82\.0"' \
            "$APP_GRADLE"

          echo
          echo "Package/version verification PASSED."


      # ============================================================
      # 22. CONFIGURE ANDROID SDK
      # ============================================================

      - name: Configure Android SDK for Gradle
        shell: bash
        run: |
          set -e

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" \
            > "$PROJECT_ROOT/local.properties"

          cat "$PROJECT_ROOT/local.properties"


      # ============================================================
      # 23. GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 24. KOTLIN SOURCE DIAGNOSTICS
      # ============================================================

      - name: Print Kotlin source diagnostics
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          echo "=============================================="
          echo "KOTLIN SOURCE DIAGNOSTICS"
          echo "=============================================="

          echo
          echo "MainActivity:"
          wc -l "$MAIN"

          echo
          echo "Kotlin files:"
          find "$PROJECT_ROOT/app/src" \
            -type f \
            \( -name "*.kt" -o -name "*.kts" \) \
            -print

          echo
          echo "Java files:"
          find "$PROJECT_ROOT/app/src" \
            -type f \
            -name "*.java" \
            -print

          echo
          echo "=============================================="


      # ============================================================
      # 25. BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        id: build_release
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set +e

          LOG_FILE="$RUNNER_TEMP/majdoor-kotlin-build.log"

          echo "=============================================="
          echo "BUILD RELEASE APK"
          echo "=============================================="

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}

          echo
          echo "Gradle exit code: $BUILD_EXIT"

          if [ "$BUILD_EXIT" -ne 0 ]; then

            echo
            echo "=============================================="
            echo "KOTLIN COMPILER ERRORS"
            echo "=============================================="

            grep -nE \
              '(^e: |^.*\.kt:[0-9]+:[0-9]+:|Unresolved reference|Type mismatch|None of the following|Overload resolution ambiguity|Cannot infer|Expecting |Compilation error)' \
              "$LOG_FILE" \
              | tail -n 250 || true

            echo
            echo "=============================================="
            echo "LAST 300 BUILD LOG LINES"
            echo "=============================================="

            tail -n 300 "$LOG_FILE"

            echo
            echo "=============================================="
            echo "BUILD FAILED"
            echo "=============================================="

            exit "$BUILD_EXIT"
          fi

          echo
          echo "=============================================="
          echo "RELEASE BUILD PASSED"
          echo "=============================================="


      # ============================================================
      # 26. LOCATE RELEASE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          APK_PATH="$(
            find "$PROJECT_ROOT/app/build/outputs/apk/release" \
              -type f \
              -name "*.apk" \
              -print \
              | head -n 1
          )"

          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo "APK_UNSIGNED_PATH=$APK_PATH" >> "$GITHUB_ENV"

          echo "RELEASE APK:"
          echo "$APK_PATH"


      # ============================================================
      # 27. PREPARE APK
      # ============================================================

      - name: Prepare APK directory
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/apk"

          mkdir -p "$RUNNER_TEMP/apk"

          cp "$APK_UNSIGNED_PATH" \
            "$RUNNER_TEMP/apk/$APK_UNSIGNED_NAME"

          ls -lh "$RUNNER_TEMP/apk"


      # ============================================================
      # 28. GENERATE TEMPORARY SIGNING KEY
      # ============================================================

      - name: Generate temporary signing keystore
        shell: bash
        run: |
          set -e

          KEYSTORE="$RUNNER_TEMP/majdoor-release-key.p12"

          keytool \
            -genkeypair \
            -v \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -alias majdoor_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=Majdoor Hisaab PRO, OU=Release, O=Majdoor Hisaab PRO, L=India, ST=Uttar Pradesh, C=IN"

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=majdoor_release" >> "$GITHUB_ENV"


      # ============================================================
      # 29. ZIPALIGN
      # ============================================================

      - name: Align APK
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            "$RUNNER_TEMP/apk/$APK_UNSIGNED_NAME" \
            "$RUNNER_TEMP/apk/aligned.apk"

          echo "APK alignment completed."


      # ============================================================
      # 30. SIGN RELEASE APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --ks-key-alias "$KEY_ALIAS" \
            --min-sdk-version 23 \
            --max-sdk-version 36 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RUNNER_TEMP/apk/$APK_SIGNED_NAME" \
            "$RUNNER_TEMP/apk/aligned.apk"

          echo "APK SIGNING PASSED."


      # ============================================================
      # 31. VERIFY SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$RUNNER_TEMP/apk/$APK_SIGNED_NAME"

          echo "SIGNATURE VERIFICATION PASSED."


      # ============================================================
      # 32. VERIFY ALIGNMENT
      # ============================================================

      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            "$RUNNER_TEMP/apk/$APK_SIGNED_NAME"

          echo "ALIGNMENT VERIFICATION PASSED."


      # ============================================================
      # 33. VERIFY APK PACKAGE + VERSION
      # ============================================================

      - name: Verify final APK package and version
        shell: bash
        run: |
          set -e

          AAPT2="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"

          APK="$RUNNER_TEMP/apk/$APK_SIGNED_NAME"

          "$AAPT2" dump badging "$APK" \
            > "$RUNNER_TEMP/apk/badging.txt"

          cat "$RUNNER_TEMP/apk/badging.txt"

          grep -q \
            "package: name='${PACKAGE_NAME}'" \
            "$RUNNER_TEMP/apk/badging.txt"

          grep -q \
            "versionCode='${VERSION_CODE}'" \
            "$RUNNER_TEMP/apk/badging.txt"

          grep -q \
            "versionName='${VERSION_NAME}'" \
            "$RUNNER_TEMP/apk/badging.txt"

          echo
          echo "FINAL APK VERIFICATION PASSED."


      # ============================================================
      # 34. BUILD REPORT
      # ============================================================

      - name: Create build report
        shell: bash
        run: |
          set -e

          REPORT="$RUNNER_TEMP/apk/BUILD-REPORT.txt"

          {
            echo "=============================================="
            echo "MAJDOOR HISAAB PRO V82"
            echo "FINAL SIGNED RELEASE BUILD"
            echo "=============================================="
            echo
            echo "Package      : ${PACKAGE_NAME}"
            echo "Version Code : ${VERSION_CODE}"
            echo "Version Name : ${VERSION_NAME}"
            echo "Java         : ${JAVA_VERSION}"
            echo "Gradle       : ${GRADLE_VERSION}"
            echo "Android API  : ${ANDROID_API}"
            echo "Build Tools  : ${BUILD_TOOLS}"
            echo
            echo "APK          : ${APK_SIGNED_NAME}"
            echo
            echo "BUILD SUCCESS"
            echo "=============================================="
          } > "$REPORT"

          cat "$REPORT"


      # ============================================================
      # 35. UPLOAD FINAL SIGNED APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED
          path: |
            ${{ runner.temp }}/apk/${{ env.APK_SIGNED_NAME }}
            ${{ runner.temp }}/apk/BUILD-REPORT.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 36. FINAL SUMMARY
      # ============================================================

      - name: Final build summary
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo "MAJDOOR HISAAB PRO V82"
          echo "FINAL BUILD SUCCESS"
          echo "=============================================="

          ls -lh \
            "$RUNNER_TEMP/apk/$APK_SIGNED_NAME"

          echo
          echo "Artifact:"
          echo "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED"

          echo
          echo "Package:"
          echo "$PACKAGE_NAME"

          echo
          echo "Version:"
          echo "$VERSION_NAME ($VERSION_CODE)"


      # ============================================================
      # 37. CLEANUP
      # ============================================================

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/majdoor-release-key.p12" || true
          rm -f "$RUNNER_TEMP/apk/aligned.apk" || true
          rm -f "$RUNNER_TEMP/apk/$APK_UNSIGNED_NAME" || true

          echo "Temporary signing material cleaned."
