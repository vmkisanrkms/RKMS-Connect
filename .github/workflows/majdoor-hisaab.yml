      # ============================================================
      # 18. COMPILE RELEASE KOTLIN
      #
      # ONLY THIS SECTION IS CHANGED FOR THE CURRENT FAILURE.
      #
      # It repairs:
      #   1. btn(title=...) -> btn(label=...)
      #   2. positional Boolean / Function<Unit> mismatch
      #
      # It reads the actual btn() declaration first and converts
      # positional arguments to named arguments.
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "PRE-COMPILE btn() PARAMETER AUDIT"
          echo "=============================================="

          python3 <<'PY'
          from pathlib import Path
          import re


          ROOT = Path("app/src/main")


          def matching(text, start, opening="(", closing=")"):
              depth = 0
              quote = None
              triple = False
              escape = False

              i = start

              while i < len(text):

                  if quote:

                      if triple:

                          if text.startswith('"""', i):
                              quote = None
                              triple = False
                              i += 3
                              continue

                      else:

                          if escape:
                              escape = False

                          elif text[i] == '\\':
                              escape = True

                          elif text[i] == quote:
                              quote = None

                      i += 1
                      continue


                  if text.startswith('"""', i):
                      quote = '"'
                      triple = True
                      i += 3
                      continue


                  if text[i] in ('"', "'"):
                      quote = text[i]
                      i += 1
                      continue


                  if text[i] == opening:
                      depth += 1

                  elif text[i] == closing:
                      depth -= 1

                      if depth == 0:
                          return i

                  i += 1

              return None


          def split_args(text):

              result = []
              start = 0

              par = 0
              bracket = 0
              brace = 0

              quote = None
              triple = False
              escape = False

              i = 0

              while i < len(text):

                  if quote:

                      if triple:

                          if text.startswith('"""', i):
                              quote = None
                              triple = False
                              i += 3
                              continue

                      else:

                          if escape:
                              escape = False

                          elif text[i] == '\\':
                              escape = True

                          elif text[i] == quote:
                              quote = None

                      i += 1
                      continue


                  if text.startswith('"""', i):
                      quote = '"'
                      triple = True
                      i += 3
                      continue


                  if text[i] in ('"', "'"):
                      quote = text[i]
                      i += 1
                      continue


                  c = text[i]

                  if c == '(':
                      par += 1

                  elif c == ')':
                      par -= 1

                  elif c == '[':
                      bracket += 1

                  elif c == ']':
                      bracket -= 1

                  elif c == '{':
                      brace += 1

                  elif c == '}':
                      brace -= 1

                  elif (
                      c == ','
                      and par == 0
                      and bracket == 0
                      and brace == 0
                  ):

                      result.append(
                          text[start:i].strip()
                      )

                      start = i + 1

                  i += 1


              tail = text[start:].strip()

              if tail:
                  result.append(tail)

              return result


          def top_level_equals(text):

              par = 0
              bracket = 0
              brace = 0

              quote = None
              triple = False
              escape = False

              i = 0

              while i < len(text):

                  if quote:

                      if triple:

                          if text.startswith('"""', i):
                              quote = None
                              triple = False
                              i += 3
                              continue

                      else:

                          if escape:
                              escape = False

                          elif text[i] == '\\':
                              escape = True

                          elif text[i] == quote:
                              quote = None

                      i += 1
                      continue


                  if text.startswith('"""', i):
                      quote = '"'
                      triple = True
                      i += 3
                      continue


                  if text[i] in ('"', "'"):
                      quote = text[i]
                      i += 1
                      continue


                  c = text[i]

                  if c == '(':
                      par += 1

                  elif c == ')':
                      par -= 1

                  elif c == '[':
                      bracket += 1

                  elif c == ']':
                      bracket -= 1

                  elif c == '{':
                      brace += 1

                  elif c == '}':
                      brace -= 1

                  elif (
                      c == '='
                      and par == 0
                      and bracket == 0
                      and brace == 0
                  ):
                      return i

                  i += 1

              return -1


          # --------------------------------------------------------
          # Find btn declaration
          # --------------------------------------------------------

          declarations = []

          for path in ROOT.rglob("*.kt"):

              text = path.read_text(
                  encoding="utf-8"
              )

              for m in re.finditer(
                  r'\bfun\s+btn\s*\(',
                  text
              ):

                  open_pos = text.find(
                      "(",
                      m.start()
                  )

                  close_pos = matching(
                      text,
                      open_pos
                  )

                  if close_pos is None:
                      continue

                  signature = text[
                      open_pos + 1:
                      close_pos
                  ]

                  params = []

                  for raw in split_args(signature):

                      eq = top_level_equals(raw)

                      left = (
                          raw
                          if eq == -1
                          else raw[:eq]
                      )

                      colon = left.find(":")

                      if colon == -1:
                          continue

                      name = left[:colon].strip()

                      name = re.sub(
                          r'^(public|private|internal|protected|'
                          r'crossinline|noinline|vararg)\s+',
                          '',
                          name
                      ).strip()

                      if re.match(
                          r'^[A-Za-z_][A-Za-z0-9_]*$',
                          name
                      ):
                          params.append(name)

                  if params:
                      declarations.append(
                          (
                              path,
                              params,
                              signature
                          )
                      )


          if not declarations:

              print(
                  "WARNING: btn() declaration not found."
              )

              print(
                  "No positional normalization performed."
              )

          else:

              # Prefer the declaration that has label/onClick.
              selected = None

              for item in declarations:

                  params = item[1]

                  if (
                      "label" in params
                      and "onClick" in params
                  ):
                      selected = item
                      break

              if selected is None:
                  selected = declarations[0]

              declaration_file = selected[0]
              btn_params = selected[1]

              print("")
              print(
                  "btn() declaration:",
                  declaration_file
              )

              print(
                  "btn() parameters:",
                  btn_params
              )


              # ----------------------------------------------------
              # Validate expected parameters
              # ----------------------------------------------------

              if "label" not in btn_params:

                  raise SystemExit(
                      "ERROR: btn() has no label parameter."
                  )

              if "onClick" not in btn_params:

                  raise SystemExit(
                      "ERROR: btn() has no onClick parameter."
                  )


              # ----------------------------------------------------
              # Normalize every btn call.
              # ----------------------------------------------------

              total = 0


              for path in ROOT.rglob("*.kt"):

                  text = path.read_text(
                      encoding="utf-8"
                  )

                  output = []
                  cursor = 0
                  changed_file = False


                  # Find calls from right to left.
                  calls = list(
                      re.finditer(
                          r'\bbtn\s*\(',
                          text
                      )
                  )


                  for match in reversed(calls):

                      pos = match.start()

                      # Do not process declaration:
                      # fun btn(
                      prefix = text[
                          max(0, pos - 10):
                          pos
                      ]

                      if re.search(
                          r'\bfun\s*$',
                          prefix
                      ):
                          continue


                      open_pos = text.find(
                          "(",
                          pos
                      )

                      close_pos = matching(
                          text,
                          open_pos
                      )

                      if close_pos is None:
                          continue


                      content = text[
                          open_pos + 1:
                          close_pos
                      ]


                      args = split_args(
                          content
                      )


                      # Check for trailing lambda:
                      # btn(...) { ... }
                      after = close_pos + 1

                      while (
                          after < len(text)
                          and text[after].isspace()
                      ):
                          after += 1


                      trailing_lambda = None
                      lambda_end = None


                      if (
                          after < len(text)
                          and text[after] == "{"
                      ):

                          lambda_end = matching(
                              text,
                              after,
                              "{",
                              "}"
                          )

                          if lambda_end is not None:

                              trailing_lambda = text[
                                  after:
                                  lambda_end + 1
                              ]


                      # ------------------------------------------------
                      # Convert title -> label.
                      # ------------------------------------------------

                      converted = []

                      for arg in args:

                          eq = top_level_equals(
                              arg
                          )

                          if eq != -1:

                              name = arg[
                                  :eq
                              ].strip()

                              value = arg[
                                  eq + 1:
                              ].strip()

                              if name == "title":
                                  name = "label"

                              converted.append(
                                  (
                                      name,
                                      value
                                  )
                              )

                          else:

                              converted.append(
                                  (
                                      None,
                                      arg.strip()
                                  )
                              )


                      # ------------------------------------------------
                      # If positional args exist, map them according
                      # to ACTUAL btn declaration.
                      # ------------------------------------------------

                      named = []

                      positional = [
                          value
                          for name, value in converted
                          if name is None
                      ]

                      existing_named = {
                          name
                          for name, value in converted
                          if name is not None
                      }


                      # Available declaration parameters.
                      available = [
                          p
                          for p in btn_params
                          if p not in existing_named
                          and p != "onClick"
                      ]


                      # Map positional arguments by declaration order.
                      for value in positional:

                          if not available:
                              break

                          parameter = available.pop(0)

                          named.append(
                              (
                                  parameter,
                                  value
                              )
                          )


                      # Keep already named arguments.
                      for name, value in converted:

                          if name is not None:

                              # If onClick was supplied by a
                              # trailing lambda, trailing lambda wins.
                              if (
                                  name == "onClick"
                                  and trailing_lambda is not None
                              ):
                                  continue

                              named.append(
                                  (
                                      name,
                                      value
                                  )
                              )


                      # Trailing lambda belongs to onClick.
                      if trailing_lambda is not None:

                          named.append(
                              (
                                  "onClick",
                                  trailing_lambda
                              )
                          )


                      # ------------------------------------------------
                      # Remove duplicate parameter names.
                      # ------------------------------------------------

                      final = []
                      seen = set()

                      for name, value in named:

                          if name in seen:
                              continue

                          seen.add(name)

                          final.append(
                              (
                                  name,
                                  value
                              )
                          )


                      # ------------------------------------------------
                      # IMPORTANT:
                      # If original call had positional args and
                      # conversion succeeded, rebuild it completely.
                      # ------------------------------------------------

                      had_positional = any(
                          name is None
                          for name, value in converted
                      )

                      had_title = any(
                          name == "title"
                          for name, value in converted
                      )


                      if (
                          had_positional
                          or had_title
                      ):

                          new_content = ",\n".join(
                              f"    {name} = {value}"
                              for name, value in final
                          )

                          replacement = (
                              "btn(\n"
                              + new_content
                              + "\n)"
                          )


                          # Replace call including trailing lambda.
                          replace_end = (
                              lambda_end + 1
                              if lambda_end is not None
                              else close_pos + 1
                          )


                          text = (
                              text[:pos]
                              + replacement
                              + text[replace_end:]
                          )


                          changed_file = True
                          total += 1


                  if changed_file:

                      path.write_text(
                          text,
                          encoding="utf-8"
                      )

                      print(
                          "NORMALIZED:",
                          path
                      )


              print("")
              print(
                  "TOTAL btn() CALLS NORMALIZED:",
                  total
              )


          # ------------------------------------------------------------
          # Final verification.
          # ------------------------------------------------------------

          errors = []


          for path in ROOT.rglob("*.kt"):

              text = path.read_text(
                  encoding="utf-8"
              )

              # No btn(title=...)
              for m in re.finditer(
                  r'\bbtn\s*\(',
                  text
              ):

                  open_pos = text.find(
                      "(",
                      m.start()
                  )

                  close_pos = matching(
                      text,
                      open_pos
                  )

                  if close_pos is None:
                      continue

                  content = text[
                      open_pos + 1:
                      close_pos
                  ]

                  if re.search(
                      r'(?<![A-Za-z0-9_])title\s*=',
                      content
                  ):

                      errors.append(
                          f"{path}: btn(title=...)"
                      )


          if errors:

              print("")
              print(
                  "\n".join(errors)
              )

              raise SystemExit(
                  "ERROR: btn() normalization failed."
              )


          print("")
          print(
              "=============================================="
          )

          print(
              "btn() PARAMETER AUDIT PASSED"
          )

          print(
              "Boolean / Function<Unit> mismatch protection PASSED"
          )

          print(
              "title / label protection PASSED"
          )

          print(
              "=============================================="
          )
          PY


          echo ""
          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --rerun-tasks \
            :app:compileReleaseKotlin

          echo ""
          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN PASSED"
          echo "=============================================="


      # ============================================================
      # 19. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ASSEMBLE RELEASE APK"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --rerun-tasks \
            :app:assembleRelease

          echo ""
          echo "=============================================="
          echo "ASSEMBLE RELEASE APK PASSED"
          echo "=============================================="


      # ============================================================
      # 20. LOCATE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE RELEASE APK"
          echo "=============================================="

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*release*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: Release APK not found."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "RELEASE APK:"
          ls -lh "$APK"


      # ============================================================
      # 21. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK Package
        shell: bash
        run: |
          set -e

          APK="$APK_PATH"

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging "$APK"
          )

          echo "$BADGING" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          if ! echo "$BADGING" | grep -q \
            "name='$PACKAGE_NAME'"; then

            echo ""
            echo "ERROR: Package name mismatch."
            echo "Expected: $PACKAGE_NAME"

            exit 1
          fi

          echo ""
          echo "PACKAGE NAME VERIFIED."


      # ============================================================
      # 22. PREPARE SIGNING
      # ============================================================

      - name: Prepare Release Signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "=============================================="
          echo "PREPARE RELEASE SIGNING"
          echo "=============================================="

          KEYSTORE_FILE="$RUNNER_TEMP/majdoor-hisaab-release.jks"

          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            echo ""
            echo "PERMANENT SIGNING SECRETS FOUND."

            echo "$KEYSTORE_BASE64" \
              | base64 --decode \
              > "$KEYSTORE_FILE"

            test -s "$KEYSTORE_FILE"

            keytool \
              -list \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              >/dev/null

            echo "RELEASE_SIGNING_MODE=PERMANENT" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

            echo "PERMANENT KEYSTORE VERIFIED."

          else

            echo ""
            echo "Permanent signing secrets not configured."
            echo "Creating temporary JKS."

            TEMP_PASSWORD="$(openssl rand -hex 32)"
            TEMP_ALIAS="majdoor-hisaab-v82"

            rm -f "$KEYSTORE_FILE"

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -storepass "$TEMP_PASSWORD" \
              -keypass "$TEMP_PASSWORD" \
              -alias "$TEMP_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=Majdoor Hisaab PRO, OU=Android, O=Majdoor Hisaab, L=India, ST=Uttar Pradesh, C=IN"

            test -s "$KEYSTORE_FILE"

            keytool \
              -list \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -storepass "$TEMP_PASSWORD" \
              -alias "$TEMP_ALIAS" \
              >/dev/null

            echo "RELEASE_SIGNING_MODE=TEMPORARY" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$TEMP_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"

            echo "TEMPORARY KEYSTORE VERIFIED."

          fi


      # ============================================================
      # 23. VERIFY SIGNING
      # ============================================================

      - name: Verify Signing Environment
        shell: bash
        run: |
          set -e

          test -n "${RELEASE_KEYSTORE:-}"
          test -f "$RELEASE_KEYSTORE"

          test -n "${RELEASE_KEYSTORE_PASSWORD:-}"
          test -n "${RELEASE_KEY_ALIAS:-}"
          test -n "${RELEASE_KEY_PASSWORD:-}"

          keytool \
            -list \
            -keystore "$RELEASE_KEYSTORE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            >/dev/null

          echo ""
          echo "SIGNING ENVIRONMENT VERIFIED."
          echo "SIGNING MODE: ${RELEASE_SIGNING_MODE}"


      # ============================================================
      # 24. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -e

          INPUT_APK="$APK_PATH"
          ALIGNED_APK="$RUNNER_TEMP/$APK_UNSIGNED_NAME"

          rm -f "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          test -f "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c \
            -v \
            4 \
            "$ALIGNED_APK"

          echo "ALIGNED_APK=$ALIGNED_APK" >> "$GITHUB_ENV"

          echo ""
          echo "ZIPALIGN PASSED."


      # ============================================================
      # 25. SIGN APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "SIGN RELEASE APK"
          echo "=============================================="

          SIGNED_APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          rm -f "$SIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RELEASE_KEYSTORE" \
            --ks-type JKS \
            --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass "pass:$RELEASE_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          test -f "$SIGNED_APK"

          echo ""
          echo "SIGNED APK CREATED:"
          ls -lh "$SIGNED_APK"


      # ============================================================
      # 26. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          test -f "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE VERIFIED."


      # ============================================================
      # 27. FINAL APK VALIDATION
      # ============================================================

      - name: Final APK Validation
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FINAL APK VALIDATION"
          echo "=============================================="

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")

          echo ""
          echo "APK SIZE:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo ""
            echo "ERROR: APK size unexpectedly small."
            exit 1
          fi

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging "$APK"
          )

          echo ""
          echo "APK INFORMATION:"

          echo "$BADGING" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          if ! echo "$BADGING" | grep -q \
            "name='$PACKAGE_NAME'"; then

            echo ""
            echo "ERROR: Final APK package mismatch."
            exit 1
          fi

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "=============================================="
          echo "FINAL APK VALIDATION PASSED"
          echo "=============================================="


      # ============================================================
