        ):Button{

            return Button(this).apply{

                text=if(hasRecords){
                    "$label\\n•"
                }else{
                    label
                }

                textSize=12f

                setPadding(
                    0,
                    2,
                    0,
                    2
                )

                isAllCaps=false

                if(selected){
                    setTypeface(null,1)
                }

