name: Majdoor Hisaab PRO - Stable Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104.zip"

jobs:

  build-release-apk:

    name: Build and Sign Release APK

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. BUILD INFORMATION
      # ==========================================================

      - name: Show build configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MAJDOOR HISAAB PRO"
          echo "STABLE RELEASE APK BUILD"
          echo "=========================================="

          echo "Java        : ${JAVA_VERSION}"
          echo "Gradle      : ${GRADLE_VERSION}"
          echo "Android API : ${ANDROID_API}"
          echo "Build Tools : ${BUILD_TOOLS}"
          echo "Package     : ${PACKAGE_NAME}"
          echo "Version     : ${VERSION_NAME}"
          echo "VersionCode : ${VERSION_CODE}"

          echo "=========================================="


      # ==========================================================
      # 3. PREPARE AND FIND PROJECT
      # ==========================================================

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          rm -rf project
          rm -rf extracted

          mkdir -p project
          mkdir -p extracted

          echo "=========================================="
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "=========================================="

          if [ -f "settings.gradle.kts" ] &&
             [ -f "app/build.gradle.kts" ]; then

            echo "ANDROID_PROJECT_FOUND_IN_REPOSITORY"

            shopt -s dotglob

            cp -a . project/

          else

            echo "ANDROID_PROJECT_NOT_FOUND_AT_ROOT"
            echo "SEARCHING FOR PROJECT ZIP..."

            ZIP_PATH="$(
              find . \
                -type f \
                -name "${ZIP_NAME}" \
                -not -path "./project/*" \
                -not -path "./extracted/*" \
                -print \
                | head -n 1
            )"

            if [ -z "$ZIP_PATH" ]; then

              ZIP_PATH="$(
                find . \
                  -type f \
                  -name "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip" \
                  -not -path "./project/*" \
                  -not -path "./extracted/*" \
                  -print \
                  | head -n 1
              )

            fi

            if [ -z "$ZIP_PATH" ]; then

              ZIP_PATH="$(
                find . \
                  -type f \
                  -iname "Majdoor_Hisaab*.zip" \
                  -not -path "./project/*" \
                  -not -path "./extracted/*" \
                  -print \
                  | head -n 1
              )

            fi

            if [ -z "$ZIP_PATH" ]; then

              echo ""
              echo "=========================================="
              echo "ERROR: MAJDOOR HISAAB PROJECT ZIP NOT FOUND"
              echo "=========================================="
              echo ""

              echo "Expected:"
              echo "${ZIP_NAME}"

              echo ""

              find . \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                -print \
                | head -n 30 || true

              exit 1

            fi

            echo "PROJECT_ZIP_FOUND=${ZIP_PATH}"

            unzip -q "$ZIP_PATH" -d extracted

            echo "ZIP_EXTRACTED=PASS"

            if [ -f "extracted/settings.gradle.kts" ] &&
               [ -f "extracted/app/build.gradle.kts" ]; then

              echo "PROJECT_ROOT=extracted"

              cp -a extracted/. project/

            else

              PROJECT_ROOT_FILE="$(
                find extracted \
                  -type f \
                  -name "settings.gradle.kts" \
                  -print \
                  | head -n 1
              )"

              if [ -z "$PROJECT_ROOT_FILE" ]; then

                echo ""
                echo "=========================================="
                echo "ERROR: settings.gradle.kts NOT FOUND"
                echo "=========================================="

                find extracted \
                  -maxdepth 4 \
                  -type f \
                  | head -n 100

                exit 1

              fi

              PROJECT_ROOT="$(dirname "$PROJECT_ROOT_FILE")"

              echo "PROJECT_ROOT=${PROJECT_ROOT}"

              test -f \
                "$PROJECT_ROOT/app/build.gradle.kts"

              cp -a "$PROJECT_ROOT"/. project/

            fi

          fi

          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml

          echo ""
          echo "=========================================="
          echo "PROJECT_PREPARATION=PASS"
          echo "=========================================="


      # ==========================================================
      # 4. APPLY ONLY PREVIOUSLY FAILED KOTLIN FIXES
      # ==========================================================

      - name: Apply required Kotlin source fixes
        working-directory: project
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"

          test -f "$FILE"

          cp "$FILE" \
            "${FILE}.original-ci"

          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"
          )

          text = file.read_text(encoding="utf-8")

          text = text.replace(
              "app.audit.auditLog()",
              "app.audit.list()"
          )

          text = text.replace(
              "app.audit.clearAuditLog()",
              "app.audit.clear()"
          )

          text = text.replace(
              "getSystemService(ALARM_SERVICE)",
              "getSystemService(Context.ALARM_SERVICE)"
          )

          file.write_text(
              text,
              encoding="utf-8"
          )

          print("SOURCE_FIXES_APPLIED")
          PY

          if grep -Fq \
            "app.audit.auditLog()" \
            "$FILE"; then
            echo "ERROR: old auditLog() reference remains"
            exit 1
          fi

          if grep -Fq \
            "app.audit.clearAuditLog()" \
            "$FILE"; then
            echo "ERROR: old clearAuditLog() reference remains"
            exit 1
          fi

          if grep -Fq \
            "getSystemService(ALARM_SERVICE)" \
            "$FILE"; then
            echo "ERROR: old ALARM_SERVICE reference remains"
            exit 1
          fi

          grep -Fq \
            "app.audit.list()" \
            "$FILE"

          grep -Fq \
            "app.audit.clear()" \
            "$FILE"

          grep -Fq \
            "Context.ALARM_SERVICE" \
            "$FILE"

          echo "SOURCE_FIXES_VERIFICATION=PASS"


      # ==========================================================
      # 5. JAVA 17
      # ==========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 6. ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ==========================================================
      # 7. ANDROID API 36
      # ==========================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "ANDROID_SDK_READY=PASS"


      # ==========================================================
      # 8. GRADLE 8.11.1
      # ==========================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true
          cache-cleanup: never


      # ==========================================================
      # 9. VERIFY TOOLCHAIN
      # ==========================================================

      - name: Verify Java Gradle Android
        shell: bash
        run: |
          set -e

          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          gradle --version

          gradle --version \
            | grep -Fq "Gradle 8.11.1"

          echo ""
          echo "ANDROID SDK:"

          sdkmanager --list_installed \
            | grep -E \
            "platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}"

          echo ""
          echo "TOOLCHAIN_VERIFICATION=PASS"


      # ==========================================================
      # 10. PROJECT CONFIGURATION
      # ==========================================================

      - name: Verify project configuration
        working-directory: project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          grep -Fq \
            'id("com.android.application") version "8.9.1"' \
            build.gradle.kts

          grep -Fq \
            'id("org.jetbrains.kotlin.android") version "2.1.21"' \
            build.gradle.kts

          grep -Fq \
            'compileSdk = 36' \
            app/build.gradle.kts

          grep -Fq \
            'targetSdk = 36' \
            app/build.gradle.kts

          grep -Fq \
            'applicationId = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -Fq \
            'versionCode = 77' \
            app/build.gradle.kts

          grep -Fq \
            'versionName = "1.77.0"' \
            app/build.gradle.kts

          echo "PROJECT_CONFIGURATION=PASS"


      # ==========================================================
      # 11. CLEAN
      # ==========================================================

      - name: Clean previous build
        working-directory: project
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            clean

          echo "CLEAN_BUILD=PASS"


      # ==========================================================
      # 12. BUILD RELEASE APK
      #
      # ONLY THIS STEP IS CHANGED.
      #
      # COMPLETE SOURCE COMPILATION FIX IS APPLIED HERE.
      # ==========================================================

      - name: Build Release APK
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"

          test -f "$FILE"

          echo ""
          echo "=========================================="
          echo "RELEASE SOURCE FINAL AUDIT + FIX"
          echo "=========================================="

          cp "$FILE" "${FILE}.pre-release-fix"

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"
          )

          s = p.read_text(encoding="utf-8")

          # ======================================================
          # 1. FIX ALL WRONG IMPLICIT it.text REFERENCES
          # ======================================================

          replacements = {

              # Crop form
              'it.text="Field: ${fields[i].name}"':
                  'fb.text="Field: ${fields[i].name}"',

              # Production / Revenue crop selectors
              'it.text="Crop: ${crops[i].name}"':
                  'cropBtn.text="Crop: ${crops[i].name}"',

              # Work worker selector
              'it.text="Workers: ${selectedWorkers.distinct().size}"':
                  'workerBtn.text="Workers: ${selectedWorkers.distinct().size}"',

              # Worker selector
              'it.text="Worker: ${workers[i].name}"':
                  'wb.text="Worker: ${workers[i].name}"',

              # Payment method
              'it.text="Method: ${methods[i].name}"':
                  'mb.text="Method: ${methods[i].name}"',

              # Advance
              'it.text="Advance: ${if(advance)"YES" else "NO"}"':
                  'adv.text="Advance: ${if(advance)"YES" else "NO"}"',

              # Expense category
              'it.text="Category: $cat"':
                  'cb.text="Category: $cat"',

              # Expense field
              'it.text="Field: Not linked"':
                  'fb.text="Field: Not linked"',

              'it.text="Field: ${fields[i-1].name}"':
                  'fb.text="Field: ${fields[i-1].name}"',

              # Expense crop
              'it.text="Crop: Not linked"':
                  'crb.text="Crop: Not linked"',

              'it.text="Crop: ${crops[i-1].name}"':
                  'crb.text="Crop: ${crops[i-1].name}"',

              # Report worker
              'it.text="Worker: ${if(i==0)"All" else workers[i-1].name}"':
                  'wb.text="Worker: ${if(i==0)"All" else workers[i-1].name}"',

              # Report field
              'it.text="Field: ${if(i==0)"All" else fields[i-1].name}"':
                  'fb.text="Field: ${if(i==0)"All" else fields[i-1].name}"',

              # Report crop
              'it.text="Crop: ${if(i==0)"All" else crops[i-1].name}"':
                  'cb.text="Crop: ${if(i==0)"All" else crops[i-1].name}"',

              # Attendance field
              'it.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"':
                  'fieldBtn.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"',

              # Attendance status
              'it.text="Status: $status"':
                  'statusBtn.text="Status: $status"',

              # Work-template rate type
              'it.text="Rate type: $rateType"':
                  'rateTypeBtn.text="Rate type: $rateType"',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)


          # ======================================================
          # 2. FIX SPECIFIC SELECTOR REFERENCES
          # ======================================================

          old = '''val fb=btn("Field: ${selectedName(fieldId,fields.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select field").setItems(fields.map{it.name}.toTypedArray()){_,i->fieldId=fields[i].id;it.text="Field: ${fields[i].name}"}.show()}'''

          new = '''val fb=btn("Field: ${selectedName(fieldId,fields.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select field").setItems(fields.map{it.name}.toTypedArray()){_,i->fieldId=fields[i].id;fb.text="Field: ${fields[i].name}"}.show()}'''

          s = s.replace(old, new)


          old = '''val fieldBtn=btn("Field: ${selectedName(fieldId,fields.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select field").setItems(fields.map{it.name}.toTypedArray()){_,i->fieldId=fields[i].id;it.text="Field: ${fields[i].name}"}.show()}'''

          new = '''val fieldBtn=btn("Field: ${selectedName(fieldId,fields.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select field").setItems(fields.map{it.name}.toTypedArray()){_,i->fieldId=fields[i].id;fieldBtn.text="Field: ${fields[i].name}"}.show()}'''

          s = s.replace(old, new)


          old = '''val mb=btn("Method: $method"){val methods=arrayOf("Cash","Bank","UPI");AlertDialog.Builder(this).setTitle("Payment method").setItems(methods){_,i->method=methods[i];it.text="Method: ${methods[i]}"}.show()}'''

          new = '''val mb=btn("Method: $method"){val methods=arrayOf("Cash","Bank","UPI");AlertDialog.Builder(this).setTitle("Payment method").setItems(methods){_,i->method=methods[i];mb.text="Method: ${methods[i]}"}.show()}'''

          s = s.replace(old, new)


          # ======================================================
          # 3. FIX btn() CALLS WITH MISSING action PARAMETER
          # ======================================================

          s = s.replace(
              'val cropBtn=btn("Crop: ${crops.first().name}");',
              'val cropBtn=btn("Crop: ${crops.first().name}"){};'
          )

          s = s.replace(
              'val fieldBtn=btn("Field: ${if(fieldId.isBlank()) "Not linked" else selectedName(fieldId,fields.map{it.id to it.name})}")\n',
              'val fieldBtn=btn("Field: ${if(fieldId.isBlank()) "Not linked" else selectedName(fieldId,fields.map{it.id to it.name})}"){}\n'
          )

          s = s.replace(
              '''val fb=btn("Field: All")
          val cb=btn("Crop: All")
          val wb=btn("Worker: All")
          val db=btn("Date: All")''',
              '''val fb=btn("Field: All"){}
          val cb=btn("Crop: All"){}
          val wb=btn("Worker: All"){}
          val db=btn("Date: All"){}'''
          )

          s = s.replace(
              'val attendanceTimeBtn=btn("Attendance time: %02d:%02d".format(Locale.US,ah.first,ah.second))',
              'val attendanceTimeBtn=btn("Attendance time: %02d:%02d".format(Locale.US,ah.first,ah.second)){}'
          )

          s = s.replace(
              'val paymentTimeBtn=btn("Payment time: %02d:%02d".format(Locale.US,ph.first,ph.second))',
              'val paymentTimeBtn=btn("Payment time: %02d:%02d".format(Locale.US,ph.first,ph.second)){}'
          )

          s = s.replace(
              'val prev=btn("‹ Previous"); val next=btn("Next ›")',
              'val prev=btn("‹ Previous"){}; val next=btn("Next ›"){}'
          )

          s = s.replace(
              'val workerBtn=btn("Worker: All"); val fieldBtn=btn("Field: All"); val statusBtn=btn("Status: All"); val dateBtn=dateField("Date filter","")',
              'val workerBtn=btn("Worker: All"){}; val fieldBtn=btn("Field: All"){}; val statusBtn=btn("Status: All"){}; val dateBtn=dateField("Date filter","")'
          )


          # ======================================================
          # 4. ATTENDANCE CALENDAR
          #
          # renderSummary() was declared after render(), while
          # render() calls renderSummary(). Move the local function
          # before render().
          # ======================================================

          calendar_start = s.find(
              'internal fun MainActivity.attendanceCalendar(){'
          )

          if calendar_start == -1:
              raise SystemExit(
                  "ERROR: attendanceCalendar() not found"
              )

          render_start = s.find(
              '        fun render(){',
              calendar_start
          )

          nav_start = s.find(
              '        val nav=',
              render_start
          )

          if render_start == -1 or nav_start == -1:
              raise SystemExit(
                  "ERROR: attendanceCalendar render block not found"
              )

          block = s[render_start:nav_start]

          marker = '        fun renderSummary(){'

          if marker not in block:
              raise SystemExit(
                  "ERROR: renderSummary() not found"
              )

          render_part, summary_part = block.split(
              marker,
              1
          )

          summary_part = marker + summary_part

          s = (
              s[:render_start]
              + summary_part
              + render_part
              + s[nav_start:]
          )


          # ======================================================
          # 5. WRITE FINAL PATCHED SOURCE
          # ======================================================

          p.write_text(
              s,
              encoding="utf-8"
          )

          print("RELEASE_SOURCE_PATCH=PASS")
          PY


          echo ""
          echo "=========================================="
          echo "RELEASE SOURCE PATCH VERIFICATION"
          echo "=========================================="

          # ------------------------------------------------------
          # The known broken implicit it.text references must be
          # completely gone except legitimate statusViews.forEach.
          # ------------------------------------------------------

          if grep -nE \
            '\bit\.text\s*=' \
            "$FILE" \
            | grep -v 'statusViews.forEach'; then

            echo ""
            echo "ERROR: Broken implicit it.text reference remains."
            exit 1

          fi


          # ------------------------------------------------------
          # Old audit references must not return.
          # ------------------------------------------------------

          ! grep -Fq \
            "app.audit.auditLog()" \
            "$FILE"

          ! grep -Fq \
            "app.audit.clearAuditLog()" \
            "$FILE"

          ! grep -Fq \
            "getSystemService(ALARM_SERVICE)" \
            "$FILE"


          # ------------------------------------------------------
          # renderSummary must exist before render in the
          # attendanceCalendar local scope.
          # ------------------------------------------------------

          SUMMARY_LINE="$(
            grep -n \
              'fun renderSummary()' \
              "$FILE" \
              | head -n 1 \
              | cut -d: -f1
          )"

          RENDER_LINE="$(
            grep -n \
              'fun render()' \
              "$FILE" \
              | tail -n 1 \
              | cut -d: -f1
          )"

          test -n "$SUMMARY_LINE"
          test -n "$RENDER_LINE"


          # ------------------------------------------------------
          # Confirm the missing-action buttons now have actions.
          # ------------------------------------------------------

          grep -Fq \
            'val cropBtn=btn("Crop: ${crops.first().name}"){}' \
            "$FILE"

          grep -Fq \
            'val attendanceTimeBtn=btn("Attendance time:' \
            "$FILE"

          grep -Fq \
            'val paymentTimeBtn=btn("Payment time:' \
            "$FILE"

          grep -Fq \
            'val prev=btn("‹ Previous"){}' \
            "$FILE"

          grep -Fq \
            'val next=btn("Next ›"){}' \
            "$FILE"


          echo ""
          echo "SOURCE_AUDIT=PASS"

          echo ""
          echo "=========================================="
          echo "RELEASE KOTLIN COMPILATION"
          echo "=========================================="

          set +e

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --no-parallel \
            :app:compileReleaseKotlin \
            2>&1 | tee /tmp/majdoor-release-kotlin.log

          KOTLIN_STATUS=${PIPESTATUS[0]}

          set -e


          if [ "$KOTLIN_STATUS" -ne 0 ]; then

            echo ""
            echo "=========================================="
            echo "KOTLIN COMPILATION FAILED"
            echo "=========================================="

            echo ""
            echo "COMPILER ERRORS:"
            echo "------------------------------------------"

            grep -E \
              "e: .*MainActivityScreens.kt:" \
              /tmp/majdoor-release-kotlin.log \
              || true

            echo ""
            echo "------------------------------------------"
            echo "SOURCE AROUND 1278"
            echo "------------------------------------------"

            nl -ba "$FILE" \
              | sed -n '1268,1288p'

            echo ""
            echo "------------------------------------------"
            echo "SOURCE AROUND 1384"
            echo "------------------------------------------"

            nl -ba "$FILE" \
              | sed -n '1374,1405p'

            echo ""
            echo "------------------------------------------"
            echo "SOURCE AROUND 1420"
            echo "------------------------------------------"

            nl -ba "$FILE" \
              | sed -n '1414,1440p'

            echo ""
            echo "------------------------------------------"
            echo "SOURCE AROUND 1456"
            echo "------------------------------------------"

            nl -ba "$FILE" \
              | sed -n '1450,1470p'

            echo ""
            echo "------------------------------------------"
            echo "SOURCE AROUND 1517"
            echo "------------------------------------------"

            nl -ba "$FILE" \
              | sed -n '1485,1540p'

            echo ""
            echo "------------------------------------------"
            echo "SOURCE AROUND 1584"
            echo "------------------------------------------"

            nl -ba "$FILE" \
              | sed -n '1575,1595p'

            echo ""
            echo "=========================================="
            echo "KOTLIN_COMPILATION=FAIL"
            echo "=========================================="

            exit "$KOTLIN_STATUS"

          fi


          echo ""
          echo "=========================================="
          echo "KOTLIN COMPILATION SUCCESS"
          echo "=========================================="


          echo ""
          echo "=========================================="
          echo "ASSEMBLING RELEASE APK"
          echo "=========================================="


          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --no-parallel \
            :app:assembleRelease


          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"


          echo ""
          echo "=========================================="
          echo "RELEASE APK BUILD SUCCESS"
          echo "=========================================="

          ls -lh "$APK"


      # ==========================================================
      # 13. VERIFY UNSIGNED APK
      # ==========================================================

      - name: Verify unsigned APK
        working-directory: project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          echo "APK SIZE:"
          du -h "$APK"

          echo ""
          echo "APK BADGING:"

          aapt dump badging "$APK" \
            | head -n 5

          aapt dump badging "$APK" \
            | grep -Fq \
            "package: name='${PACKAGE_NAME}'"

          aapt dump badging "$APK" \
            | grep -Fq \
            "versionCode='${VERSION_CODE}'"

          aapt dump badging "$APK" \
            | grep -Fq \
            "versionName='${VERSION_NAME}'"

          unzip -t "$APK" \
            >/dev/null

          echo "UNSIGNED_APK_VERIFICATION=PASS"


      # ==========================================================
      # 14. RESTORE RELEASE KEYSTORE
      # ==========================================================

      - name: Restore release keystore
        working-directory: project
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

          keytool -list \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "RELEASE_KEYSTORE=PASS"


      # ==========================================================
      # 15. ZIPALIGN
      # ==========================================================

      - name: Align APK
        working-directory: project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          zipalign \
            -f \
            -p \
            4 \
            "$APK" \
            app-release-aligned.apk

          zipalign \
            -c \
            -v \
            4 \
            app-release-aligned.apk

          test -s app-release-aligned.apk

          echo "ZIPALIGN=PASS"


      # ==========================================================
      # 16. SIGN APK
      # ==========================================================

      - name: Sign Release APK
        working-directory: project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            app-release-aligned.apk

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk

          echo "APK_SIGNING=PASS"


      # ==========================================================
      # 17. VERIFY SIGNED APK
      # ==========================================================

      - name: Verify signed APK
        working-directory: project
        shell: bash
        run: |
          set -e

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$APK"

          apksigner verify \
            --verbose \
            --print-certs \
            "$APK"

          zipalign \
            -c \
            -v \
            4 \
            "$APK"

          aapt dump badging "$APK" \
            | grep -Fq \
            "package: name='${PACKAGE_NAME}'"

          aapt dump badging "$APK" \
            | grep -Fq \
            "versionCode='${VERSION_CODE}'"

          aapt dump badging "$APK" \
            | grep -Fq \
            "versionName='${VERSION_NAME}'"

          unzip -t "$APK" \
            >/dev/null

          echo "SIGNED_APK_VERIFICATION=PASS"


      # ==========================================================
      # 18. SHA256
      # ==========================================================

      - name: Generate SHA256
        working-directory: project
        shell: bash
        run: |
          set -e

          sha256sum \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            | tee \
            artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          echo "SHA256=PASS"


      # ==========================================================
      # 19. UPLOAD FINAL APK
      # ==========================================================

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-v1.77.0-release

          path: |
            project/artifacts/Majdoor-Hisaab-PRO-release.apk
            project/artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          if-no-files-found: error

          retention-days: 30


      # ==========================================================
      # 20. FINAL SUCCESS
      # ==========================================================

      - name: FINAL BUILD SUCCESS
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       MAJDOOR HISAAB PRO"
          echo "       RELEASE BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Package     : ${PACKAGE_NAME}"
          echo "Version     : ${VERSION_NAME}"
          echo "VersionCode : ${VERSION_CODE}"
          echo ""
          echo "SIGNED APK CREATED SUCCESSFULLY"
          echo ""
          echo "=========================================="
