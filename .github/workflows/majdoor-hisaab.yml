name: Majdoor Hisaab PRO - Stable Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104.zip"

jobs:

  build-release-apk:

    name: Build and Sign Release APK

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. BUILD INFORMATION
      # ==========================================================

      - name: Show build configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MAJDOOR HISAAB PRO"
          echo "STABLE RELEASE APK BUILD"
          echo "=========================================="

          echo "Java        : ${JAVA_VERSION}"
          echo "Gradle      : ${GRADLE_VERSION}"
          echo "Android API : ${ANDROID_API}"
          echo "Build Tools : ${BUILD_TOOLS}"
          echo "Package     : ${PACKAGE_NAME}"
          echo "Version     : ${VERSION_NAME}"
          echo "VersionCode : ${VERSION_CODE}"

          echo "=========================================="


      # ==========================================================
      # 3. PREPARE AND FIND PROJECT
      #
      # IMPORTANT:
      # The old workflow failed because it expected the ZIP only
      # at repository root.
      #
      # This version searches the complete repository.
      # ==========================================================

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          rm -rf project
          rm -rf extracted

          mkdir -p project
          mkdir -p extracted

          echo "=========================================="
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "=========================================="

          # ------------------------------------------------------
          # CASE 1:
          # Android project already exists directly in repository
          # ------------------------------------------------------

          if [ -f "settings.gradle.kts" ] &&
             [ -f "app/build.gradle.kts" ]; then

            echo "ANDROID_PROJECT_FOUND_IN_REPOSITORY"

            shopt -s dotglob

            cp -a . project/

          else

            echo "ANDROID_PROJECT_NOT_FOUND_AT_ROOT"
            echo "SEARCHING FOR PROJECT ZIP..."

            # ----------------------------------------------------
            # Search exact requested ZIP anywhere in repository
            # ----------------------------------------------------

            ZIP_PATH="$(
              find . \
                -type f \
                -name "${ZIP_NAME}" \
                -not -path "./project/*" \
                -not -path "./extracted/*" \
                -print \
                | head -n 1
            )"

            # ----------------------------------------------------
            # Search fixed ZIP if exact original is not present
            # ----------------------------------------------------

            if [ -z "$ZIP_PATH" ]; then

              ZIP_PATH="$(
                find . \
                  -type f \
                  -name "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip" \
                  -not -path "./project/*" \
                  -not -path "./extracted/*" \
                  -print \
                  | head -n 1
              )"

            fi

            # ----------------------------------------------------
            # Search any Majdoor Hisaab ZIP
            # ----------------------------------------------------

            if [ -z "$ZIP_PATH" ]; then

              ZIP_PATH="$(
                find . \
                  -type f \
                  -iname "Majdoor_Hisaab*.zip" \
                  -not -path "./project/*" \
                  -not -path "./extracted/*" \
                  -print \
                  | head -n 1
              )"

            fi

            # ----------------------------------------------------
            # ZIP MUST EXIST
            # ----------------------------------------------------

            if [ -z "$ZIP_PATH" ]; then

              echo ""
              echo "=========================================="
              echo "ERROR: MAJDOOR HISAAB PROJECT ZIP NOT FOUND"
              echo "=========================================="
              echo ""
              echo "Expected:"
              echo "${ZIP_NAME}"
              echo ""
              echo "Upload the project ZIP into the GitHub"
              echo "repository and run the workflow again."
              echo ""
              echo "ZIP FILES FOUND IN REPOSITORY:"
              find . \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                -print \
                | head -n 30 || true
              echo ""
              exit 1

            fi

            echo "PROJECT_ZIP_FOUND=${ZIP_PATH}"

            # ----------------------------------------------------
            # Extract
            # ----------------------------------------------------

            unzip -q "$ZIP_PATH" -d extracted

            echo "ZIP_EXTRACTED=PASS"

            # ----------------------------------------------------
            # ZIP project directly at root
            # ----------------------------------------------------

            if [ -f "extracted/settings.gradle.kts" ] &&
               [ -f "extracted/app/build.gradle.kts" ]; then

              echo "PROJECT_ROOT=extracted"

              cp -a extracted/. project/

            else

              # --------------------------------------------------
              # Find settings.gradle.kts inside ZIP
              # --------------------------------------------------

              PROJECT_ROOT_FILE="$(
                find extracted \
                  -type f \
                  -name "settings.gradle.kts" \
                  -print \
                  | head -n 1
              )"

              if [ -z "$PROJECT_ROOT_FILE" ]; then

                echo ""
                echo "=========================================="
                echo "ERROR: settings.gradle.kts NOT FOUND"
                echo "=========================================="

                find extracted \
                  -maxdepth 4 \
                  -type f \
                  | head -n 100

                exit 1

              fi

              PROJECT_ROOT="$(dirname "$PROJECT_ROOT_FILE")"

              echo "PROJECT_ROOT=${PROJECT_ROOT}"

              test -f \
                "$PROJECT_ROOT/app/build.gradle.kts"

              cp -a "$PROJECT_ROOT"/. project/

            fi

          fi

          # ------------------------------------------------------
          # Final project verification
          # ------------------------------------------------------

          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml

          echo ""
          echo "=========================================="
          echo "PROJECT_PREPARATION=PASS"
          echo "=========================================="


      # ==========================================================
      # 4. APPLY ONLY PREVIOUSLY FAILED KOTLIN FIXES
      # ==========================================================

      - name: Apply required Kotlin source fixes
        working-directory: project
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"

          test -f "$FILE"

          cp "$FILE" \
            "${FILE}.original-ci"


          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"
          )

          text = file.read_text(encoding="utf-8")

          # ------------------------------------------------------
          # FIX 1
          # AuditUseCase uses list()
          # ------------------------------------------------------

          text = text.replace(
              "app.audit.auditLog()",
              "app.audit.list()"
          )

          # ------------------------------------------------------
          # FIX 2
          # AuditUseCase uses clear()
          # ------------------------------------------------------

          text = text.replace(
              "app.audit.clearAuditLog()",
              "app.audit.clear()"
          )

          # ------------------------------------------------------
          # FIX 3
          # Android Context constant
          # ------------------------------------------------------

          text = text.replace(
              "getSystemService(ALARM_SERVICE)",
              "getSystemService(Context.ALARM_SERVICE)"
          )

          file.write_text(
              text,
              encoding="utf-8"
          )

          print("SOURCE_FIXES_APPLIED")

          PY


          # ------------------------------------------------------
          # Verify old references are gone
          # ------------------------------------------------------

          if grep -Fq \
            "app.audit.auditLog()" \
            "$FILE"; then

            echo "ERROR: old auditLog() reference remains"
            exit 1

          fi


          if grep -Fq \
            "app.audit.clearAuditLog()" \
            "$FILE"; then

            echo "ERROR: old clearAuditLog() reference remains"
            exit 1

          fi


          if grep -Fq \
            "getSystemService(ALARM_SERVICE)" \
            "$FILE"; then

            echo "ERROR: old ALARM_SERVICE reference remains"
            exit 1

          fi


          grep -Fq \
            "app.audit.list()" \
            "$FILE"


          grep -Fq \
            "app.audit.clear()" \
            "$FILE"


          grep -Fq \
            "Context.ALARM_SERVICE" \
            "$FILE"


          echo "SOURCE_FIXES_VERIFICATION=PASS"


      # ==========================================================
      # 5. JAVA 17
      # ==========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 6. ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ==========================================================
      # 7. ANDROID API 36
      # ==========================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "ANDROID_SDK_READY=PASS"


      # ==========================================================
      # 8. GRADLE 8.11.1
      # ==========================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true
          cache-cleanup: never


      # ==========================================================
      # 9. VERIFY TOOLCHAIN
      # ==========================================================

      - name: Verify Java Gradle Android
        shell: bash
        run: |
          set -e

          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          gradle --version

          gradle --version \
            | grep -Fq "Gradle 8.11.1"

          echo ""
          echo "ANDROID SDK:"

          sdkmanager --list_installed \
            | grep -E \
            "platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}"

          echo ""
          echo "TOOLCHAIN_VERIFICATION=PASS"


      # ==========================================================
      # 10. PROJECT CONFIGURATION
      # ==========================================================

      - name: Verify project configuration
        working-directory: project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts


          grep -Fq \
            'id("com.android.application") version "8.9.1"' \
            build.gradle.kts


          grep -Fq \
            'id("org.jetbrains.kotlin.android") version "2.1.21"' \
            build.gradle.kts


          grep -Fq \
            'compileSdk = 36' \
            app/build.gradle.kts


          grep -Fq \
            'targetSdk = 36' \
            app/build.gradle.kts


          grep -Fq \
            'applicationId = "com.majdoor.hisaab"' \
            app/build.gradle.kts


          grep -Fq \
            'versionCode = 77' \
            app/build.gradle.kts


          grep -Fq \
            'versionName = "1.77.0"' \
            app/build.gradle.kts


          echo "PROJECT_CONFIGURATION=PASS"


      # ==========================================================
      # 11. CLEAN
      #
      # No gradle help.
      # No unnecessary configuration build.
      # ==========================================================

      - name: Clean previous build
        working-directory: project
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            clean

          echo "CLEAN_BUILD=PASS"


      # ==========================================================
      # 12. BUILD RELEASE APK
      # ==========================================================

      - name: Build Release APK
        working-directory: project
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "STARTING RELEASE APK COMPILATION"
          echo "=========================================="
          echo ""

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --no-parallel \
            :app:assembleRelease

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          echo ""
          echo "=========================================="
          echo "RELEASE APK BUILD SUCCESS"
          echo "=========================================="

          ls -lh "$APK"


      # ==========================================================
      # 13. VERIFY UNSIGNED APK
      # ==========================================================

      - name: Verify unsigned APK
        working-directory: project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          echo "APK SIZE:"
          du -h "$APK"

          echo ""
          echo "APK BADGING:"

          aapt dump badging "$APK" \
            | head -n 5


          aapt dump badging "$APK" \
            | grep -Fq \
            "package: name='${PACKAGE_NAME}'"


          aapt dump badging "$APK" \
            | grep -Fq \
            "versionCode='${VERSION_CODE}'"


          aapt dump badging "$APK" \
            | grep -Fq \
            "versionName='${VERSION_NAME}'"


          unzip -t "$APK" \
            >/dev/null


          echo "UNSIGNED_APK_VERIFICATION=PASS"


      # ==========================================================
      # 14. RESTORE RELEASE KEYSTORE
      # ==========================================================

      - name: Restore release keystore
        working-directory: project
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"


          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > release.keystore


          test -s release.keystore


          keytool -list \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null


          echo "RELEASE_KEYSTORE=PASS"


      # ==========================================================
      # 15. ZIPALIGN
      # ==========================================================

      - name: Align APK
        working-directory: project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"


          zipalign \
            -f \
            -p \
            4 \
            "$APK" \
            app-release-aligned.apk


          zipalign \
            -c \
            -v \
            4 \
            app-release-aligned.apk


          test -s app-release-aligned.apk


          echo "ZIPALIGN=PASS"


      # ==========================================================
      # 16. SIGN APK
      # ==========================================================

      - name: Sign Release APK
        working-directory: project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          mkdir -p artifacts


          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            app-release-aligned.apk


          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk


          echo "APK_SIGNING=PASS"


      # ==========================================================
      # 17. VERIFY SIGNED APK
      # ==========================================================

      - name: Verify signed APK
        working-directory: project
        shell: bash
        run: |
          set -e

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$APK"


          apksigner verify \
            --verbose \
            --print-certs \
            "$APK"


          zipalign \
            -c \
            -v \
            4 \
            "$APK"


          aapt dump badging "$APK" \
            | grep -Fq \
            "package: name='${PACKAGE_NAME}'"


          aapt dump badging "$APK" \
            | grep -Fq \
            "versionCode='${VERSION_CODE}'"


          aapt dump badging "$APK" \
            | grep -Fq \
            "versionName='${VERSION_NAME}'"


          unzip -t "$APK" \
            >/dev/null


          echo "SIGNED_APK_VERIFICATION=PASS"


      # ==========================================================
      # 18. SHA256
      # ==========================================================

      - name: Generate SHA256
        working-directory: project
        shell: bash
        run: |
          set -e

          sha256sum \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            | tee \
            artifacts/Majdoor-Hisaab-PRO-release.apk.sha256


          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk.sha256


          echo "SHA256=PASS"


      # ==========================================================
      # 19. UPLOAD FINAL APK
      # ==========================================================

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-v1.77.0-release

          path: |
            project/artifacts/Majdoor-Hisaab-PRO-release.apk
            project/artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          if-no-files-found: error

          retention-days: 30


      # ==========================================================
      # 20. FINAL SUCCESS
      # ==========================================================

      - name: FINAL BUILD SUCCESS
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       MAJDOOR HISAAB PRO"
          echo "       RELEASE BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Package     : ${PACKAGE_NAME}"
          echo "Version     : ${VERSION_NAME}"
          echo "VersionCode : ${VERSION_CODE}"
          echo ""
          echo "SIGNED APK CREATED SUCCESSFULLY"
          echo ""
          echo "=========================================="
