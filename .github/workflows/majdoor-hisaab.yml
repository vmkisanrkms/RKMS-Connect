name: MAJDOOR HISAAB PRO — V101 FINAL RELEASE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  GRADLE_VERSION: 8.11.1
  ANDROID_API: 36
  BUILD_TOOLS: 36.0.0
  PACKAGE_NAME: com.majdoor.hisaab

jobs:
  build-test-sign-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v7

      # ============================================================
      # 2. CLEAN GITHUB RUNNER
      # ============================================================

      - name: Confirm clean GitHub-hosted runner
        run: |
          set -Eeuo pipefail

          echo "CLEAN_RUNNER=github-hosted-ubuntu-latest"

          test -n "${GITHUB_RUN_ID}" || {
            echo "ERROR: GITHUB_RUN_ID missing; not running under GitHub Actions"
            exit 1
          }

      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: |
          set -Eeuo pipefail

          java -version
          javac -version

      # ============================================================
      # 4. GRADLE 8.11.1
      # ============================================================

      - name: Set up Gradle distribution
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '${{ env.GRADLE_VERSION }}'
          cache-disabled: true
          validate-wrappers: false

      - name: Verify Gradle
        run: |
          set -Eeuo pipefail

          command -v gradle
          gradle --version

          gradle --version | grep -F "Gradle ${GRADLE_VERSION}"

      # ============================================================
      # 5. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "emulator"

      # ============================================================
      # 6. EMULATOR LINUX DEPENDENCIES
      # ============================================================

      - name: Install Android emulator Linux dependencies
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            libpulse0 \
            libx11-6 \
            libxcb1 \
            libxdamage1 \
            libnss3 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxtst6 \
            libxrandr2 \
            libgl1 \
            libglu1-mesa \
            libfontconfig1 \
            libdbus-1-3 \
            libasound2t64

          sudo ldconfig

      # ============================================================
      # 7. BOOTSTRAP GRADLE WRAPPER
      # ============================================================

      - name: Bootstrap repository Gradle Wrapper on clean checkout
        run: |
          set -Eeuo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew

          command -v gradle

          echo "Gradle executable: $(command -v gradle)"

          gradle --version | grep -F "Gradle ${GRADLE_VERSION}"

          chmod +x ./gradlew

          GRADLE_BOOTSTRAP_BIN=gradle

          "$GRADLE_BOOTSTRAP_BIN" :wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --gradle-distribution-sha256-sum \
            f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6

          test -s gradle/wrapper/gradle-wrapper.jar

          ./gradlew --version | grep -F "Gradle ${GRADLE_VERSION}"

      # ============================================================
      # 8. DEPENDENCY HEALTH NORMALIZATION
      # ============================================================

      - name: Normalize dependency health configurations
        run: |
          set -Eeuo pipefail

          test -f scripts/dependency-health.sh

          sed -i \
            's/\btestRuntimeClasspath\b/debugUnitTestRuntimeClasspath/g' \
            scripts/dependency-health.sh

          sed -i \
            's#./gradlew --no-daemon --stacktrace --refresh-dependencies dependencies --configuration#./gradlew --no-daemon --stacktrace --refresh-dependencies :app:dependencies --configuration#g' \
            scripts/dependency-health.sh

      # ============================================================
      # 9. BUILD + STATIC ACCEPTANCE + DEPENDENCY AUDIT
      # ============================================================

      - name: Build project with explicit failure diagnostics
        run: |
          set -Eeuo pipefail

          trap '
            echo "ERROR: GitHub Actions build failed at line $LINENO."
            echo "Check the command immediately above this message."
          ' ERR

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew

          grep -q 'versionCode = 77' app/build.gradle.kts
          grep -q 'versionName = "1.77.0"' app/build.gradle.kts

          chmod +x scripts/*.sh

          # --------------------------------------------------------
          # STATIC ACCEPTANCE
          # --------------------------------------------------------

          bash scripts/acceptance-gates.sh

          # --------------------------------------------------------
          # WRAPPER VERIFICATION
          # --------------------------------------------------------

          chmod +x ./gradlew

          ./gradlew --version | grep -F 'Gradle 8.11.1'

          # --------------------------------------------------------
          # FRESH DEPENDENCY RESOLUTION
          # --------------------------------------------------------

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration debugRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration debugUnitTestRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration e2eReleaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration releaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            buildEnvironment

          # --------------------------------------------------------
          # DEPENDENCY HEALTH
          # --------------------------------------------------------

          ./scripts/dependency-health.sh

          # --------------------------------------------------------
          # RUNTIME CONTRACT GATES
          # --------------------------------------------------------

          ./scripts/phase17-real-android-runtime-gate.sh

          ./scripts/phase18-configuration-lifecycle-gate.sh

          ./scripts/phase19-offline-first-gate.sh

          ./scripts/phase20-security-data-gate.sh

          # --------------------------------------------------------
          # UNIT TEST + ALL REQUIRED COMPILATIONS
          # --------------------------------------------------------

          ./gradlew \
            --no-daemon \
            --stacktrace \
            test \
            compileDebugKotlin \
            assembleDebug \
            compileE2eReleaseKotlin \
            assembleE2eRelease \
            compileReleaseKotlin \
            assembleRelease \
            assembleReleaseAndroidTest

          # --------------------------------------------------------
          # RELEASE BUILD GATE
          # --------------------------------------------------------

          ./scripts/release-build-gate.sh

          # --------------------------------------------------------
          # DEBUG APK VERIFICATION
          # --------------------------------------------------------

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$DEBUG_APK"

          apkanalyzer manifest application-id "$DEBUG_APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$DEBUG_APK" \
            | grep -Fx "1.77.0"

          apkanalyzer manifest version-code "$DEBUG_APK" \
            | grep -Fx "77"

          mkdir -p artifacts/debug

          cp "$DEBUG_APK" \
            artifacts/debug/Majdoor-Hisaab-PRO-debug.apk

          sha256sum "$DEBUG_APK" \
            | tee artifacts/debug/Majdoor-Hisaab-PRO-debug.sha256

      # ============================================================
      # 10. DEBUG APK RUNTIME
      # ============================================================

      - name: Install and launch Debug APK on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            adb install -r \
              "${GITHUB_WORKSPACE}/app/build/outputs/apk/debug/app-debug.apk"

            adb shell am force-stop "${PACKAGE_NAME}"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity" \
              | tee artifacts/debug/debug-launch.txt

            sleep 2

            adb shell pidof "${PACKAGE_NAME}" \
              | grep -Eq '[0-9]+'

            adb shell cmd package resolve-activity \
              --brief \
              -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER \
              "${PACKAGE_NAME}" \
              | grep -q "${PACKAGE_NAME}"

            adb logcat -d -t 10000 \
              > artifacts/debug/debug-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/debug/debug-logcat.txt; then
              exit 1
            fi

      # ============================================================
      # 11. REAL ANDROID ROTATION + ERROR E2E
      # ============================================================

      - name: Run real Android rotation + error-state E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest

      # ============================================================
      # 12. UNSIGNED RELEASE APK
      # ============================================================

      - name: Verify unsigned Release APK
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" \
            | grep -Fx "1.77.0"

          apkanalyzer manifest version-code "$APK" \
            | grep -Fx "77"

          mkdir -p artifacts

          cp "$APK" \
            artifacts/app-release-unsigned.apk

      # ============================================================
      # 13. PRODUCTION SIGNING KEY
      # ============================================================

      - name: Restore production signing key
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        run: |
          set -Eeuo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$EXPECTED_CERT"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

          keytool \
            -list \
            -v \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > cert.txt

          ACTUAL_CERT=$(
            awk -F': ' \
              '/SHA256:/{print $2; exit}' \
              cert.txt \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )

          EXPECTED_CERT_NORMALIZED=$(
            printf '%s' "$EXPECTED_CERT" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )

          test "$ACTUAL_CERT" = "$EXPECTED_CERT_NORMALIZED"

      # ============================================================
      # 14. ZIPALIGN + SIGN RELEASE
      # ============================================================

      - name: Zipalign and sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        run: |
          set -Eeuo pipefail

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$UNSIGNED"
          test -s release.keystore

          zipalign \
            -f \
            -p \
            4 \
            "$UNSIGNED" \
            "$ALIGNED"

          zipalign \
            -c \
            -v \
            4 \
            "$ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$SIGNED" \
            | tee artifacts/release-signature.txt

          ACTUAL_SIGNED_CERT=$(
            apksigner verify \
              --print-certs \
              "$SIGNED" \
              | awk -F': ' \
                '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )

          EXPECTED_SIGNED_CERT=$(
            printf '%s' "$EXPECTED_CERT" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )

          test -n "$ACTUAL_SIGNED_CERT"
          test "$ACTUAL_SIGNED_CERT" = "$EXPECTED_SIGNED_CERT"

          unzip -t "$SIGNED" >/dev/null

          zipalign -c -v 4 "$SIGNED"

          # --------------------------------------------------------
          # SIGN RELEASE ANDROID TEST APK
          # --------------------------------------------------------

          TEST_UNSIGNED="app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          TEST_ALIGNED="app/build/outputs/apk/androidTest/release/app-release-androidTest-aligned.apk"
          TEST_SIGNED="artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

          test -s "$TEST_UNSIGNED"

          zipalign \
            -f \
            -p \
            4 \
            "$TEST_UNSIGNED" \
            "$TEST_ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$TEST_SIGNED" \
            "$TEST_ALIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$TEST_SIGNED" \
            >/dev/null

          rm -f release.keystore
          rm -f "$ALIGNED"
          rm -f "$TEST_ALIGNED"
          rm -f cert.txt

      # ============================================================
      # 15. PRODUCTION SIGNING GATE
      # ============================================================

      - name: Production signing, signature, ZIP integrity and alignment gate
        env:
          MH_RELEASE_CERT_SHA256: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        run: |
          set -Eeuo pipefail

          ./scripts/production-signing-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

      # ============================================================
      # 16. SIGNED APK METADATA + SHA256
      # ============================================================

      - name: Verify signed APK metadata and checksum
        run: |
          set -Eeuo pipefail

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" \
            | grep -Fx "1.77.0"

          apkanalyzer manifest version-code "$APK" \
            | grep -Fx "77"

          unzip -t "$APK" >/dev/null

          zipalign -c -v 4 "$APK"

          apksigner verify \
            --verbose \
            --print-certs \
            "$APK" \
            | tee artifacts/release-signature-final.txt

          sha256sum "$APK" \
            | tee artifacts/Majdoor-Hisaab-PRO-release.sha256

          test -s artifacts/Majdoor-Hisaab-PRO-release.sha256

      # ============================================================
      # 17. PHASE 1 ARTIFACT GATE
      # ============================================================

      - name: Phase 1 Points 18-25 artifact gate
        run: |
          set -Eeuo pipefail

          ./scripts/phase1-points-18-25-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

      # ============================================================
      # 18. PHASE 22 RED LIST STRUCTURAL GATE
      # ============================================================

      - name: Phase 22 red-list structural gate
        run: |
          set -Eeuo pipefail

          ./scripts/phase22-final-red-list-gate.sh

      # ============================================================
      # 19. CRITICAL RELEASE E2E + RUNTIME EVIDENCE
      # ============================================================

      - name: Run critical release E2E suites and create runtime evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            # Clean-install / backup / restore
            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.CleanInstallBackupRestoreE2ETest

            # Phase 17
            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.Phase17RealAndroidRuntimeE2ETest

            # Phase 18
            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.Phase18ConfigurationLifecycleE2ETest

            # Phase 19
            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.Phase19OfflineFirstE2ETest

            # Phase 22
            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.Phase22FinalRedListE2ETest

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/552_553_clean_install_restore_totals.pass

            touch \
              artifacts/release-e2e/markers/554_security_runtime.pass

            touch \
              artifacts/release-e2e/markers/555_556_557_558_559_runtime.pass

      # ============================================================
      # 20. SIGNED RELEASE API 36 RUNTIME
      # ============================================================

      - name: Run signed Release APK on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            # This creates:
            # 547 signed APK install
            # 548 fresh launch
            # 549 relaunch persistence
            # 560 force stop
            # 562 rotation
            # 563 crash scan

            ./scripts/release-e2e.sh \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release.apk"

            # --------------------------------------------------------
            # OFFLINE RUNTIME
            # --------------------------------------------------------

            adb shell svc wifi disable || true
            adb shell svc data disable || true

            adb shell am force-stop "${PACKAGE_NAME}"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity" \
              | tee artifacts/release-e2e/offline-launch.txt

            sleep 2

            adb shell pidof "${PACKAGE_NAME}" \
              | grep -Eq '[0-9]+'

            adb logcat -d -t 10000 \
              > artifacts/release-e2e/offline-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/release-e2e/offline-logcat.txt; then
              exit 1
            fi

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/550_offline_runtime.pass

      # ============================================================
      # 21. TRUE REBOOT PERSISTENCE
      # ============================================================

      - name: Run signed Release APK true reboot persistence gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./scripts/signed-release-reboot-gate.sh \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release.apk" \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

      # ============================================================
      # 22. FINAL RELEASE GATE 541-566
      # ============================================================

      - name: Final Release Gate — Points 541-566
        run: |
          set -Eeuo pipefail

          ./scripts/final-release-gate.sh

      # ============================================================
      # 23. FINAL ARTIFACT VERIFICATION
      # ============================================================

      - name: Verify downloadable Release artifact set
        run: |
          set -Eeuo pipefail

          test -s artifacts/Majdoor-Hisaab-PRO-release.apk
          test -s artifacts/Majdoor-Hisaab-PRO-release.sha256
          test -s artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk

          echo "DOWNLOADABLE_RELEASE_ARTIFACT=PASS"

          ls -lh \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

      # ============================================================
      # 24. UPLOAD ONLY AFTER SUCCESS
      # ============================================================

      - name: Upload Release artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: majdoor-hisaab-pro-release
          path: artifacts/
          if-no-files-found: error
