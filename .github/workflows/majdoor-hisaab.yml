          grep -Fq \
            'exportType.startsWith("reportpdf:")' \
            "$FILE"

          echo "EXPORT_TYPE_FIX=PASS"


          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(
              encoding="utf-8"
          )

          required = [
              ("cropForm", "fb"),
              ("productionForm", "cropBtn"),
              ("revenueForm", "cropBtn"),
              ("workForm", "fieldBtn"),
              ("workForm", "cropBtn"),
              ("workForm", "workerBtn"),
              ("workForm", "rateTypeBtn"),
              ("paymentForm", "wb"),
              ("paymentForm", "mb"),
              ("paymentForm", "adv"),
              ("expenseForm", "cb"),
              ("expenseForm", "fb"),
              ("expenseForm", "crb"),
              ("reportFiltersDialog", "wb"),
              ("reportFiltersDialog", "fb"),
              ("reportFiltersDialog", "cb"),
              ("workTemplateForm", "rateTypeBtn"),
              ("attendanceForm", "fieldBtn"),
              ("attendanceForm", "statusBtn"),
              ("customReport", "wb"),
              ("customReport", "fb"),
              ("customReport", "cb"),
          ]

          def get_block(name):

              start = text.find(
                  "internal fun MainActivity."
                  + name
              )

              if start < 0:
                  raise SystemExit(
                      f"ERROR: function missing: {name}"
                  )

              end = text.find(
                  "internal fun MainActivity.",
                  start + 10
              )

              if end < 0:
                  end = len(text)

              return text[start:end]


          for function_name, button_name in required:

              block = get_block(
                  function_name
              )

              expected = (
                  f"lateinit var {button_name}:Button"
              )

              if expected not in block:

                  raise SystemExit(
                      "ERROR: missing local lateinit "
                      f"{button_name} in {function_name}"
                  )

          print(
              "BUTTON_SELF_REFERENCE_AUDIT=PASS"
          )
          PY


          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          file = Path(sys.argv[1])

          lines = file.read_text(
              encoding="utf-8"
          ).splitlines()

          bad = []

          for number, line in enumerate(
              lines,
              1
          ):

              if "it.text=" not in line:
                  continue

              if "statusViews.values.forEach" in line:
                  continue

              if "statusViews.forEach{(id,v)->v.text=" in line:
                  continue

              bad.append(
                  f"{number}: {line}"
              )

          if bad:

              print(
                  "ERROR: unresolved it.text references:"
              )

              for item in bad:
                  print(item)

              raise SystemExit(1)

          print(
              "UI_BUTTON_TEXT_SCOPE_AUDIT=PASS"
          )
          PY


          if grep -Fq \
            'statusViews.forEach{it.text=' \
            "$FILE"; then

            echo "ERROR: Map statusViews still uses it.text directly"
            exit 1

          fi

          grep -Fq \
            'statusViews.values.forEach{it.text="FULL"}' \
            "$FILE"

          grep -Fq \
            'statusViews.values.forEach{it.text="HALF"}' \
            "$FILE"

          grep -Fq \
            'statusViews.values.forEach{it.text=AttendanceRules.UNMARKED}' \
            "$FILE"

          echo "ATTENDANCE_STATUS_TEXT_FIX=PASS"


          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(
              encoding="utf-8"
          )

          start = text.find(
              "internal fun MainActivity.attendanceCalendar()"
          )

          end = text.find(
              "internal fun MainActivity.paymentLedger()",
              start
          )

          if start < 0 or end < 0:

              raise SystemExit(
                  "ERROR: attendanceCalendar boundaries missing"
              )

          block = text[
              start:end
          ]

          summary = block.find(
              "fun renderSummary(){"
          )

          render = block.find(
              "fun render(){"
          )

          if summary < 0 or render < 0:

              raise SystemExit(
                  "ERROR: render functions missing"
              )

          if summary >= render:

              raise SystemExit(
                  "ERROR: renderSummary() still appears after render()"
              )

          print(
              "ATTENDANCE_RENDER_ORDER=PASS"
          )
          PY


          if grep -Fq \
            "app.audit.auditLog()" \
            "$FILE"; then

            echo "ERROR: old auditLog() remains"
            exit 1

          fi

          if grep -Fq \
            "app.audit.clearAuditLog()" \
            "$FILE"; then

            echo "ERROR: old clearAuditLog() remains"
            exit 1

          fi

          if grep -Fq \
            "getSystemService(ALARM_SERVICE)" \
            "$FILE"; then

            echo "ERROR: old ALARM_SERVICE remains"
            exit 1

          fi

          grep -Fq \
            "app.audit.list()" \
            "$FILE"

          grep -Fq \
            "app.audit.clear()" \
            "$FILE"

          grep -Fq \
            "Context.ALARM_SERVICE" \
            "$FILE"

          echo "PREVIOUS_SOURCE_FIXES=PASS"


          echo ""
          echo "=========================================="
          echo "SOURCE_AUDIT=PASS"
          echo "=========================================="


          echo ""
          echo "=========================================="
          echo "RELEASE KOTLIN COMPILATION"
          echo "=========================================="

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --no-parallel \
            :app:compileReleaseKotlin


          echo ""
          echo "=========================================="
          echo "KOTLIN_COMPILATION=PASS"
          echo "=========================================="


          echo ""
          echo "=========================================="
          echo "ASSEMBLING RELEASE APK"
          echo "=========================================="

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --no-parallel \
            :app:assembleRelease


          APK="app/build/outputs/apk/release/app-release-unsigned.apk"


          if [ ! -s "$APK" ]; then

            echo ""
            echo "=========================================="
            echo "ERROR: RELEASE APK NOT CREATED"
            echo "=========================================="

            find app/build/outputs \
              -maxdepth 5 \
              -type f \
              -print \
              2>/dev/null || true

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "RELEASE APK BUILD SUCCESS"
          echo "=========================================="

          echo "APK:"
          ls -lh "$APK"

          echo ""
          echo "APK PATH:"
          realpath "$APK"

          echo ""
          echo "=========================================="
          echo "BUILD_RELEASE_APK=PASS"
          echo "=========================================="


      # ==========================================================
      # 13. VERIFY UNSIGNED APK
      # ==========================================================

      - name: Verify unsigned APK
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          echo "APK SIZE:"
          du -h "$APK"

          echo ""
          echo "ANDROID BUILD TOOLS:"

          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          test -d "$BUILD_TOOLS_DIR"

          echo "BUILD_TOOLS_DIR=${BUILD_TOOLS_DIR}"

          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"

          export PATH="$BUILD_TOOLS_DIR:$PATH"

          AAPT2="${BUILD_TOOLS_DIR}/aapt2"

          if [ ! -x "$AAPT2" ]; then
            echo "ERROR: aapt2 not found:"
            echo "$AAPT2"
            exit 1
          fi

          echo ""
          echo "AAPT2:"
          "$AAPT2" version

          echo ""
          echo "APK BADGING:"

          "$AAPT2" dump badging "$APK" \
            | head -n 5

          "$AAPT2" dump badging "$APK" \
            | grep -Fq \
            "package: name='${PACKAGE_NAME}'"

          "$AAPT2" dump badging "$APK" \
            | grep -Fq \
            "versionCode='${VERSION_CODE}'"

          "$AAPT2" dump badging "$APK" \
            | grep -Fq \
            "versionName='${VERSION_NAME}'"

          unzip -t "$APK" \
            >/dev/null

          echo ""
          echo "=========================================="
          echo "UNSIGNED APK VERIFICATION=PASS"
          echo "=========================================="

          AAPT_COMPAT_DIR="${RUNNER_TEMP}/android-aapt-compat"

          mkdir -p "$AAPT_COMPAT_DIR"

          cat > "$AAPT_COMPAT_DIR/aapt" <<EOF
          #!/usr/bin/env bash
          exec "${BUILD_TOOLS_DIR}/aapt2" "\$@"
          EOF

          chmod +x "$AAPT_COMPAT_DIR/aapt"

          echo "$AAPT_COMPAT_DIR" >> "$GITHUB_PATH"

          export PATH="$AAPT_COMPAT_DIR:$PATH"

          echo ""
          echo "TOOL PATH CHECK:"

          command -v aapt
          command -v zipalign
          command -v apksigner

          echo ""
          echo "AAPT_COMPATIBILITY=PASS"
          echo "BUILD_TOOLS_PATH=PASS"


      # ==========================================================
      # 14. RESTORE RELEASE KEYSTORE
      #
      # FIXED:
      # - secret presence checked separately
      # - base64 whitespace/newline handled
      # - invalid base64 detected
      # - keystore validity checked
      # - alias checked separately
      # - useful error message
      # ==========================================================

      - name: Restore release keystore
        working-directory: project
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo ""
          echo "=========================================="
          echo "RESTORING RELEASE KEYSTORE"
          echo "=========================================="

          # ------------------------------------------------------
          # NEVER PRINT SECRET VALUES
          # Only report whether each secret exists.
          # ------------------------------------------------------

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "ERROR: MH_RELEASE_KEYSTORE_BASE64 is empty or unavailable."
            echo ""
            echo "Add this repository secret:"
            echo "MH_RELEASE_KEYSTORE_BASE64"
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: MH_RELEASE_KEYSTORE_PASSWORD is empty or unavailable."
            echo ""
            echo "Add this repository secret:"
            echo "MH_RELEASE_KEYSTORE_PASSWORD"
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: MH_RELEASE_KEY_PASSWORD is empty or unavailable."
            echo ""
            echo "Add this repository secret:"
            echo "MH_RELEASE_KEY_PASSWORD"
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: MH_RELEASE_KEY_ALIAS is empty or unavailable."
            echo ""
            echo "Add this repository secret:"
            echo "MH_RELEASE_KEY_ALIAS"
            exit 1
          fi

          echo "KEYSTORE_SECRET=AVAILABLE"
          echo "KEYSTORE_PASSWORD_SECRET=AVAILABLE"
          echo "KEY_PASSWORD_SECRET=AVAILABLE"
          echo "KEY_ALIAS_SECRET=AVAILABLE"


          # ------------------------------------------------------
          # Decode Base64 keystore safely.
          #
          # Removing CR/LF/space only affects Base64 formatting.
          # It does NOT expose the secret.
          # ------------------------------------------------------

          printf '%s' "$KEYSTORE_B64" \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            > release.keystore


          # ------------------------------------------------------
          # Keystore file must exist and be non-empty.
          # ------------------------------------------------------

          test -s release.keystore

          KEYSTORE_SIZE="$(stat -c '%s' release.keystore)"

          echo "KEYSTORE_SIZE=${KEYSTORE_SIZE} bytes"

          if [ "$KEYSTORE_SIZE" -lt 1000 ]; then
            echo "ERROR: decoded keystore is unexpectedly small."
            echo "The Base64 secret is probably incorrect."
            rm -f release.keystore
            exit 1
          fi


          # ------------------------------------------------------
          # Verify Java keystore.
          # ------------------------------------------------------

          echo ""
          echo "VERIFYING KEYSTORE..."

          keytool -list \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null


          # ------------------------------------------------------
          # Verify alias separately.
          # ------------------------------------------------------

          keytool -list \
            -v \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null


          # ------------------------------------------------------
          # Verify private key can actually be accessed.
          # This catches wrong key password BEFORE signing step.
          # ------------------------------------------------------

          keytool -importkeystore \
            -srckeystore release.keystore \
            -srcstoretype JKS \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "${RUNNER_TEMP}/keystore-validation.p12" \
            -deststoretype PKCS12 \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -destkeypass "$KEY_PASSWORD" \
            -noprompt \
            >/dev/null


          test -s \
            "${RUNNER_TEMP}/keystore-validation.p12"


          rm -f \
            "${RUNNER_TEMP}/keystore-validation.p12"


          echo ""
          echo "=========================================="
          echo "RELEASE KEYSTORE VERIFICATION=PASS"
          echo "=========================================="


      # ==========================================================
      # 15. ZIPALIGN
      # ==========================================================

      - name: Align APK
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          test -x "${BUILD_TOOLS_DIR}/zipalign"

          "${BUILD_TOOLS_DIR}/zipalign" \
            -f \
            -p \
            4 \
            "$APK" \
            app-release-aligned.apk

          test -s app-release-aligned.apk

          "${BUILD_TOOLS_DIR}/zipalign" \
            -c \
            -v \
            4 \
            app-release-aligned.apk

          echo "ZIPALIGN=PASS"


      # ==========================================================
      # 16. SIGN APK
      # ==========================================================

      - name: Sign Release APK
        working-directory: project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p artifacts

          APK="app-release-aligned.apk"

          test -s "$APK"
          test -s release.keystore

          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          test -x "${BUILD_TOOLS_DIR}/apksigner"

          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            "$APK"

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk

          echo "APK_SIGNING=PASS"


      # ==========================================================
      # 17. VERIFY SIGNED APK
      # ==========================================================

      - name: Verify signed APK
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$APK"

          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          test -x "${BUILD_TOOLS_DIR}/apksigner"
          test -x "${BUILD_TOOLS_DIR}/zipalign"

          "${BUILD_TOOLS_DIR}/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

          "${BUILD_TOOLS_DIR}/zipalign" \
            -c \
            -v \
            4 \
            "$APK"

          AAPT2="${BUILD_TOOLS_DIR}/aapt2"

          "$AAPT2" dump badging "$APK" \
            | grep -Fq \
            "package: name='${PACKAGE_NAME}'"

          "$AAPT2" dump badging "$APK" \
            | grep -Fq \
            "versionCode='${VERSION_CODE}'"

          "$AAPT2" dump badging "$APK" \
            | grep -Fq \
            "versionName='${VERSION_NAME}'"

          unzip -t "$APK" \
            >/dev/null

          echo "SIGNED_APK_VERIFICATION=PASS"


      # ==========================================================
      # 18. SHA256
      # ==========================================================

      - name: Generate SHA256
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$APK"

          sha256sum \
            "$APK" \
            | tee \
            artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          echo "SHA256=PASS"


      # ==========================================================
      # 19. UPLOAD FINAL APK
      # ==========================================================

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-v1.77.0-release

          path: |
            project/artifacts/Majdoor-Hisaab-PRO-release.apk
            project/artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          if-no-files-found: error

          retention-days: 30


      # ==========================================================
      # 20. FINAL SUCCESS
      # ==========================================================

      - name: FINAL BUILD SUCCESS
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "       MAJDOOR HISAAB PRO"
          echo "       RELEASE BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Package     : ${PACKAGE_NAME}"
          echo "Version     : ${VERSION_NAME}"
          echo "VersionCode : ${VERSION_CODE}"
          echo ""
          echo "SIGNED APK CREATED SUCCESSFULLY"
          echo ""
          echo "=========================================="
