name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V82-KOTLIN-COMPILE-FIXED.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build Final Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # 4. LOCATE ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATING ANDROID SDK"
          echo "=============================================="

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"

          else
            SDK_ROOT=$(find /usr/local/lib/android \
              -maxdepth 3 \
              -type d \
              -name "sdk" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name "sdkmanager" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "ANDROID SDK:"
          echo "$SDK_ROOT"

          echo ""
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 5. INSTALL ANDROID SDK 36
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INSTALL ANDROID SDK 36"
          echo "=============================================="

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "ANDROID SDK INSTALLATION PASSED."


      # ============================================================
      # 6. VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY ANDROID SDK"
          echo "=============================================="

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"

          echo ""
          echo "ANDROID SDK VERIFICATION PASSED."


      # ============================================================
      # 7. FIND PROJECT ZIP
      # ============================================================

      - name: Find Majdoor Hisaab Project ZIP
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FIND MAJDOOR HISAAB PROJECT ZIP"
          echo "=============================================="

          FOUND_ZIP=""

          if [ -f "$ZIP_NAME" ]; then
            FOUND_ZIP="$ZIP_NAME"
          fi

          if [ -z "$FOUND_ZIP" ]; then
            FOUND_ZIP=$(
              find . \
                -type f \
                -name "Majdoor_Hisaab_PRO_READY_TO_BUILD_FIXED_*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | tail -1
            )
          fi

          if [ -z "$FOUND_ZIP" ]; then
            FOUND_ZIP=$(
              find . \
                -type f \
                -iname "*Majdoor*Hisaab*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | tail -1
            )
          fi

          if [ -z "$FOUND_ZIP" ] || [ ! -f "$FOUND_ZIP" ]; then
            echo ""
            echo "ERROR: Majdoor Hisaab project ZIP NOT FOUND."

            echo ""
            echo "AVAILABLE ZIP FILES:"

            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print \
              | sort

            exit 1
          fi

          FOUND_ZIP="${FOUND_ZIP#./}"

          echo ""
          echo "PROJECT ZIP FOUND:"
          echo "$FOUND_ZIP"

          ls -lh "$FOUND_ZIP"

          echo "ZIP_NAME=$FOUND_ZIP" >> "$GITHUB_ENV"

          echo ""
          echo "ZIP DETECTION PASSED."


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================

      - name: Extract Majdoor Hisaab Project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "EXTRACT PROJECT"
          echo "=============================================="

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_NAME" -d build_source

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print \
            -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: Gradle settings file not found."

            find build_source \
              -maxdepth 8 \
              -type f \
              -print \
              | sort \
              | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 9. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY ANDROID PROJECT"
          echo "=============================================="

          pwd

          test -d "app"

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo ""
          echo "ANDROID PROJECT VERIFIED."


      # ============================================================
      # 10. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle Environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE ENVIRONMENT"
          echo "=============================================="

          java -version

          echo ""
          gradle --version

          DETECTED=$(
            gradle --version |
            awk '/^Gradle / {print $2; exit}'
          )

          echo ""
          echo "EXPECTED GRADLE:"
          echo "$GRADLE_VERSION"

          echo ""
          echo "DETECTED GRADLE:"
          echo "$DETECTED"

          if [ "$DETECTED" != "$GRADLE_VERSION" ]; then
            echo ""
            echo "ERROR: Gradle version mismatch."
            exit 1
          fi

          echo ""
          echo "GRADLE ENVIRONMENT PASSED."


      # ============================================================
      # 11. LOCATE MAIN KOTLIN SOURCE
      # ============================================================

      - name: Locate Main Kotlin Source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE MAIN KOTLIN SOURCE"
          echo "=============================================="

          MAIN_FILES=$(find app/src/main \
            -type f \
            -name "MainActivity.kt" \
            -print)

          echo "$MAIN_FILES"

          COUNT=$(echo "$MAIN_FILES" | sed '/^$/d' | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo ""
            echo "ERROR: Multiple MainActivity.kt files found."
            exit 1
          fi

          MAIN_FILE=$(echo "$MAIN_FILES" | head -1)

          echo "MAIN_FILE=$MAIN_FILE" >> "$GITHUB_ENV"

          echo ""
          echo "MAIN FILE:"
          echo "$MAIN_FILE"


      # ============================================================
      # 12. FIX btn(title=...) -> btn(label=...)
      # ============================================================

      - name: Repair btn Named Arguments
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "REPAIR btn() NAMED ARGUMENTS"
          echo "=============================================="

          python3 <<'PY'
          from pathlib import Path

          root = Path("app/src/main")

          def find_matching_paren(text, open_pos):
              depth = 1
              i = open_pos + 1
              mode = "normal"

              while i < len(text):

                  if mode == "normal":

                      if text.startswith('"""', i):
                          mode = "triple"
                          i += 3
                          continue

                      c = text[i]

                      if c == '"':
                          mode = "string"
                          i += 1
                          continue

                      if c == "'":
                          mode = "char"
                          i += 1
                          continue

                      if c == '(':
                          depth += 1

                      elif c == ')':
                          depth -= 1

                          if depth == 0:
                              return i

                      i += 1

                  elif mode == "string":

                      if text[i] == '\\':
                          i += 2
                          continue

                      if text[i] == '"':
                          mode = "normal"

                      i += 1

                  elif mode == "char":

                      if text[i] == '\\':
                          i += 2
                          continue

                      if text[i] == "'":
                          mode = "normal"

                      i += 1

                  else:

                      if text.startswith('"""', i):
                          mode = "normal"
                          i += 3
                      else:
                          i += 1

              return None


          def replace_title(content):

              result = []
              i = 0
              depth = 0
              mode = "normal"
              changed = 0

              while i < len(content):

                  if mode == "normal":

                      if content.startswith('"""', i):
                          result.append('"""')
                          i += 3
                          mode = "triple"
                          continue

                      c = content[i]

                      if c == '"':
                          result.append(c)
                          i += 1
                          mode = "string"
                          continue

                      if c == "'":
                          result.append(c)
                          i += 1
                          mode = "char"
                          continue

                      if c in "([{":
                          depth += 1
                          result.append(c)
                          i += 1
                          continue

                      if c in ")]}":
                          depth -= 1
                          result.append(c)
                          i += 1
                          continue

                      if depth == 0 and content.startswith("title", i):

                          before_ok = (
                              i == 0 or
                              not (
                                  content[i - 1].isalnum()
                                  or content[i - 1] == "_"
                              )
                          )

                          p = i + 5

                          after_ok = (
                              p < len(content)
                              and content[p] == "="
                          )

                          if before_ok and after_ok:
                              result.append("label")
                              i += 5
                              changed += 1
                              continue

                      result.append(c)
                      i += 1

                  elif mode == "string":

                      if content[i] == '\\':
                          result.append(content[i:i + 2])
                          i += 2
                          continue

                      result.append(content[i])

                      if content[i] == '"':
                          mode = "normal"

                      i += 1

                  elif mode == "char":

                      if content[i] == '\\':
                          result.append(content[i:i + 2])
                          i += 2
                          continue

                      result.append(content[i])

                      if content[i] == "'":
                          mode = "normal"

                      i += 1

                  else:

                      if content.startswith('"""', i):
                          result.append('"""')
                          i += 3
                          mode = "normal"
                      else:
                          result.append(content[i])
                          i += 1

              return ''.join(result), changed


          total = 0

          for path in root.rglob("*.kt"):

              text = path.read_text(
                  encoding="utf-8"
              )

              output = []
              cursor = 0
              changed_file = 0

              while True:

                  pos = text.find("btn(", cursor)

                  if pos == -1:
                      output.append(text[cursor:])
                      break

                  close = find_matching_paren(
                      text,
                      pos + 3
                  )

                  if close is None:
                      raise SystemExit(
                          f"ERROR: Cannot parse btn() in {path}"
                      )

                  output.append(
                      text[cursor:pos]
                  )

                  content = text[
                      pos + 4:close
                  ]

                  fixed, changed = replace_title(
                      content
                  )

                  output.append("btn(")
                  output.append(fixed)
                  output.append(")")

                  changed_file += changed
                  total += changed

                  cursor = close + 1

              new_text = ''.join(output)

              if new_text != text:

                  path.write_text(
                      new_text,
                      encoding="utf-8"
                  )

                  if changed_file:
                      print(
                          f"PATCHED {path}: "
                          f"{changed_file} occurrence(s)"
                      )

          print("")
          print(
              "TOTAL btn title->label FIXES:",
              total
          )
          PY


      # ============================================================
      # 13. VERIFY btn FIX
      # ============================================================

      - name: Verify btn Named Arguments
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY btn() REPAIR"
          echo "=============================================="

          if grep -R -n \
            'btn([^)]*title[[:space:]]*=' \
            app/src/main \
            --include="*.kt"; then

            echo ""
            echo "ERROR: btn(title=...) still exists."
            exit 1
          fi

          echo ""
          echo "btn() TITLE/LABEL CHECK PASSED."


      # ============================================================
      # 14. REPAIR LABOUR DETAIL
      # ============================================================

      - name: Repair LabourDetail Kotlin Function
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "REPAIR LABOUR DETAIL FUNCTION"
          echo "=============================================="

          python3 <<'PY'
          from pathlib import Path
          import os

          main_file = Path(
              os.environ["MAIN_FILE"]
          )

          text = main_file.read_text(
              encoding="utf-8"
          )

          start_marker = (
              "@Composable private fun LabourDetail("
          )

          end_marker = (
              "@Composable private fun PaymentDialog("
          )

          start = text.find(start_marker)
          end = text.find(end_marker)

          if start == -1:
              raise SystemExit(
                  "ERROR: LabourDetail() not found."
              )

          if end == -1:
              raise SystemExit(
                  "ERROR: PaymentDialog() not found."
              )

          if end <= start:
              raise SystemExit(
                  "ERROR: Invalid LabourDetail boundaries."
              )

          fixed_function = r'''@Composable
          private fun LabourDetail(
              store: Store,
              id: String,
              onBack: () -> Unit
          ) {
              val labour =
                  store.labours.firstOrNull {
                      it.id == id
                  } ?: return

              var edit by remember {
                  mutableStateOf(false)
              }

              var payment by remember {
                  mutableStateOf(false)
              }

              var rate by remember {
                  mutableStateOf(false)
              }

              var delPay by remember {
                  mutableStateOf<Payment?>(null)
              }

              val wage =
                  store.attendances
                      .filter {
                          it.labourId == id
                      }
                      .sumOf {
                          it.fraction * it.rate
                      }

              val paid =
                  store.payments
                      .filter {
                          it.labourId == id
                      }
                      .sumOf {
                          it.amount
                      }

              Column(
                  modifier = Modifier.fillMaxSize()
              ) {

                  DetailTopBar(
                      title =
                          "👷 ${labour.name.ifBlank { "मजदूर" }}",
                      onBack = onBack
                  )

                  LazyColumn(
                      modifier =
                          Modifier.padding(16.dp),

                      verticalArrangement =
                          Arrangement.spacedBy(10.dp)
                  ) {

                      item {

                          Row(
                              modifier =
                                  Modifier.fillMaxWidth(),

                              horizontalArrangement =
                                  Arrangement.spacedBy(8.dp)
                          ) {

                              Box(
                                  modifier =
                                      Modifier.weight(1f)
                              ) {
                                  Stat(
                                      title = "मजदूरी",
                                      value = wage
                                  )
                              }

                              Box(
                                  modifier =
                                      Modifier.weight(1f)
                              ) {
                                  Stat(
                                      title = "भुगतान",
                                      value = paid
                                  )
                              }

                              Box(
                                  modifier =
                                      Modifier.weight(1f)
                              ) {
                                  Stat(
                                      title = "बाकी",
                                      value =
                                          wage - paid
                                  )
                              }
                          }
                      }

                      item {

                          Button(
                              onClick = {
                                  payment = true
                              },

                              modifier =
                                  Modifier.fillMaxWidth()
                          ) {
                              Text(
                                  "₹ Cash+ भुगतान जोड़ें"
                              )
                          }
                      }

                      item {

                          Button(
                              onClick = {
                                  rate = true
                              },

                              modifier =
                                  Modifier.fillMaxWidth(),

                              colors =
                                  ButtonDefaults.buttonColors(
                                      containerColor =
                                          GreenDark
                                  )
                          ) {
                              Text(
                                  "दिहाड़ी बदलें"
                              )
                          }
                      }

                      item {

                          Text(
                              text =
                                  "वर्तमान दिहाड़ी: ₹${money(store.rateFor(id, today()))}/दिन",

                              fontWeight =
                                  FontWeight.Bold,

                              color = Green
                          )
                      }

                      item {

                          Text(
                              text =
                                  "दिहाड़ी इतिहास",

                              fontWeight =
                                  FontWeight.Bold,

                              fontSize = 16.sp
                          )
                      }

                      items(
                          items =
                              store.rateHistoryFor(id),

                          key = {
                              it.id
                          }

                      ) { rateItem ->

                          Text(
                              text =
                                  "${displayDate(rateItem.effectiveDate)} से ₹${money(rateItem.rate)}/दिन",

                              modifier =
                                  Modifier
                                      .fillMaxWidth()
                                      .padding(
                                          vertical = 3.dp
                                      ),

                              fontSize = 12.sp,

                              color = Color.Gray
                          )
                      }

                      item {

                          Text(
                              text = "हाजिरी",

                              fontWeight =
                                  FontWeight.Bold,

                              fontSize = 16.sp
                          )
                      }

                      items(
                          items =
                              store.attendances
                                  .filter {
                                      it.labourId == id
                                  }
                                  .sortedByDescending {
                                      it.date
                                  },

                          key = {
                              it.id
                          }

                      ) { attendanceItem ->

                          val field =
                              store.fields.firstOrNull {
                                  it.id ==
                                      attendanceItem.fieldId
                              }

                          val cropName =
                              store.crops
                                  .firstOrNull {
                                      it.id ==
                                          attendanceItem.cropId
                                  }
                                  ?.name
                                  ?.takeIf {
                                      it.isNotBlank()
                                  }

                          val cropPart =
                              if (cropName != null) {
                                  "$cropName • "
                              } else {
                                  ""
                              }

                          Card(
                              modifier =
                                  Modifier.fillMaxWidth()
                          ) {

                              Text(
                                  text =
                                      "${displayDate(attendanceItem.date)} • " +
                                      "${field?.name ?: "खेत"} • " +
                                      cropPart +
                                      "${if (attendanceItem.fraction == 1.0) "Full" else "Half"} • " +
                                      "₹${money(attendanceItem.fraction * attendanceItem.rate)}",

                                  modifier =
                                      Modifier.padding(12.dp)
                              )
                          }
                      }

                      item {

                          Text(
                              text = "भुगतान",

                              fontWeight =
                                  FontWeight.Bold,

                              fontSize = 16.sp
                          )
                      }

                      items(
                          items =
                              store.payments
                                  .filter {
                                      it.labourId == id
                                  }
                                  .sortedByDescending {
                                      it.date
                                  },

                          key = {
                              it.id
                          }

                      ) { paymentItem ->

                          val field =
                              store.fields.firstOrNull {
                                  it.id ==
                                      paymentItem.fieldId
                              }

                          val cropName =
                              store.crops
                                  .firstOrNull {
                                      it.id ==
                                          paymentItem.cropId
                                  }
                                  ?.name
                                  ?.takeIf {
                                      it.isNotBlank()
                                  }

                          val cropPart =
                              if (cropName != null) {
                                  " • $cropName"
                              } else {
                                  ""
                              }

                          Row(
                              modifier =
                                  Modifier
                                      .fillMaxWidth()
                                      .padding(
                                          vertical = 5.dp
                                      ),

                              verticalAlignment =
                                  Alignment.CenterVertically
                          ) {

                              Text(
                                  text =
                                      "${displayDate(paymentItem.date)} • " +
                                      "${field?.name ?: "सामान्य"}$cropPart • " +
                                      "₹${money(paymentItem.amount)}",

                                  modifier =
                                      Modifier.weight(1f)
                              )

                              IconButton(
                                  onClick = {
                                      delPay =
                                          paymentItem
                                  }
                              ) {

                                  Icon(
                                      imageVector =
                                          Icons.Default.Delete,

                                      contentDescription =
                                          "भुगतान हटाएँ",

                                      tint =
                                          Color(0xFFB3261E)
                                  )
                              }
                          }
                      }
                  }

                  if (edit) {

                      LabourDialog(
                          store = store,
                          existing = labour,
                          onClose = {
                              edit = false
                          }
                      )
                  }

                  if (payment) {

                      PaymentDialog(
                          store = store,
                          labourId = id,
                          preField = null,
                          preCrop = null,
                          onClose = {
                              payment = false
                          }
                      )
                  }

                  if (rate) {

                      RateDialog(
                          store = store,
                          labourId = id,
                          onClose = {
                              rate = false
                          }
                      )
                  }

                  delPay?.let { paymentItem ->

                      ConfirmDialog(
                          title = "भुगतान हटाएँ?",

                          message =
                              "यह payment record हट जाएगा.",

                          onYes = {
                              store.deletePayment(
                                  paymentItem.id
                              )

                              delPay = null
                          },

                          onNo = {
                              delPay = null
                          }
                      )
                  }
              }
          }

          '''

          text = (
              text[:start]
              + fixed_function
              + text[end:]
          )

          main_file.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "LABOURDETAIL() REPLACED SUCCESSFULLY."
          )
          PY


