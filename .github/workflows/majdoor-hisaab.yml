name: Majdoor Hisaab - Release APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Find source ZIP
      # --------------------------------------------------
      - name: Find Majdoor Hisaab ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -name "Majdoor_Hisaab_v1_1_source.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Majdoor_Hisaab_v1_1_source.zip नहीं मिली।"
            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f | sort
            exit 1
          fi

          echo "ZIP मिली:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 3. Extract ZIP
      # --------------------------------------------------
      - name: Extract Majdoor Hisaab ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/build-source"

          mkdir -p "$GITHUB_WORKSPACE/build-source"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/build-source"

          echo "ZIP extract हो गई।"

          echo ""
          echo "Extracted structure:"
          find "$GITHUB_WORKSPACE/build-source" \
            -maxdepth 5 \
            -type f | sort | head -300


      # --------------------------------------------------
      # 4. Locate Android project
      # --------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build-source" \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build-source" \
              -type f \
              -name "settings.gradle" \
              -print -quit \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project नहीं मिला।"

            echo ""
            echo "Gradle settings files:"
            find "$GITHUB_WORKSPACE/build-source" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print

            echo ""
            echo "Complete extracted structure:"
            find "$GITHUB_WORKSPACE/build-source" \
              -maxdepth 6 \
              -type f | sort

            exit 1
          fi

          echo "Android project मिला:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 5. Verify Android project
      # --------------------------------------------------
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

          if [ ! -f "settings.gradle.kts" ] && \
             [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle / settings.gradle.kts नहीं मिला"
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app folder नहीं मिला"
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && \
             [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) नहीं मिला"
            exit 1
          fi

          echo ""
          echo "Android project verification OK."


      # --------------------------------------------------
      # 6. Java 17
      # --------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 7. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"


      # --------------------------------------------------
      # 8. Install Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Installed Android SDK packages:"
          sdkmanager --list_installed


      # --------------------------------------------------
      # 9. Setup Gradle
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # --------------------------------------------------
      # 10. Prepare Gradle
      # --------------------------------------------------
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper मिला।"
          else
            echo "Gradle wrapper नहीं मिला।"
            echo "System Gradle इस्तेमाल होगा।"
          fi


      # --------------------------------------------------
      # 11. FIX JAVA / KOTLIN JVM TARGET
      #     Java 1.8 → Java 17
      #     Kotlin 1.8 → Kotlin 17
      # --------------------------------------------------
      - name: Fix Java Kotlin JVM Target
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Java/Kotlin JVM target को 17 किया जा रहा है..."

          if [ -f "app/build.gradle.kts" ]; then

            python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          # Java 1.8 को Java 17 करें
          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          s = s.replace(
              "JavaVersion.VERSION_8",
              "JavaVersion.VERSION_17"
          )

          # Kotlin JVM target 1.8 को 17 करें
          s = s.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          s = s.replace(
              'jvmTarget = "8"',
              'jvmTarget = "17"'
          )

          s = s.replace(
              "jvmTarget = '1.8'",
              "jvmTarget = '17'"
          )

          s = s.replace(
              "jvmTarget = '8'",
              "jvmTarget = '17'"
          )

          # अगर Java compileOptions नहीं हैं,
          # तो उन्हें जोड़ें
          if "compileOptions" not in s and "android {" in s:
              s = s.replace(
                  "android {",
                  """android {

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
                  1
              )

          # अगर Kotlin jvmTarget पहले से नहीं है,
          # तो Kotlin task level पर 17 लगाएं
          if 'jvmTarget = "17"' not in s:
              s += """

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          p.write_text(s)

          print("Patched: app/build.gradle.kts")
          PY

          else

            python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          # Java 1.8 → Java 17
          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          s = s.replace(
              "JavaVersion.VERSION_8",
              "JavaVersion.VERSION_17"
          )

          # Kotlin 1.8 → 17
          s = s.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          s = s.replace(
              'jvmTarget = "8"',
              'jvmTarget = "17"'
          )

          s = s.replace(
              "jvmTarget = '1.8'",
              "jvmTarget = '17'"
          )

          s = s.replace(
              "jvmTarget = '8'",
              "jvmTarget = '17'"
          )

          # Java compile options नहीं हैं तो जोड़ें
          if "compileOptions" not in s and "android {" in s:
              s = s.replace(
                  "android {",
                  """android {

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """,
                  1
              )

          # Kotlin task target 17
          if 'kotlinOptions.jvmTarget = "17"' not in s:
              s += """

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions.jvmTarget = "17"
          }
          """

          p.write_text(s)

          print("Patched: app/build.gradle")
          PY

          fi

          echo ""
          echo "===== FINAL JVM SETTINGS ====="

          grep -nEi \
            "VERSION_1_8|VERSION_8|VERSION_17|jvmTarget|compileOptions|kotlinOptions" \
            app/build.gradle* || true

          echo ""
          echo "Java/Kotlin JVM target fix complete."


      # --------------------------------------------------
      # 12. Build Release APK
      # --------------------------------------------------
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Release APK build शुरू..."

          if [ -f "./gradlew" ]; then

            ./gradlew \
              assembleRelease \
              --no-daemon \
              --stacktrace

          else

            gradle \
              assembleRelease \
              --no-daemon \
              --stacktrace

          fi


      # --------------------------------------------------
      # 13. Find Release APK
      # --------------------------------------------------
      - name: Find Release APK
        shell: bash
        run: |
          set -e

          echo "Release APK खोज रहे हैं..."

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | grep -i "release" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: Release APK नहीं मिली।"

            echo ""
            echo "Available output files:"

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          echo ""
          echo "Release APK मिली:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"

          echo ""
          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"


      # --------------------------------------------------
      # 14. Upload final APK
      # --------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-Release-APK
          path: Majdoor-Hisaab-Release.apk
          if-no-files-found: error
          retention-days: 30
