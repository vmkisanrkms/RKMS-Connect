name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V82-KOTLIN-COMPILE-FIXED.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. LOCATE ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATING ANDROID SDK"
          echo "=============================================="

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"

          else
            SDK_ROOT=$(find /usr/local/lib/android \
              -maxdepth 3 \
              -type d \
              -name "sdk" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name "sdkmanager" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "Android SDK:"
          echo "$SDK_ROOT"

          echo ""
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 4. INSTALL ANDROID SDK 36
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INSTALL ANDROID SDK 36"
          echo "=============================================="

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "ANDROID SDK INSTALLATION PASSED."


      # ============================================================
      # 5. VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY ANDROID SDK"
          echo "=============================================="

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"

          echo ""
          echo "ANDROID SDK VERIFICATION PASSED."


      # ============================================================
      # 6. SETUP GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # 7. VERIFY V82 ZIP
      # ============================================================

      - name: Verify V82 ZIP
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY V82 ZIP"
          echo "=============================================="

          if [ ! -f "$ZIP_NAME" ]; then
            echo ""
            echo "ERROR: V82 ZIP NOT FOUND."

            echo ""
            echo "Available ZIP files:"

            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print \
              | sort

            exit 1
          fi

          echo ""
          echo "V82 ZIP FOUND:"
          ls -lh "$ZIP_NAME"


      # ============================================================
      # 8. EXTRACT V82 PROJECT
      # ============================================================

      - name: Extract V82 Project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "EXTRACT V82 PROJECT"
          echo "=============================================="

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_NAME" -d build_source

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print \
            -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "PROJECT:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 9. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY ANDROID PROJECT"
          echo "=============================================="

          pwd

          test -d "app"

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo ""
          echo "ANDROID PROJECT VERIFIED."


      # ============================================================
      # 10. LOCATE KOTLIN SOURCES
      # ============================================================

      - name: Locate V82 Kotlin Sources
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE V82 KOTLIN SOURCES"
          echo "=============================================="

          KOTLIN_COUNT=$(find app/src/main \
            -type f \
            -name "*.kt" \
            | wc -l)

          echo ""
          echo "Kotlin source count:"
          echo "$KOTLIN_COUNT"

          if [ "$KOTLIN_COUNT" -eq 0 ]; then
            echo "ERROR: No Kotlin source files found."
            exit 1
          fi

          find app/src/main \
            -type f \
            -name "*.kt" \
            -print \
            | sort


      # ============================================================
      # 11. REPAIR ACTION-LESS btn()
      #
      # IMPORTANT:
      # btn( already contains an opening '('.
      # Therefore parser depth MUST start at 1.
      # ============================================================

      - name: Repair V82 Kotlin btn Actions
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "REPAIR V82 btn() ACTIONS"
          echo "=============================================="

          python3 <<'PY'
          from pathlib import Path

          root = Path("app/src/main")

          def find_close(s, start):
              depth = 1
              i = start
              mode = "normal"

              while i < len(s):

                  if mode == "normal":

                      if s.startswith('"""', i):
                          mode = "triple"
                          i += 3
                          continue

                      c = s[i]

                      if c == '"':
                          mode = "string"
                          i += 1
                          continue

                      if c == "'":
                          mode = "char"
                          i += 1
                          continue

                      if c == "(":
                          depth += 1

                      elif c == ")":
                          depth -= 1

                          if depth == 0:
                              return i

                      i += 1

                  elif mode == "string":

                      if s[i] == "\\":
                          i += 2
                          continue

                      if s[i] == '"':
                          mode = "normal"

                      i += 1

                  elif mode == "char":

                      if s[i] == "\\":
                          i += 2
                          continue

                      if s[i] == "'":
                          mode = "normal"

                      i += 1

                  else:

                      if s.startswith('"""', i):
                          mode = "normal"
                          i += 3
                      else:
                          i += 1

              return None


          def has_top_level_comma(content):

              depth = 0
              i = 0
              mode = "normal"

              while i < len(content):

                  if mode == "normal":

                      if content.startswith('"""', i):
                          mode = "triple"
                          i += 3
                          continue

                      c = content[i]

                      if c == '"':
                          mode = "string"

                      elif c == "'":
                          mode = "char"

                      elif c == "(":
                          depth += 1

                      elif c == ")":
                          depth -= 1

                      elif c == "," and depth == 0:
                          return True

                      i += 1

                  elif mode == "string":

                      if content[i] == "\\":
                          i += 2
                          continue

                      if content[i] == '"':
                          mode = "normal"

                      i += 1

                  elif mode == "char":

                      if content[i] == "\\":
                          i += 2
                          continue

                      if content[i] == "'":
                          mode = "normal"

                      i += 1

                  else:

                      if content.startswith('"""', i):
                          mode = "normal"
                          i += 3
                      else:
                          i += 1

              return False


          total = 0

          for path in root.rglob("*.kt"):

              text = path.read_text(
                  encoding="utf-8"
              )

              patches = []
              i = 0

              while True:

                  j = text.find("btn(", i)

                  if j < 0:
                      break

                  k = find_close(
                      text,
                      j + 4
                  )

                  if k is None:
                      raise SystemExit(
                          f"Cannot parse btn() in {path}"
                      )

                  content = text[j + 4:k]

                  if has_top_level_comma(content):
                      i = k + 1
                      continue

                  nxt = k + 1

                  while (
                      nxt < len(text)
                      and text[nxt].isspace()
                  ):
                      nxt += 1

                  if (
                      nxt < len(text)
                      and text[nxt] == "{"
                  ):
                      i = k + 1
                      continue

                  patches.append(k + 1)
                  i = k + 1

              if patches:

                  for pos in reversed(patches):
                      text = (
                          text[:pos]
                          + " {}"
                          + text[pos:]
                      )

                  path.write_text(
                      text,
                      encoding="utf-8"
                  )

                  print(
                      f"PATCHED: {path} "
                      f"({len(patches)} calls)"
                  )

                  total += len(patches)

          print("")
          print("TOTAL btn() FIXES:", total)
          print("btn() repair completed.")
          PY


      # ============================================================
      # 12. FIX ACTUAL CURRENT COMPILE ERROR
      #
      # MainActivityScreens.kt:602
      #
      # Problem:
      #
      # val type = field(...)
      #
      # Intent(...).apply {
      #     type = "image/*"
      # }
      #
      # Kotlin resolves type to the surrounding EditText variable.
      #
      # Correct:
      #
      # this.type = "image/*"
      # ============================================================

      - name: Fix Intent Type Receiver Shadowing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FIX INTENT TYPE RECEIVER SHADOWING"
          echo "=============================================="

          SRC="app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"

          if [ ! -f "$SRC" ]; then
            echo "ERROR: MainActivityScreens.kt not found."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"
          )

          text = p.read_text(
              encoding="utf-8"
          )

          replacements = {
              '.apply{type="image/*";':
                  '.apply{this.type="image/*";',

              '.apply{type="*/*";':
                  '.apply{this.type="*/*";',

              '.apply{type="application/zip";':
                  '.apply{this.type="application/zip";',
          }

          total = 0

          for old, new in replacements.items():

              count = text.count(old)

              if count:
                  text = text.replace(
                      old,
                      new
                  )
                  total += count
                  print(
                      f"FIXED {count} occurrence(s): "
                      f"{old} -> {new}"
                  )

          p.write_text(
              text,
              encoding="utf-8"
          )

          print("")
          print(
              "TOTAL INTENT TYPE FIXES:",
              total
          )
          PY

          echo ""
          echo "VERIFYING NO UNSAFE INTENT TYPE ASSIGNMENTS..."

          if grep -n \
            -E 'apply\{type=' \
            "$SRC"; then

            echo ""
            echo "ERROR: Unsafe Intent type assignment remains."
            exit 1
          fi

          echo ""
          echo "INTENT TYPE FIX PASSED."


      # ============================================================
      # 13. VERIFY REPAIR INTEGRITY
      # ============================================================

      - name: Verify V82 Repair Integrity
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY V82 REPAIR INTEGRITY"
          echo "=============================================="


          echo ""
          echo "CHECK: corrupted listOf() expressions"

          if grep -R -n -E \
            'listOf\([^)]*\)\{\}[+]' \
            app/src/main \
            --include="*.kt"; then

            echo "ERROR: listOf() corruption detected."
            exit 1
          fi


          echo ""
          echo "CHECK: corrupted toTypedArray() expressions"

          if grep -R -n \
            '){}\.toTypedArray' \
            app/src/main \
            --include="*.kt"; then

            echo "ERROR: toTypedArray corruption detected."
            exit 1
          fi


          echo ""
          echo "CHECK: invalid fillViewport assignment"

          if grep -R -n \
            'fillViewport[[:space:]]*=' \
            app/src/main \
            --include="*.kt" \
            --include="*.java"; then

            echo "ERROR: Invalid fillViewport assignment."
            exit 1
          fi


          echo ""
          echo "CHECK: invalid btn lambda parameter"

          if grep -R -n -E \
            'btn\(.*\)\{[[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*->' \
            app/src/main \
            --include="*.kt"; then

            echo "ERROR: Invalid btn lambda parameter."
            exit 1
          fi


          echo ""
          echo "CHECK: invalid lateinit Button workaround"

          if grep -R -n -E \
            'lateinit[[:space:]]+var[[:space:]].*:[[:space:]]*Button' \
            app/src/main \
            --include="*.kt"; then

            echo "ERROR: Invalid lateinit Button workaround."
            exit 1
          fi


          echo ""
          echo "CHECK: old exportType when()"

          if grep -R -n \
            'when(exportType)' \
            app/src/main \
            --include="*.kt"; then

            echo "ERROR: Old when(exportType) found."
            exit 1
          fi


          echo ""
          echo "CHECK: pick() return type"

          if grep -R -n -E \
            'fun[[:space:]]+MainActivity\.pick.*:[[:space:]]*Button' \
            app/src/main \
            --include="*.kt"; then

            echo "ERROR: pick() still returns Button."
            exit 1
          fi


          echo ""
          echo "REPAIR INTEGRITY PASSED."


      # ============================================================
      # 14. FINAL ACTIONLESS btn() SCAN
      # ============================================================

      - name: Final btn Audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FINAL btn() AUDIT"
          echo "=============================================="

          python3 <<'PY'
          from pathlib import Path

          root = Path("app/src/main")


          def find_close(s, start):

              depth = 1
              i = start
              mode = "normal"

              while i < len(s):

                  if mode == "normal":

                      if s.startswith('"""', i):
                          mode = "triple"
                          i += 3
                          continue

                      c = s[i]

                      if c == '"':
                          mode = "string"

                      elif c == "'":
                          mode = "char"

                      elif c == "(":
                          depth += 1

                      elif c == ")":
                          depth -= 1

                          if depth == 0:
                              return i

                      i += 1

                  elif mode == "string":

                      if s[i] == "\\":
                          i += 2
                          continue

                      if s[i] == '"':
                          mode = "normal"

                      i += 1

                  elif mode == "char":

                      if s[i] == "\\":
                          i += 2
                          continue

                      if s[i] == "'":
                          mode = "normal"

                      i += 1

                  else:

                      if s.startswith('"""', i):
                          mode = "normal"
                          i += 3
                      else:
                          i += 1

              return None


          def has_top_level_comma(content):

              depth = 0
              i = 0
              mode = "normal"

              while i < len(content):

                  if mode == "normal":

                      if content.startswith('"""', i):
                          mode = "triple"
                          i += 3
                          continue

                      c = content[i]

                      if c == '"':
                          mode = "string"

                      elif c == "'":
                          mode = "char"

                      elif c == "(":
                          depth += 1

                      elif c == ")":
                          depth -= 1

                      elif c == "," and depth == 0:
                          return True

                      i += 1

                  elif mode == "string":

                      if content[i] == "\\":
                          i += 2
                          continue

                      if content[i] == '"':
                          mode = "normal"

                      i += 1

                  elif mode == "char":

                      if content[i] == "\\":
                          i += 2
                          continue

                      if content[i] == "'":
                          mode = "normal"

                      i += 1

                  else:

                      if content.startswith('"""', i):
                          mode = "normal"
                          i += 3
                      else:
                          i += 1

              return False


          suspicious = []


          for path in root.rglob("*.kt"):

              text = path.read_text(
                  encoding="utf-8"
              )

              i = 0

              while True:

                  j = text.find("btn(", i)

                  if j < 0:
                      break

                  k = find_close(
                      text,
                      j + 4
                  )

                  if k is None:
                      raise SystemExit(
                          f"Cannot parse {path}"
                      )

                  content = text[j + 4:k]

                  if has_top_level_comma(content):
                      i = k + 1
                      continue

                  nxt = k + 1

                  while (
                      nxt < len(text)
                      and text[nxt].isspace()
                  ):
                      nxt += 1

                  if (
                      nxt < len(text)
                      and text[nxt] == "{"
                  ):
                      i = k + 1
                      continue

                  line = (
                      text.count("\n", 0, j)
                      + 1
                  )

                  suspicious.append(
                      f"{path}:{line}"
                  )

                  i = k + 1


          if suspicious:

              print("")
              print(
                  "ERROR: Actionless btn() calls remain:"
              )

              for x in suspicious:
                  print(x)

              raise SystemExit(1)


          print("")
          print("PASS: No actionless btn() calls remain.")
          PY

          echo ""
          echo "FINAL btn AUDIT PASSED."


      # ============================================================
      # 15. GRADLE ENVIRONMENT
      # ============================================================

      - name: Gradle Environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE ENVIRONMENT"
          echo "=============================================="

          java -version

          echo ""
          gradle --version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"


      # ============================================================
      # 16. CLEAN
      # ============================================================

      - name: Clean Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "CLEAN PROJECT"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            clean

          echo ""
          echo "CLEAN PASSED."


      # ============================================================
      # 17. COMPILE RELEASE KOTLIN
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --rerun-tasks \
            :app:compileReleaseKotlin

          echo ""
          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN PASSED"
          echo "=============================================="


      # ============================================================
      # 18. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ASSEMBLE RELEASE APK"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --rerun-tasks \
            :app:assembleRelease

          echo ""
          echo "=============================================="
          echo "ASSEMBLE RELEASE APK PASSED"
          echo "=============================================="


      # ============================================================
      # 19. LOCATE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*release*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "RELEASE APK:"
          ls -lh "$APK"


      # ============================================================
      # 20. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK Package
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY APK PACKAGE"
          echo "=============================================="

          APK="$APK_PATH"

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging "$APK"
          )

          echo "$BADGING" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          if ! echo "$BADGING" | grep -q \
            "name='$PACKAGE_NAME'"; then

            echo "ERROR: Package name mismatch."
            exit 1
          fi

          echo ""
          echo "PACKAGE NAME VERIFIED."


      # ============================================================
      # 21. RESTORE KEYSTORE
      # ============================================================

      - name: Restore Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "=============================================="
          echo "RESTORE RELEASE KEYSTORE"
          echo "=============================================="

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo ""
          echo "KEYSTORE RESTORED."


      # ============================================================
      # 22. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ZIPALIGN RELEASE APK"
          echo "=============================================="

          INPUT_APK="$APK_PATH"
          ALIGNED_APK="$RUNNER_TEMP/$APK_UNSIGNED_NAME"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          if [ ! -f "$ALIGNED_APK" ]; then
            echo "ERROR: Zipaligned APK not created."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c \
            -v \
            4 \
            "$ALIGNED_APK"

          echo "ALIGNED_APK=$ALIGNED_APK" >> "$GITHUB_ENV"

          echo ""
          echo "ZIPALIGN PASSED."


      # ============================================================
      # 23. SIGN APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "=============================================="
          echo "SIGN RELEASE APK"
          echo "=============================================="

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          SIGNED_APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks release-keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          if [ ! -f "$SIGNED_APK" ]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          echo ""
          echo "SIGNED APK:"
          ls -lh "$SIGNED_APK"


      # ============================================================
      # 24. VERIFY SIGNATURE
      # ============================================================

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY APK SIGNATURE"
          echo "=============================================="

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE VERIFIED."


      # ============================================================
      # 25. FINAL APK VALIDATION
      # ============================================================

      - name: Final APK Validation
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FINAL APK VALIDATION"
          echo "=============================================="

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final APK missing."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          echo ""
          echo "APK SIZE:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK size unexpectedly small."
            exit 1
          fi

          echo ""
          echo "FINAL APK:"
          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "=============================================="
          echo "FINAL APK VALIDATION PASSED"
          echo "=============================================="


      # ============================================================
      # 26. UPLOAD SIGNED APK
      # ============================================================

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: ${{ env.APK_SIGNED_NAME }}
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 27. UPLOAD BUILD REPORTS
      # ============================================================

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/**
          if-no-files-found: warn
          retention-days: 14
