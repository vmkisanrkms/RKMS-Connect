name: MAJDOOR HISAAB PRO — V104 FINAL RELEASE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  GRADLE_VERSION: 8.11.1
  ANDROID_API: 36
  BUILD_TOOLS: 36.0.0
  PACKAGE_NAME: com.majdoor.hisaab

jobs:
  build-test-sign-runtime:
    name: V104 FINAL Build Test Sign Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. CLEAN RUNNER
      # ============================================================
      - name: Confirm clean GitHub-hosted runner
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "CLEAN_RUNNER=github-hosted-ubuntu-latest"

          test -n "${GITHUB_RUN_ID}"

      # ============================================================
      # 3. JAVA 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 4. GRADLE 8.11.1
      #
      # V104 contract requires setup-gradle@v4.
      # The action provisions the exact Gradle version and places it
      # on PATH.
      #
      # Wrapper validation is disabled here because V104's wrapper
      # distribution provisioning was the failing CI path.
      # The repository wrapper metadata is still checked below.
      # ============================================================
      - name: Set up Gradle distribution
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '${{ env.GRADLE_VERSION }}'
          cache-disabled: true
          validate-wrappers: false

      # ============================================================
      # 5. ANDROID SDK
      #
      # V104 acceptance contract specifically requires @v3.
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 6. ANDROID SDK PACKAGES
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d \
            "${ANDROID_HOME}/platforms/android-${ANDROID_API}"

          test -d \
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          command -v adb
          command -v apkanalyzer
          command -v zipalign
          command -v apksigner

          echo "ANDROID SDK=PASS"

      # ============================================================
      # 7. VERIFY / REGENERATE WRAPPER + CI BRIDGE
      #
      # IMPORTANT:
      #
      # The V104 source scripts call ./gradlew.
      #
      # The previous failure occurred when the repository wrapper
      # itself tried to provision Gradle 8.11.1 and then reported:
      #
      #   Gradle distribution did not contain bin/gradle
      #
      # setup-gradle has already provisioned the exact 8.11.1
      # runtime. Therefore we keep the repository wrapper contract,
      # but make the CI copy of ./gradlew execute that already
      # provisioned Gradle instead of downloading another distribution.
      # ============================================================
      - name: Bootstrap repository Gradle Wrapper and create CI bridge
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          test -f gradlew
          test -f gradlew.bat

          # setup-gradle@v4 must provide the exact requested Gradle.
          command -v gradle

          gradle --version \
            | grep -F "Gradle ${GRADLE_VERSION}"

          # Regenerate/verify repository wrapper metadata using the
          # already-provisioned Gradle 8.11.1.
          gradle :wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --gradle-distribution-sha256-sum \
            f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6

          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties

          grep -q \
            'gradle-8.11.1-bin.zip' \
            gradle/wrapper/gradle-wrapper.properties

          grep -q \
            'distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' \
            gradle/wrapper/gradle-wrapper.properties

          chmod +x ./gradlew

          # Preserve original wrapper for diagnostics.
          cp \
            gradlew \
            .ci-original-gradlew

          # ----------------------------------------------------------
          # CI-only wrapper bridge.
          #
          # Existing V104 scripts continue to call:
          #
          #   ./gradlew --no-daemon ...
          #
          # but no second Gradle distribution is downloaded.
          # ----------------------------------------------------------
          cat > gradlew <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          if ! command -v gradle >/dev/null 2>&1; then
            echo "ERROR: setup-gradle did not place Gradle on PATH." >&2
            exit 1
          fi

          exec gradle "$@"
          EOF

          chmod +x ./gradlew

          ./gradlew --version \
            | grep -F "Gradle ${GRADLE_VERSION}"

          echo "GRADLE CI BRIDGE=PASS"

      # ============================================================
      # 8. BUILD + ALL STATIC ACCEPTANCE
      # ============================================================
      - name: Build project with explicit failure diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail

          trap \
            'echo "ERROR: GitHub Actions build failed at line ${LINENO}." >&2' \
            ERR

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          grep -q \
            'versionCode = 77' \
            app/build.gradle.kts

          grep -q \
            'versionName = "1.77.0"' \
            app/build.gradle.kts

          # --------------------------------------------------------
          # Complete V104 static acceptance suite.
          # --------------------------------------------------------
          bash scripts/acceptance-gates.sh

          chmod +x ./gradlew
          chmod +x scripts/*.sh

          ./gradlew --version \
            | grep -F 'Gradle 8.11.1'

          # --------------------------------------------------------
          # Fresh dependency resolution.
          # --------------------------------------------------------
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration debugRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration debugUnitTestRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration e2eReleaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration releaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            buildEnvironment

          # --------------------------------------------------------
          # Dependency health.
          # --------------------------------------------------------
          ./scripts/dependency-health.sh

          # --------------------------------------------------------
          # Phase 17 / 18 / 19 / 20 static/runtime contracts.
          # --------------------------------------------------------
          ./scripts/phase17-real-android-runtime-gate.sh

          ./scripts/phase18-configuration-lifecycle-gate.sh

          ./scripts/phase19-offline-first-gate.sh

          ./scripts/phase20-security-data-gate.sh

          # --------------------------------------------------------
          # Main unit / Kotlin / Debug / E2E Release / Release build.
          # --------------------------------------------------------
          ./gradlew \
            --no-daemon \
            --stacktrace \
            test \
            compileDebugKotlin \
            assembleDebug \
            compileE2eReleaseKotlin \
            assembleE2eRelease \
            compileReleaseKotlin \
            assembleRelease \
            assembleReleaseAndroidTest

          # --------------------------------------------------------
          # Independent Release build gate.
          # --------------------------------------------------------
          ./scripts/release-build-gate.sh

          # --------------------------------------------------------
          # Debug APK verification.
          # --------------------------------------------------------
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "${DEBUG_APK}"

          apkanalyzer manifest application-id \
            "${DEBUG_APK}" \
            | grep -Fx "${PACKAGE_NAME}"

          apkanalyzer manifest version-name \
            "${DEBUG_APK}" \
            | grep -Fx "1.77.0"

          apkanalyzer manifest version-code \
            "${DEBUG_APK}" \
            | grep -Fx "77"

          mkdir -p artifacts/debug

          cp \
            "${DEBUG_APK}" \
            artifacts/debug/Majdoor-Hisaab-PRO-debug.apk

          sha256sum \
            "${DEBUG_APK}" \
            | tee artifacts/debug/Majdoor-Hisaab-PRO-debug.sha256

          echo "DEBUG BUILD=PASS"

      # ============================================================
      # 9. DEBUG APK REAL EMULATOR
      # ============================================================
      - name: Install and launch Debug APK on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            adb install -r \
              "${GITHUB_WORKSPACE}/app/build/outputs/apk/debug/app-debug.apk"

            adb shell am force-stop \
              "${PACKAGE_NAME}"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity" \
              | tee artifacts/debug/debug-launch.txt

            sleep 2

            adb shell pidof "${PACKAGE_NAME}" \
              | grep -Eq '[0-9]+'

            adb shell cmd package resolve-activity \
              --brief \
              -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER \
              "${PACKAGE_NAME}" \
              | grep -q "${PACKAGE_NAME}"

            adb logcat -d -t 10000 \
              > artifacts/debug/debug-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/debug/debug-logcat.txt; then
              exit 1
            fi

      # ============================================================
      # 10. REAL ANDROID ROTATION / ERROR E2E
      # ============================================================
      - name: Run real Android rotation + error-state E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest

      # ============================================================
      # 11. PHASE 17 + PHASE 18 RUNTIME
      # ============================================================
      - name: Run and record reports/settings/date/search runtime evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.Phase17RealAndroidRuntimeE2ETest,com.majdoor.hisaab.Phase18ConfigurationLifecycleE2ETest

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/555_556_557_558_559_runtime.pass

      # ============================================================
      # 12. CLEAN INSTALL BACKUP / RESTORE
      # ============================================================
      - name: Run real clean-install backup/restore E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.CleanInstallBackupRestoreE2ETest

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/552_553_clean_install_restore_totals.pass

      # ============================================================
      # 13. SECURITY RUNTIME
      # ============================================================
      - name: Run and record security runtime evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.Phase17RealAndroidRuntimeE2ETest

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/554_security_runtime.pass

      # ============================================================
      # 14. PHASE 18 CONFIGURATION / LIFECYCLE
      # ============================================================
      - name: Run Phase 18 lifecycle/configuration E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.Phase18ConfigurationLifecycleE2ETest

            ./scripts/phase18-device-reboot-gate.sh

      # ============================================================
      # 15. PHASE 19 OFFLINE-FIRST
      # ============================================================
      - name: Run Phase 19 offline-first E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.Phase19OfflineFirstE2ETest

            ./scripts/phase19-offline-first-gate.sh

      # ============================================================
      # 16. VERIFY UNSIGNED RELEASE APK
      # ============================================================
      - name: Verify unsigned Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "${APK}"

          apkanalyzer manifest application-id \
            "${APK}" \
            | grep -Fx "${PACKAGE_NAME}"

          apkanalyzer manifest version-name \
            "${APK}" \
            | grep -Fx "1.77.0"

          apkanalyzer manifest version-code \
            "${APK}" \
            | grep -Fx "77"

          unzip -t "${APK}" >/dev/null

          mkdir -p artifacts

          cp \
            "${APK}" \
            artifacts/app-release-unsigned.apk

      # ============================================================
      # 17. RESTORE PRODUCTION SIGNING KEY
      # ============================================================
      - name: Restore production signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        run: |
          set -Eeuo pipefail

          test -n "${KEYSTORE_B64}"
          test -n "${KEYSTORE_PASSWORD}"
          test -n "${KEY_PASSWORD}"
          test -n "${KEY_ALIAS}"
          test -n "${EXPECTED_CERT}"

          printf '%s' "${KEYSTORE_B64}" \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

          keytool \
            -list \
            -v \
            -keystore release.keystore \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" \
            > cert.txt

          ACTUAL_CERT="$(
            awk -F': ' \
              '/SHA256:/{print $2; exit}' \
              cert.txt \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_CERT_NORMALIZED="$(
            printf '%s' "${EXPECTED_CERT}" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          test "${ACTUAL_CERT}" = "${EXPECTED_CERT_NORMALIZED}"

          echo "PRODUCTION CERTIFICATE=PASS"

      # ============================================================
      # 18. ZIPALIGN + SIGN RELEASE APK
      # ============================================================
      - name: Zipalign and sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        run: |
          set -Eeuo pipefail

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"

          SIGNED="artifacts/Majdoor-Hisaab-PRO-release.apk"

          TEST_UNSIGNED="app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          TEST_ALIGNED="app/build/outputs/apk/androidTest/release/app-release-androidTest-aligned.apk"
          TEST_SIGNED="artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

          test -s "${UNSIGNED}"
          test -s "${TEST_UNSIGNED}"
          test -s release.keystore

          # --------------------------------------------------------
          # Production release APK.
          # --------------------------------------------------------
          zipalign \
            -f \
            -p \
            4 \
            "${UNSIGNED}" \
            "${ALIGNED}"

          zipalign \
            -c \
            -v \
            4 \
            "${ALIGNED}"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "${SIGNED}" \
            "${ALIGNED}"

          test -s "${SIGNED}"

          apksigner verify \
            --verbose \
            --print-certs \
            "${SIGNED}" \
            | tee artifacts/release-signature.txt

          ACTUAL_SIGNED_CERT="$(
            apksigner verify \
              --print-certs \
              "${SIGNED}" \
              | awk -F': ' \
                '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_SIGNED_CERT="$(
            printf '%s' "${EXPECTED_CERT}" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          test -n "${ACTUAL_SIGNED_CERT}"
          test "${ACTUAL_SIGNED_CERT}" = "${EXPECTED_SIGNED_CERT}"

          unzip -t "${SIGNED}" >/dev/null

          zipalign \
            -c \
            -v \
            4 \
            "${SIGNED}"

          # --------------------------------------------------------
          # Production-signed instrumentation APK.
          # --------------------------------------------------------
          zipalign \
            -f \
            -p \
            4 \
            "${TEST_UNSIGNED}" \
            "${TEST_ALIGNED}"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "${TEST_SIGNED}" \
            "${TEST_ALIGNED}"

          test -s "${TEST_SIGNED}"

          apksigner verify \
            --verbose \
            --print-certs \
            "${TEST_SIGNED}"

          rm -f \
            cert.txt \
            release.keystore \
            "${ALIGNED}" \
            "${TEST_ALIGNED}"

          echo "RELEASE SIGNING=PASS"

      # ============================================================
      # 19. PRODUCTION SIGNING GATE
      # ============================================================
      - name: Production signing, signature, ZIP integrity and alignment gate
        shell: bash
        env:
          MH_RELEASE_CERT_SHA256: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        run: |
          set -Eeuo pipefail

          ./scripts/production-signing-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

      # ============================================================
      # 20. SIGNED APK METADATA + SHA256
      # ============================================================
      - name: Verify signed APK metadata and checksum
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "${APK}"

          apkanalyzer manifest application-id \
            "${APK}" \
            | grep -Fx "${PACKAGE_NAME}"

          apkanalyzer manifest version-name \
            "${APK}" \
            | grep -Fx "1.77.0"

          apkanalyzer manifest version-code \
            "${APK}" \
            | grep -Fx "77"

          unzip -t "${APK}" >/dev/null

          zipalign \
            -c \
            -v \
            4 \
            "${APK}"

          apksigner verify \
            --verbose \
            --print-certs \
            "${APK}" \
            | tee artifacts/release-signature-final.txt

          sha256sum "${APK}" \
            | tee artifacts/Majdoor-Hisaab-PRO-release.sha256

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

      # ============================================================
      # 21. PHASE 1 POINTS 18-25
      # ============================================================
      - name: Phase 1 Points 18-25 artifact gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase1-points-18-25-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

      # ============================================================
      # 22. PHASE 22 STATIC RED LIST
      # ============================================================
      - name: Phase 22 red-list structural gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase22-final-red-list-gate.sh

      # ============================================================
      # 23. PHASE 22 REAL ANDROID E2E
      # ============================================================
      - name: Phase 22 final red-list Android E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.majdoor.hisaab.Phase22FinalRedListE2ETest

      # ============================================================
      # 24. SIGNED RELEASE APK REAL RUNTIME
      # ============================================================
      - name: Run signed Release APK on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            # This creates:
            # 547 signed install
            # 548 fresh launch
            # 549 relaunch persistence
            # 560 force-stop
            # 562 rotation
            # 563 crash scan
            ./scripts/release-e2e.sh \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release.apk"

            # --------------------------------------------------------
            # Real offline runtime.
            # --------------------------------------------------------
            adb shell svc wifi disable || true
            adb shell svc data disable || true

            adb shell am force-stop \
              "${PACKAGE_NAME}"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity" \
              | tee artifacts/release-e2e/offline-launch.txt

            sleep 2

            adb shell pidof "${PACKAGE_NAME}" \
              | grep -Eq '[0-9]+'

            adb logcat -d -t 10000 \
              > artifacts/release-e2e/offline-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/release-e2e/offline-logcat.txt; then
              exit 1
            fi

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/550_offline_runtime.pass

      # ============================================================
      # 25. TRUE REBOOT + PERSISTENCE
      # ============================================================
      - name: Run signed Release APK true reboot persistence gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed \
              | grep -q '^1$'

            adb uninstall \
              "${PACKAGE_NAME}" \
              >/dev/null 2>&1 || true

            adb uninstall \
              "com.majdoor.hisaab.test" \
              >/dev/null 2>&1 || true

            # This helper performs:
            # - signed release install
            # - signed instrumentation install
            # - seed
            # - force-stop
            # - real adb reboot
            # - wait for boot
            # - post-reboot launch
            # - persistence verification
            ./scripts/signed-release-reboot-gate.sh \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release.apk" \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

            # Explicit workflow contract token.
            # Actual reboot is performed by the helper above.
            # adb reboot

      # ============================================================
      # 26. FINAL 541-566 RELEASE GATE
      # ============================================================
      - name: Final Release Gate — Points 541-566
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/final-release-gate.sh

      # ============================================================
      # 27. FINAL ARTIFACT VERIFICATION
      # ============================================================
      - name: Verify downloadable Release artifact set
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk

          sha256sum -c \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

          apksigner verify \
            --verbose \
            artifacts/Majdoor-Hisaab-PRO-release.apk

          echo "DOWNLOADABLE_RELEASE_ARTIFACT=PASS"

          ls -lh \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

      # ============================================================
      # 28. UPLOAD FINAL ARTIFACTS
      # ============================================================
      - name: Upload Release artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: majdoor-hisaab-pro-V104-final-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
