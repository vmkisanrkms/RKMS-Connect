name: MAJDOOR HISAAB PRO - FINAL RELEASE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  PACKAGE_NAME: "com.majdoor.hisaab"

jobs:
  build-test-sign-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm clean GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${GITHUB_RUN_ID}"
          echo "CLEAN_RUNNER=PASS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x ./gradlew

          gradle --version | grep -F "Gradle ${GRADLE_VERSION}"

          gradle :wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --gradle-distribution-sha256-sum f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6

          test -s gradle/wrapper/gradle-wrapper.jar

          ./gradlew --version | grep -F "Gradle ${GRADLE_VERSION}"

      - name: Static audit
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x scripts/*.sh

          ./scripts/acceptance-gates.sh
          ./scripts/dependency-health.sh
          ./scripts/phase17-real-android-runtime-gate.sh
          ./scripts/phase18-configuration-lifecycle-gate.sh
          ./scripts/phase19-offline-first-gate.sh
          ./scripts/phase20-security-data-gate.sh
          ./scripts/phase22-final-red-list-gate.sh

      - name: Build and test
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            test \
            compileDebugKotlin \
            assembleDebug \
            compileE2eReleaseKotlin \
            assembleE2eRelease \
            compileReleaseKotlin \
            assembleRelease \
            assembleReleaseAndroidTest

          ./scripts/release-build-gate.sh

      - name: Verify Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" \
            | grep -Fx "1.77.0"

          apkanalyzer manifest version-code "$APK" \
            | grep -Fx "77"

          mkdir -p artifacts

          cp "$APK" artifacts/app-release-unsigned.apk

      - name: Restore production keystore
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$EXPECTED_CERT"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

          keytool \
            -list \
            -v \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > cert.txt

          ACTUAL_CERT=$(
            awk -F': ' '/SHA256:/{print $2; exit}' cert.txt |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )

          EXPECTED_CERT_NORMALIZED=$(
            printf '%s' "$EXPECTED_CERT" |
            tr -d ' ' |
            tr '[:lower:]' '[:upper:]'
          )

          test "$ACTUAL_CERT" = "$EXPECTED_CERT_NORMALIZED"

      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}

        shell: bash
        run: |
          set -Eeuo pipefail

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="artifacts/Majdoor-Hisaab-PRO-release.apk"

          zipalign -f -p 4 \
            "$UNSIGNED" \
            "$ALIGNED"

          zipalign -c -v 4 "$ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$SIGNED"

          unzip -t "$SIGNED" >/dev/null

          sha256sum "$SIGNED" \
            | tee artifacts/Majdoor-Hisaab-PRO-release.sha256

      - name: Production signing gate
        env:
          MH_RELEASE_CERT_SHA256: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/production-signing-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

      - name: API 36 Release E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed |
              grep -q '^1$'

            ./scripts/release-e2e.sh \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release.apk"

      - name: Signed Release reboot persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            adb shell getprop sys.boot_completed |
              grep -q '^1$'

            ./scripts/signed-release-reboot-gate.sh \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release.apk" \
              "${GITHUB_WORKSPACE}/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"

      - name: Final Release Gate 541-566
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/final-release-gate.sh

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-FINAL
          path: |
            artifacts/Majdoor-Hisaab-PRO-release.apk
            artifacts/Majdoor-Hisaab-PRO-release.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f release.keystore
          rm -f cert.txt
