name: Majdoor Hisaab PRO - Final Signed Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

jobs:
  build-release-test-sign-runtime:
    name: Build, Sign, Runtime Audit and Final APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: CLEAN_RUNNER=github-hosted-ubuntu-latest
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "CLEAN_RUNNER=github-hosted-ubuntu-latest"
          echo "JAVA_VERSION=${JAVA_VERSION}"
          echo "GRADLE_VERSION=${GRADLE_VERSION}"
          echo "ANDROID_API=${ANDROID_API}"
          echo "BUILD_TOOLS=${BUILD_TOOLS}"
          echo "PACKAGE_NAME=${PACKAGE_NAME}"
          echo "VERSION_NAME=${VERSION_NAME}"
          echo "VERSION_CODE=${VERSION_CODE}"

      # ==========================================================
      # 2. EXTRACT ACTUAL PROJECT FROM ZIP
      # ==========================================================

      - name: Extract Majdoor Hisaab project from ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP="Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104.zip"

          test -f "$ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml
          test -f project/gradlew
          test -f project/gradlew.bat
          test -f project/gradle/wrapper/gradle-wrapper.jar
          test -f project/gradle/wrapper/gradle-wrapper.properties

          chmod +x project/gradlew

          if compgen -G "project/scripts/*.sh" > /dev/null; then
            chmod +x project/scripts/*.sh
          fi

          echo "PROJECT_EXTRACT=PASS"

      # ==========================================================
      # 3. INSTALL WORKFLOW INTO EXTRACTED PROJECT
      # ==========================================================

      - name: Install workflow into extracted project
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p project/.github/workflows

          WORKFLOW_REF="${GITHUB_WORKFLOW_REF}"

          WORKFLOW_PATH="${WORKFLOW_REF#*/.github/workflows/}"
          WORKFLOW_FILE="${WORKFLOW_PATH%%@*}"

          echo "Detected workflow file: ${WORKFLOW_FILE}"

          SOURCE_WORKFLOW="${GITHUB_WORKSPACE}/.github/workflows/${WORKFLOW_FILE}"

          test -f "$SOURCE_WORKFLOW"

          cp \
            "$SOURCE_WORKFLOW" \
            project/.github/workflows/build-release-apk.yml

          test -s \
            project/.github/workflows/build-release-apk.yml

          echo "SOURCE_WORKFLOW=${SOURCE_WORKFLOW}"
          echo "REQUIRED_WORKFLOW=project/.github/workflows/build-release-apk.yml"
          echo "WORKFLOW_IN_PROJECT=PASS"

      # ==========================================================
      # 4. JAVA 17
      # ==========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==========================================================
      # 5. GRADLE
      # ==========================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      # ==========================================================
      # 6. ANDROID SDK
      # ==========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 36 and Build Tools 36
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          sdkmanager --list_installed | grep -E \
            "platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}|platform-tools"

          echo "ANDROID_SDK_INSTALL=PASS"

      # ==========================================================
      # 7. EXACT CONFIGURATION AUDIT
      # ==========================================================

      - name: Audit Gradle Kotlin Android and version configuration
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -Fq \
            'id("com.android.application") version "8.9.1"' \
            build.gradle.kts

          grep -Fq \
            'id("org.jetbrains.kotlin.android") version "2.1.21"' \
            build.gradle.kts

          grep -Fq \
            'compileSdk = 36' \
            app/build.gradle.kts

          grep -Fq \
            'targetSdk = 36' \
            app/build.gradle.kts

          grep -Fq \
            'applicationId = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -Fq \
            'versionCode = 77' \
            app/build.gradle.kts

          grep -Fq \
            'versionName = "1.77.0"' \
            app/build.gradle.kts

          grep -Fq \
            'sourceCompatibility = JavaVersion.VERSION_17' \
            app/build.gradle.kts

          grep -Fq \
            'targetCompatibility = JavaVersion.VERSION_17' \
            app/build.gradle.kts

          grep -Fq \
            'jvmTarget = "17"' \
            app/build.gradle.kts

          grep -Fq \
            'distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip' \
            gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            'distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' \
            gradle/wrapper/gradle-wrapper.properties

          echo "AGP=8.9.1"
          echo "KOTLIN=2.1.21"
          echo "GRADLE=8.11.1"
          echo "JDK=17"
          echo "ANDROID_API=36"
          echo "PACKAGE=com.majdoor.hisaab"
          echo "VERSION=1.77.0"
          echo "VERSION_CODE=77"
          echo "CONFIGURATION_AUDIT=PASS"

      # ==========================================================
      # 8. VERIFY JAVA GRADLE AND ANDROID TOOLS
      # ==========================================================

      - name: Verify Java Gradle and Android tools
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          java -version

          # ------------------------------------------------------
          # IMPORTANT:
          # AGP compatibility gate requires the repository
          # Gradle Wrapper. Do NOT invoke system "gradle".
          # ------------------------------------------------------

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          # ------------------------------------------------------
          # Remove only the cached Gradle 8.11.1 distribution.
          # This fixes a corrupted/incomplete wrapper distribution
          # such as "distribution did not contain bin/gradle".
          # ------------------------------------------------------

          rm -rf \
            "${HOME}/.gradle/wrapper/dists/gradle-8.11.1-bin"

          ./gradlew --version

          ./gradlew --version | grep -Fq "Gradle 8.11.1"

          # ------------------------------------------------------
          # Android SDK paths
          # ------------------------------------------------------

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK_ROOT"

          BUILD_TOOLS_DIR="${SDK_ROOT}/build-tools/${BUILD_TOOLS}"
          PLATFORM_TOOLS_DIR="${SDK_ROOT}/platform-tools"
          CMDLINE_TOOLS_DIR="${SDK_ROOT}/cmdline-tools/latest/bin"

          test -d "$BUILD_TOOLS_DIR"
          test -d "$PLATFORM_TOOLS_DIR"

          export PATH="${BUILD_TOOLS_DIR}:${PLATFORM_TOOLS_DIR}:${CMDLINE_TOOLS_DIR}:${PATH}"

          {
            echo "${BUILD_TOOLS_DIR}"
            echo "${PLATFORM_TOOLS_DIR}"
            echo "${CMDLINE_TOOLS_DIR}"
          } >> "${GITHUB_PATH}"

          echo "ANDROID_SDK_ROOT=${SDK_ROOT}"
          echo "BUILD_TOOLS_DIR=${BUILD_TOOLS_DIR}"
          echo "PLATFORM_TOOLS_DIR=${PLATFORM_TOOLS_DIR}"

          # ------------------------------------------------------
          # Verify required Android executables
          # ------------------------------------------------------

          test -x "${BUILD_TOOLS_DIR}/apksigner"
          test -x "${BUILD_TOOLS_DIR}/zipalign"

          command -v adb
          command -v apkanalyzer
          command -v apksigner
          command -v zipalign
          command -v unzip

          apksigner --version

          # zipalign -h may return exit code 1 while printing help.
          zipalign -h >/dev/null 2>&1 || true

          echo "ADB_PATH=$(command -v adb)"
          echo "APKANALYZER_PATH=$(command -v apkanalyzer)"
          echo "APKSIGNER_PATH=$(command -v apksigner)"
          echo "ZIPALIGN_PATH=$(command -v zipalign)"

          echo "TOOLCHAIN_AUDIT=PASS"

      # ==========================================================
      # 9. COMPATIBILITY
      # ==========================================================

      - name: Run AGP and Gradle compatibility gate
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/gradle-agp-compatibility.sh

      - name: Run Kotlin compatibility gate
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/gradle-kotlin-compatibility.sh

      # ==========================================================
      # 10. STATIC AUDIT
      # ==========================================================

      - name: Run stable source audit gates
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase2-security-startup-gate.sh
          ./scripts/phase5-attendance-gate.sh
          ./scripts/phase6-work-gate.sh
          ./scripts/phase8-field-gate.sh
          ./scripts/phase11-reports-gate.sh
          ./scripts/phase12-backup-gate.sh
          ./scripts/phase13-settings-gate.sh
          ./scripts/phase14-data-model-gate.sh
          ./scripts/phase15-architecture-gate.sh
          ./scripts/phase16-automated-testing-gate.sh
          ./scripts/phase17-real-android-runtime-gate.sh
          ./scripts/phase18-configuration-lifecycle-gate.sh
          ./scripts/phase20-security-data-gate.sh
          ./scripts/phase21-ui-ux-gate.sh

          echo "STABLE_STATIC_GATES=PASS"

      # ==========================================================
      # 11. PHASE 22
      # ==========================================================

      - name: Run Phase 22 final red-list static gate
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase22-final-red-list-gate.sh

          echo "PHASE22_STATIC_GATE=PASS"

      # ==========================================================
      # 12. OFFLINE SQLITE
      # ==========================================================

      - name: Audit offline SQLite architecture
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f \
            app/src/main/java/com/majdoor/hisaab/storage/LocalStore.kt

          test -f \
            app/src/main/java/com/majdoor/hisaab/storage/CoreSqliteStore.kt

          test -f \
            app/src/main/java/com/majdoor/hisaab/data/repository/LocalRepository.kt

          grep -R -q \
            --include='*.kt' \
            'SQLiteOpenHelper' \
            app/src/main/java/com/majdoor/hisaab

          grep -R -q \
            --include='*.kt' \
            'core_records' \
            app/src/main/java/com/majdoor/hisaab

          grep -R -q \
            --include='*.kt' \
            'CoreSqliteStore' \
            app/src/main/java/com/majdoor/hisaab

          if grep -RniE \
            'FirebaseDatabase|FirebaseFirestore|supabase|Retrofit|OkHttp|HttpURLConnection' \
            app/src/main \
            app/build.gradle.kts; then
            echo "ERROR: unexpected remote/network dependency found"
            exit 1
          fi

          if grep -Fq \
            'android.permission.INTERNET' \
            app/src/main/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission found"
            exit 1
          fi

          echo "OFFLINE_SQLITE_GATE=PASS"

      # ==========================================================
      # 13. DEPENDENCY HEALTH
      # ==========================================================

      - name: Resolve dependencies
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration debugRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration releaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration e2eReleaseRuntimeClasspath

          ./scripts/dependency-health.sh

          echo "DEPENDENCY_RESOLUTION=PASS"

      # ==========================================================
      # 14. UNIT TESTS + COMPILE
      # ==========================================================

      - name: Run unit tests and compile variants
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            test \
            compileDebugKotlin \
            compileE2eReleaseKotlin \
            compileReleaseKotlin

          echo "UNIT_AND_KOTLIN_COMPILATION=PASS"

      # ==========================================================
      # 15. DEBUG APK
      # ==========================================================

      - name: Build Debug APK
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

          ./scripts/debug-build-gate.sh

          mkdir -p artifacts/debug

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            artifacts/debug/Majdoor-Hisaab-PRO-debug.apk

          sha256sum \
            app/build/outputs/apk/debug/app-debug.apk \
            | tee artifacts/debug/Majdoor-Hisaab-PRO-debug.sha256

          echo "DEBUG_APK=PASS"

      # ==========================================================
      # 16. RELEASE APK
      # ==========================================================

      - name: Build Release APK
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseKotlin \
            :app:assembleRelease

          ./scripts/release-build-gate.sh

          test -s \
            app/build/outputs/apk/release/app-release-unsigned.apk

          echo "RELEASE_UNSIGNED_APK=PASS"

      # ==========================================================
      # 17. E2E RELEASE + ANDROID TEST APK
      # ==========================================================

      - name: Build E2E Release and AndroidTest APK
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleE2eRelease \
            assembleReleaseAndroidTest

          test -s \
            app/build/outputs/apk/androidTest/release/app-release-androidTest.apk

          mkdir -p artifacts/test

          cp \
            app/build/outputs/apk/androidTest/release/app-release-androidTest.apk \
            artifacts/test/Majdoor-Hisaab-PRO-release-androidTest-unsigned.apk

          echo "E2E_AND_INSTRUMENTATION_BUILD=PASS"

      # ==========================================================
      # 18. UNSIGNED RELEASE APK METADATA
      # ==========================================================

      - name: Verify unsigned Release APK
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          test "$(apkanalyzer manifest application-id "$APK")" = "$PACKAGE_NAME"
          test "$(apkanalyzer manifest version-name "$APK")" = "$VERSION_NAME"
          test "$(apkanalyzer manifest version-code "$APK")" = "$VERSION_CODE"

          unzip -t "$APK" >/dev/null

          mkdir -p artifacts/release-build

          cp "$APK" \
            artifacts/release-build/app-release-unsigned.apk

          sha256sum "$APK" \
            | tee artifacts/release-build/app-release-unsigned.sha256

          echo "UNSIGNED_RELEASE_METADATA=PASS"

      # ==========================================================
      # 19. RESTORE PRODUCTION KEYSTORE
      # ==========================================================

      - name: Restore production signing keystore
        working-directory: project
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$EXPECTED_CERT"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

          keytool -list \
            -v \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > release-certificate.txt

          ACTUAL_CERT="$(
            awk -F': ' \
              '/SHA256:/{print $2; exit}' \
              release-certificate.txt \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_CERT="$(
            printf '%s' "$EXPECTED_CERT" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

          echo "PRODUCTION_KEYSTORE_CERTIFICATE=PASS"

      # ==========================================================
      # 20. ZIPALIGN + SIGN PRODUCTION RELEASE APK
      # ==========================================================

      - name: Sign Production Release APK
        working-directory: project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app-release-aligned.apk"
          SIGNED="artifacts/Majdoor-Hisaab-PRO-release.apk"

          mkdir -p artifacts

          test -s "$UNSIGNED"

          zipalign -f -p 4 \
            "$UNSIGNED" \
            "$ALIGNED"

          zipalign -c -v 4 \
            "$ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$SIGNED" \
            | tee artifacts/production-signature.txt

          ACTUAL_CERT="$(
            apksigner verify --print-certs "$SIGNED" \
              | awk -F': ' \
                '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_CERT="$(
            printf '%s' "$EXPECTED_CERT" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

          unzip -t "$SIGNED" >/dev/null
          zipalign -c -v 4 "$SIGNED"

          test "$(apkanalyzer manifest application-id "$SIGNED")" = "$PACKAGE_NAME"
          test "$(apkanalyzer manifest version-name "$SIGNED")" = "$VERSION_NAME"
          test "$(apkanalyzer manifest version-code "$SIGNED")" = "$VERSION_CODE"

          sha256sum "$SIGNED" \
            | tee artifacts/Majdoor-Hisaab-PRO-release.sha256

          echo "PRODUCTION_SIGNED_APK=PASS"

      # ==========================================================
      # 21. SIGN RELEASE ANDROIDTEST APK
      # ==========================================================

      - name: Sign Release AndroidTest APK
        working-directory: project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TEST_UNSIGNED="app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          TEST_ALIGNED="app-release-androidTest-aligned.apk"
          TEST_SIGNED="artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

          test -s "$TEST_UNSIGNED"

          zipalign -f -p 4 \
            "$TEST_UNSIGNED" \
            "$TEST_ALIGNED"

          zipalign -c -v 4 \
            "$TEST_ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$TEST_SIGNED" \
            "$TEST_ALIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$TEST_SIGNED"

          ACTUAL_CERT="$(
            apksigner verify --print-certs "$TEST_SIGNED" \
              | awk -F': ' \
                '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_CERT="$(
            printf '%s' "$EXPECTED_CERT" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

          test -s "$TEST_SIGNED"

          echo "SIGNED_RELEASE_ANDROIDTEST=PASS"

      # ==========================================================
      # 22. PRODUCTION SIGNING GATE
      # ==========================================================

      - name: Run production signing gate
        working-directory: project
        env:
          MH_RELEASE_CERT_SHA256: ${{ secrets.MH_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/production-signing-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

          echo "PRODUCTION_SIGNING_GATE=PASS"

      # ==========================================================
      # 23. FINAL APK SHA-256 GATE
      # ==========================================================

      - name: Run final APK SHA-256 gate
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$APK"

          ./scripts/phase1-points-18-25-gate.sh \
            "$APK"

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          cp \
            artifacts/Majdoor-Hisaab-PRO-release.apk.sha256 \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

          sha256sum -c \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

          echo "FINAL_SHA256_GATE=PASS"

      # ==========================================================
      # 24. DEBUG EMULATOR
      # ==========================================================

      - name: Install and launch Debug APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true
          script: |
            set -Eeuo pipefail

            cd "${GITHUB_WORKSPACE}/project"

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            adb install -r \
              app/build/outputs/apk/debug/app-debug.apk

            adb shell am force-stop "${PACKAGE_NAME}"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity" \
              | tee artifacts/debug/debug-launch.txt

            sleep 3

            adb shell pidof "${PACKAGE_NAME}" \
              | grep -Eq '[0-9]+'

            adb logcat -d -t 15000 \
              > artifacts/debug/debug-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/debug/debug-logcat.txt; then
              exit 1
            fi

            echo "DEBUG_RUNTIME=PASS"

      # ==========================================================
      # 25. COMPLETE RELEASE E2E TEST
      # ==========================================================

      - name: Run connected E2E Release test suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
