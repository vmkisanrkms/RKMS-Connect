name: Majdoor Hisaab PRO - V81 Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"

  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V81-ALL-BUTTONS-FINAL.zip"


jobs:

  build-release:

    name: Build Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SHOW REPOSITORY
      # ============================================================

      - name: Show repository
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " MAJDOOR HISAAB PRO - V81 FINAL RELEASE"
          echo "============================================================"

          pwd

          echo
          echo "Repository files:"
          find . -maxdepth 5 -type f \
            \( \
              -name "*.zip" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle.kts" \
              -o -name "app.gradle.kts" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print | sort


      # ============================================================
      # 3. JDK 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. VERIFY JAVA
      # ============================================================

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version


      # ============================================================
      # 5. ANDROID SDK 36
      # ============================================================

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${ANDROID_HOME:-}" ]]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [[ -n "${ANDROID_SDK_ROOT:-}" ]]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            SDK_ROOT="$HOME/android-sdk"
          fi

          echo "SDK_ROOT=$SDK_ROOT"

          test -d "$SDK_ROOT"

          SDKMANAGER=""

          if [[ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -path "*/bin/sdkmanager" \
                -print \
                2>/dev/null \
                | sort \
                | tail -n 1 \
                || true
            )"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d "$SDK_ROOT/platforms/android-${ANDROID_API}"
          test -d "$SDK_ROOT/build-tools/${BUILD_TOOLS}"

          test -x "$SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt"
          test -x "$SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"
          test -x "$SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          echo
          echo "ANDROID SDK 36 READY"


      # ============================================================
      # 6. LOCATE / EXTRACT V81 PROJECT
      # ============================================================

      - name: Locate and extract V81 project
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " LOCATING ANDROID PROJECT"
          echo "============================================================"

          FOUND_ROOT=""

          # --------------------------------------------------------
          # Root Android project
          # --------------------------------------------------------

          if [[ -f "settings.gradle.kts" ]] && \
             [[ -f "app/build.gradle.kts" ]]; then

            FOUND_ROOT="$PWD"

            echo "Android project found at repository root."

          fi


          # --------------------------------------------------------
          # V81 ZIP
          # --------------------------------------------------------

          if [[ -z "$FOUND_ROOT" ]]; then

            ZIP_PATH="$(
              find "$PWD" \
                -type f \
                -name "$ZIP_NAME" \
                -print \
                | head -n 1
            )"

            if [[ -z "$ZIP_PATH" ]]; then

              echo
              echo "ERROR: V81 ZIP not found:"
              echo "$ZIP_NAME"

              echo
              echo "Available ZIP files:"
              find "$PWD" \
                -type f \
                -name "*.zip" \
                -print \
                | sort

              exit 1

            fi

            echo
            echo "V81 ZIP:"
            echo "$ZIP_PATH"

            rm -rf "$PWD/extracted_project"

            mkdir -p "$PWD/extracted_project"

            unzip -q \
              "$ZIP_PATH" \
              -d "$PWD/extracted_project"


            FOUND_ROOT="$(
              find "$PWD/extracted_project" \
                -type f \
                -name "settings.gradle.kts" \
                -print \
                | while read -r file; do

                    dir="$(dirname "$file")"

                    if [[ -f "$dir/app/build.gradle.kts" ]]; then
                      echo "$dir"
                      break
                    fi

                  done
            )"

          fi


          # --------------------------------------------------------
          # Generic fallback
          # --------------------------------------------------------

          if [[ -z "$FOUND_ROOT" ]]; then

            FOUND_ROOT="$(
              find "$PWD" \
                -type f \
                -name "settings.gradle.kts" \
                -print \
                | while read -r file; do

                    dir="$(dirname "$file")"

                    if [[ -f "$dir/app/build.gradle.kts" ]]; then
                      echo "$dir"
                      break
                    fi

                  done
            )"

          fi


          if [[ -z "$FOUND_ROOT" ]]; then

            echo "ERROR: Android project not found."

            find "$PWD" \
              -maxdepth 7 \
              -type f \
              -print \
              | head -500

            exit 1

          fi


          echo "ANDROID_PROJECT_ROOT=$FOUND_ROOT" >> "$GITHUB_ENV"

          echo
          echo "============================================================"
          echo " ANDROID PROJECT"
          echo "============================================================"

          echo "$FOUND_ROOT"


      # ============================================================
      # 7. SET UP GRADLE
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false


      # ============================================================
      # 8. VERIFY PROJECT CONFIGURATION
      # ============================================================

      - name: Verify project configuration
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f app/build.gradle.kts

          echo "===== settings.gradle.kts ====="
          sed -n '1,260p' settings.gradle.kts

          echo
          echo "===== app/build.gradle.kts ====="
          sed -n '1,420p' app/build.gradle.kts

          echo
          echo "===== CONFIGURATION CHECK ====="

          grep -q \
            'com.majdoor.hisaab' \
            app/build.gradle.kts

          grep -Eq \
            'compileSdk.*36|compileSdk = 36' \
            app/build.gradle.kts

          grep -Eq \
            'targetSdk.*36|targetSdk = 36' \
            app/build.gradle.kts

          grep -Eq \
            'versionCode.*77|versionCode = 77' \
            app/build.gradle.kts

          grep -Eq \
            'versionName.*1.77.0|versionName = "1.77.0"' \
            app/build.gradle.kts

          echo
          echo "PROJECT CONFIGURATION PASSED"


      # ============================================================
      # 9. LOCATE MAINACTIVITYSCREENS
      # ============================================================

      - name: Locate MainActivityScreens
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          SRC="$(
            find . \
              -type f \
              -name "MainActivityScreens.kt" \
              -print \
              | head -n 1
          )"

          if [[ -z "$SRC" ]]; then
            echo "ERROR: MainActivityScreens.kt not found."
            exit 1
          fi

          echo "MAIN_ACTIVITY_SCREENS=$SRC" >> "$GITHUB_ENV"

          echo
          echo "SOURCE:"
          echo "$SRC"


      # ============================================================
      # 10. FINAL V81 KOTLIN FIXES
      # ============================================================

      - name: Apply FINAL V81 Kotlin fixes
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          src = Path(os.environ["MAIN_ACTIVITY_SCREENS"])

          if not src.exists():
              raise SystemExit(
                  f"ERROR: Source not found: {src}"
              )

          text = src.read_text(
              encoding="utf-8"
          )

          print("============================================================")
          print(" APPLYING FINAL V81 KOTLIN FIXES")
          print("============================================================")


          # ========================================================
          # 1. btn() DEFAULT ACTION
          # ========================================================

          text = text.replace(
              "internal fun MainActivity.btn(s:String,action:()->Unit)=TextView(this).apply{",
              "internal fun MainActivity.btn(s:String,action:()->Unit = {})=TextView(this).apply{"
          )

          text = text.replace(
              "internal fun MainActivity.btn(s: String, action: () -> Unit) = TextView(this).apply {",
              "internal fun MainActivity.btn(s: String, action: () -> Unit = {}) = TextView(this).apply {"
          )


          # ========================================================
          # 2. PROFESSIONAL BUTTON REFERENCE HELPER
          # ========================================================

          marker = "    internal fun MainActivity.page(title:String):LinearLayout{"

          helper = '''    internal fun MainActivity.btnRef(s:String, action:(TextView)->Unit):TextView{
              var ref:TextView?=null
              val view=btn(s){ ref?.let(action) }
              ref=view
              return view
          }

          '''

          if marker in text and "internal fun MainActivity.btnRef" not in text:

              text = text.replace(
                  marker,
                  helper + marker,
                  1
              )


          # ========================================================
          # 3. ScrollView
          # ========================================================

          text = text.replace(
              "fillViewport=true",
              "setFillViewport(true)"
          )

          text = text.replace(
              "fillViewport = true",
              "setFillViewport(true)"
          )


          # ========================================================
          # 4. statusViews MAP
          # ========================================================

          text = text.replace(
              'statusViews.forEach{it.text="FULL"}',
              'statusViews.values.forEach{it.text="FULL"}'
          )

          text = text.replace(
              'statusViews.forEach{it.text="HALF"}',
              'statusViews.values.forEach{it.text="HALF"}'
          )

          text = text.replace(
              'statusViews.forEach{it.text=AttendanceRules.UNMARKED}',
              'statusViews.values.forEach{it.text=AttendanceRules.UNMARKED}'
          )


          # ========================================================
          # 5. ALL PROBLEMATIC btn() CALLBACKS
          # ========================================================

          lines = text.splitlines()

          problematic_names = {
              "fb",
              "cb",
              "crb",
              "wb",
              "mb",
              "adv",
              "cropBtn",
              "fieldBtn",
              "statusBtn",
              "rateTypeBtn",
              "workerBtn"
          }


          for index, line in enumerate(lines):

              match = re.search(
                  r'val\s+(\w+)=btn\(',
                  line
              )

              if not match:
                  continue

              name = match.group(1)

              if name not in problematic_names:
                  continue

              if "it.text=" not in line:
                  continue


              line = line.replace(
                  f"val {name}=btn(",
                  f"val {name}=btnRef(",
                  1
              )

              line = line.replace(
                  "{AlertDialog",
                  "{button->AlertDialog",
                  1
              )

              line = line.replace(
                  "{val labels",
                  "{button->val labels",
                  1
              )

              line = line.replace(
                  "{advance=",
                  "{button->advance=",
                  1
              )

              line = line.replace(
                  ";it.text=",
                  ";button.text="
              )

              line = line.replace(
                  "{it.text=",
                  "{button.text="
              )

              lines[index] = line


          # ========================================================
          # 6. WORKER BUTTON
          # ========================================================

          for index, line in enumerate(lines):

              if "val workerBtn=btn(" in line:

                  line = line.replace(
                      "val workerBtn=btn(",
                      "val workerBtn=btnRef(",
                      1
                  )

                  if line.rstrip().endswith("){"):

                      line = (
                          line.rstrip()[:-2]
                          + "){button->"
                      )

                  lines[index] = line


              if 'setPositiveButton("Done"){_,_->it.text=' in line:

                  lines[index] = line.replace(
                      'setPositiveButton("Done"){_,_->it.text=',
                      'setPositiveButton("Done"){_,_->button.text='
                  )


          # ========================================================
          # 7. ATTENDANCE FIELD / STATUS BUTTONS
          # ========================================================

          in_attendance_form = False

          for index, line in enumerate(lines):

              if "internal fun MainActivity.attendanceForm" in line:

                  in_attendance_form = True


              if in_attendance_form:

                  if "val fieldBtn=btn(" in line:

                      line = line.replace(
                          "val fieldBtn=btn(",
                          "val fieldBtn=btnRef(",
                          1
                      )

                      if line.rstrip().endswith("){"):

                          line = (
                              line.rstrip()[:-2]
                              + "){button->"
                          )

                      lines[index] = line


                  if "val statusBtn=btn(" in line:

                      line = line.replace(
                          "val statusBtn=btn(",
                          "val statusBtn=btnRef(",
                          1
                      )

                      if line.rstrip().endswith("){"):

                          line = (
                              line.rstrip()[:-2]
                              + "){button->"
                          )

                      lines[index] = line


                  if "it.text=" in line:

                      lines[index] = line.replace(
                          "it.text=",
                          "button.text="
                      )


              if "internal fun MainActivity.attendanceHistory" in line:

                  in_attendance_form = False


          text = "\n".join(lines) + "\n"


          # ========================================================
          # 8. FINAL REMAINING it.text CALLBACKS
          # ========================================================

          lines = text.splitlines()

          for index, line in enumerate(lines):

              if (
                  "it.text=" in line
                  and "statusViews.values.forEach" not in line
              ):

                  match = re.search(
                      r'val\s+(\w+)=btn\(',
                      line
                  )

                  if match:

                      name = match.group(1)

                      line = line.replace(
                          f"val {name}=btn(",
                          f"val {name}=btnRef(",
                          1
                      )

                      line = line.replace(
                          "{AlertDialog",
                          "{button->AlertDialog",
                          1
                      )

                      line = line.replace(
                          "{val labels",
                          "{button->val labels",
                          1
                      )

                      line = line.replace(
                          ";it.text=",
                          ";button.text="
                      )

                  else:

                      line = line.replace(
                          "it.text=",
                          "button.text="
                      )

                  lines[index] = line

          text = "\n".join(lines) + "\n"


          # ========================================================
          # 9. INTENT TYPE SHADOWING
          # ========================================================

          text = re.sub(
              r'(\.apply\s*\{\s*)type\s*=\s*"image/\*"',
              r'\1this.type="image/*"',
              text
          )

          text = re.sub(
              r'(\.apply\s*\{\s*)type\s*=\s*"application/zip"',
              r'\1this.type="application/zip"',
              text
          )

          text = re.sub(
              r'(\.apply\s*\{\s*)type\s*=\s*"\*/\*"',
              r'\1this.type="*/*"',
              text
          )


          # ========================================================
          # 10. AUDIT COMPATIBILITY
          # ========================================================

          text = text.replace(
              ".audit.auditLog",
              ".auditLog"
          )

          text = text.replace(
              "clearAuditLog",
              "clear"
          )

          text = text.replace(
              "getSystemService(ALARM_SERVICE)",
              "getSystemService(Context.ALARM_SERVICE)"
          )


          # ========================================================
          # 11. PICK() RETURN TYPE
          # ========================================================

          text = re.sub(
              r'(onPick\s*:\s*\(Int\)\s*->\s*Unit\s*\)\s*:)Button',
              r'\1TextView',
              text
          )


          # ========================================================
          # 12. DEFINITIVE EXPORT BLOCK REPLACEMENT
          # ========================================================

          export_start = text.find(
              "contentResolver.openOutputStream(uri)!!.use{out->"
          )

          export_end = text.find(
              "            } else if(req==1002){",
              export_start
          )

          if export_start < 0 or export_end < 0:

              raise SystemExit(
                  "ERROR: Export block boundaries not found."
              )


          export_block = '''contentResolver.openOutputStream(uri)!!.use{out->when {
                      exportType == "workers" -> app.export.csvWorkers(out)
                      exportType == "ledger" -> app.export.csvLedger(out)
                      exportType.startsWith("report:") -> app.export.csvReport(exportType.removePrefix("report:"),out)
                      exportType.startsWith("reportpdf:") -> app.export.pdfReport(exportType.removePrefix("reportpdf:"),out)
                      exportType == "pdf" -> app.export.pdfSummary(out)
                      exportType == "backup" -> app.backup.export(out)
                  }}
          '''


          text = (
              text[:export_start]
              + export_block
              + text[export_end:]
          )


          # ========================================================
          # 13. RENDER SUMMARY FORWARD REFERENCE
          # ========================================================

          calendar_start = text.find(
              "internal fun MainActivity.attendanceCalendar"
          )

          calendar_end = text.find(
              "internal fun MainActivity.paymentLedger",
              calendar_start
          )


          if (
              calendar_start >= 0
              and calendar_end > calendar_start
          ):

              calendar = text[
                  calendar_start:
                  calendar_end
              ]

              render_pos = calendar.find(
                  "fun render(){"
              )

              summary_pos = calendar.find(
                  "fun renderSummary(){"
              )


              if (
                  render_pos >= 0
                  and summary_pos > render_pos
              ):

                  summary_end = calendar.find(
                      "        val nav=",
                      summary_pos
                  )

                  if summary_end > summary_pos:

                      render_block = calendar[
                          render_pos:
                          summary_pos
                      ]

                      summary_block = calendar[
                          summary_pos:
                          summary_end
                      ]

                      calendar = (
                          calendar[:render_pos]
                          + summary_block
                          + "\n"
                          + render_block
                          + calendar[summary_end:]
                      )

                      text = (
                          text[:calendar_start]
                          + calendar
                          + text[calendar_end:]
                      )


          # ========================================================
          # 14. SAVE
          # ========================================================

          src.write_text(
              text,
              encoding="utf-8"
          )


          print()
          print("FINAL V81 SOURCE PATCH COMPLETED")
          print("SOURCE:", src)

          PY


      # ============================================================
      # 11. SOURCE SANITY CHECK
      # ============================================================

      - name: Final Kotlin source sanity check
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          SRC="$MAIN_ACTIVITY_SCREENS"

          echo "============================================================"
          echo " FINAL KOTLIN SOURCE SANITY CHECK"
          echo "============================================================"

          test -f "$SRC"

          echo
          echo "===== btn() ====="

          grep -n \
            "fun MainActivity.btn" \
            "$SRC" \
            || true


          echo
          echo "===== btnRef() ====="

          grep -n \
            "fun MainActivity.btnRef" \
            "$SRC" \
            || true


          echo
          echo "===== EXPORT ====="

          grep -n \
            -A12 \
            -B2 \
            "openOutputStream(uri)" \
            "$SRC"


          echo
          echo "===== CHECKING OLD EXPORT SYNTAX ====="

          if grep -Eq \
            'when[[:space:]]*\([[:space:]]*exportType[[:space:]]*\)' \
            "$SRC"; then

            echo "ERROR: when(exportType) still exists."
            exit 1

          fi

          echo "PASS: when(exportType) removed."


          echo
          echo "===== CHECKING OLD fillViewport ====="

          if grep -Eq \
            'fillViewport[[:space:]]*=' \
            "$SRC"; then

            echo "ERROR: old fillViewport assignment remains."
            exit 1

          fi

          echo "PASS: ScrollView fixed."


          echo
          echo "===== CHECKING PROBLEMATIC it.text ====="

          if grep -n \
            'it.text=' \
            "$SRC" \
            | grep -v \
              'statusViews.values.forEach'; then

            echo "ERROR: unresolved it.text callback remains."
            exit 1

          fi

          echo "PASS: it.text callbacks fixed."


          echo
          echo "===== CHECKING BUTTON REFERENCE ====="

          grep -nE \
            'btnRef\(|button\.text=' \
            "$SRC" \
            | head -100 \
            || true


          echo
          echo "===== CHECKING renderSummary ====="

          grep -n \
            "fun renderSummary" \
            "$SRC" \
            || true


          echo
          echo "===== CHECKING PICK ====="

          grep -n \
            "onPick" \
            "$SRC" \
            | head -20 \
            || true


          echo
          echo "============================================================"
          echo " SOURCE SANITY CHECK PASSED"
          echo "============================================================"


      # ============================================================
      # 12. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle environment
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java -version

          echo
          echo "===== GRADLE ====="
          gradle --version

          echo
          echo "GRADLE ENVIRONMENT PASSED"


      # ============================================================
      # 13. CLEAN
      # ============================================================

      - name: Clean project
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " CLEAN PROJECT"
          echo "============================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            clean

          echo
          echo "CLEAN PASSED"


      # ============================================================
      # 14. COMPILE RELEASE KOTLIN
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " COMPILE RELEASE KOTLIN"
          echo "============================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseKotlin

          echo
          echo "============================================================"
          echo " COMPILE RELEASE KOTLIN PASSED"
          echo "============================================================"


      # ============================================================
      # 15. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble Release APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " ASSEMBLE RELEASE APK"
          echo "============================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

          echo
          echo "===== GENERATED APK FILES ====="

          find \
            app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            | sort


      # ============================================================
      # 16. LOCATE RELEASE APK
      # ============================================================

      - name: Locate release APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          APK=""

          if [[ -f \
            "app/build/outputs/apk/release/app-release-unsigned.apk"
          ]]; then

            APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          fi


          if [[ -z "$APK" ]]; then

            APK="$(
              find \
                app/build/outputs/apk/release \
                -type f \
                -name "*-unsigned.apk" \
                -print \
                | head -n 1
            )"

          fi


          if [[ -z "$APK" ]]; then

            APK="$(
              find \
                app/build/outputs/apk/release \
                -type f \
                -name "*.apk" \
                -print \
                | head -n 1
            )"

          fi


          if [[ -z "$APK" ]]; then

            echo "ERROR: Release APK not found."

            find \
              app/build/outputs/apk \
              -type f \
              -print \
              || true

            exit 1

          fi


          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"

          echo
          echo "RELEASE APK:"
          echo "$APK"

          ls -lh "$APK"


      # ============================================================
      # 17. VERIFY APK PACKAGE / VERSION
      # ============================================================

      - name: Verify APK package and version
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          echo "============================================================"
          echo " APK PACKAGE / VERSION"
          echo "============================================================"

          BADGING="$(
            "$AAPT" \
              dump badging \
              "$RELEASE_APK"
          )"

          echo "$BADGING" \
            | grep -E \
              "package: name=|versionCode=|versionName="


          echo "$BADGING" \
            | grep -q \
              "name='${PACKAGE_NAME}'" \
            || {
              echo "ERROR: Package mismatch."
              exit 1
            }


          echo "$BADGING" \
            | grep -q \
              "versionCode='${VERSION_CODE}'" \
            || {
              echo "ERROR: VersionCode mismatch."
              exit 1
            }


          echo "$BADGING" \
            | grep -q \
              "versionName='${VERSION_NAME}'" \
            || {
              echo "ERROR: VersionName mismatch."
              exit 1
            }


          echo
          echo "APK PACKAGE / VERSION PASSED"


      # ============================================================
      # 18. PREPARE SIGNING
      # ============================================================

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " PREPARE RELEASE SIGNING"
          echo "============================================================"

          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "ERROR: KEYSTORE_BASE64 secret missing."
            exit 1
          fi

          if [[ -z "${KEYSTORE_PASSWORD:-}" ]]; then
            echo "ERROR: KEYSTORE_PASSWORD secret missing."
            exit 1
          fi

          if [[ -z "${KEY_ALIAS:-}" ]]; then
            echo "ERROR: KEY_ALIAS secret missing."
            exit 1
          fi

          if [[ -z "${KEY_PASSWORD:-}" ]]; then
            echo "ERROR: KEY_PASSWORD secret missing."
            exit 1
          fi


          SIGN_DIR="$RUNNER_TEMP/release-signing"

          mkdir -p "$SIGN_DIR"


          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$SIGN_DIR/release.keystore"


          test -s \
            "$SIGN_DIR/release.keystore"


          echo "KEYSTORE_PATH=$SIGN_DIR/release.keystore" \
            >> "$GITHUB_ENV"


          echo
          echo "KEYSTORE READY"


      # ============================================================
      # 19. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " ZIPALIGN RELEASE APK"
          echo "============================================================"

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          mkdir -p \
            "$RUNNER_TEMP/apk"


          ALIGNED="$RUNNER_TEMP/apk/Majdoor-Hisaab-PRO-${VERSION_NAME}-aligned.apk"


          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$ANDROID_PROJECT_ROOT/$RELEASE_APK" \
            "$ALIGNED"


          test -s "$ALIGNED"


          echo "ZIPALIGNED_APK=$ALIGNED" \
            >> "$GITHUB_ENV"


          ls -lh "$ALIGNED"


          echo
          echo "ZIPALIGN PASSED"


      # ============================================================
      # 20. SIGN APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " SIGN RELEASE APK"
          echo "============================================================"

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          SIGNED="$RUNNER_TEMP/apk/Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"


          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$SIGNED" \
            "$ZIPALIGNED_APK"


          test -s "$SIGNED"


          echo "SIGNED_APK=$SIGNED" \
            >> "$GITHUB_ENV"


          ls -lh "$SIGNED"


          echo
          echo "APK SIGNED"


      # ============================================================
      # 21. VERIFY SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " VERIFY APK SIGNATURE"
          echo "============================================================"

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"


          "$APKSIGNER" \
            verify \
            --verbose \
            "$SIGNED_APK"


          echo
          echo "APK SIGNATURE VERIFIED"


      # ============================================================
      # 22. FINAL APK VALIDATION
      # ============================================================

      - name: Final APK validation
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " FINAL APK VALIDATION"
          echo "============================================================"

          AAPT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"


          BADGING="$(
            "$AAPT" \
              dump badging \
              "$SIGNED_APK"
          )"


          echo "$BADGING" \
            | grep -E \
              "package: name=|versionCode=|versionName="


          echo "$BADGING" \
            | grep -q \
              "name='${PACKAGE_NAME}'"


          echo "$BADGING" \
            | grep -q \
              "versionCode='${VERSION_CODE}'"


          echo "$BADGING" \
            | grep -q \
              "versionName='${VERSION_NAME}'"


          echo
          echo "APK SIZE:"

          ls -lh "$SIGNED_APK"


          echo
          echo "SHA256:"

          sha256sum \
            "$SIGNED_APK"


          echo
          echo "FINAL APK VALIDATION PASSED"


      # ============================================================
      # 23. PREPARE FINAL ARTIFACT
      # ============================================================

      - name: Prepare final release artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " PREPARE FINAL RELEASE ARTIFACT"
          echo "============================================================"

          FINAL_DIR="$GITHUB_WORKSPACE/final-release"

          mkdir -p \
            "$FINAL_DIR"


          FINAL_APK="$FINAL_DIR/Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"


          cp \
            "$SIGNED_APK" \
            "$FINAL_APK"


          sha256sum \
            "$FINAL_APK" \
            > "$FINAL_DIR/SHA256SUMS.txt"


          echo
          echo "===== FINAL RELEASE ====="

          ls -lh \
            "$FINAL_DIR"


          echo
          echo "===== SHA256 ====="

          cat \
            "$FINAL_DIR/SHA256SUMS.txt"


      # ============================================================
      # 24. UPLOAD SIGNED APK
      # ============================================================

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-${{ env.VERSION_NAME }}-Release-Signed
          path: |
            final-release/Majdoor-Hisaab-PRO-${{ env.VERSION_NAME }}-Release-Signed.apk
            final-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 25. FINAL VERIFICATION
      # ============================================================

      - name: Final release verification
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo
          echo "        MAJDOOR HISAAB PRO"
          echo "        FINAL SIGNED RELEASE APK"
          echo
          echo "============================================================"
          echo

          echo "Package     : ${PACKAGE_NAME}"
          echo "Version     : ${VERSION_NAME}"
          echo "VersionCode : ${VERSION_CODE}"
          echo "Android API : ${ANDROID_API}"
          echo "Build Tools : ${BUILD_TOOLS}"
          echo "Java        : ${JAVA_VERSION}"
          echo "Gradle      : ${GRADLE_VERSION}"

          echo
          echo "APK:"
          echo "Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"

          echo
          echo "SHA256:"

          cat \
            final-release/SHA256SUMS.txt

          echo
          echo "============================================================"
          echo "       BUILD COMPLETED SUCCESSFULLY"
          echo "============================================================"
