                if(list.isEmpty()){

                    "${displayDateOrRaw(selectedDate)}\\nNo attendance saved"

                }else{

                    "${displayDateOrRaw(selectedDate)}  •  " +
                    "Full ${list.count{it.status==\"FULL\"}}  •  " +
                    "Half ${list.count{it.status==\"HALF\"}}  •  " +
                    "Unmarked ${list.count{it.status==\"NONE\"}}"
                }

            records.removeAllViews()

            if(list.isEmpty()){

                records.addView(
                    txt(
                        "No attendance records for this date."
                    )
                )

            }else{

                list
                    .sortedBy{
                        app.workers
                            .list()
                            .find{w->w.id==it.workerId}
                            ?.name
                            ?: ""
                    }
                    .forEach{a->

                        val worker=
