name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  # ============================================================
  # JAVA / GRADLE
  # ============================================================

  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"

  # ============================================================
  # ANDROID
  # ============================================================

  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  # ============================================================
  # SOURCE ZIP
  # MUST EXIST IN REPOSITORY ROOT
  # ============================================================

  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_GANNA_CHHILAI_GOOGLE_DRIVE_FIX_V4_20261009"

  # ============================================================
  # APK FILE NAMES
  # ============================================================

  APK_UNSIGNED_NAME: "unsigned-release.apk"
  APK_ALIGNED_NAME: "aligned-release.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

  # ============================================================
  # EXPECTED PACKAGE
  # ============================================================

  EXPECTED_PACKAGE: "com.majdoor.hisaabpro"


jobs:

  # ============================================================
  # FINAL RELEASE BUILD
  # ============================================================

  build-release:

    name: Main Final Signed Release APK

    runs-on: ubuntu-24.04

    timeout-minutes: 60

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ========================================================
      # 2. SETUP JAVA 17
      # ========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ========================================================
      # 3. VERIFY JAVA
      # ========================================================

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "JAVA VERIFICATION"
          echo "=============================================="

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "${JAVA_HOME}"

          echo ""
          echo "Java verification PASSED."


      # ========================================================
      # 4. SETUP ANDROID SDK
      # ========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ========================================================
      # 5. INSTALL ANDROID SDK 36
      # ========================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "INSTALLING ANDROID SDK"
          echo "=============================================="

          echo "API LEVEL   : ${ANDROID_API}"
          echo "BUILD TOOLS : ${BUILD_TOOLS}"

          sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          yes | sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            --licenses \
            >/dev/null 2>&1 || true

          echo ""
          echo "Installed Android packages:"

          sdkmanager \
            --sdk_root="${ANDROID_SDK_ROOT}" \
            --list_installed \
            | grep -E \
              "platform-tools|platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}" \
            || true

          echo ""
          echo "Android SDK installation completed."


      # ========================================================
      # 6. VERIFY ANDROID SDK
      # ========================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=============================================="

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          PLATFORM_DIR="${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"
          BUILD_DIR="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}"

          test -d "${PLATFORM_DIR}"
          test -d "${BUILD_DIR}"

          test -x "${BUILD_DIR}/aapt"
          test -x "${BUILD_DIR}/zipalign"
          test -x "${BUILD_DIR}/apksigner"

          echo ""
          echo "Android SDK verification PASSED."


      # ========================================================
      # 7. VERIFY SOURCE ZIP
      # ========================================================

      - name: Verify final source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFY FINAL SOURCE ZIP"
          echo "=============================================="

          echo "Expected ZIP:"
          echo "${ZIP_NAME}"

          if [ ! -f "${ZIP_NAME}" ]; then

            echo ""
            echo "ERROR: Final source ZIP was not found."

            echo ""
            echo "ZIP files available:"

            find . \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              -print \
              | sort

            exit 1

          fi

          echo ""
          echo "SOURCE ZIP FOUND."

          ls -lh "${ZIP_NAME}"


      # ========================================================
      # 8. VERIFY ZIP INTEGRITY
      # ========================================================

      - name: Verify source ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFY ZIP INTEGRITY"
          echo "=============================================="

          unzip -t "${ZIP_NAME}"

          echo ""
          echo "ZIP integrity PASSED."

          echo ""
          echo "SOURCE ZIP SHA256:"

          sha256sum "${ZIP_NAME}"


      # ========================================================
      # 9. PREPARE BUILD DIRECTORY
      # ========================================================

      - name: Prepare build directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-source

          mkdir -p build-source

          echo "Build directory prepared."


      # ========================================================
      # 10. EXTRACT SOURCE ZIP
      # ========================================================

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "EXTRACT SOURCE ZIP"
          echo "=============================================="

          unzip -q \
            "${ZIP_NAME}" \
            -d build-source

          echo ""
          echo "ZIP extraction completed."

          echo ""
          echo "Searching for Gradle projects:"

          find build-source \
            -type f \
            \( \
              -name "gradlew" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            | sort


      # ========================================================
      # 11. LOCATE ANDROID GRADLE PROJECT
      # ========================================================

      - name: Locate Android Gradle project
        id: find_android
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "LOCATE ANDROID GRADLE PROJECT"
          echo "=============================================="

          GRADLEW="$(
            find build-source \
              -type f \
              -name "gradlew" \
              -not -path "*/node_modules/*" \
              -not -path "*/.gradle/*" \
              | sort \
              | head -1
          )"

          if [ -z "${GRADLEW}" ]; then

            echo ""
            echo "ERROR: gradlew not found."

            echo ""
            echo "Available Gradle files:"

            find build-source \
              -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \) \
              | sort

            exit 1

          fi

          ANDROID_DIR="$(dirname "${GRADLEW}")"

          chmod +x "${GRADLEW}"

          echo ""
          echo "Gradle wrapper:"
          echo "${GRADLEW}"

          echo ""
          echo "Android project:"
          echo "${ANDROID_DIR}"

          echo "gradlew=${GRADLEW}" >> "${GITHUB_OUTPUT}"

          echo "android_dir=${ANDROID_DIR}" >> "${GITHUB_OUTPUT}"


      # ========================================================
      # 12. INSPECT ANDROID PROJECT
      # ========================================================

      - name: Inspect Android project
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ANDROID PROJECT INSPECTION"
          echo "=============================================="

          pwd

          echo ""
          echo "Gradle wrapper:"

          ls -la ./gradlew

          echo ""
          echo "Gradle wrapper properties:"

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "ERROR: gradle-wrapper.properties not found."

            exit 1

          fi

          cat gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Project files:"

          find . \
            -maxdepth 5 \
            -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle-wrapper.properties" \
              -o -name "AndroidManifest.xml" \
            \) \
            | sort \
            | head -300


      # ========================================================
      # 13. FORCE GRADLE 8.11.1
      # ========================================================

      - name: Enforce Gradle 8.11.1
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ENFORCE GRADLE ${GRADLE_VERSION}"
          echo "=============================================="

          WRAPPER_FILE="gradle/wrapper/gradle-wrapper.properties"

          python3 - "${WRAPPER_FILE}" "${GRADLE_VERSION}" <<'PY'
          import re
          import sys
          from pathlib import Path

          file = Path(sys.argv[1])
          version = sys.argv[2]

          text = file.read_text()

          new_url = (
              "distributionUrl=https\\://services.gradle.org/"
              f"distributions/gradle-{version}-bin.zip"
          )

          if re.search(
              r"^distributionUrl=.*$",
              text,
              flags=re.MULTILINE
          ):
              text = re.sub(
                  r"^distributionUrl=.*$",
                  new_url,
                  text,
                  flags=re.MULTILINE
              )
          else:
              if not text.endswith("\n"):
                  text += "\n"

              text += new_url + "\n"

          file.write_text(text)
          PY

          echo ""
          echo "Final wrapper configuration:"

          cat "${WRAPPER_FILE}"


      # ========================================================
      # 14. VERIFY GRADLE
      # ========================================================

      - name: Verify Gradle version
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "GRADLE VERSION VERIFICATION"
          echo "=============================================="

          chmod +x ./gradlew

          ./gradlew --version

          ACTUAL_GRADLE_VERSION="$(
            ./gradlew --version \
              | sed -n \
                's/^Gradle \([0-9.]*\).*/\1/p' \
              | head -1
          )"

          echo ""
          echo "Expected:"
          echo "${GRADLE_VERSION}"

          echo ""
          echo "Found:"
          echo "${ACTUAL_GRADLE_VERSION}"

          if [ "${ACTUAL_GRADLE_VERSION}" != "${GRADLE_VERSION}" ]; then

            echo ""
            echo "ERROR: Gradle version mismatch."

            exit 1

          fi

          echo ""
          echo "Gradle ${GRADLE_VERSION} VERIFIED."


      # ========================================================
      # 15. GRADLE CLEAN
      # ========================================================

      - name: Gradle clean
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ========================================================
      # 16. COMPILE RELEASE KOTLIN
      # ========================================================

      - name: Compile Release Kotlin
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN"
          echo "=============================================="

          ./gradlew compileReleaseKotlin \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "RELEASE KOTLIN COMPILE PASSED."


      # ========================================================
      # 17. ASSEMBLE RELEASE APK
      # ========================================================

      - name: Assemble Release APK
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ASSEMBLE RELEASE APK"
          echo "=============================================="

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "Release APK files:"

          find . \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print

          echo ""
          echo "RELEASE APK ASSEMBLY PASSED."


      # ========================================================
      # 18. LOCATE GENERATED APK
      # ========================================================

      - name: Locate generated Release APK
        id: locate_apk
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find . \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              -not -name "*-androidTest*" \
              | sort
          )

          echo "Release APK candidates:"

          printf '%s\n' "${APKS[@]}"

          if [ "${#APKS[@]}" -lt 1 ]; then

            echo ""
            echo "ERROR: No Release APK found."

            find . \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1

          fi

          APK="${APKS[0]}"

          echo ""
          echo "Selected APK:"
          echo "${APK}"

          echo "apk=${APK}" >> "${GITHUB_OUTPUT}"


      # ========================================================
      # 19. PREPARE FINAL APK DIRECTORY
      # ========================================================

      - name: Prepare final APK directory
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf final

          mkdir -p final

          cp \
            "${{ steps.locate_apk.outputs.apk }}" \
            "final/${APK_UNSIGNED_NAME}"

          test -s "final/${APK_UNSIGNED_NAME}"

          echo ""
          echo "Generated APK:"

          ls -lh "final/${APK_UNSIGNED_NAME}"


      # ========================================================
      # 20. VERIFY APK PACKAGE
      # ========================================================

      - name: Verify APK package name
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          AAPT="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt"

          APK="final/${APK_UNSIGNED_NAME}"

          echo "=============================================="
          echo "VERIFY APK PACKAGE"
          echo "=============================================="

          PACKAGE_NAME="$(
            "${AAPT}" dump badging "${APK}" |
            sed -n \
              "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )"

          echo ""
          echo "Expected:"
          echo "${EXPECTED_PACKAGE}"

          echo ""
          echo "Found:"
          echo "${PACKAGE_NAME}"

          if [ "${PACKAGE_NAME}" != "${EXPECTED_PACKAGE}" ]; then

            echo ""
            echo "ERROR: Package name mismatch."

            exit 1

          fi

          echo ""
          echo "PACKAGE NAME VERIFIED."


      # ========================================================
      # 21. ZIPALIGN
      # ========================================================

      - name: Zipalign Release APK
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/zipalign"

          INPUT_APK="final/${APK_UNSIGNED_NAME}"

          ALIGNED_APK="final/${APK_ALIGNED_NAME}"

          echo "=============================================="
          echo "ZIPALIGN APK"
          echo "=============================================="

          "${ZIPALIGN}" \
            -f \
            -p \
            4 \
            "${INPUT_APK}" \
            "${ALIGNED_APK}"

          "${ZIPALIGN}" \
            -c \
            -P 16 \
            -v 4 \
            "${ALIGNED_APK}"

          test -s "${ALIGNED_APK}"

          echo ""
          echo "ZIPALIGN VERIFIED."


      # ========================================================
      # 22. PREPARE SIGNING KEY
      # ========================================================

      - name: Prepare signing key
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        env:
          KEYSTORE_B64: ${{ secrets.MAJDOOR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MAJDOOR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MAJDOOR_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAJDOOR_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "PREPARE SIGNING KEY"
          echo "=============================================="

          mkdir -p signing

          KEYSTORE="signing/majdoor-hisaab-release.jks"

          if [ -n "${KEYSTORE_B64:-}" ]; then

            echo "Permanent GitHub keystore detected."

            if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
              echo "ERROR: MAJDOOR_KEYSTORE_PASSWORD is missing."
              exit 1
            fi

            if [ -z "${KEY_PASSWORD:-}" ]; then
              echo "ERROR: MAJDOOR_KEY_PASSWORD is missing."
              exit 1
            fi

            if [ -z "${KEY_ALIAS:-}" ]; then
              echo "ERROR: MAJDOOR_KEY_ALIAS is missing."
              exit 1
            fi

            printf '%s' "${KEYSTORE_B64}" \
              | base64 --decode > "${KEYSTORE}"

          else

            echo "WARNING: Permanent keystore is not configured."

            echo "Generating temporary release keystore."

            keytool \
              -genkeypair \
              -v \
              -keystore "${KEYSTORE}" \
              -storetype JKS \
              -alias "majdoor-hisaab" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "MajdoorHisaabV82" \
              -keypass "MajdoorHisaabV82" \
              -dname \
              "CN=Majdoor Hisaab PRO, OU=Android, O=Majdoor Hisaab, L=India, ST=Uttar Pradesh, C=IN"

          fi

          test -s "${KEYSTORE}"

          echo ""
          echo "Signing key ready."


      # ========================================================
      # 23. SIGN RELEASE APK
      # ========================================================

      - name: Sign Release APK
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        env:
          KEYSTORE_B64: ${{ secrets.MAJDOOR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MAJDOOR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MAJDOOR_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAJDOOR_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "SIGNING APK"
          echo "=============================================="

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

          KEYSTORE="signing/majdoor-hisaab-release.jks"

          ALIGNED_APK="final/${APK_ALIGNED_NAME}"

          SIGNED_APK="final/${APK_SIGNED_NAME}"

          if [ -n "${KEYSTORE_B64:-}" ]; then

            if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
              echo "ERROR: MAJDOOR_KEYSTORE_PASSWORD is missing."
              exit 1
            fi

            if [ -z "${KEY_PASSWORD:-}" ]; then
              echo "ERROR: MAJDOOR_KEY_PASSWORD is missing."
              exit 1
            fi

            if [ -z "${KEY_ALIAS:-}" ]; then
              echo "ERROR: MAJDOOR_KEY_ALIAS is missing."
              exit 1
            fi

          else

            KEYSTORE_PASSWORD="MajdoorHisaabV82"
            KEY_PASSWORD="MajdoorHisaabV82"
            KEY_ALIAS="majdoor-hisaab"

          fi

          "${APKSIGNER}" sign \
            --ks "${KEYSTORE}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "${SIGNED_APK}" \
            "${ALIGNED_APK}"

          test -s "${SIGNED_APK}"

          echo ""
          echo "SIGNED APK CREATED."

          ls -lh "${SIGNED_APK}"


      # ========================================================
      # 24. VERIFY APK SIGNATURE
      # ========================================================

      - name: Verify APK signature
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

          SIGNED_APK="final/${APK_SIGNED_NAME}"

          echo "=============================================="
          echo "VERIFY APK SIGNATURE"
          echo "=============================================="

          "${APKSIGNER}" verify \
            --verbose \
            "${SIGNED_APK}"

          echo ""
          echo "APK SIGNATURE VERIFIED."


      # ========================================================
      # 25. FINAL APK VALIDATION
      # ========================================================

      - name: Final APK validation
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "FINAL APK VALIDATION"
          echo "=============================================="

          AAPT="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt"

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"

          SIGNED_APK="final/${APK_SIGNED_NAME}"

          test -s "${SIGNED_APK}"

          echo ""
          echo "APK:"
          ls -lh "${SIGNED_APK}"

          BADGING="$(
            "${AAPT}" dump badging "${SIGNED_APK}"
          )"

          PACKAGE_NAME="$(
            printf '%s\n' "${BADGING}" |
            sed -n \
              "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )"

          VERSION_CODE="$(
            printf '%s\n' "${BADGING}" |
            sed -n \
              "s/^package:.*versionCode='\([^']*\)'.*/\1/p" |
            head -1
          )"

          VERSION_NAME="$(
            printf '%s\n' "${BADGING}" |
            sed -n \
              "s/^package:.*versionName='\([^']*\)'.*/\1/p" |
            head -1
          )"

          echo ""
          echo "Package:"
          echo "${PACKAGE_NAME}"

          echo ""
          echo "Version Code:"
          echo "${VERSION_CODE}"

          echo ""
          echo "Version Name:"
          echo "${VERSION_NAME}"

          if [ "${PACKAGE_NAME}" != "${EXPECTED_PACKAGE}" ]; then

            echo ""
            echo "ERROR: Final APK package mismatch."

            exit 1

          fi

          echo ""
          echo "Signature verification:"

          "${APKSIGNER}" verify \
            --verbose \
            "${SIGNED_APK}"

          echo ""
          echo "SHA256:"

          sha256sum "${SIGNED_APK}"

          echo ""
          echo "FINAL APK VALIDATION PASSED."


      # ========================================================
      # 26. FINAL ZIPALIGN VERIFICATION
      # ========================================================

      - name: Final zipalign verification
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/zipalign"

          SIGNED_APK="final/${APK_SIGNED_NAME}"

          echo "=============================================="
          echo "FINAL ZIPALIGN VERIFICATION"
          echo "=============================================="

          "${ZIPALIGN}" \
            -c \
            -P 16 \
            -v 4 \
            "${SIGNED_APK}"

          echo ""
          echo "FINAL ZIPALIGN VERIFIED."


      # ========================================================
      # 27. VERIFY FINAL APK OUTPUT
      # ========================================================

      - name: Verify final APK output
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VERIFY FINAL APK OUTPUT"
          echo "=============================================="

          test -s "final/${APK_UNSIGNED_NAME}"

          test -s "final/${APK_ALIGNED_NAME}"

          test -s "final/${APK_SIGNED_NAME}"

          echo ""
          echo "Final directory:"

          ls -lah final/

          echo ""
          echo "Final signed APK:"

          ls -lh "final/${APK_SIGNED_NAME}"

          echo ""
          echo "FINAL APK OUTPUT VERIFIED."


      # ========================================================
      # 28. UPLOAD ONLY SIGNED APK
      # ========================================================

      - name: Upload Main Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: ${{ steps.find_android.outputs.android_dir }}/final/${{ env.APK_SIGNED_NAME }}
          if-no-files-found: error
          retention-days: 30


      # ========================================================
      # 29. FINAL SUCCESS
      # ========================================================

      - name: Final success check
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "======================================================"
          echo "       MAJDOOR HISAB PRO V82 - SUCCESS"
          echo "======================================================"
          echo ""

          echo "SOURCE ZIP:"
          echo "  ${ZIP_NAME}"
          echo ""

          echo "FINAL APK:"
          echo "  ${APK_SIGNED_NAME}"
          echo ""

          echo "PACKAGE:"
          echo "  ${EXPECTED_PACKAGE}"
