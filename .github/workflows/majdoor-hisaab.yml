name: Majdoor Hisaab PRO - V81 Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V81-ALL-BUTTONS-FINAL.zip"

jobs:

  build-release:

    name: Build Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SHOW REPOSITORY
      # ============================================================

      - name: Show repository files
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " MAJDOOR HISAAB PRO - V81"
          echo "============================================================"

          pwd

          echo
          echo "===== REPOSITORY ====="
          ls -la

          echo
          echo "===== ZIP / GRADLE FILES ====="

          find . -maxdepth 6 -type f \
            \( \
              -iname "*.zip" \
              -o -iname "*.gradle" \
              -o -iname "*.gradle.kts" \
              -o -iname "gradle-wrapper.properties" \
            \) \
            -print | sort


      # ============================================================
      # 3. JDK 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. VERIFY JAVA
      # ============================================================

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version


      # ============================================================
      # 5. ANDROID SDK 36
      # ============================================================

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " ANDROID SDK 36"
          echo "============================================================"

          if [[ -n "${ANDROID_HOME:-}" ]]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [[ -n "${ANDROID_SDK_ROOT:-}" ]]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            SDK_ROOT="$HOME/android-sdk"
          fi

          echo "SDK_ROOT=$SDK_ROOT"

          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER=""

          if [[ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -path "*/bin/sdkmanager" \
                -print \
                2>/dev/null \
                | sort \
                | tail -n 1 \
                || true
            )"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d "$SDK_ROOT/platforms/android-${ANDROID_API}"
          test -d "$SDK_ROOT/build-tools/${BUILD_TOOLS}"

          test -x "$SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt"
          test -x "$SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"
          test -x "$SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          echo
          echo "ANDROID SDK 36 READY"


      # ============================================================
      # 6. LOCATE / EXTRACT V81
      # ============================================================

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " LOCATE ANDROID PROJECT"
          echo "============================================================"

          FOUND_ROOT=""

          # --------------------------------------------------------
          # Root project
          # --------------------------------------------------------

          if [[ -f "settings.gradle.kts" ]] && \
             [[ -f "app/build.gradle.kts" ]]; then

            FOUND_ROOT="$PWD"

            echo "Android project found at repository root."

          fi

          # --------------------------------------------------------
          # V81 ZIP
          # --------------------------------------------------------

          if [[ -z "$FOUND_ROOT" ]] && [[ -f "$ZIP_NAME" ]]; then

            echo "Found V81 ZIP:"
            echo "$ZIP_NAME"

            rm -rf extracted_project

            mkdir -p extracted_project

            unzip -q "$ZIP_NAME" -d extracted_project

            FOUND_ROOT="$(
              find "$PWD/extracted_project" \
                -type f \
                -name "settings.gradle.kts" \
                -print \
                | while read -r file; do

                    dir="$(dirname "$file")"

                    if [[ -f "$dir/app/build.gradle.kts" ]]; then
                      echo "$dir"
                      break
                    fi

                  done
            )"

          fi

          # --------------------------------------------------------
          # Any Android project
          # --------------------------------------------------------

          if [[ -z "$FOUND_ROOT" ]]; then

            FOUND_ROOT="$(
              find "$PWD" \
                -type f \
                -name "settings.gradle.kts" \
                -print \
                | while read -r file; do

                    dir="$(dirname "$file")"

                    if [[ -f "$dir/app/build.gradle.kts" ]]; then
                      echo "$dir"
                      break
                    fi

                  done
            )"

          fi

          if [[ -z "$FOUND_ROOT" ]]; then

            echo "ERROR: Android project not found."

            find "$PWD" \
              -maxdepth 7 \
              -type f \
              -print \
              | head -500

            exit 1

          fi

          echo "ANDROID_PROJECT_ROOT=$FOUND_ROOT" >> "$GITHUB_ENV"

          echo
          echo "ANDROID PROJECT:"
          echo "$FOUND_ROOT"

          echo
          echo "===== PROJECT FILES ====="

          find "$FOUND_ROOT" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -500


      # ============================================================
      # 7. SET UP GRADLE
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false


      # ============================================================
      # 8. VERIFY PROJECT CONFIGURATION
      # ============================================================

      - name: Verify project configuration
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " PROJECT CONFIGURATION"
          echo "============================================================"

          test -f settings.gradle.kts
          test -f app/build.gradle.kts

          echo
          echo "===== SETTINGS ====="

          sed -n '1,260p' settings.gradle.kts

          echo
          echo "===== APP BUILD GRADLE ====="

          sed -n '1,420p' app/build.gradle.kts

          echo
          echo "===== CONFIGURATION CHECK ====="

          grep -q 'com.majdoor.hisaab' app/build.gradle.kts

          grep -Eq \
            'compileSdk.*36|compileSdk = 36' \
            app/build.gradle.kts

          grep -Eq \
            'targetSdk.*36|targetSdk = 36' \
            app/build.gradle.kts

          grep -Eq \
            'versionCode.*77|versionCode = 77' \
            app/build.gradle.kts

          grep -Eq \
            'versionName.*1.77.0|versionName = "1.77.0"' \
            app/build.gradle.kts

          echo
          echo "PROJECT CONFIGURATION PASSED"


      # ============================================================
      # 9. LOCATE MAINACTIVITYSCREENS
      # ============================================================

      - name: Locate MainActivityScreens
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          SRC="$(
            find . \
              -type f \
              -name "MainActivityScreens.kt" \
              -print \
              | head -n 1
          )"

          if [[ -z "$SRC" ]]; then
            echo "ERROR: MainActivityScreens.kt not found."
            exit 1
          fi

          echo "MAIN_ACTIVITY_SCREENS=$SRC" >> "$GITHUB_ENV"

          echo
          echo "SOURCE:"
          echo "$SRC"


      # ============================================================
      # 10. COMPLETE V81 KOTLIN SOURCE FIX
      # ============================================================

      - name: Apply complete V81 Kotlin fixes
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          export MAIN_ACTIVITY_SCREENS="$MAIN_ACTIVITY_SCREENS"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          src = Path(os.environ["MAIN_ACTIVITY_SCREENS"])

          if not src.exists():
              raise SystemExit(
                  f"ERROR: Source not found: {src}"
              )

          text = src.read_text(
              encoding="utf-8"
          )

          print("============================================================")
          print(" APPLYING V81 KOTLIN FIXES")
          print("============================================================")
          print("SOURCE:", src)

          # ========================================================
          # 1. btn() DEFAULT ACTION
          # ========================================================

          text = text.replace(
              "internal fun MainActivity.btn(s:String,action:()->Unit)=TextView(this).apply{",
              "internal fun MainActivity.btn(s:String,action:()->Unit = {})=TextView(this).apply{"
          )

          text = text.replace(
              "internal fun MainActivity.btn(s: String, action: () -> Unit) = TextView(this).apply {",
              "internal fun MainActivity.btn(s: String, action: () -> Unit = {}) = TextView(this).apply {"
          )

          # ========================================================
          # 2. ScrollView
          # ========================================================

          text = text.replace(
              "fillViewport=true",
              "setFillViewport(true)"
          )

          text = text.replace(
              "fillViewport = true",
              "setFillViewport(true)"
          )

          # ========================================================
          # 3. pick() RETURN TYPE
          # ========================================================

          text = re.sub(
              r'(\bonPick\s*:\s*\(Int\)\s*->\s*Unit\s*\)\s*:\s*)Button\b',
              r'\1TextView',
              text
          )

          text = re.sub(
              r'(\bonPick\s*:\s*\(Int\)\s*->\s*Unit\s*\)\s*:\s*)\s*Button\b',
              r'\1TextView',
              text
          )

          # ========================================================
          # 4. statusViews MAP
          # ========================================================

          text = text.replace(
              'statusViews.forEach{it.text="FULL"}',
              'statusViews.values.forEach{it.text="FULL"}'
          )

          text = text.replace(
              'statusViews.forEach{it.text="HALF"}',
              'statusViews.values.forEach{it.text="HALF"}'
          )

          text = text.replace(
              'statusViews.forEach{it.text=AttendanceRules.UNMARKED}',
              'statusViews.values.forEach{it.text=AttendanceRules.UNMARKED}'
          )

          # ========================================================
          # 5. BUTTON CALLBACK FIXES
          # ========================================================

          fixes = [

              (
                  'fieldId=fields[i].id;it.text="Field: ${fields[i].name}"',
                  'fieldId=fields[i].id;fb.text="Field: ${fields[i].name}"'
              ),

              (
                  'cropId=crops[i].id;it.text="Crop: ${crops[i].name}"',
                  'cropId=crops[i].id;cropBtn.text="Crop: ${crops[i].name}"'
              ),

              (
                  'setPositiveButton("Done"){_,_->it.text="Workers: ${selectedWorkers.distinct().size}"}',
                  'setPositiveButton("Done"){_,_->workerBtn.text="Workers: ${selectedWorkers.distinct().size}"}'
              ),

              (
                  'rateType=app.calculation.rateTypes()[i];it.text="Rate type: $rateType"',
                  'rateType=app.calculation.rateTypes()[i];rateTypeBtn.text="Rate type: $rateType"'
              ),

              (
                  'wid=workers[i].id;it.text="Worker: ${workers[i].name}"',
                  'wid=workers[i].id;wb.text="Worker: ${workers[i].name}"'
              ),

              (
                  'method=methods[i];it.text="Method: ${methods[i]}"',
                  'method=methods[i];mb.text="Method: ${methods[i]}"'
              ),

              (
                  'advance=!advance;it.text="Advance: ${if(advance)"YES" else "NO"}"',
                  'advance=!advance;adv.text="Advance: ${if(advance)"YES" else "NO"}"'
              ),

              (
                  'cat=cats[i];it.text="Category: $cat"',
                  'cat=cats[i];cb.text="Category: $cat"'
              ),

              (
                  'fieldId="";it.text="Field: Not linked"',
                  'fieldId="";fb.text="Field: Not linked"'
              ),

              (
                  'fieldId=fields[i-1].id;it.text="Field: ${fields[i-1].name}"',
                  'fieldId=fields[i-1].id;fb.text="Field: ${fields[i-1].name}"'
              ),

              (
                  'cropId="";it.text="Crop: Not linked"',
                  'cropId="";crb.text="Crop: Not linked"'
              ),

              (
                  'cropId=crops[i-1].id;it.text="Crop: ${crops[i-1].name}"',
                  'cropId=crops[i-1].id;crb.text="Crop: ${crops[i-1].name}"'
              ),

              (
                  'it.text="Worker: ${if(i==0)"All" else workers[i-1].name}"',
                  'wb.text="Worker: ${if(i==0)"All" else workers[i-1].name}"'
              ),

              (
                  'it.text="Field: ${if(i==0)"All" else fields[i-1].name}"',
                  'fb.text="Field: ${if(i==0)"All" else fields[i-1].name}"'
              ),

              (
                  'it.text="Crop: ${if(i==0)"All" else crops[i-1].name}"',
                  'cb.text="Crop: ${if(i==0)"All" else crops[i-1].name}"'
              ),

              (
                  'it.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"',
                  'fieldBtn.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"'
              ),

              (
                  'it.text="Status: $status"',
                  'statusBtn.text="Status: $status"'
              ),

              (
                  'it.text="Rate type: $rateType"',
                  'rateTypeBtn.text="Rate type: $rateType"'
              )
          ]

          for old, new in fixes:
              text = text.replace(
                  old,
                  new
              )

          # ========================================================
          # 6. MORE GENERIC BUTTON CALLBACK FIXES
          # ========================================================

          text = text.replace(
              'it.text="Worker: ${workers[i].name}"',
              'wb.text="Worker: ${workers[i].name}"'
          )

          text = text.replace(
              'it.text="Method: ${methods[i]}"',
              'mb.text="Method: ${methods[i]}"'
          )

          text = text.replace(
              'it.text="Category: $cat"',
              'cb.text="Category: $cat"'
          )

          # ========================================================
          # 7. Intent.type SHADOWING
          # ========================================================

          text = re.sub(
              r'(\.apply\s*\{\s*)type\s*=\s*"image/\*"',
              r'\1this.type="image/*"',
              text
          )

          text = re.sub(
              r'(\.apply\s*\{\s*)type\s*=\s*"application/zip"',
              r'\1this.type="application/zip"',
              text
          )

          text = re.sub(
              r'(\.apply\s*\{\s*)type\s*=\s*"\*/\*"',
              r'\1this.type="*/*"',
              text
          )

          # ========================================================
          # 8. AUDIT COMPATIBILITY
          # ========================================================

          text = text.replace(
              ".audit.auditLog",
              ".auditLog"
          )

          text = text.replace(
              "clearAuditLog",
              "clear"
          )

          text = text.replace(
              "getSystemService(ALARM_SERVICE)",
              "getSystemService(Context.ALARM_SERVICE)"
          )

          # ========================================================
          # 9. EXPORT when(exportType) - DEFINITIVE FIX
          # ========================================================

          # First find the export block.
          export_pos = text.find(
              "contentResolver.openOutputStream(uri)"
          )

          if export_pos >= 0:

              # Find the next closing area conservatively.
              export_end = text.find(
                  "}}",
                  export_pos
              )

              if export_end < 0:
                  export_end = min(
                      len(text),
                      export_pos + 3000
                  )

              export_block = text[
                  export_pos:
                  export_end + 2
              ]

              # ----------------------------------------------------
              # Replace subject-style when(exportType)
              # ----------------------------------------------------

              export_block = re.sub(
                  r'when\s*\(\s*exportType\s*\)\s*\{',
                  'when {',
                  export_block
              )

              # ----------------------------------------------------
              # String cases -> boolean conditions
              # ----------------------------------------------------

              export_block = re.sub(
                  r'(?m)^(\s*)"workers"\s*->',
                  r'\1exportType == "workers" ->',
                  export_block
              )

              export_block = re.sub(
                  r'(?m)^(\s*)"ledger"\s*->',
                  r'\1exportType == "ledger" ->',
                  export_block
              )

              export_block = re.sub(
                  r'(?m)^(\s*)"pdf"\s*->',
                  r'\1exportType == "pdf" ->',
                  export_block
              )

              export_block = re.sub(
                  r'(?m)^(\s*)"backup"\s*->',
                  r'\1exportType == "backup" ->',
                  export_block
              )

              # Same-line cases.
              export_block = export_block.replace(
                  '"workers"->',
                  'exportType == "workers" ->'
              )

              export_block = export_block.replace(
                  '"workers" ->',
                  'exportType == "workers" ->'
              )

              export_block = export_block.replace(
                  '"ledger"->',
                  'exportType == "ledger" ->'
              )

              export_block = export_block.replace(
                  '"ledger" ->',
                  'exportType == "ledger" ->'
              )

              export_block = export_block.replace(
                  '"pdf"->',
                  'exportType == "pdf" ->'
              )

              export_block = export_block.replace(
                  '"pdf" ->',
                  'exportType == "pdf" ->'
              )

              export_block = export_block.replace(
                  '"backup"->',
                  'exportType == "backup" ->'
              )

              export_block = export_block.replace(
                  '"backup" ->',
                  'exportType == "backup" ->'
              )

              text = (
                  text[:export_pos]
                  + export_block
                  + text[export_end + 2:]
              )

          # ========================================================
          # 10. RENDER SUMMARY FORWARD REFERENCE
          # ========================================================

          calendar_start = text.find(
              "internal fun MainActivity.attendanceCalendar"
          )

          calendar_end = text.find(
              "internal fun MainActivity.paymentLedger",
              calendar_start
          )

          if (
              calendar_start >= 0
              and calendar_end > calendar_start
          ):

              calendar = text[
                  calendar_start:
                  calendar_end
              ]

              render_pos = calendar.find(
                  "fun render(){"
              )

              summary_pos = calendar.find(
                  "fun renderSummary(){"
              )

              if (
                  render_pos >= 0
                  and summary_pos >= 0
                  and summary_pos > render_pos
              ):

                  # Find end of renderSummary.
                  summary_end = calendar.find(
                      "        val nav=",
                      summary_pos
                  )

                  if summary_end > summary_pos:

                      render_block = calendar[
                          render_pos:
                          summary_pos
                      ]

                      summary_block = calendar[
                          summary_pos:
                          summary_end
                      ]

                      calendar = (
                          calendar[:render_pos]
                          + summary_block
                          + "\n"
                          + render_block
                          + calendar[summary_end:]
                      )

                      text = (
                          text[:calendar_start]
                          + calendar
                          + text[calendar_end:]
                      )

          # ========================================================
          # 11. SAVE
          # ========================================================

          src.write_text(
              text,
              encoding="utf-8"
          )

          print()
          print("SOURCE PATCH COMPLETED")


      # ============================================================
      # 11. FINAL SOURCE AUDIT
      # ============================================================

      - name: Final Kotlin source audit
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          SRC="$MAIN_ACTIVITY_SCREENS"

          echo "============================================================"
          echo " FINAL KOTLIN SOURCE AUDIT"
          echo "============================================================"

          test -f "$SRC"

          echo
          echo "SOURCE:"
          echo "$SRC"

          echo
          echo "===== BTN ====="

          grep -n \
            -E \
            "fun MainActivity.btn" \
            "$SRC" \
            || true

          echo
          echo "===== PICK ====="

          grep -n \
            -E \
            "fun MainActivity.pick" \
            "$SRC" \
            || true

          echo
          echo "===== EXPORT BLOCK ====="

          grep -n \
            -A18 \
            -B4 \
            "contentResolver.openOutputStream(uri)" \
            "$SRC" \
            || true

          echo
          echo "===== REMAINING PROBLEM PATTERNS ====="

          PROBLEMS=0

          if grep -Eq \
            'when[[:space:]]*\([[:space:]]*exportType[[:space:]]*\)' \
            "$SRC"; then

            echo "FAIL: when(exportType) still exists"
            PROBLEMS=$((PROBLEMS + 1))

          else

            echo "PASS: when(exportType) removed"

          fi

          if grep -Eq \
            'fillViewport[[:space:]]*=' \
            "$SRC"; then

            echo "FAIL: old fillViewport assignment exists"
            PROBLEMS=$((PROBLEMS + 1))

          else

            echo "PASS: ScrollView fix"

          fi

          if grep -Fq \
            'it.text="Field:' \
            "$SRC"; then

            echo "FAIL: Field it.text callback remains"
            PROBLEMS=$((PROBLEMS + 1))

          fi

          if grep -Fq \
            'it.text="Status:' \
            "$SRC"; then

            echo "FAIL: Status it.text callback remains"
            PROBLEMS=$((PROBLEMS + 1))

          fi

          if grep -Fq \
            'it.text="Crop:' \
            "$SRC"; then

            echo "FAIL: Crop it.text callback remains"
            PROBLEMS=$((PROBLEMS + 1))

          fi

          if grep -Fq \
            'it.text="Worker:' \
            "$SRC"; then

            echo "FAIL: Worker it.text callback remains"
            PROBLEMS=$((PROBLEMS + 1))

          fi

          if grep -Fq \
            'it.text="Method:' \
            "$SRC"; then

            echo "FAIL: Method it.text callback remains"
            PROBLEMS=$((PROBLEMS + 1))

          fi

          if grep -Fq \
            'it.text="Advance:' \
            "$SRC"; then

            echo "FAIL: Advance it.text callback remains"
            PROBLEMS=$((PROBLEMS + 1))

          fi

          if grep -Fq \
            'it.text="Category:' \
            "$SRC"; then

            echo "FAIL: Category it.text callback remains"
            PROBLEMS=$((PROBLEMS + 1))

          fi

          if grep -Fq \
            'it.text="Rate type:' \
            "$SRC"; then

            echo "FAIL: Rate type it.text callback remains"
            PROBLEMS=$((PROBLEMS + 1))

          fi

          if grep -Fq \
            'setPositiveButton("Done"){_,_->it.text=' \
            "$SRC"; then

            echo "FAIL: Dialog button it.text callback remains"
            PROBLEMS=$((PROBLEMS + 1))

          fi

          if grep -Eq \
            'onPick[[:space:]]*:[[:space:]]*\(Int\)[[:space:]]*->[[:space:]]*Unit[[:space:]]*\)[[:space:]]*:[[:space:]]*Button' \
            "$SRC"; then

            echo "FAIL: pick() still returns Button"
            PROBLEMS=$((PROBLEMS + 1))

          else

            echo "PASS: pick() return type"

          fi

          if grep -Fq \
            'statusViews.forEach{it.text=' \
            "$SRC"; then

            echo "FAIL: statusViews Pair iteration remains"
            PROBLEMS=$((PROBLEMS + 1))

          else

            echo "PASS: statusViews map iteration"

          fi

          echo
          echo "===== KOTLIN ERROR-PRONE LINES ====="

          grep -n \
            -E \
            "when|fillViewport|statusViews|renderSummary|it.text" \
            "$SRC" \
            | head -300 \
            || true

          echo

          if [[ "$PROBLEMS" -ne 0 ]]; then

            echo "============================================================"
            echo " SOURCE AUDIT FAILED"
            echo " Problems: $PROBLEMS"
            echo "============================================================"

            exit 1

          fi

          echo "============================================================"
          echo " SOURCE AUDIT PASSED"
          echo "============================================================"


      # ============================================================
      # 12. VERIFY GRADLE / JAVA
      # ============================================================

      - name: Verify Gradle environment
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " GRADLE ENVIRONMENT"
          echo "============================================================"

          java -version

          echo
          gradle --version

          echo
          echo "GRADLE ENVIRONMENT PASSED"


      # ============================================================
      # 13. CLEAN
      # ============================================================

      - name: Clean project
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " CLEAN PROJECT"
          echo "============================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            clean

          echo
          echo "CLEAN PASSED"


      # ============================================================
      # 14. COMPILE RELEASE KOTLIN
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " COMPILE RELEASE KOTLIN"
          echo "============================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseKotlin

          echo
          echo "============================================================"
          echo " COMPILE RELEASE KOTLIN PASSED"
          echo "============================================================"


      # ============================================================
      # 15. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble unsigned Release APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " ASSEMBLE RELEASE APK"
          echo "============================================================"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

          echo
          echo "===== APK FILES ====="

          find \
            app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ============================================================
      # 16. LOCATE RELEASE APK
      # ============================================================

      - name: Locate release APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          APK=""

          if [[ -f \
            "app/build/outputs/apk/release/app-release-unsigned.apk"
          ]]; then

            APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          fi

          if [[ -z "$APK" ]]; then

            APK="$(
              find \
                app/build/outputs/apk/release \
                -type f \
                -name "*-unsigned.apk" \
                -print \
                | head -n 1
            )"

          fi

          if [[ -z "$APK" ]]; then

            APK="$(
              find \
                app/build/outputs/apk/release \
                -type f \
                -name "*.apk" \
                -print \
                | head -n 1
            )"

          fi

          if [[ -z "$APK" ]]; then

            echo "ERROR: Release APK not found."

            find \
              app/build/outputs/apk \
              -type f \
              -print \
              || true

            exit 1

          fi

          echo "RELEASE_APK=$APK" >> "$GITHUB_ENV"

          echo
          echo "RELEASE APK:"
          echo "$APK"

          ls -lh "$APK"


      # ============================================================
      # 17. VERIFY APK PACKAGE / VERSION
      # ============================================================

      - name: Verify APK package and version
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          echo "============================================================"
          echo " APK PACKAGE / VERSION"
          echo "============================================================"

          BADGING="$(
            "$AAPT" \
              dump badging \
              "$RELEASE_APK"
          )"

          echo "$BADGING" \
            | grep -E \
              "package: name=|versionCode=|versionName="

          echo "$BADGING" \
            | grep -q \
              "name='${PACKAGE_NAME}'" \
            || {
              echo "ERROR: Package mismatch."
              exit 1
            }

          echo "$BADGING" \
            | grep -q \
              "versionCode='${VERSION_CODE}'" \
            || {
              echo "ERROR: VersionCode mismatch."
              exit 1
            }

          echo "$BADGING" \
            | grep -q \
              "versionName='${VERSION_NAME}'" \
            || {
              echo "ERROR: VersionName mismatch."
              exit 1
            }

          echo
          echo "APK PACKAGE / VERSION PASSED"


      # ============================================================
      # 18. PREPARE RELEASE SIGNING
      # ============================================================

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " PREPARE RELEASE SIGNING"
          echo "============================================================"

          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "ERROR: KEYSTORE_BASE64 secret missing."
            exit 1
          fi

          if [[ -z "${KEYSTORE_PASSWORD:-}" ]]; then
            echo "ERROR: KEYSTORE_PASSWORD secret missing."
            exit 1
          fi

          if [[ -z "${KEY_ALIAS:-}" ]]; then
            echo "ERROR: KEY_ALIAS secret missing."
            exit 1
          fi

          if [[ -z "${KEY_PASSWORD:-}" ]]; then
            echo "ERROR: KEY_PASSWORD secret missing."
            exit 1
          fi

          SIGN_DIR="$RUNNER_TEMP/release-signing"

          mkdir -p "$SIGN_DIR"

          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$SIGN_DIR/release.keystore"

          test -s "$SIGN_DIR/release.keystore"

          echo "KEYSTORE_PATH=$SIGN_DIR/release.keystore" \
            >> "$GITHUB_ENV"

          echo
          echo "KEYSTORE READY"


      # ============================================================
      # 19. ZIPALIGN
      # ============================================================

      - name: Zipalign release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " ZIPALIGN RELEASE APK"
          echo "============================================================"

          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"

          mkdir -p \
            "$RUNNER_TEMP/apk"

          ALIGNED="$RUNNER_TEMP/apk/Majdoor-Hisaab-PRO-${VERSION_NAME}-aligned.apk"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$ANDROID_PROJECT_ROOT/$RELEASE_APK" \
            "$ALIGNED"

          test -s "$ALIGNED"

          echo "ZIPALIGNED_APK=$ALIGNED" \
            >> "$GITHUB_ENV"

          ls -lh "$ALIGNED"

          echo
          echo "ZIPALIGN PASSED"


      # ============================================================
      # 20. SIGN RELEASE APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " SIGN RELEASE APK"
          echo "============================================================"

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          SIGNED="$RUNNER_TEMP/apk/Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$SIGNED" \
            "$ZIPALIGNED_APK"

          test -s "$SIGNED"

          echo "SIGNED_APK=$SIGNED" \
            >> "$GITHUB_ENV"

          ls -lh "$SIGNED"

          echo
          echo "APK SIGNED"


      # ============================================================
      # 21. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " VERIFY APK SIGNATURE"
          echo "============================================================"

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" \
            verify \
            --verbose \
            "$SIGNED_APK"

          echo
          echo "APK SIGNATURE VERIFIED"


      # ============================================================
      # 22. FINAL APK VALIDATION
      # ============================================================

      - name: Final APK validation
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " FINAL APK VALIDATION"
          echo "============================================================"

          AAPT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"

          BADGING="$(
            "$AAPT" \
              dump badging \
              "$SIGNED_APK"
          )"

          echo "$BADGING" \
            | grep -E \
              "package: name=|versionCode=|versionName="

          echo "$BADGING" \
            | grep -q \
              "name='${PACKAGE_NAME}'"

          echo "$BADGING" \
            | grep -q \
              "versionCode='${VERSION_CODE}'"

          echo "$BADGING" \
            | grep -q \
              "versionName='${VERSION_NAME}'"

          echo
          echo "APK SIZE:"

          ls -lh "$SIGNED_APK"

          echo
          echo "SHA256:"

          sha256sum "$SIGNED_APK"

          echo
          echo "FINAL APK VALIDATION PASSED"


      # ============================================================
      # 23. PREPARE FINAL RELEASE ARTIFACT
      # ============================================================

      - name: Prepare final release artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " PREPARE FINAL RELEASE ARTIFACT"
          echo "============================================================"

          FINAL_DIR="$GITHUB_WORKSPACE/final-release"

          mkdir -p "$FINAL_DIR"

          FINAL_APK="$FINAL_DIR/Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"

          cp \
            "$SIGNED_APK" \
            "$FINAL_APK"

          sha256sum \
            "$FINAL_APK" \
            > "$FINAL_DIR/SHA256SUMS.txt"

          echo
          echo "===== FINAL RELEASE ====="

          ls -lh "$FINAL_DIR"

          echo
          cat "$FINAL_DIR/SHA256SUMS.txt"


      # ============================================================
      # 24. UPLOAD SIGNED APK
      # ============================================================

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-${{ env.VERSION_NAME }}-Release-Signed
          path: |
            final-release/Majdoor-Hisaab-PRO-${{ env.VERSION_NAME }}-Release-Signed.apk
            final-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 25. FINAL RELEASE VERIFICATION
      # ============================================================

      - name: Final release verification
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo
          echo "       MAJDOOR HISAAB PRO"
          echo "       FINAL SIGNED RELEASE APK"
          echo
          echo "============================================================"
          echo

          echo "Package     : ${PACKAGE_NAME}"
          echo "Version     : ${VERSION_NAME}"
          echo "VersionCode : ${VERSION_CODE}"
          echo "Android API : ${ANDROID_API}"
          echo "Build Tools : ${BUILD_TOOLS}"
          echo "Java        : ${JAVA_VERSION}"
          echo "Gradle      : ${GRADLE_VERSION}"

          echo
          echo "APK:"
          echo "Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"

          echo
          echo "SHA256:"

          cat \
            final-release/SHA256SUMS.txt

          echo
          echo "============================================================"
          echo "       BUILD COMPLETED SUCCESSFULLY"
          echo "============================================================"
