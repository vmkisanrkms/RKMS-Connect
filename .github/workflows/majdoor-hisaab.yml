name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_GANNA_PARCHI_BACKUP_APPLOCK_FINAL_V18_REFERENCE_UI_FIXED_V4_FINAL_FIXED_V3_GOOGLE_DRIVE_DIRECT_API_FANDI_V3.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

  EXPECTED_PACKAGE: "com.majdoor.hisaabpro"

jobs:

  build-release:

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Android SDK installed successfully."

          adb version || true
          sdkmanager --list_installed | grep -E "platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}" || true

      # ============================================================
      # 4. SHOW FILES
      # ============================================================

      - name: Show repository files
        shell: bash
        run: |
          set -e

          echo "================================================"
          echo "Repository root"
          echo "================================================"

          pwd
          ls -lah

          echo ""
          echo "ZIP files:"
          find . -maxdepth 3 -type f -iname "*.zip" -print

      # ============================================================
      # 5. VERIFY EXACT ZIP
      # ============================================================

      - name: Verify source ZIP
        shell: bash
        run: |
          set -e

          echo "Looking for:"
          echo "${ZIP_NAME}"

          if [ ! -f "${ZIP_NAME}" ]; then
            echo ""
            echo "ERROR: Required ZIP file was NOT found."
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 4 -type f -iname "*.zip" -print
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "${ZIP_NAME}"

      # ============================================================
      # 6. EXTRACT ZIP
      # ============================================================

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          echo "Extracting:"
          echo "${ZIP_NAME}"

          unzip -q "${ZIP_NAME}" -d source

          echo ""
          echo "Extraction complete."

          echo ""
          echo "Top-level extracted files:"
          find source -maxdepth 3 -type f | head -200

      # ============================================================
      # 7. FIND ANDROID PROJECT
      # ============================================================

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle Android project..."

          PROJECT_DIR=""

          if [ -f "source/gradlew" ]; then
            PROJECT_DIR="source"
          else
            FOUND_GRADLEW="$(find source -type f -name gradlew -print -quit || true)"

            if [ -n "${FOUND_GRADLEW}" ]; then
              PROJECT_DIR="$(dirname "${FOUND_GRADLEW}")"
            fi
          fi

          if [ -z "${PROJECT_DIR}" ]; then
            echo ""
            echo "ERROR: gradlew was not found inside the ZIP."
            echo ""
            echo "Project files:"
            find source -maxdepth 5 -type f | sort | head -500
            exit 1
          fi

          PROJECT_DIR="$(cd "${PROJECT_DIR}" && pwd)"

          echo "ANDROID_PROJECT_DIR=${PROJECT_DIR}" >> "${GITHUB_ENV}"

          echo ""
          echo "Android project:"
          echo "${PROJECT_DIR}"

          ls -lah "${PROJECT_DIR}"

      # ============================================================
      # 8. MAKE GRADLE WRAPPER EXECUTABLE
      # ============================================================

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          chmod +x gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      # ============================================================
      # 9. FORCE GRADLE VERSION
      # ============================================================

      - name: Verify Gradle version
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          CURRENT_GRADLE="$(./gradlew --version | grep "Gradle " | head -1 || true)"

          echo "Current:"
          echo "${CURRENT_GRADLE}"

          echo ""
          echo "Required Gradle:"
          echo "${GRADLE_VERSION}"

      # ============================================================
      # 10. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          echo "Checking Android project..."

          test -f settings.gradle || \
          test -f settings.gradle.kts || {
            echo "ERROR: settings.gradle/settings.gradle.kts missing."
            exit 1
          }

          test -f build.gradle || \
          test -f build.gradle.kts || {
            echo "ERROR: build.gradle/build.gradle.kts missing."
            exit 1
          }

          echo ""
          echo "Android project verified."

          echo ""
          echo "Gradle files:"
          find . -maxdepth 4 \
            \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      # ============================================================
      # 11. LOCATE KOTLIN SOURCES
      # ============================================================

      - name: Locate Kotlin sources
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          echo "Kotlin files found:"
          find . -type f -name "*.kt" -print | head -300

      # ============================================================
      # 12. CHECK PACKAGE NAME
      # ============================================================

      - name: Verify package configuration
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          echo "Searching package references..."

          grep -R \
            --include="*.kt" \
            --include="*.xml" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            "com.majdoor.hisaabpro" . || true

          echo ""
          echo "Expected package:"
          echo "${EXPECTED_PACKAGE}"

      # ============================================================
      # 13. CLEAN
      # ============================================================

      - name: Gradle clean
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          ./gradlew clean --no-daemon --stacktrace

      # ============================================================
      # 14. COMPILE RELEASE
      # ============================================================

      - name: Compile Release Kotlin
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          ./gradlew \
            compileReleaseKotlin \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ============================================================
      # 15. BUILD RELEASE APK
      # ============================================================

      - name: Assemble Release APK
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ============================================================
      # 16. FIND APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          cd "${ANDROID_PROJECT_DIR}"

          echo "Searching for APK..."

          find . \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            -print

          APK="$(find . \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit || true)"

          if [ -z "${APK}" ]; then
            echo ""
            echo "ERROR: Release APK not found."
            exit 1
          fi

          APK="$(cd "$(dirname "${APK}")" && pwd)/$(basename "${APK}")"

          echo "RELEASE_APK=${APK}" >> "${GITHUB_ENV}"

          echo ""
          echo "Release APK:"
          echo "${APK}"

          ls -lh "${APK}"

      # ============================================================
      # 17. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK package name
        shell: bash
        run: |
          set -e

          APK="${RELEASE_APK}"

          echo "APK:"
          echo "${APK}"

          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging "${APK}" | head -20

          PACKAGE_NAME="$(
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt" \
            dump badging "${APK}" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )"

          echo ""
          echo "Detected package:"
          echo "${PACKAGE_NAME}"

          if [ "${PACKAGE_NAME}" != "${EXPECTED_PACKAGE}" ]; then
            echo ""
            echo "ERROR: Package name mismatch."
            echo "Expected: ${EXPECTED_PACKAGE}"
            echo "Found:    ${PACKAGE_NAME}"
            exit 1
          fi

          echo ""
          echo "PACKAGE VERIFIED."

      # ============================================================
      # 18. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          mkdir -p final

          ALIGNED_APK="final/${APK_UNSIGNED_NAME}"

          "${BUILD_TOOLS_DIR}/zipalign" \
            -f \
            -p \
            4 \
            "${RELEASE_APK}" \
            "${ALIGNED_APK}"

          echo "ALIGNED_APK=${ALIGNED_APK}" >> "${GITHUB_ENV}"

          echo ""
          echo "Aligned APK:"
          ls -lh "${ALIGNED_APK}"

          "${BUILD_TOOLS_DIR}/zipalign" -c -v 4 "${ALIGNED_APK}"

      # ============================================================
      # 19. CREATE SIGNING KEY
      # ============================================================

      - name: Prepare signing keystore
        shell: bash
        run: |
          set -e

          mkdir -p signing

          KEYSTORE="signing/majdoor-hisaab-pro-release.jks"

          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then

            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" \
              | base64 --decode > "${KEYSTORE}"

            echo "Using GitHub Actions release keystore."

          else

            echo "RELEASE_KEYSTORE_BASE64 is not configured."
            echo "Generating temporary signing keystore for this build."

            keytool \
              -genkeypair \
              -v \
              -keystore "${KEYSTORE}" \
              -alias majdoor-hisaab-pro \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "MajdoorHisaabPro@2026" \
              -keypass "MajdoorHisaabPro@2026" \
              -dname "CN=Majdoor Hisaab PRO, OU=Android, O=Majdoor Hisaab PRO, L=India, ST=Uttar Pradesh, C=IN"

          fi

          test -f "${KEYSTORE}"

          echo "KEYSTORE=${KEYSTORE}" >> "${GITHUB_ENV}"

      # ============================================================
      # 20. SIGN APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          SIGNED_APK="final/${APK_SIGNED_NAME}"

          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then

            STORE_PASSWORD="${{ secrets.RELEASE_STORE_PASSWORD }}"
            KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"
            KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}"

            if [ -z "${STORE_PASSWORD}" ]; then
              echo "ERROR: RELEASE_STORE_PASSWORD secret is missing."
              exit 1
            fi

            if [ -z "${KEY_PASSWORD}" ]; then
              echo "ERROR: RELEASE_KEY_PASSWORD secret is missing."
              exit 1
            fi

            if [ -z "${KEY_ALIAS}" ]; then
              echo "ERROR: RELEASE_KEY_ALIAS secret is missing."
              exit 1
            fi

          else

            STORE_PASSWORD="MajdoorHisaabPro@2026"
            KEY_PASSWORD="MajdoorHisaabPro@2026"
            KEY_ALIAS="majdoor-hisaab-pro"

          fi

          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks "${KEYSTORE}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass "pass:${STORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "${SIGNED_APK}" \
            "${ALIGNED_APK}"

          echo "SIGNED_APK=${SIGNED_APK}" >> "${GITHUB_ENV}"

          echo ""
          echo "SIGNED APK CREATED:"
          ls -lh "${SIGNED_APK}"

      # ============================================================
      # 21. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          echo "Verifying signature..."

          "${BUILD_TOOLS_DIR}/apksigner" verify \
            --verbose \
            "${SIGNED_APK}"

          echo ""
          echo "================================================"
          echo "APK SIGNATURE VERIFIED SUCCESSFULLY"
          echo "================================================"

      # ============================================================
      # 22. VERIFY FINAL APK
      # ============================================================

      - name: Final APK validation
        shell: bash
        run: |
          set -e

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          echo "Final APK:"
          ls -lh "${SIGNED_APK}"

          echo ""
          echo "APK package:"
          "${BUILD_TOOLS_DIR}/aapt" \
            dump badging "${SIGNED_APK}" | head -5

          echo ""
          echo "APK signature:"
          "${BUILD_TOOLS_DIR}/apksigner" verify \
            --verbose \
            "${SIGNED_APK}"

          echo ""
          echo "ZIPALIGN:"
          "${BUILD_TOOLS_DIR}/zipalign" \
            -c -v 4 \
            "${SIGNED_APK}"

          echo ""
          echo "================================================"
          echo "FINAL APK VALIDATION PASSED"
          echo "================================================"

      # ============================================================
      # 23. CREATE BUILD INFO
      # ============================================================

      - name: Create build information
        shell: bash
        run: |
          set -e

          mkdir -p final

          cat > final/BUILD_INFO.txt <<EOF
Majdoor Hisaab PRO V82

Source ZIP:
${ZIP_NAME}

Package:
${EXPECTED_PACKAGE}

Java:
${JAVA_VERSION}

Gradle:
${GRADLE_VERSION}

Android API:
${ANDROID_API}

Build Tools:
${BUILD_TOOLS}

Unsigned APK:
${APK_UNSIGNED_NAME}

Signed APK:
${APK_SIGNED_NAME}

Build:
${GITHUB_RUN_NUMBER}

Commit:
${GITHUB_SHA}

Status:
FINAL RELEASE APK VERIFIED
EOF

          cat final/BUILD_INFO.txt

      # ============================================================
      # 24. UPLOAD SIGNED APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED
          path: |
            final/${{ env.APK_SIGNED_NAME }}
            final/${{ env.APK_UNSIGNED_NAME }}
            final/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 25. UPLOAD SOURCE ZIP
      # ============================================================

      - name: Upload Source ZIP Backup
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-SOURCE-ZIP
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 26. FINAL SUCCESS MESSAGE
      # ============================================================

      - name: Final success
        shell: bash
        run: |
          echo ""
          echo "============================================================"
          echo "          MAJDOOR HISAAB PRO V82"
          echo "          FINAL RELEASE BUILD SUCCESS"
          echo "============================================================"
          echo ""
          echo "Source ZIP:"
          echo "${ZIP_NAME}"
          echo ""
          echo "Package:"
          echo "${EXPECTED_PACKAGE}"
          echo ""
          echo "Signed APK:"
          echo "${APK_SIGNED_NAME}"
          echo ""
          echo "Android API:"
          echo "${ANDROID_API}"
          echo ""
          echo "Build Tools:"
          echo "${BUILD_TOOLS}"
          echo ""
          echo "Gradle:"
          echo "${GRADLE_VERSION}"
          echo ""
          echo "Java:"
          echo "${JAVA_VERSION}"
          echo ""
          echo "APK SIGNATURE: VERIFIED"
          echo "ZIPALIGN: VERIFIED"
          echo "PACKAGE: VERIFIED"
          echo ""
          echo "============================================================"
