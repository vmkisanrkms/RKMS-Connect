name: Majdoor Hisaab PRO - Stable Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104.zip"

jobs:

  build-release-apk:

    name: Build and Sign Release APK

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. BUILD INFORMATION
      # ==========================================================

      - name: Show build configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MAJDOOR HISAAB PRO"
          echo "STABLE RELEASE APK BUILD"
          echo "=========================================="

          echo "Java        : ${JAVA_VERSION}"
          echo "Gradle      : ${GRADLE_VERSION}"
          echo "Android API : ${ANDROID_API}"
          echo "Build Tools : ${BUILD_TOOLS}"
          echo "Package     : ${PACKAGE_NAME}"
          echo "Version     : ${VERSION_NAME}"
          echo "VersionCode : ${VERSION_CODE}"

          echo "=========================================="


      # ==========================================================
      # 3. PREPARE AND FIND PROJECT
      #
      # FIXED:
      # - Git LFS ZIP support
      # - exact ZIP search
      # - safe ZIP copy
      # - ZIP integrity verification
      # - Python zip extraction
      # - detailed diagnostics
      # ==========================================================

      - name: Prepare Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf project
          rm -rf extracted

          mkdir -p project
          mkdir -p extracted

          echo "=========================================="
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "=========================================="

          if [ -f "settings.gradle.kts" ] &&
             [ -f "app/build.gradle.kts" ]; then

            echo "ANDROID_PROJECT_FOUND_IN_REPOSITORY"

            shopt -s dotglob

            cp -a . project/

          else

            echo "ANDROID_PROJECT_NOT_FOUND_AT_ROOT"
            echo "SEARCHING FOR PROJECT ZIP..."

            # ----------------------------------------------------
            # Try Git LFS if the repository uses LFS.
            # ----------------------------------------------------

            if command -v git-lfs >/dev/null 2>&1; then
              echo "GIT_LFS_DETECTED"

              git lfs install --local >/dev/null 2>&1 || true

              git lfs pull >/dev/null 2>&1 || true

              echo "GIT_LFS_PULL_COMPLETED"
            else
              echo "GIT_LFS_NOT_INSTALLED"
            fi


            # ----------------------------------------------------
            # Search expected ZIP first.
            # ----------------------------------------------------

            ZIP_PATH=""

            if [ -f "${ZIP_NAME}" ]; then
              ZIP_PATH="./${ZIP_NAME}"
            fi


            # ----------------------------------------------------
            # Search BUILD_FIXED ZIP.
            # ----------------------------------------------------

            if [ -z "$ZIP_PATH" ]; then

              if [ -f \
                "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip" ]; then

                ZIP_PATH="./Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip"

              fi

            fi


            # ----------------------------------------------------
            # Recursive exact search.
            # ----------------------------------------------------

            if [ -z "$ZIP_PATH" ]; then

              ZIP_PATH="$(
                find . \
                  -type f \
                  -name "${ZIP_NAME}" \
                  -not -path "./project/*" \
                  -not -path "./extracted/*" \
                  -not -path "./.git/*" \
                  -print \
                  | head -n 1
              )"

            fi


            # ----------------------------------------------------
            # Recursive BUILD_FIXED search.
            # ----------------------------------------------------

            if [ -z "$ZIP_PATH" ]; then

              ZIP_PATH="$(
                find . \
                  -type f \
                  -name "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip" \
                  -not -path "./project/*" \
                  -not -path "./extracted/*" \
                  -not -path "./.git/*" \
                  -print \
                  | head -n 1
              )"

            fi


            # ----------------------------------------------------
            # Final fallback.
            # ----------------------------------------------------

            if [ -z "$ZIP_PATH" ]; then

              ZIP_PATH="$(
                find . \
                  -type f \
                  -iname "Majdoor_Hisaab*.zip" \
                  -not -path "./project/*" \
                  -not -path "./extracted/*" \
                  -not -path "./.git/*" \
                  -print \
                  | head -n 1
              )"

            fi


            # ----------------------------------------------------
            # ZIP must exist.
            # ----------------------------------------------------

            if [ -z "$ZIP_PATH" ]; then

              echo ""
              echo "=========================================="
              echo "ERROR: MAJDOOR HISAAB PROJECT ZIP NOT FOUND"
              echo "=========================================="
              echo ""

              echo "Expected:"
              echo "${ZIP_NAME}"

              echo ""
              echo "BUILD_FIXED fallback:"
              echo "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip"

              echo ""
              echo "AVAILABLE ZIP FILES:"

              find . \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                -print \
                | head -n 50 || true

              echo ""
              echo "GIT TRACKED FILE CHECK:"

              git ls-files \
                | grep -Ei \
                'Majdoor_Hisaab.*\.zip$' \
                | head -n 50 || true

              exit 1

            fi


            # ----------------------------------------------------
            # Normalize path.
            # ----------------------------------------------------

            ZIP_PATH="$(realpath "$ZIP_PATH")"

            echo ""
            echo "=========================================="
            echo "PROJECT ZIP FOUND"
            echo "=========================================="

            echo "PROJECT_ZIP_FOUND=${ZIP_PATH}"

            test -f "$ZIP_PATH"
            test -r "$ZIP_PATH"

            ls -lh "$ZIP_PATH"


            # ----------------------------------------------------
            # Detect Git LFS pointer.
            # ----------------------------------------------------

            if head -n 1 "$ZIP_PATH" 2>/dev/null \
              | grep -Fq "version https://git-lfs.github.com/spec/v1"; then

              echo ""
              echo "ERROR: ZIP IS STILL A GIT LFS POINTER"
              echo "Git LFS object was not downloaded."

              git lfs ls-files || true

              exit 1

            fi


            # ----------------------------------------------------
            # Verify ZIP using Python zipfile.
            # ----------------------------------------------------

            echo ""
            echo "VERIFYING ZIP INTEGRITY..."

            python3 - "$ZIP_PATH" <<'PY'
          import sys
          import zipfile

          zip_path = sys.argv[1]

          try:
              with zipfile.ZipFile(zip_path, "r") as z:
                  bad = z.testzip()

                  if bad is not None:
                      print(f"ERROR: CORRUPTED ZIP ENTRY: {bad}")
                      raise SystemExit(1)

                  names = z.namelist()

                  print(f"ZIP_ENTRIES={len(names)}")

                  required = [
                      "settings.gradle.kts",
                      "build.gradle.kts",
                      "app/build.gradle.kts",
                      "app/src/main/AndroidManifest.xml",
                  ]

                  for item in required:
                      if item in names:
                          print(f"ZIP_REQUIRED_FILE=PASS:{item}")
                      else:
                          print(f"ZIP_REQUIRED_FILE=MISS:{item}")

                  print("ZIP_INTEGRITY=PASS")

          except zipfile.BadZipFile as exc:
              print(f"ERROR: INVALID ZIP: {exc}")
              raise SystemExit(1)
          PY


            # ----------------------------------------------------
            # Extract with Python.
            # ----------------------------------------------------

            echo ""
            echo "EXTRACTING PROJECT ZIP..."

            python3 - "$ZIP_PATH" "$PWD/extracted" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          zip_path = Path(sys.argv[1])
          output_dir = Path(sys.argv[2])

          output_dir.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(zip_path, "r") as z:
              z.extractall(output_dir)

          print("ZIP_EXTRACTION=PASS")
          PY


            echo ""
            echo "ZIP_EXTRACTED=PASS"


            # ----------------------------------------------------
            # Detect project root.
            # ----------------------------------------------------

            if [ -f "extracted/settings.gradle.kts" ] &&
               [ -f "extracted/app/build.gradle.kts" ]; then

              echo "PROJECT_ROOT=extracted"

              shopt -s dotglob

              cp -a extracted/. project/

            else

              PROJECT_ROOT_FILE="$(
                find extracted \
                  -type f \
                  -name "settings.gradle.kts" \
                  -print \
                  | head -n 1
              )"

              if [ -z "$PROJECT_ROOT_FILE" ]; then

                echo ""
                echo "=========================================="
                echo "ERROR: settings.gradle.kts NOT FOUND"
                echo "=========================================="

                find extracted \
                  -maxdepth 5 \
                  -type f \
                  | head -n 150

                exit 1

              fi

              PROJECT_ROOT="$(dirname "$PROJECT_ROOT_FILE")"

              echo "PROJECT_ROOT=${PROJECT_ROOT}"

              test -f \
                "$PROJECT_ROOT/app/build.gradle.kts"

              shopt -s dotglob

              cp -a "$PROJECT_ROOT"/. project/

            fi

          fi


          # ------------------------------------------------------
          # Final project verification.
          # ------------------------------------------------------

          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml


          echo ""
          echo "=========================================="
          echo "PROJECT_PREPARATION=PASS"
          echo "=========================================="


      # ==========================================================
      # 4. APPLY ONLY PREVIOUSLY FAILED KOTLIN FIXES
      # ==========================================================

      - name: Apply required Kotlin source fixes
        working-directory: project
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"

          test -f "$FILE"

          cp "$FILE" \
            "${FILE}.original-ci"

          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"
          )

          text = file.read_text(encoding="utf-8")

          text = text.replace(
              "app.audit.auditLog()",
              "app.audit.list()"
          )

          text = text.replace(
              "app.audit.clearAuditLog()",
              "app.audit.clear()"
          )

          text = text.replace(
              "getSystemService(ALARM_SERVICE)",
              "getSystemService(Context.ALARM_SERVICE)"
          )

          file.write_text(
              text,
              encoding="utf-8"
          )

          print("SOURCE_FIXES_APPLIED")
          PY

          if grep -Fq \
            "app.audit.auditLog()" \
            "$FILE"; then
            echo "ERROR: old auditLog() reference remains"
            exit 1
          fi

          if grep -Fq \
            "app.audit.clearAuditLog()" \
            "$FILE"; then
            echo "ERROR: old clearAuditLog() reference remains"
            exit 1
          fi

          if grep -Fq \
            "getSystemService(ALARM_SERVICE)" \
            "$FILE"; then
            echo "ERROR: old ALARM_SERVICE reference remains"
            exit 1
          fi

          grep -Fq \
            "app.audit.list()" \
            "$FILE"

          grep -Fq \
            "app.audit.clear()" \
            "$FILE"

          grep -Fq \
            "Context.ALARM_SERVICE" \
            "$FILE"

          echo "SOURCE_FIXES_VERIFICATION=PASS"


      # ==========================================================
      # 5. JAVA 17
      # ==========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 6. ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ==========================================================
      # 7. ANDROID API 36
      # ==========================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "ANDROID_SDK_READY=PASS"


      # ==========================================================
      # 8. GRADLE 8.11.1
      # ==========================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true
          cache-cleanup: never


      # ==========================================================
      # 9. VERIFY TOOLCHAIN
      # ==========================================================

      - name: Verify Java Gradle Android
        shell: bash
        run: |
          set -e

          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          gradle --version

          gradle --version \
            | grep -Fq "Gradle 8.11.1"

          echo ""
          echo "ANDROID SDK:"

          sdkmanager --list_installed \
            | grep -E \
            "platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}"

          echo ""
          echo "TOOLCHAIN_VERIFICATION=PASS"


      # ==========================================================
      # 10. PROJECT CONFIGURATION
      # ==========================================================

      - name: Verify project configuration
        working-directory: project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          grep -Fq \
            'id("com.android.application") version "8.9.1"' \
            build.gradle.kts

          grep -Fq \
            'id("org.jetbrains.kotlin.android") version "2.1.21"' \
            build.gradle.kts

          grep -Fq \
            'compileSdk = 36' \
            app/build.gradle.kts

          grep -Fq \
            'targetSdk = 36' \
            app/build.gradle.kts

          grep -Fq \
            'applicationId = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -Fq \
            'versionCode = 77' \
            app/build.gradle.kts

          grep -Fq \
            'versionName = "1.77.0"' \
            app/build.gradle.kts

          echo "PROJECT_CONFIGURATION=PASS"


      # ==========================================================
      # 11. CLEAN
      # ==========================================================

      - name: Clean previous build
        working-directory: project
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            clean

          echo "CLEAN_BUILD=PASS"


      # ==========================================================
      # 12. BUILD RELEASE APK
      #
      # ONLY THIS SECTION HAS BEEN CHANGED
      #
      # IMPORTANT:
      # Previous failure was caused by broad replacements such as:
      #
      # it.text -> fb.text
      # it.text -> cropBtn.text
      # it.text -> workerBtn.text
      # it.text -> rateTypeBtn.text
      # it.text -> wb.text
      # it.text -> mb.text
      # it.text -> adv.text
      # it.text -> cb.text
      #
      # Those replacements are NOT performed here.
      #
      # We first compile Kotlin and only if compilation succeeds
      # do we assemble the release APK.
      # ==========================================================

      - name: Build Release APK
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"

          test -f "$FILE"

          echo ""
          echo "=========================================="
          echo "RELEASE SOURCE CHECK"
          echo "=========================================="

          echo "Kotlin file:"
          echo "$FILE"

          echo ""
          echo "IMPORTANT:"
          echo "No broad UI variable replacements will be performed."

          echo ""
          echo "=========================================="
          echo "CHECKING PREVIOUS SAFE FIXES"
          echo "=========================================="

          if grep -Fq \
            "app.audit.auditLog()" \
            "$FILE"; then

            echo "ERROR: old auditLog() reference remains"
            exit 1

          fi


          if grep -Fq \
            "app.audit.clearAuditLog()" \
            "$FILE"; then

            echo "ERROR: old clearAuditLog() reference remains"
            exit 1

          fi


          if grep -Fq \
            "getSystemService(ALARM_SERVICE)" \
            "$FILE"; then

            echo "ERROR: old ALARM_SERVICE reference remains"
            exit 1

          fi


          grep -Fq \
            "app.audit.list()" \
            "$FILE"


          grep -Fq \
            "app.audit.clear()" \
            "$FILE"


          grep -Fq \
            "Context.ALARM_SERVICE" \
            "$FILE"


          echo "SOURCE_SAFE_FIX_CHECK=PASS"


          # ------------------------------------------------------
          # IMPORTANT:
          # Do NOT modify MainActivityScreens.kt here.
          #
          # The previous failed workflow modified it with broad
          # string replacements. That caused:
          #
          # Unresolved reference 'fb'
          # Unresolved reference 'cropBtn'
          # Unresolved reference 'workerBtn'
          # Unresolved reference 'rateTypeBtn'
          # Unresolved reference 'wb'
          # Unresolved reference 'mb'
          # Unresolved reference 'adv'
          # Unresolved reference 'cb'
          #
          # No such modifications are made now.
          # ------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "COMPILE RELEASE KOTLIN"
          echo "=========================================="

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --no-parallel \
            :app:compileReleaseKotlin


          echo ""
          echo "=========================================="
          echo "KOTLIN COMPILATION=PASS"
          echo "=========================================="


          # ------------------------------------------------------
          # Assemble release APK
          # ------------------------------------------------------

          echo ""
          echo "=========================================="
          echo "ASSEMBLE RELEASE APK"
          echo "=========================================="

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --no-parallel \
            :app:assembleRelease


          APK="app/build/outputs/apk/release/app-release-unsigned.apk"


          # ------------------------------------------------------
          # Verify APK exists
          # ------------------------------------------------------

          if [ ! -s "$APK" ]; then

            echo ""
            echo "=========================================="
            echo "ERROR: RELEASE APK NOT CREATED"
            echo "=========================================="

            echo ""
            echo "Release output files:"

            find app/build/outputs \
              -maxdepth 5 \
              -type f \
              -print \
              2>/dev/null || true

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "RELEASE APK BUILD SUCCESS"
          echo "=========================================="

          echo "APK:"
          ls -lh "$APK"

          echo ""
          echo "APK PATH:"
          realpath "$APK"

          echo ""
          echo "=========================================="
          echo "BUILD_RELEASE_APK=PASS"
          echo "=========================================="


      # ==========================================================
      # 13. VERIFY UNSIGNED APK
      # ==========================================================

      - name: Verify unsigned APK
        working-directory: project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          echo "APK SIZE:"
          du -h "$APK"

          echo ""
          echo "APK BADGING:"

          aapt dump badging "$APK" \
            | head -n 5

          aapt dump badging "$APK" \
            | grep -Fq \
            "package: name='${PACKAGE_NAME}'"

          aapt dump badging "$APK" \
            | grep -Fq \
            "versionCode='${VERSION_CODE}'"

          aapt dump badging "$APK" \
            | grep -Fq \
            "versionName='${VERSION_NAME}'"

          unzip -t "$APK" \
            >/dev/null

          echo "UNSIGNED_APK_VERIFICATION=PASS"


      # ==========================================================
      # 14. RESTORE RELEASE KEYSTORE
      # ==========================================================

      - name: Restore release keystore
        working-directory: project
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

          keytool -list \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "RELEASE_KEYSTORE=PASS"


      # ==========================================================
      # 15. ZIPALIGN
      # ==========================================================

      - name: Align APK
        working-directory: project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          zipalign \
            -f \
            -p \
            4 \
            "$APK" \
            app-release-aligned.apk

          zipalign \
            -c \
            -v \
            4 \
            app-release-aligned.apk

          test -s app-release-aligned.apk

          echo "ZIPALIGN=PASS"


      # ==========================================================
      # 16. SIGN APK
      # ==========================================================

      - name: Sign Release APK
        working-directory: project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            app-release-aligned.apk

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk

          echo "APK_SIGNING=PASS"


      # ==========================================================
      # 17. VERIFY SIGNED APK
      # ==========================================================

      - name: Verify signed APK
        working-directory: project
        shell: bash
        run: |
          set -e

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$APK"

          apksigner verify \
            --verbose \
            --print-certs \
            "$APK"

          zipalign \
            -c \
            -v \
            4 \
            "$APK"

          aapt dump badging "$APK" \
            | grep -Fq \
            "package: name='${PACKAGE_NAME}'"

          aapt dump badging "$APK" \
            | grep -Fq \
            "versionCode='${VERSION_CODE}'"

          aapt dump badging "$APK" \
            | grep -Fq \
            "versionName='${VERSION_NAME}'"

          unzip -t "$APK" \
            >/dev/null

          echo "SIGNED_APK_VERIFICATION=PASS"


      # ==========================================================
      # 18. SHA256
      # ==========================================================

      - name: Generate SHA256
        working-directory: project
        shell: bash
        run: |
          set -e

          sha256sum \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            | tee \
            artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          echo "SHA256=PASS"


      # ==========================================================
      # 19. UPLOAD FINAL APK
      # ==========================================================

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-v1.77.0-release

          path: |
            project/artifacts/Majdoor-Hisaab-PRO-release.apk
            project/artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          if-no-files-found: error

          retention-days: 30


      # ==========================================================
      # 20. FINAL SUCCESS
      # ==========================================================

      - name: FINAL BUILD SUCCESS
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       MAJDOOR HISAAB PRO"
          echo "       RELEASE BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Package     : ${PACKAGE_NAME}"
          echo "Version     : ${VERSION_NAME}"
          echo "VersionCode : ${VERSION_CODE}"
          echo ""
          echo "SIGNED APK CREATED SUCCESSFULLY"
          echo ""
          echo "=========================================="
