name: Majdoor Hisaab PRO - Stable Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V81-ALL-BUTTONS-FINAL.zip"

jobs:

  build-release:

    name: Build Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL ANDROID SDK 36
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INSTALLING ANDROID SDK"
          echo "=============================================="

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo
          echo "Android SDK installation completed."


      # ============================================================
      # 5. VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ANDROID SDK VERIFICATION"
          echo "=============================================="

          echo
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME}"

          echo
          echo "Java:"
          java -version

          echo
          echo "Android packages:"

          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}" \
            || true

          echo
          echo "Checking Android platform..."

          test -d \
            "${ANDROID_HOME}/platforms/android-${ANDROID_API}"

          echo "Android API ${ANDROID_API} OK."

          echo
          echo "Checking Build Tools..."

          test -d \
            "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"

          echo "Build Tools ${BUILD_TOOLS} OK."


      # ============================================================
      # 6. LOCATE ANDROID PROJECT / V81 ZIP
      # ============================================================

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATING MAJDOOR HISAAB PRO V81"
          echo "=============================================="

          PROJECT_ROOT=""

          if [ -f "settings.gradle.kts" ] && \
             [ -f "app/build.gradle.kts" ]; then

            echo "Android project found at repository root."

            PROJECT_ROOT="$PWD"

          else

            echo
            echo "Android project not at repository root."
            echo "Searching for V81 ZIP..."

            ZIP_PATH=""

            if [ -f "${ZIP_NAME}" ]; then
              ZIP_PATH="${ZIP_NAME}"
            fi

            if [ -z "${ZIP_PATH}" ]; then

              ZIP_PATH="$(
                find . \
                  -type f \
                  \( \
                    -name "${ZIP_NAME}" \
                    -o -iname "Majdoor-Hisaab-PRO-Professional-UI-V81*.zip" \
                  \) \
                  -print \
                  | head -n 1
              )"

            fi

            if [ -z "${ZIP_PATH}" ]; then

              echo
              echo "======================================================"
              echo "ERROR: V81 SOURCE ZIP NOT FOUND"
              echo "======================================================"

              echo
              echo "Expected:"
              echo "${ZIP_NAME}"

              echo
              echo "Available ZIP files:"

              find . \
                -type f \
                -iname "*.zip" \
                -print \
                || true

              exit 1

            fi

            echo
            echo "V81 SOURCE ZIP:"
            echo "${ZIP_PATH}"

            rm -rf extracted
            rm -rf project

            mkdir -p extracted
            mkdir -p project

            unzip -q \
              "${ZIP_PATH}" \
              -d extracted

            if [ -f "extracted/settings.gradle.kts" ] && \
               [ -f "extracted/app/build.gradle.kts" ]; then

              echo
              echo "Project found directly inside ZIP."

              cp -a \
                extracted/. \
                project/

            else

              SETTINGS_FILE="$(
                find extracted \
                  -type f \
                  -name "settings.gradle.kts" \
                  | head -n 1
              )"

              if [ -z "${SETTINGS_FILE}" ]; then

                echo
                echo "ERROR: settings.gradle.kts not found."

                echo
                echo "Extracted files:"

                find extracted \
                  -maxdepth 7 \
                  -type f \
                  | head -n 300

                exit 1

              fi

              ROOT_DIR="$(dirname "${SETTINGS_FILE}")"

              echo
              echo "Detected Android project:"
              echo "${ROOT_DIR}"

              if [ ! -f "${ROOT_DIR}/app/build.gradle.kts" ]; then

                echo
                echo "ERROR: app/build.gradle.kts not found."

                exit 1

              fi

              cp -a \
                "${ROOT_DIR}/." \
                project/

            fi

            if [ ! -f "project/settings.gradle.kts" ]; then

              echo "ERROR: settings.gradle.kts missing after extraction."

              exit 1

            fi

            if [ ! -f "project/app/build.gradle.kts" ]; then

              echo "ERROR: app/build.gradle.kts missing after extraction."

              exit 1

            fi

            PROJECT_ROOT="$PWD/project"

          fi

          echo
          echo "=============================================="
          echo "PROJECT ROOT"
          echo "=============================================="

          echo "${PROJECT_ROOT}"

          echo \
            "PROJECT_ROOT=${PROJECT_ROOT}" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 7. SHOW PROJECT STRUCTURE
      # ============================================================

      - name: Show project structure
        shell: bash
        run: |
          set -e

          cd "${PROJECT_ROOT}"

          echo "=============================================="
          echo "PROJECT STRUCTURE"
          echo "=============================================="

          pwd

          echo
          echo "Root files:"
          ls -la

          echo
          echo "App directory:"
          ls -la app

          echo
          echo "Gradle files:"

          find . \
            -maxdepth 5 \
            \( \
              -name "settings.gradle.kts" \
              -o -name "build.gradle.kts" \
              -o -name "gradle.properties" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print


      # ============================================================
      # 8. SETUP GRADLE 8.11.1
      #
      # IMPORTANT:
      # GitHub-installed Gradle is used directly.
      # V81 Gradle wrapper is NOT executed.
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ============================================================
      # 9. VERIFY JAVA / GRADLE
      # ============================================================

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "JAVA"
          echo "=============================================="

          java -version

          echo
          echo "JAVA_HOME:"
          echo "${JAVA_HOME}"

          echo
          echo "=============================================="
          echo "GRADLE"
          echo "=============================================="

          gradle --version


      # ============================================================
      # 10. VERIFY V81 SOURCE CONFIGURATION
      # ============================================================

      - name: Verify V81 source configuration
        shell: bash
        run: |
          set -e

          cd "${PROJECT_ROOT}"

          BUILD_FILE="app/build.gradle.kts"

          if [ ! -f "${BUILD_FILE}" ]; then

            echo "ERROR: ${BUILD_FILE} not found."

            exit 1

          fi

          echo "=============================================="
          echo "V81 SOURCE CONFIGURATION"
          echo "=============================================="

          echo
          echo "Namespace:"
          grep -n \
            "namespace" \
            "${BUILD_FILE}" \
            || true

          echo
          echo "Application ID:"
          grep -n \
            "applicationId" \
            "${BUILD_FILE}" \
            || true

          echo
          echo "compileSdk:"
          grep -n \
            "compileSdk" \
            "${BUILD_FILE}" \
            || true

          echo
          echo "minSdk:"
          grep -n \
            "minSdk" \
            "${BUILD_FILE}" \
            || true

          echo
          echo "targetSdk:"
          grep -n \
            "targetSdk" \
            "${BUILD_FILE}" \
            || true

          echo
          echo "versionCode:"
          grep -n \
            "versionCode" \
            "${BUILD_FILE}" \
            || true

          echo
          echo "versionName:"
          grep -n \
            "versionName" \
            "${BUILD_FILE}" \
            || true


      # ============================================================
      # 11. VERIFY EXACT RELEASE VERSION
      # ============================================================

      - name: Verify release version
        shell: bash
        run: |
          set -e

          cd "${PROJECT_ROOT}"

          BUILD_FILE="app/build.gradle.kts"

          echo "Checking applicationId..."

          grep -q \
            'applicationId[[:space:]]*=[[:space:]]*"com.majdoor.hisaab"' \
            "${BUILD_FILE}" \
            || {
              echo "ERROR: applicationId mismatch."
              exit 1
            }

          echo "Application ID OK."

          echo
          echo "Checking versionName..."

          grep -q \
            'versionName[[:space:]]*=[[:space:]]*"1.77.0"' \
            "${BUILD_FILE}" \
            || {
              echo "ERROR: versionName 1.77.0 not found."
              exit 1
            }

          echo "versionName OK."

          echo
          echo "Checking versionCode..."

          grep -q \
            'versionCode[[:space:]]*=[[:space:]]*77' \
            "${BUILD_FILE}" \
            || {
              echo "ERROR: versionCode 77 not found."
              exit 1
            }

          echo "versionCode OK."

          echo
          echo "Checking compileSdk..."

          grep -q \
            'compileSdk[[:space:]]*=[[:space:]]*36' \
            "${BUILD_FILE}" \
            || {
              echo "ERROR: compileSdk 36 not found."
              exit 1
            }

          echo "compileSdk OK."

          echo
          echo "Checking targetSdk..."

          grep -q \
            'targetSdk[[:space:]]*=[[:space:]]*36' \
            "${BUILD_FILE}" \
            || {
              echo "ERROR: targetSdk 36 not found."
              exit 1
            }

          echo "targetSdk OK."

          echo
          echo "=============================================="
          echo "SOURCE CONFIGURATION VERIFIED"
          echo "=============================================="

          echo "Package      : ${PACKAGE_NAME}"
          echo "Version Name : ${VERSION_NAME}"
          echo "Version Code : ${VERSION_CODE}"
          echo "compileSdk   : ${ANDROID_API}"
          echo "targetSdk    : ${ANDROID_API}"


      # ============================================================
      # 12. VERIFY GRADLE CONFIGURATION
      #
      # DO NOT RUN ./gradlew
      # ============================================================

      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -e

          cd "${PROJECT_ROOT}"

          echo "=============================================="
          echo "GRADLE CONFIGURATION"
          echo "=============================================="

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo
            echo "Wrapper configuration found:"

            grep \
              "distributionUrl" \
              gradle/wrapper/gradle-wrapper.properties \
              || true

            echo
            echo "Wrapper will NOT be executed."

          else

            echo
            echo "No Gradle wrapper configuration found."

          fi

          echo
          echo "Using GitHub-installed Gradle:"

          gradle --version


      # ============================================================
      # 13. FIX V81 KOTLIN SOURCE
      #
      # FIXES:
      #
      # 1. btn() action default
      # 2. pick() Button -> TextView
      # 3. Intent type shadowing
      # 4. fillWidth -> fillViewport
      # 5. old audit API names
      #
      # NO UI/database/calculation logic is changed.
      # ============================================================

      - name: Apply V81 Kotlin compatibility fixes
        shell: bash
        run: |
          set -e

          cd "${PROJECT_ROOT}"

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"

          if [ ! -f "${FILE}" ]; then
            echo "ERROR: MainActivityScreens.kt not found."
            exit 1
          fi

          echo "=============================================="
          echo "APPLYING V81 KOTLIN FIXES"
          echo "=============================================="

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt")
          s = p.read_text(encoding="utf-8")

          changes = []

          # ----------------------------------------------------------
          # FIX 1:
          # V81 btn() must allow calls without explicit action.
          # ----------------------------------------------------------

          old = 'internal fun MainActivity.btn(s:String,action:()->Unit)=TextView(this).apply{'
          new = 'internal fun MainActivity.btn(s:String,action:()->Unit = {})=TextView(this).apply{'

          if old in s:
              s = s.replace(old, new, 1)
              changes.append("btn() default action added")


          # ----------------------------------------------------------
          # FIX 2:
          # pick() was declared Button but btn() returns TextView.
          # ----------------------------------------------------------

          old = 'internal fun MainActivity.pick(title:String, labels:List<String>, current:Int=-1, onPick:(Int)->Unit):Button {'
          new = 'internal fun MainActivity.pick(title:String, labels:List<String>, current:Int=-1, onPick:(Int)->Unit):TextView {'

          if old in s:
              s = s.replace(old, new, 1)
              changes.append("pick() return type changed Button -> TextView")


          # ----------------------------------------------------------
          # FIX 3:
          # Intent.apply { type = ... } was resolving to outer
          # worker/field variable named type.
          # ----------------------------------------------------------

          old = 'Intent(Intent.ACTION_OPEN_DOCUMENT).apply{type="image/*";'
          new = 'Intent(Intent.ACTION_OPEN_DOCUMENT).apply{this.type="image/*";'

          count = s.count(old)

          if count:
              s = s.replace(old, new)
              changes.append(f"Intent MIME type fixed ({count} occurrence(s))")


          # ----------------------------------------------------------
          # FIX 4:
          # If an older V81 source contains fillWidth, correct it.
          # ----------------------------------------------------------

          count = s.count("fillWidth")

          if count:
              s = s.replace("fillWidth", "fillViewport")
              changes.append(f"fillWidth -> fillViewport ({count} occurrence(s))")


          # ----------------------------------------------------------
          # FIX 5:
          # Safe compatibility replacements.
          # ----------------------------------------------------------

          count = s.count(".audit.auditLog")

          if count:
              s = s.replace(".audit.auditLog", ".auditLog")
              changes.append(f"audit API fixed ({count} occurrence(s))")


          count = s.count("clearAuditLog")

          if count:
              s = s.replace("clearAuditLog", "clear")
              changes.append(f"clearAuditLog API fixed ({count} occurrence(s))")


          count = s.count("getSystemService(ALARM_SERVICE)")

          if count:
              s = s.replace(
                  "getSystemService(ALARM_SERVICE)",
                  "getSystemService(Context.ALARM_SERVICE)"
              )
              changes.append(f"ALARM_SERVICE reference fixed ({count} occurrence(s))")


          p.write_text(s, encoding="utf-8")

          print("")
          print("V81 source patch result:")

          if changes:
              for item in changes:
                  print("  OK:", item)
          else:
              print("  No source changes were necessary.")

          print("")
          print("MainActivityScreens.kt updated successfully.")
          PY


      # ============================================================
      # 14. VERIFY ALL SOURCE FIXES
      # ============================================================

      - name: Verify V81 Kotlin fixes
        shell: bash
        run: |
          set -e

          cd "${PROJECT_ROOT}"

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"

          echo "=============================================="
          echo "VERIFYING V81 KOTLIN FIXES"
          echo "=============================================="

          echo
          echo "Checking btn()..."

          grep -q \
            'internal fun MainActivity.btn(s:String,action:()->Unit = {})=TextView(this).apply{' \
            "${FILE}" \
            || {
              echo "ERROR: btn() fix not applied."
              exit 1
            }

          echo "btn() OK."

          echo
          echo "Checking pick()..."

          grep -q \
            'internal fun MainActivity.pick(title:String, labels:List<String>, current:Int=-1, onPick:(Int)->Unit):TextView' \
            "${FILE}" \
            || {
              echo "ERROR: pick() return type fix not applied."
              exit 1
            }

          echo "pick() OK."

          echo
          echo "Checking Intent MIME assignment..."

          if grep -q \
            'apply{type="image/\*";' \
            "${FILE}"; then

            echo "ERROR: old shadowed type assignment still exists."
            exit 1

          fi

          echo "Intent MIME assignment OK."

          echo
          echo "Checking fillWidth..."

          if grep -q \
            'fillWidth' \
            "${FILE}"; then

            echo "ERROR: fillWidth still exists."
            exit 1

          fi

          echo "fillWidth check OK."

          echo
          echo "=============================================="
          echo "ALL V81 SOURCE FIXES VERIFIED"
          echo "=============================================="


      # ============================================================
      # 15. VERIFY PROFESSIONAL BUTTON IMPLEMENTATION
      # ============================================================

      - name: Verify V81 button implementation
        shell: bash
        run: |
          set -e

          cd "${PROJECT_ROOT}"

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"

          echo "Checking V81 professional button implementation..."

          grep -q \
            'internal fun MainActivity.btn' \
            "${FILE}" \
            || {
              echo "ERROR: V81 btn() function not found."
              exit 1
            }

          grep -q \
            'TextView(this)' \
            "${FILE}" \
            || {
              echo "ERROR: V81 TextView button renderer not found."
              exit 1
            }

          echo
          echo "V81 professional button implementation verified."


      # ============================================================
      # 16. CLEAN PROJECT
      # ============================================================

      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "${PROJECT_ROOT}"

          gradle \
            clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 17. COMPILE RELEASE KOTLIN
      # ============================================================

      - name: Compile Release Kotlin
        shell: bash
        run: |
          set -e

          cd "${PROJECT_ROOT}"

          echo "=============================================="
          echo "COMPILING RELEASE KOTLIN"
          echo "=============================================="

          gradle \
            :app:compileReleaseKotlin \
            --no-daemon \
            --stacktrace

          echo
          echo "Kotlin compilation successful."


      # ============================================================
      # 18. BUILD RELEASE APK
      # ============================================================

      - name: Build unsigned Release APK
        shell: bash
        run: |
          set -e

          cd "${PROJECT_ROOT}"

          echo "=============================================="
          echo "BUILDING RELEASE APK"
          echo "=============================================="

          gradle \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo
          echo "Release APK build successful."


      # ============================================================
      # 19. LOCATE RELEASE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          cd "${PROJECT_ROOT}"

          APK="$(
            find app/build/outputs/apk/release \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "${APK}" ]; then

            echo
            echo "ERROR: Release APK not found."

            echo
            echo "Build outputs:"

            find app/build/outputs \
              -type f \
              -print \
              || true

            exit 1

          fi

          echo
          echo "Release APK found:"
          echo "${APK}"

          mkdir -p \
            "${GITHUB_WORKSPACE}/release"

          cp \
            "${APK}" \
            "${GITHUB_WORKSPACE}/release/Majdoor-Hisaab-PRO-1.77.0-release-unsigned.apk"

          echo \
            "UNSIGNED_APK=${GITHUB_WORKSPACE}/release/Majdoor-Hisaab-PRO-1.77.0-release-unsigned.apk" \
            >> "$GITHUB_ENV"


      # ============================================================
      # 20. VERIFY UNSIGNED APK
      # ============================================================

      - name: Verify unsigned APK
        shell: bash
        run: |
          set -e

          APK="${UNSIGNED_APK}"

          if [ ! -f "${APK}" ]; then
            echo "ERROR: Unsigned APK missing."
            exit 1
          fi

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          if [ ! -x "${AAPT}" ]; then
            echo "ERROR: aapt not found."
            exit 1
          fi

          echo "=============================================="
          echo "UNSIGNED APK INFORMATION"
          echo "=============================================="

          BADGING="$(
            "${AAPT}" \
              dump badging \
              "${APK}"
          )"

          echo "${BADGING}" \
            | grep "^package:"

          echo
          echo "Checking package..."

          echo "${BADGING}" \
            | grep -q \
              "name='${PACKAGE_NAME}'" \
            || {
              echo "ERROR: Package ID mismatch."
              exit 1
            }

          echo "Package ID OK."

          echo
          echo "Checking version..."

          echo "${BADGING}" \
            | grep \
              "^package:"

          echo
          echo "Unsigned APK verification completed."


      # ============================================================
      # 21. RESTORE RELEASE KEYSTORE
      # ============================================================

      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

        run: |
          set -e

          if [ -z "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "${RELEASE_STORE_PASSWORD}" ]; then
            echo "ERROR: RELEASE_STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${RELEASE_KEY_ALIAS}" ]; then
            echo "ERROR: RELEASE_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "${RELEASE_KEY_PASSWORD}" ]; then
            echo "ERROR: RELEASE_KEY_PASSWORD secret is missing."
            exit 1
          fi

          mkdir -p \
            "${RUNNER_TEMP}/keystore"

          echo "${RELEASE_KEYSTORE_BASE64}" \
            | base64 --decode \
            > "${RUNNER_TEMP}/keystore/release.keystore"

          if [ ! -s "${RUNNER_TEMP}/keystore/release.keystore" ]; then
            echo "ERROR: Release keystore is empty."
            exit 1
          fi

          echo \
            "KEYSTORE_PATH=${RUNNER_TEMP}/keystore/release.keystore" \
            >> "$GITHUB_ENV"

          echo "Release keystore restored successfully."


      # ============================================================
      # 22. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -e

          ZIPALIGN="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/zipalign"

          if [ ! -x "${ZIPALIGN}" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          "${ZIPALIGN}" \
            -p \
            -f \
            4 \
            "${UNSIGNED_APK}" \
            "${GITHUB_WORKSPACE}/release/Majdoor-Hisaab-PRO-1.77.0-release-aligned.apk"

          echo
          echo "Zipalign completed."


      # ============================================================
      # 23. SIGN RELEASE APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

        run: |
          set -e

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          if [ ! -x "${APKSIGNER}" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "${APKSIGNER}" sign \
            --ks "${KEYSTORE_PATH}" \
            --ks-pass "pass:${RELEASE_STORE_PASSWORD}" \
            --ks-key-alias "${RELEASE_KEY_ALIAS}" \
            --key-pass "pass:${RELEASE_KEY_PASSWORD}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out \
            "${GITHUB_WORKSPACE}/release/Majdoor-Hisaab-PRO-1.77.0-release.apk" \
            "${GITHUB_WORKSPACE}/release/Majdoor-Hisaab-PRO-1.77.0-release-aligned.apk"

          echo
          echo "=============================================="
          echo "APK SIGNING COMPLETED"
          echo "=============================================="


      # ============================================================
      # 24. VERIFY SIGNATURE
      # ============================================================

      - name: Verify signed APK
        shell: bash
        run: |
          set -e

          APKSIGNER="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/apksigner"

          "${APKSIGNER}" verify \
            --verbose \
            "${GITHUB_WORKSPACE}/release/Majdoor-Hisaab-PRO-1.77.0-release.apk"

          echo
          echo "=============================================="
          echo "APK SIGNATURE VERIFIED"
          echo "=============================================="


      # ============================================================
      # 25. VERIFY FINAL APK
      # ============================================================

      - name: Verify final APK
        shell: bash
        run: |
          set -e

          APK="${GITHUB_WORKSPACE}/release/Majdoor-Hisaab-PRO-1.77.0-release.apk"

          AAPT="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/aapt"

          if [ ! -f "${APK}" ]; then
            echo "ERROR: Final APK missing."
            exit 1
          fi

          BADGING="$(
            "${AAPT}" \
              dump badging \
              "${APK}"
          )"

          echo
          echo "=============================================="
          echo "FINAL APK INFORMATION"
          echo "=============================================="

          echo "${BADGING}" \
            | grep "^package:"

          echo
          echo "Checking package..."

          echo "${BADGING}" \
            | grep -q \
              "name='${PACKAGE_NAME}'" \
            || {
              echo "ERROR: Package mismatch."
              exit 1
            }

          echo "Package OK."

          echo
          echo "Checking version name..."

          echo "${BADGING}" \
            | grep -q \
              "versionName='${VERSION_NAME}'" \
            || {
              echo "ERROR: Version name mismatch."
              exit 1
            }

          echo "Version name OK."

          echo
          echo "Checking version code..."

          echo "${BADGING}" \
            | grep -q \
              "versionCode='${VERSION_CODE}'" \
            || {
              echo "ERROR: Version code mismatch."
              exit 1
            }

          echo "Version code OK."

          echo
          echo "=============================================="
          echo "FINAL APK VERIFICATION SUCCESS"
          echo "=============================================="

          echo "Package      : ${PACKAGE_NAME}"
          echo "Version Name : ${VERSION_NAME}"
          echo "Version Code : ${VERSION_CODE}"


      # ============================================================
      # 26. SHA256
      # ============================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          cd "${GITHUB_WORKSPACE}/release"

          sha256sum \
            "Majdoor-Hisaab-PRO-1.77.0-release.apk" \
            > \
            "Majdoor-Hisaab-PRO-1.77.0-release.apk.sha256"

          echo
          echo "SHA256:"

          cat \
            "Majdoor-Hisaab-PRO-1.77.0-release.apk.sha256"


      # ============================================================
      # 27. SHOW FINAL FILES
      # ============================================================

      - name: Show final release files
        shell: bash
        run: |
          set -e

          echo
          echo "=============================================="
          echo "FINAL RELEASE FILES"
          echo "=============================================="

          ls -lh \
            "${GITHUB_WORKSPACE}/release"


      # ============================================================
      # 28. UPLOAD SIGNED APK
      # ============================================================

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4

        with:
          name: Majdoor-Hisaab-PRO-1.77.0-Signed-Release

          path: |
            release/Majdoor-Hisaab-PRO-1.77.0-release.apk
            release/Majdoor-Hisaab-PRO-1.77.0-release.apk.sha256

          if-no-files-found: error

          retention-days: 30


      # ============================================================
      # 29. SUCCESS
      # ============================================================

      - name: Build Success
        run: |
          echo
          echo "======================================================"
          echo " MAJDOOR HISAAB PRO - RELEASE BUILD SUCCESS"
          echo "======================================================"
          echo
          echo "SOURCE ZIP:"
          echo "${ZIP_NAME}"
          echo
          echo "PACKAGE:"
          echo "${PACKAGE_NAME}"
          echo
          echo "VERSION NAME:"
          echo "${VERSION_NAME}"
          echo
          echo "VERSION CODE:"
          echo "${VERSION_CODE}"
          echo
          echo "SIGNED APK:"
          echo "release/Majdoor-Hisaab-PRO-1.77.0-release.apk"
          echo
          echo "======================================================"
