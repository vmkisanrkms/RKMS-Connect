name: Majdoor Hisaab PRO - Stable Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104.zip"

jobs:

  build-release-apk:

    name: Build and Sign Release APK

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. BUILD INFORMATION
      # ==========================================================

      - name: Show build configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MAJDOOR HISAAB PRO"
          echo "STABLE RELEASE APK BUILD"
          echo "=========================================="

          echo "Java        : ${JAVA_VERSION}"
          echo "Gradle      : ${GRADLE_VERSION}"
          echo "Android API : ${ANDROID_API}"
          echo "Build Tools : ${BUILD_TOOLS}"
          echo "Package     : ${PACKAGE_NAME}"
          echo "Version     : ${VERSION_NAME}"
          echo "VersionCode : ${VERSION_CODE}"

          echo "=========================================="


      # ==========================================================
      # 3. PREPARE AND FIND PROJECT
      #
      # FIXED:
      # - Git LFS ZIP support
      # - exact ZIP search
      # - safe ZIP copy
      # - ZIP integrity verification
      # - Python zip extraction
      # - detailed diagnostics
      # ==========================================================

      - name: Prepare Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf project
          rm -rf extracted

          mkdir -p project
          mkdir -p extracted

          echo "=========================================="
          echo "SEARCHING FOR ANDROID PROJECT"
          echo "=========================================="

          if [ -f "settings.gradle.kts" ] &&
             [ -f "app/build.gradle.kts" ]; then

            echo "ANDROID_PROJECT_FOUND_IN_REPOSITORY"

            shopt -s dotglob

            cp -a . project/

          else

            echo "ANDROID_PROJECT_NOT_FOUND_AT_ROOT"
            echo "SEARCHING FOR PROJECT ZIP..."

            if command -v git-lfs >/dev/null 2>&1; then
              echo "GIT_LFS_DETECTED"

              git lfs install --local >/dev/null 2>&1 || true

              git lfs pull >/dev/null 2>&1 || true

              echo "GIT_LFS_PULL_COMPLETED"
            else
              echo "GIT_LFS_NOT_INSTALLED"
            fi


            ZIP_PATH=""

            if [ -f "${ZIP_NAME}" ]; then
              ZIP_PATH="./${ZIP_NAME}"
            fi


            if [ -z "$ZIP_PATH" ]; then

              if [ -f \
                "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip" ]; then

                ZIP_PATH="./Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip"

              fi

            fi


            if [ -z "$ZIP_PATH" ]; then

              ZIP_PATH="$(
                find . \
                  -type f \
                  -name "${ZIP_NAME}" \
                  -not -path "./project/*" \
                  -not -path "./extracted/*" \
                  -not -path "./.git/*" \
                  -print \
                  | head -n 1
              )"

            fi


            if [ -z "$ZIP_PATH" ]; then

              ZIP_PATH="$(
                find . \
                  -type f \
                  -name "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip" \
                  -not -path "./project/*" \
                  -not -path "./extracted/*" \
                  -not -path "./.git/*" \
                  -print \
                  | head -n 1
              )"

            fi


            if [ -z "$ZIP_PATH" ]; then

              ZIP_PATH="$(
                find . \
                  -type f \
                  -iname "Majdoor_Hisaab*.zip" \
                  -not -path "./project/*" \
                  -not -path "./extracted/*" \
                  -not -path "./.git/*" \
                  -print \
                  | head -n 1
              )"

            fi


            if [ -z "$ZIP_PATH" ]; then

              echo ""
              echo "=========================================="
              echo "ERROR: MAJDOOR HISAAB PROJECT ZIP NOT FOUND"
              echo "=========================================="
              echo ""

              echo "Expected:"
              echo "${ZIP_NAME}"

              echo ""
              echo "BUILD_FIXED fallback:"
              echo "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104_BUILD_FIXED.zip"

              echo ""
              echo "AVAILABLE ZIP FILES:"

              find . \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                -print \
                | head -n 50 || true

              echo ""
              echo "GIT TRACKED FILE CHECK:"

              git ls-files \
                | grep -Ei \
                'Majdoor_Hisaab.*\.zip$' \
                | head -n 50 || true

              exit 1

            fi


            ZIP_PATH="$(realpath "$ZIP_PATH")"

            echo ""
            echo "=========================================="
            echo "PROJECT ZIP FOUND"
            echo "=========================================="

            echo "PROJECT_ZIP_FOUND=${ZIP_PATH}"

            test -f "$ZIP_PATH"
            test -r "$ZIP_PATH"

            ls -lh "$ZIP_PATH"


            if head -n 1 "$ZIP_PATH" 2>/dev/null \
              | grep -Fq "version https://git-lfs.github.com/spec/v1"; then

              echo ""
              echo "ERROR: ZIP IS STILL A GIT LFS POINTER"
              echo "Git LFS object was not downloaded."

              git lfs ls-files || true

              exit 1

            fi


            echo ""
            echo "VERIFYING ZIP INTEGRITY..."

            python3 - "$ZIP_PATH" <<'PY'
          import sys
          import zipfile

          zip_path = sys.argv[1]

          try:
              with zipfile.ZipFile(zip_path, "r") as z:
                  bad = z.testzip()

                  if bad is not None:
                      print(f"ERROR: CORRUPTED ZIP ENTRY: {bad}")
                      raise SystemExit(1)

                  names = z.namelist()

                  print(f"ZIP_ENTRIES={len(names)}")

                  required = [
                      "settings.gradle.kts",
                      "build.gradle.kts",
                      "app/build.gradle.kts",
                      "app/src/main/AndroidManifest.xml",
                  ]

                  for item in required:
                      if item in names:
                          print(f"ZIP_REQUIRED_FILE=PASS:{item}")
                      else:
                          print(f"ZIP_REQUIRED_FILE=MISS:{item}")

                  print("ZIP_INTEGRITY=PASS")

          except zipfile.BadZipFile as exc:
              print(f"ERROR: INVALID ZIP: {exc}")
              raise SystemExit(1)
          PY


            echo ""
            echo "EXTRACTING PROJECT ZIP..."

            python3 - "$ZIP_PATH" "$PWD/extracted" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          zip_path = Path(sys.argv[1])
          output_dir = Path(sys.argv[2])

          output_dir.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(zip_path, "r") as z:
              z.extractall(output_dir)

          print("ZIP_EXTRACTION=PASS")
          PY


            echo ""
            echo "ZIP_EXTRACTED=PASS"


            if [ -f "extracted/settings.gradle.kts" ] &&
               [ -f "extracted/app/build.gradle.kts" ]; then

              echo "PROJECT_ROOT=extracted"

              shopt -s dotglob

              cp -a extracted/. project/

            else

              PROJECT_ROOT_FILE="$(
                find extracted \
                  -type f \
                  -name "settings.gradle.kts" \
                  -print \
                  | head -n 1
              )"

              if [ -z "$PROJECT_ROOT_FILE" ]; then

                echo ""
                echo "=========================================="
                echo "ERROR: settings.gradle.kts NOT FOUND"
                echo "=========================================="

                find extracted \
                  -maxdepth 5 \
                  -type f \
                  | head -n 150

                exit 1

              fi

              PROJECT_ROOT="$(dirname "$PROJECT_ROOT_FILE")"

              echo "PROJECT_ROOT=${PROJECT_ROOT}"

              test -f \
                "$PROJECT_ROOT/app/build.gradle.kts"

              shopt -s dotglob

              cp -a "$PROJECT_ROOT"/. project/

            fi

          fi


          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml


          echo ""
          echo "=========================================="
          echo "PROJECT_PREPARATION=PASS"
          echo "=========================================="


      # ==========================================================
      # 4. APPLY ONLY PREVIOUSLY FAILED KOTLIN FIXES
      # ==========================================================

      - name: Apply required Kotlin source fixes
        working-directory: project
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"

          test -f "$FILE"

          cp "$FILE" \
            "${FILE}.original-ci"

          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"
          )

          text = file.read_text(encoding="utf-8")

          text = text.replace(
              "app.audit.auditLog()",
              "app.audit.list()"
          )

          text = text.replace(
              "app.audit.clearAuditLog()",
              "app.audit.clear()"
          )

          text = text.replace(
              "getSystemService(ALARM_SERVICE)",
              "getSystemService(Context.ALARM_SERVICE)"
          )

          file.write_text(
              text,
              encoding="utf-8"
          )

          print("SOURCE_FIXES_APPLIED")
          PY

          if grep -Fq \
            "app.audit.auditLog()" \
            "$FILE"; then
            echo "ERROR: old auditLog() reference remains"
            exit 1
          fi

          if grep -Fq \
            "app.audit.clearAuditLog()" \
            "$FILE"; then
            echo "ERROR: old clearAuditLog() reference remains"
            exit 1
          fi

          if grep -Fq \
            "getSystemService(ALARM_SERVICE)" \
            "$FILE"; then
            echo "ERROR: old ALARM_SERVICE reference remains"
            exit 1
          fi

          grep -Fq \
            "app.audit.list()" \
            "$FILE"

          grep -Fq \
            "app.audit.clear()" \
            "$FILE"

          grep -Fq \
            "Context.ALARM_SERVICE" \
            "$FILE"

          echo "SOURCE_FIXES_VERIFICATION=PASS"


      # ==========================================================
      # 5. JAVA 17
      # ==========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 6. ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ==========================================================
      # 7. ANDROID API 36
      # ==========================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "ANDROID_SDK_READY=PASS"


      # ==========================================================
      # 8. GRADLE 8.11.1
      # ==========================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true
          cache-cleanup: never


      # ==========================================================
      # 9. VERIFY TOOLCHAIN
      # ==========================================================

      - name: Verify Java Gradle Android
        shell: bash
        run: |
          set -e

          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          gradle --version

          gradle --version \
            | grep -Fq "Gradle 8.11.1"

          echo ""
          echo "ANDROID SDK:"

          sdkmanager --list_installed \
            | grep -E \
            "platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}"

          echo ""
          echo "TOOLCHAIN_VERIFICATION=PASS"


      # ==========================================================
      # 10. PROJECT CONFIGURATION
      # ==========================================================

      - name: Verify project configuration
        working-directory: project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          grep -Fq \
            'id("com.android.application") version "8.9.1"' \
            build.gradle.kts

          grep -Fq \
            'id("org.jetbrains.kotlin.android") version "2.1.21"' \
            build.gradle.kts

          grep -Fq \
            'compileSdk = 36' \
            app/build.gradle.kts

          grep -Fq \
            'targetSdk = 36' \
            app/build.gradle.kts

          grep -Fq \
            'applicationId = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -Fq \
            'versionCode = 77' \
            app/build.gradle.kts

          grep -Fq \
            'versionName = "1.77.0"' \
            app/build.gradle.kts

          echo "PROJECT_CONFIGURATION=PASS"


      # ==========================================================
      # 11. CLEAN
      # ==========================================================

      - name: Clean previous build
        working-directory: project
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            clean

          echo "CLEAN_BUILD=PASS"


      # ==========================================================
      # 12. BUILD RELEASE APK
      #
      # NO CHANGE
      # ==========================================================

      - name: Build Release APK
        working-directory: project
        shell: bash
        run: |
          set -Eeuo pipefail

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"

          test -f "$FILE"

          cp "$FILE" \
            "${FILE}.before-release-fix"

          echo ""
          echo "=========================================="
          echo "AUDITED RELEASE SOURCE PATCH"
          echo "=========================================="

          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"
          )

          source = file.read_text(
              encoding="utf-8"
          )


          def patch_block(
              start_marker,
              end_marker,
              replacements
          ):

              global source

              start = source.find(
                  start_marker
              )

              if start < 0:
                  raise SystemExit(
                      f"ERROR: start marker not found: {start_marker}"
                  )

              end = source.find(
                  end_marker,
                  start + len(start_marker)
              )

              if end < 0:
                  raise SystemExit(
                      f"ERROR: end marker not found: {end_marker}"
                  )

              block = source[
                  start:end
              ]

              for old, new in replacements:

                  if old not in block:
                      raise SystemExit(
                          "ERROR: expected source pattern not found "
                          f"in {start_marker}: {old}"
                      )

                  block = block.replace(
                      old,
                      new
                  )

              source = (
                  source[:start]
                  + block
                  + source[end:]
              )


          def patch_button_declarations(
              start_marker,
              end_marker,
              names
          ):

              replacements = []

              for name in names:

                  replacements.append(
                      (
                          f"val {name}=btn(",
                          f"lateinit var {name}:Button\n"
                          f"        {name}=btn("
                      )
                  )

              patch_block(
                  start_marker,
                  end_marker,
                  replacements
              )


          old_btn = (
              "internal fun MainActivity.btn("
              "s:String,action:()->Unit"
              ")=Button(this).apply{"
          )

          new_btn = (
              "internal fun MainActivity.btn("
              "s:String,action:()->Unit = {}"
              ")=Button(this).apply{"
          )

          if old_btn in source:

              source = source.replace(
                  old_btn,
                  new_btn,
                  1
              )

          elif new_btn not in source:

              raise SystemExit(
                  "ERROR: btn() definition not found"
              )


          old_intent_type = (
              'apply{type="image/*";'
          )

          new_intent_type = (
              'apply{this.type="image/*";'
          )

          if old_intent_type in source:

              source = source.replace(
                  old_intent_type,
                  new_intent_type
              )

          elif new_intent_type not in source:

              raise SystemExit(
                  "ERROR: image Intent type pattern not found"
              )


          patch_button_declarations(
              "internal fun MainActivity.cropForm",
              "internal fun MainActivity.attendance()",
              ["fb"]
          )

          patch_block(
              "internal fun MainActivity.cropForm",
              "internal fun MainActivity.attendance()",
              [
                  (
                      'it.text="Field: ${fields[i].name}"',
                      'fb.text="Field: ${fields[i].name}"'
                  )
              ]
          )


          patch_button_declarations(
              "internal fun MainActivity.productionForm",
              "internal fun MainActivity.revenue()",
              ["cropBtn"]
          )

          patch_block(
              "internal fun MainActivity.productionForm",
              "internal fun MainActivity.revenue()",
              [
                  (
                      'it.text="Crop: ${crops[i].name}"',
                      'cropBtn.text="Crop: ${crops[i].name}"'
                  )
              ]
          )


          patch_button_declarations(
              "internal fun MainActivity.revenueForm",
              "internal fun MainActivity.addWork()",
              ["cropBtn"]
          )

          patch_block(
              "internal fun MainActivity.revenueForm",
              "internal fun MainActivity.addWork()",
              [
                  (
                      'it.text="Crop: ${crops[i].name}"',
                      'cropBtn.text="Crop: ${crops[i].name}"'
                  )
              ]
          )


          patch_button_declarations(
              "internal fun MainActivity.workForm",
              "internal fun MainActivity.workDetail",
              [
                  "fieldBtn",
                  "cropBtn",
                  "workerBtn",
                  "rateTypeBtn"
              ]
          )

          patch_block(
              "internal fun MainActivity.workForm",
              "internal fun MainActivity.workDetail",
              [
                  (
                      'it.text="Field: ${fields[i].name}"',
                      'fieldBtn.text="Field: ${fields[i].name}"'
                  ),
                  (
                      'it.text="Crop: ${crops[i].name}"',
                      'cropBtn.text="Crop: ${crops[i].name}"'
                  ),
                  (
                      'it.text="Workers: ${selectedWorkers.distinct().size}"',
                      'workerBtn.text="Workers: ${selectedWorkers.distinct().size}"'
                  ),
                  (
                      'it.text="Rate type: $rateType"',
                      'rateTypeBtn.text="Rate type: $rateType"'
                  )
              ]
          )


          patch_button_declarations(
              "internal fun MainActivity.paymentForm",
              "internal fun MainActivity.expenses()",
              [
                  "wb",
                  "mb",
                  "adv"
              ]
          )

          patch_block(
              "internal fun MainActivity.paymentForm",
              "internal fun MainActivity.expenses()",
              [
                  (
                      'it.text="Worker: ${workers[i].name}"',
                      'wb.text="Worker: ${workers[i].name}"'
                  ),
                  (
                      'it.text="Method: ${methods[i]}"',
                      'mb.text="Method: ${methods[i]}"'
                  ),
                  (
                      'it.text="Advance: ${if(advance)"YES" else "NO"}"',
                      'adv.text="Advance: ${if(advance)"YES" else "NO"}"'
                  )
              ]
          )


          patch_button_declarations(
              "internal fun MainActivity.expenseForm",
              "internal fun MainActivity.reportFiltersDialog()",
              [
                  "cb",
                  "fb",
                  "crb"
              ]
          )

          patch_block(
              "internal fun MainActivity.expenseForm",
              "internal fun MainActivity.reportFiltersDialog()",
              [
                  (
                      'it.text="Category: $cat"',
                      'cb.text="Category: $cat"'
                  ),
                  (
                      'it.text="Field: Not linked"',
                      'fb.text="Field: Not linked"'
                  ),
                  (
                      'it.text="Field: ${fields[i-1].name}"',
                      'fb.text="Field: ${fields[i-1].name}"'
                  ),
                  (
                      'it.text="Crop: Not linked"',
                      'crb.text="Crop: Not linked"'
                  ),
                  (
                      'it.text="Crop: ${crops[i-1].name}"',
                      'crb.text="Crop: ${crops[i-1].name}"'
                  )
              ]
          )


          patch_button_declarations(
              "internal fun MainActivity.reportFiltersDialog",
              "internal fun MainActivity.reports()",
              [
                  "wb",
                  "fb",
                  "cb"
              ]
          )

          patch_block(
              "internal fun MainActivity.reportFiltersDialog",
              "internal fun MainActivity.reports()",
              [
                  (
                      'it.text="Worker: ${if(i==0)"All" else workers[i-1].name}"',
                      'wb.text="Worker: ${if(i==0)"All" else workers[i-1].name}"'
                  ),
                  (
                      'it.text="Field: ${if(i==0)"All" else fields[i-1].name}"',
                      'fb.text="Field: ${if(i==0)"All" else fields[i-1].name}"'
                  ),
                  (
                      'it.text="Crop: ${if(i==0)"All" else crops[i-1].name}"',
                      'cb.text="Crop: ${if(i==0)"All" else crops[i-1].name}"'
                  )
              ]
          )


          patch_button_declarations(
              "internal fun MainActivity.workTemplateForm",
              "internal fun MainActivity.fieldProfile",
              [
                  "rateTypeBtn"
              ]
          )

          patch_block(
              "internal fun MainActivity.workTemplateForm",
              "internal fun MainActivity.fieldProfile",
              [
                  (
                      'it.text="Rate type: $rateType"',
                      'rateTypeBtn.text="Rate type: $rateType"'
                  )
              ]
          )


          patch_button_declarations(
              "internal fun MainActivity.attendanceForm",
              "internal fun MainActivity.attendanceHistory()",
              [
                  "fieldBtn",
                  "statusBtn"
              ]
          )

          patch_block(
              "internal fun MainActivity.attendanceForm",
              "internal fun MainActivity.attendanceHistory()",
              [
                  (
                      'it.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"',
                      'fieldBtn.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"'
                  ),
                  (
                      'it.text="Status: $status"',
                      'statusBtn.text="Status: $status"'
                  )
              ]
          )


          patch_button_declarations(
              "internal fun MainActivity.customReport",
              "internal fun MainActivity.auditLogScreen()",
              [
                  "wb",
                  "fb",
                  "cb"
              ]
          )

          patch_block(
              "internal fun MainActivity.customReport",
              "internal fun MainActivity.auditLogScreen()",
              [
                  (
                      'it.text="Worker: ${if(i==0)"All" else workers[i-1].name}"',
                      'wb.text="Worker: ${if(i==0)"All" else workers[i-1].name}"'
                  ),
                  (
                      'it.text="Field: ${if(i==0)"All" else fields[i-1].name}"',
                      'fb.text="Field: ${if(i==0)"All" else fields[i-1].name}"'
                  ),
                  (
                      'it.text="Crop: ${if(i==0)"All" else crops[i-1].name}"',
                      'cb.text="Crop: ${if(i==0)"All" else crops[i-1].name}"'
                  )
              ]
          )


          export_pattern = re.compile(
              r'contentResolver\.openOutputStream\(uri\)!!\.use\{out->'
              r'when\(exportType\)\{.*?\n\s*\}\}',
              re.S
          )

          export_replacement = '''contentResolver.openOutputStream(uri)!!.use{out->when{
                    exportType=="workers"->app.export.csvWorkers(out)
                    exportType=="ledger"->app.export.csvLedger(out)
                    exportType.startsWith("report:")->app.export.csvReport(exportType.removePrefix("report:"),out)
                    exportType.startsWith("reportpdf:")->app.export.pdfReport(exportType.removePrefix("reportpdf:"),out)
                    exportType=="pdf"->app.export.pdfSummary(out)
                    exportType=="backup"->app.backup.export(out)
                    else->throw IllegalArgumentException("Unknown export type: $exportType")
                }}'''

          source, export_count = export_pattern.subn(
              export_replacement,
              source,
              count=1
          )

          if export_count != 1:

              if (
                  "when(exportType){" in source
                  or
                  'exportType.startsWith("report:")'
                  not in source
              ):

                  raise SystemExit(
                      "ERROR: exportType block could not be safely patched"
                  )


          calendar_start = source.find(
              "internal fun MainActivity.attendanceCalendar()"
          )

          if calendar_start < 0:
              raise SystemExit(
                  "ERROR: attendanceCalendar() not found"
              )

          calendar_end = source.find(
              "internal fun MainActivity.paymentLedger()",
              calendar_start
          )

          if calendar_end < 0:
              raise SystemExit(
                  "ERROR: paymentLedger() marker not found"
              )

          calendar = source[
              calendar_start:calendar_end
          ]

          render_start = calendar.find(
              "        fun render(){"
          )

          summary_start = calendar.find(
              "        fun renderSummary(){",
              render_start
          )

          nav_start = calendar.find(
              "        val nav=",
              summary_start
          )

          if (
              render_start < 0
              or summary_start < 0
              or nav_start < 0
          ):
              raise SystemExit(
                  "ERROR: attendance render markers not found"
              )

          if not (
              render_start
              < summary_start
              < nav_start
          ):
              raise SystemExit(
                  "ERROR: unexpected attendance render order"
              )

          render_block = calendar[
              render_start:summary_start
          ]

          summary_block = calendar[
              summary_start:nav_start
          ]

          calendar = (
              calendar[:render_start]
              + summary_block
              + render_block
              + calendar[nav_start:]
          )

          source = (
              source[:calendar_start]
              + calendar
              + source[calendar_end:]
          )


          attendance_status_replacements = [
              (
                  'statusViews.forEach{it.text="FULL"}',
                  'statusViews.values.forEach{it.text="FULL"}'
              ),
              (
                  'statusViews.forEach{it.text="HALF"}',
                  'statusViews.values.forEach{it.text="HALF"}'
              ),
              (
                  'statusViews.forEach{it.text=AttendanceRules.UNMARKED}',
                  'statusViews.values.forEach{it.text=AttendanceRules.UNMARKED}'
              ),
          ]

          for old, new in attendance_status_replacements:

              if old in source:

                  source = source.replace(
                      old,
                      new
                  )

              elif new not in source:

                  raise SystemExit(
                      "ERROR: expected attendance status pattern "
                      f"not found: {old}"
                  )


          file.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "RELEASE_SOURCE_PATCH=PASS"
          )
          PY


          echo ""
          echo "=========================================="
          echo "RELEASE SOURCE AUDIT"
