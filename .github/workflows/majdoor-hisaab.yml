name: Build Majdoor Hisaab PRO V27 v2.10 FINAL APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-v27-release
  cancel-in-progress: true

jobs:
  build:
    name: V27 v2.10 FINAL Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # 4. INSTALL ANDROID SDK 35
      # ============================================================
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # ============================================================
      # 5. FIND EXACT ZIP
      # ============================================================
      - name: Find V27 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="Majdoor_Hisaab_PRO_V27_FULL_AUDITED_V5.zip"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERROR: Required ZIP not found:"
            echo "$ZIP_NAME"
            echo
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP FOUND:"
          ls -lh "$ZIP_NAME"

      # ============================================================
      # 6. VERIFY REQUIRED ZIP CONTENT
      # ============================================================
      - name: Verify ZIP structure
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="Majdoor_Hisaab_PRO_V27_FULL_AUDITED_V5.zip"

          required_files=(
            "src/settings.gradle.kts"
            "src/build.gradle.kts"
            "src/gradle.properties"
            "src/gradlew"
            "src/app/build.gradle.kts"
            "src/app/src/main/AndroidManifest.xml"
            "src/app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
          )

          for f in "${required_files[@]}"; do
            if ! unzip -l "$ZIP_NAME" | grep -Fq "$f"; then
              echo "ERROR: Missing ZIP entry: $f"
              exit 1
            fi
          done

          echo "ZIP STRUCTURE PASS"

      # ============================================================
      # 7. EXTRACT
      # ============================================================
      - name: Extract V27 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/v27-source"
          mkdir -p "$GITHUB_WORKSPACE/v27-source"

          unzip -q \
            "Majdoor_Hisaab_PRO_V27_FULL_AUDITED_V5.zip" \
            -d "$GITHUB_WORKSPACE/v27-source"

          test -f "$GITHUB_WORKSPACE/v27-source/src/gradlew"

          echo "SOURCE EXTRACT PASS"

      # ============================================================
      # 8. PROJECT ROOT
      # ============================================================
      - name: Set project root
        shell: bash
        run: |
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/v27-source/src" >> "$GITHUB_ENV"

      # ============================================================
      # 9. VERIFY PROJECT FILES
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          required_files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "gradlew"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
            "gradle/wrapper/gradle-wrapper.properties"
            "gradle/wrapper/gradle-wrapper.jar"
          )

          for f in "${required_files[@]}"; do
            test -f "$f" || {
              echo "ERROR: Missing $f"
              exit 1
            }
          done

          chmod +x gradlew

          echo "ANDROID PROJECT STRUCTURE PASS"

      # ============================================================
      # 10. VERIFY SETTINGS
      # ============================================================
      - name: Verify settings.gradle.kts
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq 'rootProject.name = "MajdoorHisaab"' settings.gradle.kts
          grep -Fq 'include(":app")' settings.gradle.kts

          echo "SETTINGS PASS"

      # ============================================================
      # 11. VERIFY ROOT BUILD CONFIG
      # ============================================================
      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq '8.9.1' build.gradle.kts
          grep -Fq '2.1.20' build.gradle.kts
          grep -Fq '8.11.1' gradle/wrapper/gradle-wrapper.properties

          echo "GRADLE CONFIG PASS"

      # ============================================================
      # 12. VERIFY APP CONFIG
      # ============================================================
      - name: Verify app configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq 'namespace = "com.majdoor.hisaab"' app/build.gradle.kts
          grep -Fq 'applicationId = "com.majdoor.hisaab"' app/build.gradle.kts
          grep -Fq 'compileSdk = 35' app/build.gradle.kts
          grep -Fq 'minSdk = 26' app/build.gradle.kts
          grep -Fq 'targetSdk = 35' app/build.gradle.kts
          grep -Fq 'versionCode = 30' app/build.gradle.kts
          grep -Fq 'versionName = "2.10"' app/build.gradle.kts
          grep -Fq 'JavaVersion.VERSION_17' app/build.gradle.kts
          grep -Fq 'jvmTarget = "17"' app/build.gradle.kts

          echo "APP CONFIG PASS"

      # ============================================================
      # 13. VERIFY MANIFEST
      # ============================================================
      - name: Verify AndroidManifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq 'android:exported="true"' \
            app/src/main/AndroidManifest.xml

          grep -Fq 'com.majdoor.hisaab.MainActivity' \
            app/src/main/AndroidManifest.xml

          echo "MANIFEST PASS"

      # ============================================================
      # 14. VERIFY MAINACTIVITY PACKAGE
      # ============================================================
      - name: Verify MainActivity package
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq 'package com.majdoor.hisaab' \
            app/src/main/java/com/majdoor/hisaab/MainActivity.kt

          echo "MAINACTIVITY PACKAGE PASS"

      # ============================================================
      # 15. VERIFY GRADLE WRAPPER
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq 'gradle-8.11.1-bin.zip' \
            gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 16. VERIFY RELEASE SECRETS
      # ============================================================
      - name: Verify release signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

          echo "RELEASE SIGNING SECRETS PASS"

      # ============================================================
      # 17. RESTORE RELEASE KEYSTORE
      # ============================================================
      - name: Restore permanent release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          test -s release-keystore.jks

          cat >> gradle.properties <<EOF

          RELEASE_STORE_FILE=$PROJECT_ROOT/release-keystore.jks
          RELEASE_STORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD
          EOF

          echo "KEYSTORE RESTORE PASS"

      # ============================================================
      # 18. VERIFY SOURCE BEFORE FIX
      # ============================================================
      - name: Verify MainActivity source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -s app/src/main/java/com/majdoor/hisaab/MainActivity.kt

          echo "SOURCE FOUND"

      # ============================================================
      # 19. VERIFY SIGNING CONFIG
      # ============================================================
      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq 'signingConfigs' app/build.gradle.kts
          grep -Fq 'RELEASE_STORE_FILE' app/build.gradle.kts
          grep -Fq 'RELEASE_KEY_ALIAS' app/build.gradle.kts

          echo "SIGNING CONFIG PASS"

      # ============================================================
      # 20. VERIFY APP VERSION
      # ============================================================
      - name: Verify exact V27 v2.10
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq 'versionCode = 30' app/build.gradle.kts
          grep -Fq 'versionName = "2.10"' app/build.gradle.kts

          echo "V27 v2.10 VERSION PASS"

      # ============================================================
      # 21. FIX ONLY THE ACTUAL FAILED MainActivity ERRORS
      # ============================================================
      - name: Fix exact MainActivity compile errors
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
          )

          text = path.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # FIX 1:
          # GitHub compile failure:
          # Argument type mismatch:
          # actual type is Int, but Float was expected
          #
          # Existing source has many calls such as:
          # Hotspot("Back",0,0,12,10){...}
          #
          # Only the Hotspot coordinate type is changed.
          # Existing screen coordinates remain exactly the same.
          # --------------------------------------------------------

          old_hotspot = (
              'private data class Hotspot('
              'val name:String,'
              'val x:Float,'
              'val y:Float,'
              'val w:Float,'
              'val h:Float,'
              'val action:()->Unit'
              ')'
          )

          new_hotspot = '''private class Hotspot(
              val name:String,
              x:Number,
              y:Number,
              w:Number,
              h:Number,
              val action:()->Unit
          ){
              val x:Float=x.toFloat()
              val y:Float=y.toFloat()
              val w:Float=w.toFloat()
              val h:Float=h.toFloat()
          }'''

          if old_hotspot in text:
              text = text.replace(old_hotspot, new_hotspot, 1)
              print("FIXED: Hotspot Int -> Float compile mismatch")
          elif 'private class Hotspot(' in text:
              print("Hotspot fix already present")
          else:
              raise SystemExit(
                  "ERROR: Expected Hotspot declaration was not found"
              )

          # --------------------------------------------------------
          # FIX 2:
          # GitHub compile failure:
          # Unresolved reference: reportWorkerWhere
          #
          # Used by:
          # shareReportSummary()
          # shareReportWhatsApp()
          #
          # This function follows the existing report filters:
          # - reportFrom/reportTo
          # - reportWorkerQuery
          # - reportFieldIds
          # --------------------------------------------------------

          if "private fun reportWorkerWhere(" not in text:

              marker = "    private fun shareReportSummary(){"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: shareReportSummary marker not found"
                  )

              function = '''    private fun reportWorkerWhere(
                  alias:String="w"
              ):Pair<String,List<String>>{

                  val clauses=mutableListOf(
                      "$alias.date BETWEEN ? AND ?"
                  )

                  val args=mutableListOf(
                      reportFrom,
                      reportTo
                  )

                  if(reportWorkerQuery.isNotBlank()){

                      clauses.add(
                          "$alias.worker_id IN (" +
                          "SELECT id FROM workers " +
                          "WHERE lower(name) LIKE ? " +
                          "OR lower(code) LIKE ?" +
                          ")"
                      )

                      val qv =
                          "%${reportWorkerQuery.lowercase(Locale.getDefault())}%"

                      args.add(qv)
                      args.add(qv)
                  }

                  if(reportFieldIds.isNotEmpty()){
                      clauses.add(
                          "$alias.field_id IN " +
                          "(${reportFieldIds.joinToString(",")})"
                      )
                  }

                  return clauses.joinToString(" AND ") to args
              }

          '''

              text = text.replace(
                  marker,
                  function + marker,
                  1
              )

              print("FIXED: reportWorkerWhere()")
          else:
              print("reportWorkerWhere() already present")

          path.write_text(text, encoding="utf-8")

          print("EXACT FAILED SOURCE FIXES APPLIED")
          PY

      # ============================================================
      # 22. VERIFY EXACT SOURCE FIX
      # ============================================================
      - name: Verify exact source fix
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq 'private class Hotspot(' \
            app/src/main/java/com/majdoor/hisaab/MainActivity.kt

          grep -Fq 'x:Number' \
            app/src/main/java/com/majdoor/hisaab/MainActivity.kt

          grep -Fq 'val x:Float=x.toFloat()' \
            app/src/main/java/com/majdoor/hisaab/MainActivity.kt

          grep -Fq 'private fun reportWorkerWhere(' \
            app/src/main/java/com/majdoor/hisaab/MainActivity.kt

          grep -Fq 'reportWorkerWhere("w")' \
            app/src/main/java/com/majdoor/hisaab/MainActivity.kt

          echo "EXACT SOURCE FIX PASS"

      # ============================================================
      # 23. CLEAN
      # ============================================================
      - name: Clean V27 build
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          ./gradlew clean --no-daemon

          echo "CLEAN PASS"

      # ============================================================
      # 24. BUILD FINAL RELEASE APK ONLY
      # ============================================================
      - name: Build FINAL Release APK only
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK not generated"
            exit 1
          fi

          echo "RELEASE APK GENERATED:"
          ls -lh "$APK"

      # ============================================================
      # 25. VERIFY NO DEBUG APK / NO AAB
      # ============================================================
      - name: Verify final artifact type
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          if find app/build/outputs -type f \
            \( -name "*debug*.apk" -o -name "*.aab" \) \
            | grep -q .; then

            echo "ERROR: Debug APK or AAB found"
            find app/build/outputs -type f \
              \( -name "*debug*.apk" -o -name "*.aab" \)
            exit 1
          fi

          echo "FINAL ARTIFACT TYPE PASS"

      # ============================================================
      # 26. VERIFY APK PACKAGE + VERSION
      # ============================================================
      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | tee /tmp/aapt.txt

          grep -Fq "package: name='com.majdoor.hisaab'" /tmp/aapt.txt
          grep -Fq "versionCode='30'" /tmp/aapt.txt
          grep -Fq "versionName='2.10'" /tmp/aapt.txt

          echo "APK PACKAGE/VERSION PASS"

      # ============================================================
      # 27. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            "$APK"

          echo "APK SIGNATURE PASS"

      # ============================================================
      # 28. SHA256
      # ============================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          sha256sum "$APK" | tee APK_SHA256.txt

      # ============================================================
      # 29. COPY FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          cp \
            app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/Majdoor_Hisaab_PRO_V27_v2.10_FINAL_RELEASE.apk"

          cp \
            APK_SHA256.txt \
            "$GITHUB_WORKSPACE/Majdoor_Hisaab_PRO_V27_v2.10_FINAL_RELEASE_SHA256.txt"

          ls -lh \
            "$GITHUB_WORKSPACE/Majdoor_Hisaab_PRO_V27_v2.10_FINAL_RELEASE.apk"

      # ============================================================
      # 30. UPLOAD FINAL APK
      # ============================================================
      - name: Upload FINAL Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor_Hisaab_PRO_V27_v2.10_FINAL_RELEASE_APK
          path: |
            Majdoor_Hisaab_PRO_V27_v2.10_FINAL_RELEASE.apk
            Majdoor_Hisaab_PRO_V27_v2.10_FINAL_RELEASE_SHA256.txt
          if-no-files-found: error
          retention-days: 30
