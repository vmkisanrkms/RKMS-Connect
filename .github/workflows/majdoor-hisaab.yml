name: Build Majdoor Hisaab PRO V27 v2.10 FINAL APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-v27-final-release
  cancel-in-progress: true

jobs:
  build:
    name: V27 v2.10 FINAL Release APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # =========================================================
      # 4. INSTALL EXACT ANDROID SDK / BUILD TOOLS
      # =========================================================
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "=========================================="
          echo "Android SDK"
          echo "platform     : android-35"
          echo "build-tools  : 35.0.0"
          echo "status       : PASS"
          echo "=========================================="

      # =========================================================
      # 5. FIND EXACT V27 ZIP
      # =========================================================
      - name: Find V27 V5 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="Majdoor_Hisaab_PRO_V27_FULL_AUDITED_V5.zip"
          ZIP_FILE="$GITHUB_WORKSPACE/$ZIP_NAME"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "$ZIP_NAME" \
                -print -quit
            )"
          fi

          if [ -z "${ZIP_FILE:-}" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_NAME not found."
            echo
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "V27_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

          echo
          echo "V27 ZIP FOUND:"
          ls -lh "$ZIP_FILE"

      # =========================================================
      # 6. VERIFY ZIP BEFORE EXTRACTION
      # =========================================================
      - name: Verify V27 ZIP structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking ZIP..."

          unzip -t "$V27_ZIP" >/dev/null

          unzip -l "$V27_ZIP" | grep -Fq "src/settings.gradle.kts"
          unzip -l "$V27_ZIP" | grep -Fq "src/build.gradle.kts"
          unzip -l "$V27_ZIP" | grep -Fq "src/gradle.properties"
          unzip -l "$V27_ZIP" | grep -Fq "src/gradlew"
          unzip -l "$V27_ZIP" | grep -Fq "src/app/build.gradle.kts"
          unzip -l "$V27_ZIP" | grep -Fq "src/app/src/main/AndroidManifest.xml"
          unzip -l "$V27_ZIP" | grep -Fq "src/app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          echo
          echo "V27 ZIP structure: PASS"

      # =========================================================
      # 7. EXTRACT
      # =========================================================
      - name: Extract V27 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/v27-source"

          mkdir -p "$GITHUB_WORKSPACE/v27-source"

          unzip -q \
            "$V27_ZIP" \
            -d "$GITHUB_WORKSPACE/v27-source"

          echo
          echo "Extracted source:"
          find "$GITHUB_WORKSPACE/v27-source/src" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -250

      # =========================================================
      # 8. SET EXACT PROJECT ROOT
      # =========================================================
      - name: Set V27 project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$GITHUB_WORKSPACE/v27-source/src"

          test -d "$PROJECT_ROOT"

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/gradle.properties"
          test -f "$PROJECT_ROOT/gradlew"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo
          echo "=========================================="
          echo "PROJECT ROOT"
          echo "=========================================="
          echo "$PROJECT_ROOT"
          echo "=========================================="

      # =========================================================
      # 9. COMPLETE PROJECT STRUCTURE AUDIT
      # =========================================================
      - name: Audit V27 project files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "gradlew"
            "gradlew.bat"
            "gradle/wrapper/gradle-wrapper.jar"
            "gradle/wrapper/gradle-wrapper.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing required file:"
              echo "$FILE"
              exit 1
            fi
          done

          chmod +x gradlew

          echo
          echo "All required V27 files: PASS"

      # =========================================================
      # 10. VERIFY SETTINGS.GRADLE.KTS
      # =========================================================
      - name: Verify settings.gradle.kts
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq \
            'rootProject.name="MajdoorHisaab"' \
            settings.gradle.kts

          grep -Fq \
            'include(":app")' \
            settings.gradle.kts

          echo "settings.gradle.kts: PASS"

      # =========================================================
      # 11. VERIFY ROOT BUILD.GRADLE.KTS
      # =========================================================
      - name: Verify root Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq \
            'id("com.android.application") version "8.9.1" apply false' \
            build.gradle.kts

          grep -Fq \
            'id("org.jetbrains.kotlin.android") version "2.1.20" apply false' \
            build.gradle.kts

          grep -Fq \
            'gradleVersion = "8.11.1"' \
            build.gradle.kts

          grep -Fq \
            'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' \
            build.gradle.kts

          echo "Root Gradle configuration: PASS"

      # =========================================================
      # 12. VERIFY APP BUILD.GRADLE.KTS
      # =========================================================
      - name: Verify V27 application configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APP="app/build.gradle.kts"

          grep -Fq \
            'namespace = "com.majdoor.hisaab"' \
            "$APP"

          grep -Fq \
            'compileSdk = 35' \
            "$APP"

          grep -Fq \
            'applicationId = "com.majdoor.hisaab"' \
            "$APP"

          grep -Fq \
            'minSdk = 26' \
            "$APP"

          grep -Fq \
            'targetSdk = 35' \
            "$APP"

          grep -Fq \
            'versionCode = 30' \
            "$APP"

          grep -Fq \
            'versionName = "2.10"' \
            "$APP"

          grep -Fq \
            'JavaVersion.VERSION_17' \
            "$APP"

          grep -Fq \
            'jvmTarget = "17"' \
            "$APP"

          grep -Fq \
            'signingConfig = signingConfigs.getByName("release")' \
            "$APP"

          echo
          echo "=========================================="
          echo "V27 APPLICATION CONFIG"
          echo "=========================================="
          echo "Package      : com.majdoor.hisaab"
          echo "Version      : 2.10"
          echo "VersionCode  : 30"
          echo "compileSdk   : 35"
          echo "targetSdk    : 35"
          echo "minSdk       : 26"
          echo "Java         : 17"
          echo "AGP          : 8.9.1"
          echo "Kotlin       : 2.1.20"
          echo "Gradle       : 8.11.1"
          echo "=========================================="
          echo "Application configuration: PASS"

      # =========================================================
      # 13. VERIFY MANIFEST
      # =========================================================
      - name: Verify AndroidManifest.xml
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          MANIFEST="app/src/main/AndroidManifest.xml"

          grep -Fq \
            'android:label="Majdoor Hisaab PRO"' \
            "$MANIFEST"

          grep -Fq \
            'android:icon="@drawable/majdoor_logo"' \
            "$MANIFEST"

          grep -Fq \
            'android:name=".MainActivity"' \
            "$MANIFEST"

          grep -Fq \
            'android:exported="true"' \
            "$MANIFEST"

          echo "AndroidManifest.xml: PASS"

      # =========================================================
      # 14. VERIFY MAIN ACTIVITY
      # =========================================================
      - name: Verify MainActivity
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          MAIN="app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          test -s "$MAIN"

          grep -Fq \
            'package com.majdoor.hisaab' \
            "$MAIN"

          echo "MainActivity.kt: PASS"

          echo
          echo "MainActivity size:"
          wc -c "$MAIN"

      # =========================================================
      # 15. VERIFY WRAPPER
      # =========================================================
      - name: Verify Gradle Wrapper 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          chmod +x gradlew

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            gradle/wrapper/gradle-wrapper.properties

          grep -Fq \
            'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' \
            gradle/wrapper/gradle-wrapper.properties

          echo
          echo "Gradle wrapper configuration: PASS"

      # =========================================================
      # 16. GRADLE VERSION TEST
      # =========================================================
      - name: Test Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          chmod +x gradlew

          ./gradlew --version

          ./gradlew --version \
            | grep -Fq "Gradle 8.11.1"

          echo "Gradle 8.11.1: PASS"

      # =========================================================
      # 17. VERIFY SIGNING SECRETS
      # =========================================================
      - name: Verify release signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret missing."
            exit 1
          fi

          if [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: RELEASE_KEYSTORE_PASSWORD secret missing."
            exit 1
          fi

          if [ -z "$RELEASE_KEY_ALIAS" ]; then
            echo "ERROR: RELEASE_KEY_ALIAS secret missing."
            exit 1
          fi

          if [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "ERROR: RELEASE_KEY_PASSWORD secret missing."
            exit 1
          fi

          echo "Release signing secrets: PRESENT"

      # =========================================================
      # 18. RESTORE RELEASE KEYSTORE
      # =========================================================
      - name: Restore permanent release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          rm -f release.keystore

          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

          cat >> gradle.properties <<EOF
          releaseStoreFile=$PROJECT_ROOT/release.keystore
          releaseStorePassword=$RELEASE_KEYSTORE_PASSWORD
          releaseKeyAlias=$RELEASE_KEY_ALIAS
          releaseKeyPassword=$RELEASE_KEY_PASSWORD
          EOF

          echo "Permanent release keystore restored."

      # =========================================================
      # 19. VERIFY SIGNING CONFIGURATION
      # =========================================================
      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -f release.keystore
          test -s release.keystore

          grep -Fq "releaseStoreFile=" gradle.properties
          grep -Fq "releaseStorePassword=" gradle.properties
          grep -Fq "releaseKeyAlias=" gradle.properties
          grep -Fq "releaseKeyPassword=" gradle.properties

          echo "Release signing configuration: PASS"

      # =========================================================
      # 20. FIX VERIFIED KOTLIN FLOAT TYPE ERROR
      #
      # Build failure found at:
      # MainActivity.kt:1211
      # MainActivity.kt:1212
      #
      # Error:
      # actual type is Int, but Float was expected.
      #
      # Only numeric literals inside floatArrayOf(...) are
      # converted to Float literals.
      # =========================================================
      - name: Fix Kotlin Float array literals
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          MAIN="app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          python3 - "$MAIN" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          changed = 0

          for i, line in enumerate(lines):
              if "floatArrayOf(" not in line:
                  continue

              original = line

              # Only change numeric literals occurring on a line
              # containing floatArrayOf(...).
              #
              # Examples:
              # 0   -> 0f
              # 10  -> 10f
              # 1.5 -> 1.5f
              #
              # Existing Float suffixes are preserved.
              def convert(match):
                  value = match.group(1)

                  # Don't touch values already followed by f/F.
                  end = match.end()
                  if end < len(line) and line[end:end + 1] in ("f", "F"):
                      return value

                  return value + "f"

              line = re.sub(
                  r'(?<![A-Za-z0-9_.])(-?(?:\d+\.\d+|\d+))(?![A-Za-z0-9_.])',
                  convert,
                  line
              )

              if line != original:
                  lines[i] = line
                  changed += 1

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(lines)

          print("Float-array lines changed:", changed)

          if changed == 0:
              raise SystemExit(
                  "ERROR: No floatArrayOf(...) numeric literals were found."
              )
          PY

          echo
          echo "=========================================="
          echo "CHECK MainActivity.kt"
          echo "=========================================="

          sed -n '1205,1218p' "$MAIN"

          echo
          echo "Float type correction: PASS"

      # =========================================================
      # 21. CLEAN BUILD
      # =========================================================
      - name: Clean V27 build
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          ./gradlew clean --no-daemon

          rm -rf app/build/outputs/apk
          rm -rf app/build/outputs/bundle

          echo "Clean build environment: PASS"

      # =========================================================
      # 22. FINAL RELEASE APK ONLY
      # =========================================================
      - name: Build FINAL Release APK only
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 23. VERIFY FINAL APK EXISTS
      # =========================================================
      - name: Verify final release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final release APK not found."
            find app/build/outputs -type f | sort || true
            exit 1
          fi

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          echo
          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="
          ls -lh "$APK"
          echo "Integrity: PASS"
          echo "=========================================="

      # =========================================================
      # 24. ENSURE NO DEBUG APK
      # =========================================================
      - name: Verify no debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          DEBUG_APKS="$(
            find app/build/outputs/apk \
              -type f \
              -iname "*debug*.apk" \
              2>/dev/null || true
          )"

          if [ -n "$DEBUG_APKS" ]; then
            echo "ERROR: Debug APK exists:"
            echo "$DEBUG_APKS"
            exit 1
          fi

          echo "Debug APK: NONE"

      # =========================================================
      # 25. ENSURE NO AAB
      # =========================================================
      - name: Verify no AAB
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          AABS="$(
            find app/build/outputs \
              -type f \
              \( -name "*.aab" -o -name "*.aab.zip" \) \
              2>/dev/null || true
          )"

          if [ -n "$AABS" ]; then
            echo "ERROR: AAB generated:"
            echo "$AABS"
            exit 1
          fi

          echo "AAB: NONE"

      # =========================================================
      # 26. VERIFY APK PACKAGE / VERSION
      # =========================================================
      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          test -x "$AAPT"

          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING"

          echo "$BADGING" \
            | grep -Fq \
            "package: name='com.majdoor.hisaab'"

          echo "$BADGING" \
            | grep -Fq \
            "versionCode='30'"

          echo "$BADGING" \
            | grep -Fq \
            "versionName='2.10'"

          echo
          echo "Package/version verification: PASS"

      # =========================================================
      # 27. VERIFY RELEASE APK SIGNATURE
      # =========================================================
      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo "Release APK signature: PASS"

      # =========================================================
      # 28. GENERATE SHA256
      # =========================================================
      - name: Generate final APK SHA-256
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          sha256sum "$APK" \
            | tee "$GITHUB_WORKSPACE/release-apk-sha256.txt"

      # =========================================================
      # 29. PREPARE FINAL ARTIFACT
      # =========================================================
      - name: Prepare FINAL artifact
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          rm -rf "$GITHUB_WORKSPACE/final"

          mkdir -p "$GITHUB_WORKSPACE/final"

          cp \
            app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/final/Majdoor-Hisaab-PRO-V27-v2.10-FINAL.apk"

          cp \
            "$GITHUB_WORKSPACE/release-apk-sha256.txt" \
            "$GITHUB_WORKSPACE/final/release-apk-sha256.txt"

          echo
          echo "FINAL FILES:"
          ls -lh "$GITHUB_WORKSPACE/final"

      # =========================================================
      # 30. UPLOAD ONLY FINAL APK
      # =========================================================
      - name: Upload FINAL Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V27-v2.10-FINAL-Release-APK
          path: final/Majdoor-Hisaab-PRO-V27-v2.10-FINAL.apk
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 31. UPLOAD FINAL APK SHA256
      # =========================================================
      - name: Upload FINAL APK SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V27-v2.10-SHA256
          path: final/release-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 32. FINAL SUMMARY
      # =========================================================
      - name: Final build summary
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=================================================="
          echo "MAJDOOR HISAAB PRO V27 v2.10"
          echo "FINAL RELEASE BUILD"
          echo "=================================================="
          echo "Package      : com.majdoor.hisaab"
          echo "Version      : 2.10"
          echo "VersionCode  : 30"
          echo "compileSdk   : 35"
          echo "targetSdk    : 35"
          echo "minSdk       : 26"
          echo "Java         : 17"
          echo "AGP          : 8.9.1"
          echo "Kotlin       : 2.1.20"
          echo "Gradle       : 8.11.1"
          echo "Build type   : RELEASE"
          echo "Debug APK    : NO"
          echo "AAB          : NO"
          echo "Signing      : PERMANENT RELEASE KEY"
          echo "=================================================="
          echo "BUILD COMPLETE"
          echo "=================================================="
