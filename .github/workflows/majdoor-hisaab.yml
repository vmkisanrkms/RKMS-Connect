name: Majdoor Hisaab - Final Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

jobs:
  build:
    name: Build Final Release APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

      # =========================================================
      # 3. ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Android SDK ${ANDROID_API} installed."
          echo "Build Tools ${BUILD_TOOLS} installed."

      # =========================================================
      # 4. VERIFY ANDROID SDK
      # =========================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          AAPT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          "$AAPT" version
          "$APKSIGNER" version
          adb version

          echo "Android SDK verification: PASS"
          echo "AAPT: PASS"
          echo "APK Signer: PASS"
          echo "Zipalign: PASS"

      # =========================================================
      # 5. LOCATE SOURCE ZIP
      # =========================================================

      - name: Locate audited source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository ZIP files:"
          find . -maxdepth 2 -type f -name "*.zip" -print

          SOURCE_ZIP="Majdoor_Hisaab_PRO_v2_4_LOCAL_SQLITE_FINAL_FIXED_AUDITED.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: Required source ZIP not found:"
            echo "$SOURCE_ZIP"
            echo
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_OUTPUT"

          echo "Source ZIP found:"
          ls -lh "$SOURCE_ZIP"

      # =========================================================
      # 6. VERIFY ZIP
      # =========================================================

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="${{ steps.source.outputs.SOURCE_ZIP }}"

          test -f "$SOURCE_ZIP"

          unzip -t "$SOURCE_ZIP"

          echo "Source ZIP integrity: PASS"

      # =========================================================
      # 7. EXTRACT SOURCE
      # =========================================================

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="${{ steps.source.outputs.SOURCE_ZIP }}"

          rm -rf build-source
          mkdir -p build-source

          unzip -q "$SOURCE_ZIP" -d build-source

          echo "Extracted source:"
          find build-source -maxdepth 5 -type f | sort

      # =========================================================
      # 8. SET ANDROID PROJECT
      # =========================================================

      - name: Set Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "build-source/settings.gradle.kts" ] && \
             [ -f "build-source/app/build.gradle.kts" ]; then

            PROJECT_DIR="$GITHUB_WORKSPACE/build-source"

          elif [ -d "build-source/app" ]; then

            PROJECT_DIR="$GITHUB_WORKSPACE/build-source"

          else

            echo "ERROR: Android project not found."
            find build-source -maxdepth 6 -type f | sort
            exit 1

          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

      # =========================================================
      # 9. REPAIR KOTLIN SOURCE
      # =========================================================
      #
      # IMPORTANT:
      # This step repairs the two actual errors reported by
      # GitHub Run #28:
      #
      # MainActivity.kt:400
      # MainActivity.kt:626
      #
      # It also keeps the previously known ternary fixes.
      # =========================================================

      - name: Repair verified Kotlin syntax
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          test -f "$MAIN"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "build-source/app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
          )

          lines = p.read_text(encoding="utf-8").splitlines()

          changed = []

          # -----------------------------------------------------
          # Previously identified malformed Kotlin expressions
          # -----------------------------------------------------

          replacements = {
              'if(earned-paid>0)C.RED:C.MUTED':
                  'if(earned-paid>0) C.RED else C.MUTED',

              'if(c.getInt(4)==1)"Inactive":"Active"':
                  'if(c.getInt(4)==1) "Inactive" else "Active"',

              'if(id==null)"New Worker":"Worker Edit"':
                  'if(id==null) "New Worker" else "Worker Edit"',

              'if(earned-paid>0)C.RED:C.GREEN':
                  'if(earned-paid>0) C.RED else C.GREEN',

              'if(earned-paid>0)C.RED_SOFT:C.GREEN_SOFT':
                  'if(earned-paid>0) C.RED_SOFT else C.GREEN_SOFT',

              'if(c.getInt(2)==1)"Inactive":"Active"':
                  'if(c.getInt(2)==1) "Inactive" else "Active"',

              'if(id==null)"New Fields / Crops":"Field Edit"':
                  'if(id==null) "New Fields / Crops" else "Field Edit"',

              'if(e-p>0)C.RED:C.GREEN':
                  'if(e-p>0) C.RED else C.GREEN',
          }

          for i, line in enumerate(lines):
              original = line

              for old, new in replacements.items():
                  line = line.replace(old, new)

              if line != original:
                  changed.append(i + 1)

              lines[i] = line

          # -----------------------------------------------------
          # ACTUAL ERROR #1
          #
          # MainActivity.kt:400
          #
          # GitHub compiler:
          # "'if' must have both main and 'else' branches
          #  when used as an expression."
          #
          # Repair the malformed selected/soft expression without
          # changing the surrounding UI logic.
          # -----------------------------------------------------

          for i, line in enumerate(lines):

              if "bg(if(selected)" in line and "soft" in line:

                  original = line

                  # Known malformed form:
                  # if(selected)soft
                  #
                  # Convert it to:
                  # if(selected) soft else Color.WHITE
                  #
                  # Only perform this when the malformed form exists.

                  line = line.replace(
                      "if(selected)soft",
                      "if(selected) soft else Color.WHITE"
                  )

                  # Another malformed variant seen in the source:
                  # if(selected)1 else 1
                  #
                  # This expression has no useful conditional effect,
                  # so normalize it to the valid integer value 1.

                  line = line.replace(
                      "if(selected)1 else 1",
                      "1"
                  )

                  if line != original:
                      lines[i] = line
                      changed.append(i + 1)

          # -----------------------------------------------------
          # ACTUAL ERROR #2
          #
          # MainActivity.kt:626
          #
          # GitHub compiler:
          # "Unresolved reference 'date'"
          #
          # The TextView is referenced from inside its own initializer.
          #
          # Convert:
          #
          # val date = outline(...) { ... date.text ... }
          #
          # into:
          #
          # lateinit var date: TextView
          # date = outline(...) { ... date.text ... }
          #
          # -----------------------------------------------------

          for i, line in enumerate(lines):

              if (
                  "val date=outline(" in line
                  and "payDate" in line
                  and "date.text" in line
              ):

                  original = line

                  line = line.replace(
                      "val date=outline(",
                      "date=outline(",
                      1
                  )

                  if line != original:

                      indent = re.match(r"^\\s*", line).group(0)

                      lines.insert(
                          i,
                          indent + "lateinit var date: TextView;"
                      )

                      changed.append(i + 1)
                      changed.append(i + 2)

                      break

          # -----------------------------------------------------
          # Write repaired source
          # -----------------------------------------------------

          p.write_text(
              "\\n".join(lines) + "\\n",
              encoding="utf-8"
          )

          print("Kotlin repair completed.")
          print("Changed lines:", sorted(set(changed)))

          PY

          echo
          echo "Checking known malformed Kotlin expressions..."
          echo

          if grep -nF \
            'if(earned-paid>0)C.RED:C.MUTED' \
            "$MAIN"; then
            echo "ERROR: malformed RED/MUTED expression remains."
            exit 1
          fi

          if grep -nF \
            'if(c.getInt(4)==1)"Inactive":"Active"' \
            "$MAIN"; then
            echo "ERROR: malformed worker status expression remains."
            exit 1
          fi

          if grep -nF \
            'if(id==null)"New Worker":"Worker Edit"' \
            "$MAIN"; then
            echo "ERROR: malformed worker title expression remains."
            exit 1
          fi

          if grep -nF \
            'if(earned-paid>0)C.RED:C.GREEN' \
            "$MAIN"; then
            echo "ERROR: malformed worker color expression remains."
            exit 1
          fi

          if grep -nF \
            'if(earned-paid>0)C.RED_SOFT:C.GREEN_SOFT' \
            "$MAIN"; then
            echo "ERROR: malformed worker soft color expression remains."
            exit 1
          fi

          if grep -nF \
            'if(c.getInt(2)==1)"Inactive":"Active"' \
            "$MAIN"; then
            echo "ERROR: malformed field status expression remains."
            exit 1
          fi

          if grep -nF \
            'if(id==null)"New Fields / Crops":"Field Edit"' \
            "$MAIN"; then
            echo "ERROR: malformed field title expression remains."
            exit 1
          fi

          if grep -nF \
            'if(e-p>0)C.RED:C.GREEN' \
            "$MAIN"; then
            echo "ERROR: malformed field color expression remains."
            exit 1
          fi

          # -----------------------------------------------------
          # Verify the two errors from Run #28 are repaired
          # -----------------------------------------------------

          if grep -nF \
            'if(selected)soft' \
            "$MAIN"; then
            echo "ERROR: malformed selected/soft expression remains."
            exit 1
          fi

          if grep -nF \
            'if(selected)1 else 1' \
            "$MAIN"; then
            echo "ERROR: malformed selected integer expression remains."
            exit 1
          fi

          if grep -nF \
            'val date=outline(' \
            "$MAIN"; then
            echo "ERROR: date self-reference declaration remains."
            exit 1
          fi

          echo
          echo "Kotlin source repair: PASS"
          echo

      # =========================================================
      # 10. SOURCE AUDIT
      # =========================================================

      - name: Audit final source
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_DIR/app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$MAIN"

          grep -q \
            'applicationId="com.majdoor.hisaab"' \
            "$PROJECT_DIR/app/build.gradle.kts"

          grep -q \
            'compileSdk=35' \
            "$PROJECT_DIR/app/build.gradle.kts"

          grep -q \
            'minSdk=26' \
            "$PROJECT_DIR/app/build.gradle.kts"

          grep -q \
            'targetSdk=35' \
            "$PROJECT_DIR/app/build.gradle.kts"

          grep -q \
            'VERSION_17' \
            "$PROJECT_DIR/app/build.gradle.kts"

          grep -q \
            'class MainActivity' \
            "$MAIN"

          echo "Final source audit: PASS"

      # =========================================================
      # 11. JVM 17
      # =========================================================

      - name: Verify JVM configuration
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            'JavaVersion.VERSION_17' \
            "$PROJECT_DIR/app/build.gradle.kts"

          grep -q \
            'JvmTarget.JVM_17' \
            "$PROJECT_DIR/app/build.gradle.kts"

          if grep -R --line-number \
            'options.release.set' \
            "$PROJECT_DIR" \
            --include="*.gradle.kts" \
            --include="*.gradle"; then

            echo "ERROR: Unsupported options.release.set detected."
            exit 1
          fi

          echo "JVM 17 configuration: PASS"

      # =========================================================
      # 12. GRADLE
      # =========================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

      # =========================================================
      # 13. FINAL PRE-BUILD AUDIT
      # =========================================================

      - name: Final pre-build audit
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          grep -q \
            'applicationId="com.majdoor.hisaab"' \
            "$PROJECT_DIR/app/build.gradle.kts"

          grep -q \
            'versionCode=5' \
            "$PROJECT_DIR/app/build.gradle.kts"

          grep -q \
            'versionName="2.2"' \
            "$PROJECT_DIR/app/build.gradle.kts"

          echo "Final pre-build audit: PASS"

      # =========================================================
      # 14. BUILD RELEASE APK
      # =========================================================

      - name: Build Release APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 15. FIND APK
      # =========================================================

      - name: Find Release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "APK files generated:"

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          ls -lh "$APK"

      # =========================================================
      # 16. SIGNING SECRETS
      # =========================================================

      - name: Verify signing secrets
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" ]; then
            echo "ERROR: RELEASE_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ]; then
            echo "ERROR: RELEASE_KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "ERROR: RELEASE_KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "Signing secrets: PASS"

      # =========================================================
      # 17. RESTORE KEYSTORE
      # =========================================================

      - name: Restore permanent release keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/majdoor-release.keystore"

          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" \
            | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

          echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" \
            >> "$GITHUB_ENV"

          echo "Release keystore restored."

      # =========================================================
      # 18. ZIPALIGN
      # =========================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"

          test -x "$ZIPALIGN"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$APK" \
            "$ALIGNED_APK"

          test -f "$ALIGNED_APK"

          mv "$ALIGNED_APK" "$APK"

          echo "Zipalign: PASS"

      # =========================================================
      # 19. SIGN APK
      # =========================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          test -x "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.RELEASE_KEY_PASSWORD }}" \
            --out "$APK.signed" \
            "$APK"

          mv "$APK.signed" "$APK"

          test -f "$APK"

          echo "APK signing: PASS"

      # =========================================================
      # 20. VERIFY FINAL APK
      # =========================================================

      - name: Verify Final Release APK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          AAPT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          echo "APK package information:"

          "$AAPT" dump badging "$APK" | head -20

          echo
          echo "APK signature verification:"

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo
          echo "Final Release APK verification: PASS"

      # =========================================================
      # 21. SHA256
      # =========================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$APK" | tee \
            "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk.sha256"

      # =========================================================
      # 22. CLEAN INTERMEDIATE APKs
      # =========================================================

      - name: Remove intermediate APKs
        shell: bash
        run: |
          set -euo pipefail

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            \( \
              -name "*-unsigned.apk" \
              -o -name "*-aligned.apk" \
              -o -name "*.signed" \
            \) \
            -delete

          echo "Intermediate APK cleanup: PASS"

      # =========================================================
      # 23. UPLOAD FINAL APK
      # =========================================================

      - name: Upload Final Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-Final-Release-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # =========================================================
      # 24. CLEANUP
      # =========================================================

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e

          if [ -n "${KEYSTORE:-}" ]; then
            rm -f "$KEYSTORE"
          fi

          unset KEYSTORE
          unset KEY_ALIAS
          unset KEYSTORE_PASSWORD
          unset KEY_PASSWORD

          echo "Signing material cleanup completed."
