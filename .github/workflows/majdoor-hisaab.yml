name: Majdoor Hisaab - Final Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

jobs:
  build-release-apk:

    name: Build Final Release APK

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version


      # ============================================================
      # 3. ANDROID SDK 36
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "Android SDK ${ANDROID_API} installed."
          echo "Build Tools ${BUILD_TOOLS} installed."


      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          AAPT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          "$AAPT" version
          "$APKSIGNER" version
          "$ZIPALIGN" -h >/dev/null

          adb version

          echo "Android SDK verification: PASS"


      # ============================================================
      # 4. FIND AUDITED SOURCE ZIP
      # ============================================================

      - name: Locate audited source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository ZIP files:"
          find . -type f -iname "*.zip" -print | sort || true

          SOURCE_ZIP="$(
            find . \
              -type f \
              -iname "*FINAL_AUDITED_READY*.zip" \
              -print -quit
          )"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERROR: FINAL_AUDITED_READY source ZIP not found."
            exit 1
          fi

          echo "Using audited source ZIP:"
          echo "$SOURCE_ZIP"

          echo "SOURCE_ZIP=$SOURCE_ZIP" >> "$GITHUB_ENV"


      # ============================================================
      # 5. VERIFY SOURCE ZIP
      # ============================================================

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f "$SOURCE_ZIP"

          unzip -t "$SOURCE_ZIP"

          echo ""
          echo "Source ZIP SHA-256:"
          sha256sum "$SOURCE_ZIP"

          echo ""
          echo "Source ZIP verification: PASS"


      # ============================================================
      # 6. EXTRACT SOURCE
      # ============================================================

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-source
          mkdir -p build-source

          unzip -q \
            "$SOURCE_ZIP" \
            -d build-source

          echo ""
          echo "Extracted project files:"
          find build-source \
            -maxdepth 6 \
            -type f \
            -print | sort


      # ============================================================
      # 7. SET ANDROID PROJECT ROOT
      # ============================================================

      - name: Set Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE/build-source"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/gradle.properties"

          test -d "$PROJECT_DIR/app"

          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f \
            "$PROJECT_DIR/app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Android project structure: PASS"


      # ============================================================
      # 8. AUDIT SOURCE — NO SOURCE MODIFICATION
      # ============================================================

      - name: Audit final source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================ ROOT BUILD ================"
          cat build.gradle.kts

          echo ""
          echo "================ APP BUILD ================"
          cat app/build.gradle.kts

          echo ""
          echo "================ SETTINGS ================"
          cat settings.gradle.kts

          echo ""
          echo "================ MANIFEST ================"
          cat app/src/main/AndroidManifest.xml

          echo ""
          echo "================ MAIN ACTIVITY CHECK ================"

          grep -n "class MainActivity" \
            app/src/main/java/com/majdoor/hisaab/MainActivity.kt

          grep -n "override fun onCreate" \
            app/src/main/java/com/majdoor/hisaab/MainActivity.kt

          echo ""
          echo "================ SDK CHECK ================"

          grep -n "compileSdk" app/build.gradle.kts
          grep -n "targetSdk" app/build.gradle.kts

          echo ""
          echo "================ JVM CHECK ================"

          grep -n "VERSION_17" app/build.gradle.kts
          grep -n "JVM_17" app/build.gradle.kts

          echo ""
          echo "Source audit: PASS"


      # ============================================================
      # 9. VERIFY NO OLD JVM SETTINGS
      # ============================================================

      - name: Verify JVM configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            'VERSION_1_8|VERSION_8|jvmTarget.*1\.8|jvmTarget.*"8"|options\.release' \
            app \
            --include='*.gradle' \
            --include='*.gradle.kts'; then

            echo ""
            echo "ERROR: Old JVM configuration detected."
            exit 1
          fi

          echo "Java/Kotlin JVM configuration: PASS"


      # ============================================================
      # 10. SETUP GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          VERSION="$(
            gradle --version |
            grep '^Gradle ' |
            awk '{print $2}'
          )"

          echo "Detected Gradle: $VERSION"

          test "$VERSION" = "$GRADLE_VERSION"

          echo "Gradle verification: PASS"


      # ============================================================
      # 11. FINAL PRE-BUILD AUDIT
      # ============================================================

      - name: Final pre-build audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================ PRE-BUILD AUDIT ================"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/majdoor/hisaab/MainActivity.kt

          echo ""
          echo "Application ID:"
          grep "applicationId" app/build.gradle.kts

          echo ""
          echo "Compile SDK:"
          grep "compileSdk" app/build.gradle.kts

          echo ""
          echo "Target SDK:"
          grep "targetSdk" app/build.gradle.kts

          echo ""
          echo "Java 17:"
          grep "VERSION_17" app/build.gradle.kts

          echo ""
          echo "Kotlin JVM 17:"
          grep "JVM_17" app/build.gradle.kts

          echo ""
          echo "PRE-BUILD AUDIT: PASS"


      # ============================================================
      # 12. BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "MAJDOOR HISAAB FINAL RELEASE APK"
          echo "=========================================="

          gradle \
            clean \
            assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Release build completed."


      # ============================================================
      # 13. FIND RELEASE APK
      # ============================================================

      - name: Find Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              -path "*release*" \
              -print -quit
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "Release APK:"
          echo "$APK"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release-Unsigned.apk"

          test -s \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release-Unsigned.apk"


      # ============================================================
      # 14. VERIFY REQUIRED SIGNING SECRETS
      # ============================================================

      - name: Verify signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MAJDOOR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MAJDOOR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAJDOOR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MAJDOOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64" \
            || { echo "Missing MAJDOOR_KEYSTORE_BASE64"; exit 1; }

          test -n "$KEYSTORE_PASSWORD" \
            || { echo "Missing MAJDOOR_KEYSTORE_PASSWORD"; exit 1; }

          test -n "$KEY_ALIAS" \
            || { echo "Missing MAJDOOR_KEY_ALIAS"; exit 1; }

          test -n "$KEY_PASSWORD" \
            || { echo "Missing MAJDOOR_KEY_PASSWORD"; exit 1; }

          echo "Required signing secrets: PASS"


      # ============================================================
      # 15. RESTORE PERMANENT KEYSTORE
      # ============================================================

      - name: Restore permanent release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MAJDOOR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MAJDOOR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAJDOOR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MAJDOOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/majdoor-hisaab-release.jks"

          printf '%s' "$KEYSTORE_B64" |
            base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          echo "Permanent release keystore: PASS"


      # ============================================================
      # 16. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          test -x "$ZIPALIGN"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release-Unsigned.apk" \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release-Aligned.apk"

          echo "Zipalign: PASS"


      # ============================================================
      # 17. SIGN RELEASE APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          test -x "$APKSIGNER"
          test -s "$KEYSTORE"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk" \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release-Aligned.apk"

          test -s \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"

          echo "APK signing: PASS"


      # ============================================================
      # 18. VERIFY FINAL APK
      # ============================================================

      - name: Verify Final Release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"

          test -s "$APK"

          if [[ "$(basename "$APK")" == *debug* ]]; then
            echo "ERROR: Debug APK detected."
            exit 1
          fi

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          AAPT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          echo ""
          echo "================ APK PACKAGE ================"

          PACKAGE_LINE="$(
            "$AAPT" dump badging "$APK" |
            grep '^package:' |
            head -1
          )"

          echo "$PACKAGE_LINE"

          echo "$PACKAGE_LINE" |
            grep -F "name='com.majdoor.hisaab'"

          echo "$PACKAGE_LINE" |
            grep -F "versionCode='5'"

          echo "$PACKAGE_LINE" |
            grep -F "versionName='2.2'"

          echo ""
          echo "================ APK SIGNATURE ================"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo ""
          echo "================ APK ALIGNMENT ================"

          "$ZIPALIGN" \
            -c \
            -P 4 \
            4 \
            "$APK"

          echo ""
          echo "APK package verification: PASS"
          echo "APK signature verification: PASS"
          echo "APK alignment verification: PASS"
          echo "FINAL APK VERIFICATION: PASS"


      # ============================================================
      # 19. SHA256
      # ============================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk" \
            > \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk.sha256"

          echo ""
          echo "Final APK SHA-256:"
          cat \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk.sha256"


      # ============================================================
      # 20. REMOVE INTERMEDIATE FILES
      # ============================================================

      - name: Remove intermediate APKs
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release-Unsigned.apk" \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release-Aligned.apk"

          test ! -f \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release-Unsigned.apk"

          test ! -f \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release-Aligned.apk"

          echo "Intermediate APK cleanup: PASS"


      # ============================================================
      # 21. UPLOAD ONLY FINAL RELEASE APK + SHA256
      # ============================================================

      - name: Upload Final Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-Final-Release-APK
          path: |
            Majdoor-Hisaab-Release.apk
            Majdoor-Hisaab-Release.apk.sha256
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 22. CLEAN SIGNING MATERIAL
      # ============================================================

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set +e

          if [ -n "${KEYSTORE:-}" ]; then
            rm -f "$KEYSTORE"
          fi

          unset KEYSTORE
          unset KEY_ALIAS
          unset KEYSTORE_PASSWORD
          unset KEY_PASSWORD

          echo "Signing material cleanup completed."
