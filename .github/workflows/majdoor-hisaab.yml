name: Majdoor Hisaab PRO - Stable Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor_Hisaab_PRO_FINAL_BLUEPRINT_AUDITED_V104.zip"

jobs:

  build-release-apk:

    name: Build and Sign Release APK

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. BASIC INFORMATION
      # ==========================================================

      - name: Show build configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "MAJDOOR HISAAB PRO RELEASE BUILD"
          echo "=========================================="

          echo "Java       : ${JAVA_VERSION}"
          echo "Gradle     : ${GRADLE_VERSION}"
          echo "Android API: ${ANDROID_API}"
          echo "Build Tools: ${BUILD_TOOLS}"
          echo "Package    : ${PACKAGE_NAME}"
          echo "Version    : ${VERSION_NAME}"
          echo "Code       : ${VERSION_CODE}"

          echo "=========================================="


      # ==========================================================
      # 3. PREPARE PROJECT
      # ==========================================================

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          ZIP="${ZIP_NAME}"

          rm -rf project extracted

          mkdir -p project extracted

          if [ -f "settings.gradle.kts" ] &&
             [ -f "app/build.gradle.kts" ]; then

            echo "ANDROID_PROJECT_FOUND_IN_REPOSITORY"

            shopt -s dotglob
            cp -a . project/

          else

            echo "USING_PROJECT_ZIP"

            test -f "$ZIP"

            unzip -q "$ZIP" -d extracted

            if [ -f "extracted/settings.gradle.kts" ] &&
               [ -f "extracted/app/build.gradle.kts" ]; then

              cp -a extracted/. project/

            else

              PROJECT_ROOT="$(
                find extracted \
                  -maxdepth 3 \
                  -type f \
                  -name settings.gradle.kts \
                  -print \
                  | head -n 1
              )"

              test -n "$PROJECT_ROOT"

              PROJECT_ROOT="$(dirname "$PROJECT_ROOT")"

              test -f "$PROJECT_ROOT/app/build.gradle.kts"

              cp -a "$PROJECT_ROOT"/. project/

            fi

          fi

          test -f project/settings.gradle.kts
          test -f project/build.gradle.kts
          test -f project/app/build.gradle.kts
          test -f project/app/src/main/AndroidManifest.xml

          echo "PROJECT_PREPARATION=PASS"


      # ==========================================================
      # 4. ONLY FAILED SOURCE FIXES
      #
      # MainActivityScreens.kt
      #
      # FIX 1:
      # app.audit.auditLog() -> app.audit.list()
      #
      # FIX 2:
      # app.audit.clearAuditLog() -> app.audit.clear()
      #
      # FIX 3:
      # ALARM_SERVICE -> Context.ALARM_SERVICE
      #
      # NO OTHER SOURCE CODE IS MODIFIED.
      # ==========================================================

      - name: Apply only failed Kotlin source fixes
        working-directory: project
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt"

          test -f "$FILE"

          cp "$FILE" "${FILE}.before-ci-fix"

          python3 - <<'PY'
          from pathlib import Path

          file = Path("app/src/main/java/com/majdoor/hisaab/MainActivityScreens.kt")

          text = file.read_text(encoding="utf-8")

          original = text

          # ------------------------------------------------------
          # FIX 1
          # AuditUseCase exposes list(), not auditLog()
          # ------------------------------------------------------

          text = text.replace(
              "app.audit.auditLog()",
              "app.audit.list()"
          )

          # ------------------------------------------------------
          # FIX 2
          # AuditUseCase exposes clear(), not clearAuditLog()
          # ------------------------------------------------------

          text = text.replace(
              "app.audit.clearAuditLog()",
              "app.audit.clear()"
          )

          # ------------------------------------------------------
          # FIX 3
          # Android Context constant
          # ------------------------------------------------------

          text = text.replace(
              "getSystemService(ALARM_SERVICE)",
              "getSystemService(Context.ALARM_SERVICE)"
          )

          file.write_text(text, encoding="utf-8")

          print("SOURCE_FIXES_APPLIED")

          print(
              "auditLog remaining:",
              text.count("app.audit.auditLog()")
          )

          print(
              "clearAuditLog remaining:",
              text.count("app.audit.clearAuditLog()")
          )

          print(
              "ALARM_SERVICE old usage remaining:",
              text.count("getSystemService(ALARM_SERVICE)")
          )

          if text == original:
              print("WARNING: No source change detected")

          PY

          # ------------------------------------------------------
          # Verify only intended old references are gone
          # ------------------------------------------------------

          if grep -Fq "app.audit.auditLog()" "$FILE"; then
            echo "ERROR: old auditLog() reference remains"
            exit 1
          fi

          if grep -Fq "app.audit.clearAuditLog()" "$FILE"; then
            echo "ERROR: old clearAuditLog() reference remains"
            exit 1
          fi

          if grep -Fq "getSystemService(ALARM_SERVICE)" "$FILE"; then
            echo "ERROR: old ALARM_SERVICE usage remains"
            exit 1
          fi

          grep -Fq "app.audit.list()" "$FILE"
          grep -Fq "app.audit.clear()" "$FILE"
          grep -Fq "Context.ALARM_SERVICE" "$FILE"

          echo "FAILED_SOURCE_FIX=PASS"


      # ==========================================================
      # 5. JAVA 17
      # ==========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================================
      # 6. ANDROID SDK
      # ==========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ==========================================================
      # 7. INSTALL ANDROID API 36
      # ==========================================================

      - name: Install Android API 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          echo "ANDROID_SDK_READY=PASS"


      # ==========================================================
      # 8. GRADLE 8.11.1
      # ==========================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-disabled: true
          cache-cleanup: never


      # ==========================================================
      # 9. VERIFY TOOLCHAIN
      # ==========================================================

      - name: Verify Java Gradle Android
        shell: bash
        run: |
          set -e

          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          gradle --version

          gradle --version | grep -Fq "Gradle 8.11.1"

          echo ""
          echo "ANDROID:"

          sdkmanager --list_installed | grep -E \
            "platforms;android-${ANDROID_API}|build-tools;${BUILD_TOOLS}"

          echo ""
          echo "TOOLCHAIN=PASS"


      # ==========================================================
      # 10. PROJECT CONFIGURATION
      # ==========================================================

      - name: Verify project configuration
        working-directory: project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          grep -Fq \
            'id("com.android.application") version "8.9.1"' \
            build.gradle.kts

          grep -Fq \
            'id("org.jetbrains.kotlin.android") version "2.1.21"' \
            build.gradle.kts

          grep -Fq \
            'compileSdk = 36' \
            app/build.gradle.kts

          grep -Fq \
            'targetSdk = 36' \
            app/build.gradle.kts

          grep -Fq \
            'applicationId = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -Fq \
            'versionCode = 77' \
            app/build.gradle.kts

          grep -Fq \
            'versionName = "1.77.0"' \
            app/build.gradle.kts

          echo "PROJECT_CONFIGURATION=PASS"


      # ==========================================================
      # 11. GRADLE CONFIGURATION TEST
      # ==========================================================

      - name: Test Gradle configuration
        working-directory: project
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            help

          echo "GRADLE_CONFIGURATION=PASS"


      # ==========================================================
      # 12. CLEAN
      # ==========================================================

      - name: Clean previous build
        working-directory: project
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --no-configuration-cache \
            clean

          echo "CLEAN=PASS"


      # ==========================================================
      # 13. BUILD RELEASE APK
      # ==========================================================

      - name: Build Release APK
        working-directory: project
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --no-parallel \
            :app:assembleRelease

          test -s \
            app/build/outputs/apk/release/app-release-unsigned.apk

          echo "RELEASE_APK_BUILD=PASS"


      # ==========================================================
      # 14. VERIFY UNSIGNED APK
      # ==========================================================

      - name: Verify unsigned APK
        working-directory: project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          echo "APK SIZE:"
          du -h "$APK"

          echo ""
          echo "APK INFORMATION:"

          aapt dump badging "$APK" | head -n 5

          aapt dump badging "$APK" \
            | grep -Fq "package: name='${PACKAGE_NAME}'"

          aapt dump badging "$APK" \
            | grep -Fq "versionCode='${VERSION_CODE}'"

          aapt dump badging "$APK" \
            | grep -Fq "versionName='${VERSION_NAME}'"

          unzip -t "$APK" >/dev/null

          echo "APK_VERIFICATION=PASS"


      # ==========================================================
      # 15. RESTORE RELEASE KEYSTORE
      # ==========================================================

      - name: Restore release keystore
        working-directory: project
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

          keytool -list \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "KEYSTORE=PASS"


      # ==========================================================
      # 16. ZIPALIGN
      # ==========================================================

      - name: Align APK
        working-directory: project
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          zipalign \
            -f \
            -p \
            4 \
            "$APK" \
            app-release-aligned.apk

          zipalign \
            -c \
            -v \
            4 \
            app-release-aligned.apk

          test -s app-release-aligned.apk

          echo "ZIPALIGN=PASS"


      # ==========================================================
      # 17. SIGN APK
      # ==========================================================

      - name: Sign Release APK
        working-directory: project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out artifacts/Majdoor-Hisaab-PRO-release.apk \
            app-release-aligned.apk

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk

          echo "APK_SIGNING=PASS"


      # ==========================================================
      # 18. VERIFY SIGNATURE
      # ==========================================================

      - name: Verify signed APK
        working-directory: project
        shell: bash
        run: |
          set -e

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          apksigner verify \
            --verbose \
            --print-certs \
            "$APK"

          zipalign \
            -c \
            -v \
            4 \
            "$APK"

          aapt dump badging "$APK" \
            | grep -Fq "package: name='${PACKAGE_NAME}'"

          aapt dump badging "$APK" \
            | grep -Fq "versionCode='${VERSION_CODE}'"

          aapt dump badging "$APK" \
            | grep -Fq "versionName='${VERSION_NAME}'"

          unzip -t "$APK" >/dev/null

          echo "SIGNED_APK_VERIFICATION=PASS"


      # ==========================================================
      # 19. SHA256
      # ==========================================================

      - name: Generate SHA256
        working-directory: project
        shell: bash
        run: |
          set -e

          sha256sum \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            | tee artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          test -s \
            artifacts/Majdoor-Hisaab-PRO-release.apk.sha256

          echo "SHA256=PASS"


      # ==========================================================
      # 20. UPLOAD FINAL APK
      # ==========================================================

      - name: Upload final signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-v1.77.0-release
          path: |
            project/artifacts/Majdoor-Hisaab-PRO-release.apk
            project/artifacts/Majdoor-Hisaab-PRO-release.apk.sha256
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 21. FINAL SUCCESS
      # ==========================================================

      - name: FINAL BUILD SUCCESS
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "      MAJDOOR HISAAB PRO"
          echo "      RELEASE BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Package : ${PACKAGE_NAME}"
          echo "Version : ${VERSION_NAME}"
          echo "Code    : ${VERSION_CODE}"
          echo ""
          echo "SIGNED APK CREATED"
          echo "=========================================="
