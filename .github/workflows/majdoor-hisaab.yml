name: Majdoor Hisaab - Release APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. FIND ZIP
      # ==================================================
      - name: Find Majdoor Hisaab ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -name "Majdoor_Hisaab_v1_1_source.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Majdoor_Hisaab_v1_1_source.zip नहीं मिली।"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f | sort
            exit 1
          fi

          echo "ZIP मिली:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==================================================
      # 3. EXTRACT ZIP
      # ==================================================
      - name: Extract Source ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/build-source"

          mkdir -p "$GITHUB_WORKSPACE/build-source"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/build-source"

          echo "ZIP extract OK"


      # ==================================================
      # 4. LOCATE ANDROID PROJECT
      # ==================================================
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build-source" \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find "$GITHUB_WORKSPACE/build-source" \
              -type f \
              -name "settings.gradle" \
              -print -quit \
              | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project नहीं मिला।"
            find "$GITHUB_WORKSPACE/build-source" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"


      # ==================================================
      # 5. VERIFY PROJECT
      # ==================================================
      - name: Verify Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -d "app" ]; then
            echo "ERROR: app directory नहीं मिला"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file नहीं मिली"
            exit 1
          fi

          echo "Android project verification OK"


      # ==================================================
      # 6. JAVA 17
      # ==================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 7. ANDROID SDK
      # ==================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"


      # ==================================================
      # 8. INSTALL SDK
      # ==================================================
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready"


      # ==================================================
      # 9. GRADLE
      # ==================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ==================================================
      # 10. PREPARE GRADLE
      # ==================================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper मिला"
            ./gradlew --version
          else
            echo "Gradle wrapper नहीं मिला"
            gradle --version
          fi


      # ==================================================
      # 11. FIX MAINACTIVITY
      # ==================================================
      - name: Fix MainActivity onCreate
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          MAIN_ACTIVITY=$(find . \
            -type f \
            -name "MainActivity.kt" \
            -print -quit)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.kt नहीं मिली"
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN_ACTIVITY"

          python3 - "$MAIN_ACTIVITY" <<'PY'
          import sys
          import re
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          pattern = r'(?m)^(\s*)(?:(public|protected)\s+)?fun\s+onCreate\s*\('

          def fix(match):
              indent = match.group(1)
              visibility = match.group(2)

              if visibility:
                  return (
                      indent +
                      visibility +
                      " override fun onCreate("
                  )

              return indent + "override fun onCreate("

          if re.search(
              r'(?m)^\s*(?:public\s+|protected\s+)?override\s+fun\s+onCreate\s*\(',
              text
          ):
              print("onCreate already has override.")
          else:
              new_text, count = re.subn(
                  pattern,
                  fix,
                  text,
                  count=1
              )

              if count == 0:
                  print("ERROR: onCreate() नहीं मिला")
                  sys.exit(1)

              path.write_text(new_text)
              print("onCreate override added.")
          PY

          echo ""
          grep -n -A4 -B2 "onCreate" "$MAIN_ACTIVITY"


      # ==================================================
      # 12. FORCE JVM 17 IN GRADLE TASKS
      # ==================================================
      - name: Force Java Kotlin JVM 17
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Creating Gradle JVM 17 enforcement..."

          cat > "$GITHUB_WORKSPACE/force-jvm17.gradle" <<'GRADLE'
          allprojects {

              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"

                  options.release.set(17)
              }

              tasks.configureEach { task ->

                  if (task.class.name.contains("KotlinCompile")) {

                      try {
                          task.kotlinOptions.jvmTarget = "17"
                      } catch (Exception ignored) {
                      }

                      try {
                          task.compilerOptions.jvmTarget.set(
                              org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                          )
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
          GRADLE

          echo ""
          echo "Gradle JVM enforcement file created:"
          cat "$GITHUB_WORKSPACE/force-jvm17.gradle"


      # ==================================================
      # 13. FINAL JVM CHECK
      # ==================================================
      - name: Check Java Version
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME=$JAVA_HOME"

          java -version

          echo ""
          javac -version


      # ==================================================
      # 14. BUILD RELEASE APK
      # ==================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "RELEASE APK BUILD START"
          echo "======================================"

          if [ -f "./gradlew" ]; then

            ./gradlew \
              clean \
              assembleRelease \
              --no-daemon \
              --stacktrace \
              -I "$GITHUB_WORKSPACE/force-jvm17.gradle"

          else

            gradle \
              clean \
              assembleRelease \
              --no-daemon \
              --stacktrace \
              -I "$GITHUB_WORKSPACE/force-jvm17.gradle"

          fi

          echo "======================================"
          echo "RELEASE APK BUILD FINISHED"
          echo "======================================"


      # ==================================================
      # 15. FIND RELEASE APK
      # ==================================================
      - name: Find Release APK
        shell: bash
        run: |
          set -e

          echo "Release APK खोज रहे हैं..."

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | grep -Ei "release" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: Release APK नहीं मिली"

            echo ""
            echo "Available output:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          echo ""
          echo "Release APK:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/Majdoor-Hisaab-Release.apk"


      # ==================================================
      # 16. UPLOAD FINAL APK
      # ==================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-Release-APK
          path: Majdoor-Hisaab-Release.apk
          if-no-files-found: error
          retention-days: 30
