name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V82-KOTLIN-COMPILE-FIXED.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-ALIGNED-UNSIGNED.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build Final Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # 4. LOCATE ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATING ANDROID SDK"
          echo "=============================================="

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"

          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"

          else
            SDK_ROOT=$(find /usr/local/lib/android \
              -maxdepth 3 \
              -type d \
              -name "sdk" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name "sdkmanager" \
              -print \
              -quit 2>/dev/null || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "ANDROID SDK:"
          echo "$SDK_ROOT"

          echo ""
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 5. INSTALL ANDROID SDK 36
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INSTALL ANDROID SDK 36"
          echo "=============================================="

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "ANDROID SDK INSTALLATION PASSED."


      # ============================================================
      # 6. VERIFY ANDROID SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY ANDROID SDK"
          echo "=============================================="

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"

          echo ""
          echo "ANDROID SDK VERIFICATION PASSED."


      # ============================================================
      # 7. FIND PROJECT ZIP
      # ============================================================

      - name: Find Majdoor Hisaab Project ZIP
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FIND MAJDOOR HISAAB PROJECT ZIP"
          echo "=============================================="

          FOUND_ZIP=""

          if [ -f "$ZIP_NAME" ]; then
            FOUND_ZIP="$ZIP_NAME"
          fi

          if [ -z "$FOUND_ZIP" ]; then
            FOUND_ZIP=$(
              find . \
                -type f \
                -name "Majdoor_Hisaab_PRO_READY_TO_BUILD_FIXED_*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | tail -1
            )
          fi

          if [ -z "$FOUND_ZIP" ]; then
            FOUND_ZIP=$(
              find . \
                -type f \
                -iname "*Majdoor*Hisaab*.zip" \
                -not -path "./.git/*" \
                -print \
                | sort \
                | tail -1
            )
          fi

          if [ -z "$FOUND_ZIP" ] || [ ! -f "$FOUND_ZIP" ]; then
            echo ""
            echo "ERROR: Majdoor Hisaab project ZIP NOT FOUND."

            echo ""
            echo "AVAILABLE ZIP FILES:"

            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print \
              | sort

            exit 1
          fi

          FOUND_ZIP="${FOUND_ZIP#./}"

          echo ""
          echo "PROJECT ZIP FOUND:"
          echo "$FOUND_ZIP"

          ls -lh "$FOUND_ZIP"

          echo "ZIP_NAME=$FOUND_ZIP" >> "$GITHUB_ENV"

          echo ""
          echo "ZIP DETECTION PASSED."


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================

      - name: Extract Majdoor Hisaab Project
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "EXTRACT PROJECT"
          echo "=============================================="

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_NAME" -d build_source

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            -print \
            -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: Gradle settings file not found."

            find build_source \
              -maxdepth 8 \
              -type f \
              -print \
              | sort \
              | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 9. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY ANDROID PROJECT"
          echo "=============================================="

          pwd

          test -d "app"

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo ""
          echo "ANDROID PROJECT VERIFIED."


      # ============================================================
      # 10. VERIFY GRADLE
      # ============================================================

      - name: Verify Gradle Environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GRADLE ENVIRONMENT"
          echo "=============================================="

          java -version

          echo ""
          gradle --version

          DETECTED=$(
            gradle --version |
            awk '/^Gradle / {print $2; exit}'
          )

          echo ""
          echo "EXPECTED GRADLE:"
          echo "$GRADLE_VERSION"

          echo ""
          echo "DETECTED GRADLE:"
          echo "$DETECTED"

          if [ "$DETECTED" != "$GRADLE_VERSION" ]; then
            echo ""
            echo "ERROR: Gradle version mismatch."
            exit 1
          fi

          echo ""
          echo "GRADLE ENVIRONMENT PASSED."


      # ============================================================
      # 11. LOCATE MAIN KOTLIN SOURCE
      # ============================================================

      - name: Locate Main Kotlin Source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE MAIN KOTLIN SOURCE"
          echo "=============================================="

          MAIN_FILES=$(find app/src/main \
            -type f \
            -name "MainActivity.kt" \
            -print)

          echo "$MAIN_FILES"

          COUNT=$(echo "$MAIN_FILES" | sed '/^$/d' | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: MainActivity.kt not found."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo ""
            echo "ERROR: Multiple MainActivity.kt files found."
            exit 1
          fi

          MAIN_FILE=$(echo "$MAIN_FILES" | head -1)

          echo "MAIN_FILE=$MAIN_FILE" >> "$GITHUB_ENV"

          echo ""
          echo "MAIN FILE:"
          echo "$MAIN_FILE"


      # ============================================================
      # 12. KOTLIN SOURCE REPAIR
      # ============================================================

      - name: Repair Kotlin Source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "REPAIR KOTLIN SOURCE"
          echo "=============================================="

          test -f "$MAIN_FILE"

          python3 - "$MAIN_FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          print("SOURCE:", path)
          print("SOURCE SIZE:", len(source), "bytes")


          # ==========================================================
          # Remove BOM
          # ==========================================================

          if source.startswith("\ufeff"):
              source = source[1:]
              print("FIX APPLIED: UTF-8 BOM removed")


          # ==========================================================
          # setContent import
          # ==========================================================

          if "import androidx.activity.compose.setContent" not in source:

              package_match = re.search(
                  r"^package[^\n]+\n",
                  source,
                  re.MULTILINE
              )

              if package_match:

                  source = (
                      source[:package_match.end()]
                      + "\n"
                      + "import androidx.activity.compose.setContent\n"
                      + source[package_match.end():]
                  )

                  print("FIX APPLIED: setContent import")


          # ==========================================================
          # Store Context
          # ==========================================================

          old_store = "private class Store(context:Context){"
          new_store = "private class Store(private val context:Context){"

          if old_store in source:

              source = source.replace(
                  old_store,
                  new_store,
                  1
              )

              print("FIX APPLIED: Store context")


          # ==========================================================
          # JSONArray.mapList
          # ==========================================================

          map_pattern = re.compile(
              r"private fun <T> JSONArray\.mapList"
              r"\(mapper:\(JSONObject\)->T\):List<T>"
              r"=[^\n]+"
          )

          map_match = map_pattern.search(source)

          if map_match:

              replacement = """private fun <T> JSONArray.mapList(
              mapper: (JSONObject) -> T
          ): List<T> = (0 until length()).map {
              mapper(getJSONObject(it))
          }"""

              source = (
                  source[:map_match.start()]
                  + replacement
                  + source[map_match.end():]
              )

              print("FIX APPLIED: JSONArray.mapList")


          # ==========================================================
          # Replace persistPhoto safely
          # ==========================================================

          def replace_function(text, function_name, replacement):

              pattern = re.compile(
                  r"(?m)^[ \t]*(?:@Composable[ \t]*\n[ \t]*)?"
                  r"(?:private[ \t]+|public[ \t]+|internal[ \t]+)?"
                  r"fun[ \t]+"
                  + re.escape(function_name)
                  + r"[ \t]*\("
              )

              match = pattern.search(text)

              if not match:
                  return text, False

              open_brace = text.find("{", match.end())

              if open_brace == -1:
                  raise SystemExit(
                      "ERROR: opening brace not found for "
                      + function_name
                  )

              depth = 0
              in_string = False
              in_char = False
              escape = False
              line_comment = False
              block_comment = False

              i = open_brace

              while i < len(text):

                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:

                      if c == "\n":
                          line_comment = False

                  elif block_comment:

                      if c == "*" and n == "/":
                          block_comment = False
                          i += 1

                  elif in_string:

                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == '"':
                          in_string = False

                  elif in_char:

                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == "'":
                          in_char = False

                  else:

                      if c == "/" and n == "/":
                          line_comment = True
                          i += 1

                      elif c == "/" and n == "*":
                          block_comment = True
                          i += 1

                      elif c == '"':
                          in_string = True

                      elif c == "'":
                          in_char = True

                      elif c == "{":
                          depth += 1

                      elif c == "}":

                          depth -= 1

                          if depth == 0:

                              return (
                                  text[:match.start()]
                                  + replacement
                                  + text[i + 1:],
                                  True
                              )

                  i += 1

              raise SystemExit(
                  "ERROR: unbalanced braces in "
                  + function_name
              )


          persist_photo = """    fun persistPhoto(
              uriString: String,
              owner: String
          ): String {
              if (uriString.isBlank() || uriString.startsWith("file://")) {
                  return uriString
              }

              return try {
                  val uri: Uri = Uri.parse(uriString)

                  val dir: File = File(
                      context.filesDir,
                      "photos"
                  ).apply {
                      mkdirs()
                  }

                  val file: File = File(
                      dir,
                      "${owner}_${UUID.randomUUID()}.jpg"
                  )

                  val input: java.io.InputStream =
                      context.contentResolver
                          .openInputStream(uri)
                      ?: return ""

                  input.use { inputStream ->
                      FileOutputStream(file).use { outputStream ->
                          inputStream.copyTo(outputStream)
                      }
                  }

                  file.absolutePath

              } catch (_: Exception) {
                  ""
              }
          }
          """

          if "fun persistPhoto" in source:

              source, found = replace_function(
                  source,
                  "persistPhoto",
                  persist_photo
              )

              if found:
                  print("FIX APPLIED: persistPhoto")


          # ==========================================================
          # PaymentDialog
          # ==========================================================

          old_payment = 'PaymentDialog(store,id,null,""){payment=false}'
          new_payment = 'PaymentDialog(store,id,null,null){payment=false}'

          if old_payment in source:

              source = source.replace(
                  old_payment,
                  new_payment,
                  1
              )

              print("FIX APPLIED: PaymentDialog")


          # ==========================================================
          # BottomBar Icon
          # ==========================================================

          old_icon = (
              "Icon(ic,null,"
              "tint=if(current==k)Green else Color.Gray,"
              "Modifier.size(22.dp))"
          )

          new_icon = (
              "Icon("
              "imageVector=ic,"
              "contentDescription=null,"
              "modifier=Modifier.size(22.dp),"
              "tint=if(current==k)Green else Color.Gray"
              ")"
          )

          if old_icon in source:

              source = source.replace(
                  old_icon,
                  new_icon,
                  1
              )

              print("FIX APPLIED: BottomBar Icon")


          # ==========================================================
          # TopBar Image
          # ==========================================================

          old_top = (
              "Image("
              "painterResource(R.drawable.majdoor_logo_small),"
              "null,"
              "Modifier.size(42.dp).clip(RoundedCornerShape(10.dp)),"
              "contentScale=ContentScale.Crop"
              ")"
          )

          new_top = (
              "Image("
              "painter=painterResource(R.drawable.majdoor_logo_small),"
              "contentDescription=null,"
              "modifier=Modifier.size(42.dp).clip(RoundedCornerShape(10.dp)),"
              "contentScale=ContentScale.Crop"
              ")"
          )

          if old_top in source:

              source = source.replace(
                  old_top,
                  new_top,
                  1
              )

              print("FIX APPLIED: TopBar Image")


          # ==========================================================
          # Dashboard Image
          # ==========================================================

          old_dashboard = (
              "Image("
              "painterResource(R.drawable.majdoor_logo),"
              "null,"
              "Modifier.fillMaxWidth().height(135.dp).clip(RoundedCornerShape(24.dp)),"
              "ContentScale.Fit"
              ")"
          )

          new_dashboard = (
              "Image("
              "painter=painterResource(R.drawable.majdoor_logo),"
              "contentDescription=null,"
              "modifier=Modifier.fillMaxWidth().height(135.dp).clip(RoundedCornerShape(24.dp)),"
              "contentScale=ContentScale.Fit"
              ")"
          )

          if old_dashboard in source:

              source = source.replace(
                  old_dashboard,
                  new_dashboard,
                  1
              )

              print("FIX APPLIED: Dashboard Image")


          path.write_text(
              source,
              encoding="utf-8"
          )

          print("")
          print("NORMAL KOTLIN REPAIRS WRITTEN")
          PY


      # ============================================================
      # 13. FIX MISSING CLOSING BRACE BEFORE PRIVATE FUNCTIONS
      #
      # IMPORTANT:
      # DO NOT DELETE TRAILING BRACES.
      #
      # The previous version deleted a required brace and caused:
      #
      # Modifier 'private' is not applicable to 'local function'
      #
      # This step inserts missing } before private top-level
      # functions when they are accidentally inside another block.
      # ============================================================

      - name: Fix Kotlin Function Scope
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FIX KOTLIN FUNCTION SCOPE"
          echo "=============================================="

          python3 - "$MAIN_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()

          def scan_balance(text_lines):

              balance = 0

              in_string = False
              in_char = False
              escape = False
              block_comment = False

              balances = []

              for line_no, line in enumerate(text_lines, 1):

                  i = 0
                  line_comment = False

                  while i < len(line):

                      c = line[i]
                      n = line[i + 1] if i + 1 < len(line) else ""

                      if line_comment:
                          break

                      if block_comment:

                          if c == "*" and n == "/":
                              block_comment = False
                              i += 2
                              continue

                          i += 1
                          continue

                      if in_string:

                          if escape:
                              escape = False

                          elif c == "\\":
                              escape = True

                          elif c == '"':
                              in_string = False

                          i += 1
                          continue

                      if in_char:

                          if escape:
                              escape = False

                          elif c == "\\":
                              escape = True

                          elif c == "'":
                              in_char = False

                          i += 1
                          continue

                      if c == "/" and n == "/":
                          line_comment = True
                          break

                      if c == "/" and n == "*":
                          block_comment = True
                          i += 2
                          continue

                      if c == '"':
                          in_string = True
                          i += 1
                          continue

                      if c == "'":
                          in_char = True
                          i += 1
                          continue

                      if c == "{":
                          balance += 1

                      elif c == "}":
                          balance -= 1

                      i += 1

                  balances.append(balance)

              return balances


          # ----------------------------------------------------------
          # Find private function declarations which are nested.
          #
          # A Kotlin `private fun` cannot be a local function.
          # Therefore, if balance > 0 immediately before one,
          # a closing brace is missing.
          # ----------------------------------------------------------

          changed = False
          pass_number = 0

          while pass_number < 20:

              pass_number += 1
              balances = scan_balance(lines)

              insertion_points = []

              for idx, line in enumerate(lines):

                  stripped = line.strip()

                  if (
                      stripped.startswith("private fun ")
                      or stripped.startswith("private suspend fun ")
                      or stripped.startswith("private inline fun ")
                      or stripped.startswith("private operator fun ")
                  ):

                      balance_before = (
                          balances[idx - 1]
                          if idx > 0
                          else 0
                      )

                      if balance_before > 0:

                          insertion_points.append(
                              (idx, balance_before)
                          )


              if not insertion_points:
                  break


              # Insert from bottom to top so indexes stay valid.

              for idx, balance_before in reversed(
                  insertion_points
              ):

                  print(
                      "INSERTING MISSING '}' BEFORE:",
                      "line",
                      idx + 1,
                      "|",
                      lines[idx].strip(),
                      "| balance before =",
                      balance_before
                  )

                  # Usually exactly one function/composable block
                  # is missing. Insert one at a time.
                  lines.insert(idx, "}")

                  changed = True


          if changed:

              path.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8"
              )

              print("")
              print(
                  "KOTLIN FUNCTION SCOPE REPAIR APPLIED."
              )

          else:

              print("")
              print(
                  "NO NESTED PRIVATE FUNCTION DETECTED."
              )


          # ----------------------------------------------------------
          # Final structural diagnostics.
          # ----------------------------------------------------------

          balances = scan_balance(lines)
          final_balance = balances[-1] if balances else 0

          print("")
          print(
              "FINAL KOTLIN BRACE BALANCE:",
              final_balance
          )

          if final_balance != 0:

              print("")
              print(
                  "ERROR: Kotlin braces are still unbalanced."
              )

              print("")
              print("LAST 40 SOURCE LINES:")

              start = max(0, len(lines) - 40)

              for number in range(start, len(lines)):
                  print(
                      f"{number + 1}: {lines[number]}"
                  )

              sys.exit(1)


          print("")
          print(
              "KOTLIN STRUCTURE BALANCED."
          )
          PY


      # ============================================================
      # 14. VERIFY SMALL ACTION AND PRIVATE FUNCTIONS
      # ============================================================

      - name: Verify Kotlin Functions
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY KOTLIN FUNCTIONS"
          echo "=============================================="

          echo ""
          echo "SMALL ACTION REFERENCES:"
          grep -n "SmallAction" "$MAIN_FILE" | head -20 || true

          echo ""
          echo "PRIVATE FUNCTIONS:"
          grep -nE \
            '^[[:space:]]*private([[:space:]]+suspend)?[[:space:]]+fun[[:space:]]+' \
            "$MAIN_FILE" \
            | head -50 || true

          echo ""
          echo "LAST 50 LINES:"
          tail -50 "$MAIN_FILE"

          echo ""
          echo "KOTLIN FUNCTION VERIFICATION PASSED."


      # ============================================================
      # 15. FINAL RELEASE IDENTITY
      # ============================================================

      - name: Set Final Release Identity
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "SET FINAL RELEASE IDENTITY"
          echo "=============================================="

          if [ -f "app/build.gradle.kts" ]; then

            GRADLE_FILE="app/build.gradle.kts"

            sed -i \
              's/applicationId = "[^"]*"/applicationId = "com.majdoor.hisaab"/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionCode = [0-9][0-9]*/versionCode = 77/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionName = "[^"]*"/versionName = "1.77.0"/' \
              "$GRADLE_FILE"

          elif [ -f "app/build.gradle" ]; then

            GRADLE_FILE="app/build.gradle"

            sed -i \
              's/applicationId[[:space:]]*["'"'"'][^"'"'"']*["'"'"']/applicationId "com.majdoor.hisaab"/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionCode[[:space:]]*[0-9][0-9]*/versionCode 77/' \
              "$GRADLE_FILE"

            sed -i \
              's/versionName[[:space:]]*["'"'"'][^"'"'"']*["'"'"']/versionName "1.77.0"/' \
              "$GRADLE_FILE"

          else

            echo "ERROR: app Gradle file not found."
            exit 1

          fi

          echo ""
          echo "FINAL APPLICATION ID:"
          grep "applicationId" "$GRADLE_FILE"

          echo ""
          echo "FINAL VERSION CODE:"
          grep "versionCode" "$GRADLE_FILE"

          echo ""
          echo "FINAL VERSION NAME:"
          grep "versionName" "$GRADLE_FILE"


      # ============================================================
      # 16. COMPILE RELEASE KOTLIN
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN"
          echo "=============================================="

          test -f "$MAIN_FILE"

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --rerun-tasks \
            :app:compileReleaseKotlin

          echo ""
          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN PASSED"
          echo "=============================================="


      # ============================================================
      # 17. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ASSEMBLE RELEASE APK"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --rerun-tasks \
            :app:assembleRelease

          echo ""
          echo "=============================================="
          echo "ASSEMBLE RELEASE APK PASSED"
          echo "=============================================="


      # ============================================================
      # 18. LOCATE RELEASE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "LOCATE RELEASE APK"
          echo "=============================================="

          APK=$(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*release*.apk" \
              -print \
              | sort \
              | head -1
          )

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then

            echo ""
            echo "ERROR: Release APK not found."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -print \
              2>/dev/null \
              || true

            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "RELEASE APK:"
          ls -lh "$APK"


      # ============================================================
      # 19. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK Package
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY APK PACKAGE"
          echo "=============================================="

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging \
              "$APK_PATH"
          )

          echo "$BADGING" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          if ! echo "$BADGING" | grep -q \
            "name='$PACKAGE_NAME'"; then

            echo "ERROR: Package name mismatch."
            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionCode='$VERSION_CODE'"; then

            echo "ERROR: Version code mismatch."
            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionName='$VERSION_NAME'"; then

            echo "ERROR: Version name mismatch."
            exit 1
          fi

          echo ""
          echo "PACKAGE AND VERSION VERIFIED."


      # ============================================================
      # 20. PREPARE RELEASE SIGNING
      # ============================================================

      - name: Prepare Release Signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -e

          echo "=============================================="
          echo "PREPARE RELEASE SIGNING"
          echo "=============================================="

          KEYSTORE_FILE="$RUNNER_TEMP/majdoor-hisaab-release.jks"

          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            echo "PERMANENT SIGNING SECRETS FOUND."

            printf '%s' "$KEYSTORE_BASE64" \
              | base64 --decode \
              > "$KEYSTORE_FILE"

            test -s "$KEYSTORE_FILE"

            keytool \
              -list \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              >/dev/null

            echo "RELEASE_SIGNING_MODE=PERMANENT" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          else

            echo "Permanent signing secrets not configured."
            echo "Creating temporary JKS."

            TEMP_PASSWORD="$(openssl rand -hex 32)"
            TEMP_ALIAS="majdoor-hisaab-v82"

            rm -f "$KEYSTORE_FILE"

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -storepass "$TEMP_PASSWORD" \
              -keypass "$TEMP_PASSWORD" \
              -alias "$TEMP_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=Majdoor Hisaab PRO, OU=Android, O=Majdoor Hisaab, L=India, ST=Uttar Pradesh, C=IN"

            test -s "$KEYSTORE_FILE"

            keytool \
              -list \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -storepass "$TEMP_PASSWORD" \
              -alias "$TEMP_ALIAS" \
              >/dev/null

            echo "RELEASE_SIGNING_MODE=TEMPORARY" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$TEMP_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$TEMP_PASSWORD" >> "$GITHUB_ENV"

          fi

          echo ""
          echo "RELEASE SIGNING PREPARED."


      # ============================================================
      # 21. VERIFY SIGNING
      # ============================================================

      - name: Verify Signing Environment
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY SIGNING ENVIRONMENT"
          echo "=============================================="

          test -n "${RELEASE_KEYSTORE:-}"
          test -f "$RELEASE_KEYSTORE"

          test -n "${RELEASE_KEYSTORE_PASSWORD:-}"
          test -n "${RELEASE_KEY_ALIAS:-}"
          test -n "${RELEASE_KEY_PASSWORD:-}"

          keytool \
            -list \
            -keystore "$RELEASE_KEYSTORE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            >/dev/null

          echo ""
          echo "SIGNING ENVIRONMENT VERIFIED."
          echo "SIGNING MODE: ${RELEASE_SIGNING_MODE}"


      # ============================================================
      # 22. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ZIPALIGN RELEASE APK"
          echo "=============================================="

          INPUT_APK="$APK_PATH"
          ALIGNED_APK="$RUNNER_TEMP/$APK_UNSIGNED_NAME"

          rm -f "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          test -f "$ALIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -c \
            -v \
            4 \
            "$ALIGNED_APK"

          echo "ALIGNED_APK=$ALIGNED_APK" >> "$GITHUB_ENV"

          echo ""
          echo "ZIPALIGN PASSED."


      # ============================================================
      # 23. SIGN APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "SIGN RELEASE APK"
          echo "=============================================="

          SIGNED_APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          rm -f "$SIGNED_APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RELEASE_KEYSTORE" \
            --ks-type JKS \
            --ks-pass "pass:$RELEASE_KEYSTORE_PASSWORD" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --key-pass "pass:$RELEASE_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          test -f "$SIGNED_APK"

          echo ""
          echo "SIGNED APK CREATED:"
          ls -lh "$SIGNED_APK"


      # ============================================================
      # 24. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "VERIFY APK SIGNATURE"
          echo "=============================================="

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          test -f "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE VERIFIED."


      # ============================================================
      # 25. FINAL APK VALIDATION
      # ============================================================

      - name: Final APK Validation
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "FINAL APK VALIDATION"
          echo "=============================================="

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")

          echo ""
          echo "APK SIZE:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK size unexpectedly small."
            exit 1
          fi

          BADGING=$(
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
              dump badging \
              "$APK"
          )

          echo ""
          echo "APK INFORMATION:"

          echo "$BADGING" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          if ! echo "$BADGING" | grep -q \
            "name='$PACKAGE_NAME'"; then
            echo "ERROR: Final APK package mismatch."
            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionCode='$VERSION_CODE'"; then
            echo "ERROR: Final APK version code mismatch."
            exit 1
          fi

          if ! echo "$BADGING" | grep -q \
            "versionName='$VERSION_NAME'"; then
            echo "ERROR: Final APK version name mismatch."
            exit 1
          fi

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "=============================================="
          echo "FINAL APK VALIDATION PASSED"
          echo "=============================================="


      # ============================================================
      # 26. UPLOAD FINAL SIGNED APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: ${{ env.APK_SIGNED_NAME }}
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 27. UPLOAD BUILD REPORTS
      # ============================================================

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/**
          if-no-files-found: warn
          retention-days: 14
