
name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_PDF_PROFESSIONAL_LEDGER_SHARE_TABLE_FIXED_20261010.zip"

  APK_UNSIGNED_NAME: "unsigned-release.apk"
  APK_ALIGNED_NAME: "aligned-release.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

  EXPECTED_PACKAGE: "com.majdoor.hisaabpro"

jobs:
  build-release:
    name: Main Final Signed Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          test -d "${ANDROID_SDK_ROOT}/platforms/android-${ANDROID_API}"
          test -x "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"
          test -x "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/zipalign"

          java -version
          echo "Android SDK verification passed."

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Expected source ZIP: ${ZIP_NAME}"

          if [ ! -f "${ZIP_NAME}" ]; then
            echo "ERROR: Source ZIP not found: ${ZIP_NAME}"
            echo "ZIP files in repository:"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi

          unzip -t "${ZIP_NAME}"
          sha256sum "${ZIP_NAME}"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-source
          mkdir -p build-source
          unzip -q "${ZIP_NAME}" -d build-source

          echo "Extracted source ZIP."

      - name: Locate Android Gradle project
        id: find_android
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(
            find build-source \
              -type f \
              -name gradlew \
              -not -path '*/node_modules/*' \
              -not -path '*/.gradle/*' \
              | sort | head -1
          )"

          if [ -z "${GRADLEW}" ]; then
            echo "ERROR: gradlew not found in source ZIP."
            exit 1
          fi

          ANDROID_DIR="$(dirname "${GRADLEW}")"
          chmod +x "${GRADLEW}"

          echo "android_dir=${ANDROID_DIR}" >> "${GITHUB_OUTPUT}"
          echo "Android project: ${ANDROID_DIR}"

      - name: Enforce Gradle 8.11.1
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="gradle/wrapper/gradle-wrapper.properties"
          test -f "${FILE}"

          python3 - "${FILE}" "${GRADLE_VERSION}" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          version = sys.argv[2]
          text = path.read_text()

          url = (
              "distributionUrl=https\\://services.gradle.org/"
              f"distributions/gradle-{version}-bin.zip"
          )

          if re.search(r"^distributionUrl=.*$", text, re.M):
              text = re.sub(
                  r"^distributionUrl=.*$",
                  url,
                  text,
                  flags=re.M
              )
          else:
              text += ("\n" if not text.endswith("\n") else "") + url + "\n"

          path.write_text(text)
          PY

          cat "${FILE}"

      - name: Verify Gradle version
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          ./gradlew --version

          VERSION="$(
            ./gradlew --version |
            sed -n 's/^Gradle \([0-9.]*\).*/\1/p' |
            head -1
          )"

          if [ "${VERSION}" != "${GRADLE_VERSION}" ]; then
            echo "ERROR: Expected Gradle ${GRADLE_VERSION}, found ${VERSION}"
            exit 1
          fi

      - name: Gradle clean
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean --no-daemon --stacktrace

      - name: Compile Release Kotlin
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew compileReleaseKotlin \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Assemble Release APK
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Locate generated Release APK
        id: locate_apk
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find . \
              -type f \
              -path '*/build/outputs/apk/release/*.apk' \
              -not -name '*-androidTest*' |
              sort
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one release APK; found ${#APKS[@]}."
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          echo "apk=${APKS[0]}" >> "${GITHUB_OUTPUT}"
          echo "APK selected: ${APKS[0]}"

      - name: Prepare final APK directory
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          rm -rf final
          mkdir -p final

          cp "${{ steps.locate_apk.outputs.apk }}" \
             "final/${APK_UNSIGNED_NAME}"

          test -s "final/${APK_UNSIGNED_NAME}"

      - name: Verify APK package name
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          AAPT="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt"

          PACKAGE="$(
            "${AAPT}" dump badging "final/${APK_UNSIGNED_NAME}" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )"

          echo "Expected package: ${EXPECTED_PACKAGE}"
          echo "Actual package:   ${PACKAGE}"

          test "${PACKAGE}" = "${EXPECTED_PACKAGE}"

      - name: Zipalign Release APK
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/zipalign"

          "${ZIPALIGN}" -f -p 4 \
            "final/${APK_UNSIGNED_NAME}" \
            "final/${APK_ALIGNED_NAME}"

          "${ZIPALIGN}" -c -P 16 -v 4 \
            "final/${APK_ALIGNED_NAME}"

      # IMPORTANT:
      # Use the existing permanent RELEASE_* GitHub repository secrets.
      # Do not generate a temporary signing key.
      - name: Prepare permanent signing key
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          : "${KEYSTORE_B64:?Missing RELEASE_KEYSTORE_BASE64 secret}"
          : "${KEYSTORE_PASSWORD:?Missing RELEASE_KEYSTORE_PASSWORD secret}"
          : "${KEY_ALIAS:?Missing RELEASE_KEY_ALIAS secret}"
          : "${KEY_PASSWORD:?Missing RELEASE_KEY_PASSWORD secret}"

          mkdir -p signing
          KEYSTORE="signing/majdoor-hisaab-release.jks"

          printf '%s' "${KEYSTORE_B64}" | base64 --decode > "${KEYSTORE}"
          test -s "${KEYSTORE}"

          # Validate that the keystore opens and the configured alias exists.
          keytool -list \
            -keystore "${KEYSTORE}" \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" >/dev/null

          echo "Permanent keystore and alias verified."

          # Print certificate fingerprints only; never print passwords.
          keytool -list -v \
            -keystore "${KEYSTORE}" \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" |
            grep -E '^(Alias name:|SHA1:|SHA256:)' || true

      - name: Sign Release APK
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"
          KEYSTORE="signing/majdoor-hisaab-release.jks"

          "${APKSIGNER}" sign \
            --ks "${KEYSTORE}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "final/${APK_SIGNED_NAME}" \
            "final/${APK_ALIGNED_NAME}"

          test -s "final/${APK_SIGNED_NAME}"
          echo "Release APK signed using the permanent key."

      - name: Verify APK signature and print SHA-1
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner"
          APK="final/${APK_SIGNED_NAME}"

          "${APKSIGNER}" verify --verbose --print-certs "${APK}"

          echo ""
          echo "IMPORTANT: Signer certificate SHA-1 above is the value"
          echo "to compare with the Android OAuth client's SHA-1."
          echo "APK file SHA-256 is NOT the certificate SHA-1."

      - name: Final APK validation
        working-directory: ${{ steps.find_android.outputs.android_dir }}
        shell: bash
        run: |
          set -euo pipefail

          AAPT="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/aapt"
          APK="final/${APK_SIGNED_NAME}"

          test -s "${APK}"

          PACKAGE="$(
            "${AAPT}" dump badging "${APK}" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p" |
            head -1
          )"

          if [ "${PACKAGE}" != "${EXPECTED_PACKAGE}" ]; then
            echo "ERROR: Final package name mismatch: ${PACKAGE}"
            exit 1
          fi

          "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/zipalign" \
            -c -P 16 -v 4 "${APK}"

          sha256sum "${APK}"
          ls -lh "${APK}"

      - name: Upload Main Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: ${{ steps.find_android.outputs.android_dir }}/final/${{ env.APK_SIGNED_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Final success check
        shell: bash
        run: |
          set -euo pipefail
          echo "Majdoor Hisaab PRO V82 release build completed."
          echo "Package: ${EXPECTED_PACKAGE}"
          echo "Source ZIP: ${ZIP_NAME}"
          echo "Permanent signing key was required."
