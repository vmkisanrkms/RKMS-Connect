name: Build Majdoor Hisaab PRO V27 v2.10 FINAL APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-v27-release
  cancel-in-progress: false

jobs:
  build:
    name: V27 v2.10 FINAL Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find exact V27 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_NAME="Majdoor_Hisaab_PRO_V27_FULL_AUDITED_V5.zip"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERROR: Required ZIP not found: $ZIP_NAME"
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          ls -lh "$ZIP_NAME"

      - name: Verify ZIP structure
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="Majdoor_Hisaab_PRO_V27_FULL_AUDITED_V5.zip"

          required_files=(
            "src/settings.gradle.kts"
            "src/build.gradle.kts"
            "src/gradle.properties"
            "src/gradlew"
            "src/app/build.gradle.kts"
            "src/app/src/main/AndroidManifest.xml"
            "src/app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
          )

          for f in "${required_files[@]}"; do
            unzip -l "$ZIP_NAME" | grep -Fq "$f" || {
              echo "ERROR: Missing ZIP entry: $f"
              exit 1
            }
          done

          echo "ZIP STRUCTURE PASS"

      - name: Extract V27 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/v27-source"
          mkdir -p "$GITHUB_WORKSPACE/v27-source"

          unzip -q \
            "Majdoor_Hisaab_PRO_V27_FULL_AUDITED_V5.zip" \
            -d "$GITHUB_WORKSPACE/v27-source"

          test -f "$GITHUB_WORKSPACE/v27-source/src/gradlew"

      - name: Set project root
        shell: bash
        run: |
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/v27-source/src" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          required_files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "gradlew"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
            "gradle/wrapper/gradle-wrapper.properties"
            "gradle/wrapper/gradle-wrapper.jar"
          )

          for f in "${required_files[@]}"; do
            test -f "$f" || {
              echo "ERROR: Missing $f"
              exit 1
            }
          done

          chmod +x gradlew

      - name: Verify settings
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Eq \
            'rootProject\.name[[:space:]]*=[[:space:]]*"MajdoorHisaab"' \
            settings.gradle.kts

          grep -Fq \
            'include(":app")' \
            settings.gradle.kts

          echo "SETTINGS PASS"

      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq '8.9.1' build.gradle.kts
          grep -Fq '2.1.20' build.gradle.kts
          grep -Fq '8.11.1' gradle/wrapper/gradle-wrapper.properties

          echo "GRADLE CONFIG PASS"

      - name: Verify app configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq \
            'namespace = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -Fq \
            'applicationId = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -Fq \
            'compileSdk = 35' \
            app/build.gradle.kts

          grep -Fq \
            'minSdk = 26' \
            app/build.gradle.kts

          grep -Fq \
            'targetSdk = 35' \
            app/build.gradle.kts

          grep -Fq \
            'versionCode = 30' \
            app/build.gradle.kts

          grep -Fq \
            'versionName = "2.10"' \
            app/build.gradle.kts

          grep -Fq \
            'JavaVersion.VERSION_17' \
            app/build.gradle.kts

          grep -Fq \
            'jvmTarget = "17"' \
            app/build.gradle.kts

          echo "APP CONFIG PASS"

      - name: Verify AndroidManifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          MANIFEST="app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          grep -Fq \
            'android:exported="true"' \
            "$MANIFEST"

          grep -Fq \
            'android:name=".MainActivity"' \
            "$MANIFEST"

          grep -Fq \
            'android.intent.action.MAIN' \
            "$MANIFEST"

          grep -Fq \
            'android.intent.category.LAUNCHER' \
            "$MANIFEST"

          echo "ANDROID MANIFEST PASS"

      - name: Verify MainActivity package
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq \
            'package com.majdoor.hisaab' \
            app/src/main/java/com/majdoor/hisaab/MainActivity.kt

          echo "MAIN ACTIVITY PACKAGE PASS"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          ./gradlew --version

      - name: Verify release signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

          echo "SIGNING SECRETS PASS"

      - name: Restore permanent release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          test -s release-keystore.jks

          cat >> gradle.properties <<EOF

          releaseStoreFile=$PROJECT_ROOT/release-keystore.jks
          releaseStorePassword=$RELEASE_KEYSTORE_PASSWORD
          releaseKeyAlias=$RELEASE_KEY_ALIAS
          releaseKeyPassword=$RELEASE_KEY_PASSWORD
          EOF

          echo "KEYSTORE RESTORE PASS"

      - name: Verify signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq \
            'signingConfigs' \
            app/build.gradle.kts

          grep -Fq \
            'releaseStoreFile' \
            app/build.gradle.kts

          grep -Fq \
            'releaseStorePassword' \
            app/build.gradle.kts

          grep -Fq \
            'releaseKeyAlias' \
            app/build.gradle.kts

          grep -Fq \
            'releaseKeyPassword' \
            app/build.gradle.kts

          echo "SIGNING CONFIG PASS"

      - name: Fix only previously failed MainActivity source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
          )

          lines = path.read_text(
              encoding="utf-8"
          ).splitlines()

          replacements = {

              938: '''            Hotspot("Home Nav",0f,91f,20f,9f){home()},Hotspot("Attendance Nav",20f,91f,20f,9f){attendance()},Hotspot("Workers Nav",40f,91f,20f,9f){workers()},Hotspot("Fields Nav",60f,91f,20f,9f){fields()},Hotspot("Reports Nav",80f,91f,20f,9f){reports()}''',

              1033: '''            Hotspot("Back",0f,0f,12f,10f){reports()}, Hotspot("Prev",5f,8f,25f,8f){dailyShift(-1,fieldFilter)}, Hotspot("Next",70f,8f,25f,8f){dailyShift(1,fieldFilter)},''',

              1034: '''            Hotspot(tr("All Fields","सभी खेत"),5f,17f,25f,7f){dailyReport()}, Hotspot("Paddy",32f,17f,20f,7f){dailyReport("Paddy")}, Hotspot("Sugarcane",54f,17f,22f,7f){dailyReport("Sugarcane")}, Hotspot("Banana",77f,17f,18f,7f){dailyReport("Banana")},''',

              1035: '''            Hotspot("Paddy row",5f,30f,90f,12f){dailyReport(fieldFilter)}, Hotspot("Sugarcane row",5f,43f,90f,12f){dailyReport(fieldFilter)}, Hotspot("Banana row",5f,56f,90f,12f){dailyReport(fieldFilter)}, Hotspot("Mustard row",5f,69f,90f,12f){dailyReport(fieldFilter)},''',

              1036: '''            Hotspot("Home Nav",0f,91f,20f,9f){home()},Hotspot("Attendance Nav",20f,91f,20f,9f){attendance()},Hotspot("Workers Nav",40f,91f,20f,9f){workers()},Hotspot("Fields Nav",60f,91f,20f,9f){fields()},Hotspot("Reports Nav",80f,91f,20f,9f){reports()}''',

              1077: '''        val lp=FrameLayout.LayoutParams(-1,0).apply{height=pxY(61f);leftMargin=pxX(3f);topMargin=pxY(28f)}''',

              1211: '''            Hotspot("Back",0f,0f,12f,10f){home()}, Hotspot("Create Backup",8f,14f,40f,15f){createBackup()}, Hotspot("Restore Backup",52f,14f,40f,15f){pickRestore()},''',

              1212: '''            Hotspot("Currency",8f,48f,84f,8f){currencyDialog()}, Hotspot("Language",8f,57f,84f,8f){languageDialog()}, Hotspot("Theme",8f,66f,84f,8f){themeDialog()}, Hotspot("Reset",8f,74f,84f,8f){confirmResetReference()}'''
          }

          for lineno, replacement in replacements.items():

              index = lineno - 1

              if index >= len(lines):
                  raise SystemExit(
                      f"ERROR: Source line {lineno} does not exist"
                  )

              original = lines[index]

              if lineno == 1077:

                  expected = (
                      "height=pxY(61);"
                      "leftMargin=pxX(3);"
                      "topMargin=pxY(28)"
                  )

                  if expected not in original:
                      raise SystemExit(
                          "ERROR: Expected original line 1077 was not found"
                      )

              else:

                  if "Hotspot(" not in original:
                      raise SystemExit(
                          f"ERROR: Expected Hotspot source at line {lineno} was not found"
                      )

              lines[index] = replacement

          text = "\n".join(lines) + "\n"

          if "private fun reportWorkerWhere(" not in text:

              marker = "    private fun shareReportSummary(){"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: shareReportSummary() not found"
                  )

              function = "\n".join([
                  '    private fun reportWorkerWhere(alias:String="w"):Pair<String,List<String>>{',
                  '        val clauses=mutableListOf("$alias.date BETWEEN ? AND ?")',
                  '        val args=mutableListOf(reportFrom,reportTo)',
                  '',
                  '        if(reportWorkerQuery.isNotBlank()){',
                  '            clauses.add("$alias.worker_id IN (SELECT id FROM workers WHERE lower(name) LIKE ? OR lower(code) LIKE ?)")',
                  '            val qv="%${reportWorkerQuery.lowercase(Locale.getDefault())}%"',
                  '            args.add(qv)',
                  '            args.add(qv)',
                  '        }',
                  '',
                  '        if(reportFieldIds.isNotEmpty()){',
                  '            clauses.add("$alias.field_id IN (${reportFieldIds.joinToString(",")})")',
                  '        }',
                  '',
                  '        return clauses.joinToString(" AND ") to args',
                  '    }',
                  ''
              ]) + "\n"

              text = text.replace(
                  marker,
                  function + marker,
                  1
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "ONLY PREVIOUSLY REQUIRED SOURCE AREAS FIXED"
          )
          PY

      - name: Verify exact source fixes
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          grep -Fq \
            'Hotspot("Home Nav",0f,91f,20f,9f)' \
            "$FILE"

          grep -Fq \
            'Hotspot("Back",0f,0f,12f,10f){reports()}' \
            "$FILE"

          grep -Fq \
            'Hotspot("Prev",5f,8f,25f,8f){dailyShift(-1,fieldFilter)}' \
            "$FILE"

          grep -Fq \
            'height=pxY(61f);leftMargin=pxX(3f);topMargin=pxY(28f)' \
            "$FILE"

          grep -Fq \
            'Hotspot("Create Backup",8f,14f,40f,15f)' \
            "$FILE"

          grep -Fq \
            'private fun reportWorkerWhere(alias:String="w")' \
            "$FILE"

          grep -Fq \
            'reportWorkerWhere("w")' \
            "$FILE"

          echo "EXACT SOURCE FIX PASS"

      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          ./gradlew clean --no-daemon

      - name: Fix release lint resources
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          COLORS="app/src/main/res/values/colors.xml"
          COLORS_NIGHT="app/src/main/res/values-night/colors.xml"

          test -f "$COLORS" || {
            echo "ERROR: Missing $COLORS"
            exit 1
          }

          test -f "$COLORS_NIGHT" || {
            echo "ERROR: Missing $COLORS_NIGHT"
            exit 1
          }

          python3 <<'PY'
          from pathlib import Path
          import re

          base_path = Path(
              "app/src/main/res/values/colors.xml"
          )

          night_path = Path(
              "app/src/main/res/values-night/colors.xml"
          )

          base_text = base_path.read_text(
              encoding="utf-8"
          )

          night_text = night_path.read_text(
              encoding="utf-8"
          )

          color_pattern = re.compile(
              r'<color\s+name=["\']([^"\']+)["\']\s*>(.*?)</color>',
              re.DOTALL
          )

          base_colors = {}

          for match in color_pattern.finditer(base_text):
              name = match.group(1)
              value = match.group(2).strip()
              base_colors[name] = value

          night_colors = {}

          for match in color_pattern.finditer(night_text):
              name = match.group(1)
              value = match.group(2).strip()
              night_colors[name] = value

          missing = []

          for name, value in night_colors.items():

              if name not in base_colors:
                  missing.append((name, value))

          if missing:

              resources_match = re.search(
                  r'<resources\b[^>]*>\s*',
                  base_text
              )

              if not resources_match:
                  raise SystemExit(
                      "ERROR: <resources> not found in values/colors.xml"
                  )

              insert_at = resources_match.end()

              additions = []

              for name, value in missing:
                  additions.append(
                      f'    <color name="{name}">{value}</color>'
                  )

              addition_text = (
                  "\n"
                  + "\n".join(additions)
                  + "\n"
              )

              base_text = (
                  base_text[:insert_at]
                  + addition_text
                  + base_text[insert_at:]
              )

              base_path.write_text(
                  base_text,
                  encoding="utf-8"
              )

              print(
                  "ADDED MISSING BASE COLOR RESOURCES:"
              )

              for name, value in missing:
                  print(
                      f"  {name} = {value}"
                  )

          else:

              print(
                  "NO MISSING NIGHT COLOR RESOURCES"
              )

          final_base_text = base_path.read_text(
              encoding="utf-8"
          )

          final_base_colors = {}

          for match in color_pattern.finditer(
              final_base_text
          ):
              final_base_colors[
                  match.group(1)
              ] = match.group(2).strip()

          still_missing = []

          for name in night_colors:

              if name not in final_base_colors:
                  still_missing.append(name)

          if still_missing:

              print(
                  "ERROR: These night resources are still missing in base:"
              )

              for name in still_missing:
                  print("  " + name)

              raise SystemExit(
                  "ERROR: MissingDefaultResource validation failed"
              )

          required_resources = [
              "navigation_bar_dark",
              "status_bar_dark",
          ]

          for name in required_resources:

              if name not in final_base_colors:
                  raise SystemExit(
                      f"ERROR: Required base color missing: {name}"
                  )

              if name not in night_colors:
                  raise SystemExit(
                      f"ERROR: Required night color missing: {name}"
                  )

              print(
                  f"PASS: {name} "
                  f"base={final_base_colors[name]} "
                  f"night={night_colors[name]}"
              )

          print(
              "RELEASE LINT RESOURCE FIX PASS"
          )

          PY

      - name: Build FINAL Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          test -f "$FILE"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          if "import android.os.Build" not in text:

              marker = "import android.os.Bundle"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: android.os.Bundle import not found"
                  )

              text = text.replace(
                  marker,
                  "import android.os.Build\n" + marker,
                  1
              )

          text = text.replace(
              "'/day'",
              '"/day"'
          )

          text = text.replace(
              "'/दिन'",
              '"/दिन"'
          )

          render_start = text.find(
              "private fun renderFieldGrid(grid:LinearLayout,q:String)"
          )

          if render_start == -1:
              raise SystemExit(
                  "ERROR: renderFieldGrid() not found"
              )

          render_end = text.find(
              "\n    private fun fieldDialog",
              render_start
          )

          if render_end == -1:
              raise SystemExit(
                  "ERROR: fieldDialog() marker not found"
              )

          render_block = text[
              render_start:render_end
          ]

          render_block = render_block.replace(
              "val rows=LinearLayout(this);",
              "var rows=LinearLayout(this);",
              1
          )

          text = (
              text[:render_start]
              + render_block
              + text[render_end:]
          )

          def fix_invalid_kotlin_char_literals(source):

              result = []

              i = 0
              n = len(source)

              replacements = 0
              replacement_details = []

              while i < n:

                  if source.startswith("//", i):

                      end = source.find(
                          "\n",
                          i
                      )

                      if end == -1:

                          result.append(
                              source[i:]
                          )

                          i = n
                          break

                      result.append(
                          source[i:end]
                      )

                      i = end

                      continue

                  if source.startswith("/*", i):

                      end = source.find(
                          "*/",
                          i + 2
                      )

                      if end == -1:

                          result.append(
                              source[i:]
                          )

                          i = n
                          break

                      end += 2

                      result.append(
                          source[i:end]
                      )

                      i = end

                      continue

                  if source.startswith(
                      '"""',
                      i
                  ):

                      end = source.find(
                          '"""',
                          i + 3
                      )

                      if end == -1:

                          result.append(
                              source[i:]
                          )

                          i = n
                          break

                      end += 3

                      result.append(
                          source[i:end]
                      )

                      i = end

                      continue

                  if source[i] == '"':

                      start = i

                      i += 1

                      while i < n:

                          if source[i] == '\\':

                              i += 2

                              continue

                          if source[i] == '"':

                              i += 1

                              break

                          i += 1

                      result.append(
                          source[start:i]
                      )

                      continue

                  if source[i] == "'":

                      start = i

                      j = i + 1

                      content = []

                      closed = False

                      while j < n:

                          ch = source[j]

                          if ch in "\r\n":
                              break

                          if ch == "\\":

                              if j + 1 >= n:
                                  break

                              content.append(
                                  source[j]
                              )

                              content.append(
                                  source[j + 1]
                              )

                              j += 2

                              continue

                          if ch == "'":

                              closed = True

                              j += 1

                              break

                          content.append(ch)

                          j += 1

                      if closed:

                          raw_content = "".join(
                              content
                          )

                          valid = (
                              len(raw_content) == 1
                              or (
                                  len(raw_content) == 2
                                  and raw_content[0] == "\\"
                              )
                          )

                          if valid:

                              result.append(
                                  source[start:j]
                              )

                          else:

                              string_content = (
                                  raw_content.replace(
                                      '"',
                                      '\\"'
                                  )
                              )

                              result.append(
                                  '"'
                                  + string_content
                                  + '"'
                              )

                              replacements += 1

                              replacement_details.append(
                                  f"offset {start}: "
                                  f"'{raw_content}' -> "
                                  f'"{string_content}"'
                              )

                          i = j

                          continue

                      result.append(
                          source[i]
                      )

                      i += 1

                      continue

                  result.append(
                      source[i]
                  )

                  i += 1

              return (
                  "".join(result),
                  replacements,
                  replacement_details
              )

          (
              fixed_text,
              char_fixes,
              char_details
          ) = fix_invalid_kotlin_char_literals(
              text
          )

          text = fixed_text

          hotspot_pattern = re.compile(
              r'Hotspot\((.*?),(-?\d+),(-?\d+),(-?\d+),(-?\d+)(?=\))'
          )

          hotspot_count = [0]

          def fix_hotspot(match):

              hotspot_count[0] += 1

              return (
                  f"Hotspot({match.group(1)},"
                  f"{match.group(2)}f,"
                  f"{match.group(3)}f,"
                  f"{match.group(4)}f,"
                  f"{match.group(5)}f"
              )

          text = hotspot_pattern.sub(
              fix_hotspot,
              text
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          final_text = path.read_text(
              encoding="utf-8"
          )

          if "import android.os.Build" not in final_text:
              raise SystemExit(
                  "ERROR: android.os.Build import missing"
              )

          if "'/day'" in final_text:
              raise SystemExit(
                  "ERROR: invalid '/day' literal remains"
              )

          if "'/दिन'" in final_text:
              raise SystemExit(
                  "ERROR: invalid '/दिन' literal remains"
              )

          render_start = final_text.find(
