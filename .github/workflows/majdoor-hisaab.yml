name: MAJDOOR HISAAB PRO — FINAL RELEASE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

jobs:
  build-test-sign-runtime:
    name: FINAL BUILD + TEST + SIGN + RUNTIME AUDIT
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # 2. CHECK REQUIRED FINAL AUDITED ZIP
      # ============================================================

      - name: Check FINAL audited project ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== PROJECT ZIP CHECK ====="

          if [ ! -f "Majdoor_Hisaab_PRO_FINAL_FIXED_AUDITED.zip" ]; then
            echo ""
            echo "ERROR:"
            echo "Majdoor_Hisaab_PRO_FINAL_FIXED_AUDITED.zip was not found."
            echo ""
            echo "Upload the FINAL FIXED AUDITED ZIP to the repository root."
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print || true
            exit 1
          fi

          ls -lh "Majdoor_Hisaab_PRO_FINAL_FIXED_AUDITED.zip"

          unzip -t \
            "Majdoor_Hisaab_PRO_FINAL_FIXED_AUDITED.zip" \
            >/dev/null

          echo "FINAL_AUDITED_ZIP=FOUND"
          echo "FINAL_AUDITED_ZIP=VALID"

      # ============================================================
      # 3. EXTRACT FINAL AUDITED PROJECT
      # ============================================================

      - name: Extract FINAL audited project
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf extracted-final
          mkdir -p extracted-final

          unzip -q \
            "Majdoor_Hisaab_PRO_FINAL_FIXED_AUDITED.zip" \
            -d extracted-final

          # Do NOT copy the ZIP's workflow over this workflow.
          # The workflow currently running is the authoritative workflow.
          rsync -a \
            --exclude=".github/" \
            --exclude=".git/" \
            extracted-final/ \
            ./

          echo "===== EXTRACTED PROJECT ====="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew
          test -d app/src/main
          test -d scripts

          echo "PROJECT_EXTRACTION=PASS"

      # ============================================================
      # 4. JAVA 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -Eeuo pipefail

          java -version
          javac -version

      # ============================================================
      # 5. GRADLE 8.11.1
      # ============================================================

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-disabled: true
          validate-wrappers: false

      - name: Verify Gradle
        shell: bash
        run: |
          set -Eeuo pipefail

          command -v gradle
          gradle --version

          gradle --version | grep -F "Gradle 8.11.1"

      # ============================================================
      # 6. ANDROID SDK
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "emulator"

      # ============================================================
      # 7. EMULATOR LINUX DEPENDENCIES
      # ============================================================

      - name: Install Android emulator Linux dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            libpulse0 \
            libx11-6 \
            libxcb1 \
            libxdamage1 \
            libnss3 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxtst6 \
            libxrandr2 \
            libgl1 \
            libglu1-mesa \
            libfontconfig1 \
            libdbus-1-3 \
            libasound2t64

          sudo ldconfig

      # ============================================================
      # 8. ANDROID SDK PATH
      # ============================================================

      - name: Configure Android SDK PATH
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/emulator" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"

          export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/emulator:${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/build-tools/${BUILD_TOOLS}:${PATH}"

          adb version
          emulator -version
          sdkmanager --version
          apksigner version

      # ============================================================
      # 9. VERIFY PROJECT STRUCTURE
      # ============================================================

      - name: Verify project structure
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "===== PROJECT STRUCTURE ====="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew

          test -d app/src/main
          test -d scripts

          echo "===== APP CONFIG ====="

          grep -nE \
            'applicationId|versionCode|versionName' \
            app/build.gradle.kts

          grep -Eq \
            'applicationId[[:space:]]*=[[:space:]]*"com\.majdoor\.hisaab"' \
            app/build.gradle.kts

          grep -Eq \
            'versionCode[[:space:]]*=[[:space:]]*77' \
            app/build.gradle.kts

          grep -Eq \
            'versionName[[:space:]]*=[[:space:]]*"1\.77\.0"' \
            app/build.gradle.kts

          echo "PROJECT_STRUCTURE_GATE=PASS"

      # ============================================================
      # 10. BOOTSTRAP GRADLE WRAPPER
      # ============================================================

      - name: Bootstrap repository Gradle Wrapper
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x ./gradlew

          gradle --version | grep -F "Gradle 8.11.1"

          gradle :wrapper \
            --gradle-version "8.11.1" \
            --gradle-distribution-sha256-sum \
            "f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6"

          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties

          ./gradlew --version | grep -F "Gradle 8.11.1"

      # ============================================================
      # 11. STATIC ACCEPTANCE GATES
      # ============================================================

      - name: Run static acceptance gates
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x scripts/*.sh

          ./scripts/acceptance-gates.sh

      # ============================================================
      # 12. FIX DEPENDENCY HEALTH CONFIGURATIONS
      # ============================================================

      - name: Normalize dependency health configurations
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f scripts/dependency-health.sh

          # Android unit-test configuration.
          sed -i \
            's/\btestRuntimeClasspath\b/debugUnitTestRuntimeClasspath/g' \
            scripts/dependency-health.sh

          # Android module configuration.
          sed -i \
            's#./gradlew --no-daemon --stacktrace --refresh-dependencies dependencies --configuration#./gradlew --no-daemon --stacktrace --refresh-dependencies :app:dependencies --configuration#g' \
            scripts/dependency-health.sh

          echo "===== DEPENDENCY HEALTH SCRIPT ====="

          grep -n \
            "gradlew.*dependencies" \
            scripts/dependency-health.sh

      # ============================================================
      # 13. DEPENDENCY RESOLUTION
      # ============================================================

      - name: Resolve Android dependency graphs
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration debugRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration debugUnitTestRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration e2eReleaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            :app:dependencies \
            --configuration releaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            buildEnvironment

      # ============================================================
      # 14. DEPENDENCY HEALTH
      # ============================================================

      - name: Run dependency health audit
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x scripts/dependency-health.sh

          ./scripts/dependency-health.sh

      # ============================================================
      # 15. COMPATIBILITY / ARCHITECTURE / SECURITY
      # ============================================================

      - name: Run compatibility and architecture gates
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/gradle-agp-compatibility.sh
          ./scripts/gradle-kotlin-compatibility.sh

      - name: Run Phase 17 runtime contract gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase17-real-android-runtime-gate.sh

      - name: Run Phase 18 configuration lifecycle gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase18-configuration-lifecycle-gate.sh

      - name: Run Phase 19 offline first gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase19-offline-first-gate.sh

      - name: Run Phase 20 security data gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase20-security-data-gate.sh

      # ============================================================
      # 16. CLEAN BUILD + TEST + COMPILE
      # ============================================================

      - name: Clean build and compile all required variants
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean

          ./gradlew \
            --no-daemon \
            --stacktrace \
            test \
            compileDebugKotlin \
            assembleDebug \
            compileE2eReleaseKotlin \
            assembleE2eRelease \
            compileReleaseKotlin \
            assembleRelease \
            assembleReleaseAndroidTest

      # ============================================================
      # 17. RELEASE BUILD GATE
      # ============================================================

      - name: Release build gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/release-build-gate.sh

      # ============================================================
      # 18. DEBUG APK VERIFY
      # ============================================================

      - name: Verify Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$DEBUG_APK"

          apkanalyzer manifest application-id "$DEBUG_APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$DEBUG_APK" \
            | grep -Fx "$VERSION_NAME"

          apkanalyzer manifest version-code "$DEBUG_APK" \
            | grep -Fx "$VERSION_CODE"

          mkdir -p artifacts/debug

          cp "$DEBUG_APK" \
            artifacts/debug/Majdoor-Hisaab-PRO-debug.apk

          sha256sum "$DEBUG_APK" \
            | tee artifacts/debug/Majdoor-Hisaab-PRO-debug.sha256

      # ============================================================
      # 19. DEBUG APK RUNTIME
      # ============================================================

      - name: Install and launch Debug APK on API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            adb install -r \
              "${GITHUB_WORKSPACE}/app/build/outputs/apk/debug/app-debug.apk"

            adb shell am force-stop "${PACKAGE_NAME}"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity" \
              | tee artifacts/debug/debug-launch.txt

            sleep 2

            adb shell pidof "${PACKAGE_NAME}" \
              | grep -Eq '[0-9]+'

            adb shell cmd package resolve-activity \
              --brief \
              -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER \
              "${PACKAGE_NAME}" \
              | grep -q "${PACKAGE_NAME}"

            adb logcat -d -t 10000 \
              > artifacts/debug/debug-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/debug/debug-logcat.txt; then
              exit 1
            fi

      # ============================================================
      # 20. REAL ANDROID E2E
      # ============================================================

      - name: Run real Android E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest

      # ============================================================
      # 21. REPORTS / SETTINGS / DATE / SEARCH
      # ============================================================

      - name: Runtime reports settings date search evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.Phase17RealAndroidRuntimeE2ETest \
              --tests com.majdoor.hisaab.Phase18ConfigurationLifecycleE2ETest

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/555_556_557_558_559_runtime.pass

      # ============================================================
      # 22. CLEAN INSTALL BACKUP RESTORE
      # ============================================================

      - name: Clean install backup restore E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.CleanInstallBackupRestoreE2ETest

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/552_553_clean_install_restore_totals.pass

      # ============================================================
      # 23. SECURITY RUNTIME
      # ============================================================

      - name: Security runtime evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.Phase17RealAndroidRuntimeE2ETest

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/554_security_runtime.pass

      # ============================================================
      # 24. PHASE 18 LIFECYCLE
      # ============================================================

      - name: Phase 18 lifecycle E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.Phase18ConfigurationLifecycleE2ETest

            ./scripts/phase18-device-reboot-gate.sh

      # ============================================================
      # 25. PHASE 19 OFFLINE
      # ============================================================

      - name: Phase 19 offline E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.Phase19OfflineFirstE2ETest

            ./scripts/phase19-offline-first-gate.sh

      # ============================================================
      # 26. VERIFY UNSIGNED RELEASE APK
      # ============================================================

      - name: Verify unsigned Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" \
            | grep -Fx "$VERSION_NAME"

          apkanalyzer manifest version-code "$APK" \
            | grep -Fx "$VERSION_CODE"

          mkdir -p artifacts

          cp "$APK" \
            artifacts/app-release-unsigned.apk

      # ============================================================
      # 27. RESTORE PRODUCTION SIGNING KEY
      # ============================================================

      - name: Restore production signing key
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$EXPECTED_CERT"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > release.keystore

          test -s release.keystore

          keytool \
            -list \
            -v \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > cert.txt

          ACTUAL_CERT=$(
            awk -F': ' \
              '/SHA256:/{print $2; exit}' \
              cert.txt \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )

          EXPECTED_CERT_NORMALIZED=$(
            printf '%s' "$EXPECTED_CERT" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )

          test "$ACTUAL_CERT" = "$EXPECTED_CERT_NORMALIZED"

      # ============================================================
      # 28. ZIPALIGN + SIGN RELEASE APK
      # ============================================================

      - name: Zipalign and sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s release.keystore
          test -s "$UNSIGNED"

          zipalign \
            -f \
            -p \
            4 \
            "$UNSIGNED" \
            "$ALIGNED"

          zipalign \
            -c \
            -v \
            4 \
            "$ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$SIGNED" \
            | tee artifacts/release-signature.txt

          ACTUAL_SIGNED_CERT=$(
            apksigner verify \
              --print-certs \
              "$SIGNED" \
              | awk -F': ' \
                '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )

          EXPECTED_SIGNED_CERT=$(
            printf '%s' "$EXPECTED_CERT" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )

          test -n "$ACTUAL_SIGNED_CERT"
          test "$ACTUAL_SIGNED_CERT" = "$EXPECTED_SIGNED_CERT"

          unzip -t "$SIGNED" >/dev/null
          zipalign -c -v 4 "$SIGNED"

          rm -f cert.txt "$ALIGNED"

          TEST_UNSIGNED="app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          TEST_ALIGNED="app/build/outputs/apk/androidTest/release/app-release-androidTest-aligned.apk"
          TEST_SIGNED="artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

          test -s "$TEST_UNSIGNED"

          zipalign \
            -f \
            -p \
            4 \
            "$TEST_UNSIGNED" \
            "$TEST_ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$TEST_SIGNED" \
            "$TEST_ALIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$TEST_SIGNED" \
            >/dev/null

          rm -f release.keystore "$TEST_ALIGNED"

      # ============================================================
      # 29. PRODUCTION SIGNING GATE
      # ============================================================

      - name: Production signing gate
        env:
          MH_RELEASE_CERT_SHA256: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/production-signing-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

      # ============================================================
      # 30. SIGNED APK VERIFY
      # ============================================================

      - name: Verify signed APK metadata and checksum
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" \
            | grep -Fx "$VERSION_NAME"

          apkanalyzer manifest version-code "$APK" \
            | grep -Fx "$VERSION_CODE"

          unzip -t "$APK" >/dev/null

          zipalign -c -v 4 "$APK"

          apksigner verify \
            --verbose \
            --print-certs \
            "$APK" \
            | tee artifacts/release-signature-final.txt

          sha256sum "$APK" \
            | tee artifacts/Majdoor-Hisaab-PRO-release.sha256

          test -s artifacts/Majdoor-Hisaab-PRO-release.sha256

      # ============================================================
      # 31. PHASE 1 ARTIFACT GATE
      # ============================================================

      - name: Phase 1 Points 18-25 artifact gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase1-points-18-25-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

      # ============================================================
      # 32. PHASE 22 RED LIST STRUCTURAL GATE
      # ============================================================

      - name: Phase 22 red-list structural gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase22-final-red-list-gate.sh

      # ============================================================
      # 33. PHASE 22 FINAL E2E
      # ============================================================

      - name: Phase 22 final red-list Android E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.Phase22FinalRedListE2ETest

      # ============================================================
      # 34. SIGNED RELEASE RUNTIME
      # ============================================================

      - name: Run signed Release APK on API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            ./scripts/release-e2e.sh \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release.apk"

            # Offline smoke test.
            adb shell svc wifi disable || true
            adb shell svc data disable || true

            adb shell am force-stop "${PACKAGE_NAME}"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity" \
              | tee artifacts/release-e2e/offline-launch.txt

            sleep 2

            adb shell pidof "${PACKAGE_NAME}" \
              | grep -Eq '[0-9]+'

            adb logcat -d -t 10000 \
              > artifacts/release-e2e/offline-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/release-e2e/offline-logcat.txt; then
              exit 1
            fi

            mkdir -p artifacts/release-e2e/markers

            touch \
              artifacts/release-e2e/markers/550_offline_runtime.pass

      # ============================================================
      # 35. TRUE REBOOT PERSISTENCE
      # ============================================================

      - name: Signed Release true reboot persistence gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'

            ./scripts/signed-release-reboot-gate.sh \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release.apk" \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

      # ============================================================
      # 36. FINAL RELEASE GATE 541-566
      # ============================================================

      - name: FINAL RELEASE GATE — Points 541-566
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/final-release-gate.sh

      # ============================================================
      # 37. FINAL ARTIFACT VERIFICATION
      # ============================================================

      - name: Verify downloadable Release artifacts
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s artifacts/Majdoor-Hisaab-PRO-release.apk
          test -s artifacts/Majdoor-Hisaab-PRO-release.sha256
          test -s artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk

          echo "DOWNLOADABLE_RELEASE_ARTIFACT=PASS"

          ls -lh \
            artifacts/Majdoor-Hisaab-PRO-release.apk \
            artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

      # ============================================================
      # 38. UPLOAD ONLY AFTER SUCCESS
      # ============================================================

      - name: Upload final Release artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: majdoor-hisaab-pro-release
          path: artifacts/
          if-no-files-found: error
          compression-level: 6
