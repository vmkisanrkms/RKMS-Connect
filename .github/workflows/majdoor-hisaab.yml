name: Majdoor Hisaab PRO - V81 Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"

  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-Professional-UI-V81-ALL-BUTTONS-FINAL.zip"


jobs:

  build-release:

    name: Build Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. SHOW REPOSITORY
      # ============================================================

      - name: Show repository
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " MAJDOOR HISAAB PRO - V81 FINAL RELEASE"
          echo "============================================================"

          pwd

          echo
          echo "===== ZIP FILES ====="

          find . \
            -type f \
            -name "*.zip" \
            -print \
            | sort


      # ============================================================
      # 3. JDK 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. VERIFY JAVA
      # ============================================================

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version


      # ============================================================
      # 5. ANDROID SDK 36
      # ============================================================

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${ANDROID_HOME:-}" ]]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [[ -n "${ANDROID_SDK_ROOT:-}" ]]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            SDK_ROOT="$HOME/android-sdk"
          fi

          echo "SDK_ROOT=$SDK_ROOT"

          test -d "$SDK_ROOT"

          SDKMANAGER=""

          if [[ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -path "*/bin/sdkmanager" \
                -print \
                2>/dev/null \
                | sort \
                | tail -n 1 \
                || true
            )"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d "$SDK_ROOT/platforms/android-${ANDROID_API}"
          test -d "$SDK_ROOT/build-tools/${BUILD_TOOLS}"

          test -x "$SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt"
          test -x "$SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"
          test -x "$SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          echo
          echo "ANDROID SDK 36 READY"


      # ============================================================
      # 6. LOCATE / EXTRACT V81 PROJECT
      # ============================================================

      - name: Locate and extract V81 project
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " LOCATING V81 PROJECT"
          echo "============================================================"

          FOUND_ROOT=""

          if [[ -f "settings.gradle.kts" ]] && \
             [[ -f "app/build.gradle.kts" ]]; then

            FOUND_ROOT="$PWD"

            echo "Android project found at repository root."

          fi


          if [[ -z "$FOUND_ROOT" ]]; then

            ZIP_PATH="$(
              find "$PWD" \
                -type f \
                -name "$ZIP_NAME" \
                -print \
                | head -n 1
            )"

            if [[ -z "$ZIP_PATH" ]]; then

              echo
              echo "ERROR: V81 ZIP not found:"
              echo "$ZIP_NAME"

              echo
              echo "Available ZIP files:"

              find "$PWD" \
                -type f \
                -name "*.zip" \
                -print \
                | sort

              exit 1

            fi


            echo
            echo "Using V81 ZIP:"
            echo "$ZIP_PATH"


            rm -rf "$PWD/extracted_project"

            mkdir -p "$PWD/extracted_project"


            unzip -q \
              "$ZIP_PATH" \
              -d "$PWD/extracted_project"


            FOUND_ROOT="$(
              find "$PWD/extracted_project" \
                -type f \
                -name "settings.gradle.kts" \
                -print \
                | while read -r file; do

                    dir="$(dirname "$file")"

                    if [[ -f "$dir/app/build.gradle.kts" ]]; then
                      echo "$dir"
                      break
                    fi

                  done
            )"

          fi


          if [[ -z "$FOUND_ROOT" ]]; then

            FOUND_ROOT="$(
              find "$PWD" \
                -type f \
                -name "settings.gradle.kts" \
                -print \
                | while read -r file; do

                    dir="$(dirname "$file")"

                    if [[ -f "$dir/app/build.gradle.kts" ]]; then
                      echo "$dir"
                      break
                    fi

                  done
            )"

          fi


          if [[ -z "$FOUND_ROOT" ]]; then

            echo "ERROR: Android project not found."

            find "$PWD" \
              -maxdepth 7 \
              -type f \
              -print \
              | head -500

            exit 1

          fi


          echo "ANDROID_PROJECT_ROOT=$FOUND_ROOT" >> "$GITHUB_ENV"

          echo
          echo "ANDROID PROJECT:"
          echo "$FOUND_ROOT"


      # ============================================================
      # 7. GRADLE 8.11.1
      # ============================================================

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false


      # ============================================================
      # 8. VERIFY PROJECT CONFIGURATION
      # ============================================================

      - name: Verify project configuration
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f app/build.gradle.kts

          echo "===== settings.gradle.kts ====="

          sed -n '1,260p' settings.gradle.kts


          echo
          echo "===== app/build.gradle.kts ====="

          sed -n '1,420p' app/build.gradle.kts


          echo
          echo "===== CONFIGURATION CHECK ====="

          grep -q \
            'com.majdoor.hisaab' \
            app/build.gradle.kts


          grep -Eq \
            'compileSdk.*36|compileSdk = 36' \
            app/build.gradle.kts


          grep -Eq \
            'targetSdk.*36|targetSdk = 36' \
            app/build.gradle.kts


          grep -Eq \
            'versionCode.*77|versionCode = 77' \
            app/build.gradle.kts


          grep -Eq \
            'versionName.*1.77.0|versionName = "1.77.0"' \
            app/build.gradle.kts


          echo
          echo "PROJECT CONFIGURATION PASSED"


      # ============================================================
      # 9. LOCATE MAINACTIVITYSCREENS
      # ============================================================

      - name: Locate MainActivityScreens
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          SRC="$(
            find . \
              -type f \
              -name "MainActivityScreens.kt" \
              -print \
              | head -n 1
          )"


          if [[ -z "$SRC" ]]; then

            echo "ERROR: MainActivityScreens.kt not found."

            exit 1

          fi


          echo "MAIN_ACTIVITY_SCREENS=$SRC" \
            >> "$GITHUB_ENV"


          echo
          echo "SOURCE:"
          echo "$SRC"


      # ============================================================
      # 10. DEFINITIVE V81 KOTLIN FIX
      # ============================================================

      - name: Apply definitive V81 Kotlin fixes
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          from pathlib import Path


          src = Path(
              os.environ["MAIN_ACTIVITY_SCREENS"]
          )


          if not src.exists():

              raise SystemExit(
                  f"ERROR: Source not found: {src}"
              )


          text = src.read_text(
              encoding="utf-8"
          )


          print("============================================================")
          print(" DEFINITIVE V81 KOTLIN FIX")
          print("============================================================")


          # ========================================================
          # 1. btn() DEFAULT ACTION
          # ========================================================

          text = text.replace(
              "internal fun MainActivity.btn(s:String,action:()->Unit)=TextView(this).apply{",
              "internal fun MainActivity.btn(s:String,action:()->Unit = {})=TextView(this).apply{"
          )


          text = text.replace(
              "internal fun MainActivity.btn(s: String, action: () -> Unit) = TextView(this).apply {",
              "internal fun MainActivity.btn(s: String, action: () -> Unit = {}) = TextView(this).apply {"
          )


          # ========================================================
          # 2. ScrollView
          # ========================================================

          text = text.replace(
              "fillViewport=true",
              "setFillViewport(true)"
          )


          text = text.replace(
              "fillViewport = true",
              "setFillViewport(true)"
          )


          # ========================================================
          # 3. pick() RETURN TYPE
          # ========================================================

          text = text.replace(
              "onPick:(Int)->Unit):Button {",
              "onPick:(Int)->Unit):TextView {"
          )


          # ========================================================
          # 4. ATTENDANCE statusViews MAP
          # ========================================================

          text = text.replace(
              'statusViews.forEach{it.text="FULL"}',
              'statusViews.values.forEach{it.text="FULL"}'
          )


          text = text.replace(
              'statusViews.forEach{it.text="HALF"}',
              'statusViews.values.forEach{it.text="HALF"}'
          )


          text = text.replace(
              'statusViews.forEach{it.text=AttendanceRules.UNMARKED}',
              'statusViews.values.forEach{it.text=AttendanceRules.UNMARKED}'
          )


          # ========================================================
          # 5. CROP FORM
          # ========================================================

          text = text.replace(
              'val fb=btn("Field: ${selectedName(fieldId,fields.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select field").setItems(fields.map{it.name}.toTypedArray()){_,i->fieldId=fields[i].id;it.text="Field: ${fields[i].name}"}.show()}',
              'lateinit var fb: TextView;fb=btn("Field: ${selectedName(fieldId,fields.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select field").setItems(fields.map{it.name}.toTypedArray()){_,i->fieldId=fields[i].id;fb.text="Field: ${fields[i].name}"}.show()}'
          )


          # ========================================================
          # 6. PRODUCTION FORM
          # ========================================================

          text = text.replace(
              'val cropBtn=btn("Crop: ${selectedName(cropId,crops.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select crop").setItems(crops.map{it.name}.toTypedArray()){_,i->cropId=crops[i].id;it.text="Crop: ${crops[i].name}"}.show()}',
              'lateinit var cropBtn: TextView;cropBtn=btn("Crop: ${selectedName(cropId,crops.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select crop").setItems(crops.map{it.name}.toTypedArray()){_,i->cropId=crops[i].id;cropBtn.text="Crop: ${crops[i].name}"}.show()}'
          )


          # ========================================================
          # 7. WORK FORM
          # ========================================================

          text = text.replace(
              'val fieldBtn=btn("Field: ${selectedName(fieldId,fields.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select field").setItems(fields.map{it.name}.toTypedArray()){_,i->fieldId=fields[i].id;it.text="Field: ${fields[i].name}"}.show()}',
              'lateinit var fieldBtn: TextView;fieldBtn=btn("Field: ${selectedName(fieldId,fields.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select field").setItems(fields.map{it.name}.toTypedArray()){_,i->fieldId=fields[i].id;fieldBtn.text="Field: ${fields[i].name}"}.show()}'
          )


          # ========================================================
          # 8. REVENUE FORM
          # ========================================================

          # Same cropBtn pattern may occur more than once.
          text = text.replace(
              'val cropBtn=btn("Crop: ${selectedName(cropId,crops.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select crop").setItems(crops.map{it.name}.toTypedArray()){_,i->cropId=crops[i].id;it.text="Crop: ${crops[i].name}"}.show()}',
              'lateinit var cropBtn: TextView;cropBtn=btn("Crop: ${selectedName(cropId,crops.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select crop").setItems(crops.map{it.name}.toTypedArray()){_,i->cropId=crops[i].id;cropBtn.text="Crop: ${crops[i].name}"}.show()}'
          )


          # ========================================================
          # 9. WORKER BUTTON
          # ========================================================

          text = text.replace(
              'val workerBtn=btn("Workers: ${selectedWorkers.size}"){',
              'lateinit var workerBtn: TextView;workerBtn=btn("Workers: ${selectedWorkers.size}"){'
          )


          text = text.replace(
              '.setPositiveButton("Done"){_,_->it.text="Workers: ${selectedWorkers.distinct().size}"}',
              '.setPositiveButton("Done"){_,_->workerBtn.text="Workers: ${selectedWorkers.distinct().size}"}'
          )


          # ========================================================
          # 10. WORK RATE TYPE BUTTON
          # ========================================================

          text = text.replace(
              'var rateType=app.calculation.normalize(old?.rateType?:"QUANTITY",old?.unit?:"acre");val rateTypeBtn=btn("Rate type: $rateType"){',
              'var rateType=app.calculation.normalize(old?.rateType?:"QUANTITY",old?.unit?:"acre");lateinit var rateTypeBtn: TextView;rateTypeBtn=btn("Rate type: $rateType"){'
          )


          text = text.replace(
              'rateType=app.calculation.rateTypes()[i];it.text="Rate type: $rateType"',
              'rateType=app.calculation.rateTypes()[i];rateTypeBtn.text="Rate type: $rateType"'
          )


          # ========================================================
          # 11. PAYMENT FORM
          # ========================================================

          payment_old = '''        val wb=btn("Worker: ${selectedName(wid,workers.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select worker").setItems(workers.map{it.name}.toTypedArray()){_,i->wid=workers[i].id;it.text="Worker: ${workers[i].name}"}.show()};val d=dateField("Date",old?.date?:today);val a=field("Amount",old?.amount?.toString()?:"");var method=old?.method?:"Cash";val mb=btn("Method: $method"){val methods=arrayOf("Cash","Bank","UPI");AlertDialog.Builder(this).setTitle("Payment method").setItems(methods){_,i->method=methods[i];it.text="Method: ${methods[i]}"}.show()};val adv=btn("Advance: ${if(advance)"YES" else "NO"}"){advance=!advance;it.text="Advance: ${if(advance)"YES" else "NO"}"};val ref=field("Reference",old?.reference?:"");val notes=field("Notes",old?.notes?:"");listOf(wb,d,a,mb,adv,ref,notes).forEach{b.addView(it)}'''

          payment_new = '''        lateinit var wb: TextView;wb=btn("Worker: ${selectedName(wid,workers.map{it.id to it.name})}"){AlertDialog.Builder(this).setTitle("Select worker").setItems(workers.map{it.name}.toTypedArray()){_,i->wid=workers[i].id;wb.text="Worker: ${workers[i].name}"}.show()};val d=dateField("Date",old?.date?:today);val a=field("Amount",old?.amount?.toString()?:"");var method=old?.method?:"Cash";lateinit var mb: TextView;mb=btn("Method: $method"){val methods=arrayOf("Cash","Bank","UPI");AlertDialog.Builder(this).setTitle("Payment method").setItems(methods){_,i->method=methods[i];mb.text="Method: ${methods[i]}"}.show()};lateinit var adv: TextView;adv=btn("Advance: ${if(advance)"YES" else "NO"}"){advance=!advance;adv.text="Advance: ${if(advance)"YES" else "NO"}"};val ref=field("Reference",old?.reference?:"");val notes=field("Notes",old?.notes?:"");listOf(wb,d,a,mb,adv,ref,notes).forEach{b.addView(it)}'''

          if payment_old in text:
              text = text.replace(
                  payment_old,
                  payment_new,
                  1
              )


          # ========================================================
          # 12. EXPENSE FORM
          # ========================================================

          expense_old = '''        val cb=btn("Category: $cat"){AlertDialog.Builder(this).setTitle("Expense category").setItems(cats.toTypedArray()){_,i->cat=cats[i];it.text="Category: $cat"}.show()};val fb=btn("Field: ${if(fieldId.isBlank())"Not linked" else selectedName(fieldId,fields.map{it.id to it.name})}"){val labels=listOf("Not linked")+fields.map{it.name};AlertDialog.Builder(this).setTitle("Select field").setItems(labels.toTypedArray()){_,i->if(i==0){fieldId="";it.text="Field: Not linked"}else{fieldId=fields[i-1].id;it.text="Field: ${fields[i-1].name}"}}.show()};val crb=btn("Crop: ${if(cropId.isBlank())"Not linked" else selectedName(cropId,crops.map{it.id to it.name})}"){val labels=listOf("Not linked")+crops.map{it.name};AlertDialog.Builder(this).setTitle("Select crop").setItems(labels.toTypedArray()){_,i->if(i==0){cropId="";it.text="Crop: Not linked"}else{cropId=crops[i-1].id;it.text="Crop: ${crops[i-1].name}"}}.show()};val d=dateField("Date",old?.date?:today);val a=field("Amount",old?.amount?.toString()?:(""));val n=field("Notes",old?.notes?:"");listOf(cb,fb,crb,d,a,n).forEach{b.addView(it)}'''

          expense_new = '''        lateinit var cb: TextView;cb=btn("Category: $cat"){AlertDialog.Builder(this).setTitle("Expense category").setItems(cats.toTypedArray()){_,i->cat=cats[i];cb.text="Category: $cat"}.show()};lateinit var fb: TextView;fb=btn("Field: ${if(fieldId.isBlank())"Not linked" else selectedName(fieldId,fields.map{it.id to it.name})}"){val labels=listOf("Not linked")+fields.map{it.name};AlertDialog.Builder(this).setTitle("Select field").setItems(labels.toTypedArray()){_,i->if(i==0){fieldId="";fb.text="Field: Not linked"}else{fieldId=fields[i-1].id;fb.text="Field: ${fields[i-1].name}"}}.show()};lateinit var crb: TextView;crb=btn("Crop: ${if(cropId.isBlank())"Not linked" else selectedName(cropId,crops.map{it.id to it.name})}"){val labels=listOf("Not linked")+crops.map{it.name};AlertDialog.Builder(this).setTitle("Select crop").setItems(labels.toTypedArray()){_,i->if(i==0){cropId="";crb.text="Crop: Not linked"}else{cropId=crops[i-1].id;crb.text="Crop: ${crops[i-1].name}"}}.show()};val d=dateField("Date",old?.date?:today);val a=field("Amount",old?.amount?.toString()?:(""));val n=field("Notes",old?.notes?:"");listOf(cb,fb,crb,d,a,n).forEach{b.addView(it)}'''

          if expense_old in text:
              text = text.replace(
                  expense_old,
                  expense_new,
                  1
              )


          # ========================================================
          # 13. REPORT FILTERS
          # ========================================================

          text = text.replace(
              'val wb=btn("Worker: ${if(wid.isBlank())"All" else selectedName(wid,workers.map{it.id to it.name})}"){ val labels=listOf("All")+workers.map{it.name}; AlertDialog.Builder(this).setTitle("Worker").setItems(labels.toTypedArray()){_,i->wid=if(i==0)"" else workers[i-1].id; it.text="Worker: ${if(i==0)"All" else workers[i-1].name}"}.show() }',
              'lateinit var wb: TextView;wb=btn("Worker: ${if(wid.isBlank())"All" else selectedName(wid,workers.map{it.id to it.name})}"){ val labels=listOf("All")+workers.map{it.name}; AlertDialog.Builder(this).setTitle("Worker").setItems(labels.toTypedArray()){_,i->wid=if(i==0)"" else workers[i-1].id; wb.text="Worker: ${if(i==0)"All" else workers[i-1].name}"}.show() }'
          )


          text = text.replace(
              'val fb=btn("Field: ${if(fid.isBlank())"All" else selectedName(fid,fields.map{it.id to it.name})}"){ val labels=listOf("All")+fields.map{it.name}; AlertDialog.Builder(this).setTitle("Field").setItems(labels.toTypedArray()){_,i->fid=if(i==0)"" else fields[i-1].id; it.text="Field: ${if(i==0)"All" else fields[i-1].name}"}.show() }',
              'lateinit var fb: TextView;fb=btn("Field: ${if(fid.isBlank())"All" else selectedName(fid,fields.map{it.id to it.name})}"){ val labels=listOf("All")+fields.map{it.name}; AlertDialog.Builder(this).setTitle("Field").setItems(labels.toTypedArray()){_,i->fid=if(i==0)"" else fields[i-1].id; fb.text="Field: ${if(i==0)"All" else fields[i-1].name}"}.show() }'
          )


          text = text.replace(
              'val cb=btn("Crop: ${if(cid.isBlank())"All" else selectedName(cid,crops.map{it.id to it.name})}"){ val labels=listOf("All")+crops.map{it.name}; AlertDialog.Builder(this).setTitle("Crop").setItems(labels.toTypedArray()){_,i->cid=if(i==0)"" else crops[i-1].id; it.text="Crop: ${if(i==0)"All" else crops[i-1].name}"}.show() }',
              'lateinit var cb: TextView;cb=btn("Crop: ${if(cid.isBlank())"All" else selectedName(cid,crops.map{it.id to it.name})}"){ val labels=listOf("All")+crops.map{it.name}; AlertDialog.Builder(this).setTitle("Crop").setItems(labels.toTypedArray()){_,i->cid=if(i==0)"" else crops[i-1].id; cb.text="Crop: ${if(i==0)"All" else crops[i-1].name}"}.show() }'
          )


          # ========================================================
          # 14. INTENT TYPE SHADOWING
          # ========================================================

          text = re.sub(
              r'(\.apply\s*\{\s*)type\s*=\s*"image/\*"',
              r'\1this.type="image/*"',
              text
          )


          text = re.sub(
              r'(\.apply\s*\{\s*)type\s*=\s*"application/zip"',
              r'\1this.type="application/zip"',
              text
          )


          text = re.sub(
              r'(\.apply\s*\{\s*)type\s*=\s*"\*/\*"',
              r'\1this.type="*/*"',
              text
          )


          # ========================================================
          # 15. AUDIT COMPATIBILITY
          # ========================================================

          text = text.replace(
              ".audit.auditLog",
              ".auditLog"
          )


          text = text.replace(
              "clearAuditLog",
              "clear"
          )


          text = text.replace(
              "getSystemService(ALARM_SERVICE)",
              "getSystemService(Context.ALARM_SERVICE)"
          )


          # ========================================================
          # 16. ATTENDANCE FORM BUTTONS
          # ========================================================

          text = text.replace(
              '            val fieldBtn=btn("Field: ${if(fieldId.isBlank()) "Not linked" else selectedName(fieldId,fields.map{it.id to it.name})}"){',
              '            lateinit var fieldBtn: TextView;fieldBtn=btn("Field: ${if(fieldId.isBlank()) "Not linked" else selectedName(fieldId,fields.map{it.id to it.name})}"){'
          )


          text = text.replace(
              '            val statusBtn=btn("Status: $status"){',
              '            lateinit var statusBtn: TextView;statusBtn=btn("Status: $status"){'
          )


          text = text.replace(
              'it.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"',
              'fieldBtn.text="Field: ${if(i==0) "Not linked" else fields[i-1].name}"'
          )


          text = text.replace(
              'it.text="Status: $status"',
              'statusBtn.text="Status: $status"'
          )


          # ========================================================
          # 17. WORK TEMPLATE
          # ========================================================

          text = text.replace(
              'var rateType=app.calculation.normalize(old?.rateType?:"QUANTITY",old?.unit?:"acre"); val rateTypeBtn=btn("Rate type: $rateType"){',
              'var rateType=app.calculation.normalize(old?.rateType?:"QUANTITY",old?.unit?:"acre"); lateinit var rateTypeBtn: TextView; rateTypeBtn=btn("Rate type: $rateType"){'
          )


          # ========================================================
          # 18. CUSTOM REPORT
          # ========================================================

          text = text.replace(
              'val wb=btn("Worker: All"){AlertDialog.Builder(this).setTitle("Worker").setItems((listOf("All")+workers.map{it.name}).toTypedArray()){_,i->wid=if(i==0)"" else workers[i-1].id;it.text="Worker: ${if(i==0)"All" else workers[i-1].name}"}.show()}',
              'lateinit var wb: TextView;wb=btn("Worker: All"){AlertDialog.Builder(this).setTitle("Worker").setItems((listOf("All")+workers.map{it.name}).toTypedArray()){_,i->wid=if(i==0)"" else workers[i-1].id;wb.text="Worker: ${if(i==0)"All" else workers[i-1].name}"}.show()}'
          )


          text = text.replace(
              'val fb=btn("Field: All"){AlertDialog.Builder(this).setTitle("Field").setItems((listOf("All")+fields.map{it.name}).toTypedArray()){_,i->fid=if(i==0)"" else fields[i-1].id;it.text="Field: ${if(i==0)"All" else fields[i-1].name}"}.show()}',
              'lateinit var fb: TextView;fb=btn("Field: All"){AlertDialog.Builder(this).setTitle("Field").setItems((listOf("All")+fields.map{it.name}).toTypedArray()){_,i->fid=if(i==0)"" else fields[i-1].id;fb.text="Field: ${if(i==0)"All" else fields[i-1].name}"}.show()}'
          )


          text = text.replace(
              'val cb=btn("Crop: All"){AlertDialog.Builder(this).setTitle("Crop").setItems((listOf("All")+crops.map{it.name}).toTypedArray()){_,i->cid=if(i==0)"" else crops[i-1].id;it.text="Crop: ${if(i==0)"All" else crops[i-1].name}"}.show()}',
              'lateinit var cb: TextView;cb=btn("Crop: All"){AlertDialog.Builder(this).setTitle("Crop").setItems((listOf("All")+crops.map{it.name}).toTypedArray()){_,i->cid=if(i==0)"" else crops[i-1].id;cb.text="Crop: ${if(i==0)"All" else crops[i-1].name}"}.show()}'
          )


          # ========================================================
          # 19. DEFINITIVE EXPORT FIX
          # ========================================================

          export_start = text.find(
              "contentResolver.openOutputStream(uri)!!.use{out->when(exportType){"
          )


          export_end = text.find(
              "            } else if(req==1002){",
              export_start
          )


          if export_start < 0:
              raise SystemExit(
                  "ERROR: Export block start not found."
              )


          if export_end < 0:
              raise SystemExit(
                  "ERROR: Export block end not found."
              )


          export_block = '''contentResolver.openOutputStream(uri)!!.use{out->when {
                    exportType == "workers"->app.export.csvWorkers(out)
                    exportType == "ledger"->app.export.csvLedger(out)
                    exportType.startsWith("report:")->app.export.csvReport(exportType.removePrefix("report:"),out)
                    exportType.startsWith("reportpdf:")->app.export.pdfReport(exportType.removePrefix("reportpdf:"),out)
                    exportType == "pdf"->app.export.pdfSummary(out)
                    exportType == "backup"->app.backup.export(out)
                }}'''


          text = (
              text[:export_start]
              + export_block
              + text[export_end:]
          )


          # ========================================================
          # 20. RENDER SUMMARY FORWARD REFERENCE
          # ========================================================

          calendar_start = text.find(
              "internal fun MainActivity.attendanceCalendar"
          )


          calendar_end = text.find(
              "internal fun MainActivity.paymentLedger",
              calendar_start
          )


          if (
              calendar_start >= 0
              and calendar_end > calendar_start
          ):

              calendar = text[
                  calendar_start:
                  calendar_end
              ]


              def find_function_end(source, start):

                  brace_start = source.find(
                      "{",
                      start
                  )


                  if brace_start < 0:
                      return -1


                  depth = 0


                  for pos in range(
                      brace_start,
                      len(source)
                  ):

                      if source[pos] == "{":
                          depth += 1

                      elif source[pos] == "}":

                          depth -= 1

                          if depth == 0:
                              return pos + 1


                  return -1


              render_start = calendar.find(
                  "        fun render(){"
              )


              summary_start = calendar.find(
                  "        fun renderSummary(){"
              )


              if (
                  render_start >= 0
                  and summary_start > render_start
              ):

                  render_end = find_function_end(
                      calendar,
                      render_start
                  )


                  summary_end = find_function_end(
                      calendar,
                      summary_start
                  )


                  if (
                      render_end > 0
                      and summary_end > 0
                  ):

                      render_block = calendar[
                          render_start:
                          render_end
                      ]


                      summary_block = calendar[
                          summary_start:
                          summary_end
                      ]


                      calendar = (
                          calendar[:render_start]
                          + summary_block
                          + "\n"
                          + render_block
                          + calendar[summary_end:]
                      )


                      text = (
                          text[:calendar_start]
                          + calendar
                          + text[calendar_end:]
                      )


          # ========================================================
          # 21. SAVE SOURCE
          # ========================================================

          src.write_text(
              text,
              encoding="utf-8"
          )


          print()
          print("============================================================")
          print(" DEFINITIVE V81 SOURCE PATCH COMPLETED")
          print("============================================================")
          print(src)

          PY


      # ============================================================
      # 11. FINAL SOURCE AUDIT
      # ============================================================

      - name: Final Kotlin source audit
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          SRC="$MAIN_ACTIVITY_SCREENS"


          echo "============================================================"
          echo " FINAL KOTLIN SOURCE AUDIT"
          echo "============================================================"


          test -f "$SRC"


          echo
          echo "===== BTN ====="

          grep -n \
            "fun MainActivity.btn" \
            "$SRC" \
            || true


          echo
          echo "===== PICK ====="

          grep -n \
            "fun MainActivity.pick" \
            "$SRC" \
            || true


          echo
          echo "===== WORKER BUTTON ====="

          grep -n \
            "workerBtn" \
            "$SRC" \
            || true


          echo
          echo "===== EXPORT ====="

          grep -n \
            -A12 \
            -B2 \
            "openOutputStream(uri)" \
            "$SRC"


          # --------------------------------------------------------
          # OLD EXPORT
          # --------------------------------------------------------

          if grep -Eq \
            'when[[:space:]]*\([[:space:]]*exportType[[:space:]]*\)' \
            "$SRC"; then

            echo "ERROR: when(exportType) still exists."

            exit 1

          fi


          echo "PASS: export when fixed."


          # --------------------------------------------------------
          # OLD fillViewport
          # --------------------------------------------------------

          if grep -Eq \
            'fillViewport[[:space:]]*=' \
            "$SRC"; then

            echo "ERROR: old fillViewport assignment remains."

            exit 1

          fi


          echo "PASS: ScrollView fixed."


          # --------------------------------------------------------
          # btnRef MUST NOT EXIST
          # --------------------------------------------------------

          if grep -q \
            "btnRef(" \
            "$SRC"; then

            echo "ERROR: btnRef() found."

            exit 1

          fi


          echo "PASS: btnRef not present."


          # --------------------------------------------------------
          # unresolved it.text
          # --------------------------------------------------------

          REMAINING_IT="$(
            grep -n \
              'it.text=' \
              "$SRC" \
              | grep -v \
                'statusViews.values.forEach' \
              || true
          )"


          if [[ -n "$REMAINING_IT" ]]; then

            echo
            echo "ERROR: unresolved it.text remains:"

            echo "$REMAINING_IT"

            exit 1

          fi


          echo "PASS: no unresolved it.text."


          # --------------------------------------------------------
          # workerBtn declaration
          # --------------------------------------------------------

          grep -q \
            'lateinit var workerBtn: TextView' \
            "$SRC"


          grep -q \
            'workerBtn.text="Workers:' \
            "$SRC"


          echo "PASS: workerBtn declaration."


          # --------------------------------------------------------
          # payment buttons
          # --------------------------------------------------------

          grep -q \
            'lateinit var wb: TextView' \
            "$SRC"


          grep -q \
            'lateinit var mb: TextView' \
            "$SRC"


          grep -q \
            'lateinit var adv: TextView' \
            "$SRC"


          echo "PASS: payment button declarations."


          # --------------------------------------------------------
          # rateType button
          # --------------------------------------------------------

          grep -q \
            'rateTypeBtn.text=' \
            "$SRC"


          echo "PASS: rateTypeBtn."


          # --------------------------------------------------------
          # renderSummary
          # --------------------------------------------------------

          grep -q \
            'fun renderSummary()' \
            "$SRC"


          echo "PASS: renderSummary."


          echo
          echo "============================================================"
          echo " FINAL SOURCE AUDIT PASSED"
          echo "============================================================"


      # ============================================================
      # 12. GRADLE ENVIRONMENT
      # ============================================================

      - name: Verify Gradle environment
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "===== JAVA ====="

          java -version


          echo
          echo "===== GRADLE ====="

          gradle --version


          echo
          echo "GRADLE ENVIRONMENT PASSED"


      # ============================================================
      # 13. CLEAN
      # ============================================================

      - name: Clean project
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " CLEAN PROJECT"
          echo "============================================================"


          gradle \
            --no-daemon \
            --stacktrace \
            clean


          echo
          echo "CLEAN PASSED"


      # ============================================================
      # 14. COMPILE RELEASE KOTLIN
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " COMPILE RELEASE KOTLIN"
          echo "============================================================"


          gradle \
            --no-daemon \
            --stacktrace \
            :app:compileReleaseKotlin


          echo
          echo "============================================================"
          echo " COMPILE RELEASE KOTLIN PASSED"
          echo "============================================================"


      # ============================================================
      # 15. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble Release APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " ASSEMBLE RELEASE APK"
          echo "============================================================"


          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease


          echo
          echo "===== GENERATED APK FILES ====="


          find \
            app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            | sort


      # ============================================================
      # 16. LOCATE RELEASE APK
      # ============================================================

      - name: Locate release APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          APK=""


          if [[ -f \
            "app/build/outputs/apk/release/app-release-unsigned.apk"
          ]]; then

            APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          fi


          if [[ -z "$APK" ]]; then

            APK="$(
              find \
                app/build/outputs/apk/release \
                -type f \
                -name "*-unsigned.apk" \
                -print \
                | head -n 1
            )"

          fi


          if [[ -z "$APK" ]]; then

            APK="$(
              find \
                app/build/outputs/apk/release \
                -type f \
                -name "*.apk" \
                -print \
                | head -n 1
            )"

          fi


          if [[ -z "$APK" ]]; then

            echo "ERROR: Release APK not found."

            find \
              app/build/outputs/apk \
              -type f \
              -print \
              || true

            exit 1

          fi


          echo "RELEASE_APK=$APK" \
            >> "$GITHUB_ENV"


          echo
          echo "RELEASE APK:"
          echo "$APK"


          ls -lh "$APK"


      # ============================================================
      # 17. VERIFY APK PACKAGE / VERSION
      # ============================================================

      - name: Verify APK package and version
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/aapt"


          BADGING="$(
            "$AAPT" \
              dump badging \
              "$RELEASE_APK"
          )"


          echo "$BADGING" \
            | grep -E \
              "package: name=|versionCode=|versionName="


          echo "$BADGING" \
            | grep -q \
              "name='${PACKAGE_NAME}'"


          echo "$BADGING" \
            | grep -q \
              "versionCode='${VERSION_CODE}'"


          echo "$BADGING" \
            | grep -q \
              "versionName='${VERSION_NAME}'"


          echo
          echo "APK PACKAGE / VERSION PASSED"


      # ============================================================
      # 18. PREPARE RELEASE SIGNING
      # ============================================================

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " PREPARE RELEASE SIGNING"
          echo "============================================================"


          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "ERROR: KEYSTORE_BASE64 secret missing."
            exit 1
          fi


          if [[ -z "${KEYSTORE_PASSWORD:-}" ]]; then
            echo "ERROR: KEYSTORE_PASSWORD secret missing."
            exit 1
          fi


          if [[ -z "${KEY_ALIAS:-}" ]]; then
            echo "ERROR: KEY_ALIAS secret missing."
            exit 1
          fi


          if [[ -z "${KEY_PASSWORD:-}" ]]; then
            echo "ERROR: KEY_PASSWORD secret missing."
            exit 1
          fi


          SIGN_DIR="$RUNNER_TEMP/release-signing"


          mkdir -p \
            "$SIGN_DIR"


          echo "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$SIGN_DIR/release.keystore"


          test -s \
            "$SIGN_DIR/release.keystore"


          echo "KEYSTORE_PATH=$SIGN_DIR/release.keystore" \
            >> "$GITHUB_ENV"


          echo
          echo "KEYSTORE READY"


      # ============================================================
      # 19. ZIPALIGN
      # ============================================================

      - name: Zipalign Release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " ZIPALIGN RELEASE APK"
          echo "============================================================"


          ZIPALIGN="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/zipalign"


          mkdir -p \
            "$RUNNER_TEMP/apk"


          ALIGNED="$RUNNER_TEMP/apk/Majdoor-Hisaab-PRO-${VERSION_NAME}-aligned.apk"


          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$ANDROID_PROJECT_ROOT/$RELEASE_APK" \
            "$ALIGNED"


          test -s "$ALIGNED"


          echo "ZIPALIGNED_APK=$ALIGNED" \
            >> "$GITHUB_ENV"


          ls -lh "$ALIGNED"


          echo
          echo "ZIPALIGN PASSED"


      # ============================================================
      # 20. SIGN RELEASE APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo " SIGN RELEASE APK"
          echo "============================================================"


          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"


          SIGNED="$RUNNER_TEMP/apk/Majdoor-Hisaab-PRO-${VERSION_NAME}-Release-Signed.apk"


          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$SIGNED" \
            "$ZIPALIGNED_APK"


          test -s "$SIGNED"


          echo "SIGNED_APK=$SIGNED" \
            >> "$GITHUB_ENV"


          ls -lh "$SIGNED"


          echo
          echo "APK SIGNED"


      # ============================================================
      # 21. VERIFY SIGNATURE
