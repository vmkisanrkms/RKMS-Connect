name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_CODE: "82"
  VERSION_NAME: "1.82.0"

  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_HAJRI_PHOTO_PDF_FIXED_FINAL_V9.zip"
  APK_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

jobs:

  build-release:

    name: Build, Sign and Verify Release APK

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ============================================================
      # 4. LOCATE ANDROID SDK
      #
      # Do NOT use android-actions/setup-android@v3 here.
      # This avoids the previous "Failed to find package tools"
      # error.
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT=""

          if [ -n "${ANDROID_SDK_ROOT:-}" ] && \
             [ -d "$ANDROID_SDK_ROOT" ]; then

            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -n "${ANDROID_HOME:-}" ] && \
               [ -d "$ANDROID_HOME" ]; then

            SDK_ROOT="$ANDROID_HOME"

          elif [ -d "/usr/local/lib/android/sdk" ]; then

            SDK_ROOT="/usr/local/lib/android/sdk"

          else

            echo "::error::Android SDK not found."
            exit 1

          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT"

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name "sdkmanager" \
                -print \
                -quit \
                2>/dev/null || true
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 5. ACCEPT ANDROID LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          echo "Android SDK licenses accepted."


      # ============================================================
      # 6. INSTALL ANDROID API 36
      #
      # IMPORTANT:
      # No obsolete "tools" package is requested.
      # ============================================================

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d \
            "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}"

          test -d \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          echo
          echo "Android API ${ANDROID_API}: PASS"
          echo "Build Tools ${BUILD_TOOLS}: PASS"


      # ============================================================
      # 7. VERIFY BUILD ENVIRONMENT
      # ============================================================

      - name: Verify Java Gradle and Android
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "JAVA"
          echo "=============================================="
          java -version

          echo
          echo "=============================================="
          echo "GRADLE"
          echo "=============================================="
          gradle --version

          echo
          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo
          echo "=============================================="
          echo "AAPT2"
          echo "=============================================="
          "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2" version

          echo
          echo "=============================================="
          echo "APKSIGNER"
          echo "=============================================="
          "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner" --version

          echo
          echo "Environment verification: PASS"


      # ============================================================
      # 8. LOCATE V9 ZIP
      # ============================================================

      - name: Locate V9 project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH=""

          if [ -f "$GITHUB_WORKSPACE/${ZIP_NAME}" ]; then

            ZIP_PATH="$GITHUB_WORKSPACE/${ZIP_NAME}"

          else

            ZIP_PATH="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "$ZIP_NAME" \
                -print \
                -quit \
                2>/dev/null || true
            )"

          fi

          if [ -z "$ZIP_PATH" ]; then

            echo "::error::V9 project ZIP not found."

            echo
            echo "Expected ZIP:"
            echo "$ZIP_NAME"

            echo
            echo "Available ZIP files:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print || true

            exit 1

          fi

          echo "PROJECT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "V9 ZIP FOUND"
          echo "=============================================="
          echo "$ZIP_PATH"


      # ============================================================
      # 9. VERIFY ZIP INTEGRITY
      # ============================================================

      - name: Verify V9 ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$PROJECT_ZIP"

          echo
          echo "V9 ZIP integrity: PASS"


      # ============================================================
      # 10. EXTRACT V9 ZIP
      # ============================================================

      - name: Extract V9 project ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_ROOT="$RUNNER_TEMP/majdoor-v9-project"

          rm -rf "$EXTRACT_ROOT"

          mkdir -p "$EXTRACT_ROOT"

          unzip -q \
            "$PROJECT_ZIP" \
            -d "$EXTRACT_ROOT"

          echo "EXTRACT_ROOT=$EXTRACT_ROOT" >> "$GITHUB_ENV"

          echo
          echo "V9 ZIP extraction: PASS"

          echo
          echo "Extracted files:"
          find "$EXTRACT_ROOT" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -500


      # ============================================================
      # 11. LOCATE ANDROID GRADLE PROJECT
      # ============================================================

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find "$EXTRACT_ROOT" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print \
              -quit \
              2>/dev/null || true
          )"

          if [ -z "$SETTINGS_FILE" ]; then

            echo "::error::Gradle settings file not found."

            exit 1

          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "ANDROID PROJECT ROOT"
          echo "=============================================="
          echo "$PROJECT_ROOT"


      # ============================================================
      # 12. VERIFY ANDROID PROJECT STRUCTURE
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            "$PROJECT_ROOT/settings.gradle.kts" \
            || test -f \
            "$PROJECT_ROOT/settings.gradle"

          test -f \
            "$PROJECT_ROOT/build.gradle.kts" \
            || test -f \
            "$PROJECT_ROOT/build.gradle"

          test -f \
            "$PROJECT_ROOT/app/build.gradle.kts" \
            || test -f \
            "$PROJECT_ROOT/app/build.gradle"

          test -f \
            "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          test -f \
            "$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          test -f \
            "$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"

          echo
          echo "Android project structure: PASS"


      # ============================================================
      # 13. VERIFY MAINACTIVITY KOTLIN
      # ============================================================

      - name: Verify MainActivity Kotlin source
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          echo "Checking MainActivity:"
          echo "$MAIN"

          if grep -Fxq \
            "import androidx.compose.foundation.lazy.item" \
            "$MAIN"; then

            echo "::error::Invalid lazy.item import found."

            exit 1

          fi

          if ! grep -Fxq \
            "import androidx.compose.foundation.lazy.items" \
            "$MAIN"; then

            echo "::error::lazy.items import missing."

            exit 1

          fi

          REQUIRED_SYMBOLS="
          fun validDate
          fun today
          fun money
          fun displayDate
          fun Stat
          fun DashboardStat
          fun DashboardModule
          fun LabourScreen
          fun FieldScreen
          fun CropScreen
          fun ExpenseScreen
          fun SaleScreen
          fun AttendanceScreen
          fun FieldDetail
          fun LabourDetail
          fun PaymentDialog
          fun RateDialog
          fun CropDetail
          exportReportPhoto
          exportReportPdf
          ExportButtons
          DeviceCredentialDeleteGate
          "

          while IFS= read -r SYMBOL; do

            SYMBOL="$(echo "$SYMBOL" | xargs)"

            if [ -z "$SYMBOL" ]; then
              continue
            fi

            if ! grep -q "$SYMBOL" "$MAIN"; then

              echo "::error::Required source symbol missing: $SYMBOL"

              exit 1

            fi

          done <<< "$REQUIRED_SYMBOLS"

          echo
          echo "MainActivity source verification: PASS"


      # ============================================================
      # 14. VERIFY FILE PROVIDER
      # ============================================================

      - name: Verify FileProvider reports path
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"

          echo "FileProvider file:"
          echo "$FILE"

          grep -q \
            "cache-path" \
            "$FILE"

          grep -q \
            'path="reports/"' \
            "$FILE"

          echo
          echo "FileProvider reports path: PASS"


      # ============================================================
      # 15. VERIFY PACKAGE / VERSION / SDK
      # ============================================================

      - name: Verify application configuration
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "Application configuration:"
          echo

          grep -n \
            "applicationId" \
            "$APP_GRADLE" \
            || true

          grep -n \
            "versionCode" \
            "$APP_GRADLE" \
            || true

          grep -n \
            "versionName" \
            "$APP_GRADLE" \
            || true

          echo

          grep -Eq \
            'applicationId[[:space:]]*=[[:space:]]*"com\.majdoor\.hisaabpro"' \
            "$APP_GRADLE"

          grep -Eq \
            'versionCode[[:space:]]*=[[:space:]]*82([[:space:]]|$)' \
            "$APP_GRADLE"

          grep -Eq \
            'versionName[[:space:]]*=[[:space:]]*"1\.82\.0"' \
            "$APP_GRADLE"

          grep -Eq \
            'compileSdk[[:space:]]*=?[[:space:]]*36' \
            "$APP_GRADLE"

          grep -Eq \
            'targetSdk[[:space:]]*=?[[:space:]]*36' \
            "$APP_GRADLE"

          grep -Eq \
            'minSdk[[:space:]]*=?[[:space:]]*23' \
            "$APP_GRADLE"

          grep -q \
            "JavaVersion.VERSION_17" \
            "$APP_GRADLE"

          echo
          echo "Package/version/SDK verification: PASS"


      # ============================================================
      # 16. CONFIGURE ANDROID SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          printf \
            'sdk.dir=%s\n' \
            "$ANDROID_SDK_ROOT" \
            > "$PROJECT_ROOT/local.properties"

          echo "local.properties:"
          cat "$PROJECT_ROOT/local.properties"


      # ============================================================
      # 17. CHECK EXISTING PERMANENT SIGNING SECRETS
      #
      # IMPORTANT:
      #
      # These are the EXACT names visible in your GitHub screenshot:
      #
      # RELEASE_KEYSTORE_BASE64
      # RELEASE_KEYSTORE_PASSWORD
      # RELEASE_KEY_ALIAS
      # RELEASE_KEY_PASSWORD
      #
      # ============================================================

      - name: Check permanent signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          MISSING=0

          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then

            echo "::error::Missing secret: RELEASE_KEYSTORE_BASE64"

            MISSING=1

          fi

          if [ -z "${RELEASE_KEYSTORE_PASSWORD:-}" ]; then

            echo "::error::Missing secret: RELEASE_KEYSTORE_PASSWORD"

            MISSING=1

          fi

          if [ -z "${RELEASE_KEY_ALIAS:-}" ]; then

            echo "::error::Missing secret: RELEASE_KEY_ALIAS"

            MISSING=1

          fi

          if [ -z "${RELEASE_KEY_PASSWORD:-}" ]; then

            echo "::error::Missing secret: RELEASE_KEY_PASSWORD"

            MISSING=1

          fi

          if [ "$MISSING" -ne 0 ]; then

            echo
            echo "=============================================="
            echo "PERMANENT SIGNING SECRETS ARE INCOMPLETE"
            echo "=============================================="

            echo
            echo "Required existing secrets:"
            echo "RELEASE_KEYSTORE_BASE64"
            echo "RELEASE_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD"

            echo
            echo "No temporary keystore will be generated."

            exit 1

          fi

          echo
          echo "All permanent signing secrets are PRESENT."


      # ============================================================
      # 18. PREPARE PERMANENT PRODUCTION KEYSTORE
      #
      # NO NEW KEY IS GENERATED.
      # Existing production key is used.
      # ============================================================

      - name: Prepare permanent production signing keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          KEYSTORE_FILE="$RUNNER_TEMP/majdoor-hisaab-pro-production.p12"

          echo "Decoding permanent production keystore..."

          printf '%s' \
            "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          echo
          echo "Verifying keystore and alias..."

          keytool \
            -list \
            -storetype PKCS12 \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            >/dev/null

          echo "Keystore verification: PASS"


          # --------------------------------------------------------
          # Get certificate SHA-256 from permanent keystore.
          # --------------------------------------------------------

          CERT_SHA256="$(
            keytool \
              -list \
              -v \
              -storetype PKCS12 \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$RELEASE_KEYSTORE_PASSWORD" \
              -alias "$RELEASE_KEY_ALIAS" \
              | awk -F': ' \
                '/SHA256:/{print $2; exit}' \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$CERT_SHA256" ]; then

            echo "::error::Could not read production certificate SHA-256."

            exit 1

          fi

          echo
          echo "Production certificate fingerprint found."

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" \
            >> "$GITHUB_ENV"

          echo "RELEASE_CERT_SHA256=$CERT_SHA256" \
            >> "$GITHUB_ENV"

          echo
          echo "Permanent production keystore: PASS"


      # ============================================================
      # 19. GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            clean \
            --no-daemon \
            --stacktrace

          echo "Gradle clean: PASS"


      # ============================================================
      # 20. BUILD SIGNED RELEASE APK
      #
      # The existing permanent production keystore is supplied
      # through environment variables.
      # ============================================================

      - name: Build signed Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          test -f "$KEYSTORE_FILE"

          echo
          echo "=============================================="
          echo "BUILDING SIGNED RELEASE APK"
          echo "=============================================="

          gradle \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info

          echo
          echo "Signed Release APK build: PASS"


      # ============================================================
      # 21. LOCATE FINAL APK
      # ============================================================

      - name: Locate final APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="$(
            find \
              "$PROJECT_ROOT/app/build/outputs/apk/release" \
              -type f \
              -name "*.apk" \
              -print \
              -quit \
              2>/dev/null || true
          )"

          if [ -z "$APK_PATH" ]; then

            echo "::error::Release APK not found."

            echo
            echo "APK directory:"
            find \
              "$PROJECT_ROOT/app/build/outputs/apk" \
              -type f \
              -print \
              2>/dev/null || true

            exit 1

          fi

          FINAL_APK="$RUNNER_TEMP/$APK_NAME"

          cp \
            "$APK_PATH" \
            "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" \
            >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "FINAL APK"
          echo "=============================================="
          echo "$FINAL_APK"

          ls -lh "$FINAL_APK"


      # ============================================================
      # 22. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$FINAL_APK"

          echo
          echo "APK signature verification: PASS"


      # ============================================================
      # 23. VERIFY FINAL APK CERTIFICATE
      #
      # Compares APK certificate against the certificate obtained
      # directly from the permanent production keystore.
      # ============================================================

      - name: Verify final production certificate
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          EXPECTED="$(
            printf '%s' \
              "$RELEASE_CERT_SHA256" \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"

          ACTUAL="$(
            "$APKSIGNER" \
              verify \
              --print-certs \
              "$FINAL_APK" \
              2>&1 \
              | awk -F': ' \
                '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$ACTUAL" ]; then

            echo "::error::Could not read final APK certificate."

            exit 1

          fi

          echo
          echo "Permanent production certificate:"
          echo "$EXPECTED"

          echo
          echo "Final APK certificate:"
          echo "$ACTUAL"

          if [ "$EXPECTED" != "$ACTUAL" ]; then

            echo
            echo "::error::FINAL APK CERTIFICATE MISMATCH."

            echo "APK was NOT signed with the permanent production key."

            exit 1

          fi

          echo
          echo "Permanent production certificate: VERIFIED"


      # ============================================================
      # 24. VERIFY APK ALIGNMENT
      # ============================================================

      - name: Verify APK alignment
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          "$ZIPALIGN" \
            -c \
            -P 16 \
            4 \
            "$FINAL_APK"

          echo
          echo "APK alignment verification: PASS"


      # ============================================================
      # 25. VERIFY APK PACKAGE AND VERSION
      # ============================================================

      - name: Verify final APK package and version
        shell: bash
        run: |
          set -euo pipefail

          AAPT2="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"

          BADGING="$RUNNER_TEMP/badging.txt"

          "$AAPT2" \
            dump \
            badging \
            "$FINAL_APK" \
            > "$BADGING"

          echo
          echo "=============================================="
          echo "APK BADGING"
          echo "=============================================="

          cat "$BADGING"

          echo
          echo "=============================================="
          echo "PACKAGE CHECK"
          echo "=============================================="

          grep -q \
            "package: name='${PACKAGE_NAME}'" \
            "$BADGING"

          echo "Package: PASS"


          echo
          echo "=============================================="
          echo "VERSION CODE CHECK"
          echo "=============================================="

          grep -q \
            "versionCode='${VERSION_CODE}'" \
            "$BADGING"

          echo "Version Code: PASS"


          echo
          echo "=============================================="
          echo "VERSION NAME CHECK"
          echo "=============================================="

          grep -q \
            "versionName='${VERSION_NAME}'" \
            "$BADGING"

          echo "Version Name: PASS"


          echo
          echo "FINAL APK PACKAGE/VERSION: PASS"


      # ============================================================
      # 26. FINAL APK SHA256
      # ============================================================

      - name: Calculate final APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=============================================="
          echo "FINAL APK SHA256"
          echo "=============================================="

          sha256sum "$FINAL_APK"


      # ============================================================
      # 27. CREATE FINAL RELEASE REPORT
      # ============================================================

      - name: Create final release report
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="$RUNNER_TEMP/release"

          rm -rf "$RELEASE_DIR"

          mkdir -p "$RELEASE_DIR"

          cp \
            "$FINAL_APK" \
            "$RELEASE_DIR/$APK_NAME"

          APK_SHA256="$(
            sha256sum "$FINAL_APK" \
            | awk '{print $1}'
          )"

          cat > \
            "$RELEASE_DIR/BUILD-REPORT.txt" <<EOF
MAJDOOR HISAAB PRO V82
FINAL SIGNED RELEASE APK

==============================================

Package:
${PACKAGE_NAME}

Version:
${VERSION_NAME}

Version Code:
${VERSION_CODE}

Java:
${JAVA_VERSION}

Gradle:
${GRADLE_VERSION}

Android API:
${ANDROID_API}

Build Tools:
${BUILD_TOOLS}

ZIP:
${ZIP_NAME}

APK:
${APK_NAME}

Signing:
PERMANENT PRODUCTION KEYSTORE

APK Signature:
VERIFIED

Production Certificate:
VERIFIED

APK Alignment:
VERIFIED

Package:
VERIFIED

Version:
VERIFIED

APK SHA256:
${APK_SHA256}

