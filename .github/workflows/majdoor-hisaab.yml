name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaabpro"
  VERSION_CODE: "82"
  VERSION_NAME: "1.82.0"

  # IMPORTANT: CURRENT FINAL SOURCE ZIP
  ZIP_NAME: "Majdoor_Hisaab_PRO_V82_GANNA_PARCHI_BACKUP_APPLOCK_FINAL_V18.zip"

  APK_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"

jobs:

  build-release:

    name: Build, Sign and Verify Release APK

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ============================================================
      # 3. GRADLE 8.11.1
      # ============================================================

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ============================================================
      # 4. LOCATE ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT=""

          if [ -n "${ANDROID_SDK_ROOT:-}" ] && \
             [ -d "$ANDROID_SDK_ROOT" ]; then

            SDK_ROOT="$ANDROID_SDK_ROOT"

          elif [ -n "${ANDROID_HOME:-}" ] && \
               [ -d "$ANDROID_HOME" ]; then

            SDK_ROOT="$ANDROID_HOME"

          elif [ -d "/usr/local/lib/android/sdk" ]; then

            SDK_ROOT="/usr/local/lib/android/sdk"

          else

            echo "::error::Android SDK not found."
            exit 1

          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -z "$SDKMANAGER" ]; then

            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name "sdkmanager" \
                -print \
                -quit \
                2>/dev/null || true
            )"

          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 5. ACCEPT ANDROID LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          echo "Android SDK licenses accepted."


      # ============================================================
      # 6. INSTALL ANDROID API 36
      # ============================================================

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          test -d \
            "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}"

          test -d \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          echo "Android API ${ANDROID_API}: PASS"
          echo "Build Tools ${BUILD_TOOLS}: PASS"


      # ============================================================
      # 7. VERIFY ENVIRONMENT
      # ============================================================

      - name: Verify Java Gradle Android
        shell: bash
        run: |
          set -euo pipefail

          echo "================ JAVA ================"
          java -version

          echo
          echo "================ GRADLE ================"
          gradle --version

          echo
          echo "================ ANDROID ================"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo
          echo "================ AAPT2 ================"
          "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2" version

          echo
          echo "================ APKSIGNER ================"
          "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner" --version

          echo
          echo "Environment verification: PASS"


      # ============================================================
      # 8. LOCATE V18 SOURCE ZIP
      # ============================================================

      - name: Locate V18 project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH=""

          if [ -f "$GITHUB_WORKSPACE/${ZIP_NAME}" ]; then

            ZIP_PATH="$GITHUB_WORKSPACE/${ZIP_NAME}"

          else

            ZIP_PATH="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "$ZIP_NAME" \
                -print \
                -quit \
                2>/dev/null || true
            )"

          fi

          if [ -z "$ZIP_PATH" ]; then

            echo "::error::V18 project ZIP not found."

            echo
            echo "EXPECTED:"
            echo "$ZIP_NAME"

            echo
            echo "AVAILABLE ZIP FILES:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -iname "*.zip" \
              -print || true

            exit 1

          fi

          echo "PROJECT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"

          echo
          echo "=============================================="
          echo "V18 PROJECT ZIP FOUND"
          echo "=============================================="
          echo "$ZIP_PATH"

          ls -lh "$ZIP_PATH"


      # ============================================================
      # 9. VERIFY V18 ZIP
      # ============================================================

      - name: Verify V18 ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$PROJECT_ZIP"

          echo
          echo "V18 ZIP integrity: PASS"


      # ============================================================
      # 10. EXTRACT V18 ZIP
      # ============================================================

      - name: Extract V18 project ZIP
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_ROOT="$RUNNER_TEMP/majdoor-v18-project"

          rm -rf "$EXTRACT_ROOT"

          mkdir -p "$EXTRACT_ROOT"

          unzip -q \
            "$PROJECT_ZIP" \
            -d "$EXTRACT_ROOT"

          echo "EXTRACT_ROOT=$EXTRACT_ROOT" >> "$GITHUB_ENV"

          echo "V18 ZIP extraction: PASS"


      # ============================================================
      # 11. LOCATE ANDROID PROJECT
      # ============================================================

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(
            find "$EXTRACT_ROOT" \
              -type f \
              \( \
                -name "settings.gradle.kts" \
                -o \
                -name "settings.gradle" \
              \) \
              -print \
              -quit \
              2>/dev/null || true
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo
          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"


      # ============================================================
      # 12. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            "$PROJECT_ROOT/settings.gradle.kts" \
            || test -f \
            "$PROJECT_ROOT/settings.gradle"

          test -f \
            "$PROJECT_ROOT/build.gradle.kts" \
            || test -f \
            "$PROJECT_ROOT/build.gradle"

          test -f \
            "$PROJECT_ROOT/app/build.gradle.kts" \
            || test -f \
            "$PROJECT_ROOT/app/build.gradle"

          test -f \
            "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          test -f \
            "$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          test -f \
            "$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"

          echo "Android project structure: PASS"


      # ============================================================
      # 13. VERIFY MAIN ACTIVITY
      # ============================================================

      - name: Verify MainActivity Kotlin source
        shell: bash
        run: |
          set -euo pipefail

          MAIN="$PROJECT_ROOT/app/src/main/java/com/majdoor/hisaabpro/MainActivity.kt"

          if grep -Fxq \
            "import androidx.compose.foundation.lazy.item" \
            "$MAIN"; then

            echo "::error::Invalid lazy.item import found."
            exit 1

          fi

          if ! grep -Fxq \
            "import androidx.compose.foundation.lazy.items" \
            "$MAIN"; then

            echo "::error::lazy.items import missing."
            exit 1

          fi

          REQUIRED_SYMBOLS="
          fun validDate
          fun today
          fun money
          fun displayDate
          fun Stat
          fun DashboardStat
          fun DashboardModule
          fun LabourScreen
          fun FieldScreen
          fun CropScreen
          fun ExpenseScreen
          fun SaleScreen
          fun AttendanceScreen
          fun FieldDetail
          fun LabourDetail
          fun PaymentDialog
          fun RateDialog
          fun CropDetail
          exportReportPhoto
          exportReportPdf
          ExportButtons
          DeviceCredentialDeleteGate
          "

          while IFS= read -r SYMBOL; do

            SYMBOL="$(echo "$SYMBOL" | xargs)"

            if [ -z "$SYMBOL" ]; then
              continue
            fi

            if ! grep -q "$SYMBOL" "$MAIN"; then

              echo "::error::Required source symbol missing: $SYMBOL"

              exit 1

            fi

          done <<< "$REQUIRED_SYMBOLS"

          echo "MainActivity source verification: PASS"


      # ============================================================
      # 14. VERIFY FILE PROVIDER
      # ============================================================

      - name: Verify FileProvider reports path
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/src/main/res/xml/file_paths.xml"

          grep -q \
            "cache-path" \
            "$FILE"

          grep -q \
            'path="reports/"' \
            "$FILE"

          echo "FileProvider reports path: PASS"


      # ============================================================
      # 15. VERIFY PACKAGE VERSION SDK
      # ============================================================

      - name: Verify application configuration
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "Application configuration:"
          echo

          grep -n "applicationId" "$APP_GRADLE" || true
          grep -n "versionCode" "$APP_GRADLE" || true
          grep -n "versionName" "$APP_GRADLE" || true
          grep -n "compileSdk" "$APP_GRADLE" || true
          grep -n "targetSdk" "$APP_GRADLE" || true
          grep -n "minSdk" "$APP_GRADLE" || true

          grep -Eq \
            'applicationId[[:space:]]*=[[:space:]]*"com\.majdoor\.hisaabpro"' \
            "$APP_GRADLE"

          grep -Eq \
            'versionCode[[:space:]]*=[[:space:]]*82([[:space:]]|$)' \
            "$APP_GRADLE"

          grep -Eq \
            'versionName[[:space:]]*=[[:space:]]*"1\.82\.0"' \
            "$APP_GRADLE"

          grep -Eq \
            'compileSdk[[:space:]]*=?[[:space:]]*36' \
            "$APP_GRADLE"

          grep -Eq \
            'targetSdk[[:space:]]*=?[[:space:]]*36' \
            "$APP_GRADLE"

          grep -Eq \
            'minSdk[[:space:]]*=?[[:space:]]*23' \
            "$APP_GRADLE"

          grep -q \
            "JavaVersion.VERSION_17" \
            "$APP_GRADLE"

          echo "Application configuration: PASS"


      # ============================================================
      # 16. CONFIGURE ANDROID SDK
      # ============================================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          printf 'sdk.dir=%s\n' \
            "$ANDROID_SDK_ROOT" \
            > "$PROJECT_ROOT/local.properties"

          cat "$PROJECT_ROOT/local.properties"


      # ============================================================
      # 17. CHECK PERMANENT SIGNING SECRETS
      # ============================================================

      - name: Check permanent signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          MISSING=0

          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing secret: RELEASE_KEYSTORE_BASE64"
            MISSING=1
          fi

          if [ -z "${RELEASE_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Missing secret: RELEASE_KEYSTORE_PASSWORD"
            MISSING=1
          fi

          if [ -z "${RELEASE_KEY_ALIAS:-}" ]; then
            echo "::error::Missing secret: RELEASE_KEY_ALIAS"
            MISSING=1
          fi

          if [ -z "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "::error::Missing secret: RELEASE_KEY_PASSWORD"
            MISSING=1
          fi

          if [ "$MISSING" -ne 0 ]; then

            echo
            echo "=============================================="
            echo "PERMANENT SIGNING SECRETS INCOMPLETE"
            echo "=============================================="

            echo "Required secrets:"
            echo "RELEASE_KEYSTORE_BASE64"
            echo "RELEASE_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD"

            exit 1

          fi

          echo "All permanent signing secrets are PRESENT."


      # ============================================================
      # 18. PREPARE PERMANENT KEYSTORE
      # ============================================================

      - name: Prepare permanent production signing keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}

        run: |
          set -euo pipefail

          KEYSTORE_FILE="$RUNNER_TEMP/majdoor-hisaab-pro-production.p12"

          printf '%s' \
            "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE_FILE"

          chmod 600 "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          keytool \
            -list \
            -storetype PKCS12 \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            >/dev/null

          CERT_SHA256="$(
            keytool \
              -list \
              -v \
              -storetype PKCS12 \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$RELEASE_KEYSTORE_PASSWORD" \
              -alias "$RELEASE_KEY_ALIAS" \
              | awk -F': ' '/SHA256:/{print $2; exit}' \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Production certificate SHA-256 could not be read."
            exit 1
          fi

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "RELEASE_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

          echo "Permanent production keystore: PASS"


      # ============================================================
      # 19. GRADLE SIGNING INIT SCRIPT
      # ============================================================

      - name: Configure Gradle release signing
        shell: bash
        run: |
          set -euo pipefail

          INIT_SCRIPT="$RUNNER_TEMP/majdoor-release-signing.init.gradle"

          cat > "$INIT_SCRIPT" <<'GRADLE_INIT'
          allprojects { project ->

              project.afterEvaluate {

                  def android =
                      project.extensions.findByName("android")

                  if (android != null && project.name == "app") {

                      def releaseConfig =
                          android.signingConfigs.findByName("release")

                      if (releaseConfig == null) {
                          releaseConfig =
                              android.signingConfigs.create("release")
                      }

                      def keystorePath =
                          System.getenv("RELEASE_KEYSTORE_FILE")

                      def storePassword =
                          System.getenv("RELEASE_KEYSTORE_PASSWORD")

                      def keyAlias =
                          System.getenv("RELEASE_KEY_ALIAS")

                      def keyPassword =
                          System.getenv("RELEASE_KEY_PASSWORD")

                      if (!keystorePath ||
                          !storePassword ||
                          !keyAlias ||
                          !keyPassword) {

                          throw new GradleException(
                              "Permanent release signing environment is incomplete."
                          )
                      }

                      releaseConfig.storeFile =
                          project.file(keystorePath)

                      releaseConfig.storePassword =
                          storePassword

                      releaseConfig.keyAlias =
                          keyAlias

                      releaseConfig.keyPassword =
                          keyPassword

                      def releaseBuildType =
                          android.buildTypes.findByName("release")

                      if (releaseBuildType != null) {

                          releaseBuildType.signingConfig =
                              releaseConfig

                      }

                      println("")
                      println("==============================================")
                      println("PERMANENT RELEASE SIGNING CONFIGURED")
                      println("==============================================")
                      println("Keystore : CONFIGURED")
                      println("Alias    : CONFIGURED")
                      println("Password : CONFIGURED")
                      println("Release  : CONFIGURED")
                      println("==============================================")
                  }
              }
          }
          GRADLE_INIT

          chmod 600 "$INIT_SCRIPT"

          echo "GRADLE_SIGNING_INIT=$INIT_SCRIPT" >> "$GITHUB_ENV"

          echo "Gradle permanent signing configuration: CREATED"


      # ============================================================
      # 20. SIGNING ENVIRONMENT
      # ============================================================

      - name: Configure signing environment
        shell: bash
        run: |
          set -euo pipefail

          echo "RELEASE_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "Permanent signing environment configured."


      # ============================================================
      # 21. GRADLE CLEAN
      # ============================================================

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        env:
          RELEASE_KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          gradle \
            -I "$GRADLE_SIGNING_INIT" \
            clean \
            --no-daemon \
            --stacktrace

          echo "Gradle clean: PASS"


      # ============================================================
      # 22. BUILD RELEASE APK
      # ============================================================

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        env:
          RELEASE_KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          LOG_FILE="$RUNNER_TEMP/majdoor-release-build.log"

          echo "=============================================="
          echo "BUILD RELEASE APK"
          echo "=============================================="

          set +e

          gradle \
            -I "$GRADLE_SIGNING_INIT" \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$LOG_FILE"

          BUILD_EXIT=${PIPESTATUS[0]}

          set -e

          echo
          echo "Gradle exit code: $BUILD_EXIT"

          if [ "$BUILD_EXIT" -ne 0 ]; then

            echo
            echo "=============================================="
            echo "IMPORTANT BUILD ERRORS"
            echo "=============================================="

            grep -nE \
              'storePassword|keyPassword|storeFile|signingConfig|e: |Unresolved reference|Type mismatch|Compilation error|FAILED|FAILURE' \
              "$LOG_FILE" \
              | tail -n 300 || true

            echo
            echo "=============================================="
            echo "LAST BUILD LOG"
            echo "=============================================="

            tail -n 300 "$LOG_FILE"

            exit "$BUILD_EXIT"

          fi

          echo
          echo "=============================================="
          echo "RELEASE BUILD PASSED"
          echo "=============================================="


      # ============================================================
      # 23. LOCATE RELEASE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail

          RAW_APK="$(
            find \
              "$PROJECT_ROOT/app/build/outputs/apk/release" \
              -type f \
              -name "*.apk" \
              -print \
              -quit \
              2>/dev/null || true
          )"

          if [ -z "$RAW_APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo "RAW_APK=$RAW_APK" >> "$GITHUB_ENV"

          echo
          echo "RELEASE APK:"
          echo "$RAW_APK"

          ls -lh "$RAW_APK"


      # ============================================================
      # 24. VERIFY APK SIGNATURE
      # ============================================================

      - name: Verify Gradle release signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$RAW_APK"

          echo
          echo "Gradle release APK signature: PASS"


      # ============================================================
      # 25. VERIFY PERMANENT CERTIFICATE
      # ============================================================

      - name: Verify permanent production certificate
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          EXPECTED="$(
            printf '%s' \
              "$RELEASE_CERT_SHA256" \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"

          ACTUAL="$(
            "$APKSIGNER" \
              verify \
              --print-certs \
              "$RAW_APK" \
              2>&1 \
              | awk -F': ' \
                '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' \
              | tr -d ' :\r\n' \
              | tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read APK certificate."
            exit 1
          fi

          echo
          echo "Expected production certificate:"
          echo "$EXPECTED"

          echo
          echo "APK certificate:"
          echo "$ACTUAL"

          if [ "$EXPECTED" != "$ACTUAL" ]; then

            echo "::error::PRODUCTION CERTIFICATE MISMATCH."
            echo "::error::APK was not signed with permanent production key."

            exit 1

          fi

          echo
          echo "Permanent production certificate: VERIFIED"


      # ============================================================
      # 26. VERIFY APK ALIGNMENT
      # ============================================================

      - name: Verify APK alignment
        shell: bash
        run: |
          set -euo pipefail

          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/zipalign"

          "$ZIPALIGN" \
            -c \
            -P 16 \
            -v \
            4 \
            "$RAW_APK"

          echo
          echo "APK alignment: PASS"


      # ============================================================
      # 27. PREPARE FINAL APK
      # ============================================================

      - name: Prepare final release APK
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="$RUNNER_TEMP/release"

          rm -rf "$RELEASE_DIR"

          mkdir -p "$RELEASE_DIR"

          FINAL_APK="$RELEASE_DIR/$APK_NAME"

          cp \
            "$RAW_APK" \
            "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          test -f "$FINAL_APK"

          ls -lh "$FINAL_APK"


      # ============================================================
      # 28. VERIFY PACKAGE VERSION
      # ============================================================

      - name: Verify final APK package and version
        shell: bash
        run: |
          set -euo pipefail

          AAPT2="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt2"

          BADGING="$RUNNER_TEMP/badging.txt"

          "$AAPT2" \
            dump \
            badging \
            "$FINAL_APK" \
            > "$BADGING"

          echo "=============================================="
          echo "APK BADGING"
          echo "=============================================="

          cat "$BADGING"

          grep -q \
            "package: name='${PACKAGE_NAME}'" \
            "$BADGING"

          grep -q \
            "versionCode='${VERSION_CODE}'" \
            "$BADGING"

          grep -q \
            "versionName='${VERSION_NAME}'" \
            "$BADGING"

          echo
          echo "FINAL APK PACKAGE/VERSION: PASS"


      # ============================================================
      # 29. FINAL SIGNATURE CHECK
      # ============================================================

      - name: Final APK signature verification
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/apksigner"

          "$APKSIGNER" \
            verify \
            --verbose \
            --print-certs \
            "$FINAL_APK"

          echo
          echo "FINAL APK SIGNATURE: VERIFIED"


      # ============================================================
      # 30. FINAL SHA256
      # ============================================================

      - name: Calculate final APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK_SHA256="$(
            sha256sum "$FINAL_APK" \
            | awk '{print $1}'
          )"

          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"

          echo
          echo "FINAL APK SHA256:"
          echo "$APK_SHA256"


      # ============================================================
      # 31. FINAL RELEASE REPORT
      # ============================================================

      - name: Create final release report
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="$RUNNER_TEMP/release"

          printf '%s\n' \
            "MAJDOOR HISAAB PRO V82" \
            "FINAL SIGNED RELEASE APK" \
            "" \
            "==============================================" \
            "" \
            "Package:" \
            "${PACKAGE_NAME}" \
            "" \
            "Version:" \
            "${VERSION_NAME}" \
            "" \
            "Version Code:" \
            "${VERSION_CODE}" \
            "" \
            "Java:" \
            "${JAVA_VERSION}" \
            "" \
            "Gradle:" \
            "${GRADLE_VERSION}" \
            "" \
            "Android API:" \
            "${ANDROID_API}" \
            "" \
            "Build Tools:" \
            "${BUILD_TOOLS}" \
            "" \
            "Source ZIP:" \
            "${ZIP_NAME}" \
            "" \
            "APK:" \
            "${APK_NAME}" \
            "" \
            "Signing:" \
            "PERMANENT PRODUCTION KEY" \
            "" \
            "APK Signature:" \
            "VERIFIED" \
            "" \
            "Production Certificate:" \
            "VERIFIED" \
            "" \
            "APK Alignment:" \
            "VERIFIED" \
            "" \
            "Package:" \
            "VERIFIED" \
            "" \
            "Version:" \
            "VERIFIED" \
            "" \
            "APK SHA256:" \
            "${APK_SHA256}" \
            "" \
            "BUILD STATUS:" \
            "SUCCESS" \
            "" \
            "==============================================" \
            > "$RELEASE_DIR/BUILD-REPORT.txt"

          printf '%s  %s\n' \
            "$APK_SHA256" \
            "$APK_NAME" \
            > "$RELEASE_DIR/SHA256SUMS.txt"

          cat "$RELEASE_DIR/BUILD-REPORT.txt"

          echo
          echo "SHA256:"
          cat "$RELEASE_DIR/SHA256SUMS.txt"


      # ============================================================
      # 32. UPLOAD FINAL APK
      # ============================================================

      - name: Upload Final Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED
          path: |
            ${{ runner.temp }}/release/${{ env.APK_NAME }}
            ${{ runner.temp }}/release/BUILD-REPORT.txt
            ${{ runner.temp }}/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 33. FINAL SUCCESS
      # ============================================================

      - name: Final success summary
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "================================================"
          echo "       MAJDOOR HISAAB PRO V82"
          echo "       FINAL BUILD SUCCESS"
          echo "================================================"
          echo
          echo "Package:"
          echo "$PACKAGE_NAME"
          echo
          echo "Version:"
          echo "$VERSION_NAME ($VERSION_CODE)"
          echo
          echo "Source ZIP:"
          echo "$ZIP_NAME"
          echo
          echo "APK:"
          echo "$APK_NAME"
          echo
          echo "Signing:"
          echo "PERMANENT PRODUCTION KEY"
          echo
          echo "Certificate:"
          echo "VERIFIED"
          echo
          echo "Signature:"
          echo "VERIFIED"
          echo
          echo "Alignment:"
          echo "VERIFIED"
          echo
          echo "================================================"


      # ============================================================
      # 34. CLEANUP
      # ============================================================

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${KEYSTORE_FILE:-}" ] && \
             [ -f "$KEYSTORE_FILE" ]; then

            rm -f "$KEYSTORE_FILE"

          fi

          if [ -n "${GRADLE_SIGNING_INIT:-}" ] && \
             [ -f "$GRADLE_SIGNING_INIT" ]; then

            rm -f "$GRADLE_SIGNING_INIT"

          fi

          echo "Temporary signing material cleaned."
