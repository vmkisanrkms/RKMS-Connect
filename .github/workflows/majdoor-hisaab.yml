name: Build Majdoor Hisaab PRO V27 v2.10 FINAL APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-v27-release
  cancel-in-progress: true

jobs:
  build:
    name: V27 v2.10 FINAL Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find exact V27 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="Majdoor_Hisaab_PRO_V27_FULL_AUDITED_V5.zip"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "ERROR: Required ZIP not found: $ZIP_NAME"
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          ls -lh "$ZIP_NAME"

      - name: Verify ZIP structure
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="Majdoor_Hisaab_PRO_V27_FULL_AUDITED_V5.zip"

          required_files=(
            "src/settings.gradle.kts"
            "src/build.gradle.kts"
            "src/gradle.properties"
            "src/gradlew"
            "src/app/build.gradle.kts"
            "src/app/src/main/AndroidManifest.xml"
            "src/app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
          )

          for f in "${required_files[@]}"; do
            unzip -l "$ZIP_NAME" | grep -Fq "$f" || {
              echo "ERROR: Missing ZIP entry: $f"
              exit 1
            }
          done

          echo "ZIP STRUCTURE PASS"

      - name: Extract V27 source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/v27-source"
          mkdir -p "$GITHUB_WORKSPACE/v27-source"

          unzip -q \
            "Majdoor_Hisaab_PRO_V27_FULL_AUDITED_V5.zip" \
            -d "$GITHUB_WORKSPACE/v27-source"

          test -f "$GITHUB_WORKSPACE/v27-source/src/gradlew"

      - name: Set project root
        shell: bash
        run: |
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/v27-source/src" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          required_files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "gradlew"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
            "gradle/wrapper/gradle-wrapper.properties"
            "gradle/wrapper/gradle-wrapper.jar"
          )

          for f in "${required_files[@]}"; do
            test -f "$f" || {
              echo "ERROR: Missing $f"
              exit 1
            }
          done

          chmod +x gradlew

      - name: Verify settings
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Eq \
            'rootProject\.name[[:space:]]*=[[:space:]]*"MajdoorHisaab"' \
            settings.gradle.kts

          grep -Fq \
            'include(":app")' \
            settings.gradle.kts

          echo "SETTINGS PASS"

      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq '8.9.1' build.gradle.kts
          grep -Fq '2.1.20' build.gradle.kts
          grep -Fq '8.11.1' gradle/wrapper/gradle-wrapper.properties

          echo "GRADLE CONFIG PASS"

      - name: Verify app configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq \
            'namespace = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -Fq \
            'applicationId = "com.majdoor.hisaab"' \
            app/build.gradle.kts

          grep -Fq \
            'compileSdk = 35' \
            app/build.gradle.kts

          grep -Fq \
            'minSdk = 26' \
            app/build.gradle.kts

          grep -Fq \
            'targetSdk = 35' \
            app/build.gradle.kts

          grep -Fq \
            'versionCode = 30' \
            app/build.gradle.kts

          grep -Fq \
            'versionName = "2.10"' \
            app/build.gradle.kts

          grep -Fq \
            'JavaVersion.VERSION_17' \
            app/build.gradle.kts

          grep -Fq \
            'jvmTarget = "17"' \
            app/build.gradle.kts

          echo "APP CONFIG PASS"

      - name: Verify AndroidManifest
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          MANIFEST="app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          grep -Fq \
            'android:exported="true"' \
            "$MANIFEST"

          grep -Fq \
            'android:name=".MainActivity"' \
            "$MANIFEST"

          grep -Fq \
            'android.intent.action.MAIN' \
            "$MANIFEST"

          grep -Fq \
            'android.intent.category.LAUNCHER' \
            "$MANIFEST"

          echo "ANDROID MANIFEST PASS"

      - name: Verify MainActivity package
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq \
            'package com.majdoor.hisaab' \
            app/src/main/java/com/majdoor/hisaab/MainActivity.kt

          echo "MAIN ACTIVITY PACKAGE PASS"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq \
            'gradle-8.11.1-bin.zip' \
            gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          ./gradlew --version

      - name: Verify release signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

          echo "SIGNING SECRETS PASS"

      - name: Restore permanent release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          test -s release-keystore.jks

          cat >> gradle.properties <<EOF

          releaseStoreFile=$PROJECT_ROOT/release-keystore.jks
          releaseStorePassword=$RELEASE_KEYSTORE_PASSWORD
          releaseKeyAlias=$RELEASE_KEY_ALIAS
          releaseKeyPassword=$RELEASE_KEY_PASSWORD
          EOF

          echo "KEYSTORE RESTORE PASS"

      - name: Verify signing configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          grep -Fq \
            'signingConfigs' \
            app/build.gradle.kts

          grep -Fq \
            'releaseStoreFile' \
            app/build.gradle.kts

          grep -Fq \
            'releaseStorePassword' \
            app/build.gradle.kts

          grep -Fq \
            'releaseKeyAlias' \
            app/build.gradle.kts

          grep -Fq \
            'releaseKeyPassword' \
            app/build.gradle.kts

          echo "SIGNING CONFIG PASS"

      - name: Fix only previously failed MainActivity source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
          )

          lines = path.read_text(
              encoding="utf-8"
          ).splitlines()

          replacements = {

              938: '''            Hotspot("Home Nav",0f,91f,20f,9f){home()},Hotspot("Attendance Nav",20f,91f,20f,9f){attendance()},Hotspot("Workers Nav",40f,91f,20f,9f){workers()},Hotspot("Fields Nav",60f,91f,20f,9f){fields()},Hotspot("Reports Nav",80f,91f,20f,9f){reports()}''',

              1033: '''            Hotspot("Back",0f,0f,12f,10f){reports()}, Hotspot("Prev",5f,8f,25f,8f){dailyShift(-1,fieldFilter)}, Hotspot("Next",70f,8f,25f,8f){dailyShift(1,fieldFilter)},''',

              1034: '''            Hotspot(tr("All Fields","सभी खेत"),5f,17f,25f,7f){dailyReport()}, Hotspot("Paddy",32f,17f,20f,7f){dailyReport("Paddy")}, Hotspot("Sugarcane",54f,17f,22f,7f){dailyReport("Sugarcane")}, Hotspot("Banana",77f,17f,18f,7f){dailyReport("Banana")},''',

              1035: '''            Hotspot("Paddy row",5f,30f,90f,12f){dailyReport(fieldFilter)}, Hotspot("Sugarcane row",5f,43f,90f,12f){dailyReport(fieldFilter)}, Hotspot("Banana row",5f,56f,90f,12f){dailyReport(fieldFilter)}, Hotspot("Mustard row",5f,69f,90f,12f){dailyReport(fieldFilter)},''',

              1036: '''            Hotspot("Home Nav",0f,91f,20f,9f){home()},Hotspot("Attendance Nav",20f,91f,20f,9f){attendance()},Hotspot("Workers Nav",40f,91f,20f,9f){workers()},Hotspot("Fields Nav",60f,91f,20f,9f){fields()},Hotspot("Reports Nav",80f,91f,20f,9f){reports()}''',

              1077: '''        val lp=FrameLayout.LayoutParams(-1,0).apply{height=pxY(61f);leftMargin=pxX(3f);topMargin=pxY(28f)}''',

              1211: '''            Hotspot("Back",0f,0f,12f,10f){home()}, Hotspot("Create Backup",8f,14f,40f,15f){createBackup()}, Hotspot("Restore Backup",52f,14f,40f,15f){pickRestore()},''',

              1212: '''            Hotspot("Currency",8f,48f,84f,8f){currencyDialog()}, Hotspot("Language",8f,57f,84f,8f){languageDialog()}, Hotspot("Theme",8f,66f,84f,8f){themeDialog()}, Hotspot("Reset",8f,74f,84f,8f){confirmResetReference()}'''
          }

          for lineno, replacement in replacements.items():

              index = lineno - 1

              if index >= len(lines):
                  raise SystemExit(
                      f"ERROR: Source line {lineno} does not exist"
                  )

              original = lines[index]

              if lineno == 1077:

                  expected = (
                      "height=pxY(61);"
                      "leftMargin=pxX(3);"
                      "topMargin=pxY(28)"
                  )

                  if expected not in original:
                      raise SystemExit(
                          "ERROR: Expected original line 1077 was not found"
                      )

              else:

                  if "Hotspot(" not in original:
                      raise SystemExit(
                          f"ERROR: Expected Hotspot source at line {lineno} was not found"
                      )

              lines[index] = replacement

          text = "\n".join(lines) + "\n"

          if "private fun reportWorkerWhere(" not in text:

              marker = "    private fun shareReportSummary(){"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: shareReportSummary() not found"
                  )

              function = "\n".join([
                  '    private fun reportWorkerWhere(alias:String="w"):Pair<String,List<String>>{',
                  '        val clauses=mutableListOf("$alias.date BETWEEN ? AND ?")',
                  '        val args=mutableListOf(reportFrom,reportTo)',
                  '',
                  '        if(reportWorkerQuery.isNotBlank()){',
                  '            clauses.add("$alias.worker_id IN (SELECT id FROM workers WHERE lower(name) LIKE ? OR lower(code) LIKE ?)")',
                  '            val qv="%${reportWorkerQuery.lowercase(Locale.getDefault())}%"',
                  '            args.add(qv)',
                  '            args.add(qv)',
                  '        }',
                  '',
                  '        if(reportFieldIds.isNotEmpty()){',
                  '            clauses.add("$alias.field_id IN (${reportFieldIds.joinToString(",")})")',
                  '        }',
                  '',
                  '        return clauses.joinToString(" AND ") to args',
                  '    }',
                  ''
              ]) + "\n"

              text = text.replace(
                  marker,
                  function + marker,
                  1
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "ONLY PREVIOUSLY REQUIRED SOURCE AREAS FIXED"
          )
          PY

      - name: Verify exact source fixes
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          FILE="app/src/main/java/com/majdoor/hisaab/MainActivity.kt"

          grep -Fq \
            'Hotspot("Home Nav",0f,91f,20f,9f)' \
            "$FILE"

          grep -Fq \
            'Hotspot("Back",0f,0f,12f,10f){reports()}' \
            "$FILE"

          grep -Fq \
            'Hotspot("Prev",5f,8f,25f,8f){dailyShift(-1,fieldFilter)}' \
            "$FILE"

          grep -Fq \
            'height=pxY(61f);leftMargin=pxX(3f);topMargin=pxY(28f)' \
            "$FILE"

          grep -Fq \
            'Hotspot("Create Backup",8f,14f,40f,15f)' \
            "$FILE"

          grep -Fq \
            'private fun reportWorkerWhere(alias:String="w")' \
            "$FILE"

          grep -Fq \
            'reportWorkerWhere("w")' \
            "$FILE"

          echo "EXACT SOURCE FIX PASS"

      - name: Clean
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          ./gradlew clean --no-daemon

      # ============================================================
      # ONLY FAILED STEP REPLACED
      #
      # Previous failure:
      # SyntaxError: no binding for nonlocal 'count' found
      #
      # FIX:
      # count is now a mutable list instead of using invalid
      # "nonlocal" at module scope.
      #
      # No step before this has been changed.
      # ============================================================

      - name: Build FINAL Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/src/main/java/com/majdoor/hisaab/MainActivity.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          pattern = re.compile(
              r'Hotspot\((.*?),(-?\d+),(-?\d+),(-?\d+),(-?\d+)(?=\))'
          )

          count = [0]

          def fix(match):
              count[0] += 1

              return (
                  f"Hotspot({match.group(1)},"
                  f"{match.group(2)}f,"
                  f"{match.group(3)}f,"
                  f"{match.group(4)}f,"
                  f"{match.group(5)}f"
              )

          fixed_text = pattern.sub(
              fix,
              text
          )

          path.write_text(
              fixed_text,
              encoding="utf-8"
          )

          print(
              f"BUILD SOURCE CHECK: converted "
              f"{count[0]} remaining integer Hotspot coordinate groups"
          )

          remaining = pattern.search(
              fixed_text
          )

          if remaining:
              raise SystemExit(
                  "ERROR: Integer Hotspot coordinates still remain before release build"
              )

          print(
              "BUILD SOURCE FLOAT CHECK PASS"
          )
          PY

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          echo "FINAL RELEASE APK CREATED"
          ls -lh "$APK"

      - name: Verify final artifact
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -f \
            app/build/outputs/apk/release/app-release.apk

          if find app/build/outputs -type f \
            \( -name "*debug*.apk" -o -name "*.aab" \) \
            | grep -q .; then

            echo "ERROR: Debug APK or AAB found"

            find app/build/outputs -type f \
              \( -name "*debug*.apk" -o -name "*.aab" \)

            exit 1
          fi

          echo "FINAL ARTIFACT PASS"

      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/release/app-release.apk"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" \
            | tee /tmp/aapt.txt

          grep -Fq \
            "package: name='com.majdoor.hisaab'" \
            /tmp/aapt.txt

          grep -Fq \
            "versionCode='30'" \
            /tmp/aapt.txt

          grep -Fq \
            "versionName='2.10'" \
            /tmp/aapt.txt

          echo "PACKAGE VERSION PASS"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            app/build/outputs/apk/release/app-release.apk

          echo "SIGNATURE PASS"

      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          sha256sum \
            app/build/outputs/apk/release/app-release.apk \
            | tee APK_SHA256.txt

      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          cp \
            app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/Majdoor_Hisaab_PRO_V27_v2.10_FINAL_RELEASE.apk"

          cp \
            APK_SHA256.txt \
            "$GITHUB_WORKSPACE/Majdoor_Hisaab_PRO_V27_v2.10_FINAL_RELEASE_SHA256.txt"

          ls -lh \
            "$GITHUB_WORKSPACE/Majdoor_Hisaab_PRO_V27_v2.10_FINAL_RELEASE.apk"

      - name: Upload FINAL Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor_Hisaab_PRO_V27_v2.10_FINAL_RELEASE_APK
          path: |
            Majdoor_Hisaab_PRO_V27_v2.10_FINAL_RELEASE.apk
            Majdoor_Hisaab_PRO_V27_v2.10_FINAL_RELEASE_SHA256.txt
          if-no-files-found: error
          retention-days: 30
