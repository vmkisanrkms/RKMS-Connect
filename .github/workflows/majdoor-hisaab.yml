          echo "INTENT_TYPE_FIX=PASS"


          if grep -Fq \
            'when(exportType){' \
            "$FILE"; then

            echo "ERROR: invalid when(exportType) remains"
            exit 1

          fi

          grep -Fq \
            'exportType.startsWith("report:")' \
