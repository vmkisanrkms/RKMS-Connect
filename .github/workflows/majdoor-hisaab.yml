name: Majdoor Hisaab PRO V82 - Final Signed Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-v82-release
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"

  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

  ZIP_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-KOTLIN-FIXED.zip"

  APK_UNSIGNED_NAME: "Majdoor-Hisaab-PRO-V82-unsigned.apk"
  APK_SIGNED_NAME: "Majdoor-Hisaab-PRO-V82-FINAL-SIGNED.apk"


jobs:

  build-release:

    name: Build Signed Release APK

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. INSTALL REQUIRED ANDROID SDK COMPONENTS
      # ============================================================

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK installed successfully."

          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-36|build-tools;36.0.0" || true


      # ============================================================
      # 5. GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"


      # ============================================================
      # 6. VERIFY V82 ZIP
      # ============================================================

      - name: Verify V82 ZIP
        shell: bash
        run: |
          set -e

          echo "Looking for:"
          echo "$ZIP_NAME"

          if [ ! -f "$ZIP_NAME" ]; then
            echo ""
            echo "ERROR: V82 ZIP not found."
            echo ""
            echo "Files available in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo ""
          echo "V82 ZIP found:"
          ls -lh "$ZIP_NAME"

          echo ""
          echo "ZIP contents:"
          unzip -l "$ZIP_NAME" | head -100


      # ============================================================
      # 7. EXTRACT V82 PROJECT
      # ============================================================

      - name: Extract V82 Project
        shell: bash
        run: |
          set -e

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_NAME" -d build_source

          echo "V82 ZIP extracted."

          echo ""
          echo "Searching Gradle project..."

          SETTINGS_FILE=$(find build_source \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            find build_source -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -250


      # ============================================================
      # 8. VERIFY ANDROID PROJECT
      # ============================================================

      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle build file not found."
            exit 1
          fi

          echo ""
          echo "Android app module verified."


      # ============================================================
      # 9. VERIFY PACKAGE NAME / SOURCE
      # ============================================================

      - name: Verify Package and Source
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking package:"
          grep -R \
            "com.majdoor.hisaab" \
            app/src/main \
            --include="*.kt" \
            --include="*.java" \
            --include="*.xml" \
            | head -30 || true

          echo ""
          echo "Checking MainActivityScreens.kt:"
          find app/src/main -name "MainActivityScreens.kt" -print

          SRC=$(find app/src/main \
            -name "MainActivityScreens.kt" \
            -print -quit || true)

          if [ -z "$SRC" ]; then
            echo "WARNING: MainActivityScreens.kt not found."
          else
            echo "Source found:"
            echo "$SRC"
          fi


      # ============================================================
      # 10. IMPORTANT SOURCE AUDIT
      #     NO SOURCE PATCHING HERE
      # ============================================================

      - name: Audit V82 Kotlin Source
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Running targeted Kotlin source audit..."

          echo ""
          echo "Checking for old fillViewport assignment:"
          if grep -R -n \
            "fillViewport[[:space:]]*=" \
            app/src/main \
            --include="*.kt" \
            --include="*.java"; then

            echo ""
            echo "ERROR: Old fillViewport assignment found."
            echo "Expected setFillViewport(true)."
            exit 1
          fi

          echo ""
          echo "Checking for invalid btn lambda parameter pattern:"
          if grep -R -n \
            "btn(.*){[[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*->" \
            app/src/main \
            --include="*.kt"; then

            echo ""
            echo "ERROR: Invalid btn lambda parameter detected."
            echo "btn() must use a zero-argument action."
            exit 1
          fi

          echo ""
          echo "Checking for lateinit Button workaround:"
          if grep -R -n \
            "lateinit[[:space:]]\+var[[:space:]].*:[[:space:]]*Button" \
            app/src/main \
            --include="*.kt"; then

            echo ""
            echo "ERROR: Invalid lateinit Button workaround detected."
            exit 1
          fi

          echo ""
          echo "Kotlin source audit passed."


      # ============================================================
      # 11. SHOW GRADLE VERSION
      # ============================================================

      - name: Gradle Environment
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"


      # ============================================================
      # 12. CLEAN BUILD
      # ============================================================

      - name: Clean Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            clean


      # ============================================================
      # 13. COMPILE RELEASE KOTLIN
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --rerun-tasks \
            :app:compileReleaseKotlin

          echo ""
          echo "=============================================="
          echo "COMPILE RELEASE KOTLIN PASSED"
          echo "=============================================="


      # ============================================================
      # 14. ASSEMBLE RELEASE APK
      # ============================================================

      - name: Assemble Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ASSEMBLE RELEASE APK"
          echo "=============================================="

          gradle \
            --no-daemon \
            --stacktrace \
            --rerun-tasks \
            :app:assembleRelease

          echo ""
          echo "Release APK generated."


      # ============================================================
      # 15. LOCATE APK
      # ============================================================

      - name: Locate Release APK
        shell: bash
        run: |
          set -e

          echo "Searching for release APK..."

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*release*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "Release APK:"
          ls -lh "$APK"


      # ============================================================
      # 16. VERIFY APK PACKAGE
      # ============================================================

      - name: Verify APK Package
        shell: bash
        run: |
          set -e

          APK="$APK_PATH"

          echo "APK:"
          ls -lh "$APK"

          echo ""
          echo "APK package information:"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" \
            | grep -E \
              "package:|versionCode|versionName" \
            | head -10

          echo ""
          echo "Expected package:"
          echo "$PACKAGE_NAME"


      # ============================================================
      # 17. PREPARE KEYSTORE
      # ============================================================

      - name: Restore Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          if [ ! -s release-keystore.jks ]; then
            echo "ERROR: Keystore restore failed."
            exit 1
          fi

          echo "Release keystore restored."


      # ============================================================
      # 18. SIGN APK
      # ============================================================

      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          APK="$APK_PATH"

          UNSIGNED="$RUNNER_TEMP/$APK_UNSIGNED_NAME"
          SIGNED="$RUNNER_TEMP/$APK_SIGNED_NAME"

          cp "$APK" "$UNSIGNED"

          echo "Signing APK..."

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks release-keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" \
            "$UNSIGNED"

          if [ ! -f "$SIGNED" ]; then
            echo "ERROR: Signed APK was not created."
            exit 1
          fi

          cp "$SIGNED" "$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          echo "SIGNED_APK=$GITHUB_WORKSPACE/$APK_SIGNED_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "Signed APK created:"
          ls -lh "$SIGNED"


      # ============================================================
      # 19. ZIPALIGN
      # ============================================================

      - name: Zipalign Signed APK
        shell: bash
        run: |
          set -e

          SIGNED="$SIGNED_APK"
          ALIGNED="$RUNNER_TEMP/Majdoor-Hisaab-PRO-V82-FINAL-ALIGNED.apk"

          echo "Running zipalign..."

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            -f \
            -p \
            4 \
            "$SIGNED" \
            "$ALIGNED"

          if [ ! -f "$ALIGNED" ]; then
            echo "ERROR: Zipaligned APK not created."
            exit 1
          fi

          cp "$ALIGNED" "$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          echo ""
          echo "Zipaligned APK:"
          ls -lh "$GITHUB_WORKSPACE/$APK_SIGNED_NAME"


      # ============================================================
      # 20. VERIFY SIGNATURE
      # ============================================================

      - name: Verify APK Signature
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          echo "Verifying APK signature..."

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            "$APK"

          echo ""
          echo "APK SIGNATURE VERIFIED."


      # ============================================================
      # 21. FINAL APK CHECK
      # ============================================================

      - name: Final APK Validation
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/$APK_SIGNED_NAME"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final APK missing."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK size unexpectedly small."
            exit 1
          fi

          echo "Final APK:"
          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

          echo ""
          echo "Final APK validation PASSED."


      # ============================================================
      # 22. UPLOAD FINAL APK
      # ============================================================

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-FINAL-SIGNED-APK
          path: ${{ env.APK_SIGNED_NAME }}
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 23. UPLOAD BUILD REPORT
      # ============================================================

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Majdoor-Hisaab-PRO-V82-Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/**
          if-no-files-found: warn
          retention-days: 14
