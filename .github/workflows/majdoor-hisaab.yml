name: MAJDOOR HISAAB PRO — FINAL RELEASE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: majdoor-hisaab-pro-release
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  PACKAGE_NAME: "com.majdoor.hisaab"
  VERSION_NAME: "1.77.0"
  VERSION_CODE: "77"

jobs:

  build-test-sign-runtime:
    name: FINAL BUILD / TEST / SIGN / RUNTIME
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # =========================================================
      # SOURCE
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify clean GitHub runner
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "${GITHUB_RUN_ID}"

          echo "GitHub runner verified."
          echo "Runner: ${RUNNER_OS}"
          echo "Workspace: ${GITHUB_WORKSPACE}"

      # =========================================================
      # JAVA
      # =========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # GRADLE
      # =========================================================

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-disabled: true
          validate-wrappers: false

      - name: Verify project structure
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          test -f gradlew
          test -f gradlew.bat

          test -f gradle/wrapper/gradle-wrapper.properties
          test -s gradle/wrapper/gradle-wrapper.jar

          echo "PROJECT_ROOT=PASS"
          echo "GRADLE_WRAPPER_JAR=PASS"

      # IMPORTANT:
      # acceptance-gates.sh requires gradlew executable.
      # Therefore chmod MUST happen before acceptance-gates.sh.

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x ./gradlew

          test -x ./gradlew

          ./gradlew --version

          ./gradlew --version | grep -F "Gradle ${GRADLE_VERSION}"

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          sdkmanager --list_installed

      # =========================================================
      # STATIC / ACCEPTANCE AUDIT
      # =========================================================

      - name: Run acceptance gates
        shell: bash
        run: |
          set -Eeuo pipefail

          test -x ./gradlew

          bash scripts/acceptance-gates.sh

      - name: Dependency health
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x scripts/*.sh

          ./scripts/dependency-health.sh

      - name: Gradle Kotlin compatibility
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/gradle-kotlin-compatibility.sh

      - name: Gradle AGP compatibility
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/gradle-agp-compatibility.sh

      - name: Architecture gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase15-architecture-gate.sh

      - name: Security data gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase20-security-data-gate.sh

      - name: Configuration lifecycle gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase18-configuration-lifecycle-gate.sh

      - name: Offline first gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase19-offline-first-gate.sh

      - name: UI UX gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase21-ui-ux-gate.sh

      # =========================================================
      # CLEAN DEPENDENCY RESOLUTION
      # =========================================================

      - name: Fresh dependency resolution
        shell: bash
        run: |
          set -Eeuo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            dependencies \
            --configuration debugRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            dependencies \
            --configuration testRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            dependencies \
            --configuration e2eReleaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            dependencies \
            --configuration releaseRuntimeClasspath

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies \
            buildEnvironment

      # =========================================================
      # UNIT + COMPILE + APK BUILD
      # =========================================================

      - name: Build and test project
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -q "versionCode = ${VERSION_CODE}" app/build.gradle.kts
          grep -q "versionName = \"${VERSION_NAME}\"" app/build.gradle.kts

          ./gradlew \
            --no-daemon \
            --stacktrace \
            test \
            compileDebugKotlin \
            compileDebugJavaWithJavac \
            assembleDebug \
            compileE2eReleaseKotlin \
            assembleE2eRelease \
            compileReleaseKotlin \
            assembleRelease \
            assembleReleaseAndroidTest

      # =========================================================
      # DEBUG APK
      # =========================================================

      - name: Verify Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          apkanalyzer manifest application-id "$APK" \
            | grep -Fx "$PACKAGE_NAME"

          apkanalyzer manifest version-name "$APK" \
            | grep -Fx "$VERSION_NAME"

          apkanalyzer manifest version-code "$APK" \
            | grep -Fx "$VERSION_CODE"

          mkdir -p artifacts/debug

          cp "$APK" \
            artifacts/debug/Majdoor-Hisaab-PRO-debug.apk

          sha256sum "$APK" \
            | tee artifacts/debug/Majdoor-Hisaab-PRO-debug.sha256

      # =========================================================
      # RELEASE BUILD GATE
      # =========================================================

      - name: Release build gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/release-build-gate.sh

      # =========================================================
      # RELEASE SIGNING
      # =========================================================

      - name: Restore production keystore
        env:
          KEYSTORE_B64: ${{ secrets.MH_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$EXPECTED_CERT"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode > release.keystore

          test -s release.keystore

          keytool \
            -list \
            -v \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > certificate.txt

          ACTUAL_CERT="$(
            awk -F': ' \
              '/SHA256:/{print $2; exit}' \
              certificate.txt \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED_CERT="$(
            printf '%s' "$EXPECTED_CERT" \
              | tr -d ' ' \
              | tr '[:lower:]' '[:upper:]'
          )"

          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"

          echo "PRODUCTION_CERTIFICATE=PASS"

      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}

        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p artifacts

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app-release-aligned.apk"
          SIGNED="artifacts/Majdoor-Hisaab-PRO-release.apk"

          test -s "$UNSIGNED"

          zipalign \
            -f \
            -p \
            4 \
            "$UNSIGNED" \
            "$ALIGNED"

          zipalign -c -v 4 "$ALIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          test -s "$SIGNED"

          apksigner verify \
            --verbose \
            --print-certs \
            "$SIGNED" \
            | tee artifacts/release-signature-final.txt

          unzip -t "$SIGNED" >/dev/null

          zipalign -c -v 4 "$SIGNED"

          sha256sum "$SIGNED" \
            | tee artifacts/Majdoor-Hisaab-PRO-release.sha256

          rm -f "$ALIGNED"
          rm -f release.keystore
          rm -f certificate.txt

          echo "SIGNED_RELEASE_APK=PASS"

      # =========================================================
      # SIGNING GATE
      # =========================================================

      - name: Production signing gate
        env:
          MH_RELEASE_CERT_SHA256: ${{ secrets.MH_RELEASE_CERT_SHA256 }}

        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/production-signing-gate.sh \
            artifacts/Majdoor-Hisaab-PRO-release.apk

      # =========================================================
      # RELEASE ANDROID TEST APK
      # =========================================================

      - name: Sign Release AndroidTest APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MH_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MH_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MH_RELEASE_KEY_PASSWORD }}

        shell: bash
        run: |
          set -Eeuo pipefail

          TEST_UNSIGNED="app/build/outputs/apk/androidTest/release/app-release-androidTest.apk"
          TEST_SIGNED="artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

          test -s "$TEST_UNSIGNED"

          apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$TEST_SIGNED" \
            "$TEST_UNSIGNED"

          test -s "$TEST_SIGNED"

          apksigner verify \
            --verbose \
            "$TEST_SIGNED"

      # =========================================================
      # API 36 DEBUG RUNTIME
      # =========================================================

      - name: Debug APK API 36 smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            adb install -r \
              "${GITHUB_WORKSPACE}/app/build/outputs/apk/debug/app-debug.apk"

            adb shell am force-stop "$PACKAGE_NAME"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity"

            sleep 2

            adb shell pidof "$PACKAGE_NAME" \
              | grep -Eq '[0-9]+'

            adb logcat -d -t 10000 \
              > artifacts/debug/debug-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/debug/debug-logcat.txt
            then
              exit 1
            fi

      # =========================================================
      # FULL E2E API 36
      # =========================================================

      - name: Android API 36 E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest

      # =========================================================
      # PHASE 22
      # =========================================================

      - name: Phase 22 final red-list gate
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/phase22-final-red-list-gate.sh

      - name: Phase 22 Android E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            ./gradlew \
              --no-daemon \
              --stacktrace \
              connectedE2eReleaseAndroidTest \
              --tests com.majdoor.hisaab.Phase22FinalRedListE2ETest

      # =========================================================
      # SIGNED RELEASE REAL DEVICE TEST
      # =========================================================

      - name: Signed Release APK runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            mkdir -p artifacts/release-e2e/markers

            ./scripts/release-e2e.sh \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release.apk"

            # Offline test
            adb shell svc wifi disable
            adb shell svc data disable

            adb shell am force-stop "$PACKAGE_NAME"

            adb shell am start -W \
              -n "${PACKAGE_NAME}/com.majdoor.hisaab.MainActivity"

            sleep 2

            adb shell pidof "$PACKAGE_NAME" \
              | grep -Eq '[0-9]+'

            adb logcat -d -t 10000 \
              > artifacts/release-e2e/offline-logcat.txt

            if grep -E \
              'FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: com\.majdoor\.hisaab.*FATAL' \
              artifacts/release-e2e/offline-logcat.txt
            then
              exit 1
            fi

            touch \
              artifacts/release-e2e/markers/550_offline_runtime.pass

      # =========================================================
      # REBOOT / PERSISTENCE
      # =========================================================

      - name: Signed Release reboot persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true

          script: |
            set -Eeuo pipefail

            adb wait-for-device

            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do
              sleep 2
            done

            ./scripts/signed-release-reboot-gate.sh \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release.apk" \
              "${GITHUB_WORKSPACE}/artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk"

      # =========================================================
      # FINAL 541-566 GATE
      # =========================================================

      - name: FINAL RELEASE GATE 541-566
        shell: bash
        run: |
          set -Eeuo pipefail

          ./scripts/final-release-gate.sh

      # =========================================================
      # FINAL ARTIFACT VERIFICATION
      # =========================================================

      - name: Verify final downloadable artifacts
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s artifacts/Majdoor-Hisaab-PRO-release.apk
          test -s artifacts/Majdoor-Hisaab-PRO-release.sha256
          test -s artifacts/Majdoor-Hisaab-PRO-release-androidTest.apk

          apksigner verify \
            --verbose \
            artifacts/Majdoor-Hisaab-PRO-release.apk

          sha256sum -c \
            artifacts/Majdoor-Hisaab-PRO-release.sha256

          echo "=========================================="
          echo "MAJDOOR HISAAB PRO FINAL RELEASE = PASS"
          echo "=========================================="

      # =========================================================
      # UPLOAD
      # =========================================================

      - name: Upload final artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: majdoor-hisaab-pro-final-release
          path: artifacts/
          if-no-files-found: error
